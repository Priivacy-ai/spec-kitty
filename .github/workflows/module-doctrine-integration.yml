# =============================================================================
# module-doctrine-integration: reusable workflow for the doctrine package
# integration suite (mission #3447). Lifts ci-quality's
# `integration-tests-doctrine` job into an `on: workflow_call` workflow invoked
# as a `uses:` caller (decision D1(a)). Kept separate from the fast leg because
# the two are independently `needs:`-referenced downstream (DD-02).
# coverage-integration-doctrine.xml / integration-test-doctrine-reports names
# are preserved verbatim (C-004).
# =============================================================================
name: module-doctrine-integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-tests-doctrine:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: "[ENFORCED] Check out repository"
        uses: actions/checkout@v6

      - name: "[ENFORCED] Set up uv"
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'

      - name: "[ENFORCED] Install dependencies"
        run: uv sync --frozen --all-extras

      - name: "[ENFORCED] Prepare report directories"
        run: |
          mkdir -p out/reports/xunit-reports
          mkdir -p out/reports/coverage

      - name: "[ENFORCED] Run doctrine integration tests with coverage"
        run: |
          uv run python -m pytest \
            -v \
            tests/doctrine/ \
            -m "integration and not windows_ci" \
            -n auto --dist loadfile -p no:cacheprovider \
            --cov=charter.offering --cov=charter \
            --cov-report=xml:out/reports/coverage/coverage-integration-doctrine.xml \
            --junitxml=out/reports/xunit-reports/xunit-result-integration-doctrine-${{ github.run_id }}.xml

      - name: "[ENFORCED] Upload integration-doctrine artifacts"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-doctrine-reports
          path: out/reports/
