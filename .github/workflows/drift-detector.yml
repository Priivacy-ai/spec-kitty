# .github/workflows/drift-detector.yml
#
# Identity-Boundary CI Gate — spec-kitty repo
#
# Tracker: https://github.com/Priivacy-ai/spec-kitty/issues/1247
# Closes the drift-class hole that took rc14 -> rc22 to peel: a PR that
# changes the canonical registry without updating consumer recognition
# code must fail fast at PR time, not at the next on-demand canary run.
#
# The single job named `drift-detector` is the contract this workflow
# offers to branch protection. Do not rename without coordinating with
# the admin who registered the required check.
#
# SHA-bump procedure: see README.md > "Identity-Boundary CI Gate" for
# how to coordinate canonical-registry contract changes with downstream
# consumers.

name: drift-detector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: drift-detector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-detector:
    name: drift-detector
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # Always-green shim (pr:skip-ci / pr:deferred): `drift-detector` is the
      # REQUIRED status check this workflow offers to branch protection (see
      # header). A job-level `if:` skip would leave that required context
      # UNSATISFIED and block merge, so instead the job always runs and
      # short-circuits its work when a skip label is present — the context
      # reports success either way. On push events no PR labels exist, so
      # `skip` is always false and the detector runs normally.
      - name: Resolve skip label
        id: guard
        run: |
          echo "skip=${{ contains(github.event.pull_request.labels.*.name, 'pr:deferred') || contains(github.event.pull_request.labels.*.name, 'pr:skip-ci') }}" >> "$GITHUB_OUTPUT"

      - name: Short-circuit (pr:skip-ci / pr:deferred present)
        if: steps.guard.outputs.skip == 'true'
        run: echo "pr:skip-ci/pr:deferred present — drift-detector short-circuited to green (required-check parity)."

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Install uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --frozen --extra test

      - name: Run canonical-registry drift detector
        if: steps.guard.outputs.skip != 'true'
        run: uv run pytest tests/sync/test_diagnose.py::TestCanonicalRegistryRecognition -v
