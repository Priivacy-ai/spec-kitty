# =============================================================================
# module-doctrine-fast: reusable workflow for the doctrine package fast suite
# (mission #3447). Lifts ci-quality's `fast-tests-doctrine` job into an
# `on: workflow_call` workflow invoked as a `uses:` caller (decision D1(a)).
# Kept separate from the integration leg because the two are independently
# `needs:`-referenced downstream (DD-02). coverage-fast-doctrine.xml /
# fast-test-doctrine-reports names are preserved verbatim (C-004).
# =============================================================================
name: module-doctrine-fast

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast-tests-doctrine:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: "[ENFORCED] Check out repository"
        uses: actions/checkout@v6

      - name: "[ENFORCED] Set up uv"
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'

      - name: "[ENFORCED] Install dependencies"
        run: uv sync --frozen --all-extras

      - name: "[ENFORCED] Prepare report directories"
        run: |
          mkdir -p out/reports/xunit-reports
          mkdir -p out/reports/coverage

      - name: "[ENFORCED] Run fast doctrine tests with coverage"
        run: |
          uv run python -m pytest \
            -v \
            tests/doctrine/ \
            -m "fast and not windows_ci" \
            --timeout=240 --timeout-method=signal \
            -n auto --dist loadfile \
            --durations=50 \
            --cov=charter.offering --cov=charter \
            --cov-report=term-missing \
            --cov-report=xml:out/reports/coverage/coverage-fast-doctrine.xml \
            --junitxml=out/reports/xunit-reports/xunit-result-fast-doctrine-${{ github.run_id }}.xml

      - name: "[ENFORCED] Upload fast-doctrine artifacts"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-doctrine-reports
          path: out/reports/
