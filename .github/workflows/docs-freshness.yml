name: docs-freshness

on:
  # --- PR trigger scoping (NFR-007) --------------------------------------
  # INVARIANT: this list must cover every path the gate steps below *read*,
  # not merely `docs/**`. A filter narrower than the true input set silently
  # stops guarding real changes — the same failure shape this gate exists to
  # catch. Adding a step (or a sub-check) that reads a new path REQUIRES
  # extending this list. Non-obvious entries: `src/specify_cli/**` because
  # check_docs_freshness.py's CLI-reference sub-check imports the live Typer
  # app and walks it (`REF-MISSING`/`REF-EXTRA` are error-severity, so a new
  # command without a docs entry reds this job); `pyproject.toml`/`uv.lock`
  # because `uv sync` builds the environment that walk imports; and this file
  # itself, so a change to the filter re-triggers the workflow.
  # RESIDUAL GAP: the relative-link and related-edge gates assert that
  # cross-tree link targets exist, so deleting a file anywhere (`tests/**`,
  # `kitty-specs/**`, …) that a docs page links to can red the gate. That
  # input set is unbounded and cannot be expressed as a path filter; the
  # unfiltered `push: main` run below is its backstop.
  # SAFE ONLY WHILE `docs-freshness` IS NOT A REQUIRED STATUS CHECK — a
  # required check that a path filter skips leaves every non-docs PR pending
  # forever. Verified against live branch protection: required contexts are
  # ["drift-detector"]. If docs-freshness is ever added there, this filter
  # becomes a PR-blocking hazard and must be removed.
  # `push: main` stays UNFILTERED on purpose: these gates are whole-tree
  # scans, so a full run on every push to main is how a red tree gets
  # detected at all.
  # Invariant contract (FR-006, mirrors the "Required-check contract" idiom in
  # .github/workflows/ui-e2e.yml): the structural shape asserted above — the PR
  # `paths:` allowlist excluding `tests/**` / `kitty-specs/**`, and the
  # unfiltered `push: main` backstop — is pinned by
  # tests/docs/test_docs_freshness_invariant.py so this comment and the trigger
  # block co-evolve. That test parses THIS file statically; it does NOT and
  # cannot observe the live GitHub required-status-check setting (the
  # "not required" fact above is operator-confirmed, unobservable in CI).
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - 'packs/built-in/assets/docs_structural_lint.py'
      - 'packs/built-in/styleguides/common-docs.styleguide.yaml'
      - 'src/specify_cli/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-freshness.yml'
  push:
    branches: [main]

jobs:
  docs-freshness:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'pr:deferred') && !contains(github.event.pull_request.labels.*.name, 'pr:skip-ci') }}
    # PYTHONPATH is hoisted job-level (B0): every gate step here runs
    # `uv run python scripts/docs/...`, and those scripts import the repo as a
    # top-level package. A job-level env applies to every step, so the single
    # declaration below replaces the per-step `PYTHONPATH: .` the four gate
    # steps used to carry. Step-scoped envs that are NOT universal
    # (SPEC_KITTY_ENABLE_SAAS_SYNC / SPEC_KITTY_NO_UPGRADE_CHECK on the freshness
    # step) intentionally stay per-step. Behaviour-preserving.
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
        with:
          # Diff-scope mode (#3147) resolves the PR's changed files against
          # `github.event.pull_request.base.sha`, which requires the base
          # commit's history to be present locally — a shallow (default) clone
          # doesn't have it. fetch-depth: 0 gets the full history on every
          # trigger (push:main included; the extra cost is worth the shared
          # checkout step over branching the checkout itself).
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.11
      - name: Install project
        run: uv sync
      # Diff-scope flag (#3147, B-WP02): on `pull_request`, scope the two
      # blocking dead-link/related-edge gates below to the PR's own changed
      # docs/**/*.md files via `--changed-from <base-sha>`, so a docs PR is no
      # longer failed for pre-existing broken links it never touched. On
      # `push` (the unfiltered push:main backstop, FR-005/M3) the flag is
      # empty — those steps run whole-tree exactly as before, `min_files=1`
      # floor intact. Fail-closed keys on git base RESOLVABILITY (B-WP02): a
      # resolved diff that touches zero docs files (common — this workflow
      # also triggers on non-`.md` paths like `src/specify_cli/**`) exits 0,
      # never errors; only an unresolvable/unfetched base does.
      - name: Compute diff-scope flag (PR only)
        id: diffscope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "flag=--changed-from ${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      # --- Blocking docs rulers (Mission B / WP14, FR-011) -------------------
      # Each runs --strict so a re-introduced violation reds CI. (The R1
      # anti-sprawl structure ratchet was retired per #2851 follow-up: the
      # single-root/13-section policy of DIRECTIVE_042 is now maintained by
      # periodic bulk curation rather than a per-PR blocking gate.)
      - name: Related-edge validator (R2, --strict)
        run: uv run python scripts/docs/related_validator.py --strict --repo-root . ${{ steps.diffscope.outputs.flag }}
      # Audience resolver (NFR-002, FR-018): every audience: reference on a page
      # must resolve to a persona under docs/context/audience/. --strict reds CI
      # on any dangling reference (mirror of the related-edge resolver).
      - name: Audience resolver (NFR-002, --strict)
        run: uv run python scripts/docs/audience_resolver.py --strict --repo-root .
      - name: Description-length gate (NFR-003, --strict)
        run: uv run python scripts/docs/description_length_check.py --strict --repo-root .
      - name: Relative body-link gate (WP18, --check)
        run: uv run python scripts/docs/relative_link_fixer.py --check --repo-root . ${{ steps.diffscope.outputs.flag }}
      # Structural docs lint (FR-008): index completeness, point-in-time
      # placement, shadow-tree basenames, frontmatter contract. Now shipped as
      # the `common-docs-structural-lint` doctrine asset (its single canonical
      # copy). Policy is loaded from the common-docs styleguide's
      # structural_lint_config: block (FR-011), passed explicitly via
      # --styleguide. Exits non-zero on any violation. Deferred here by WP02
      # until the docs-structural-sanity move/fold landed post-move-clean
      # (WP03/WP04/WP05).
      - name: Structural docs lint (FR-008)
        run: >-
          uv run python packs/built-in/assets/docs_structural_lint.py
          --styleguide packs/built-in/styleguides/common-docs.styleguide.yaml
      - name: Check CHANGELOG sync (canonical → root)
        run: uv run python scripts/docs/sync_changelog.py --check
      - name: Check CONTRIBUTING sync (canonical → root)
        run: uv run python scripts/docs/sync_contributing.py --check
      # Slash-command reference freshness (FR-001): assert every command the
      # command-skills manifest ships has a row in docs/api/slash-commands.md,
      # and no stale row survives. Non-zero exit reds the job — the same
      # doc-drift shape the sibling sync checks above guard for prose docs.
      # Relies on the job-level PYTHONPATH (B0). Ordered after WP02 backfilled
      # the doc to the full command set, so it stays green on a fresh tree.
      - name: Check slash-command reference freshness (FR-001)
        run: uv run python scripts/docs/check_slash_command_freshness.py
      # CLI-reference freshness (NFR-009): behavior-doc pages regenerated from the
      # live Typer surface must not silently drift. Complements the freshness
      # sub-check; run explicitly so a new/renamed command without a docs entry is
      # surfaced against docs/api/cli-commands.md.
      - name: Check CLI reference freshness (NFR-009)
        env:
          SPEC_KITTY_ENABLE_SAAS_SYNC: "1"
        run: uv run python scripts/docs/check_cli_reference_freshness.py --ci --saas-sync-was-set
      # --- Advisory mission gates (IC-03a; WP13 flips them blocking) ----------
      # Touched-set presence/placement + rename/redirect reconciliation. These
      # are diffed against the PR base (baseline-diff classification, #3147) so
      # the denominator is only mission-introduced changes, never the whole tree
      # (C-012). continue-on-error keeps them advisory at this stage.
      - name: Touched-set docs gates (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >-
          uv run python scripts/docs/touched_set_gates.py
          --base ${{ github.event.pull_request.base.sha }} --repo-root .
      - name: Rename/redirect reconciliation (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >-
          uv run python scripts/docs/rename_reconcile.py
          --base ${{ github.event.pull_request.base.sha }} --repo-root .
      - name: Docs freshness (R3 lockfile drift default-on + sub-checks)
        env:
          SPEC_KITTY_ENABLE_SAAS_SYNC: "1"
          SPEC_KITTY_NO_UPGRADE_CHECK: "1"
        run: uv run python scripts/docs/check_docs_freshness.py --ci --report freshness.json --link-check none
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-freshness-report
          path: freshness.json
