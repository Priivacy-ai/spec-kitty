# .github/workflows/ci-flake-report.yml
#
# CI Flake Report — weekly + on-demand census of the target workflow's
# false-red rate and per-test timing cost (mission ci-flake-report-workflow,
# WP03, FR-006/007/014, NFR-002, C-001/002/004/006).
#
# Findings-only, non-gating (C-001/C-002): this workflow never commits to the
# repo, never edits docs, and is NOT a required status check — it must never
# be added to branch protection. It runs `scripts/ci/flake_report_cli.py`
# (WP01 pure core + WP02 IO shell/CLI) against the FR-014-configurable
# `--workflow` target (default `ci-quality.yml`) and uploads the four
# findings artifacts (metrics.json/durations.json/report.md/state.json).
#
# Delta lineage (FR-007/C-006, T011): the incremental cursor lives in
# state.json from the PRIOR run of *this* workflow. That prior artifact is
# retrieved by a STABLE artifact name (`ci-flake-report-findings`) that is
# independent of this workflow's display name/filename, via
# actions/github-script (list this workflow's completed runs, pick the most
# recent success) + actions/download-artifact@v8 keyed on that run id — the
# same cross-run "prev_run" idiom ci-quality.yml already uses for its Sonar
# coverage fallback (see that file's "Find most recent previous successful
# run" step). If no prior successful run exists, or its state.json is
# missing/unparsable, the download step below degrades cleanly (`|| true`)
# and the CLI's own `load_state()` (WP02) falls back to a 30-day window,
# labelling lineage `first_run`/`lost_baseline` — no separate schema
# validation needed at the workflow layer.
#
# Auth (C-004): the CLI shells out to `gh` directly (list runs, view logs),
# so GH_TOKEN is exported job-wide from the workflow token. `actions: read`
# covers both the CLI's own `gh run list`/`gh run view` calls and this
# workflow's own cross-run artifact lookup/download.

name: ci-flake-report

on:
  schedule:
    # Weekly, Sunday 05:45 UTC. Chosen to not collide with the repo's other
    # active crons (grepped from .github/workflows/*.yml at authoring time):
    # ci-quality.yml '17 2 * * *' (daily), release-readiness.yml '0 2 * * *'
    # (daily), check-spec-kitty-events-alignment.yml '11 2 * * *' (daily),
    # all-contributors-sync.yml '23 3 * * 1' (weekly, Monday 03:23). This
    # slot differs in both day-of-week and hour from every one of them.
    - cron: '45 5 * * 0'
  workflow_dispatch:
    inputs:
      workflow:
        description: 'Target workflow file to measure (default: ci-quality.yml)'
        required: false
        default: ''
        type: string
      since:
        description: 'ISO8601 timestamp overriding the window start (default: prior state cursor, or a 30-day lookback)'
        required: false
        default: ''
        type: string

# Non-gating (C-002): no `pull_request` trigger above -- this workflow is
# never on the PR path and must never be registered as a required status
# check in branch protection.

concurrency:
  group: ci-flake-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  flake-report:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync

      # --- Delta lineage (FR-007/T011): find + fetch the prior bundle -------
      - name: Find most recent successful ci-flake-report.yml run
        id: prev_run
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-flake-report.yml',
              status: 'completed',
              per_page: 10,
            });
            const prev = data.workflow_runs.find(
              (r) => r.id !== context.runId && r.conclusion === 'success'
            );
            const runId = prev ? String(prev.id) : '';
            core.setOutput('run_id', runId);
            if (prev) {
              console.log(`Prior flake-report run: ${prev.id} created at ${prev.created_at}`);
            } else {
              console.log('No previous successful run found -- this run will be first_run/lost_baseline.');
            }

      - name: Download prior findings bundle (stable name, degrades cleanly)
        if: steps.prev_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-flake-report-findings
          path: prior-findings
          run-id: ${{ steps.prev_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve CLI inputs
        id: resolved
        run: |
          workflow="${{ inputs.workflow }}"
          echo "workflow=${workflow:-ci-quality.yml}" >> "$GITHUB_OUTPUT"
          if [ -f prior-findings/state.json ]; then
            echo "state_arg=--state prior-findings/state.json" >> "$GITHUB_OUTPUT"
          else
            echo "state_arg=" >> "$GITHUB_OUTPUT"
          fi

      # --- Run the report (FR-002/003/008/014/015) ---------------------------
      - name: Run flake report
        run: |
          since_arg=""
          if [ -n "${{ inputs.since }}" ]; then
            since_arg="--since ${{ inputs.since }}"
          fi
          uv run python scripts/ci/flake_report_cli.py \
            --workflow "${{ steps.resolved.outputs.workflow }}" \
            ${{ steps.resolved.outputs.state_arg }} \
            $since_arg \
            --out flake-report-out

      # --- Upload (FR-006/T012): artifacts only, never a commit, never docs -
      - name: Upload findings bundle (stable name, 90-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: ci-flake-report-findings
          retention-days: 90
          path: |
            flake-report-out/metrics.json
            flake-report-out/durations.json
            flake-report-out/report.md
            flake-report-out/state.json
