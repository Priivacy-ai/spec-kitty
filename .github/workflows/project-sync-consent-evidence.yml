# WP11 (per-project-sync-consent-ledgers-01KZKMQZ): coordinated-acceptance
# evidence runs are EXPLICIT — workflow_dispatch only, never on: push. Every
# candidate identity is a pinned dispatch input (exact 40-hex commits, exact
# contract digest); the builder refuses floating refs, dirty checkouts, and
# digest drift, so a run with wrong inputs fails closed instead of minting a
# bundle. The uploaded artifact is the immutable 90-day retention coordinate
# the release/tracker evidence records (FR-034, NFR-004).
name: Project sync consent evidence

on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: "Exact 40-character reviewed core candidate commit"
        required: true
        type: string
      saas_sha:
        description: "Exact 40-character reviewed SaaS candidate commit"
        required: true
        type: string
      contract_sha256:
        description: "Exact SHA-256 of the canonical CLI-SaaS contract at the SaaS candidate"
        required: true
        type: string
      tombstone_sha:
        description: "Exact 40-character reviewed SaaS WP02 tombstone milestone commit"
        required: true
        type: string
      saas_wp02_evidence_uri:
        description: "Persistent https:// URI of the reviewed SaaS WP02 anti-rematerialization evidence"
        required: true
        type: string
      saas_wp02_evidence_sha256:
        description: "SHA-256 of the reviewed SaaS WP02 evidence bundle"
        required: true
        type: string
      saas_wp08_evidence_uri:
        description: "Persistent https:// URI of the approved SaaS WP08 evidence"
        required: true
        type: string
      saas_wp08_evidence_sha256:
        description: "SHA-256 of the approved SaaS WP08 evidence bundle"
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    name: Pinned prerequisite attestation and immutable manifest
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CORE_SHA: ${{ inputs.core_sha }}
      SAAS_SHA: ${{ inputs.saas_sha }}
      CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
      TOMBSTONE_SHA: ${{ inputs.tombstone_sha }}
      SAAS_WP02_EVIDENCE_URI: ${{ inputs.saas_wp02_evidence_uri }}
      SAAS_WP02_EVIDENCE_SHA256: ${{ inputs.saas_wp02_evidence_sha256 }}
      SAAS_WP08_EVIDENCE_URI: ${{ inputs.saas_wp08_evidence_uri }}
      SAAS_WP08_EVIDENCE_SHA256: ${{ inputs.saas_wp08_evidence_sha256 }}
    steps:
      # Both candidates land in clean subdirectory checkouts so the builder's
      # dirty-tree attestation sees exactly the committed candidate state.
      - name: Checkout exact core candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.core_sha }}
          path: core-candidate
          fetch-depth: 0
      - name: Checkout exact SaaS candidate
        uses: actions/checkout@v6
        with:
          repository: Priivacy-ai/spec-kitty-saas
          ref: ${{ inputs.saas_sha }}
          path: saas-wp04-candidate
          fetch-depth: 0
          token: ${{ secrets.SAAS_REPOSITORY_READ_TOKEN || github.token }}
      - name: Record raw attestation inputs
        id: raw
        run: |
          set -euo pipefail
          mkdir -p evidence/raw
          python3 - <<'PY'
          import json, os
          record = {
              name.lower(): os.environ[name]
              for name in (
                  "CORE_SHA", "SAAS_SHA", "CONTRACT_SHA256", "TOMBSTONE_SHA",
                  "SAAS_WP02_EVIDENCE_URI", "SAAS_WP02_EVIDENCE_SHA256",
                  "SAAS_WP08_EVIDENCE_URI", "SAAS_WP08_EVIDENCE_SHA256",
              )
          }
          with open("evidence/raw/attestation-inputs.json", "w", encoding="utf-8") as handle:
              json.dump(record, handle, sort_keys=True, indent=2)
              handle.write("\n")
          PY
          echo "sha256=$(sha256sum evidence/raw/attestation-inputs.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "expires_at=$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build immutable evidence manifest (fail-closed)
        run: |
          set -euo pipefail
          python3 core-candidate/scripts/evidence/build_project_sync_consent_manifest.py \
            --core-checkout core-candidate \
            --expected-core-commit "$CORE_SHA" \
            --saas-checkout saas-wp04-candidate \
            --expected-saas-commit "$SAAS_SHA" \
            --expected-contract-sha256 "$CONTRACT_SHA256" \
            --tombstone-commit "$TOMBSTONE_SHA" \
            --saas-wp02-evidence-uri "$SAAS_WP02_EVIDENCE_URI" \
            --saas-wp02-evidence-sha256 "$SAAS_WP02_EVIDENCE_SHA256" \
            --saas-wp08-evidence-uri "$SAAS_WP08_EVIDENCE_URI" \
            --saas-wp08-evidence-sha256 "$SAAS_WP08_EVIDENCE_SHA256" \
            --artifact-root evidence/raw \
            --artifact "core:prerequisite-attestation-inputs:${{ steps.raw.outputs.sha256 }}:attestation-inputs.json" \
            --command "prerequisite-attestation-capture:0:sha256sum evidence/raw/attestation-inputs.json" \
            --created-at "${{ steps.raw.outputs.created_at }}" \
            --retention-uri "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --retention-expires-at "${{ steps.raw.outputs.expires_at }}" \
            --output-root build/evidence/project-sync-consent
      - name: Upload immutable 90-day evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: project-sync-consent-${{ inputs.core_sha }}-${{ github.run_id }}
          path: |
            build/evidence/project-sync-consent/${{ inputs.core_sha }}/
            evidence/raw/
          if-no-files-found: error
          retention-days: 90
