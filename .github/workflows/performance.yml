# .github/workflows/performance.yml
#
# Statistical performance-test pipeline (ADR 2026-08-22-1). Per-domain,
# off the PR path, non-gating. ALL wall-clock/CPU-budget performance tests
# (``@pytest.mark.performance``, converted to the ``pytest-benchmark``
# ``benchmark`` fixture with a per-domain ``group=``) run HERE ONLY -- never
# on any PR/blocking path. ``tests/conftest.py`` skips ``-m performance``
# unless ``SPEC_KITTY_RUN_PERFORMANCE=1``, so no other workflow ever executes
# these tests for real; this pipeline is the sole place that sets that env
# var.
#
# The retired on-PR ``timing-nfr-serial`` job (a single-shot ``-m timing``
# gate that blocked merge) is NOT replaced by a gating equivalent here --
# ADR 2026-08-22-1's measured false-red rate (~92% on main-branch runs) is
# exactly why the signal moved off the blocking path. This workflow measures
# statistically (pytest-benchmark: calibrated rounds x iterations, warmup
# discard, median/mean/stddev/percentile) and alerts via
# ``--benchmark-compare-fail=median:<pct>`` against a committed per-domain
# baseline under ``tests/performance/baselines/`` -- never a single-shot
# ceiling.
#
# Non-gating (C-002 pattern, mirrors ci-flake-report.yml): no ``pull_request``
# trigger, not a required status check, must never be added to branch
# protection or ``quality-gate.needs`` in ci-quality.yml.
#
# Domain matrix mirrors ci-quality.yml's fast-tests-<domain> /
# integration-tests-<domain> path split (see that workflow's ``changes`` job
# dorny filters for the canonical path->domain ownership). A domain leg with
# no ``performance``-marked tests under its paths today exits pytest code 5
# ("no tests ran") -- guarded by ``|| test $? -eq 5`` so an empty domain is a
# pass, not a failure, as the ~60-test residue migrates in per ADR
# 2026-08-22-1's "migration is per-domain and incremental" section.
#
# No ``--benchmark-only``: that flag SKIPS every test not written against the
# ``benchmark`` fixture, which is exactly the ~60-test marker-only residue
# this pipeline exists to run (per-domain fixture conversion is deliberately
# deferred follow-through, not this pass). Dropping it means both single-shot
# ``@pytest.mark.performance`` asserts and fixture-based benchmarks execute
# here; single-shot tests just run their own assert (no stats, no compare).
#
# The compare step additionally tolerates exit 4 (pytest's USAGE_ERROR).
# Verified against pytest-benchmark 5.2.3 (this repo's pinned version):
# ``--benchmark-compare-fail`` raises ``pytest.UsageError`` (exit 4) -- not a
# regression failure -- when ``--benchmark-compare`` found no prior run to
# compare against for this platform/storage (e.g. a domain whose benchmark
# fixture tests are newly converted and have no committed baseline yet). A
# genuine statistical regression instead raises pytest_benchmark's
# ``PerformanceRegression`` and exits 1, which this guard does NOT swallow --
# only exit 4 (missing baseline) and exit 5 (no tests collected) are treated
# as pass.

name: performance

on:
  schedule:
    # Weekly, Sunday 06:30 UTC. Chosen to not collide with the repo's other
    # active crons (grepped from .github/workflows/*.yml at authoring time):
    # ci-quality.yml '17 2 * * *' (daily), release-readiness.yml '0 2 * * *'
    # (daily), check-spec-kitty-events-alignment.yml '11 2 * * *' (daily),
    # all-contributors-sync.yml '23 3 * * 1' (weekly, Monday 03:23),
    # ci-flake-report.yml '45 5 * * 0' (weekly, Sunday 05:45). This slot
    # shares ci-flake-report's day but not its hour, and differs from every
    # daily slot above.
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: >-
          Save a fresh per-domain baseline (--benchmark-save) and upload it
          as a downloadable artifact for a human to review and commit --
          this workflow never commits baselines itself.
        required: false
        default: false
        type: boolean

# Non-gating (C-002): no `pull_request` trigger above -- this workflow is
# never on the PR path and must never be registered as a required status
# check in branch protection, nor added to ci-quality.yml's
# `quality-gate.needs`.

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # performance: one matrix leg per ci-quality.yml domain. Every leg is
  # independent (fail-fast: false) so one domain's regression or missing
  # baseline never hides another's result.
  # ---------------------------------------------------------------------------
  performance:
    name: "performance (${{ matrix.domain }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: doctrine
            paths: tests/doctrine
          - domain: charter
            paths: tests/charter
          - domain: sync
            paths: tests/sync
          - domain: cli
            paths: tests/cli tests/specify_cli/cli
          - domain: core
            paths: tests/architectural tests/core
          - domain: lanes
            paths: tests/lanes tests/specify_cli/lanes
          - domain: merge
            paths: tests/merge
          - domain: missions
            paths: tests/missions tests/specify_cli/missions
          - domain: next
            paths: tests/next tests/runtime tests/specify_cli/next
          - domain: review
            paths: tests/review
          - domain: status
            paths: tests/status tests/specify_cli/status
          - domain: upgrade
            paths: tests/upgrade
          - domain: git
            paths: tests/git tests/git_ops
          - domain: dashboard
            paths: tests/test_dashboard
          - domain: release
            paths: tests/release
          - domain: post-merge
            paths: tests/post_merge
          - domain: agent
            paths: tests/agent
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v6

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.1.0

      - name: "Set up Python"
        # Pinned to 3.11 to match the committed baseline directory's
        # machine-info tag (tests/performance/baselines/Linux-CPython-3.11-64bit/) --
        # pytest-benchmark groups stored runs by interpreter/platform, so a
        # different Python here would silently stop matching the baseline.
        run: uv python install 3.11

      - name: "Install dependencies (test extra: pytest-benchmark)"
        run: uv sync --frozen --extra test

      - name: "Prepare report directory"
        run: mkdir -p out/reports/benchmark

      - name: "Run ${{ matrix.domain }} performance benchmarks (compare vs baseline)"
        if: ${{ !inputs.update_baseline }}
        run: |
          SPEC_KITTY_RUN_PERFORMANCE=1 uv run python -m pytest \
            ${{ matrix.paths }} \
            -m performance \
            -n0 \
            --benchmark-storage=file://tests/performance/baselines \
            --benchmark-compare \
            --benchmark-compare-fail=median:50% \
            --benchmark-json=out/reports/benchmark/benchmark-${{ matrix.domain }}.json \
            -q --tb=short
          ec=$?
          # ec 5 = no performance-marked tests under this domain's paths (not
          # yet migrated -- pass). ec 4 = pytest-benchmark USAGE_ERROR because
          # --benchmark-compare found no prior run for this domain/platform to
          # compare against (no baseline committed yet -- pass, nothing to
          # regress against). A genuine statistical regression instead exits 1
          # (PerformanceRegression) and is NOT in this allow-list, so it still
          # fails the leg.
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 5 ] && [ "$ec" -ne 4 ]; then
            exit "$ec"
          fi

      - name: "Save a fresh ${{ matrix.domain }} baseline (workflow_dispatch update_baseline only)"
        if: ${{ inputs.update_baseline }}
        run: |
          SPEC_KITTY_RUN_PERFORMANCE=1 uv run python -m pytest \
            ${{ matrix.paths }} \
            -m performance \
            -n0 \
            --benchmark-storage=file://tests/performance/baselines \
            --benchmark-save=${{ matrix.domain }} \
            --benchmark-json=out/reports/benchmark/benchmark-${{ matrix.domain }}.json \
            -q --tb=short \
          || test $? -eq 5

      - name: "Upload ${{ matrix.domain }} benchmark JSON"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.domain }}-report
          path: out/reports/benchmark/
          retention-days: 90
          if-no-files-found: ignore

      - name: "Upload refreshed ${{ matrix.domain }} baseline (update_baseline only, never auto-committed)"
        if: ${{ inputs.update_baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.domain }}-baseline
          path: tests/performance/baselines/
          retention-days: 90
          if-no-files-found: ignore
