# Doctrine / Charter path-filtered CI (FR-012, SC-007)
#
# Tracker: Priivacy-ai/spec-kitty#3102
# Mission: charter-pack-usage-journey-01KYWWTF, WP07
#
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# Gives PRs that touch the doctrine/charter governance layer a fast, isolated,
# dedicated signal instead of relying solely on ci-quality.yml's full job
# graph (lint, kernel-tests, ~30 fast/integration suites, the always-on
# architectural+adversarial pole, Sonar, release checks, ...). Unrelated PRs
# never trigger this workflow at all (see "PATHS" below), so they pay no
# extra cost for it.
#
# `src/specify_cli/invocation/**` IS MANDATORY IN THE PATH LIST (squad MAJOR,
# alphonso M1). The #3104 P1 centerpiece `is_charter_empty` and its
# dispatch-net journey tests (empty -> net fires; `apply`-no-compile -> net
# still fires, the #3104 fix; compiled bundle -> net disengages, honest
# ROUTER_NO_MATCH) live under `src/specify_cli/invocation/` and
# `tests/specify_cli/invocation/` / `tests/invocation/` -- OUTSIDE a bare
# `src/charter/**` + `src/doctrine/**` filter. Omitting it would leave the P1
# fix false-green under a workflow named "doctrine-charter-tests".
#
# WHAT THIS WORKFLOW OWNS vs WHAT ci-quality.yml (MAIN CI) OWNS
# ---------------------------------------------------------------------------
# Owns (runs here):
#   - tests/doctrine/                                    (DRG freshness/sharding, org-pack/overlay
#                                                          precedence, activation parity -- the
#                                                          doctrine-layer fast suite)
#   - tests/charter/, tests/specify_cli/charter_freshness/,
#     tests/specify_cli/charter_lint/, tests/specify_cli/charter_preflight/
#                                                         (charter-context resolution, bundle
#                                                          authority, activation resolvers)
#   - tests/specify_cli/invocation/, tests/invocation/    (the dispatch-net / `is_charter_empty`
#                                                          predicate -- the #3104 P1 surface;
#                                                          NOT covered by any dedicated fast job
#                                                          elsewhere -- see gap note below)
#   - tests/specify_cli/cli/commands/test_analyze_surface_agreement.py
#                                                         (locks the doctrine source at
#                                                          src/doctrine/missions/mission-steps/
#                                                          software-dev/analyze/prompt.md to the
#                                                          canonical `agent mission
#                                                          record-analysis` command -- #3096/FR-011)
#   The first four selections run
#   `-m "fast and not windows_ci and not timing"` only: this is a FAST
#   unit-level signal, not the integration or serial timing tier. The
#   test_analyze_surface_agreement.py file is `integration`/`git_repo`-marked
#   (it shells out to `git grep` and exercises the real Typer CLI), so it is
#   run in a SEPARATE step below under `-m "integration and not windows_ci"`.
#   A prior revision of this file registered it in the fast-only invocation
#   above and in the `paths:` trigger list without a matching invocation --
#   the path trigger fired correctly but the pytest `-m "fast"` filter
#   deselected all 6 of its tests every time, so the registration was
#   silently inert (found by adversarial review during PR #3155 landing).
#   This file's own trigger-path registration still matters even though
#   `tests/specify_cli/cli/**` is separately covered by main CI's
#   `integration-tests-cli` job: that job only fires on the `cli` dorny
#   path-filter group, which does NOT include `src/doctrine/**` -- so a
#   doctrine-prompt-only change (no test-file edit) would otherwise reach NO
#   integration job at all. Keeping both the `paths:` entry and this
#   dedicated step closes that gap.
#
# Deliberate, precedented overlap (doctrine + charter portion only): the
# `tests/doctrine/` and `tests/charter/*` selections above ALSO run inside
# ci-quality.yml's own `fast-tests-doctrine` / `fast-tests-charter` jobs,
# which are gated on the identical `src/doctrine/**` / `src/charter/**`
# dorny filter groups. The value of the overlap is a STABLE, DEDICATED
# required-check NAME pinned to this governance layer, independent of
# ci-quality.yml's ~30-job graph; it is not a mistake.
#
# The GAP THIS FILE ACTUALLY CLOSES is `src/specify_cli/invocation/**`:
# ci-quality.yml has no dedicated fast/isolated job for that directory. It is
# only reached via the broad `lifecycle` composite dorny group, which feeds
# the heavyweight `fast-tests-core-misc` / `integration-tests-core-misc`
# catch-all shards (marker-selected across a huge swath of `tests/`, shared
# with several unrelated directories) -- the opposite of an isolated signal.
# This workflow gives the invocation predicate its own fast, isolated run.
#
# Explicitly NOT run here (main CI's exclusive responsibility -- no
# double-charge):
#   - ruff / mypy / commitlint / markdownlint          (ci-quality.yml `lint`)
#   - kernel-tests                                     (ci-quality.yml)
#   - the full `tests/architectural` / `tests/adversarial` pole -- this pole
#     is ALREADY ALWAYS-ON in ci-quality.yml's `arch-adversarial` job on
#     EVERY push/PR regardless of path (see that job's header comment).
#     Re-running any slice of it here would be a literal duplicate of a gate
#     that already fires unconditionally on 100% of PRs, doctrine/charter
#     ones included.
#   - integration-tier tests, coverage-floor enforcement, SonarCloud analysis,
#     `doctor doctrine` / org-DRG error assertions -- all remain
#     ci-quality.yml's responsibility.
#
# SKIP-WITH-GREEN (never skip-with-fail)
# ---------------------------------------------------------------------------
# A PR that changes none of the paths below never triggers this workflow, so
# the `doctrine-charter-tests` check simply never runs for it. This repo's
# own documentation of the exact same mechanism
# (docs/development/cutover-guard.md, "The skipped-required-check footgun")
# confirms GitHub treats a required check that legitimately never runs (via
# `paths:` filtering, or an `if:`-skipped job) as a neutral/"skipped"
# conclusion that SATISFIES the required-check gate rather than blocking
# merge. This file therefore mirrors the repo's existing standalone
# top-level `paths:` convention -- `canonical-producer-lint.yml` and
# `orchestrator-boundary.yml` use the identical shape -- rather than
# ci-quality.yml's internal `dorny/paths-filter` + per-job `if:` machinery,
# which exists there to differentially gate ~30 jobs inside ONE monolithic
# workflow; that machinery would be pure overhead for this single-job file.
#
# The only OTHER conditional on the job below is the repo-wide
# `pr:deferred` / `pr:skip-ci` label opt-out every required check here uses
# (see `deferral-consistency-check` in ci-quality.yml for the same pattern).
# Per the footgun note above, deliberately no additional `if:` is layered on
# top of that -- a required check that can ALSO legitimately skip for a
# reason unrelated to the label opt-out is one that can silently fail open.
#
# REQUIRED-CHECK WIRING (repo-admin UI step -- cannot be done from a PR)
# ---------------------------------------------------------------------------
# The job name below (`doctrine-charter-tests`) is the contract branch
# protection should require, mirroring `ui-e2e.yml`'s precedent:
#   Settings -> Branches -> main (and 2.x, if protected) -> Require status
#   checks to pass before merging -> add "doctrine-charter-tests".
# GitHub's UI only offers a check in that picker after it has run at least
# once on the branch, so this job must execute on some PR first. As
# `docs/development/cutover-guard.md` cautions: do not trust a reading of
# the `paths:` YAML alone -- verify with a live scratch PR that touches only
# `src/specify_cli/invocation/**` that the job actually executes.

name: doctrine-charter-tests

on:
  pull_request:
    branches:
      - main
      - develop
      - "2.x"
    paths:
      - "src/doctrine/**"
      - "src/charter/**"
      - "src/specify_cli/invocation/**"
      - "src/specify_cli/cli/commands/charter/**"
      - ".kittify/doctrine/overlays/**"
      - "tests/doctrine/**"
      - "tests/charter/**"
      - "tests/specify_cli/invocation/**"
      - "tests/specify_cli/charter_freshness/**"
      - "tests/specify_cli/charter_lint/**"
      - "tests/specify_cli/charter_preflight/**"
      - "tests/specify_cli/cli/commands/charter/**"
      - "tests/specify_cli/cli/commands/test_analyze_surface_agreement.py"
      - "tests/invocation/**"
      - ".github/workflows/doctrine-charter-tests.yml"
  push:
    branches:
      - main
      - develop
      - "2.x"
    paths:
      - "src/doctrine/**"
      - "src/charter/**"
      - "src/specify_cli/invocation/**"
      - "src/specify_cli/cli/commands/charter/**"
      - ".kittify/doctrine/overlays/**"
      - "tests/doctrine/**"
      - "tests/charter/**"
      - "tests/specify_cli/invocation/**"
      - "tests/specify_cli/charter_freshness/**"
      - "tests/specify_cli/charter_lint/**"
      - "tests/specify_cli/charter_preflight/**"
      - "tests/specify_cli/cli/commands/charter/**"
      - "tests/specify_cli/cli/commands/test_analyze_surface_agreement.py"
      - "tests/invocation/**"
      - ".github/workflows/doctrine-charter-tests.yml"

concurrency:
  group: doctrine-charter-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doctrine-charter-tests:
    name: doctrine-charter-tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'pr:deferred') && !contains(github.event.pull_request.labels.*.name, 'pr:skip-ci') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen)
        run: uv sync --frozen --all-extras

      - name: Run the doctrine/charter/invocation fast signal
        run: |
          uv run python -m pytest \
            tests/doctrine/ \
            tests/charter/ \
            tests/specify_cli/charter_freshness/ \
            tests/specify_cli/charter_lint/ \
            tests/specify_cli/charter_preflight/ \
            tests/specify_cli/invocation/ \
            tests/specify_cli/cli/commands/charter/ \
            tests/invocation/ \
            -m "fast and not windows_ci and not timing" \
            -q --tb=short \
            -n auto --dist loadfile \
            --durations=50

      - name: Run the analyze-surface-agreement integration signal
        run: |
          uv run python -m pytest \
            tests/specify_cli/cli/commands/test_analyze_surface_agreement.py \
            -m "integration and not windows_ci" \
            -q --tb=short
