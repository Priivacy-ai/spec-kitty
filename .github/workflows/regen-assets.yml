# =============================================================================
# regen-assets: keep the committed generated fixtures fresh from source (#3447).
#
# The 168 committed generated fixtures (twelve-agent command baselines + codex/
# vibe skill snapshots) are rendered from the source prompt templates. This
# workflow enforces + automates their regeneration via `spec-kitty regen`, with
# three trust tiers (mission research D2):
#
#   1. check      — EVERY pull request (fork-safe, read-only, no secrets):
#                   `spec-kitty regen --check`. A fork PR's GITHUB_TOKEN is
#                   read-only and cannot commit back, so contributors get a
#                   followable failure and run `spec-kitty regen` locally.
#   2. auto-commit — same-repo push to a default branch / workflow_dispatch:
#                   regenerate and commit the result back (bot identity).
#   3. label-pat-push — a maintainer `regen` label on a fork PR: privileged
#                   push of the regenerated fixtures into the fork branch via a
#                   least-privilege PAT. SHIPS DISABLED until the NFR-003
#                   security review sign-off (gated on the REGEN_PAT_PUSH_ENABLED
#                   repo variable), using the pull_request_target trusted-tooling
#                   pattern — base-repo `spec-kitty` renders the PR's template
#                   DATA; it never executes PR-supplied code.
# =============================================================================
name: regen-assets

on:
  push:
    branches: [main, develop]
    paths: &regen_paths
      - 'packs/built-in/missions/mission-steps/**'
      - 'tests/specify_cli/regression/_twelve_agent_baseline/**'
      - 'tests/specify_cli/skills/__snapshots__/**'
      - 'src/specify_cli/skills/command_renderer.py'
      - 'src/specify_cli/skills/render_versions.py'
      - 'src/specify_cli/template/asset_generator.py'
      - 'src/specify_cli/cli/commands/regen.py'
      - '.github/workflows/regen-assets.yml'
  pull_request:
    paths: *regen_paths
  workflow_dispatch:
  pull_request_target:
    types: [labeled]

# Default: read-only. The auto-commit job elevates to contents:write locally.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 — check-only gate for EVERY pull request (fork-safe, no secrets).
  # ---------------------------------------------------------------------------
  check:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Verify generated fixtures are fresh
        run: |
          if ! uv run spec-kitty regen --check; then
            echo "::error::Generated agent-command / skill fixtures are stale."
            echo "::error::Run 'spec-kitty regen' locally and commit the result, then push."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Tier 2 — same-repo push / workflow_dispatch: regenerate and commit back.
  # ---------------------------------------------------------------------------
  auto-commit:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.repository == 'Priivacy-ai/spec-kitty'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Regenerate generated fixtures
        run: uv run spec-kitty regen

      - name: Commit regenerated fixtures if changed
        run: |
          if git diff --quiet -- tests/specify_cli/regression/_twelve_agent_baseline tests/specify_cli/skills/__snapshots__; then
            echo "Generated fixtures already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/specify_cli/regression/_twelve_agent_baseline tests/specify_cli/skills/__snapshots__
          git commit -m "chore: regenerate generated agent-command + skill fixtures"
          git push origin "HEAD:$TARGET_REF"
        env:
          # Indirection: never interpolate a ref into the script text (injection-safe).
          TARGET_REF: ${{ github.ref_name }}

      - name: Verify fixtures are fresh
        run: uv run spec-kitty regen --check

  # ---------------------------------------------------------------------------
  # Tier 3 — maintainer `regen` label on a fork PR: privileged PAT push.
  # DISABLED until the NFR-003 security sign-off (REGEN_PAT_PUSH_ENABLED=true).
  # pull_request_target trusted-tooling pattern: base-repo spec-kitty renders
  # the PR's template DATA; PR-supplied code is never executed.
  #
  # SECURITY (NFR-003 preconditions, folded from the adversarial review):
  #  - refs are passed via `env:` and referenced as "$VAR", never interpolated
  #    into script text (branch names may contain `$(...)`/backticks → injection);
  #  - the PR-head checkout sets `persist-credentials: false` so REGEN_PAT is not
  #    written into `pr/.git/config` for any process whose cwd is the PR tree;
  #  - the render runs `uv run --no-sync --isolated` so attacker-controlled
  #    `pr/uv.toml`/`pyproject.toml` config cannot influence the trusted tooling env.
  #  - REGEN_PAT is NOT least-privilege: to push into an arbitrary contributor's
  #    fork it needs broad `repo` write on a dedicated bot account — document the
  #    true blast radius before enabling, or prefer commenting the diff instead.
  # ---------------------------------------------------------------------------
  label-pat-push:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.label.name == 'regen'
      && github.repository == 'Priivacy-ai/spec-kitty'
      && vars.REGEN_PAT_PUSH_ENABLED == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out base tooling (trusted, base ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: tooling

      - name: Check out PR head (data only, via maintainer PAT)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.REGEN_PAT }}
          # Do not leave REGEN_PAT in pr/.git/config (cwd = untrusted pr/).
          persist-credentials: false
          path: pr

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'

      - name: Install base tooling
        working-directory: tooling
        run: uv sync --frozen --all-extras

      - name: Regenerate the PR's fixtures with base-repo tooling
        working-directory: pr
        # --no-sync --isolated: run the already-synced trusted tooling env and
        # ignore any attacker-controlled uv config under the pr/ cwd.
        run: uv run --project ../tooling --no-sync --isolated spec-kitty regen

      - name: Commit + push regenerated fixtures into the fork branch
        working-directory: pr
        run: |
          if git diff --quiet -- tests/specify_cli/regression/_twelve_agent_baseline tests/specify_cli/skills/__snapshots__; then
            echo "Generated fixtures already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/specify_cli/regression/_twelve_agent_baseline tests/specify_cli/skills/__snapshots__
          git commit -m "chore: regenerate generated fixtures (maintainer regen label)"
          git push origin "HEAD:$HEAD_REF"
        env:
          # Indirection: the fork branch name is attacker-controlled and MUST NOT
          # be interpolated into the script text (command-injection sink).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
