name: plantuml-egress-spike

# WP01 (mission doctrine-schema-diagrams-01KZTQTH) — BLOCKING de-risk spike.
#
# Proves the docsite PlantUML render mechanism actually runs on the CI runners:
# a REAL @startyaml diagram renders to a valid, error-free SVG via a
# version+sha256-pinned plantuml.jar executed ONLY inside a digest-pinned JRE
# container under `docker run --network=none` (zero doctrine-content egress),
# with no font/DNS-driven failure. Its green exit-criterion gates every
# render/diagram WP.
#
# Runner matrix covers BOTH real docsite deploy hosts:
#   docs-build-pr.yml -> ubuntu-latest ; docs-pages.yml -> blacksmith-4vcpu-ubuntu-2404.
# Blacksmith runners are only available in the upstream repo, so on a fork the
# matrix collapses to ubuntu-latest (the blacksmith leg proves once the PR is on
# Priivacy-ai/spec-kitty). "Non-empty SVG" is NOT the predicate: PlantUML renders
# font/DNS failures as a valid non-empty SVG at exit 0, so the check requires the
# fixture's title/key tokens AND the absence of any PlantUML error signature.

on:
  push:
    # Paths-filtered, no branch restriction: the spike runs on the mission lane
    # branch push AND the integration branch, so it de-risks before the lane is
    # merged. (This workflow exists only on the mission branches.)
    paths:
      - 'scripts/docs/plantuml_invoke.py'
      - 'scripts/docs/plantuml_pins.json'
      - 'tests/docs/fixtures/spike_startyaml.md'
      - '.github/workflows/plantuml-egress-spike.yml'
  pull_request:
    paths:
      - 'scripts/docs/plantuml_invoke.py'
      - 'scripts/docs/plantuml_pins.json'
      - 'tests/docs/fixtures/spike_startyaml.md'
      - '.github/workflows/plantuml-egress-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plantuml-egress-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        # Both real deploy hosts upstream; ubuntu-latest only on forks (no
        # blacksmith runners there).
        runner: ${{ github.repository == 'Priivacy-ai/spec-kitty' && fromJSON('["ubuntu-latest","blacksmith-4vcpu-ubuntu-2404"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download + sha256-verify pinned plantuml.jar (host, with network)
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pins = json.loads(pathlib.Path("scripts/docs/plantuml_pins.json").read_text())
          url, want = pins["plantuml_jar_url"], pins["plantuml_jar_sha256"].lower()
          jar = pathlib.Path("plantuml.jar")
          urllib.request.urlretrieve(url, jar)
          got = hashlib.sha256(jar.read_bytes()).hexdigest()
          if got != want:
              raise SystemExit(f"plantuml.jar sha256 mismatch: want {want} got {got}")
          print(f"plantuml.jar verified ({jar.stat().st_size} bytes, sha256 {got})")
          PY

      - name: Prefetch digest-pinned JRE image (host, with network — before isolation)
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          pins = json.loads(pathlib.Path("scripts/docs/plantuml_pins.json").read_text())
          subprocess.run(["docker", "pull", pins["jre_image_digest"]], check=True)
          PY

      - name: Render a REAL @startyaml under docker --network=none (the proof)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, "scripts/docs")
          import plantuml_invoke as pi  # stdlib-only, no pip install

          fixture = pathlib.Path("tests/docs/fixtures/spike_startyaml.md").read_text(encoding="utf-8")
          m = re.search(r"@startyaml.*?@endyaml", fixture, re.S)
          if not m:
              raise SystemExit("no @startyaml block in spike fixture")
          src = m.group(0)

          workdir = pathlib.Path.cwd()
          jar = (workdir / "plantuml.jar").resolve()
          pins = pi.load_pins()

          svg = pi.render_startyaml(src, workdir=workdir, jar_path=jar, pins=pins)
          text = svg.decode("utf-8", "replace")

          # Non-empty is insufficient — require real fixture tokens + no error signature.
          assert "Agent Profile Schema" in text, "title token missing (font/render failure?)"
          assert ("primary-focus" in text or "investigation" in text), "nested token missing"
          assert not pi.svg_is_error(svg), "PlantUML error signature in SVG"

          out = pathlib.Path("spike.svg")
          out.write_bytes(svg)
          print(f"OK on {out}: valid error-free SVG, {len(svg)} bytes, tokens present, --network=none")
          PY

      - name: Upload rendered SVG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-svg-${{ matrix.runner }}
          path: spike.svg
          if-no-files-found: warn
