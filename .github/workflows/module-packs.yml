# =============================================================================
# module-packs: reusable workflow for the packs/built-in data pack (#3447).
#
# packs/built-in has no build and no dedicated test suite of its own; its tests
# ride the `corpus` marker group. This lifts the `fast-tests-corpus` job into a
# self-contained `on: workflow_call` workflow invoked as a `uses:` job inside
# ci-quality (decision D1(a)). Its coverage-fast-corpus.xml / fast-test-corpus-
# reports artifact still aggregates into ci-quality's single run; the
# architectural CI-model guards resolve the delegation via _splice_local_uses.
# Artifact + coverage names are preserved verbatim (C-004).
# =============================================================================
name: module-packs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast-tests-corpus:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # fetch-depth: 0 so the shrink-only ratchet in
      # tests/architectural/test_transition_guard_shrink_only.py (carried by the
      # `corpus` marker collected here) can reach its mission-base rev — a
      # shallow depth-1 checkout leaves that commit absent and the guard's 4
      # baseline-dependent gate tests fail closed instead of running (mirrors
      # the fetch-depth: 0 pattern in ci-quality.yml / docs-build-pr.yml).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - run: mkdir -p out/reports/coverage
      - name: "Run fast tests — corpus"
        run: |
          uv run python -m pytest \
            tests/architectural \
            tests/charter/synthesizer \
            tests/contract \
            tests/doctrine \
            tests/glossary \
            tests/integration \
            -m "corpus and not windows_ci" -q --tb=short \
            --timeout=240 --timeout-method=signal \
            -n auto --dist loadfile \
            --durations=50 \
            --cov=src/doctrine \
            --cov-report=xml:out/reports/coverage/coverage-fast-corpus.xml
      - name: "Upload fast-corpus coverage"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-corpus-reports
          path: out/reports/
