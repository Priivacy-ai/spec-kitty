rules:
  - ruleId: 001-r1
    ruleText: Components must not share mutable state across boundaries without an explicit, documented protocol.
    probeIds: []
    gradingClass: judge
    aggregation: k-of-n
    k: 5
    passThreshold: 3
    source:
      normative: docs/rubric/sop-rule-taxonomy.md#judge-required-rule-classes
