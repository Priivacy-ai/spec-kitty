  # RIGGED_IMPOSSIBLE_DESCRIPTION at run time because isControl: true
  # (research.md §4; src/cli/index.ts:1430-1444, same SHA) -- any real,
  # readable skillDir satisfies parseSkill() without being graded on its
  # own frontmatter. This is the sole isControl: true case in this
  # manifest.
  - id: rigged-impossible-control
    type: behavioral
