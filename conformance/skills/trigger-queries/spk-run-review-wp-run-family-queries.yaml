shouldTrigger:
  - "Claim this work package from the runtime review queue"
  - "Compare this implementation against the WP's acceptance checks"
  - "Approve this work package now"
  - "Reject this work package with structured feedback"
  - "Operate the review workflow surface for this WP"
  - "Let spk-run-implement-review continue after this review"
  - "Review whether this WP satisfies its spec and plan"
  - "Approve or reject work through the runtime review surface"
