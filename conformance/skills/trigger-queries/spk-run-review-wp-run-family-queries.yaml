  - "How do I initialize a new spec-kitty repository?"
  - "Explain how git worktrees are created for a lane"
  - "What are DIR-0xx directives and where are they defined?"
  - "How does the merge preflight validate a target branch?"
  - "What is the acceptance-matrix.json file used for?"
