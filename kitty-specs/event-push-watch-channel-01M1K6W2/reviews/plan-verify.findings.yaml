findings:
  - id: PLAN-VERIFY-001
    lens: Gates
    severity: 4
    title: "Gate Set table omits the enforced diff-coverage job, which directly gates the new core module"
    evidence:
      - artifact: "plan.md § Gate Set (table, lines ~447-472)"
      - code: ".github/workflows/ci-quality.yml:3308 (job `diff-coverage`, header comment at :3305: \"PR-only diff coverage gate (90% on critical-path changed lines)\")"
      - code: ".github/workflows/ci-quality.yml:3374 (`critical_paths` array entry `'src/specify_cli/status/*'`)"
      - code: ".github/workflows/ci-quality.yml:3358 (step \"diff-coverage (critical-path, enforced)\": `diff-cover ... --fail-under=90 --include \"${critical_paths[@]}\"`)"
      - code: ".github/workflows/ci-quality.yml:4276-4331 (`quality-gate` job `needs:` list includes `diff-coverage`, confirming it is part of the required aggregate check)"
    claim: >
      The plan's Gate Set table enumerates commitlint, markdownlint, Contextive, TID251, Bandit,
      pip-audit, the `kernel-tests`/`mission-loader-coverage` per-package 90% floors, and
      SonarCloud (correctly excluded, since `sonarcloud` only runs on `schedule`/`workflow_dispatch`
      per its own `if:` at line ~3524, never `pull_request` — verified). It never mentions the
      separate `diff-coverage` job at all (confirmed via grep: zero occurrences of "diff-coverage"
      or "diff coverage" in plan.md). This job is a distinct, ENFORCED gate: it runs
      `diff-cover --fail-under=90` scoped to changed lines under a `critical_paths` allowlist that
      explicitly includes `'src/specify_cli/status/*'` — the exact directory this mission's plan
      places its "actual novel domain work" (`tail_reader.py`, the module the plan itself calls
      out as needing the highest rigour). The job consumes the `coverage-fast-status.xml` artifact
      that `fast-tests-status` (`.github/workflows/ci-quality.yml:1321`, `--cov=src/specify_cli/status`)
      uploads, so it will score this mission's new lines. This is a real, applicable 90%
      line-coverage-on-the-diff floor for `tail_reader.py` that is materially different from (and in
      addition to) the two per-package floors the plan correctly rules out — and it is entirely
      unaddressed, so no WP author is told it exists or that `tail_reader.py`'s new lines need ≥90%
      coverage on the diff specifically (as opposed to just "the core is the highest-rigour tier").
    remediation: >
      Add a row to the Gate Set table for `diff-coverage` (job at `ci-quality.yml:3308`): Applies —
      Yes, because `src/specify_cli/status/*` is a listed `critical_path` (`ci-quality.yml:3374`) and
      this mission adds `src/specify_cli/status/tail_reader.py`; note that `src/specify_cli/cli/commands/events.py`
      is NOT in the critical-path list, so only the advisory full-diff step (not the enforced 90%
      floor) applies to the CLI shell. State explicitly that IC-01/IC-02/IC-03's test coverage of
      `tail_reader.py` must clear 90% of new/changed lines, not merely "be the highest-rigour tier."
  - id: PLAN-VERIFY-002
    lens: mission-specific (IC-02 vs sibling-mission defect class)
    severity: 4
    title: "IC-02's two named ATDD tests never exercise FR-007's literal claim — a plain clean-boundary truncation with a still-parseable remainder, detected via the size check independent of parse outcome"
    evidence:
      - artifact: "plan.md § Implementation Concern Map — IC-02 (ATDD bullet, lines ~525-529)"
      - artifact: "spec.md § Edge Cases — \"Clean record-boundary truncation (shape b)\" (lines 282-290): literal definition is a simple truncation at a line boundary with a still-parseable remainder — no regrow involved."
      - artifact: "spec.md § User Story 2, Acceptance Scenario 1 (lines 169-173, the size-check-alone case) vs. Acceptance Scenario 3 (lines 178-186, the truncate-then-regrow-within-one-poll race requiring the hash check)."
      - artifact: "spec.md FR-007 (line 330): \"FR-005's size-shrink check must fire even when the remaining bytes parse cleanly\" — this is a claim about the SIZE check, not the hash check."
    claim: >
      IC-02's ATDD section names exactly two tests: (1) the mid-line-tear test (already IC-01's,
      shape (a)), and (2) "shape-clean-truncation-detected-via-hash-even-when-size-regrows (User
      Story 2 AC3)". AC3 is specifically the truncate-then-regrow-within-one-poll-interval race,
      constructed so that "the size check alone (current size < O) never observes a shrink" — i.e.
      by the time the reader samples the file, `current_size >= O` and the size check is, by design,
      a no-op for that test. Neither named test constructs the plain case Edge Cases literally calls
      shape (b) and FR-007 literally requires: a file simply truncated at a line boundary (no
      regrow), where the remainder still parses as valid JSON, detected via the SIZE check firing
      regardless of parse success. That plain case is precisely the sibling mission's rejected
      defect as the mission brief and spec.md's Edge Cases section state it ("a reader that only
      defends against shape (a) will read the shrunk file successfully and report a confidently
      wrong (incomplete) result"). A plausible-but-lazy implementation that only runs its
      truncation check as a fallback when `json.loads` raises (i.e. gates the size check behind a
      parse failure, believing "if it parses, it's fine") would: pass the tear test (parse fails,
      the fallback path is exercised, nothing is emitted — correct behavior for shape a); pass the
      AC3 test (parse of the regrown content likely succeeds, but the HASH check — a separate code
      path the lazy implementation still has to implement to pass AC3 — catches the mismatch); and
      STILL fail to detect a plain shape-(b) truncation with a parseable remainder, because that
      case never reaches the fallback (parsing succeeds) and the hash check is unreached if the
      lazy implementation also gated it behind parse failure for consistency. IC-02's "Covers" line
      claims FR-007 is covered, but the two named ATDD tests do not demonstrate that coverage.
    remediation: >
      Add a third, explicitly named failing-first test to IC-02's ATDD bullet for User Story 2
      Acceptance Scenario 1 / Edge Cases shape (b) literally: truncate a log at a line boundary (no
      regrow), assert the remaining bytes DO parse as valid JSON (so the test fails if the fixture
      accidentally constructs a mid-line tear instead), and assert `log_truncated` fires anyway —
      via the size check specifically, independent of whether parsing of the remainder would have
      succeeded. This is the test that most directly reproduces the sibling mission's exact rejected
      scenario and should be named as such.
  - id: PLAN-VERIFY-003
    lens: mission-specific (IC-02 vs sibling-mission defect class)
    severity: 3
    title: "\"named separately\" does not require separate top-level test functions, undermining fresh-eyes distinguishability in CI output"
    evidence:
      - artifact: "plan.md § Implementation Concern Map — IC-02 (ATDD bullet: \"TWO independently failing-first tests, named separately\")"
    claim: >
      The mission brief's stated lesson from the sibling mission's rejection is that a reviewer
      should be able to tell, from CI failure output alone, which truncation shape broke. "Named
      separately" is satisfied by two distinctly-named `pytest.mark.parametrize` cases inside one
      test function, or even by two `assert`-with-message statements inside one function body with
      descriptive local variable names — neither of which gives CI failure output the same
      fresh-eyes distinguishability as two independent top-level test functions (a single assert
      failure in a combined function also masks whether the OTHER shape's assertion would also have
      failed, since execution stops at the first failure). The plan does not foreclose either
      weaker interpretation.
    remediation: >
      Change IC-02's ATDD wording to explicitly require "two separate, independently-invokable
      top-level pytest test functions (not two `parametrize` cases sharing one body, not two
      asserts in one function)" so a WP author and reviewer both have an unambiguous bar, and so a
      CI failure names the specific broken shape in the test node ID.
  - id: PLAN-VERIFY-004
    lens: mission-specific (IC-02 vs sibling-mission defect class)
    severity: 3
    title: "The AC3 test's \"cannot pass by accident via the size check alone\" guarantee rests on an un-enforced fixture-construction detail"
    evidence:
      - artifact: "plan.md § Truncation Detection Design (lines ~256-260): states the regrow-to-size->=O requirement in prose, describing the mechanism, not as an instruction to the WP author's test."
      - artifact: "plan.md § Implementation Concern Map — IC-02 (ATDD bullet): asserts the conclusion (\"cannot pass by accident via the size check alone\") without restating the construction requirement or requiring the test to self-verify it."
    claim: >
      The guarantee that IC-02's second test "cannot pass by accident via the size check alone"
      depends entirely on the fixture regrowing the file to `current_size >= O` before the reader's
      next poll samples it (per User Story 2 AC3's own wording). This precise byte-size relationship
      is stated as descriptive prose in the Truncation Detection Design section, cross-referenced
      only by naming "(User Story 2 AC3)" in the IC-02 bullet — it is not restated as a load-bearing
      MUST for the WP author, and the plan does not require the test itself to assert the
      precondition (e.g. `assert regrown_size >= O` before calling `poll_once`) so a reviewer can
      verify by reading the test alone, without re-deriving the byte-size arithmetic, that the size
      check was genuinely inert for this test.
    remediation: >
      In IC-02's ATDD bullet (or the test file itself), require the AC3-derived test to assert its
      own precondition explicitly — e.g. `assert Path(log).stat().st_size >= O` immediately before
      the `poll_once()`/`tail_events()` call under test — so the "cannot pass by accident" claim is
      self-evident from the test body, not something a reviewer must reconstruct from a separate
      section of the plan.
