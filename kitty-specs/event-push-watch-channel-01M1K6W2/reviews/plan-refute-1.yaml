      returns zero hits) despite describing poll_once() as "ONE reopen-by-path → stat →
      dual-truncation-check → drain" and only prescribing an inter-call inode-swap test (IC-01),
      never an intra-call same-fd test; store.py:392 (os.replace inode swap) and
      transaction.py:938 (in-place fh.truncate via a fresh open(path,"ab")) are real, confirmed
      concurrent-writer hazards under NFR-004's stated "day one" concurrent-writer requirement, so
      the unstated discipline gap is real and untested by the plan's own IC-01/IC-02 test list.

  - id: PLAN-VERIFY-001
    verdict: confirmed
    reason: >
