  integration/concurrency tier (WP05) is last by design, matching the plan's own framing. All 13
  FR-* IDs and NFR-*/C-* IDs in spec.md are mapped to at least one WP (verified by union of
  wps.yaml requirement_refs). plan.md's Campsite-Clean Scope section states "No campsite-clean
  debt found in the touched surface" and no tasks/WP file contradicts this by either fabricating
  cleanup subtasks or silently dropping mentioned debt.
