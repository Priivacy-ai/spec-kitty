  - code: src/specify_cli/status/store.py:392 — actual `os.replace(tmp_path, path)` call site (spec cites
      :390)
  - code: 'src/specify_cli/status/store.py:554 — actual `raise StoreError(f"Invalid JSON on line {line_number}:
      {exc}")` (spec cites :549)'
  claim: 'All other file:line citations in the Clarifications section were spot-checked and are exact.
    Only these two store.py citations drift by 2 and 5 lines respectively; the function/behavior described
