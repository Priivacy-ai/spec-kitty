- id: SPEC-ARCH-001
  lens: reflexivity
  severity: 4
  title: FR-005's truncation check compares only the CURRENT poll's file size to the last-seen offset;
    a rollback-then-regrow that completes inside one poll interval is invisible to it — a third failure
    mode beyond shape (a)/(b)
  evidence:
  - artifact: spec.md § FR-005 ("current file size on the next poll is smaller than O"), § Edge Cases
      (shape a/shape b), § Key Entities → Tail cursor ("plus enough state to detect truncation (last-seen
      file size)"), § NFR-002 (100-1000ms poll bound), § NFR-003 (silent success prohibited)
  - code: src/specify_cli/coordination/transaction.py:921 (_rollback truncates the existing inode in place
      via fh.truncate(), it does not os.replace())
  - code: src/specify_cli/status/store.py:358-397 (_append_serialized_atomic grows the file via os.replace,
      preserving prior bytes verbatim as a prefix)
  claim: 'FR-005/FR-007''s only truncation signal is "current file size < last-seen offset O", sampled
    once per poll (bound: NFR-002, 100-1000ms). This correctly catches a shrink that is STILL below O
    at the moment of the next poll (shape b, as tested by US2 AC1/AC2). It does not catch a shrink that
    recovers past O again before the next poll samples it: if, within a single poll window, a rollback
    truncates the file below O and a subsequent write (locked or unlocked; both write paths exist per
    the Clarifications §2 six-writer survey and ledger SK-131) grows the file back to size >= O, the reader
    observes size >= O at its next poll and treats [O, new_size) as ordinary new growth to parse. But
    those bytes are not a continuation of the sequence the reader previously validated at offset O. Because
    JSONL rows carry no length prefix and no self-describing offset, if that region parses as valid JSON,
    the reader silently emits content built on a false continuity assumption with no error, no `log_truncated`
    signal, and no exit code — exactly the "absorbed into ordinary no-new-data output" failure NFR-003
    was written to forbid. Neither AC in US2 exercises this "truncate-then-regrow-within-one-poll" timing.
    This is a real timing window given the repo''s own coordination pattern: a rollback followed by an
    immediate retry-and-succeed emit is a normal, expected sequence, not a contrived scenario.

    '
  remediation: Extend the Tail cursor / FR-005 to carry a lightweight content invariant in addition to
    size — e.g. remember (a hash of, or the raw bytes of) the last-consumed line at the boundary offset
    O, and on every poll re-verify that the byte range immediately preceding O in the current file still
    matches before trusting anything read from O onward. Any mismatch must be treated as truncation per
    FR-005/NFR-003, not as ordinary growth. Add an explicit US2 acceptance scenario covering "truncate-then-regrow
    completing between two polls."
- id: SPEC-VERIFY-002
  lens: core-truncation-shapes / falsifiability
  severity: 4
  title: Shape (a) (mid-line JSON tear, FR-006) has no dedicated User Story or Given/When/Then Acceptance
    Scenario anywhere in the spec, unlike shape (b) which gets a full User Story with two Acceptance Scenarios
  evidence:
  - artifact: spec.md § User Story 2 (title, Acceptance Scenarios 1-2) — shape (b) only
  - artifact: spec.md § User Story 1, Acceptance Scenario 2 ("a separate writer atomically appends a new
      valid event" — explicitly a COMPLETE, not torn, write)
  - artifact: spec.md § Edge Cases > "Mid-line JSON tear (shape a)" (prose only, no Given/When/Then)
  - artifact: spec.md § FR-006 (Requirements table row, prose only)
  claim: 'User Story 2 is a full, dedicated P1 user story ("Consumer survives a rollback truncation without
    desyncing silently") with two formal Given/When/Then Acceptance Scenarios covering shape (b) specifically.
    Shape (a) has no equivalent: it appears only as a one-paragraph Edge Cases bullet and as prose inside
    the FR-006 table row — neither is a testable Given/When/Then Acceptance Scenario. FR-006 is marked
    High priority, but under this spec''s own structure (User Story → Independent Test → Acceptance Scenario,
    how ATDD tests are derived per charter C-011), there is no scenario a tasks-phase author can lift
    verbatim into a failing-first test for shape (a). This is the coverage-gap pattern the rubric''s severity-4
    tier names directly ("FR without coverage"), and it is the mirror image of the exact defect class
    this mission exists to prevent (the sibling `design-status` rejection) — here it is shape (a) that
    risks being dropped at tasks-authoring time because it never got the User Story treatment.

    '
  remediation: 'Add a third (or expand User Story 2 with a second) dedicated Given/When/Then Acceptance
    Scenario for the mid-line JSON tear: e.g. "Given a tailer polling a log while a writer''s write(2)
    for one line is mid-flight, When the tailer reads a trailing line that fails JSON parse, Then it does
    not raise, does not drop the partial line permanently, and on the next poll (once the write completes)
    emits the now-complete event exactly once." Give it its own Independent Test description mirroring
    User Story 2''s, so tasks-phase can derive a failing-first ATDD test for FR-006 with the same rigor
    shape (b) already has.

    '
- id: SPEC-VERIFY-003
  lens: silent-success
  severity: 3
  title: NFR-003's blanket "every FR-005 through FR-009 condition MUST produce an explicit signal" textually
    contradicts FR-006's own described behavior (silent retry, no signal, for a torn line)
  evidence:
  - artifact: spec.md § NFR-003 ("Every non-nominal condition covered by FR-005 through FR-009 MUST produce
      an explicit signal ... rather than being absorbed into ordinary \"no new data\" output.")
  - artifact: spec.md § FR-006 ("an incomplete/invalid trailing line to be treated as 'not yet flushed'
      and retried next poll — never raised as a fatal read error and never silently dropped")
  claim: 'NFR-003 has two sentences with different scopes. Sentence 1 gates the "no silent success" rule
    on "while a real event exists that was not surfaced" — under this narrower gate, a torn/incomplete
    line arguably doesn''t qualify, since the event is not yet durably written, so silently retrying is
    defensible. Sentence 2 drops that gate and states unconditionally that "every non-nominal condition
    covered by FR-005 through FR-009" — which includes FR-006 by its own numeric range — "MUST produce
    an explicit signal." Taken literally, sentence 2 requires FR-006''s torn-line case to also emit a
    distinguishable signal envelope on every poll where a partial line is observed — which FR-006''s own
    text never asks for and which, given SK-131 measured torn lines in 33,389 of 4.5M concurrent samples,
    could mean frequent extra signal noise on a live log if implemented literally. A plan/tasks author
    following NFR-003''s sentence 2 verbatim builds a different (and noisier) reader than one following
    FR-006''s own plain-language description of silent, poll-boundary- transparent retry.

    '
  remediation: 'Narrow NFR-003 sentence 2 to match sentence 1''s gating condition explicitly, e.g.: "Every
    non-nominal condition covered by FR-005, FR-007, FR-008, and FR-009 MUST produce an explicit signal...
    FR-006''s torn-line retry is exempt from the explicit-signal requirement precisely because no complete
    event exists yet at that poll; it MUST NOT be reported as an error or a truncation, and MUST NOT be
    silently dropped (it is retried, not signaled)."

    '
- id: SPEC-VERIFY-004
  lens: falsifiability
  severity: 2
  title: Edge Cases section cross-references the wrong FR IDs (off-by-one) for two of the four listed
    edge cases
  evidence:
  - artifact: spec.md § Edge Cases > "Log file does not exist yet" ("...and start streaming once it does.
      See FR-007.")
  - artifact: spec.md § Requirements > FR-008 ("Wait for a not-yet-created log file, then stream once
      it appears")
  - artifact: spec.md § Edge Cases > "Mission slug does not resolve" ("...distinct from 'file not yet
      created.' See FR-008.")
  - artifact: spec.md § Requirements > FR-009 ("Fail closed on an unresolvable mission slug")
  claim: 'The "Log file does not exist yet" edge case cites "See FR-007" — but FR-007 is "Detect a clean
    record-boundary truncation as data loss," an unrelated requirement. The correct citation is FR-008.
    Likewise, the "Mission slug does not resolve" edge case cites "See FR-008" but the matching requirement
    is FR-009. Both edge cases are off by one FR ID. The prose behavior described in each bullet is itself
    correct, so this would not by itself cause a wrong implementation — but it would misdirect a plan/tasks
    author or reviewer building a traceability matrix (which this spec''s own C-008 and SC-004 make load-bearing
    for CI-marker coverage).

    '
  remediation: 'Fix the two citations: "Log file does not exist yet" -> "See FR-008."; "Mission slug does
    not resolve" -> "See FR-009."

    '
- id: SPEC-VERIFY-005
  lens: falsifiability / silent-success
  severity: 3
  title: No FR or edge case specifies behavior for an invalid or out-of-range resume offset supplied via
    FR-004's resume mechanism
  evidence:
  - artifact: spec.md § FR-002 ("Byte-offset resumable reads")
  - artifact: spec.md § FR-004 ("Explicit resume mechanism exposed to the consumer")
  - artifact: spec.md § Edge Cases (no bullet for an invalid/stale resume offset)
  claim: 'FR-002 and FR-004 describe resuming from "a supplied byte offset," but nowhere does the spec
    state what happens when that offset is invalid for the current file: greater than the current file
    size (e.g. the consumer''s persisted offset predates a rollback truncation the consumer never saw,
    or is simply stale/corrupt), negative, or landing mid-line rather than on a line boundary. This is
    a real non-nominal input path — exactly the class of thing NFR-003 is meant to police — but it is
    not named among "truncation, torn-line, missing-file, or resolve-failure" in NFR-003, nor is it in
    the Edge Cases list. A plausible-but-wrong implementation could silently clamp an out-of-range `--from-offset`
    to file size (or to 0) and proceed as if nothing were wrong — exactly the "report success/no new events
    while data was lost" failure mode NFR-003 otherwise targets — and no Acceptance Scenario in the spec
    would catch it.

    '
  remediation: 'Add an edge case and an Acceptance Scenario (or extend FR-004/FR-005) for an out-of-range
    or non-line-boundary resume offset: require the reader to treat it as data-loss/desync (an explicit
    signal, analogous to FR-005''s truncation signal) rather than silently clamping or guessing, and to
    fail closed rather than starting from an unverifiable position.

    '
