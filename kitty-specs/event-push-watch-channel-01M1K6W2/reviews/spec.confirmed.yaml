findings:
- id: SPEC-GOV-001
  lens: scope-relitigation-guard (gov) + migrations (arch, folded from SPEC-ARCH-003)
  severity: 3
  title: Tail cursor / FR-004 wording leaves open a 'command invocation owns the cursor' reading that
    C-001/FR-010 do not permit, with no stated versioning story
  evidence:
  - artifact: 'spec.md § Key Entities — Tail cursor: "Not persisted by the command itself unless FR-004''s
      resume mechanism requires it; owned by whichever side (consumer or command invocation) FR-004''s
      design settles on."'
  - artifact: 'spec.md § FR-004: "the command to accept a resume point (e.g. `--from-offset <N>`) and/or
      emit its current offset in each envelope so that I can persist and supply it on restart"'
  - artifact: 'spec.md § C-001: "No daemon process ... may be introduced, even as a partially-built on-ramp."'
  - artifact: 'spec.md § FR-010: pure reader, no write-back to "any other mission artifact under any code
      path"'
  claim: 'FR-004 itself only ever describes client-owned resumption: the consumer either supplies `--from-offset`
    (it already holds the value) or reads the emitted offset out of the stream and persists it externally.
    Neither mechanism requires the `events tail` process to remember anything between invocations. But
    the Key Entities "Tail cursor" bullet introduces a third possibility not present in FR-004 — the cursor
    "owned by ... the command invocation" — which, taken literally, would mean the CLI process itself
    persists resumable state across separate runs (e.g. an implicit per-mission cursor file the tool reads/writes
    without an explicit flag). That is a small but real seed of exactly the "server remembers consumer
    state" concept C-001 rules out even as a partially-built on-ramp: it implies the tool tracking a consumer''s
    position on the consumer''s behalf, which only makes sense if the tool anticipates more than one long-lived
    relationship between itself and a caller — the beginning of a session concept. FR-010''s "pure reader"
    guarantee is scoped to "mission artifact," and a command-owned cursor file written under `.kittify/`
    or a user cache directory may not obviously be a "mission artifact," so FR-010 does not clearly close
    this door either. If a later plan/tasks author reads the Key Entities hedge as license for a command-owned
    on-disk cursor, that introduces a new on-disk state format this spec never anticipated, with no stated
    versioning or migration story — a plan/tasks author cross-checking only Key Entities (not FR-004''s
    tighter language) could design exactly that, and a later reviewer would then have to unwind it.

    '
  remediation: 'Tighten the Key Entities "Tail cursor" bullet to match FR-004 exactly: state that the
    cursor is ALWAYS caller-supplied/caller-owned, that `events tail` is stateless across invocations,
    and that it MUST NOT persist cursor/resume state to disk anywhere (not just "any other mission artifact")
    — persistence is exclusively the calling consumer''s responsibility via the `--from-offset` input
    and the per-envelope offset output. Delete the "or command invocation" branch of the ownership sentence,
    or replace it with an explicit negative constraint ("never the command invocation"), so no future
    on-disk cursor format — and no associated migration question — can be read as spec-sanctioned.

    '
- id: SPEC-GOV-002
  lens: terminology
  severity: 3
  title: Spec's 'Envelope' key entity reuses an already-canonical glossary term ('Event Envelope') with
    a different schema, and introduces new domain terms with no glossary-candidate flag
  evidence:
  - artifact: 'spec.md § Key Entities — Envelope: "one JSON line emitted on stdout — either a pass-through
      of an existing StatusEvent/InnerStateChanged dict ... or one of the two new signal shapes"'
  - code: 'docs/context/system-events.md:16-25 — canonical ''Event Envelope'' term: "Standard wrapper
      for an emitted event, including identity, ordering, and payload fields." Common fields: event_id,
      event_type, aggregate_id, lamport_clock, payload.'
  - code: src/specify_cli/status/models.py:319-359 — StatusEvent dataclass fields (event_id, mission_slug,
      wp_id, from_lane, to_lane, at, actor, force, execution_mode, reason, ...) — no aggregate_id, no
      lamport_clock, no event_type field, i.e. a materially different shape from the canonical Event Envelope
      schema.
  claim: '`docs/context/system-events.md` already defines a canonical, `Status: canonical` glossary term
    "Event Envelope" with a specific schema (event_id, event_type, aggregate_id, lamport_clock, payload).
    This spec''s Key Entities section defines a new, differently-shaped "Envelope" (a StatusEvent JSON
    line, or one of two new signal shapes) without cross-referencing, reconciling, or distinguishing it
    from the existing canonical term. This is exactly the terminology drift the charter''s "Supporting
    workflows" standing order exists to catch early. Separately, the spec introduces several other new
    domain terms this mission originates — "Tail cursor," "resume token," the `log_truncated` signal shape
    — with no note that they are glossary candidates for `docs/context/system-events.md` at plan/implement
    time.

    '
  remediation: 'Either rename the new Key Entity to avoid the collision (e.g. "tail line" or "tail envelope")
    and note in the Clarifications section that it is deliberately distinct from the canonical "Event
    Envelope" term, or add a one-line reconciliation note explaining the relationship. Add a short note
    (in Clarifications or a new "Terminology" subsection) flagging "Tail cursor," "resume token," and
    the `log_truncated`/resolve-failure signal shapes as glossary candidates for `docs/context/system-events.md`,
    to be added at plan/implement time.

    '
- id: SPEC-GOV-003
  lens: public-repo
  severity: 3
  title: User Story 1 discloses an unreleased downstream product's internal implementation approach in
    a permanently-public repo
  evidence:
  - artifact: 'spec.md § User Story 1: "An external consumer (e.g. Kitty Desktop''s engine) currently
      runs its own `notify`-based filesystem watcher and debounced re-reduction of `status.events.jsonl`
      for one mission."'
  claim: '"Kitty Desktop" does not appear anywhere else in this repository (docs/, specs/, or code) —
    this spec is the sole place it is named. The corresponding local workspace (`SK-missions/kitty-desktop/`)
    is a planning-stage tree with no git remote configured, i.e. an unreleased/internal product, not a
    public one with documented public architecture. This spec names that product and states a specific
    internal implementation detail about it (uses the Rust `notify` crate for filesystem watching, plus
    a debounced re-reduction step) in `spec-kitty`, which is a PUBLIC, permanently-visible repository.

    '
  remediation: 'Replace the specific product name and implementation detail with a generic description
    (e.g. "An external desktop/companion consumer currently runs its own filesystem-watcher and debounced
    re-reduction logic for one mission"), unless the operator confirms Kitty Desktop''s architecture is
    intended to be public knowledge before this spec is published/merged.

    '
