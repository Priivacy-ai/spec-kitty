# Work packages — per-project sync consent ledgers
#
# This board is intentionally ordered. The incident class is caused by consent
# and storage scope drift across multiple egress paths, so every downstream WP
# must use the same project authority introduced by WP01.

dependency_notes:
  - edge: WP02 -> WP01
    kind: necessity
    why: >-
      Per-project ledgers and selectors need the canonical consent decision shape
      before they can decide which project owns a row.
  - edge: WP03 -> WP02
    kind: necessity
    why: >-
      Safe migration cannot classify legacy shared state until the scoped ledger
      resolver and ambiguous-row policy exist.
  - edge: WP04 -> WP01
    kind: necessity
    why: >-
      User-visible opt-in/out/status commands must expose the same authority that
      runtime egress uses.
  - edge: WP04 -> WP02
    kind: risk-ordering
    why: >-
      Status and doctor output are clearest after the scoped stores exist, though
      some command text can be prepared earlier.
  - edge: WP05 -> WP03
    kind: necessity
    why: >-
      Background, body-upload, transmit, acknowledgement, and purge paths must
      operate on migrated/scoped stores, not the legacy machine-wide queue.
  - edge: WP06 -> WP05
    kind: necessity
    why: >-
      Closure evidence must observe the final runtime behavior across interactive,
      daemon, bypass, old-client, and acknowledgement paths.

