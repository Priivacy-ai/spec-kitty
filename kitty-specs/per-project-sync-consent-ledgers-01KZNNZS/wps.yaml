subtasks:
  - id: T001
    description: >
      RED FIRST. Add tests proving a project with no explicit consent is denied
      even when SPEC_KITTY_ENABLE_SAAS_SYNC is set.
  - id: T002
    description: >
      Change the consent resolver so environment/config rollout flags can only
      disable or expose sync surfaces; they must not grant egress consent.
  - id: T003
    description: >
      Define the canonical project consent decision object, including project id,
      grant source, denial reason, and audit-ready status text.
  - id: T004
    description: >
      Route compatibility helpers such as is_sync_enabled_for_checkout through the
      canonical authority without letting checkout-level readiness authorize row
      egress.
  - id: T005
    description: >
      Strengthen architectural consent-boundary tests so new transmitters cannot
      bypass the canonical project consent authority.

  - id: T006
    description: >
      RED FIRST. Add a two-project selector test where project A is opted in,
      project B is not, and only A's rows enter a ConsentedBatch.
  - id: T007
    description: >
      Introduce the project-scoped ledger/storage resolver for event journal,
      offline queue, body queue, and delivery ledger reads.
  - id: T008
    description: >
      Key selection, acknowledgement, and purge predicates by the row/task project
      identity rather than the current checkout or machine-global state.
  - id: T009
    description: >
      Preserve existing project identity columns and reporting helpers while
      removing any unscoped full-journal selection path from hot egress code.
  - id: T010
    description: >
      Update status report internals to expose per-project selected/refused/queued
      counts without scanning unrelated projects on normal delivery.

  - id: T011
    description: >
      RED FIRST. Build isolated fixture databases containing mixed legacy rows,
      body uploads, and ambiguous rows predating project identity.
  - id: T012
    description: >
      Implement migration into project-scoped ledgers or scoped resolver metadata
      without destructive purge of source rows during classification.
  - id: T013
    description: >
      Classify ambiguous legacy rows as local-only/refused until a project can be
      proven; do not silently admit them into any opted-in project.
  - id: T014
    description: >
      Make migration idempotent and record audit evidence of imported, refused,
      ambiguous, and unchanged counts.

  - id: T015
    description: >
      RED FIRST. Add CLI tests for explicit project opt-in, opt-out, and status
      language that avoids describing the global env flag as consent.
  - id: T016
    description: >
      Implement or adjust sync commands so consent changes are project-scoped,
      reversible, and visible before any drain starts.
  - id: T017
    description: >
      Update sync status/doctor/routes output with concise per-project consent,
      ledger, migration, and refusal summaries.
  - id: T018
    description: >
      Update user-facing docs/help text to say default denied, per-project opt-in,
      and global flag as deny-only/visibility-only rollout control.

  - id: T019
    description: >
      RED FIRST. Add daemon/background and body-upload tests proving non-consenting
      projects are refused even if another checkout is opted in.
  - id: T020
    description: >
      Wire background delivery, body upload, history import upload, and SaaS client
      send wrappers through the row/task project consent predicate.
  - id: T021
    description: >
      Ensure refused rows are not acknowledged, purged, or marked terminal-success
      before a real transmit acknowledgement for their own project.
  - id: T022
    description: >
      Add old-client/bypass seam tests that call lower-level delivery helpers
      directly and still observe fail-closed refusal.
  - id: T023
    description: >
      Run focused sync/delivery/body/architectural validation and record exact
      commands and results for closure evidence.

  - id: T024
    description: >
      RED FIRST. Add an end-to-end two-project fixture covering interactive drain,
      daemon drain, body upload, and acknowledgement isolation.
  - id: T025
    description: >
      Create issue-matrix.json mapping every FR/SC to tests, code surfaces, and PR
      evidence, including the explicit #585 historical-remediation boundary.
  - id: T026
    description: >
      Write the closure dossier and runbook: prevention shipped, remaining
      incident-disposition work, operator verification steps, and rollback notes.
  - id: T027
    description: >
      Publish GitHub issue/PR comments linking the mission, test evidence, and the
      fact that #585 is not closed until the 1,322 historical events receive an
      approved remediation disposition.
  - id: T028
    description: >
      Run the final focused and broad validation suites required by the mission
      review gate and record their outputs in the mission artifacts.
