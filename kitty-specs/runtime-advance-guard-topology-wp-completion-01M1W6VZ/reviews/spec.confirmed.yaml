- id: SPEC-VERIFY-004
  lens: silent-success
  severity: 2
  title: FR-006's failure-surfacing requirement is stated too loosely to be a single testable contract
  evidence:
  - artifact: "spec.md \xA7 FR-006; \xA7 User Story 1 Acceptance Scenario 3"
  claim: "FR-006's \"raise or otherwise surface as a reportable error\" disjunction leaves open whether\
    \ the contract is a raised exception (matching every other fail-loud precedent in this codebase, e.g.\
    \ CoordWorktreeResolutionError) or a structured return value \u2014 materially different, differently-testable\
    \ contracts.\n"
  remediation: 'Pick one contract explicitly: either "must raise" (matching existing fail-loud precedents),
    or name the exact non-raising mechanism (e.g. a new ArtifactPresenceSnapshot field distinct from guard_failures)
    so C-008''s red-first test has an unambiguous target.

    '
- id: SPEC-VERIFY-005
  lens: baseline-honesty
  severity: 2
  title: NFR-001's 'tests/runtime root' phrasing is ambiguous and could trigger a false regression alarm
  evidence:
  - artifact: "spec.md \xA7 NFR-001; \xA7 SC-005"
  claim: "\"tests/runtime root full continues to report 672 passed, 1 skipped\" only holds when tests/runtime/next\
    \ is excluded from the run; a naive `pytest tests/runtime -q` collects 746 tests (745 passed, 1 skipped)\
    \ \u2014 a different number that could read as a false regression to an implementer who runs the naive\
    \ invocation.\n"
  remediation: 'Reword NFR-001''s third clause to state the exact invocation, e.g. "pytest tests/runtime
    --ignore=tests/runtime/next continues to report 672 passed, 1 skipped".

    '
