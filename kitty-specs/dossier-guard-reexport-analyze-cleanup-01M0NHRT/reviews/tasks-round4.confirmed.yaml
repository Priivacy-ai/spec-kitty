findings:
- id: TASKS-FRESH3-001
  lens: fresh-sweep
  severity: 2
  title: WP04 points implementers to "tasks.md's preamble" for the mission-wide baseline, but tasks.md
    (finalize-tasks-generated) has never contained any such preamble/baseline section
  evidence:
  - artifact: tasks/WP04-dossier-reexport-trim.md:61-62
  - code: '"Before your own first commit in this WP: confirm the mission-wide baseline (see `tasks.md`''s
      preamble) was already captured — check `kitty-specs/.../tracer-tooling-friction.md` for an F-0N
      entry recording it."'
  - artifact: tasks.md (current, and as originally generated at commit 7d9a69bd7)
  - code: 'tasks.md is exactly the machine-generated WP index — "# Work Packages: ..." / "_Generated by
      finalize-tasks from wps.yaml. Do not edit directly._" followed only by the four WP header blocks
      (Dependencies/Requirement Refs/Plan Concerns/Owned Files/Subtasks/Prompt). No preamble, no baseline
      section, in the original authoring commit or any later fix-round commit (`git log --oneline -- tasks.md`
      shows only 7d9a69bd7 and 60511227f, neither adds a preamble).'
  - artifact: tasks/WP01-sk63-path-relativization.md, tasks/WP02-dossier-guard-widening.md, tasks/WP03-commit-subject-fix.md
  - code: WP01/WP02/WP03 do not reference "tasks.md's preamble" at all — each inlines the full baseline
      command and disposition rule directly in its own "Mission-wide baseline" section. Only WP04 points
      elsewhere instead of being self-contained the same way.
  claim: 'WP04''s baseline-capture instructions send the implementer to consult "tasks.md''s preamble"
    for the mission-wide baseline details, but tasks.md — the `finalize-tasks`-generated, do-not-edit-directly
    WP index — has never had a preamble or baseline section, in this mission''s original authoring commit
    or either of the two subsequent fix-round commits that also touched this same WP04 file. This is a
    dangling cross-reference that survived tasks authoring and two fix rounds (both of which edited this
    exact file for other reasons — 60511227f and 8e6888acc) without being corrected. It is not functionally
    blocking: the exact pytest command and disposition rule are duplicated immediately below that sentence
    in WP04 itself, so an implementer following the prompt top-to-bottom still gets the right instructions.
    But the pointer itself is false, is inconsistent with how WP01/WP02/WP03 are each fully self-contained
    on this point, and would mislead anyone who actually goes looking in tasks.md for the referenced preamble.

    '
  remediation: 'Either delete the parenthetical "(see `tasks.md`''s preamble)" from WP04 (the command
    is already inlined right there, so the pointer adds nothing and is factually wrong), or replace it
    with an accurate pointer — e.g. "(see this WP''s own ''Mission-wide baseline'' section below, restated
    from plan.md''s Baseline section)" — matching the framing WP01/WP02/WP03 already use.

    '
