findings:
- id: pr-tests-001
  lens: tests
  severity: 4
  title: New tests/dossier/test_reexport_trim.py is collected by zero CI job on a push to main (issue
  evidence:
  - code: tests/dossier/test_reexport_trim.py:1
  - code: .github/workflows/ci-quality.yml:1997
  - code: tests/architectural/test_ci_collection_completeness.py:352
  claim: "The new WP04 regression file carries no pytestmark at all (every sibling file in tests/dossier/\
    \ carries `pytestmark = [pytest.mark.unit, pytest.mark.fast]` or similar). Verified empirically: `pytest\
    \ tests/dossier/test_reexport_trim.py -m \"fast\"` and `-m \"git_repo or integration or architectural\"\
    ` both deselect all 33 tests (0 collected either way). `tests/dossier` is only reachable through two\
    \ CI jobs: fast-tests-core-misc's core-misc shard (filters `-m \"fast and not windows_ci and not regression\"\
    `) and integration-tests-core-misc's misc shard (filters `-m \"... (git_repo or integration or architectural)\
    \ ...\"`) \u2014 neither marker set matches, so both jobs skip every test in the file despite the\
    \ directory being in their path lists. Running the repo's own completeness oracle (tests/architectural/test_ci_collection_completeness.py::test_every_test_node_is_collected_on_a_push_to_main)\
    \ on the consolidated tree FAILS with exactly this file: \"33 of 40386 collected test NODES (1 files)\
    \ run in NO job on a push to 'main'\". This is not hypothetical \u2014 it is a currently-red, mission-introduced\
    \ failure of an existing architectural gate, and it means the very regression protection WP04 was\
    \ written to add (guard against re-introducing the seven trimmed re-exports, guard against over-trimming\
    \ an emit_* re-export) never actually runs in CI. The 33 assertions are logically sound (independently\
    \ verified red-first below) but functionally inert.\n"
  remediation: 'Add `pytestmark = [pytest.mark.unit, pytest.mark.fast]` to tests/dossier/test_reexport_trim.py,
    matching every other file in that directory, then re-run tests/architectural/test_ci_collection_completeness.py
    to confirm orphan_count returns to 0.

    '
  lens_group: tests
  refute_reason: "Independently reproduced end-to-end: tests/dossier/test_reexport_trim.py is the only\
    \ file in tests/dossier/ with no pytestmark (all 15 siblings carry unit/fast or fast); `.venv/bin/python\
    \ -m pytest tests/dossier/test_reexport_trim.py -m \"fast\"` and `-m \"git_repo or integration or\
    \ architectural\"` both deselect all 33 tests; no pytest.ini/conftest.py autouse hook injects a default\
    \ unit/fast/integration/architectural marker (only windows_ci/quarantine/performance/shard marks are\
    \ auto-applied); the CI misc integration shard explicitly lists tests/dossier as an owned path but\
    \ filters on `(git_repo or integration or architectural)`, which an unmarked file never matches; and\
    \ tests/architectural/test_ci_collection_completeness.py::test_every_test_node_is_collected_on_a_push_to_main\
    \ actually FAILS on HEAD (242bb99a5) with \"33 of 40386 collected test NODES (1 files)\" naming exactly\
    \ tests/dossier/test_reexport_trim.py (33 == the file's real collected-test count), while the same\
    \ test PASSES at the pre-mission base commit 03cda7bbf in a throwaway worktree \u2014 proving this\
    \ is a genuine regression introduced by this diff, not pre-existing noise. The gate is baseline-free\
    \ by design (no allowlist), so this is a real, currently-red, self-detected CI hole."
- id: pr-contract-001
  lens: contract
  severity: 3
  title: FR-007 hash-input path relativization and the FR-006 commit-subject change have no CHANGELOG
    entry
  evidence:
  - code: docs/changelog/CHANGELOG.md:57
  - code: src/specify_cli/analysis_report.py:186-266
  - code: src/specify_cli/cli/commands/agent/mission_record_analysis.py:374
  claim: 'Only the dossier re-export trim (#3677) got a CHANGELOG entry (line 57). Two other durable-contract
    changes in this same diff are undocumented: (1) `collect_input_artifact_hashes`/`_artifact_hash_entry`
    now write repo-relative paths (was absolute) into the `input_artifacts.*.path` field of the committed,
    git-tracked `analysis-report.md` frontmatter -- a format change to a persisted artifact, and previously
    a portability/ leakage defect (absolute local paths, including the operator''s home directory, committed
    to repo history) that this PR silently fixes going forward; and (2) `record-analysis`''s emitted commit
    subject changed from `"Add analysis report for mission {slug}"` to `"docs(record-analysis): record
    analysis report for mission {slug}"` (#3678/FR-006), a message any git-history tooling or ignore-list
    keyed on the old literal would miss. Neither is mentioned anywhere in the CHANGELOG diff. This repo''s
    own CHANGELOG discipline is otherwise exhaustive -- every other entry in this same "Unreleased" section,
    including internal-only fail-loud fixes, carries an explicit Before/After writeup -- so the omission
    is a real traceability gap for an operator or downstream tooling maintainer scanning the changelog
    for "did the analysis-report.md format change".

    '
  remediation: 'Add a CHANGELOG entry (or fold into the existing #3677 entry, renamed to cover the whole
    mission) documenting: the `input_artifacts.*.path` field is now repo-relative for all four hash-input
    keys (spec/plan/tasks/ charter), not just charter; `write_analysis_report` now raises `PathRelativizationError`
    (a subclass of `AnalysisReportError`) if a hash-input path cannot be relativized, while `check_analysis_report_current`
    catches it and reports `ok=False`/stale instead of raising; and the `record-analysis` commit subject
    is now conventional-commit-shaped.

    '
  lens_group: contract
  refute_reason: "The premise \"exhaustive per-entry\" overstates the actual norm (sampled entries show\
    \ one bullet per PR/mission, sometimes bundling several issues with sub-bullets, e.g. the \"Fail-loud\
    \ sweep\" entry cites #3578/#3548/#3517/#3412/#2991/#3590 together) \u2014 but the real norm, evidenced\
    \ across dozens of sampled entries, is that every issue number materially touched by a bundled change\
    \ is cited in its entry's parenthetical, and every user/operator-visible behavior change is narrated\
    \ somewhere. Here the diff shows two real, distinct, issue-tracked changes bundled into this same\
    \ PR alongside the documented #3677 trim: FR-007's path-relativization (analysis_report.py: a new\
    \ PathRelativizationError, relativized hash-input paths, committed analysis-report.md frontmatter\
    \ format change) and FR-006/#3678's commit-subject format change (mission_record_analysis.py:374,\
    \ switching auto-committed subjects from a non-conventional-commit string to `docs(record-analysis):\
    \ ...` for commitlint compliance). `grep -n \"3678\\|3676\" docs/changelog/CHANGELOG.md` returns nothing,\
    \ and the only new bullet added by this diff is the single #3677 entry (CHANGELOG.md:57), which does\
    \ not mention either FR-007 or FR-006/#3678 even in passing. No automated changelog gate catches this\
    \ (tests/release/test_validate_changelog_entry.py only checks version-section presence), so this is\
    \ a real, silent documentation gap, correctly scoped at severity 3."
refuted:
- id: pr-tests-002
  reason: "Factually accurate but not an actionable finding: verified the regex proxy in tests/specify_cli/cli/commands/agent/test_mission_record_analysis.py\
    \ (module carries pytest.mark.unit/fast at line 26) and confirmed via WP03's own task file (kitty-specs/.../tasks/WP03-commit-subject-fix.md,\
    \ subtask T012) that a live `commitlint --from <sha> --to <sha>` run was explicitly planned and executed\
    \ manually during the WP as the authoritative verification step, with the RED-first regex proxy scoped\
    \ deliberately to stay inside the file's unit/fast tier (no subprocess/network, per pytest.ini's own\
    \ tier definitions) \u2014 exactly the tradeoff the finding describes. The finding's own remediation\
    \ is \"None required\" and its severity is self-rated 1/non-blocking; it identifies no defect to fix,\
    \ so there is nothing here for the merge gate to act on."
