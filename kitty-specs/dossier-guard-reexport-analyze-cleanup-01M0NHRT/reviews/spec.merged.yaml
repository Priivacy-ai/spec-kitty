merge_note: >
  R2 mechanical merge/dedup of spec-gov.findings.yaml (4), spec-arch.findings.yaml (2),
  spec-verify.findings.yaml (2) = 8 raw findings. SPEC-ARCH-001 and SPEC-VERIFY-001 make
