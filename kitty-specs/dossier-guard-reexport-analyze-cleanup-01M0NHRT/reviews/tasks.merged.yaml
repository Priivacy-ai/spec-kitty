findings:
  - id: TASKS-DECOMP-001
    lens: "Mission-derived — IC-03 split disjointness"
    severity: 4
    title: WP03's own RED-first instruction (T010) offers WP01's exclusively-owned test file as the primary landing spot, or else silently blows the mission's binding six-file scope
    evidence:
      - artifact: "tasks/WP03-commit-subject-fix.md § Subtask T010 (Files line, ~lines 127-131)"
        note: >
          "Files: tests/specify_cli/test_analysis_report.py or a more targeted new/existing test
          module covering mission_record_analysis.py's commit-message construction (choose the
          most appropriate existing test file for this command's unit tests; if none fits
          cleanly, a small addition to the closest existing test module for
          mission_record_analysis.py is acceptable ...)"
      - artifact: "wps.yaml WP03.owned_files / tasks/WP03-commit-subject-fix.md frontmatter owned_files"
        note: "WP03's owned_files is exactly one entry: src/specify_cli/cli/commands/agent/mission_record_analysis.py. No test file is listed."
      - artifact: "wps.yaml WP01.owned_files / tasks/WP01-sk63-path-relativization.md frontmatter owned_files"
        note: "WP01 owned_files includes tests/specify_cli/test_analysis_report.py and tests/specify_cli/test_analysis_report_charter_yaml_staleness.py — exclusively."
      - artifact: "lanes.json lane-c.write_scope (WP03) vs lane-a.write_scope (WP01)"
        note: "lane-c write_scope = [mission_record_analysis.py] only; lane-a write_scope = the three WP01 files including test_analysis_report.py. Both lanes have depends_on_lanes: [] and parallel_group: 0."
      - artifact: "spec.md § Charter-clause resolutions, §106 change-scope reconciliation (binding)"
        note: "'No other file is touched, beyond the six files named above.' No dedicated test file for mission_record_analysis.py/FR-006 is in the six-file set."
      - code: "tests/specify_cli/test_analysis_report.py:374-419 (test_record_analysis_command_persists_report)"
        note: "The natural landing spot for a commit-message/commitlint RED-first fixture — lives inside WP01's exclusively-owned file."
      - code: "src/specify_cli/policy/commit_guard.py:108-119 (validate_staged_files ownership-scope check)"
        note: "A real pre-commit ownership guard exists and flags any staged file not matching a WP's owned_files globs."
    claim: >
      WP03 (FR-006) must land a RED-first fixture (T010) but its owned_files is exactly one file
      (mission_record_analysis.py, no test file). T010's "Files" guidance offers two options and
      both are defective: (a) test_analysis_report.py is WP01's exclusively-owned file — taking it
      creates a real cross-lane file conflict between two dependencies:[]/parallel_group:0 lanes
      that the IC-03 split was designed to avoid; or (b) a different test module is outside
      spec.md's binding six-file §106 scope. Every implementer choice either creates a cross-lane
      conflict or violates the binding scope contract.
    remediation: >
      Pick one file and make every artifact agree: extend the already-existing
      tests/specify_cli/cli/commands/agent/test_mission_record_analysis.py (FR-006-adjacent,
      shares no owner with WP01). Rewrite WP03's T010 "Files" line to name that file only and
      explicitly forbid touching WP01's two files; add it to WP03's owned_files (frontmatter +
      wps.yaml) and lane-c's write_scope in lanes.json; add it to spec.md's §106 binding file-set
      and plan.md's mirrored §106 table as a seventh file.

