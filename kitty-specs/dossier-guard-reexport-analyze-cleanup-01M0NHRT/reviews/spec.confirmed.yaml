confirm_note: >
  R3 refutation (reviews/spec-refute-1.yaml) confirmed all 8 merged findings — none
  refuted. SPEC-VERIFY-001 is a duplicate of SPEC-ARCH-001 (same underlying defect,
  independently found by both the arch and verify lens groups; see
