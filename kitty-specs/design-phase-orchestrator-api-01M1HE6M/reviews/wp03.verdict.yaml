complete: true
wp_id: WP03
mission: design-phase-orchestrator-api-01M1HE6M
verdict: approved
summary: >
  WP03 is a genuinely thin, in-process adapter layer exactly as sized: `specify` calls
  `lifecycle._create_mission_for_specify_json` and `plan`/`tasks` call
  `agent_feature.setup_plan`/`finalize_tasks(json_output=True)`, with zero edits to any
  phase-code module (confirmed by diff: only commands.py, upstream_contract.json, and
  the three test files changed). The stdout-capture technique that recovers each
  delegate's payload is sound, not a smell in practice: rich's shared `console` resolves
  `sys.stdout` dynamically at write time (verified via `Console.file`'s property
  getter), so `contextlib.redirect_stdout` correctly intercepts both `print()` and
  `console.print()`; every non-JSON `console.print` call inside `setup_plan`/
  `finalize_tasks` is gated `if not json_output:`, so with `json_output=True` the only
  stdout write is one `_emit_json` -> `print(json.dumps(payload))` line, matching the
  single-line scan `_extract_json_payload` performs; and a `payload is None` extraction
  failure fails closed via `_fail(..., "*_FAILED", "produced no parseable JSON
  payload", ...)` rather than silently succeeding. Red-first was independently
  re-derived: reverting commands.py + upstream_contract.json to the RED commit
  (098f1b204) content reproduces exactly 4 x "No such command 'specify'." failures;
  restoring HEAD gives 26/26 green in tests/specify_cli/orchestrator_api/ and 326
  passed / 2 skipped / 0 failed across the full three-directory baseline surface (delta
  over the given 299/2/0 baseline is explained by this lane's base commit already
  differing from the baseline-measurement commit on unrelated content -- 0 new
  failures either way). ruff and mypy --strict are clean on commands.py; TID251,
  check_patch_targets.py, and a targeted architectural-boundary sample all pass.
  Editing `upstream_contract.json` outside WP03's declared owned_files was the right
  call, not a BLOCKED-worthy violation: `tests/contract/test_orchestrator_api.py`'s
  `test_registered_commands_are_contract_allowed` and (for the two literal
  `_fail(cmd, "MISSION_CREATE_FAILED"/"PLAN_SETUP_FAILED"/"TASKS_FINALIZE_FAILED", ...)`
  call sites) `test_literal_failure_codes_are_contract_allowed` genuinely fail without
  it; the file's own git history shows it is routinely hand-updated by feature work;
  the charter's ownership-map-leeway standing order licenses exactly this; and the
  implementer transparently flagged the coming WP04/05/06/08 same-file merge-order
  hazard in the tracer rather than hiding it. The registration itself is correct and
  slightly over-complete (MISSION_ALREADY_EXISTS is registered even though it is never
  a literal `_fail(...)` argument -- it is returned as a string from a classifier
  function and passed via a variable -- which is harmless and arguably more honest
  about runtime-emittable codes than the static regex check requires). Markers/CI
  collection checked against the real `.github/workflows/ci-quality.yml` filters: the
  new file's `[integration, git_repo]` markers plus its path
  (tests/specify_cli/orchestrator_api/, not on any ignore list) place it inside
  `integration-tests-core-misc`'s `specify-cli-rest` shard
  (`-m 'not windows_ci and (git_repo or integration or architectural) and not timing
  and not regression'`) and correctly OUTSIDE `fast-tests-core-misc`
  (`-m "fast and not windows_ci and not regression"`); the two `fast`-marked
  fail-closed files (unchanged file-level marker, confirmed) sit in the same
  unignored directory and so are collected by `fast-tests-core-misc`. `plan`'s
  `mission_slug` setdefault is a verified no-op (setup_plan's own payload already
  carries it, mission_setup_plan.py:1018); `tasks`' setdefault is a verified real
  fill (finalize_tasks' payload genuinely omits it, mission_finalize.py:2607-2615) --
  both correctly implement the transport-identity-fill-not-enrichment distinction
  Reviewer Guidance asks for. The ULID/clock freeze in Acceptance Scenario 4 is a
  legitimate test-determinism fix, not a hidden production defect papered over -- but
  tracing it surfaced a real, separate, pre-existing production risk in
  `mission_creation.py` (WP03-004 below) worth a ledger entry. contract-version is
  confirmed untouched (envelope.py has zero diff). No spec-kitty-events/tracker
  imports were introduced (C-001 grep empty). Findings below are all severity <=3;
  none block approval.
findings:
  - id: WP03-001
    severity: 2
    title: Cross-module call into a leading-underscore "private" function
    evidence:
      - code: "src/specify_cli/orchestrator_api/commands.py:2088"
      - code: "src/specify_cli/cli/commands/lifecycle.py:66"
      - code: "src/specify_cli/orchestrator_api/commands.py:722"
    claim: >
      `specify` calls `specify_cli.cli.commands.lifecycle._create_mission_for_specify_json`,
      a leading-underscore name with no compatibility guarantee, across the
      orchestrator_api/cli.commands module boundary. This is directed explicitly by
      the WP03 task file (which names the function and forbids replicating its
      enrichment logic inline, correctly favoring single-canonical-authority over
      duplication) and matches an existing precedent in the very same file
      (commands.py:722 already imports `_mark_wp_merged_done` from
      `specify_cli.cli.commands.merge`), so it is not a novel architecture violation
      -- but the convention of reaching into underscore-prefixed names as a de facto
      stable seam is fragile and undocumented as a contract.
    remediation: >
      In a follow-up (not blocking WP03), export `_create_mission_for_specify_json`
      (and `_mark_wp_merged_done`) as a public, documented cross-module seam --
      either drop the leading underscore or add it to lifecycle.py's `__all__` with
      a docstring noting orchestrator_api depends on it -- so the dependency is
      visible to a future rename/refactor instead of silently breaking on it.
  - id: WP03-002
    severity: 2
    title: spec.md's own acceptance-scenario prose names the wrong payload field
    evidence:
      - code: "kitty-specs/design-phase-orchestrator-api-01M1HE6M/spec.md:73"
      - code: "src/specify_cli/cli/commands/agent/mission_setup_plan.py:1018"
    claim: >
      spec.md Acceptance Scenario 2 (User Story 1) says the `plan` verb returns
      `data.plan_path`; the verified, real key `agent_feature.setup_plan(...,
      json_output=True)` emits is `plan_file` (confirmed: no `"plan_path"` key
      exists anywhere in mission_setup_plan.py). The implementer caught this and
      correctly asserted the real key rather than propagating the spec's error
      (which would have required adding a duplicate field, violating Clarification
      1's unenriched-pass-through mandate), documenting the discrepancy in the test
      module's docstring -- the right implementation call, but the spec document
      itself still needs correcting.
    remediation: >
      Correct spec.md:73 (and check plan.md/tasks.md for the same stale name) to
      `data.plan_file`, so a future spec-fidelity check or a less careful
      implementer does not literally add a `plan_path` alias field to satisfy the
      wrong prose.
  - id: WP03-003
    severity: 2
    title: finalize_tasks' raw payload omits mission_slug, unlike setup_plan's
    evidence:
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:2607-2615"
      - code: "src/specify_cli/cli/commands/agent/mission_setup_plan.py:1018"
      - code: "src/specify_cli/orchestrator_api/commands.py:266"
    claim: >
      `agent_feature.finalize_tasks(..., json_output=True)`'s success payload dict
      (result/wp_count/updated_wp_count/modified_wps/.../tasks_dir/...) genuinely
      has no `mission_slug` key, while `agent_feature.setup_plan`'s payload does.
      This is an upstream inconsistency in these two sibling service functions, not
      something WP03 introduced or can fix (mission_finalize.py is outside WP03's
      owned_files). WP03's `payload.setdefault("mission_slug",
      _mission_identity_payload(mission_dir)["mission_slug"])` is the correct,
      minimal workaround -- it fills the transport contract's
      `required_payload_fields` using the already-resolved input identity, never
      fabricating or guessing data, and is a genuine no-op wherever the key is
      already present.
    remediation: >
      File a follow-up issue against `finalize_tasks` (mission_finalize.py:~2607)
      to add `mission_slug` to its canonical JSON payload for parity with
      `setup_plan`; once fixed, WP03's `tasks` verb's setdefault becomes a pure
      belt-and-brace no-op like `plan`'s already is.
  - id: WP03-004
    severity: 3
    title: mid8 collisions are structurally guaranteed within a ~256ms window, and mission_creation.py silently merges on collision
    evidence:
      - code: "src/mission_runtime/identity.py:84"
      - code: "src/specify_cli/core/mission_creation.py:666"
      - code: "src/specify_cli/core/mission_creation.py:708-718"
      - code: "src/specify_cli/core/mission_creation.py:786"
      - code: "tests/specify_cli/orchestrator_api/test_specify_plan_tasks_verbs.py:280-333"
    claim: >
      `resolve_mid8` returns `mission_id[:8]` -- the first 8 Crockford-base32
      characters of a ULID, which encode only the HIGH 40 bits of the 48-bit
      millisecond timestamp. This means mid8 (and therefore the
      `<slug>-<mid8>` mission directory name) is IDENTICAL for any two
      `create_mission` calls landing in the same ~256ms window, independent of the
      ULID's 80 bits of randomness -- not a probabilistic collision, a structural
      one. WP03's Acceptance Scenario 4 freezes `ULID` + `now_utc_iso` to make this
      deterministic for testing the duplicate-specify path; that is a LEGITIMATE
      test-determinism fix (the tracer accurately documents the real 256ms window
      and an observed flaky second-run failure without it -- it is not masking a
      test-level problem). Tracing what actually happens on a genuine
      (non-retry) collision, though, surfaces a real production risk this WP did
      not introduce and is not required to fix: `mission_creation.py` does
      `meta = load_meta_or_empty(feature_dir)` then almost entirely
      `meta.setdefault(key, ...)` calls, so on a collision the SECOND call's
      differing mission_type/friendly_name/purpose/created_at values are silently
      discarded in favor of the FIRST mission's already-persisted values -- but
      `meta["topology"] = topology.value` (mission_creation.py:786) is set
      UNCONDITIONALLY, so a second call with a different `--topology` (or one that
      mints a `coordination_branch`) WOULD produce a non-empty diff against the
      first mission's meta.json and commit successfully, silently attributing a
      mixed meta.json (first mission's identity + second call's topology) to the
      first mission_id -- without ever hitting the "nothing to commit" duplicate
      detection this WP's `_classify_specify_create_error` relies on. This is a
      silent-conflation/silent-success defect class (the charter's named dominant
      failure mode) in code outside WP03's authoritative_surface and owned_files.
    remediation: >
      File a ledger/GitHub issue against `mission_creation.py`'s directory-reuse
      path: before merging into an existing `feature_dir`, compare the freshly
      minted `mission_id` against any already-persisted `meta.json["mission_id"]`
      and fail closed with a structured "mid8 collision, retry" error when they
      differ, instead of silently reusing the directory via
      `load_meta_or_empty` + `setdefault`. Not a WP03 blocker.
