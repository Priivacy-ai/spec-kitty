      `import runtime` returns zero matches (only three more
      `mission_runtime` references at lines 420/423/431/1564, none of them
      `src/runtime/*`). The revised wording no longer reads as a claim
      about the substring "runtime" generally (which `mission_runtime`
      would have contradicted) and is now literally accurate as well as
      substantively correct — a genuine wording fix, not a no-op restatement.
