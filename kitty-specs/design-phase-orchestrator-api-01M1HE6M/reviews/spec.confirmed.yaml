- id: SPEC-GOV-001
  lens: Single-PR / fold-in-scope (C-004) + Scope
  severity: 5
  title: Decision-resolution FRs cover the wrong "decision" concept — the issue's actual DecisionKind
    ask is not addressed
  evidence:
  - artifact: spec.md § User Story 3, Clarification 3, FR-006–FR-009, C-003, FR-012
  - code: 'src/runtime/next/decision.py:64-68 (DecisionKind: step, decision_required, blocked, terminal,
      query)'
  - code: src/runtime/next/_internal_runtime/planner.py:388-397,417-432,461-470 (decision_required fires
      for DAG pending_decisions, blocking-audit checkpoints "audit:<step_id>", and missing-required-input
      decisions "input:<key>" — none of these are OriginFlow-scoped)
  - code: src/specify_cli/cli/commands/next_cmd.py:133-155,932-1000 (the actual resolution path for a
      DecisionKind.decision_required envelope is `spec-kitty next --answer --decision-id ...`, reading
      `_internal_runtime.engine._read_snapshot(...).pending_decisions` — a run-state snapshot store)
  - code: src/specify_cli/decisions/service.py:260-330 (open_decision persists into `decisions/index.json`
      via `_store.load_index(mission_dir)` — a completely separate ledger from the runtime run-snapshot
      above)
  - code: 'src/specify_cli/decisions/models.py:36-41 (OriginFlow: charter, specify, plan only)'
  claim: 'GitHub issue #3837 asks for "a decision-resolution verb covering the DecisionKind cases (runtime/next/decision.py)"
    — i.e. resolving the `spec-kitty next` control loop''s `decision_required` envelope, which fires for
    blocking-audit checkpoints and missing-required-input decisions at ANY DAG step (not limited to charter/specify/plan),
    and is resolved today only via `spec-kitty next --answer --decision-id ...` against a runtime run-snapshot
    store. The spec instead wraps `decisions/service.py`''s `open_decision`/`resolve_decision`/`defer_decision`/
    `cancel_decision`, which operate on a *different* persistence layer (`decisions/index.json`) scoped
    to `OriginFlow` (charter/specify/plan interview questions only) — a real, useful, but distinct mechanism.
    Clarification 3 asserts this narrowing is "a scope boundary, not an oversight" by citing `DecisionKind`''s
    member list side-by-side with `OriginFlow`''s, but `DecisionKind` members (`step`/`decision_required`/`blocked`/`terminal`/`query`)
    are envelope *kinds*, not origin flows, and the code shows `decision_required` is NOT bounded to charter/specify/plan.
    As written, this mission would ship FR-006–FR-009 / FR-012, close #3837 (C-004: single-PR, no follow-up
    issues), and still leave the literal ask — orchestrator-api resolution of a `next`-loop `decision_required`
    moment for an audit checkpoint or a missing required input in ANY phase — completely uncovered, with
    the spec''s own text framing that gap as already resolved.

    '
  remediation: 'Either (a) extend this spec''s scope to add an orchestrator-api verb wrapping the `next
    --answer` resolution path (sourced from `_internal_runtime.engine._read_snapshot` / `pending_decisions`,
    mirroring `next_cmd.py:_handle_answer`) so the actual `DecisionKind.decision_required` cases the issue
    names are reachable via orchestrator-api — this is the C-004-compliant default; or (b) if this class
    of decision is deliberately being left to a later mission, get that scope cut explicitly confirmed
    by the operator (not silently framed as "not an oversight" against a mismatched premise) and rewrite
    Clarification 3 to state plainly that `DecisionKind`/`next --answer` resolution and `OriginFlow`/`decisions/service.py`
    resolution are two distinct mechanisms, only the second of which this mission covers.

    '
- id: SPEC-GOV-002
  lens: Terminology
  severity: 3
  title: New verb names invert the established VERB-NOUN naming convention with no precedent
  evidence:
  - artifact: spec.md § FR-004–FR-009 (analyze-context, analyze-record, decision-open, decision-resolve,
      decision-defer, decision-cancel)
  - code: 'src/specify_cli/orchestrator_api/commands.py:1102,1141,1286,1409,1593,1680,1781 (existing mutating
      verbs: resolve-workspace, start-implementation, start-review, transition, append-history, accept-mission,
      merge-mission — all VERB-first, NOUN-second)'
  - code: src/specify_cli/cli/commands/decision.py:213,306,349,397 (host CLI is a `decision` Typer group
      with verb SUBcommands open/resolve/defer/cancel — group-then-verb, a different shape than a flat
      orchestrator-api verb name)
  claim: 'Every existing mutating orchestrator-api verb (bar the query-style `list-ready`/ `contract-version`/`mission-state`)
    follows VERB-NOUN order: resolve-workspace, start-implementation, start-review, append-history, accept-mission,
    merge-mission. The spec''s `decision-open`/`decision-resolve`/ `decision-defer`/`decision-cancel`
    invert this to NOUN-VERB — a naming scheme with no sibling precedent in the flat orchestrator-api
    verb space, produced by literally flattening the host CLI''s `decision <verb>` Typer group rather
    than following the orchestrator-api''s own convention. `analyze-context` and `analyze-record` are
    likewise ambiguous under the same lens, and `analyze-context` additionally implies the verb performs
    analysis, which directly contradicts C-002 ("this verb performs no analysis reasoning itself").

    '
  remediation: 'Rename to VERB-NOUN siblings, e.g. `open-decision` / `resolve-decision` / `defer-decision`
    / `cancel-decision`, and rename `analyze-context` to something that does not imply server-side reasoning
    (e.g. mirror the CLI command it wraps: `check-prerequisites` or `analysis-prerequisites`), keeping
    `record-analysis` (mirroring `record_analysis`) as the write verb''s name.

    '
- id: SPEC-GOV-003
  lens: Terminology + Falsifiability
  severity: 3
  title: FR-010's status/query verb has no concrete name anywhere in the spec
  merged_from:
  - SPEC-VERIFY-003
  evidence:
  - artifact: spec.md § Functional Requirements, FR-010 ("Design-phase status/query verb" — no verb name
      given)
  - artifact: spec.md § User Story 4 Acceptance Scenarios 1-4 and Success Criteria SC-006 (all refer only
      to "the design-phase status/query verb", never a literal CLI token)
  - artifact: 'spec.md § FR-001–FR-009, FR-011 (every sibling FR names a literal verb in its title: `specify`,
      `plan`, `tasks`, `analyze-context`, `analyze-record`, `decision-open`, etc.)'
  claim: 'Unlike every other FR in this spec, FR-010 never commits to a literal verb name — it is described
    only as "the design-phase status/query verb" throughout the FR table, User Story 4, the Acceptance
    Scenarios, and SC-006. This is the one FR where a failing-first ATDD test (charter C-011) cannot be
    written directly from the spec: the WP implementer must invent a name mid-plan or mid-WP, with no
    terminology review possible at spec time, no fixed CLI token for SC-006 ("documents every new verb")
    to be checked against, and a real risk it lands with an inconsistent shape relative to the sibling
    verbs (compounding SPEC-GOV-002) or a docs/tests mismatch across WP boundaries.

    '
  remediation: 'Name the verb explicitly in the spec (e.g. `design-status` or `mission-status`, matching
    `mission-state`''s existing noun-phrase query-verb style and mirroring `list-ready`''s naming pattern)
    and use that literal name consistently across FR-010''s title, User Story 4''s acceptance scenarios,
