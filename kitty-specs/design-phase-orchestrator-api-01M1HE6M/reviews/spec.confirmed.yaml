    '
- id: SPEC-GOV-005
  lens: Directive (canonical-sources / accuracy of existing-code representation) + Contracts
  severity: 4
  title: FR-001's specify-verb AC conflates two different JSON payload shapes as if they are the same
    canonical output
  merged_from:
  - SPEC-ARCH-001
  evidence:
  - artifact: spec.md § FR-001 Acceptance Scenario 1 ("matching what agent_feature.create_mission(...,
      json_output=True) already produces for the host CLI's --json path"), Clarification 1
  - code: src/specify_cli/cli/commands/lifecycle.py:66-92 (_create_mission_for_specify_json wraps agent_feature.create_mission(json_output=True),
      captures its stdout, and re-emits it through _with_specify_scaffold_state before it ever reaches
      the host CLI's --json caller)
  - code: src/specify_cli/cli/commands/lifecycle.py:51-58 (_with_specify_scaffold_state adds `scaffold_only`,
      `spec_state`, `next_action`, `next_step` fields not present in agent_feature.create_mission's raw
      payload)
  - code: src/specify_cli/cli/commands/lifecycle.py:160-166 (the specify() CLI command calls agent_feature.create_mission
      directly only when json_output=False; when json_output=True it calls _create_mission_for_specify_json
      instead, per lines 160-163)
  - code: src/specify_cli/cli/commands/lifecycle.py:222,273 (plan/tasks really are thin unenriched pass-throughs
      — unlike specify — confirming the divergence is specific to FR-001, not FR-002/FR-003)
  claim: 'FR-001''s AC and Clarification 1 assert `specify`/`plan`/`tasks` are "already thin shims" whose
    JSON output is `agent_feature.create_mission(..., json_output=True)`''s raw payload — true for `plan`/`tasks`
    (verified: they pass `json_output` straight through with no wrapper), but false for `specify`: the
    actual host-CLI `--json` path runs through `_create_mission_for_specify_json`, which captures `create_mission`''s
    stdout and enriches it with `scaffold_only`/`spec_state`/ `next_action`/`next_step` before the host
    CLI ever returns it. The spec''s own AC text says the new verb''s `data` should match "what agent_feature.create_mission(...,
    json_output=True) already produces for the host CLI''s --json path" — but those are two different
    shapes in the real code, and the AC doesn''t say which one is authoritative. A literal implementation
    against the raw `create_mission` output would diverge from the host CLI''s own `--json` contract the
    AC claims to mirror — a real parity gap, not merely additive.

    '
  remediation: 'Update FR-001 AC-1 and Clarification 1 to name `_create_mission_for_specify_json`''s enriched
    shape (including `scaffold_only`, `spec_state`, `next_action`, `next_step`) as the target the new
    `specify` verb''s `data` must match — either call `_create_mission_for_specify_json`''s enrichment
    step (or an equivalent) from the new verb, or explicitly scope out those fields as intentionally omitted
    — but state the decision, don''t let the spec assert an equivalence that doesn''t hold in the code.

    '
