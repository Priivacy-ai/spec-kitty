- id: SPEC-ARCH-003
  lens: Canonical source
  severity: 3
  title: FR-010's status/query verb has no precedent citation and duplicates territory the existing runtime/next
    workflow-DAG planner already owns
  evidence:
  - artifact: 'spec.md § Clarifications / Decision Records #1 (lines 313-325) — frames the whole mission
      as "surface work over an existing engine, not new engine work"'
  - artifact: spec.md § FR-010 / User Story 4 (lines 193-230) — no cited underlying function, unlike every
      other FR
  - code: src/runtime/next/_internal_runtime/planner.py:216-256 (resolve_next_workflow_action — resolves
      the next action for a mission from its workflow DAG, the engine backing `spec-kitty next`)
  - code: src/specify_cli/orchestrator_api/commands.py:756-816 (mission-state — the closest existing orchestrator-api
      analog, but it only reduces WP-loop events/dependency graph; it has nothing for design-phase artifact/decision
      state)
  claim: 'Every other FR in this mission (FR-001/002/003/004/005/006-009) cites a concrete existing function
    it wraps. FR-010 (the `list-ready`-equivalent design-phase status verb, priority High) cites none
    — spec.md never mentions `src/runtime/next/` anywhere except one incidental reference to `decision.py`''s
    `DecisionKind` enum (line 341). Yet `src/runtime/next/_internal_runtime/planner.py` already implements
    the canonical "what''s the next step for this mission" DAG resolver backing `spec-kitty next` across
    the full mission lifecycle (design phases included per CLAUDE.md: "the canonical mission-next command
    loop"). Without this citation, a plan-phase author has no signal to reuse that engine and is likely
    to hand-roll an independent artifact-presence-sniffing implementation (spec.md exists? plan.md exists?
    tasks/ finalized? analysis-report.md exists?) that will drift from the real workflow graph the first
    time a project customizes its `workflow_id` (`meta.json`) — precisely the "chase unification, not
    parity with a dead quirk" failure mode DIRECTIVE_044 warns against.

    '
  remediation: 'Add a Clarifications entry for FR-010 naming `src/runtime/next/_internal_runtime/planner.py`
    (`resolve_next_workflow_action` / the workflow-DAG engine) as the candidate authority to wrap or reduce
    from, or explicitly state (with rationale) why this mission deliberately does NOT reuse it and instead
    defines a new, narrower design-phase-only reduction. Either answer is fine; the spec currently gives
    neither, leaving FR-010 as the one FR with a real risk of unification-scope rework in plan/tasks.

    '
- id: SPEC-ARCH-004
  lens: Reflexivity + SK-93 artifact-verification mechanism precision & falsifiability
  severity: 4
  title: NFR-004/SC-005's SK-93 exit-code framing presumes analyze-record shells out as a subprocess with
    a code to distrust, but every existing orchestrator-api verb calls its underlying service functions
    in-process — where the real hazard is an unbounded HANG (SK-93 shapes 1/3/4), not a returned bad code,
    and the spec's test design would not catch it
  merged_from:
  - SPEC-VERIFY-002
  evidence:
  - artifact: spec.md § NFR-004 (lines 289) and SC-005 (lines 405-408) — "simulates a non-zero/timeout
      exit from the underlying record_analysis call"
  - artifact: 'spec.md § Clarifications #5 (lines 363-381) — SK-93''s exit-124-while-artifact-correct
      scenario is the stated basis'
  - code: src/specify_cli/orchestrator_api/commands.py:514-693 (the only subprocess/run_command usage
      in the file is for `git` operations; none of the 10 existing verbs shell out to another spec-kitty
      CLI command as a subprocess — they call service/status functions directly in-process; `grep -c subprocess`
      returns 0 for non-git usage)
  - code: src/specify_cli/cli/commands/agent/mission_record_analysis.py:228-401 (record_analysis is a
      Typer command function; called in-process it returns normally or raises, it does not produce an
      "exit code"; several early-exit branches at ~209-292 return/raise before write_analysis_report;
      the dossier-sync trigger at 380-388 is wrapped only in `with contextlib.suppress(Exception):`, which
      catches raised exceptions but does NOT bound a hang)
  - code: src/specify_cli/sync/layout_generation.py:676-694 (`_await_publish_or_loud`'s bounded-iteration
      wait — per SPEC-KITTY-LEDGER.md SK-93, this did not reliably terminate in 3 of 4 first-hand occurrences,
      all of which hung past the CALLER's own external `bash timeout 300` wrapper — i.e. the exit-124
      SK-93 observed was an OPERATOR-imposed bash timeout, not anything the Python call itself produces)
  claim: 'SPEC-KITTY-LEDGER.md''s SK-93 entry documents that `record_analysis`''s hang was only ever observed
    as exit 124 because the OPERATOR wrapped the CLI invocation in a bash `timeout 300` — the underlying
    Python call itself does not bound the dossier-sync-trigger wait. The 10 existing orchestrator-api
    verbs all invoke underlying logic in-process (confirmed: zero non-git subprocess usage anywhere in
    commands.py), and the spec''s Clarifications item 2 explicitly describes analyze-record as "wrapping
    record_analysis" at the exact line of the Typer command function that contains this same exception-only-suppressed
    dossier-sync trigger. If analyze-record reuses this code path in-process (the natural reading of "wrap
    record_analysis," consistent with how every other verb wraps its engine, and the precedent-consistent
    choice this mission is told to follow), then two problems compound: (1) there is no subprocess exit
    code to be untrustworthy in the first place — NFR-004/SC-005''s literal "non-zero/timeout exit" framing
    cannot be constructed against an in-process call without inventing a subprocess boundary the rest
    of this mission''s design doesn''t otherwise use; and (2) analyze-record itself can then HANG the
    orchestrator-api process indefinitely — no exit code, no timeout, no envelope at all — and NFR-004''s
    re-read fix never executes because control never returns to the wrapper to perform the re-read. SC-005''s
    stated test design ("simulates a non-zero/timeout exit") does not exercise this majority-shape failure
    mode from the ledger (SK-93 shapes 1, 3, 4 were silent-hang or exception-then-hang, not clean bad-exit-code
    returns) — the spec''s regression guard as written would not have caught most of the documented occurrences
    it claims to guard against.

    '
  remediation: 'State explicitly whether `analyze-record` invokes `record_analysis` via subprocess (introducing
    a new invocation pattern inconsistent with the other 9 new + 10 existing verbs — call out that inconsistency
    and its rationale if so) or in-process (the precedent-consistent choice). If in-process: (a) rewrite
    NFR-004/SC-005 so the regression guard is phrased as "artifact-derived success survives a swallowed/raised
    exception from the underlying write path," not "survives a non-zero/timeout exit code"; and (b) add
    an explicit requirement that analyze-record''s invocation of the underlying write path is TIME-BOUNDED
    at the orchestrator-api layer itself (e.g. an explicit, enforced timeout around the call, or excluding/short-circuiting
    the dossier-sync-trigger call entirely from the in-process wrap, calling only `write_analysis_report`/`commit_for_mission`
    directly) so a hang in `trigger_feature_dossier_sync_if_enabled` cannot block the orchestrator-api
    call forever — and add an Acceptance Scenario / SC test for the hang shape specifically (the underlying
    call never returns within a bounded window), not only the "returns a bad exit code" shape SC-005 currently
    describes.

    '
- id: SPEC-VERIFY-001
  lens: SK-93 artifact-verification mechanism precision & stale-artifact distinguishability
  severity: 4
  title: analyze-record's re-read check compares only the `verdict` field with no freshness/idempotency
    proof, so a STALE analysis-report.md from a prior call can make a genuinely-failed write look like
    success
  evidence:
  - artifact: spec.md § User Story 2, Acceptance Scenarios 2-4 ("re-reading kitty-specs/<slug>/analysis-report.md
      ... and confirming its verdict field matches what was submitted")
  - artifact: spec.md § NFR-004 ("MUST determine success by re-reading the artifact/state ... rather than
      trusting the underlying call's raw exit code")
  - artifact: 'spec.md § Edge Cases ("analyze-record is called twice with the same verdict ... returns
      success: true without attempting a duplicate write")'
  - code: src/specify_cli/analysis_report.py:505-524 (write_analysis_report frontmatter carries `generated_at`,
      `input_artifacts` hashes, `verdict`, `issue_counts`, `findings` -- a timestamp and richer content
      ARE available but AC2 names only `verdict`)
  - code: src/specify_cli/cli/commands/agent/mission_record_analysis.py:224-292 (several early-exit failure
      branches -- e.g. DIRTY_WORKTREE preflight at ~line 209, PlacementResolutionRequired, missing-body
      -- all return/raise BEFORE write_analysis_report is ever called, leaving any pre-existing analysis-report.md
      untouched)
  claim: 'NFR-004 and US2''s ACs specify the artifact-verification mechanism as "re-read analysis-report.md,
    confirm the verdict field matches what was submitted." This is under-specified: the write path has
    multiple early-exit failure branches (dirty worktree, unresolved placement, empty body) that never
    reach write_analysis_report, so a PRIOR call''s analysis-report.md (with its own verdict) can remain
    on disk untouched. If the current submission''s verdict happens to equal that stale file''s verdict
    (a real possibility -- `ready` and `blocked` are the only two live values, so a coin-flip match on
    retry is not a contrived edge case), a genuine failure of THIS call is misreported as success:true
    -- reproducing SK-93''s core hazard (exit code lies) in a new shape the spec does not close. Acceptance
    Scenario 4 assumes a clean binary ("artifact was NOT written" -> "finds no matching artifact") that
    does not cover "an OLD artifact exists and its verdict happens to coincide with the new submission."
    As written, the AC is falsifiable only for the cases it explicitly names (no file vs. correctly-written
    file); it is not falsifiable against the stale-coincidental-match case because no test can be derived
    from the spec text that would fail a naive verdict-only-equality implementation.

    '
  remediation: 'Add a freshness/idempotency requirement to NFR-004 and AC2: analyze-record must correlate
    the re-read artifact with THIS call, not merely with the submitted verdict value -- e.g., record a
    call-start timestamp before invoking the underlying write and require the re-read `generated_at` to
    be later than it, and/or compare a hash of the submitted report body/findings (not just the terminal
    `verdict` enum) against what was persisted. Add an explicit Acceptance Scenario for "a stale analysis-report.md
    exists with a verdict that coincidentally matches the new submission, but the underlying write for
    THIS call genuinely failed before reaching write_analysis_report" and require success:false in that
    case.

    '
- id: SPEC-VERIFY-004
  lens: SK-93 artifact-verification mechanism precision & stale-artifact distinguishability
  severity: 3
  title: Edge Cases only cover a SAME-verdict idempotent retry after a suspected SK-93 false failure;
    a retry with a CHANGED verdict is never addressed
  evidence:
  - artifact: 'spec.md § Edge Cases ("What happens when analyze-record is called twice with the same verdict
      (idempotent retry after an SK-93-style false-failure signal)? -> the second call re-reads the artifact,
      finds it already correctly written, and returns success: true without attempting a duplicate write")'
  - artifact: spec.md § User Story 2, Acceptance Scenarios 1-4 (no scenario covers a second call submitting
      a DIFFERENT verdict than what is currently on disk)
  claim: 'The realistic operational sequence this mission is meant to protect against is an ambiguous
    SK-93-style signal (non-zero exit / hang / lock warning) after which a host does not know whether
    the write landed. The spec''s only idempotent-retry Edge Case assumes the retry resubmits the SAME
    verdict. It never states what should happen when the host, suspecting a genuine failure (or because
    the analyzing agent revised its verdict between calls), retries with a DIFFERENT verdict than what
    is currently persisted on disk -- e.g. a first call intended to record `blocked`, the signal was ambiguous,
    and the retry submits `ready`. Nothing in the spec says whether this is treated as a fresh, independently-verified
    write attempt (the natural reading of NFR-004''s general mechanism) or flagged as a conflict against
    the previously-recorded verdict. Left unstated, an implementer could plausibly build either behavior,
    and a reviewer has no acceptance criterion to check the choice against.

    '
  remediation: 'Add an explicit Acceptance Scenario (User Story 2) or Edge Case: "Given analysis-report.md
    currently holds verdict X (from a prior call whose exit signal was ambiguous), when analyze-record
    is called again with a DIFFERENT verdict Y, then the call is treated as a fresh, independently-verified
    write attempt -- the re-read check compares against Y (this call''s submission), not against the stale
    X -- and reports success/failure based on whether Y actually landed."

    '
