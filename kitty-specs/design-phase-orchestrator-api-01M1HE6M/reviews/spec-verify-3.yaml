verdicts:
  - id: SPEC-FRESH2-001
    status: resolved
    evidence: >
      Judged against the operator ruling, not the original finding's framing.
      All five elements the ruling required are present in implementer-binding
      sections, not only in prose:
      (1) FR-014 (spec.md L515, FR table) requires extraction of
      `_pair_previous_lifecycle_record`, `_emit_mission_next_invoked`, and
      `_write_issuance_lifecycle_record` into a shared seam both the host CLI
      and orchestrator-api call, "without inlining CLI-layer helpers into the
      orchestrator-api layer or duplicating logic."
      (2) FR-013 (L514) is amended to require "full CLI event/lifecycle-log
      parity... depends on FR-014."
      (3) C-005 (L535, Constraints table) states FR-014 must be planned/
      implemented before FR-013, and requires "a shared regression test that
      fails if EITHER caller... stops writing the mission-event-log entry or
      the lifecycle records (SC-008)" — i.e. the ruling's behaviour-preservation
      + dual-failing-test requirement, stated as a binding constraint.
      (4) Acceptance Scenario 7 (L413-428, User Story 5) exercises all three
      side effects (pairing, event-log write, new issuance record) reached
      "through the shared seam extracted from next_cmd.py (FR-014)... never
      inlined or reimplemented inside the orchestrator-api layer."
      (5) SC-007 clause (c) (L914-924) and new SC-008 (L925-932) pin this as
      measurable success criteria — SC-008 explicitly is the dual-caller
      regression test the ruling required.
      Scope Notes (L954-965) also gained a `next_cmd.py` touch-point entry
      naming the exact three functions and their def lines (verified against
      the real file: L333 `_pair_previous_lifecycle_record`, L430
      `_write_issuance_lifecycle_record`, L863 `_emit_mission_next_invoked` —
      all correct), and states the plan phase must pick a target module that
      both `next_cmd.py` and `orchestrator_api/commands.py` can import without
      orchestrator-api reaching into CLI-layer code.
      User Story 5's composite-design prose (L294-319) and the Key Entities
      "Run decision" bullet (L541) both walk through the full 5-step sequence
      ((1) persist, (2) pair-previous, (3) decide_next, (4) emit event, (5)
      conditional issuance record) and explicitly say steps (2)/(4)/(5) are
      "REQUIRED, not optional or deferred" per the ruling.
    note: >
      The fix goes slightly beyond the ruling's minimum ask by also adding
      Clarification 7, a full rationale writeup mirroring the ruling's own
      four rationale points — this is documentation, not a substitute for the
      binding FR/AC/SC changes, all of which independently exist and were
      verified above. No way in which the fix falls short of the ruling was
      found. The ruling's scope consequence (a plan-phase work package for
      the extraction, sequenced before FR-013) is correctly deferred to the
      plan phase — this spec phase only needs to (and does) state that
      requirement via C-005 and FR-014's "Sequenced BEFORE FR-013 in the
      plan/tasks phases" language, which it does.

  - id: SPEC-FRESH2-002
    status: resolved
    evidence: >
      The Key Entities "Run decision" bullet (spec.md L541) — the place the
      response shape is actually defined, not merely a clarification aside —
      now states explicitly: "`data` carries NO equivalent of the CLI's
      second extra key, `answer` (the submitted answer text, echoed back by
      `_print_decision`'s `d[\"answer\"] = answer` at `next_cmd.py:915`):
      that echo is intentionally OMITTED because the host already possesses
      the value it submitted in its own request." The identical statement
      also appears in User Story 5's Independent Test (L345-346) and in
      Clarification 3, Mechanism B (L680-683, "`data` carries NO equivalent
      of the CLI's second extra key, `answer`..."). All three locations agree;
      no other section of the spec (AC1, AC3, SC-007) implies `data` should
      carry an `answer` echo, so nothing contradicts the stated choice.
      `next_cmd.py:915` (`d["answer"] = answer`) verified against the real
      file — correct.
    note: >
      The fixer's chosen answer ("intentionally omitted, host already has the
      value") is the ruling-sanctioned acceptable answer, and it is anchored
      in the Key Entities definition itself, satisfying "not only in a
      clarification note."

