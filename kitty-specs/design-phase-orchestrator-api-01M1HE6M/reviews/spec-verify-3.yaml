      The fixer's second claimed correction, `decision.py:64-68` ->
      `:63-67`, is also verified correct: `decision.py:63-67` is exactly the
      `DecisionKind` member block (`step`, `decision_required`, `blocked`,
      `terminal`, `query`) the citation describes.
      Independent spot-check of citations NOT touched by this fix round (11
      total, well over the requested 8), all verified against the real repo
      files and all correct: `next_cmd.py:213-221` (`_maybe_handle_answer`
      call), `next_cmd.py:244-246` (`_pair_previous_lifecycle_record` call),
      `next_cmd.py:251-258` (`_emit_mission_next_invoked` call),
      `next_cmd.py:263-269` (`_write_issuance_lifecycle_record` call),
      `next_cmd.py:333` / `:430` / `:863` (the three functions' `def` lines),
      `next_cmd.py:743-750` (`_validate_result_and_answer`),
      `next_cmd.py:910-919` / `:913-915` (`_print_decision` and its
      `answered`/`answer` key assignment), `next_cmd.py:923-1018`
      (`_handle_answer`), `decision.py:413` (`def decide_next`),
      `runtime_bridge.py:2191` (`def decide_next_via_runtime`),
      `runtime_bridge.py:2587-2662` (`def answer_decision_via_runtime`
      through its closing paren), `commands.py:1258-1266` and `:1352-1360`
      (`start-implementation`/`start-review` `wp_id`/`from_lane`/`to_lane`
      dict literals). Every citation checked lands exactly where the spec
      claims.
    note: >
      No further citation drift found. The fixer's "swept all 48 citations"
      claim could not be exhaustively verified (only a sample was checked),
      but the sample — chosen across every citation directly touched by or
      adjacent to this fix round, plus several untouched ones — was 100%
      accurate, which is strong evidence the sweep was real rather than a
      restated claim.

