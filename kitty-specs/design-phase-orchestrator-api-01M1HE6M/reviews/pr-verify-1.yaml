findings:
  - id: PR-TESTS-002
    status: UNRESOLVED
    how_verified: >
      Called the live `_classify_check_prerequisites_error` / `_sanitize_forbidden_error_code`
      functions directly (not the fixer's own test) and constructed four synthetic payloads to
      defeat the recursive sanitizer: (1) forbidden token inside a list plus inside a dict value
      nested in that list -- SCRUBBED; (2) forbidden token as a dict KEY (`{"details":
      {"FEATURE_CONTEXT_UNRESOLVED": "..."}}`) -- LEAKED, key text passes through untouched
      because the sanitizer only recurses into dict VALUES via `{k: recurse(v) ...}`, never `k`
      itself; (3) forbidden token embedded as a SUBSTRING of a larger string value (e.g.
      `"message": "detection failed: FEATURE_CONTEXT_UNRESOLVED because ..."`) -- LEAKED, because
      the sanitizer does exact equality (`value == forbidden`) not substring replacement; (4)
      forbidden token nested three levels deep (dict-in-list-in-dict) as a plain value --
      SCRUBBED. Cross-checked against the REAL production payload shape emitted by
      `_build_setup_plan_detection_error` (mission_check_prerequisites.py -> mission_feature_resolution.py:374-410):
      today's actual delegate payload (`error_code`, `mission_flag`, `spec_kitty_version`,
      `error`, `available_missions`, `example_command`, `remediation`) never places the forbidden
      string as a dict key or as a message substring, so the ORIGINAL severity-4 live defect (the
      one R3 confirmed and this fix targets) IS closed for today's real code path. But the fix's
      own claim -- "recursively scrubs the *whole* payload" / test asserts "no forbidden token
      appears anywhere in the serialized envelope" -- is unconditional and does not hold in
      general: two concrete, reproducible shapes leak the forbidden string through the "same
      response whose top-level error_code claims to have translated it" bar the fixer's own
      docstring sets.
    residual_risk: >
      If any future delegate payload nests the forbidden code as a dict key, or interpolates it
      into a larger message string, it leaks past this sanitizer and reaches the public envelope
      verbatim -- silently, with no test catching it, exactly the failure mode PR-TESTS-002 exists
      to prevent. Recommend: sanitize dict keys too, and use substring replacement
      (`str.replace`) instead of exact-match on string values.
