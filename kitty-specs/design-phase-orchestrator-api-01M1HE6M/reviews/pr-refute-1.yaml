findings:
  - id: PR-BOUNDARY-001
    verdict: CONFIRMED
    severity_original: 3
    severity_final: 3
    rationale: >
      Citations check out exactly. Confirmed commands.py:3299 contains
      `from runtime.next._internal_runtime.engine import _read_snapshot`
      inside `answer_decision`, and `git diff $(git merge-base main HEAD)..HEAD`
      shows this import (and the surrounding auto-resolve branch) is new code
      added by this mission's WP08 commit (b2b99d8a3), not inherited debt.
      Read `runtime_bridge_engine.py`'s module docstring and
      `tests/runtime/test_bridge_engine.py`'s `_ENGINE_PLANNER_PRIVATE_NAMES`
      guard myself: the guard is real and does enumerate `_read_snapshot` as
      one of the six concentrated names, but its architecture-guard walk is
      scoped to `src/runtime/next/*.py` only (verified via
      `_SRC_RUNTIME_NEXT = .../src/runtime/next` in the test file) -- both
      `commands.py` (orchestrator_api) and `next_cmd.py` (cli/commands) live
      outside that tree, so neither is caught, exactly as claimed. The
      three-way pending-decision split (zero/one/many) in commands.py:3316-3335
      is a verbatim duplicate of next_cmd.py:829-841's own branch. Real,
      independently-maintained duplication of parity-critical logic; behavior
      is correct today (mirrors the host CLI exactly), so this is architectural
      debt/hazard, not a live wrong-behavior bug -- severity 3 (bounded blast
      radius, unguarded hazard) stands as assigned.
    evidence: >
      `git diff $(git merge-base main HEAD)..HEAD -- src/specify_cli/orchestrator_api/commands.py`
      shows the `from runtime.next._internal_runtime.engine import _read_snapshot`
      import at (new) line 3299 was added by this mission. `grep -n "_read_snapshot\|_internal_runtime.engine" commands.py`
      confirms it appears only once (3299) with two call sites (3321, 3343).
      Read `tests/runtime/test_bridge_engine.py` lines 1-80: architecture guard
      walks `Path(__file__).resolve().parents[2] / "src" / "runtime" / "next"`
      only -- commands.py and next_cmd.py are both outside that path.
