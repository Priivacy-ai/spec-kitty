  - id: PR-CONTRACT-001
    verdict: CONFIRMED
    severity_original: 3
    severity_final: 3
    rationale: >
      Independently reproduced from my own script (not the finding's own
      test), driving BOTH surfaces against the identical real on-disk state:
      built a real mission via the orchestrator-api specify/plan/tasks verbs,
      dirtied the tree with one untracked file, then called (1) the
      orchestrator-api `record-analysis` app and (2) the host CLI's own
      `mission_record_analysis.record_analysis` function directly, both with
      an empty --input-file. Orchestrator-api returned
      `RECORD_ANALYSIS_EMPTY_BODY`; the host CLI returned `DIRTY_WORKTREE`
      with `dirty_paths: ["untracked-dirty-marker.txt"]` -- for the same
      on-disk state, confirming the ordering fork exactly as claimed. Citations
      match live code: commands.py's record_analysis body-read/empty-check
      (line ~2687-2699) and carrier-parse (~2703-2706) genuinely run before
      placement resolution (~2711-2719) and the dirty-worktree preflight
      (~2723-2740); the host CLI's mission_record_analysis.py genuinely runs
      placement + `_enforce_analysis_report_write_preflight` (274-286) before
      `body = sys.stdin.read()` (291-293).
      Severity: re-graded and kept at 3, not raised to 4, on the following
      argument -- in BOTH orderings the operation correctly refuses to write
      (no data is ever written on a dirty tree with an empty body); this is
      not a fail-open where fail-closed was specified, and it does not ship a
      wrong result. The defect is real and exactly the class the ruling's
      full-lifecycle-parity mandate cares about, and it is the third instance
      after WP05-001/WP08-001, which argues for urgency -- but its blast
      radius is bounded to which *error_code* an external orchestrator sees
      under one specific simultaneous-failure condition (dirty tree AND empty
      body), not to whether the write is safely refused. That is squarely "a
      real defect with bounded blast radius... an unguarded hazard" (the rubric's
      3), not "silently wrong behaviour" (the rubric's 4) -- nothing is silent
      here, both surfaces loudly refuse and report a real error_code, just a
      different one.
    evidence: >
      Repro script (built a real mission, dirtied tree, empty stdin body via
      both surfaces): orchestrator-api output
      `{"success": false, "error_code": "RECORD_ANALYSIS_EMPTY_BODY", ...}`;
      host CLI output
      `{"success": false, "error_code": "DIRTY_WORKTREE", "dirty_paths": ["untracked-dirty-marker.txt"], ...}`.
      Same on-disk state, same call, different first error_code -- live-confirmed.
  - id: PR-CONTRACT-002
    verdict: CONFIRMED
    severity_original: 2
    severity_final: 2
    rationale: >
      Verified `DecisionErrorCode.VERIFY_DRIFT = "DECISION_VERIFY_DRIFT"` at
      models.py:62 is declared but `grep -n "DecisionErrorCode\." service.py`
      shows only 6 other members raised (MISSION_NOT_FOUND x3,
      EVENT_REPAIR_FAILED x4, MISSING_STEP_OR_SLOT, ALREADY_CLOSED,
      NOT_FOUND, TERMINAL_CONFLICT) -- VERIFY_DRIFT is never raised, confirmed
      dormant. Confirmed absent from `upstream_contract.json`'s
      `orchestrator_api.allowed_error_codes` via direct JSON load (also
      confirmed `forbidden_error_codes` is only `['FEATURE_NOT_FOUND',
      'FEATURE_NOT_READY']` -- unrelated). Confirmed the four decision verbs'
      `except DecisionError as exc: _fail(cmd, exc.code.value, str(exc), exc.details)`
      pattern exists (found at lines 2956, 3019, 3071, 3123 -- note: the
      finding cites 2938-2945/3000-3007/3057-3064/3109-3116, each ~15-18
      lines earlier than the real `except` block; the code IS present and
      matches the claim verbatim, just at drifted line numbers, likely from
      edits after the finding was authored). Confirmed
      `tests/contract/test_orchestrator_api.py::TestAllowedErrorCodes::test_literal_failure_codes_are_contract_allowed`
      uses a regex `_fail\(\s*[^,]+,\s*["\']([A-Z0-9_]+)["\']` that only
      matches literal string arguments -- `exc.code.value` is a variable
      expression, so this static check structurally cannot see runtime-
      propagated decision codes. All correct and currently unreachable/latent
      -- severity 2 (latent-but-unreachable) as assigned; kept.
    evidence: >
      `grep -n "DecisionErrorCode\." src/specify_cli/decisions/service.py`
      -- no VERIFY_DRIFT hit. `python3 -c "import json; d=json.load(open('src/specify_cli/core/upstream_contract.json'));
      print(d['orchestrator_api']['allowed_error_codes'])"` does not contain
      DECISION_VERIFY_DRIFT. `grep -n "except DecisionError as exc:" commands.py`
      -> 2956, 3019, 3071, 3123 (finding cites 2938/3000/3057/3109, off by
      ~15-18 lines but same content confirmed present).
  - id: PR-TESTS-001
    verdict: CONFIRMED
    severity_original: 3
    severity_final: 3
    rationale: >
      Confirmed zero coverage across the WHOLE tests/ tree, not just the
      named file: `grep -rln "PLAN_SETUP_FAILED\|TASKS_FINALIZE_FAILED" tests/`
      and `grep -rln "MISSION_CREATE_FAILED" tests/` both return no hits
      anywhere in the repo. Then independently reproduced the uncovered
      branches myself (not the finding's own test): built a real mission,
      monkeypatched `specify_cli.cli.commands.agent.mission.setup_plan` and
      `.finalize_tasks` to raise `typer.Exit(1)` with non-JSON stdout, and
      called the real `plan`/`tasks` orchestrator-api verbs. Both correctly
      returned `success: false` with `PLAN_SETUP_FAILED` /
      `TASKS_FINALIZE_FAILED` respectively -- no crash, no false success.
      This directly answers the prompt's "verify the unreached branch isn't
      also wrong": it isn't. Genuine coverage gap, correct production
      behavior today -- severity 3 (missing regression test on a live path)
      as assigned; kept.
    evidence: >
      Repro output: plan() -> `{"success": false, "error_code": "PLAN_SETUP_FAILED", "data": {"raw_output": "totally not json...", ...}}`;
      tasks() -> `{"success": false, "error_code": "TASKS_FINALIZE_FAILED", ...}`.
      Zero-coverage grep across tests/ tree confirmed no hits for either
      fallback code or MISSION_CREATE_FAILED anywhere.
  - id: PR-TESTS-002
    verdict: CONFIRMED
    severity_original: 3
    severity_final: 4
    rationale: >
      Confirmed the coverage gap: grepped every test file that mentions
      FEATURE_CONTEXT_UNRESOLVED (14 files) and checked each -- none call the
      orchestrator-api's `check_prerequisites()`; the only hit close to it
      (`tests/agent/test_agent_feature.py`) imports `app` from
      `specify_cli.cli.commands.agent.mission`, i.e. tests the HOST CLI
      directly, never the orchestrator-api translation. Then I independently
      reproduced the branch myself: monkeypatched
      `mission_check_prerequisites.check_prerequisites` to raise
      `typer.Exit(1)` with a real production-shaped payload
      (`{"error_code": "FEATURE_CONTEXT_UNRESOLVED", ...}`, matching the exact
      shape `_build_setup_plan_detection_error` genuinely emits per
      mission_check_prerequisites.py:425-430) and called the real
      orchestrator-api `check-prerequisites` verb.
      RAISING SEVERITY 3->4: this reproduction surfaced a genuine LIVE defect
      beyond what the finding claimed. The top-level `envelope["error_code"]`
      IS correctly translated to `MISSION_NOT_FOUND` -- but
      `_classify_check_prerequisites_error` returns the RAW, untouched
      delegate `payload` as its third tuple element, which `_fail` spreads
      verbatim into `data`. Since the raw payload's own key is
      `"error_code": "FEATURE_CONTEXT_UNRESOLVED"`, that exact forbidden
      string leaks unmodified into `envelope["data"]["error_code"]` in the
      SAME response whose top-level error_code was "correctly" translated.
      This is not hypothetical/future -- it happens on every real
      FEATURE_CONTEXT_UNRESOLVED delegate failure TODAY. I confirmed no
      existing check would catch it: `upstream_contract.json`'s
      `orchestrator_api.forbidden_error_codes` is only
      `['FEATURE_NOT_FOUND', 'FEATURE_NOT_READY']` (does not even list
      FEATURE_CONTEXT_UNRESOLVED) and is checked only against the top-level
      `envelope["error_code"]` in
      `tests/contract/test_orchestrator_api.py::TestMissionNotFoundError`;
      `forbidden_payload_fields` (`['feature_slug']`) checks dict KEY names,
      not values, so a value of "FEATURE_CONTEXT_UNRESOLVED" nested under the
      legitimate key `error_code` is invisible to it. The function's own
      docstring says this code "must NEVER cross onto the orchestrator-api
      surface verbatim (Terminology Canon...)" -- it does, silently, today.
      That is exactly the rubric-4 bar: silently wrong behaviour on a live
      code path, not merely an untested one.
    evidence: >
      Repro output:
      `{"success": false, "error_code": "MISSION_NOT_FOUND", "data": {"valid": false, "error_code": "FEATURE_CONTEXT_UNRESOLVED", "error": "simulated feature-context resolution failure", "message": "..."}}`
      -- top-level error_code correctly says MISSION_NOT_FOUND while
      data.error_code still literally says FEATURE_CONTEXT_UNRESOLVED.
      `python3 -c "import json; d=json.load(open('src/specify_cli/core/upstream_contract.json')); print(d['orchestrator_api']['forbidden_error_codes'], d['orchestrator_api']['forbidden_payload_fields'])"`
      -> `['FEATURE_NOT_FOUND', 'FEATURE_NOT_READY'] ['feature_slug']` --
      neither would catch this leak. Confirmed the real production payload
      shape at src/specify_cli/cli/commands/agent/mission_check_prerequisites.py:424-430
      (`_build_setup_plan_detection_error(..., error_code="FEATURE_CONTEXT_UNRESOLVED", ...)`)
      matches what I mocked. Not documented as intentional anywhere: grepped
      spec.md/plan.md/reviews/spec.ruling.md for FEATURE_CONTEXT_UNRESOLVED,
      no hits.
  - id: PR-TESTS-003
    verdict: CONFIRMED
    severity_original: 3
    severity_final: 3
    rationale: >
      Confirmed zero coverage across the whole tests/ tree for
      RECORD_ANALYSIS_MALFORMED_CARRIER and PLACEMENT_RESOLUTION_REQUIRED
      through the orchestrator-api surface: the only other hits
      (test_record_analysis_placement.py) exercise the HOST CLI's
