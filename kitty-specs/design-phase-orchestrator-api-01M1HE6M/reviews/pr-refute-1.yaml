      returned `RECORD_ANALYSIS_MALFORMED_CARRIER` with the real YAML parse
      error message; (2) dirty tree + a NON-empty, well-formed body (isolating
      this from the PR-CONTRACT-001 ordering fork) -> orchestrator-api
      correctly returned `DIRTY_WORKTREE` with the real dirty_paths list. Both
      confirm production is correct when these branches ARE reached in
      isolation. The third (PLACEMENT_RESOLUTION_REQUIRED) I did not drive
      live but read directly: commands.py's
      `except PlacementResolutionRequired as exc: _fail(cmd, "PLACEMENT_RESOLUTION_REQUIRED", str(exc), {"mission_slug": mission_slug})`
      is a trivial typed-exception pass-through matching the exact working
      pattern I already verified for MALFORMED_CARRIER and DIRTY_WORKTREE, so
      I have no first-hand basis to doubt it and no reason to raise severity
      on it. Real, live-path coverage gap; production correct where checked --
      severity 3 as assigned; kept.
    evidence: >
      Repro output: malformed-carrier scenario ->
      `{"success": false, "error_code": "RECORD_ANALYSIS_MALFORMED_CARRIER", "data": {"message": "Invalid YAML in analysis-findings carrier: ..."}}`;
      dirty-tree-with-good-body scenario ->
      `{"success": false, "error_code": "DIRTY_WORKTREE", "data": {"dirty_paths": ["untracked-dirty.txt"], ...}}`.
      Both driven via a real mission built through the orchestrator-api
      specify/plan/tasks verbs, not via the finding's own test file.
