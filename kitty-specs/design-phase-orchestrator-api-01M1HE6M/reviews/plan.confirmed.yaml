    '
- id: PLAN-ARCH-001
  duplicate_of: []
  also_reported_as:
  - PLAN-VERIFY-004
  lens: Gate Set completeness (CI coverage contract) / Coverage floors
  severity: 4
  title: Plan's Gate Set omits the enforced diff-coverage critical-path gate (90% on src/runtime/next/*),
    and WP02's proposed test-file location sits outside the test paths that gate's coverage jobs scan
  evidence:
  - artifact: plan.md § (e) Gate Set, item 3 (SC-008 shared regression test location) and § Project Structure
      (tests/ tree)
  - code: '.github/workflows/ci-quality.yml:1414-1436 (fast-tests-next job: pytest over tests/next/ tests/specify_cli/next/
      tests/runtime/ only, with --cov=src/runtime/next)'
  - code: .github/workflows/ci-quality.yml:2757-2801 (integration-tests-next job, same three-path scope,
      same --cov=src/runtime/next)
  - code: .github/workflows/ci-quality.yml:3305-3376,3391,3422-3425 (diff-coverage job, [ENFORCED], --fail-under=90;
      'src/runtime/next/*' is a critical_paths entry; required member of quality-gate.needs, ci-quality.yml:4276-4281)
  - code: src/specify_cli/orchestrator_api/commands.py, tests/specify_cli/cli/commands/ — the slow-tests
      job that runs this directory uses --cov=specify_cli --cov=charter --cov=doctrine only (ci-quality.yml:3063-3066),
      never src/runtime/next
  - code: tests/specify_cli/next/ already holds test_runtime_bridge.py, test_runtime_bridge_dispatch.py
      — the existing repo convention for testing other src/runtime/next/ top-level modules
  claim: 'Plan §(e) explicitly checked and correctly excluded the kernel-coverage and mission-loader-coverage
    per-package gates as not applicable, but never mentions the diff-coverage critical-path gate, which
    DOES apply: `src/runtime/next/*` (WP02''s new next_invocation_lifecycle.py) is a critical_paths entry
    at a hard 90%-on-changed-lines floor, and is a required member of the blocking quality-gate aggregator.
    Worse: the plan''s own proposed location for the SC-008 shared regression test, `tests/specify_cli/cli/commands/test_next_invocation_lifecycle_seam.py`,
    is OUTSIDE the only three test-path roots (`tests/next/`, `tests/specify_cli/next/`, `tests/runtime/`)
    that the two jobs producing `--cov=src/runtime/next` coverage actually scan — and outside the scope
    of every other job that does run `tests/specify_cli/cli/commands/` (which never covers `src/runtime/next`).
    A well-tested new module would still fail the enforced diff-coverage gate purely from file placement,
    blocking the mission''s single mandated PR (C-004).

    '
  remediation: 'Add `diff-coverage` as an explicit Gate Set item citing the `src/runtime/next/*` critical-path
    entry and its 90% floor. Then either (a) move the shared regression test to `tests/specify_cli/next/`
    (matching the existing runtime_bridge.py/decision.py test precedent) so fast-tests-next/integration-tests-next
    collect it, or (b) keep CLI-path assertions co-located under `tests/specify_cli/cli/commands/` but
    add a SEPARATE unit-test file for next_invocation_lifecycle.py''s functions directly under `tests/specify_cli/next/`
    (or `tests/runtime/`) so the new module has coverage from a scanned path. State the choice explicitly
    in plan.md.

    '
- id: PLAN-ARCH-002
  lens: FR-014 target-module evidentiary claims
  severity: 2
  title: Precedent citations for the seam's placement support module placement, not the actually-new orchestrator_api→runtime.next
    import direction they're offered to justify
  evidence:
  - artifact: plan.md § (a) FR-014 Seam Extraction — Target Module Decision, final bullet
  - code: src/specify_cli/orchestrator_api/commands.py:32-66 (zero existing imports from runtime.next)
  - code: src/specify_cli/cli/commands/next_cmd.py:51,67,195,817,984,1002 (next_cmd.py already imports
      runtime.next.decision / runtime_bridge / _internal_runtime.engine directly — the real, on-point
      precedent)
  - code: src/runtime/next/decision.py:33,188; src/runtime/next/runtime_bridge.py:319 (the plan's actual
      citations — all runtime.next → specify_cli.*, the reverse direction)
  claim: 'The plan''s cited precedents (decision.py:33/188, runtime_bridge.py:319) are exact but establish
    the reverse import direction from the new edge WP08 introduces (orchestrator_api/commands.py → runtime.next,
    which today has zero such imports). The real supporting precedent exists (next_cmd.py already imports
    runtime.next directly) but isn''t cited. The placement conclusion is still correct — this is an evidentiary
    precision gap.

    '
  remediation: 'In plan §(a), add a sentence citing next_cmd.py''s existing direct imports of runtime.next.decision/runtime_bridge
    as the precedent for a CLI-layer module calling into runtime.next, and state explicitly that orchestrator_api/commands.py
    has no such import today — WP08 introduces it for the first time (expected, ruling-mandated).

    '
