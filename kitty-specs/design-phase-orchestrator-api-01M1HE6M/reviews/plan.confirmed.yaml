- id: PLAN-VERIFY-002
  lens: SK-93/NFR-004 mechanism concreteness
  severity: 2
  title: NFR-004 mechanism-choice paragraph names WP08 as the decider, contradicting the WP Breakdown
    table which assigns record-analysis/NFR-004 to WP04
  evidence:
  - artifact: plan.md § (j) SK-93 Implementation Approach, point 2
  - artifact: plan.md § Work Package Breakdown table (WP04 row owns FR-004/FR-005/NFR-004; WP08 row owns
      FR-013 answer-decision, unrelated)
  claim: 'Section (j) point 2 names "the WP08-adjacent implementer" then, in the same sentence, "WP04"
    as the owner of the same NFR-004 mechanism-choice decision. WP08 is an unrelated verb (answer-decision).
    An agent implementing WP08 reading only this paragraph could believe the record-analysis decision
    is theirs.

    '
  remediation: 'Change "The WP08-adjacent implementer decides" to "The WP04 implementer decides" for internal
    consistency.

    '
- id: PLAN-VERIFY-003
  lens: SC-008 shared regression test concreteness
  severity: 3
  title: The SC-008 shared fixture/helper's own call contract is never named, only the extracted seam
    functions' signatures are
  evidence:
  - artifact: plan.md § (a) "Extracted function names" (exact signatures for the three seam functions)
  - artifact: plan.md § Parallel Work Analysis, "Integration tests" paragraph
  - artifact: plan.md § (e) Gate Set, item 3
  claim: 'The plan is exact about the three extracted seam functions'' signatures, but never names the
    shared TEST fixture/helper''s own signature or assertion contract — what it takes as its "caller under
    test" parameter (a CLI-invocation for WP02''s path vs. an orchestrator-api-verb call for WP08''s path),
    or exactly what state/file it reads to verify each of the three side effects. Without a named contract,
    WP02 (authored first) may build test scaffolding shaped only for its own case, forcing a WP08-time
    rewrite rather than a true extension — the exact SC-008 drift failure mode this test exists to prevent.

    '
  remediation: 'Name the shared helper''s contract explicitly, e.g. a module-level `assert_lifecycle_seam_effects(feature_dir,
    repo_root, mission_slug, run_action) -> None` helper, where `run_action` is a zero-arg callable performing
    the action under test; the helper reads mission-events.jsonl via mission_v1.events.read_events for
    the MissionNextInvoked entry and invocation.lifecycle.read_lifecycle_records for the paired-completion
    and new started records. Pin this in plan.md or hand it to the tasks phase as a WP02 deliverable WP08
    is contractually bound to reuse unmodified in shape.

    '
