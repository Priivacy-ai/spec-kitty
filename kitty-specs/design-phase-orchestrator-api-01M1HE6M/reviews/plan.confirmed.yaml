findings:
- id: PLAN-GOV-001
  lens: Campsite scope
  severity: 3
  title: 'Plan''s campsite-clean ''no debt found'' claim is contradicted by an existing `# type: ignore`
    inside one of the three functions WP02 extracts'
  evidence:
  - artifact: plan.md § (g) Campsite-Clean Scope (WP01)
  - code: src/specify_cli/cli/commands/next_cmd.py:424
  claim: 'plan.md § (g) states, about the exact three functions FR-014/WP02 extracts, "No lint/type/test
    debt was found directly IN the three functions being extracted." This is false for one: `_pair_previous_lifecycle_record`
    (next_cmd.py:333-429) contains a live suppression at next_cmd.py:424 — `phase=phase,  # type: ignore[arg-type]`
    — inside the `write_paired_completion(...)` call. These functions are being promoted to a public module-level
    API per plan.md § (a); an un-investigated type suppression is worth a second look before it becomes
    public-surface debt.

    '
  remediation: 'Correct plan.md § (g)''s next_cmd.py paragraph to acknowledge next_cmd.py:424, and either
    fold a one-line fix into WP01 if addressable, or explicitly record why it is carried forward unresolved.

    '
- id: PLAN-GOV-002
  lens: MISSION-DERIVED LENS — gate-set completeness and correctness
  severity: 2
  title: Gate Set item 10 says the Contextive glossary gate 'does NOT apply', but the CI job's own path
    filter matches this mission's touched files and the check step will actually run
  evidence:
  - artifact: plan.md § (e) Gate Set, item 10
  - code: .github/workflows/ci-quality.yml:851-872
  claim: 'The check step (ci-quality.yml:851) is gated on whether the diff touches `src/specify_cli/**`
    (among other paths, ci-quality.yml:863-869) — and this mission modifies files under that path. The
    check WILL execute (expected to pass trivially, since neither `docs/context/*.md` nor `.kittify/traceability/contextive-map.yaml`
    is touched), but "does NOT apply" mischaracterizes an active, running gate as a skipped one — conflating
    gate applicability with gate outcome.

    '
  remediation: 'Reword item 10 to: "Contextive glossary check RUNS (diff matches `src/specify_cli/**`)
    but is expected to pass trivially — no `docs/context/*.md` or contextive-map.yaml change is needed."

    '
- id: PLAN-GOV-003
  lens: Scope
  severity: 1
  title: Constitution/Charter Check and Gate Set cite C-001/C-004/C-005 by ID repeatedly but never cite
    C-002 or C-003 by ID, though both bound this mission's scope
  evidence:
  - artifact: plan.md § Constitution / Charter Check; § (e) Gate Set; § (l) PR Shape Assessment
  - artifact: spec.md § Constraints, C-002, C-003
