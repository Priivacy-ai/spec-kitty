- id: PR-CONTRACT-002
  lens: error-code-fidelity
  severity: 2
  title: DecisionErrorCode.VERIFY_DRIFT is dormant and absent from upstream_contract.json's allow-list;
    the mission's four new decision verbs propagate any DecisionErrorCode verbatim with no allow-list
    guard
  evidence:
  - code: src/specify_cli/decisions/models.py:62 (VERIFY_DRIFT = "DECISION_VERIFY_DRIFT", declared, never
      diffed by this mission)
  - code: 'src/specify_cli/orchestrator_api/commands.py:2938-2945,3000-3007,3057-3064,3109-3116 (open/resolve/defer/cancel-decision:
      `except DecisionError as exc: _fail(cmd, exc.code.value, str(exc), exc.details); return` — trusts
      exc.code.value verbatim for ANY DecisionErrorCode member, no allow-list check)'
  - code: 'src/specify_cli/orchestrator_api/commands.py:357-381 (_fail: builds and emits the envelope
      with the caller-supplied error_code string directly; no validation against upstream_contract.json''s
      allowed_error_codes at emission time)'
  claim: '`DecisionErrorCode.VERIFY_DRIFT` is a pre-existing enum member (not touched by this mission''s
    diff) that `decisions/service.py` never raises today (grepped every `DecisionErrorCode.` use site
    in service.py — six other members are raised, VERIFY_DRIFT is not one of them) and that is absent
    from `upstream_contract.json`''s `allowed_error_codes` (confirmed: none of the 24 newly-registered
    codes is `DECISION_VERIFY_DRIFT`, and it was not present pre-mission either). Currently unreachable,
    so this is not a live defect. But this mission is exactly the one that newly wires FOUR verbs (`open-decision`/`resolve-decision`/`defer-decision`/
    `cancel-decision`) that catch `DecisionError` and propagate `exc.code.value` straight into the envelope''s
    `error_code` field with no allow-list validation at emission time (`_fail` performs none either) —
    if `decisions/service.py` ever grows a verify/drift check that raises `DecisionError(code=DecisionErrorCode.VERIFY_DRIFT,
    ...)` (the member''s name and its solitary existing reference, a value-only unit test in `tests/specify_cli/decisions/test_models.py`,
    both suggest it was anticipated for exactly such a future use), any of these four new verbs would
    silently emit an unregistered `error_code` — a CI-invisible contract violation, since `TestAllowedErrorCodes`
    in `tests/contract/test_orchestrator_api.py` checks literal `_fail(...)` call sites statically, not
    values reached via `exc.code.value` propagation, and nothing at runtime cross-checks an emitted `error_code`
    against the contract''s allow-list.

    '
  remediation: 'Either (a) add `DECISION_VERIFY_DRIFT` to `upstream_contract.json`''s `allowed_error_codes`
    now, defensively, since the four new verbs this mission adds are the exact propagation path that would
    surface it the moment `decisions/service.py` starts raising it, or (b) if `VERIFY_DRIFT` is genuinely
    dead/unplanned, remove the enum member (or add an explicit comment on it and its `test_models.py`
    reference stating it is reserved-but-unused) so a future contributor does not wire a fifth verb that
    assumes every `DecisionErrorCode` member is contract-registered.

    '
  _lens_group: contract
- id: PR-TESTS-001
  lens: error paths exercised
  severity: 3
  title: specify/plan/tasks delegate-failure fallback error codes have zero test coverage
  evidence:
  - code: src/specify_cli/orchestrator_api/commands.py:2090-2113 (_classify_specify_create_error, MISSION_CREATE_FAILED
      fallback)
  - code: src/specify_cli/orchestrator_api/commands.py:2235,2246 (plan(), PLAN_SETUP_FAILED)
  - code: src/specify_cli/orchestrator_api/commands.py:2300,2311 (tasks(), TASKS_FINALIZE_FAILED)
  - code: 'tests/specify_cli/orchestrator_api/test_specify_plan_tasks_verbs.py:163-345 (only 4 tests:
      3 happy-path pass-through, 1 MISSION_ALREADY_EXISTS duplicate-slug)'
  claim: '`specify`/`plan`/`tasks` each classify a failed delegate call two ways: trust a typed `error_code`
    the delegate already carries, or fall back to a verb-specific generic code (`MISSION_CREATE_FAILED`,
    `PLAN_SETUP_FAILED`, `TASKS_FINALIZE_FAILED`) when the delegate raised `typer.Exit` with no parseable/typed
    payload. `test_specify_plan_tasks_verbs.py` contains exactly 4 tests: 3 happy-path pass-through checks
    and 1 failure test that only exercises the `MISSION_ALREADY_EXISTS` duplicate-marker classification
    (a different branch of `_classify_specify_create_error`). No test ever drives `plan()` or `tasks()`
    down their `except typer.Exit` branch, and no test drives `specify()`''s generic (non-duplicate, no-payload)
    fallback. A regression that broke the fallback classification (e.g. dropped the `except typer.Exit`
    handler, or always returned `success=True` on a delegate raise) would pass this suite untouched —
    confirmed by inspection of every `def test_` in the file (grep -n "^def test_" tests/specify_cli/orchestrator_api/test_specify_plan_tasks_verbs.py
    lists only the 4 named above).

    '
  remediation: 'Add one failure test per verb: monkeypatch the delegate (`agent_feature.setup_plan` /
    `agent_feature.finalize_tasks` / `_create_mission_for_specify_json`) to raise `typer.Exit(1)` with
    stdout that contains no parseable `{...}` JSON, and assert the orchestrator-api verb reports `success:
    false` with the verb''s own fallback `error_code` (`PLAN_SETUP_FAILED`/`TASKS_FINALIZE_FAILED`/`MISSION_CREATE_FAILED`),
    never a bare exception.

    '
  _lens_group: tests
- id: PR-TESTS-002
  lens: error paths exercised
  severity: 3
  title: check-prerequisites' Terminology Canon translation (FEATURE_CONTEXT_UNRESOLVED -> MISSION_NOT_FOUND)
    is untested
  evidence:
  - code: src/specify_cli/orchestrator_api/commands.py:2330-2354 (_classify_check_prerequisites_error)
  - code: tests/specify_cli/orchestrator_api/test_check_prerequisites_record_analysis.py:247-306 (only
      field-parity and missing-mission tests)
  claim: '`_classify_check_prerequisites_error`''s own docstring calls out that the host CLI''s `mission_check_prerequisites.py`
    emits a feature-named error code, `FEATURE_CONTEXT_UNRESOLVED`, which "must NEVER cross onto the orchestrator-api
    surface verbatim (Terminology Canon...)" and is translated to the canonical `MISSION_NOT_FOUND` —
    this is the ONE call site in the whole module that performs this translation. No test in `test_check_prerequisites_record_analysis.py`
    drives the delegate into raising `FEATURE_CONTEXT_UNRESOLVED` to confirm the translation fires; `test_check_prerequisites_missing_mission_fails_closed`
    (the only failure test for this verb) reaches `MISSION_NOT_FOUND` through the earlier `_resolve_mission_dir_or_fail`
    gate, never through this classify function at all. A future edit that dropped or mis-ordered this
    branch (leaking the forbidden `FEATURE_CONTEXT_UNRESOLVED` code onto the public contract — exactly
    the class of regression `upstream_contract.json`''s `forbidden_error_codes` exists to prevent) would
    pass this suite silently.

    '
  remediation: 'Add a test that gets past the mission-existence gate (a real mission dir must exist) but
    makes the delegate `check_prerequisites` call itself raise `typer.Exit` with a `{"error_code": "FEATURE_CONTEXT_UNRESOLVED",
    ...}` payload (e.g. monkeypatch `mission_check_prerequisites.check_prerequisites` or seed a mission-dir
    shape that trips the delegate''s own resolution failure), and assert the orchestrator-api envelope
    reports `error_code == "MISSION_NOT_FOUND"`, not `FEATURE_CONTEXT_UNRESOLVED`.

    '
  _lens_group: tests
- id: PR-TESTS-003
  lens: error paths exercised
  severity: 3
  title: record-analysis's PLACEMENT_RESOLUTION_REQUIRED, DIRTY_WORKTREE and RECORD_ANALYSIS_MALFORMED_CARRIER
    fail-closed branches have zero test coverage
  evidence:
  - code: src/specify_cli/orchestrator_api/commands.py:2706 (RECORD_ANALYSIS_MALFORMED_CARRIER)
  - code: src/specify_cli/orchestrator_api/commands.py:2721 (PLACEMENT_RESOLUTION_REQUIRED)
  - code: src/specify_cli/orchestrator_api/commands.py:2730-2740 (DIRTY_WORKTREE fallback)
  - code: 'tests/specify_cli/orchestrator_api/test_check_prerequisites_record_analysis.py:309-470 (5 record-analysis
      tests: persists-and-verifies, never-reports-unknown-verdict, SC-005a/b/c)'
  claim: '`record_analysis()` has 3 fail-closed branches ahead of the write itself: a malformed findings-carrier
    body (`parse_structured_findings` raising `FindingsCarrierError` -> `RECORD_ANALYSIS_MALFORMED_CARRIER`),
    an unresolvable write placement (`PlacementResolutionRequired` -> `PLACEMENT_RESOLUTION_REQUIRED`),
    and a dirty pre-existing worktree caught by the write preflight (`DIRTY_WORKTREE` fallback). The 5
    `test_record_analysis_*` tests in this file all submit well-formed carrier bodies against clean worktrees
    with resolvable placement — none of the three preflight branches is reached by any test. A regression
    that broke carrier-parsing error surfacing, placement-resolution refusal, or the dirty-worktree preflight
    (e.g. silently proceeding to write against a dirty tree) would slip through this suite.

    '
  remediation: 'Add three targeted tests: (1) submit a body whose YAML frontmatter is malformed (unparseable
    carrier) and assert `RECORD_ANALYSIS_MALFORMED_CARRIER`; (2) monkeypatch `_require_record_analysis_placement`
    to raise `PlacementResolutionRequired` and assert `PLACEMENT_RESOLUTION_REQUIRED`; (3) leave real
    uncommitted changes in the worktree before calling `record-analysis` and assert the preflight refuses
    with `DIRTY_WORKTREE` (or the delegate''s own typed code, per `_classify_delegate_error`''s trust-typed-code-first
    contract).

    '
  _lens_group: tests
  _related:
  - PR-CONTRACT-001
