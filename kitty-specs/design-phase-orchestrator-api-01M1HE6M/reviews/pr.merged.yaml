- id: PR-BOUNDARY-001
  lens: kernel-doctrine-cli-sync-seam
  severity: 3
  title: answer-decision duplicates next_cmd.py's pending-decision auto-resolve logic via a second direct
    import of the _internal_runtime.engine private surface, instead of routing through the existing runtime_bridge_engine.py
    concentration seam or extending WP02's shared module
  evidence:
  - code: src/specify_cli/orchestrator_api/commands.py:3299
  - code: src/specify_cli/orchestrator_api/commands.py:3316-3335
  - code: src/specify_cli/cli/commands/next_cmd.py:829-841
  - code: src/runtime/next/runtime_bridge_engine.py:1-25
  - code: tests/runtime/test_bridge_engine.py:1-60
  claim: 'WP08''s answer-decision auto-resolves an omitted --decision-id by reading the run snapshot''s
    pending_decisions map. It does this with `from runtime.next._internal_runtime.engine import _read_snapshot`
    (commands.py:3299) and then reimplements next_cmd.py''s own `_handle_answer` auto-resolve branch (next_cmd.py:829-841)
    verbatim: same three-way split (zero pending / exactly one / more than one), same error semantics,
    in a second, independently-maintained block. `_read_snapshot` is one of the six names `runtime_bridge_engine.py`
    exists specifically to concentrate ("Sole home of the FR-013 grep-complete _internal_runtime engine/planner
    private surface"), and `tests/runtime/test_bridge_engine.py` enforces that no OTHER module under src/runtime/next/
    reaches into `_internal_runtime.engine`/ `.planner` directly for these six names. next_cmd.py already
    bypassed that adapter before this mission (pre-existing debt, out of this mission''s scope to fix),
    but commands.py is new code introduced by this mission, and it chose to mirror next_cmd.py''s existing
    bypass rather than either (a) call through the adapter, or (b) extend WP02''s already-established
    next_invocation_lifecycle.py seam pattern to cover this second piece of duplicated CLI-parity logic.
    This is not one of the three side effects the operator ruling named (pair/emit/write), so it does
    not trigger the ruling''s explicit severity-4 bar, but it is exactly the "seam one WP invented and
    the next WP ignored" class this lens exists to catch, and it compounds pre-existing debt with a second
    call site the architecture guard''s own scoping (limited to src/runtime/next/*.py) does not catch
    either.'
  remediation: Extract the pending-decision auto-resolve branch (zero/one/many) into one function next
    to the WP02 seam (e.g. `resolve_pending_decision_id` in runtime.next.next_invocation_lifecycle or
    a new sibling module under src/runtime/next/), have it call through runtime_bridge_engine's concentrated
    `_read_snapshot` wrapper rather than importing `_internal_runtime.engine` directly, and have both
    next_cmd.py's `_handle_answer` and commands.py's `answer_decision` call that one function instead
    of each independently walking snapshot.pending_decisions.
  _lens_group: boundary
- id: PR-BOUNDARY-002
  lens: canonical-sources-unification
  severity: 2
  title: _resolve_mission_dir_or_fail's docstring undercounts its call sites and still frames it as "8
    read endpoints" when this mission added 9 more call sites including several write/mutating verbs
  evidence:
  - code: src/specify_cli/orchestrator_api/commands.py:456-461
  claim: The docstring on `_resolve_mission_dir_or_fail` reads "Single seam consumed by all 8 read endpoints
    (avoids 8 divergent patches)". That sentence predates this mission and was not touched by the diff.
    This mission adds 9 more call sites (specify/plan/tasks/check-prerequisites/ record-analysis/open-decision/resolve-decision/defer-decision/
    cancel-decision/answer-decision/design-status — 17 total per `grep -c "_resolve_mission_dir_or_fail(cmd"
    commands.py`), several of which are mutating verbs, not read endpoints. The comment is now inaccurate
    on both count and category, which matters for this function's own claimed purpose (a single canonical
    seam reviewers rely on to confirm no verb reimplements mission-existence resolution) — a future reader
    trusting the docstring undercounts how central this function has become and may not recognize a new
    call site as belonging to the same seam.
  remediation: Update the docstring to reflect the current call-site count and drop "read" (e.g. "Single
    seam consumed by every mission-scoped orchestrator-api endpoint (17 call sites as of the design-phase
    mission; avoids N divergent patches)"), or state it generically without a specific count that will
    drift again.
  _lens_group: boundary
- id: PR-CONTRACT-001
  lens: host-cli-parity
  severity: 3
  title: record-analysis validates body/carrier BEFORE the dirty-worktree preflight; the host CLI validates
    the dirty-worktree preflight BEFORE reading the body — a real ordering fork, live-confirmed
  evidence:
  - code: 'src/specify_cli/orchestrator_api/commands.py:2684-2705 (record_analysis: body = _read_record_analysis_body(...);
      if not body.strip(): fail RECORD_ANALYSIS_EMPTY_BODY; ... parse_structured_findings(body) -> RECORD_ANALYSIS_MALFORMED_CARRIER;
      THEN placement_ref resolution -> PLACEMENT_RESOLUTION_REQUIRED; THEN _enforce_analysis_report_write_preflight(...)
      -> DIRTY_WORKTREE, at line ~2730)'
  - code: 'src/specify_cli/cli/commands/agent/mission_record_analysis.py:274-293 (record_analysis: feature_dir
      resolution -> placement_ref -> _require_record_analysis_placement -> _enforce_analysis_report_write_preflight(...)
      [dirty-worktree check] ALL run BEFORE `body = sys.stdin.read() ...` / `if not body.strip(): ...`
      at lines 291-293)'
  claim: 'Under a simultaneous dirty-worktree + empty/malformed-body condition, the two surfaces report
    DIFFERENT first error_codes for the identical logical request: orchestrator-api''s `record-analysis`
    reads and validates the submitted body (empty-body check, then analysis-findings/v1 carrier parsing)
    BEFORE resolving placement and running the dirty-worktree preflight; the host CLI''s own `record_analysis`
    (mission_record_analysis.py) does the opposite — placement resolution and the dirty-worktree preflight
    run FIRST, body is read and validated only afterward. This is exactly the "check in the right place
    but the wrong order is still a fork" class the mission''s own WP05-001 (`defer`/`cancel-decision`
    empty `--rationale`) and WP08-001 (`answer-decision` invalid `--result`) findings already fixed for
    two other verbs — a third, undetected instance of the same class in `record-analysis`, not covered
    by any existing test (grepped `tests/specify_cli/orchestrator_api/ test_check_prerequisites_record_analysis.py`
    for a combined dirty-worktree+empty-body case; none exists).

    Live-reproduced independently (not from the mission''s own test suite): built a real mission via `specify`/`plan`/`tasks`,
    dirtied the working tree with one untracked file, then called `record-analysis` with an empty stdin
    body (`--input-file -`) through BOTH surfaces against otherwise-identical fixtures. orchestrator-api
    returned `error_code: "RECORD_ANALYSIS_EMPTY_BODY"`; the host CLI (`spec-kitty agent mission record-analysis
    --json`) returned `error_code: "DIRTY_WORKTREE"` (with `dirty_paths` naming the untracked file) for
    the SAME on-disk state. An external orchestrator that branches its remediation logic on `error_code`
    (e.g. "stash and retry" for `DIRTY_WORKTREE` vs "re-run analyze" for `RECORD_ANALYSIS_EMPTY_BODY`)
    gets a different, non-parity answer depending on which surface it called — silent behavioural drift
    from the host CLI this verb is documented to mirror.

    '
  remediation: 'Move the placement-resolution + `_enforce_analysis_report_write_preflight` call in `record_analysis`
    (commands.py) to run BEFORE the `_read_record_analysis_body`/empty-body check and the `parse_structured_findings`
    carrier check, matching the host CLI''s own ordering exactly (mission_record_analysis.py:274-293).
    Add a regression test constructing a dirty worktree together with an empty/malformed body and asserting
    `DIRTY_WORKTREE` is the reported error_code on both surfaces, mirroring the existing WP05-001/WP08-001
    ordering-parity tests'' pattern.

    '
