    action: REPOINT via resolve_pack_root; MODULE-LEVEL import (not function-local — #2986 shrink-only ratchet).
  - literal: specify_cli/migration/rewrite_opposed_by.py:192, core/upgrade_probe.py:8  (".../directives/built-in/")
    action: REVIEW in IC-01 — live path (repoint) vs docstring (leave).

