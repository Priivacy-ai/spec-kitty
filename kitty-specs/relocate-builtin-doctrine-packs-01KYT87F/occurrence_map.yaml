# Content inventory / occurrence map (FR-002) — post-plan-squad revision
# MOVE = content relocates to packs/built-in/ (FLATTENED: <kind>/built-in/ -> packs/built-in/<kind>/)
#        and its reader repoints via resolve_pack_root(). STAY = remains under src/doctrine/.
# Only DATA moves — no import-graph .py (C-001). Layout DECISION: flatten + repoint the graph
# regeneration surface (extractor + _doctrine_root) so regenerate-graph still works post-move.
mission: relocate-builtin-doctrine-packs-01KYT87F
phase: 1
baseline: { graph_nodes: 324, graph_edges: 892, builtin_profiles: 18, graph_fragments: 14, glossary_terms: 108 }

# --- 8 standard bulk-edit categories ---

filesystem_paths:
  - path: src/doctrine/<kind>/built-in/       # 9 kinds: agent_profiles, directives, procedures,
    action: MOVE (flatten)                     #   tactics, paradigms, styleguides, toolguides,
    to: packs/built-in/<kind>/                 #   assets, glossary_packs
    note: >
      Inner built-in/ level is DROPPED. Only the built-in/ SUBDIR moves; sibling repository.py stays.
      Two .py ASSET PAYLOADS live inside moving trees and MOVE as data (not import code, hyphen blocks import):
      assets/built-in/docs_structural_lint.py, toolguides/built-in/system_tools/__init__.py — whitelist so a
      "no .py in move-set" guard does not false-positive; note their wheel shipping-status change (NFR-002).
  - path: src/doctrine/*.graph.yaml            # 14 DRG fragments (authoritative glob, not hand-count)
    action: MOVE
    to: packs/built-in/
  - path: src/doctrine/missions/
    action: STAY (DEFER to Phase 1b)
    reason: >
      Post-plan squad UNANIMOUS defer. Readers span 4 layers incl. kernel/paths.py:111 (files("doctrine")/"missions")
      — routing a KERNEL reader through the doctrine-layer resolve_pack_root is a C-004 upward-import violation;
      pushing the resolver into kernel is the C-002 kernel extraction we defer. Plus __file__-relative readers
      (mission_step_repository.py:219, charter/mission_type_profile_repository.py:66) invisible to a files()/string
      sweep, and live upgrade migrations. Graph identity is SAFE either way (mission nodes are authored in the
      fragments, not scanned from missions/). Follow-on: Phase 1b (first task = cross-layer missions-reader inventory).
  - path: src/doctrine/schemas/
    action: STAY
    reason: C-003 — files("doctrine.schemas") via KERNEL layer; not tiered; moving breaks all validation.
  - path: src/doctrine/{skills,model_task_routing,templates}/
    action: STAY
    reason: Deployment/infra/contract-pinned, not DRG-tiered (verified — DRG loader references none). Their tiered face (e.g. tactics/built-in/model-task-routing.tactic.yaml) moves with its kind.
  - path: src/doctrine/{drg,shared,import_candidates,spdd_reasons,workflows}/
    action: STAY
    reason: Python code / non-tiered.

import_paths:  # package-relative importlib.resources anchors → repoint via resolver
  - anchor: files("doctrine.<kind>")   # 9 per-kind content anchors
    action: REPOINT → resolve_pack_root("built-in")/<kind>
    note: Drop the now-dead hasattr(joinpath)/Path(str(...)) Traversable guard — resolver returns a real Path.
  - anchor: files("doctrine")  (16 sites)
    action: PER-SITE — built_in_graph_source() REPOINTS; schemas/templates/missions sites STAY. IC-01 classifies each.
  - anchor: files("doctrine.schemas") / files("doctrine.missions.*")
    action: KEEP (schemas C-003; missions deferred).

code_symbols:
  - symbol: built_in_graph_source()  (src/doctrine/drg/loader.py:115)
    action: REPOINT → resolve_pack_root("built-in"); make FAIL-CLOSED (PackRootNotFound), drop the silent __file__ fallback.
  - symbol: _default_built_in_dir() / built_in_dir default  (×9 repositories)
    action: REPOINT → resolve_pack_root("built-in")/<kind>
  - symbol: resolve_pack_root(tier)  (NEW, src/doctrine/pack_paths.py)
    action: ADD — .resolve() before walk-up; fail-closed.
  - symbol: _doctrine_root()  (specify_cli/cli/commands/doctrine.py) + extractor.py _PATH_KIND_PATTERNS (lines 60-107) + walks (:477)
    action: REPOINT (daphne blocker) — detection + write-target + regex patterns to the flattened packs/built-in/<kind>/ home, so `spec-kitty doctrine regenerate-graph` still works.
  - symbol: charter/catalog.py _scan() / load_doctrine_catalog() (line ~276, reads resolve_doctrine_root()/<kind>/built-in for 7 kinds, 30+ callers)
    action: REPOINT (pedro post-tasks BLOCKER — owned by WP04) → resolve_pack_root("built-in")/<kind>. A SECOND reader independent of the repositories/loader; uses the files("doctrine") root so no per-kind-anchor guard catches it. WP07 T022 adds a catalog-non-empty assertion.

serialized_keys:
  - key: root pyproject.toml [tool.hatch.build.targets.wheel]
    action: ADD force-include = { "packs" = "packs" }. Do NOT delete the existing artifacts wildcards (schemas/templates/etc STAY under src/doctrine; the moved files simply stop matching once physically gone — no dual-home).
  - key: root pyproject.toml [tool.hatch.build.targets.sdist].include
    action: ADD "packs/**" (currently "src/**/*" excludes top-level packs/).

cli_commands: [none]

user_facing_strings:
