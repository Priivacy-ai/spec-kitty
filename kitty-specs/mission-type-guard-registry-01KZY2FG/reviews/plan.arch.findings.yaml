findings:
  - id: PLAN-ARCH-001
    lens: Canonical sources
    severity: 3
    title: "_mission_type_audit.py precedent citation conflates two distinct doctor-identity modules and understates the real LOC scale"
    evidence:
      - artifact: "plan.md § Seam & Module Placement — `_mission_type_audit.py (**new sibling module**, mirrors `_identity_audit.py`'s structure 1:1 — same file, not the `specify_cli/status/identity_audit.py` domain-layer split...)`"
      - artifact: "plan.md § Technical Context Scale/Scope — `1 new sibling module (`_mission_type_audit.py`, mirroring `_identity_audit.py`'s ~150-line shape)`"
      - code: "src/specify_cli/cli/commands/_identity_audit.py (346 lines total) — contains ONLY CLI-glue/report-building helpers (`_scope_to_mission`, `_print_identity_human`, `_compute_fail_on`, `_build_identity_json`, `run_identity_audit`); it imports `IdentityState`, `classify_mission`, `audit_repo`, `summarize` from `specify_cli.status` at runtime (lines 29, 50, 213-217) rather than defining them itself."
      - code: "src/specify_cli/status/identity_audit.py:67 (`class IdentityState`), :103 (`def classify_mission`), :185 (`def audit_repo`), :234 (`def summarize`) — 361 lines total — this is the actual domain-layer module that contains the State-dataclass + classifier + repo-walker + summarizer shape plan.md proposes to replicate for `MissionTypeState`/`classify_mission_type`/`audit_mission_types`/`summarize_mission_types`."
    claim: >
      The real `doctor identity` precedent is a genuine two-module architectural split:
      a 361-line domain-layer classifier/audit module (`specify_cli/status/identity_audit.py`,
      owning `IdentityState`, `classify_mission`, `audit_repo`, `summarize`) and a separate
      346-line CLI-glue/report-builder module (`cli/commands/_identity_audit.py`, owning only
      the print/JSON/fail-on/entry-point helpers, which imports the domain pieces at call time).
      Plan.md's Seam & Module Placement section proposes putting ALL FIVE of
      `MissionTypeState`, `classify_mission_type`, `audit_mission_types`,
      `summarize_mission_types`, AND `run_mission_type_audit` into ONE new `cli/commands/`
      sibling module, and calls this "mirrors `_identity_audit.py`'s structure 1:1" — but
      four of those five components structurally correspond to the OTHER file
      (`specify_cli/status/identity_audit.py`), not to `_identity_audit.py`. The plan is aware
      a split exists (it explicitly declines to follow the `specify_cli/status/` domain-layer
      home) but then mischaracterizes what it IS following as "mirrors `_identity_audit.py`'s
      structure 1:1," which is not literally true — `_identity_audit.py` contains no
      State-dataclass/classifier/repo-walker/summarizer shape at all. The LOC estimate
      compounds this: "`_identity_audit.py`'s ~150-line shape" is actually a 346-line file, and
      combining it with the domain module's role means the true combined precedent scale is
      ~700 lines split two ways, not "~150 lines" one way. A WP05/IC-05 implementer following
      the plan's literal citation could under-scope the new module, or discover mid-implementation
      that cramming classifier + repo-walk + summarize + CLI-glue into one file works against the
      same separation-of-concerns the identity precedent (and the charter's Architectural
      alignment principle — "respect... the integrity of module seams") already demonstrates
      is warranted once a decision procedure of FR-008's 6-state complexity is involved.
    remediation: >
      Correct the citation in Seam & Module Placement and Technical Context to name BOTH
      precedent files explicitly: `specify_cli/status/identity_audit.py` (361 lines) for the
      State-dataclass/classifier/audit-walk/summarize shape, and
      `cli/commands/_identity_audit.py` (346 lines) for the CLI-glue/report-builder shape. Either
      (a) keep the plan's stated single-file rationale but state the real combined LOC scale
      (revise "~150-line shape" upward and drop the "mirrors 1:1" phrasing in favor of "combines
      the roles of two identity-precedent modules into one, because mission-type resolution
      logic already lives in charter/doctrine"), or (b) reconsider splitting `classify_mission_type`
      / `audit_mission_types` / `summarize_mission_types` into a small domain-layer sibling
      (e.g. `specify_cli/status/mission_type_audit.py`) with only `run_mission_type_audit` and
      print/JSON glue staying under `cli/commands/_mission_type_audit.py`, matching the real
      architectural seam identity uses. Either fix removes the risk of an implementer using a
      stale size/shape expectation.

  - id: PLAN-ARCH-002
    lens: Exception class separation soundness
    severity: 2
    title: "UnregisteredMissionFamilyError and UnknownMissionTypeError have no code-level cross-reference despite the plan's own FR-008 classifier explicitly reusing the sibling exception's branch logic"
    evidence:
      - artifact: "plan.md § Seam & Module Placement — `Add class UnregisteredMissionFamilyError(ValueError) — a new, local exception, deliberately NOT importing or reusing charter.activation.mission_type_profiles.UnknownMissionTypeError. Two independent reasons: (1) this module's own zero-dependency-leaf invariant forbids importing charter at all; (2) the two exceptions answer different questions at different layers...`"
      - artifact: "plan.md § Seam & Module Placement (FR-008 taxonomy classifier) — `Registered, but repo.get(key) is None → state activated-unresolvable (this is the exact branch _resolve_action_slot in charter/mission_type_profiles.py already hits at its own raise UnknownMissionTypeError(...) call, line 799 ... reused here as a read-only classification instead of a raise).`"
      - code: "src/runtime/next/runtime_bridge_cores.py:1-9 (module docstring) — 'may import stdlib, Lane/decision types, and nothing else... Every function here is pure: no filesystem, no git, no meta.json reads' — confirms the zero-dependency-leaf claim is real (verified: current imports are stdlib + `runtime.next.decision` only, no architectural gate/test enforces this beyond the docstring convention itself)."
      - code: "src/charter/activation/mission_type_profiles.py:193-256 (`class UnknownMissionTypeError(ValueError)`) — also a `ValueError` subclass carrying an offending mission-type-ish string (`mission_type_id`) with message-building distinguishing 'unknown' vs 'activated but has no loadable profile,' the same two-way distinction the new FR-008 taxonomy re-derives independently."
    claim: >
      The plan's reasoning for NOT reusing `UnknownMissionTypeError` is sound and independently
      verified: (a) `runtime_bridge_cores.py`'s zero-dependency-leaf invariant is real (confirmed
      by its own docstring and current import list — importing `charter` would be a genuine,
      documented violation, even though no automated architectural gate currently enforces this
      invariant by name); (b) `mission_family` (a coarse, hardcoded 4-value runtime-guard-dispatch
      key) and `mission_type` (a project-activation-scoped, potentially many-valued charter
      concept) are conceptually distinct enough to justify two exception classes. No finding is
      warranted against the decision itself. However, the plan's OWN new `_mission_type_audit.py`
      module (FR-008 classifier) explicitly reuses `UnknownMissionTypeError`'s `_resolve_action_slot`
      branch logic conceptually (same mission, same diff) without ever proposing a code-level
      comment linking the two exception classes together. Two `ValueError` subclasses that "rhyme
      in shape" (the plan's own words) and are exercised by the same mission's diff, with no
      cross-reference between them, is a real drift risk: a future maintainer touching one
      taxonomy (e.g. widening `UnknownMissionTypeError`'s message shape, or adding a third
      "family" state to `_GUARD_TABLES`) has no in-code signal pointing at the sibling exception
      to check for a parallel update.
    remediation: >
      Add a one-line cross-reference comment to `UnregisteredMissionFamilyError`'s docstring in
      `runtime_bridge_cores.py` (e.g. "Sibling concept: charter.activation.mission_type_profiles.
      UnknownMissionTypeError — same shape (ValueError carrying the offending string), different
      layer (runtime guard-family dispatch vs charter mission-type resolution); intentionally not
      unified, see plan.md's Seam & Module Placement for the two-independent-reasons rationale").
      Optionally add the reverse pointer on `UnknownMissionTypeError` itself. This costs one doc
      comment and closes the "silent taxonomy drift" risk without weakening the (correct) decision
      to keep the two classes separate.
