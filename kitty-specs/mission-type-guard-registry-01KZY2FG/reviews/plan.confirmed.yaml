      establish this cross-reference is inaccurate. This matters specifically
      because Lens 4 exists to check exactly this kind of provenance claim in a
      Baseline & Reflexivity section whose entire purpose is to replace hedged/
      assumed claims with verified ones — a false "already referenced elsewhere"
      claim is the same class of unverified-claim-presented-as-verified this
      mission (and this review) is built to catch, even though in this instance
      it does not affect the mission's own scope or correctness.
    remediation: >
      Either drop the "CLAUDE.md and spec.md both already reference" clause (the
      instruction to "cite #3284 ... rather than filing a duplicate" stands fine
      on its own without the false provenance claim), or verify and correct it —
      e.g. "#3284, a real open red-main tracking issue independently confirmed
      via `gh issue view 3284`, not yet cross-referenced from CLAUDE.md or
      spec.md."
