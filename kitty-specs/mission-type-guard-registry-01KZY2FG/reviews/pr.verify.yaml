#   e892780f7  fix(WP02): widen classify_mission_type try/except to cover classification helpers
#
# RED->GREEN, mechanical (throwaway `git worktree add --detach` under /tmp, removed after):
#   at 54a77c9c0: PYTHONPATH=<wt>/src <repo>/.venv/bin/python -m pytest
#     tests/specify_cli/cli/commands/test_doctor_mission_type.py -k
#     "classification_helper_exception_is_error_not_crash or classification_error_does_not_abort_run"
#     -> 2 failed (test_audit_mission_types_classification_error_does_not_abort_run fails with
