#
# Scope check against the finding as filed (not just the narrow test case): the finding named
# TWO gaps — (1) classify_mission_type's try/except covered only load_meta_fail_closed, not the
# _classify_present_key/_classify_absent_key helpers, and (2) audit_mission_types's calling loop
# has no try/except around the classify_mission_type call either. The fix widens the try/except
# in classify_mission_type to wrap the ENTIRE function body (read + both helper branches) under
# one `except Exception`, so classify_mission_type itself can no longer raise — which structurally
# closes gap (2) too, since a function that cannot raise needs no caller-side guard. Confirmed by
# reading audit_mission_types's for-loop (still has no try/except, unchanged) and by the RED test
# test_audit_mission_types_classification_error_does_not_abort_run, which drives the exception
# through the real audit_mission_types loop (not just classify_mission_type in isolation) and
# passes at e892780f7. This resolves the finding as filed, not only the narrow single-function case.
#
# --fail-on / error-state contract (FR-008, "never silently succeed"): empirically verified with
# a throwaway audit_mission_types() + _compute_fail_on("error", states) call against a mission
# with a corrupt meta.json -> state == "error", error message preserved verbatim
# ("Malformed JSON in ... Expecting property name enclosed in double quotes ..."), and
# _compute_fail_on returns fail_on_triggered=True. --fail-on error is a real, working failure
# gate; error can never be mistaken for a passing/zero-exit result under that flag.
