- id: SPEC-ARCH-001
  lens: Close Defect Classes by Construction (DIRECTIVE_043) / Contracts
  severity: 4
  title: FR-009's ValidationError is silently swallowed by ManifestRegistry.load_manifest(), so the schema-hardening
    fix never surfaces on the only production loading path
  evidence:
  - artifact: "spec.md \xA7 User Story 3 motivation (lines 284-287) and Acceptance Scenarios AS1/AS2 (lines\
      \ 298-305)"
  - artifact: "spec.md \xA7 Key Entities, ManifestRegistry entry (lines 378-380): \"Unmodified by this\
      \ mission \u2014 it is a pure reader\""
  - code: 'src/specify_cli/dossier/manifest.py:207-215 (load_manifest wraps model_validate in bare `except
      Exception as e: logger.error(...); return None`)'
  claim: "User Story 3's motivation is that a typo'd manifest key should raise a validation error immediately.\
    \ FR-009's extra=\"forbid\" does make direct Pydantic construction raise, but the sole production\
    \ loading path (load_manifest()) catches ANY exception including ValidationError and returns None\
    \ \u2014 identical to \"manifest not found\", merely logged at ERROR level. Every real reader (dossier\
    \ indexer, resolve_manifest_version(), _resolve_expected_artifacts_slot() via get_expected_artifacts())\
    \ goes through this method, not direct model construction. No acceptance scenario exercises load_manifest()\
    \ with a typo'd real YAML file, so the claimed author-time-visibility benefit is not delivered end-to-end\
    \ while ManifestRegistry is declared out of scope for changes.\n"
  remediation: 'Either (a) add an FR/AC changing load_manifest()''s exception handling to distinguish
    ValidationError from genuine missing-file/parse-absence (re-raise or surface at a level the CLI operator
    sees, while still returning None for absence); or (b) rewrite User Story 3''s motivation/acceptance
    bar to state plainly the loud-failure guarantee is scoped to direct model construction (authoring/test
    tooling), not the load_manifest() path every real consumer uses.

    '
- id: SPEC-VERIFY-001
  lens: divergence-fix fidelity
  severity: 4
  merged_with: SPEC-ARCH-002
  title: "Decision 1 / FR-010 / FR-011 (and US2-AS4) misstate current guard behavior for plan-type 'review'\
    \ \u2014 it does not fall to a bare return []"
  evidence:
  - artifact: "spec.md \xA7 Clarifications > Session 2026-08-13 > Q1 (Decision 1 rationale: \"a plan-type\
      \ step id returns [] unconditionally today\")"
  - artifact: "spec.md \xA7 User Story 2, Acceptance Scenario 4 (\"goals/research/structure/draft/review\
      \ all fall to the bare return []\")"
  - artifact: "spec.md \xA7 FR-011 (\"naming the missing plan-family branch ... as an independent defect\"\
      )"
  - code: 'src/runtime/next/runtime_bridge_cores.py:554-566 (_evaluate_software_dev_guards: `if step_id
      in ("implement", "review"): return _evaluate_wp_iteration_guard(step_id, snapshot)`, bare `return
      []` only for ids matching none of the branches above it, including line 564)'
  - code: 'packs/built-in/missions/plan/mission.yaml (states list includes `name: review`)'
  - code: src/runtime/next/runtime_bridge.py:680-698 (_check_cli_guards hardcodes mission_family="software-dev"
      regardless of the mission's actual type)
  - code: "src/runtime/next/runtime_bridge.py:1541-1544,1557-1566 (_dn_composition_dispatch, the mission-family-aware\
      \ path, is gated to mission == \"software-dev\" only \u2014 plan-type missions never reach it)"
  claim: "plan/mission.yaml's state list literally includes a state named \"review\", and _evaluate_software_dev_guards\
    \ has an explicit branch `if step_id in (\"implement\", \"review\")` that fires for that exact string,\
    \ never reaching the bare `return []`. Only goals/research/structure/draft fall to the bare return\
    \ []; review does not. Traced the live call path: for ANY mission type (plan included), _check_cli_guards\
    \ hardcodes mission_family=\"software-dev\" and passes the real state name as step_id; the mission-family-aware\
    \ composed-action path is unreachable for plan missions because it gates on mission == \"software-dev\"\
    . So a plan mission at its \"review\" state invokes _evaluate_wp_iteration_guard(\"review\", snapshot)\
    \ \u2014 today coincidentally still yields [] (wp_advance_ready defaults True with no tasks/ dir),\
    \ but this is a real, reachable, mission-blind branch, not the bare fallback the spec describes. If\
    \ a plan mission's directory ever contained a tasks/WP*.md set, \"review\" would be spuriously blocked\
    \ with a nonsensical software-dev message. FR-010's header-comment acceptance criterion (Scenario\
    \ 4) requires the new manifest to assert something about the code that is not true, and FR-011's planned\
    \ upstream issue \u2014 based on this same false premise \u2014 would describe the wrong defect (total\
    \ vocabulary non-match) instead of the real one (accidental mission-blind vocabulary collision via\
    \ hardcoded mission_family).\n"
  claim_arch_002_addendum: "(from SPEC-ARCH-002, same finding) The header comment FR-010 mandates would\
    \ bake the false \"all fall to []\" claim into a shipped file \u2014 the same \"unreliable, not reconciled\
    \ against observed code\" defect class this mission exists to close, reproduced inside its own remedy's\
    \ documentation.\n"
  remediation: "Correct Decision 1's rationale and FR-010's Acceptance Scenario 4 (the header-comment\
    \ requirement) to state the mechanism precisely: plan-type missions are routed through _check_cli_guards,\
    \ which hardcodes mission_family=\"software-dev\", so any plan-type step id that happens to lexically\
    \ match software-dev's own vocabulary (currently only \"review\") is evaluated by _evaluate_wp_iteration_guard\
    \ rather than falling through to the bare return [] \u2014 it returns [] today only because wp_advance_ready\
    \ defaults True for a plan mission with no tasks/ directory, not because no branch matches. Rewrite\
    \ FR-011's issue description to name this real defect (mis-attributed mission_family plus an accidental\
    \ \"review\" vocabulary collision with latent spurious-block risk), not \"no branch recognizes plan\
    \ step ids.\"\n"
