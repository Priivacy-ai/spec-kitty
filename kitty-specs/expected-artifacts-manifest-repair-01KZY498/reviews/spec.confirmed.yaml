  remediation: 'Rename the entity to ResolvedMissionType.expected_artifacts everywhere it appears. Replace
    "no consumer... found beyond its own docstring" with an accurate statement acknowledging tests/charter/test_resolved_mission_type_context.py
    as a real consumer, and confirm the reconciled software-dev manifest content still satisfies that
