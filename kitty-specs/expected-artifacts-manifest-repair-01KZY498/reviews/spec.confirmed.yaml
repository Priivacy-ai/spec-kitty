  - artifact: "spec.md \xA7 Overview \"Corrected risk framing\", item 3 (lines 124-126)"
  - artifact: "spec.md \xA7 Non-Gate Consumer Notes (lines 461-464): repeats the same claim a third time"
  - code: "src/charter/mission_type_profiles.py:405-408 (the actual property: ResolvedMissionType.expected_artifacts,\
      \ a @cached_property; MissionTypeProfile \u2014 a separate pydantic.BaseModel \u2014 has no such\
      \ attribute)"
  - code: tests/charter/test_resolved_mission_type_context.py:160-162 (asserts on bundle.expected_artifacts's
      presence, type, and mission_type key for software-dev)
  claim: "Two independent errors in the same repeated claim. First, the entity is misnamed throughout:\
    \ the .expected_artifacts property lives on ResolvedMissionType, not MissionTypeProfile. Second, \"\
    no consumer... found beyond its own docstring\" is false: a real contract test directly asserts on\
