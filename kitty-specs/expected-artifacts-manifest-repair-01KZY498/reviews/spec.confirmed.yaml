    '
- id: SPEC-VERIFY-002
  lens: divergence-fix fidelity
  severity: 3
  title: FR-007 / Acceptance Scenario 5 omit the non-expressible requirement_mapping_failures check inside
    the tasks_packages guard
  evidence:
  - artifact: "spec.md \xA7 FR-007"
  - artifact: "spec.md \xA7 User Story 1, Acceptance Scenario 5 (only names the tasks.md/glob requirement\
      \ for the three CLI-native steps)"
  - artifact: "spec.md \xA7 User Story 1, Acceptance Scenario 7 / SC-001 (tasks_finalize's non-expressible\
      \ checks are named explicitly; tasks_packages's is not)"
  - code: "src/runtime/next/runtime_bridge_cores.py:484-489 (_evaluate_tasks_packages_guard: glob-missing\
      \ message OR list(snapshot.status_facts[\"requirement_mapping_failures\"]) \u2014 a second, non-filesystem-expressible\
      \ check on the same branch)"
  claim: '_evaluate_tasks_packages_guard enforces two things: the tasks/WP*.md glob AND requirement_mapping_failures
    (non-filesystem, same category as the dependency-frontmatter/occurrence-gate checks the spec explicitly
    calls out for tasks_finalize). FR-007/AS5 only instruct adding the glob entry; neither names requirement_mapping_failures
    nor asks for a documenting inline comment, even though SC-001''s "zero unexplained divergences" bar
    would require one. No occurrence of "requirement_mapping" anywhere in spec.md.

    '
  remediation: 'Extend FR-007 (and AS5) to explicitly require an inline YAML comment on the tasks_packages
    required_by_step entry noting that _evaluate_tasks_packages_guard also enforces requirement_mapping_failures,
    mirroring the treatment already specified for tasks_finalize''s occurrence-gate/dependency-frontmatter
    checks.

    '
