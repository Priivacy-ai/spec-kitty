- id: SPEC-ARCH-005
  lens: Canonical source (DIRECTIVE_044)
  severity: 3
  title: FR-014's 'refresh the dead override copies to keep them in sync' is parity-with-a-dead-quirk,
    in tension with the charter's canonical-source-unification principle
  evidence:
  - artifact: spec.md FR-014 (line 349)
  - artifact: "spec.md \xA7 \"A second-order finding\" (lines 136-180), confirming .kittify/overrides/missions/*/expected-artifacts.yaml\
      \ is dead code for this file type"
  - artifact: 'spec.md C-004 (line 367): no new override-resolution wiring in this mission'
  - artifact: ".kittify/charter/charter.md \xA7 Governing Principles (lines 27-31): \"Single canonical\
      \ authority... chase unification, not parity with a dead quirk.\" (DIRECTIVE_044)"
  claim: "The spec correctly identifies the override copies are consumed by zero readers, then FR-014\
    \ proposes refreshing that dead content \"as drift hygiene\" \u2014 the literal shape of \"parity\
    \ with a dead quirk\" DIRECTIVE_044 names as the anti-pattern to avoid. Not a logical contradiction\
    \ of C-004, but the spec neither surfaces this tension nor weighs the charter-pointed alternative\
    \ (delete/mark deprecated) before presenting FR-014 as uncontroversial hygiene.\n"
  remediation: 'Either (a) change FR-014 to delete or explicitly mark the dead override copies as deprecated/inert,
    pointing to the follow-up issue for wiring the override tier; or (b) if "keep in sync" is still chosen,
    add a paragraph acknowledging this is a deliberate, charter-principle-aware exception and state why
    "keep in sync" was preferred over deletion or immediate resolver wiring.

    '
- id: SPEC-ARCH-006
  lens: 'Mission-derived: Non-gate consumer accuracy'
  severity: 2
  title: The plan-manifest_version explanation for resolve_manifest_version() conflates load_manifest()'s
    None return with resolve_manifest_version()'s always-a-string contract
  evidence:
  - artifact: "spec.md \xA7 Non-Gate Consumer Notes (lines 452-455)"
  - code: 'src/specify_cli/sync/namespace.py:90-101 (resolve_manifest_version: `if manifest is not None:
      return str(manifest.manifest_version); return "1"`)'
  claim: "resolve_manifest_version() never returns None \u2014 it has an explicit fallback return \"1\"\
    \ for exactly the case where load_manifest() returns None (as it always has for \"plan\"). So resolve_manifest_version(\"\
    plan\") already returned \"1\" before this mission (via fallback) and continues to return \"1\" after\
    \ FR-010 (via the real manifest) \u2014 byte-identical, but not because it \"returns '1' for the first\
    \ time\" as the spec states. The safety conclusion holds; the described mechanism is wrong.\n"
  remediation: "Rewrite the plan-specific sentence to state resolve_manifest_version(\"plan\") already\
    \ returned \"1\" before this mission via its None-fallback branch, and continues to return \"1\" after\
    \ FR-010 \u2014 the sync identity tuple for plan was, and remains, \"1\" throughout.\n"
