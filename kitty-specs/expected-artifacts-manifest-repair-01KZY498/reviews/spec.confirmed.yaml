findings:
- id: SPEC-GOV-001
  lens: Decision fidelity
  severity: 3
  title: C-002 (and, more weakly, FR-013) carry the manifest_version non-bump rule with no restated rationale,
    so a reader who skips Clarifications loses the naive-instinct-defeater
  evidence:
  - artifact: "spec.md \xA7 Clarifications, Decision 2 (lines ~41-59)"
  - artifact: "spec.md \xA7 Constraints, C-002 (line ~365)"
  - artifact: "spec.md \xA7 Functional Requirements, FR-013 (line ~348)"
  - artifact: "spec.md \xA7 Non-Gate Consumer Notes (lines ~444-455)"
  - code: src/specify_cli/sync/namespace.py:90-101 (resolve_manifest_version), :35,63 (NamespaceRef 5-field
      identity tuple)
  claim: "Decision 2's rationale for NOT bumping manifest_version is substantial and counter-instinctive,\
    \ but C-002's row text is a bare rule with zero pointer back to Decision 2 or any inline rationale\
    \ \u2014 it does not even say \"per Decision 2\" the way FR-010/FR-011 say \"per Decision 1\". FR-013\
    \ names \"Decision 2\" by number but still does not restate the substance of the defeater. A reviewer\
    \ who scans only the Requirements/Constraints tables sees a rule with no defeater attached.\n"
  remediation: 'Add a one-clause parenthetical rationale to both C-002 and FR-013 restating the defeater
    inline. At minimum, C-002 should carry the same "per Decision 2" back-reference FR-013 already has.

    '
- id: SPEC-GOV-002
  lens: Directive (verify-against-live-code)
  severity: 2
  title: "US2/AS3 misstates plan/mission.yaml's structure\u2192draft transition as gated by gate_passed(...),\
    \ but it carries no condition at all"
  evidence:
  - artifact: "spec.md \xA7 User Story 2, Acceptance Scenario 3 (lines ~263-269)"
  - code: "packs/built-in/missions/plan/mission.yaml:40-42 (structure\u2192draft \u2014 no `conditions:`\
      \ key)"
  - code: "packs/built-in/missions/plan/mission.yaml:52 (review\u2192done \u2014 gate_passed(\"plan_approved\"\
      ), correctly described)"
  claim: "AS3 reads as attributing a gate_passed(...) condition to BOTH structure\u2192draft and review\u2192\
    done. Direct read confirms review\u2192done gates on gate_passed(\"plan_approved\"), but structure\u2192\
    draft has no conditions block at all \u2014 unconditional, not gated. The practical manifest conclusion\
    \ still holds, but the code claim is inaccurate as written.\n"
  remediation: "Rephrase AS3 to separate the two transitions' actual mechanisms: structure\u2192draft\
    \ is unconditional; review\u2192done gates on gate_passed(\"plan_approved\").\n"
