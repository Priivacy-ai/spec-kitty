findings:
  - id: TASKS-FRESH2-001
    lens: fresh-sweep
    severity: 3
    title: "tracer-approach.md's own mid-body DAG description is now false, uncorrected by either of its two trailing addenda"
    evidence:
      - artifact: "tracer-approach.md § \"Chokepoints & execution sequencing (tasks-authoring addendum, 2026-08-14)\""
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-approach.md:78-83 — \"Per `lanes.json` (computed by `finalize-tasks`), the execution DAG is: `parallel_group 0` = {WP01, WP04} (no deps on each other), `parallel_group 1` = {WP02, WP03} (both depend only on WP01), `parallel_group 2` = {WP05}...\""
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/lanes.json:29,50,68,89,116 — current computed lanes: lane-a/WP01 parallel_group 0; lane-b/WP02, lane-c/WP03, lane-d/WP04 ALL parallel_group 1; lane-e/WP05 parallel_group 2"
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-approach.md:129-140 — the file's own \"Second addendum ... round 2\" explicitly states \"the structural fix above closed the WP01-vs-WP04 collision but, as a side effect, moved WP04 into `parallel_group: 1`\", directly contradicting the earlier paragraph's claim that parallel_group 0 = {WP01, WP04}"
    claim: >
      The body paragraph that opens this file's chokepoint analysis (lines 78-83) states the
      execution DAG as parallel_group 0 = {WP01, WP04}, parallel_group 1 = {WP02, WP03}. That was
      true only before round 1's fix added `WP04: dependencies: [WP01]` to `wps.yaml`. Neither
      round 1's own addendum (lines 115-127, which describes the dependency-edge fix but doesn't
      touch this sentence) nor round 2's addendum (lines 129-140, added specifically to name the
      three-way collision this stale sentence still doesn't reflect) go back and correct the
      original claim itself — they both layer a correction ON TOP of a paragraph that, read on its
      own, still asserts the old, now-false two-way grouping. A reader who stops at the first
      paragraph (the file's stated "durable home" for this analysis, meant to be read by an
      orchestrator making sequencing decisions) gets an outright incorrect DAG. Two successive
      review-and-fix rounds have now each added a corrective addendum after this sentence without
      ever fixing the sentence that keeps needing correcting — the double-narrative pattern the
      round-2 fix pass was specifically supposed to be watching for (per plan.md's AS3/IC-04
      addenda, which correctly avoid this by editing in place plus a labeled note, not layering
      indefinitely).
    remediation: >
      Edit the original sentence at tracer-approach.md:78-83 directly to state the CURRENT DAG
      (parallel_group 0 = {WP01}; parallel_group 1 = {WP02, WP03, WP04}; parallel_group 2 = {WP05}),
      then either delete the now-redundant round-2 addendum (its content is fully subsumed once the
      root sentence is correct) or shrink it to a one-line historical note ("round 1 introduced a
      WP04→WP01 dependency edge that moved WP04 into parallel_group 1 alongside WP02/WP03; the DAG
      description above already reflects this"), matching the in-place-correction style plan.md's
      AS3/IC-04 addenda already use successfully.

  - id: TASKS-FRESH2-002
    lens: fresh-sweep
    severity: 3
    title: "WP01's own Chokepoint note and Risks section still describe a two-way WP02-vs-WP03 collision, not updated to the three-way WP02/WP03/WP04 framing round 2 applied everywhere else"
    evidence:
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § \"Chokepoint note: tests/dossier/test_manifest.py\" and § Risks"
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md:151 — \"WP02, WP03, and WP04 will each append their own named class to this same file\" (correctly names all three)"
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md:154-159 — \"Because WP02 and WP03 both depend only on WP01 and are nominally parallel with each other, both editing the same file concurrently is a real git-merge risk ... See tracer-approach.md's ... addendum for the orchestrator-level recommendation (sequence WP02/WP03's actual execution against this file ...)\" — WP04 is dropped from the risk analysis one sentence after being named as a fellow appender"
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md:421-423 — Risks section: \"Chokepoint risk on tests/dossier/test_manifest.py ... the risk materializes for WP02/WP03 landing after it\" — again omits WP04"
      - code: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP02-reconcile-manifests.md:105-113, tasks/WP03-plan-manifest-and-guard-gap-issue.md:88-93, tasks/WP04-deprecate-override-mirrors.md:108-114 — all three sibling WPs were updated by round 2 to name the three-way `parallel_group: 1` collision (WP02, WP03, and WP04) explicitly"
    claim: >
      Round 2's diff (d770ed08d..e939f1e49) updated WP02's, WP03's, and WP04's own chokepoint
      prose to the correct three-way framing (WP02+WP03+WP04, all in `parallel_group: 1`, per
      `lanes.json`), and updated tracer-approach.md with a second addendum making the same point.
      But WP01 — the file's declared sole `owned_files` owner and the WP whose own "Chokepoint
      note" section is the first place a reader encounters this analysis — was not touched by
      round 2 at all except in its Reviewer Guidance section. Its Context-section Chokepoint note
      still names WP04 as an appender (line 151) but then confines the "real git-merge risk"
      language and the tracer-approach.md pointer to "WP02/WP03's actual execution" only,
      contradicting the now-current three-way framing in every sibling WP and in
      tracer-approach.md's own round-2 addendum. The Risks section repeats the same two-way framing
      independently. This is the exact inconsistency the task brief flagged as a likely gap: WP01
      is not itself in `parallel_group: 1` but, as the file's original owner, its own account of who
      shares the collision risk needs to match the corrected picture everywhere else in the mission.
    remediation: >
      In tasks/WP01-schema-hardening-and-loud-failure.md, update the Chokepoint note (around
      line 154-159) to read "Because WP02, WP03, and WP04 all depend only on WP01 and sit together
      in `parallel_group: 1`, all three editing the same file concurrently is a real git-merge
      risk..." and the tracer-approach.md pointer to "sequence WP02/WP03/WP04's actual execution
      against this file". Apply the same three-way correction to the Risks section bullet at
      line 421-423 ("the risk materializes for WP02/WP03/WP04 landing after it").
