findings:
  - id: TASKS-SEQ-001
    lens: chokepoints
    severity: 3
    title: "WP04's tests/dossier/test_manifest.py collision has no dependency edge in wps.yaml/lanes.json; the mitigation is prose the automated scheduler cannot see"
    evidence:
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/wps.yaml (WP04: dependencies: [])"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/lanes.json (lane-d/WP04: depends_on_lanes: [], parallel_group: 0 — same group as lane-a/WP01; lane-d write_scope lists only the 3 .kittify/overrides files, no tests/dossier/test_manifest.py; lane-b/WP02 and lane-c/WP03 write_scope likewise omit tests/dossier/test_manifest.py)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-approach.md § 'Chokepoints & execution sequencing' — 'this is an execution-order recommendation for whoever drives the implement-review loop, not a dependency the tasks/lanes machinery encodes structurally'"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP04-deprecate-override-mirrors.md § Out-of-map edit — 'do not start T018's edit to test_manifest.py until WP01 has actually landed (even though the dependency graph doesn't require it)'"
    claim: >
      tests/dossier/test_manifest.py is edited by all 5 WPs (WP01 as declared owner; WP02, WP03,
      WP04 each via an undeclared, prose-only "out-of-map edit" adding their own new test class).
      lanes.json's write_scope arrays for lane-b/c/d omit this file entirely, so any tooling that
      gates concurrent-lane scheduling on write_scope disjointness (the mechanism the "Write
      scopes" review lens itself checks) would certify lane-a (WP01, parallel_group 0) and lane-d
      (WP04, also parallel_group 0, zero dependencies) as non-colliding and safe to run
      concurrently — when the WP prompts' own text says otherwise. The only actual safeguard is a
      natural-language recommendation in tracer-approach.md ("land WP01 first... even though the
      dependency graph permits WP04 to run concurrently with WP01"), which the mission's own text
      concedes is advisory only. The spec-kitty-implement-review skill's "dependency-aware
      sequencing" is described as driving off the dependency graph (wps.yaml/lanes.json), not off
      markdown prose in a tracer file — so an automated orchestrator that schedules purely from
      lanes.json's parallel_group/depends_on_lanes has no structural signal to serialize WP01 and
      WP04's touches of this file, and the same exposure recurs for WP04 against WP02/WP03 during
      parallel_group 1, since WP04 carries no dependency edge constraining when it runs at all
      (tracer-approach.md's own analysis only calls out the WP01 collision, not the WP02/WP03 one,
      even though the structural cause — WP04 having zero dependencies — is identical for both).
    remediation: >
      Add a dependency edge in wps.yaml (e.g. WP04: dependencies: [WP01], or a lighter
      scheduling-only marker if the tooling distinguishes content-dependencies from
      ordering-dependencies) so finalize-tasks recomputes lanes.json to place WP04 in a later
      parallel_group than WP01, or — if an artificial content dependency is undesirable — extend
      lane-b/c/d's write_scope in lanes.json to explicitly include tests/dossier/test_manifest.py
      so the disjointness/overlap machinery that actually gates concurrent execution can see and
      serialize the real collision instead of relying on an agent reading and manually honoring
      tracer-approach.md's prose.

  - id: TASKS-SEQ-002
    lens: mission-specific (ATDD / Definition-of-Done internal consistency)
    severity: 4
    title: "WP01's Definition of Done claims all 7 new tests are GREEN, but its own T005 validation text says one of them (test_all_shipped_manifests_load_after_hardening) is still red on the `plan` assertion at WP01's completion"
    evidence:
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T002, step 4 (test_all_shipped_manifests_load_after_hardening loads all four shipped manifests including `plan` and asserts each is non-None)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T005 Validation — 'this partial check is expected to still show `plan` as `None` until WP03 lands'"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md § Definition of Done — 'All 7 new/updated tests in this WP are GREEN.' (no carve-out stated)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP03-plan-manifest-and-guard-gap-issue.md § Subtask T016 Validation — 'closing out the partial check WP01 left open for `plan`' (confirms the mission's own authors treat the check as still open past WP01)"
    claim: >
      WP01's T002 adds 4 tests (test_expected_artifact_spec_rejects_extra_keyword,
      test_expected_artifact_manifest_rejects_extra_keyword,
      test_all_shipped_manifests_load_after_hardening, test_load_manifest_raises_on_malformed_yaml);
      T003 adds 2; T004 adds 1 — 7 total, matching the DoD's "All 7" count.
      test_all_shipped_manifests_load_after_hardening asserts ManifestRegistry.load_manifest()
      returns non-None for all four shipped manifests, including `plan` — but `plan`'s manifest
      file (packs/built-in/missions/plan/expected-artifacts.yaml) is not authored until WP03, a
      separate WP that WP01 has zero dependency on (WP01: dependencies: [] in wps.yaml) and that is
      explicitly designed to be independently landable and reviewable first ("recommended to land
      first"). WP01's own T005 validation step is honest about this: it says the re-run of this
      exact test is "expected to still show `plan` as `None`" — i.e. still failing one of its four
      assertions — at the point WP01's own implementation (T005-T007) is complete. WP03's T016
      validation text independently corroborates this ("closing out the partial check WP01 left
      open for `plan`"). Yet WP01's Definition of Done unconditionally states "All 7 new/updated
      tests in this WP are GREEN" with no exception carved out for this one test. A reviewer
      applying the DoD checklist literally at WP01's own completion (before WP02/WP03 land, which
      the mission's phasing explicitly permits and even recommends) must either incorrectly check
      the box while a test is still failing — a false-GREEN gate, contradicting the charter's
      red-first/never-retry-to-green discipline and the "never trust a green check... without
      verifying against live code" throughline — or be unable to check the box at all, which
      incorrectly blocks WP01's own sign-off on content that structurally cannot exist until a
      different, later WP lands. This is a genuine internal contradiction inside a single WP
      prompt, not merely an ambiguity.
    remediation: >
      Either (a) split test_all_shipped_manifests_load_after_hardening into two assertions: one
      covering the three currently-shipped manifests (research/documentation/software-dev), which
      is fully GREEN within WP01 and counted in its "All N tests GREEN" DoD bullet, and a separate
      plan-manifest-loads assertion scoped to WP03 (which already duplicates this coverage via
      TestPlanManifest.test_plan_manifest_loads_and_matches_state_machine, so the WP01-side
      assertion could simply be narrowed to the three shipped types); or (b) explicitly carve out
      the exception in WP01's Definition of Done, e.g. "6 of 7 tests are fully GREEN;
      test_all_shipped_manifests_load_after_hardening is GREEN for research/documentation/
      software-dev and remains red on its `plan` sub-assertion until WP03 lands — this is expected
      and not a WP01 blocker." Either fix removes the contradiction between T005's honest validation
      note and the DoD's unconditional "All 7... GREEN" claim.
