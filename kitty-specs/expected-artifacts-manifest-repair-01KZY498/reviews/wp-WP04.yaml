findings:
  - id: WP04-001
    severity: 2
    lens: tests
    file: "tests/dossier/test_manifest.py:872-878 (TestOverrideMirrorDeprecation.test_override_mirror_files_carry_deprecation_header, body-content-unchanged block)"
    claim: |
      The test's own docstring/inline comment claims the body-content
      assertions are "independent of the header-comment assertions ... it
      fails if T019 (or any future 'drift hygiene' refresh) touches
      required_by_step/optional_always content." This overstates what is
      actually checked. The assertions only fingerprint structure —
      mission_type, schema_version, manifest_version, the ORDERED KEYS of
      required_by_step, and the COUNT of optional_always — not the leaf
      values inside required_by_step's per-step lists (artifact_key,
      artifact_class, path_pattern, blocking) or optional_always's entries,
      and required_always is not checked at all.
    evidence: |
      Reproduced directly: with the current (post-WP04) research mirror in
      place, replaced the string "research.md" with "research-REPLACED.md"
      (a path_pattern leaf-value mutation, no key added/removed/reordered)
      and reran `uv run pytest
      tests/dossier/test_manifest.py::TestOverrideMirrorDeprecation -q` — it
      passed (1 passed), even though the manifest's actual content had just
      been "refreshed." Reverted with `git checkout --` immediately after;
      confirmed `git status --porcelain` empty. By contrast, mutating
      manifest_version ("1" -> "2") DOES correctly fail the test, so the
      guard is real for top-level scalars and key/count-level structure —
      just not for values nested inside required_by_step's per-step entries.
    recommendation: |
      Not blocking — the current diff is independently confirmed
      byte-identical below the header by the orchestrator's own sha-compare,
      so no drift has actually occurred, and this is a guard for FUTURE
      drift-hygiene refreshes rather than a defect in what's being merged
      now. Consider tightening the body-content assertions in a follow-up
      (e.g. compare the full parsed structure, or a hash of the
      post-header content, against the pre-WP04 fingerprint) so the test's
      docstring claim becomes literally true, or soften the docstring to
      describe only what is actually pinned (structural/key-level, not
      full leaf-value, unchanged-ness).
