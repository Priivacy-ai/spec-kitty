findings:
  - id: TASKS-FRESH1-001
    lens: fresh-sweep
    severity: 4
    title: >-
      The WP01-fix round moved WP04 into the same parallel_group as WP02/WP03
      (all now concurrent on tests/dossier/test_manifest.py), but no document
      names the resulting three-way chokepoint — WP02/WP03's own "Chokepoint"
      notes, and tracer-approach.md's TASKS-SEQ-001 addendum, each still speak
      of only a two-way (WP02-vs-WP03) or two-way (WP01-vs-WP04) risk.
    evidence:
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/lanes.json"
        code: >-
          lane-b (WP02) parallel_group 1 depends_on_lanes [lane-a]; lane-c
          (WP03) parallel_group 1 depends_on_lanes [lane-a]; lane-d (WP04)
          parallel_group 1 depends_on_lanes [lane-a] — all three lanes are
          now in the identical parallel_group with an identical dependency
          set (only WP01/lane-a), none depending on one another.
      - artifact: "tasks/WP02-reconcile-manifests.md § ⚠️ Out-of-map edit"
        code: >-
          "⚠️ Chokepoint: WP03 similarly makes an out-of-map edit to this same
          file ... and depends only on WP01, the same as this WP — the two
          WPs are nominally parallel with each other." (WP04 is not named,
          even though it is now scheduled in the identical parallel_group.)
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § ⚠️ Out-of-map edit"
        code: >-
          "Chokepoint: WP02 similarly edits this file and also depends only
          on WP01, the same as this WP" (again names only WP02, omitting
          WP04).
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § ⚠️ Out-of-map edit"
        code: >-
          "test_manifest.py is touched by four WPs total, and this was
          previously the one WP with no formal dependency forcing it to
          wait, making it the most likely to collide with WP01's own
          first-touch commit if run truly concurrently." — frames the risk
          as solely WP04-vs-WP01 (now fixed); does not flag that WP04 sits in
          the same parallel_group as WP02/WP03 and can therefore still
          collide with either of them.
      - artifact: "tracer-approach.md § Chokepoints & execution sequencing, Addendum (TASKS-SEQ-001)"
        code: >-
          "The WP02/WP03-vs-WP01 ordering recommendation in this section
          remains prose-only by design (WP02 and WP03 are content-independent
          of each other and both already formally depend on WP01; sequencing
          *between* WP02 and WP03 for this one shared file is left as
          execution-order guidance...)" — the addendum's own closing sentence
          scopes the residual prose-only risk to a WP02-vs-WP03 pair only,
          not acknowledging that its own fix (adding WP04's dependency on
          WP01) placed WP04 in that same parallel group, turning a two-way
          "left as execution-order guidance" gap into an undocumented
          three-way one.
    claim: >-
      Before this fix round, the "Chokepoints & execution sequencing"
      analysis described exactly one real concurrency risk needing
      orchestrator judgment: WP02-vs-WP03 (both parallel_group 1, both
      touching test_manifest.py). WP04 was a separate, worse problem
      (parallel_group 0, no dependency at all) that the fix round correctly
      solved by adding `dependencies: [WP01]`. But re-running
      `finalize-tasks` after that edit placed WP04 in `parallel_group 1` —
      the exact same group as WP02 and WP03 — so the file-collision surface
      the addendum describes as "left as execution-order guidance" for a pair
      is now actually a trio (WP02, WP03, WP04), none of which depend on each
      other, all editing the same file via disjoint out-of-map test classes.
      No artifact updated by this fix round (tracer-approach.md's own
      addendum, or WP02/WP03/WP04's individual "Chokepoint" notes) states
      this three-way shape; each still describes only the two WPs it already
      knew about before the fix, so an orchestrator reading any single one of
      these notes in isolation would under-plan the sequencing needed to land
      WP02, WP03, and WP04's edits to test_manifest.py without a merge
      collision.
    remediation: >-
      Update tracer-approach.md's addendum (or add a new one) to state
      explicitly that WP02, WP03, and WP04 are now co-located in
      parallel_group 1 with no dependency edges among themselves, so the
      "sequence execution against this shared file" recommendation must cover
      all three, not just WP02-vs-WP03. Update WP02's and WP03's "Chokepoint"
      notes to name WP04 alongside each other, and WP04's note to name WP02
      and WP03 alongside WP01, so any one WP prompt read in isolation gives
      the complete concurrency picture.

  - id: TASKS-FRESH1-002
    lens: fresh-sweep
    severity: 3
    title: >-
      WP04's own "Risks" section still asserts "this WP has no formal
      dependency on WP01," directly contradicting the same file's Context
      section, frontmatter, and wps.yaml/lanes.json — all of which this same
      fix round updated to add that dependency.
    evidence:
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Risks"
        code: >-
          "- **Chokepoint**: this WP has no formal dependency on WP01 but
          shares `test_manifest.py` with it (and with WP02/WP03) — see the
          Context section above and the mission's `tracer-approach.md`
          \"Chokepoints & execution sequencing\" addendum for the sequencing
          recommendation."
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Content-independent, but sequenced after WP01"
        code: >-
          "This WP now carries a formal `dependencies: [WP01]` edge in
          `wps.yaml` for exactly this reason: **do not start T018's edit to
          `test_manifest.py` until WP01 has actually landed** — this is now a
          structural scheduling constraint the lanes machinery enforces (WP04
          lands in a later `parallel_group` than WP01), not merely prose an
          orchestrator has to remember to honor."
      - artifact: "tasks/WP04-deprecate-override-mirrors.md:4-5 (frontmatter)"
        code: "dependencies:\n- WP01"
    claim: >-
      Within the single WP04 prompt file, the Context section (updated by
      this fix round) and the frontmatter both now state WP04 formally
      depends on WP01, but the file's own Risks section — not touched by this
      fix round's diff — still reads "this WP has no formal dependency on
      WP01," the literal statement the fix round was written to make untrue.
      A reviewer or implementer skimming only the Risks section (a natural
      place to look for "what could go wrong") gets the pre-fix answer.
    remediation: >-
      Edit the Risks bullet in tasks/WP04-deprecate-override-mirrors.md to
      match the Context section's corrected framing, e.g.: "Chokepoint: this
      WP now formally depends on WP01 (structurally enforced via
      parallel_group scheduling), and shares test_manifest.py with WP02/WP03
      as well, which remain unenforced peers in the same parallel_group — see
      the Context section above and tracer-approach.md's 'Chokepoints &
      execution sequencing' addendum for the full picture."

  - id: TASKS-FRESH1-003
    lens: fresh-sweep
    severity: 3
    title: >-
      plan.md's Test Strategy table still names
      `test_all_shipped_manifests_load_after_hardening` as asserting "All
      four shipped expected-artifacts.yaml files load successfully," which is
      now false against WP01's own (fix-round-narrowed) description of that
      same test.
    evidence:
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion, AS3 row"
        code: >-
          "| AS3 (US3, no false positive, SC-003) | `tests/dossier/test_manifest.py`
          | `test_all_shipped_manifests_load_after_hardening` | All four
          shipped `expected-artifacts.yaml` files load successfully via
          `ManifestRegistry.load_manifest()` post-hardening | ..."
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § T002.4"
        code: >-
          "Add `test_all_shipped_manifests_load_after_hardening`: load the
          three shipped `expected-artifacts.yaml` files this WP can actually
          make pass — `research`, `documentation`, `software-dev` — via
          `ManifestRegistry.load_manifest()` and assert each returns
          non-`None`. **Do not assert on `plan` here** ..."
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Definition of Done"
        code: >-
          "including `test_all_shipped_manifests_load_after_hardening`, which
          asserts only on the three manifests WP01 owns
          (`research`/`documentation`/`software-dev`); it does not assert on
          `plan`"
    claim: >-
      This fix round rewrote WP01's own description of
      `test_all_shipped_manifests_load_after_hardening` to explicitly cover
      only three manifests (deferring `plan`'s coverage to WP03), and updated
      every place inside the WP01 file consistently. It did not touch
      plan.md, whose Test Strategy table still names that exact test function
      and claims it checks "All four shipped `expected-artifacts.yaml`
      files" — a factually incorrect description of the test as it now
      actually exists in tasks/WP01. A reviewer using plan.md's table as the
      acceptance-criteria ledger (its stated purpose) would look for a single
      test proving AS3/SC-003's "all four load" claim and not find one under
      that name — the claim is still true in aggregate (WP01's 3 + WP03's 1),
      but no single artifact states that distribution, and plan.md
      misdescribes the one test it does name.
    remediation: >-
      Update plan.md's Test Strategy table AS3 row to reflect the actual
      fix-round split: `test_all_shipped_manifests_load_after_hardening`
      (WP01) now asserts on the three research/documentation/software-dev
      manifests only; `plan`'s loadability is asserted separately by WP03's
      `test_plan_manifest_loads_and_matches_state_machine`. State both test
      names in the row (or add a second row) so the table's "all four load"
      claim is traceable to the actual two tests that jointly cover it.

  - id: TASKS-FRESH1-004
    lens: fresh-sweep
    severity: 2
    title: >-
      plan.md's IC-04 section still says "Sequencing/depends-on: none —
      fully independent of IC-01-IC-03," now stale against WP04's formal
      `dependencies: [WP01]` added by this fix round in wps.yaml/tasks.md/lanes.json.
    evidence:
      - artifact: "plan.md § IC-04 — Deprecate the dead .kittify/overrides/ manifest mirrors"
        code: "\"- **Sequencing/depends-on**: none — fully independent of IC-01-IC-03 (these three files are never read by any production code path, confirmed above)\""
      - artifact: "wps.yaml:79-82"
        code: "- id: WP04\n    ...\n    dependencies:\n      - WP01"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks.md § Work Package WP04"
        code: "**Dependencies**: WP01"
    claim: >-
      plan.md's Implementation Concern Map was not touched by this fix round
      (absent from the `git diff 2fd77965a..d770ed08d` file list), so IC-04's
      "Sequencing/depends-on: none" line still describes the pre-fix state.
      wps.yaml, tasks.md, lanes.json, and WP04's own prompt file were all
      updated in this same round to give WP04 a formal dependency on WP01 for
      the scheduling reasons tracer-approach.md's TASKS-SEQ-001 addendum
      explains. Severity is capped at minor because plan.md's Implementation
      Concern Map opens with an explicit disclaimer ("sequencing notes are
      recommendations, not commitments — the tasks phase makes the final WP
      slicing decision"), so this is documented drift within plan.md's own
      stated tolerance, not a hard contradiction of a binding claim — but it
      is still a plan-vs-tasks mismatch a fidelity reviewer would trip over.
    remediation: >-
      Add a short note to plan.md's IC-04 "Sequencing/depends-on" line (or an
      addendum, matching the pattern already used elsewhere in this plan for
      post-hoc corrections) recording that the tasks phase added a formal
      WP01 dependency for scheduling reasons, superseding the "none" reading
      here — consistent with how plan.md already documents other
      tasks-phase-driven corrections (e.g. PLAN-FRESH-001/PLAN-ARCH-001
      references already present in the Implementation Concern Map).
