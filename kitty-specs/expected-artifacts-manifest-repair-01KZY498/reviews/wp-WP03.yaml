findings:
  - id: WP03-001
    severity: 2
    lens: contract
    file: "packs/built-in/missions/plan/expected-artifacts.yaml (header comment, ~line 15) and https://github.com/Priivacy-ai/spec-kitty/issues/3407 (body)"
    claim: |
      The AS4 guard-gap header comment (and, identically, the filed
      issue's body) cites `_check_cli_guards` at
      `src/runtime/next/runtime_bridge.py:680-698`. In the actual tree —
      both at this WP's base (c54fbf13c) and at HEAD, since runtime_bridge.py
      has zero diff across this WP — `_check_cli_guards` is at lines
      785-803, not 680-698. The tracer doc's own citation for
      `_should_advance_wp_step` (`runtime_bridge.py:618-630`, quoted in the
      filed issue but not literally repeated in the manifest's own text) is
      similarly off: the actual function starts at line 723. Both citations
      are wrong by the same ~105-line offset, which points at a
      pre-existing tracer-doc citation error inherited from planning
      (confirmed: `git show c54fbf13c:src/runtime/next/runtime_bridge.py |
      grep -n _check_cli_guards` already returns 785, i.e. this WP did not
      introduce or worsen the drift — it faithfully copied T016 step 4's
      prescribed wording, including the citation, from
      tracer-design-decisions.md Decision 1).
    evidence: |
      `sed -n '785,803p' src/runtime/next/runtime_bridge.py` shows the real
      `_check_cli_guards` def and body at those lines, hardcoding
      `mission_family="software-dev"` — confirming the MECHANISM claim is
      accurate, only the line-number pointer is wrong.
      `runtime_bridge_cores.py:554-566` and `:564-565` (also cited in the
      tracer doc, not repeated verbatim in the manifest itself) ARE
      accurate — verified by direct read. The mismatch is isolated to the
      two runtime_bridge.py citations. `git show c54fbf13c:...runtime_bridge.py
      | grep -n _check_cli_guards` = line 785, proving the offset predates
      this WP's four commits.
    recommendation: |
      Low severity because (a) the mechanism-level claim — the hardcoded
      mission_family="software-dev", the review-step lexical collision, the
      wp_advance_ready default-True masking — is verified accurate and is
      the substantive content AS4 exists to pin; (b) it is documentation
      inside a comment and an issue body, not enforcement logic, so it
      cannot mask a real guard failure; (c) it was faithfully copied per
      the WP contract's literal T016 instructions from a planning-phase
      source that was already stale, not fabricated by this WP's
      implementation. Still worth a fast-follow: correct both citations
      (a comment edit in the manifest file, and a `gh issue edit 3407`
      body correction) so a future reader who jumps to the cited lines
      lands on `_check_cli_guards`/`_should_advance_wp_step`, not on
      unrelated WP-iteration helper code. Not blocking for this WP.
  - id: WP03-002
    severity: 1
    lens: tests
    file: "tests/dossier/test_manifest.py:777 (test_plan_manifest_header_names_guard_gap_mechanism)"
    claim: |
      The AS4 test's `assert "review" in raw_text.lower()` line is a very
      weak anchor on its own — "review" appears throughout the manifest as
      an ordinary step name (`required_by_step: review: []`), not only
      inside the guard-gap comment, so this particular assertion would
      still pass even if the comment's specific naming of the review-step
      lexical collision were deleted entirely.
    evidence: |
      Confirmed by inspection: the manifest's `required_by_step.review`
      block and its own step-id list both contain the literal word
      "review" independent of the header comment.
    recommendation: |
      Not a defect in the merged content (the header comment does, in
      fact, name the collision precisely, and the same test's `assert
      "collide" in raw_text.lower()` line is a much stronger,
      comment-specific anchor that would catch a genericized rewrite). This
      is a note on the test's redundant assertion, not on the manifest.
      Severity 1 (informational) — optional cleanup for a future pass, not
      requested as a follow-up here.
