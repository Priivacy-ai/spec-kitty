- id: pr-contract-001
  lens: contract
  severity: 3
  title: '"Malformation now raises" is only true for schema-level malformation; YAML-syntax-level malformation
    still silently degrades to the same None path as absence'
  evidence:
  - artifact: manifest.py docstring shipped in this diff
  - code: src/specify_cli/dossier/manifest.py::ManifestRegistry.load_manifest (lines 184-222, esp. 192-196,
      214-217)
  - code: src/doctrine/missions/repository.py::MissionTemplateRepository.get_expected_artifacts (lines
      362-383, catch at 382)
  - code: tests/dossier/test_manifest.py::TestManifestHardening.test_load_manifest_raises_on_malformed_yaml
      (lines 539-564)
  claim: 'FR-016''s fix (this diff) makes `load_manifest()` distinguish "absent" from "malformed" for
    one specific failure mode: a syntactically valid YAML document that violates the Pydantic schema (an
    unrecognized/typo''d key, caught by the new `extra="forbid"`). The new docstring this diff adds states
    the guarantee generally: "Gracefully returns None if the manifest is not found ... but a *found*,
    malformed manifest ... raises ... instead of being silently swallowed ... absence and malformation
    are distinct outcomes, and only absence degrades to None." That claim is broader than what the code
    delivers. `load_manifest()`''s `config is None` branch (manifest.py:214-217) is reached whenever `_doctrine_repository().get_expected_artifacts(mission_type)`
    returns None — and that helper (src/doctrine/missions/repository.py, untouched by this diff) returns
    None not only when the file is absent, but also on `OSError`, `UnicodeDecodeError`, or `YAMLError`
    (repository.py:382), i.e. genuinely broken YAML (bad indentation, unclosed structures, duplicate keys
    ruamel rejects, etc.) — an even more clear-cut case of "found but malformed" than a typo''d key, yet
    it still collapses to the exact same "not found" outcome the whole mission exists to eliminate. The
    one test whose name promises this coverage, `test_load_manifest_raises_on_malformed_yaml`, does not
    actually feed malformed YAML through the loader; it feeds the schema-typo fixture (`expected_artifacts_typo.yaml`,
    still syntactically valid YAML) through a monkeypatched `_doctrine_repository`, so it exercises the
    `extra="forbid"` path, not the YAMLError path its name suggests. No test in this diff constructs an
    actual YAML-syntax error and asserts it raises rather than degrading to None.'
  remediation: Either narrow the docstring/tracer language to say precisely what changed ("schema-validation
    malformation now raises; YAML-syntax malformation is unchanged and still degrades to None, tracked
    separately") so a future reader doesn't assume broader coverage than exists, or extend FR-016's scope
    to also let YAMLError propagate from `get_expected_artifacts`/`load_manifest` (with the same "found
    but broken" semantics as the schema case), and add a test that actually constructs invalid YAML syntax
    (not just an extra key) and asserts it raises. At minimum, rename `test_load_manifest_raises_on_malformed_yaml`
    to name what it actually tests (a typo'd/extra key), since its current name will mislead a future
    reader auditing coverage for this exact gap.
- id: pr-contract-002
  lens: contract
  severity: 3
  title: manifest_version staying "1" across a materially reconciled required_by_step is a reasoned but
    unverified bet on a system this repo cannot see into
  evidence:
  - artifact: kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-design-decisions.md § Decision
      2
  - code: 'packs/built-in/missions/documentation/expected-artifacts.yaml (validate: [] -> now requires
      evidence.audit-report blocking=true; publish: [] -> now requires output.release.main blocking=true;
      audit: dropped workflow.plan.documentation/workflow.tasks.documentation)'
  - code: 'packs/built-in/missions/software-dev/expected-artifacts.yaml (implement: evidence.analysis-report
      blocking=true -> now [])'
  - code: src/specify_cli/dossier/indexer.py:354-391 (_find_missing_artifacts consumes required_by_step
      directly, no manifest_version gating)
  - code: src/specify_cli/sync/namespace.py::resolve_manifest_version (lines 92-108)
  claim: 'Decision 2 (adversarially re-evaluated per this lens''s mandate, not deferred to) argues `manifest_version`
    is purely a sync-namespace identity key and "nothing in this tree branches on its numeric value beyond
    string equality inside the namespace tuple," so reconciling `required_by_step` content without bumping
    it is safe. That premise is correct for *this repository*: `manifest_version` never gates local indexer/reconciliation
    behavior — the indexer reads `required_by_step` directly and unconditionally (indexer.py:354-391),
    so the same `manifest_version: "1"` now denotes a behaviorally different contract (different required/blocking
    artifacts per step) than it did before this merge, for every mission dossier indexed going forward.
    That is a real, immediate, local behavior change (the intended bug fix — not itself a defect), but
    it means "manifest_version: 1" no longer uniquely identifies one fixed `required_by_step` shape even
    within this repo''s own history; it identifies "whatever the built-in manifest says today." The decision''s
    mitigation for the *external* risk — a `spec-kitty-saas` consumer, or any other external reader of
    these YAML files, that treats `manifest_version` as an immutable content fingerprint (the standard
    reading of a field named "version" sitting next to `required_by_step`) — is explicitly "this repo
    cannot verify spec-kitty-saas''s blast radius either way," which is honestly stated but is an unresolved
    unknown being resolved in the direction of "ship it," not a verified-safe conclusion. The decision
    record correctly identifies this is a judgment call under genuine uncertainty; recording it here per
    this lens''s explicit charge to evaluate Decision 2 adversarially rather than defer to it.'
  remediation: 'No code change requested — this is a documentation/traceability gap, not a functional
    defect, and the rejected-alternative already correctly identifies the real fix (a scoped follow-up
    coordinated with spec-kitty-saas to determine whether it treats manifest_version as a content fingerprint).
    Strengthen the inline YAML comment and Decision 2 to state explicitly that `manifest_version: "1"`
    is therefore not a reliable signal of `required_by_step` content stability even within this repository''s
    own git history — a consumer wanting to detect content drift must diff the YAML itself, not compare
    `manifest_version` — so a future reader does not reach for `manifest_version` as a change-detection
    mechanism and get burned by this precedent.'
