  - code: .github/workflows/ci-quality.yml:1113
  - code: .github/workflows/ci-quality.yml:1535
  - code: .github/workflows/ci-quality.yml:3491
  claim: 'The two enforced coverage floors ("[ENFORCED] Enforce kernel coverage floor (90%)" and "[ENFORCED]
    Mission loader coverage gate (>=90%)") instrument only src/kernel and src/specify_cli/mission_loader
    respectively; the diff-coverage critical-path gate''s `critical_paths` array (ci-quality.yml:3491-3502)
    also does not include src/specify_cli/dossier/* or src/specify_cli/sync/* — only its advisory full-diff
    step would see this diff''s src/ changes. Neither of the two floors this mission''s PR body names
    ("kernel >=90%, mission loader >=90%") is structurally capable of going red because of anything in
    src/specify_cli/dossier/manifest.py or src/specify_cli/sync/namespace.py, the two src/ files this
    diff actually touches — those floors were never in the causal path the review brief implied. This
    is a pre-existing CI-topology characteristic, not something this PR introduced or worsened. Measured
    directly instead: running the mission''s own dossier/reconcile/namespace/ integration tests with `--cov=specify_cli.dossier.manifest
    --cov=specify_cli.sync.namespace` locally gives 99% (80 stmts, 1 miss at manifest.py:155) and 100%
    (62 stmts) respectively — well above 90% even though no named gate actually counts it.

    '
  remediation: 'No action required for this PR. If the team wants the named 90% floors to mean what the
    mission''s own framing implies for dossier/sync work, add ''src/specify_cli/dossier/*'' and ''src/specify_cli/sync/*''
    to the diff-coverage critical_paths array in a separate CI-topology change (out of scope for this
    diff).

    '
