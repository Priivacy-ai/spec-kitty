findings:
  - id: SPEC-ARCH-001
    lens: Close Defect Classes by Construction (DIRECTIVE_043) / Contracts
    severity: 4
    title: "FR-009's ValidationError is silently swallowed by ManifestRegistry.load_manifest(), so the schema-hardening fix never surfaces on the only production loading path"
    evidence:
      - artifact: "spec.md § User Story 3 motivation (lines 284-287) and Acceptance Scenarios AS1/AS2 (lines 298-305)"
      - artifact: "spec.md § Key Entities, ManifestRegistry entry (lines 378-380): \"Unmodified by this mission — it is a pure reader\""
      - code: "src/specify_cli/dossier/manifest.py:207-215"
    claim: >
      User Story 3's motivation is that a typo'd manifest key should "raise a validation error
      immediately... instead of silently parsing." FR-009 adds `extra="forbid"` to
      ExpectedArtifactSpec/ExpectedArtifactManifest, which does make direct Pydantic construction
      raise (confirmed: AS1/AS2 construct the models directly and correctly expect
      pydantic.ValidationError). But the sole production loading path —
      ManifestRegistry.load_manifest() at manifest.py:207-215 — wraps
      `ExpectedArtifactManifest.model_validate(config.parsed)` in a bare `except Exception as e:
      logger.error(...); return None`. Every real reader (the dossier indexer,
      resolve_manifest_version(), and _resolve_expected_artifacts_slot() via
      get_expected_artifacts()) goes through this method, not through direct model construction.
      A typo'd key in a real, hand-edited expected-artifacts.yaml will therefore still be silently
      converted to a `None` return (identical to "manifest not found") and merely logged at ERROR
      level — the exact "silently parsing... as if simply absent" failure mode the mission claims
      to fix, just moved one layer down (from a dropped field to a dropped manifest). No acceptance
      scenario exercises load_manifest() with a typo'd real YAML file, so the mission's own
      acceptance bar does not catch that the claimed author-time-visibility benefit is not
      delivered end-to-end, while the spec explicitly declares ManifestRegistry out of scope for
      changes.
    remediation: >
      Either (a) add an FR/AC that changes ManifestRegistry.load_manifest()'s exception handling to
      distinguish pydantic.ValidationError from a genuine missing-file/parse-absence case — e.g.
      re-raise ValidationError (or log at a level/channel that surfaces to the CLI operator) while
      still returning None for a genuinely absent file — so a typo is loud through the real
      consumer path, not just through direct model construction; or (b) if changing
      ManifestRegistry is deliberately out of scope, rewrite User Story 3's motivation and
      acceptance bar to state plainly that the loud-failure guarantee is scoped to direct model
      construction (authoring/test tooling), not to the load_manifest() path every real consumer
      uses — so the spec does not claim to close the "silently parses" defect class end-to-end when
      it does not.

  - id: SPEC-ARCH-002
    lens: Contracts
    severity: 4
    title: "Decision 1 and US2-AS4's claim that plan-type step ids 'all fall to the bare return []' is false for 'review', and the header comment FR-010 mandates would bake that false claim into a shipped file"
    evidence:
      - artifact: "spec.md lines 22-24 (Decision 1 Q, Session 2026-08-13): \"...matches none of `plan` mission type's own state names, so a `plan`-type step id returns `[]` unconditionally today\""
      - artifact: "spec.md § User Story 2, Acceptance Scenario 4 (lines 270-274): \"...recognizes `plan` mission type's step ids (`goals`/`research`/`structure`/`draft`/`review` all fall to the bare `return []`)...\""
      - code: "src/runtime/next/runtime_bridge_cores.py:554-566 (_evaluate_software_dev_guards dispatch), :564 (`if step_id in (\"implement\", \"review\"): return _evaluate_wp_iteration_guard(step_id, snapshot)`)"
    claim: >
      `plan` mission type's own state list is goals/research/structure/draft/review/done.
      `_evaluate_software_dev_guards`'s recognized vocabulary is
      specify/plan/tasks_outline/tasks_packages/tasks_finalize/tasks/implement/review — which the
      spec itself quotes two lines earlier at line 22. "review" is a member of BOTH sets. Verified
      directly: runtime_bridge_cores.py:564 explicitly matches `step_id == "review"` and dispatches
      to `_evaluate_wp_iteration_guard`, a real (if semantically nonsensical for a plan-type
      mission) guard evaluation — not a silent `return []`. Only goals/research/structure/draft
      fall to the bare `return []` at line 566; review does not. The spec's "matches none of plan
      mission type's own state names" (line 23) and "all fall to the bare return []" (AS4, line
      272-273) are both factually wrong on this one point, and AS4 as written directs the new
      plan/expected-artifacts.yaml header comment to assert this incorrect claim verbatim in a
      shipped file — the same "unreliable, not reconciled against observed code" defect class this
      mission exists to close, reproduced inside its own remedy's documentation.
    remediation: >
      Correct Decision 1's rationale and AS4 to state precisely: goals/research/structure/draft
      fall to the bare return []; review IS recognized by _evaluate_software_dev_guards (line 564,
      the implement/review branch) and dispatches to _evaluate_wp_iteration_guard — a guard that
      checks WP-lane status, which is meaningless for a plan-type mission with no WPs, but is not a
      no-op `[]`. Have the mandated header comment in plan/expected-artifacts.yaml state this
      precisely rather than the blanket "all fall to []" framing.

  - id: SPEC-ARCH-003
    lens: "Mission-derived: Non-gate consumer accuracy"
    severity: 4
    title: "Non-Gate Consumer Notes names the wrong class/property (MissionTypeProfile.expected_artifacts does not exist) and its 'no consumer beyond its own docstring' claim is contradicted by a real, repo-present test consumer"
    evidence:
      - artifact: "spec.md § Overview \"Motivation\" (lines 70-71): \"...`mission_type_profiles._resolve_expected_artifacts_slot()` for a currently-unconsumed `MissionTypeProfile.expected_artifacts` slot.\""
      - artifact: "spec.md § Overview \"Corrected risk framing\", item 3 (lines 124-126): \"No consumer of the resulting `MissionTypeProfile.expected_artifacts` property was found beyond its own docstring...\""
      - artifact: "spec.md § Non-Gate Consumer Notes (lines 461-464): repeats the same claim a third time"
      - code: "src/charter/mission_type_profiles.py:405-408 (the actual property: `ResolvedMissionType.expected_artifacts`, a `@cached_property` backed by `_expected_artifacts_thunk`) — `MissionTypeProfile` (a separate pydantic.BaseModel at line ~114) has no `expected_artifacts` attribute at all"
      - code: "tests/charter/test_resolved_mission_type_context.py:160-162 (`assert bundle.expected_artifacts is not None`; `assert isinstance(bundle.expected_artifacts, dict)`; `assert bundle.expected_artifacts[\"mission_type\"] == \"software-dev\"`)"
    claim: >
      Two independent errors in the same repeated claim (Overview x2 + Non-Gate Consumer Notes).
      First, the entity is misnamed throughout the spec: the `.expected_artifacts` property lives
      on `ResolvedMissionType` (a dataclass, `@cached_property` at mission_type_profiles.py:405-408),
      not on `MissionTypeProfile` (a pydantic.BaseModel with an entirely different field set — no
      such attribute exists on it). Second, and more materially for the mission-derived lens this
      claim was assigned to verify, "no consumer... found beyond its own docstring" is false: a
      real contract test, tests/charter/test_resolved_mission_type_context.py:160-162, directly
      asserts on `bundle.expected_artifacts`'s presence, type, and `mission_type` key for
      `software-dev` — the exact mission type whose manifest content this mission materially
      changes (FR-006/FR-007/FR-008). This is not a "downstream gate," but it is unambiguously a
      consumer beyond the property's own docstring, contradicting the spec's literal claim used to
      justify treating this reader as effectively risk-free for content changes.
    remediation: >
      Rename the entity to `ResolvedMissionType.expected_artifacts` everywhere it appears
      (Overview x2, Non-Gate Consumer Notes). Replace "no consumer... found beyond its own
      docstring" with an accurate statement acknowledging
      tests/charter/test_resolved_mission_type_context.py as a real (if narrow) consumer, and
      confirm — as part of this mission's own validation, not left implicit — that the
      reconciled software-dev manifest content still satisfies that test's three assertions.

  - id: SPEC-ARCH-004
    lens: "Mission-derived: Non-gate consumer accuracy (test-surface gap)"
    severity: 3
    title: "NFR-003/SC-002/FR-015's declared validation surface omits tests/charter/, the only directory containing a real consumer of the manifest content this mission changes"
    evidence:
      - artifact: "spec.md NFR-003 (line 358): \"Validation targets tests/dossier/, tests/doctrine/missions/, and tests/runtime/ (plus any files identified by FR-015)...\""
      - artifact: "spec.md FR-015 (line 350): lists tests/runtime/test_bridge_cores.py, tests/integration/test_research_runtime_walk.py, tests/integration/test_documentation_runtime_walk.py, tests/doctrine/missions/test_repository.py — no tests/charter/ path"
      - artifact: "spec.md SC-002 (line 395): \"pytest tests/dossier/ tests/doctrine/missions/ tests/runtime/ (plus any files updated per FR-015)...\""
      - code: "tests/charter/test_resolved_mission_type_context.py:160-162 (see SPEC-ARCH-003) — asserts on manifest-sourced content for `software-dev`, one of the three types this mission reconciles"
    claim: >
      Once SPEC-ARCH-003's real consumer (tests/charter/test_resolved_mission_type_context.py) is
      accounted for, the mission's own declared validation surface (NFR-003, SC-002, and FR-015's
      audit list) does not include tests/charter/ at all. FR-002 through FR-008 materially change
      required_by_step shapes for the `documentation` and `software-dev` manifests — the same
      `software-dev` type the test asserts `bundle.expected_artifacts["mission_type"] ==
      "software-dev"` against. Whether or not that specific assertion happens to survive the
      content change, the mission's stated acceptance bar (SC-002: "zero new failures relative to
      the pre-change baseline") cannot be honestly claimed met if a real, content-sensitive
      consumer outside the declared test surface is never run.
    remediation: >
      Add tests/charter/test_resolved_mission_type_context.py (or the relevant subset of
      tests/charter/) to NFR-003's validation surface and FR-015's audit list, and confirm it still
      passes after the FR-002–FR-008 content reconciliation lands.

  - id: SPEC-ARCH-005
    lens: Canonical source (DIRECTIVE_044)
    severity: 3
    title: "FR-014's 'refresh the dead override copies to keep them in sync' is parity-with-a-dead-quirk, in tension with the charter's canonical-source-unification principle that this profile is bound to apply"
    evidence:
      - artifact: "spec.md FR-014 (line 349): \"...drift hygiene only — these copies are not consumed by any reader identified in this repository...\""
      - artifact: "spec.md § \"A second-order finding\" (lines 136-180), confirming .kittify/overrides/missions/*/expected-artifacts.yaml is dead code for this file type"
      - artifact: "spec.md C-004 (line 367): no new override-resolution wiring in this mission"
      - artifact: ".kittify/charter/charter.md § Governing Principles (lines 27-31): \"Single canonical authority... chase unification, not parity with a dead quirk.\" (DIRECTIVE_044, cited in this profile's directive-references)"
    claim: >
      The spec correctly identifies (Overview, "second-order finding") that
      .kittify/overrides/missions/{research,documentation,software-dev}/expected-artifacts.yaml are
      consumed by zero readers — dead code for this specific file type, unlike every sibling
      doctrine asset type. FR-014 then proposes refreshing that dead content "to match the
      reconciled built-in content... purely as drift hygiene," explicitly because "a stale,
      further-diverging second copy... is a footgun for the next maintainer." This is the literal
      shape of "parity with a dead quirk" that the charter's canonical-source-unification principle
      (DIRECTIVE_044) names as the anti-pattern to avoid in favor of "unification." Maintaining
      byte-parity with an unconsumed second copy is not itself a logical contradiction of C-004
      (FR-014 adds no resolver wiring), but the spec neither surfaces this DIRECTIVE_044 tension nor
      weighs the alternative the charter's own principle points toward — e.g., deleting/marking the
      dead copies explicitly deprecated, or treating the override-wiring follow-up with more urgency
      than "a follow-up candidate only" (Out of Scope, line 433) — before presenting FR-014 as
      uncontroversial hygiene.
    remediation: >
      Either (a) change FR-014 to delete or explicitly mark the dead override copies as
      deprecated/inert (pointing to the follow-up issue for wiring the override tier), rather than
      maintaining content parity with files nothing reads; or (b) if "keep in sync" is still the
      chosen path, add a short paragraph acknowledging this is a deliberate, charter-principle-aware
      exception to DIRECTIVE_044's "not parity with a dead quirk" guidance and state why "keep in
      sync" was preferred over deletion or immediate resolver wiring.

  - id: SPEC-ARCH-006
    lens: "Mission-derived: Non-gate consumer accuracy"
    severity: 2
    title: "The plan-manifest_version explanation for resolve_manifest_version() conflates ManifestRegistry.load_manifest()'s None return with resolve_manifest_version()'s always-a-string contract"
    evidence:
      - artifact: "spec.md § Non-Gate Consumer Notes (lines 452-455): \"...including `plan` (which previously returned `None` from `ManifestRegistry.load_manifest(\"plan\")` since no manifest existed; after FR-010, it returns `\"1\"` for the first time — a *new* value where previously there was none...)\""
      - code: "src/specify_cli/sync/namespace.py:90-101: `def resolve_manifest_version(mission_type): manifest = ManifestRegistry.load_manifest(mission_type); if manifest is not None: return str(manifest.manifest_version); return \"1\"`"
    claim: >
      resolve_manifest_version() never returns None under any input — it has an explicit
      `return "1"` fallback exactly for the case where ManifestRegistry.load_manifest() returns
      None (as it always has for `plan`, since no manifest file existed before this mission).
      Therefore resolve_manifest_version("plan") already returned "1" before this mission (via the
      fallback) and continues to return "1" after FR-010 lands (via the real manifest's
      manifest_version field) — genuinely byte-identical, but not because it "returns '1' for the
      first time... a new value where previously there was none" as the spec states. That framing
      conflates load_manifest()'s (nullable) return type with resolve_manifest_version()'s
      (always-string) return type. The ultimate safety conclusion (byte-identical sync identity for
      plan) is still correct — the described mechanism for why is wrong.
    remediation: >
      Rewrite the plan-specific sentence to state that resolve_manifest_version("plan") already
      returned "1" before this mission via its own None-fallback branch (namespace.py:101), and
      continues to return "1" after FR-010 — the sync identity tuple for `plan` was, and remains,
      "1" throughout, with resolve_manifest_version() itself never transitioning through a `None`
      value at any point.

  - id: SPEC-ARCH-007
    lens: "Mission-derived: Override-tier accuracy"
    severity: 1
    title: "Code citation for the override-tier resolver logic (resolver.py:154-181) is imprecise and conflates two separate functions"
    evidence:
      - artifact: "spec.md § \"A second-order finding\" (line 149): \"...which *do* check `.kittify/overrides/missions/{mission}/...` first (`src/doctrine/resolver.py:154-181`).\""
      - code: "src/doctrine/resolver.py: the override check for templates/command-templates lives inside `_resolve_asset()` at approximately lines 172-183 (lines 154-181 mostly cover that function's docstring, not the executable check); the override check for mission.yaml lives in a separate function, `resolve_mission()`, at approximately lines 331-334 — outside the cited range entirely"
    claim: >
      The substantive conclusion (packs/built-in/*/expected-artifacts.yaml resolution has no
      override tier, unlike mission.yaml/templates/command-templates) is correct and independently
      confirmed. The supporting citation, however, points to one line range as if it covered a
      single unified check, when in fact two separate functions in resolver.py implement the
      override check for the two asset families being compared (`_resolve_asset()` for
      templates/command-templates; `resolve_mission()` for mission.yaml), and the cited range
      (154-181) does not actually contain resolve_mission()'s check at all.
    remediation: >
      Split the citation into two: `_resolve_asset()`'s override check (~lines 172-183) for
      templates/command-templates, and `resolve_mission()`'s override check (~lines 331-334) for
      mission.yaml — rather than one combined 154-181 range.
