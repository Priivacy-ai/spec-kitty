findings:
  - id: SPEC-FRESH-001
    lens: Scope-creep / blast-radius accuracy (fresh eyes on the fix round)
    severity: 4
    title: FR-016's own text contradicts the "it touches only manifest.py" scope-in justification — it mandates changes to dossier/indexer.py and sync/namespace.py, files C-001/NFR-002/Key Entities never name, and one of them feeds the hosted-SaaS sync pipeline Decision 2 treats as too risky to touch even for a value change
    evidence:
      - artifact: "spec.md § User Story 3 motivation (the paragraph introducing Decision 3): \"Completing the fix so it reaches production (FR-016, below) is judged in scope: it touches only `manifest.py` — the same file FR-009 already changes for the schema itself — and changes no guard logic in `runtime_bridge_cores.py`/... (C-001 is untouched).\""
      - artifact: "spec.md § FR-016 (Requirements table): \"Update the real `load_manifest()` callers (the dossier indexer's call sites, `resolve_manifest_version()`) to handle a raised `ValidationError` explicitly.\""
      - artifact: "tracer-design-decisions.md § Decision 3, \"Decision (chosen: Option A...)\": \"The two real `load_manifest()` callers (the dossier indexer's call sites, `resolve_manifest_version()`) are updated to handle a raised `ValidationError` explicitly.\""
      - artifact: "spec.md § NFR-002: enumerates changed files as \"manifest.py, the four expected-artifacts.yaml files, changed test files\" — omits dossier/indexer.py and sync/namespace.py even though FR-016 requires editing both"
      - artifact: "spec.md § Key Entities: only the ManifestRegistry entry is updated for FR-016; no Indexer or resolve_manifest_version entity entry is added despite both requiring code changes"
      - code: "src/specify_cli/dossier/indexer.py:123,176,355,407 — four unguarded call sites (`self.manifest_registry.load_manifest(mission_type)`), none currently wrapped in try/except; a propagated ValidationError from any of them would raise out of `scan_and_build_dossier`/`_index_file`/`_detect_missing_artifacts`/`_derive_artifact_key`"
      - code: "src/specify_cli/sync/namespace.py:90-101 (`resolve_manifest_version`) — its own docstring commits to \"Returns the manifest_version from the registry if available, otherwise defaults to \\\"1\\\"\" for every input; letting ValidationError propagate through it (as FR-016 requires) breaks that always-a-string contract for the malformed-manifest case, and this function's return value feeds `sync/dossier_pipeline.py:344,351` — the exact hosted-SaaS sync pipeline Decision 2 (C-002) refuses to touch even for a string-value change, citing \"this repository has no visibility into spec-kitty-saas to verify there is a migration path\""
    claim: >
      The User Story 3 motivation paragraph and Decision 3 in tracer-design-decisions.md both use
      "it touches only manifest.py" (and the C-001/NFR-001 non-scope of runtime_bridge_cores.py) as
      the load-bearing argument for why FR-016 is in scope rather than scope creep. But FR-016's own
      requirement text — repeated verbatim in Decision 3's own "Decision" paragraph — explicitly
      requires updating the dossier indexer's call sites and resolve_manifest_version(), neither of
      which lives in manifest.py. This is an internal contradiction: the very requirement being
      defended as narrowly scoped is, by its own text, not narrowly scoped. The blast radius this
      creates is materially larger than "content + schema only" implies: it reaches into
      dossier/indexer.py (used by rebaseline.py, the `reconcile` CLI command, and
      sync/dossier_pipeline.py per the spec's own "Corrected risk framing" enumeration) and
      sync/namespace.py, whose resolve_manifest_version() output is one of five fields keying
      hosted-SaaS sync body uploads — precisely the mechanism Decision 2 treats as too
      risk-uncertain to touch for a mere version-string bump. FR-016 introduces a behavior change
      into that same pipeline (an unhandled exception can now propagate where previously a graceful
      "1" fallback was guaranteed) with zero risk analysis, no acceptance scenario exercising the
      caller-side behavior (AS4 under US3 only tests `ManifestRegistry.load_manifest()` directly),
      and no FR/NFR naming indexer.py or namespace.py as changed files. "Handle a raised
      ValidationError explicitly" is also underspecified: it does not say whether the five call
      sites should re-raise, log-and-degrade-to-empty-dossier, or convert to a different error class,
      leaving five call sites free to diverge in behavior with no test bar to catch it.
    remediation: >
      Either (a) narrow FR-016 back to the literal "manifest.py only" scope the motivation paragraph
      claims — i.e., let `load_manifest()` raise, but explicitly declare the five existing callers'
      current behavior (an unhandled exception propagating up through scan_and_build_dossier /
      resolve_manifest_version into the sync pipeline) as the accepted, reviewed consequence, with a
      one-paragraph risk analysis of what an unhandled ValidationError does inside
      sync/dossier_pipeline.py specifically (does it crash the whole sync batch, or just one
      artifact's upload?); or (b) properly scope FR-016 as touching manifest.py AND
      dossier/indexer.py AND sync/namespace.py, add both files to NFR-002's changed-file list and to
      Key Entities, specify the exact per-call-site handling (e.g. "indexer call sites catch
      ValidationError and degrade to manifest=None with an ERROR log, matching today's swallow
      behavior for indexing purposes, while resolve_manifest_version() lets it propagate because sync
      correctness requires failing loud" — or whatever the actual chosen semantics are), and add an
      acceptance scenario that exercises the caller-side behavior (not just direct
      `load_manifest()` construction) for both the indexer and resolve_manifest_version() paths.
      Either way, remove the "it touches only manifest.py" claim, which is false against FR-016's own
      text.
