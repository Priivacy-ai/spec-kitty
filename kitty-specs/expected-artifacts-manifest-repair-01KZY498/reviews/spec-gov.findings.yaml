findings:
  - id: SPEC-GOV-001
    lens: Decision fidelity
    severity: 3
    title: "C-002 (and, more weakly, FR-013) carry the manifest_version non-bump rule with no restated rationale, so a reader who skips Clarifications loses the naive-instinct-defeater"
    evidence:
      - artifact: "spec.md § Clarifications, Decision 2 (lines ~41-59)"
      - artifact: "spec.md § Constraints, C-002 (line ~365)"
      - artifact: "spec.md § Functional Requirements, FR-013 (line ~348)"
      - artifact: "spec.md § Non-Gate Consumer Notes (lines ~444-455)"
      - code: "src/specify_cli/sync/namespace.py:90-101 (resolve_manifest_version), :35,63 (NamespaceRef 5-field identity tuple, f\"|{self.mission_type}|{self.manifest_version}\")"
    claim: >
      Decision 2's rationale for NOT bumping manifest_version is substantial and
      counter-instinctive: content changed, so an engineer's default reflex is to bump the
      version, but doing so would change a live hosted-SaaS sync identity key for
      already-synced artifact bodies with no visibility into spec-kitty-saas's migration
      path. The mission-derived lens asks whether a reader who jumps straight to
      FR-013/C-002 (skipping Clarifications) would still understand why. Verified: they
      would not. C-002's row text is a bare rule — "manifest_version remains "1" on all
      four manifests; no change to sync.namespace.resolve_manifest_version() or
      NamespaceRef's identity-tuple construction" — with zero pointer back to Decision 2 or
      any inline rationale; it does not even say "per Decision 2" the way FR-010/FR-011 say
      "per Decision 1". FR-013 does name "Decision 2" by number, which lets a diligent
      reader navigate back to the Clarifications section, but the FR-013 row itself still
      does not restate the substance of the defeater (the sync-identity blast-radius
      argument) — it only says "record Decision 2's rationale ... not only in this spec",
      i.e. it assumes the reader already knows what that rationale is. A reviewer or future
      maintainer who scans only the Requirements/Constraints tables (a normal review
      shortcut, and exactly the level SC-006's mechanical grep check operates at) sees a
      rule with no defeater attached, and nothing in C-002 stops them from "fixing" it later
      by bumping the version, reintroducing the exact sync-identity risk Decision 2 exists
      to avoid.
    remediation: >
      Add a one-clause parenthetical rationale to both C-002 and FR-013 restating the
      defeater inline, e.g.: "(kept deliberately at '1', not bumped — a version bump would
      change NamespaceRef's sync-identity tuple for every already-synced artifact body of
      that mission type, and this repo cannot verify spec-kitty-saas has a migration path
      for the resulting orphaned/duplicated bodies; see Decision 2)." At minimum, C-002
      should carry the same "per Decision 2" back-reference FR-013 already has, so a
      table-only reader is pointed at the rationale even if not shown it inline.

  - id: SPEC-GOV-002
    lens: Directive (verify-against-live-code, charter Quality & Tech-Debt Standing Orders throughline)
    severity: 2
    title: "User Story 2 / Acceptance Scenario 3 misstates plan/mission.yaml's structure→draft transition as gated by gate_passed(...), but it is verified to carry no condition at all"
    evidence:
      - artifact: "spec.md § User Story 2, Acceptance Scenario 3 (lines ~263-269)"
      - code: "packs/built-in/missions/plan/mission.yaml:40-42 (structure→draft transition — no `conditions:` key present at all)"
      - code: "packs/built-in/missions/plan/mission.yaml:52 (review→done transition — gate_passed(\"plan_approved\"), correctly described)"
    claim: >
      The charter's Quality & Tech-Debt Standing Orders throughline states "never trust ...
      a confident summary — verify against live code." AC3 states: "`structure`, `review`,
      and `done` have no filesystem-artifact requirement, matching `mission.yaml`'s
      transitions for those states (no `artifact_exists` condition on `structure→draft` or
      `review→done`, which instead gates on `gate_passed("plan_approved")`)." Read plainly,
      this attributes a `gate_passed(...)` condition to *both* `structure→draft` and
      `review→done`. Direct read of `plan/mission.yaml` confirms `review→done` does gate on
      `gate_passed("plan_approved")`, but `structure→draft` has no `conditions:` block
      whatsoever — it is unconditional, not gated by anything. The practical conclusion FR-010
      needs (structure has no filesystem-artifact requirement in the new manifest) still
      holds, so this does not misdirect the manifest's actual content, but it is a factual
      claim about code presented as verified that is not accurate as written, and a reader
      could reasonably conclude `structure→draft` has an approval gate that does not exist.
    remediation: >
      Rephrase AC3 to separate the two transitions' actual mechanisms, e.g.: "`structure→draft`
      carries no condition at all (unconditional transition); `review→done` gates on
      `gate_passed(\"plan_approved\")`. Neither uses `artifact_exists`, which is why `structure`,
      `review`, and `done` carry no filesystem-artifact requirement in the new manifest."

  - id: SPEC-GOV-003
    lens: Decision fidelity
    severity: 1
    title: "Decision 1's evidence enumerates _evaluate_software_dev_guards's recognized vocabulary as 7 step ids, omitting the 8th (composed \"tasks\")"
    evidence:
      - artifact: "spec.md § Clarifications, Decision 1 Q text (lines ~18-24)"
      - code: "src/runtime/next/runtime_bridge_cores.py:554-566 (_evaluate_software_dev_guards recognizes specify, plan, tasks_outline/tasks_packages/tasks_finalize via _CLI_TASKS_STEP_IDS, implement, review, AND composed \"tasks\" → _evaluate_composed_tasks_guard at line 562-563, else return [] at line 566)"
    claim: >
      Decision 1's rationale for filing the plan-guard-gap follow-up issue (FR-011) lists
      `_evaluate_software_dev_guards`'s vocabulary as "specify/plan/tasks_outline/
      tasks_packages/tasks_finalize/implement/review" — seven step ids. The function
      actually recognizes an eighth, the composed `"tasks"` id (dispatching to
      `_evaluate_composed_tasks_guard`). The omission does not change Decision 1's
      conclusion (composed `"tasks"` also does not match any of `plan` mission type's own
      state names — `goals`/`research`/`structure`/`draft`/`review`/`done` — so the "falls
      through to `return []`" claim for plan-type step ids remains correct), but the
      enumeration presented as a verified, exhaustive list is incomplete.
    remediation: >
      Add "tasks" (composed) to the enumerated vocabulary list in Decision 1's Q text so the
      list is exhaustive, e.g.: "...tasks_finalize/tasks (composed)/implement/review...".
