findings:
  - id: PLAN-FRESH2-001
    lens: Implementation Concern Map cross-reference consistency (IC ownership vs. Test Strategy table)
    severity: 4
    title: FR-013 (manifest_version-stability rationale comment) has no IC ownership for the new `plan` manifest and zero Test Strategy coverage anywhere
    evidence:
      - artifact: "plan.md § Implementation Concern Map, IC-02 (~line 629-637)"
      - artifact: "plan.md § Implementation Concern Map, IC-03 (~line 658-664, 'Relevant requirements: FR-010, FR-011, FR-012')"
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion table (~line 399-417)"
      - artifact: "spec.md FR-013: \"record Decision 2's rationale ... as an inline YAML comment in each of the four manifest files, not only in this spec\""
      - artifact: "tracer-design-decisions.md Decision 2 (line 86): \"Do not bump `manifest_version` — keep it `\\\"1\\\"` on all four\" manifests"
    claim: >
      FR-013 requires the manifest_version-stability rationale to be recorded as an inline YAML
      comment in "each of the four manifest files" — the three reconciled manifests plus the new
      `plan` manifest FR-010/IC-03 authors. IC-02's own Purpose text explicitly commits to this
      ("record the manifest_version-stability rationale inline in each edited file (FR-013/Decision
      2)") and IC-02's Relevant Requirements list correctly includes FR-013 — but that only covers
      the three files IC-02 touches (research/documentation/software-dev). IC-03, which is the WP
      that creates the fourth file (`packs/built-in/missions/plan/expected-artifacts.yaml`), lists
      only FR-010, FR-011, FR-012 in its Relevant Requirements and never mentions FR-013 anywhere in
      its Purpose, Affected Surfaces, or Risks text — so nothing in the Implementation Concern Map
      tells the plan-manifest WP to add the required rationale comment to its own new file.
      Compounding this, the Test Strategy Per Acceptance Criterion table has no row for FR-013 at
      all (every other FR — FR-001 through FR-011, FR-014, FR-015, FR-016 — has at least one row);
      the nearest candidate, the SC-006 row, only greps that `manifest_version` equals `"1"` across
      all four files, which would still pass even if the rationale comment were entirely absent from
      one or all of them. So FR-013 is the one functional requirement in this plan with neither full
      IC ownership nor any automated regression coverage, and the gap lands specifically on the one
      new file (`plan/expected-artifacts.yaml`) most likely to be drafted without a human re-deriving
      the FR-013 obligation from spec.md directly, since the whole point of the IC map is to spare
      the tasks phase that re-derivation.
    remediation: >
      Add FR-013 to IC-03's "Relevant requirements" list and its Purpose/Affected Surfaces text
      (mirroring IC-02's existing phrasing: "record the manifest_version-stability rationale inline
      in the new file (FR-013/Decision 2)"), and add a Test Strategy Per Acceptance Criterion row for
      FR-013 that actually asserts the rationale comment's presence/content in all four manifest
      files (not merely the version *value*, which SC-006 already covers) — e.g. a
      `test_manifest_version_rationale_comment_present` assertion via `ruamel.yaml`'s round-trip
      `CommentedMap`, parallel to how AS7's guard-parity check already inspects YAML comments.
findings_count: 1
