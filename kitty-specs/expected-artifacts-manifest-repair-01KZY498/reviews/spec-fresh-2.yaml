findings:
  - id: SPEC-FRESH-002
    lens: silent-success
    severity: 3
    title: "FR-016/Decision 3's claim that the sync-pipeline path 'surfaces as a visible failure ... for free' is false against every real call site — the result is discarded fire-and-forget"
    evidence:
      - artifact: "spec.md FR-016 (line ~437, the '(a)' caller-side-scope paragraph)"
      - artifact: "tracer-design-decisions.md § Decision 3, 'The dossier indexer's four load_manifest() call sites ... need no code change at all' bullet (lines 132-145)"
      - code: "src/specify_cli/sync/dossier_pipeline.py:243-250 (sync_feature_dossier()'s except Exception -> DossierSyncResult(dossier=None, errors=[str(e)]))"
      - code: "src/specify_cli/cli/commands/research.py:189-198 (trigger_feature_dossier_sync_if_enabled called inside a bare 'except Exception: pass' — comment 'Dossier sync (fire-and-forget)')"
      - code: "src/specify_cli/cli/commands/agent/tasks_mark_status.py:392-403 ('with contextlib.suppress(Exception):' around the same call — comment 'Fire-and-forget dossier sync (best-effort)')"
      - code: "src/specify_cli/merge/executor.py:1298-1301 (_phase_dossier_and_stale calls trigger_feature_dossier_sync_if_enabled and never reads its return value; function docstring: 'failures never abort')"
      - code: "src/specify_cli/sync/__init__.py:187-196 (default dossier-sync event handler also calls the function and discards the return value)"
    claim: >
      This round's revision to FR-016 and Decision 3 adds a new, more granular claim not present
      in round 1: that `sync/dossier_pipeline.py`'s `sync_feature_dossier()` already fail-closes
      on a raised `ValidationError` via its own `except Exception` (verified accurate at
      dossier_pipeline.py:243-250 — try at 243, the `Indexer.index_feature()` call at 245, the
      `DossierSyncResult(dossier=None, errors=[str(e)])` return at 248-250, matching the spec's
      cited line numbers exactly) and that this "satisfies the 'fails loudly' goal ... for free."
      That is true only up to "does not crash the process" — it is false as a claim about
      operator-visible failure. Every real production caller of the wrapping function,
      `trigger_feature_dossier_sync_if_enabled` (which is what `merge/executor.py`,
      `research.py`, `tasks_mark_status.py`, `mission_record_analysis.py`,
      `mission_setup_plan.py`, `mission_finalize.py`, `workflow_executor.py`, and
      `sync/__init__.py`'s default event handler all call), discards its return value outright:
      two call sites wrap it in `except Exception: pass` / `contextlib.suppress(Exception)`
      ("fire-and-forget", "best-effort" per their own comments), and the rest simply never read
      the returned `DossierSyncResult` at all. So a typo'd manifest routed through this specific
      path produces the exact same operator-visible outcome before and after FR-016: nothing.
      Before FR-016, `load_manifest()` swallows the `ValidationError` to `None` at the source.
      After FR-016, the exception is raised, caught one frame up, and packed into a
      `DossierSyncResult.errors` list that is then thrown away by every caller — a different
      internal mechanism, identical external silence. This is precisely the "converts an error
      into a discarded/ignored result instead of surfacing it" pattern the charter names as this
      repo's dominant failure mode (#3133, #3212, #3282, #3336), and it directly undercuts User
      Story 3's own stated goal ("I need a typo'd field name ... to raise a validation error
      immediately, so a broken manifest is caught at author-time instead of silently parsing as
      if the typo'd data were simply absent") for this specific, real, production-invoked path.
      Note the spec's own phrasing is already inconsistent on this point: FR-016 calls reconcile
      and rebaseline "both human-facing paths" (correctly implying the sync-pipeline path is NOT
      human-facing) in the same sentence that claims the sync-pipeline path also "satisfies ...
      for free" — visible and not-human-facing cannot both be true of the same fire-and-forget
      call chain.
    remediation: >
      Either (a) soften FR-016/Decision 3's language so it no longer claims the sync-pipeline
      path "surfaces as a visible failure" or "satisfies the fails-loudly goal ... for free" —
      state instead that it prevents an unhandled-exception crash but leaves the typo silently
      absorbed for every fire-and-forget caller, and name that residual gap explicitly (e.g. as a
      known limitation or a follow-up candidate alongside FR-011/the artifact_key carve-out); or
      (b) if User Story 3's "fails loudly" bar is meant to genuinely hold for this path too,
      widen FR-015/FR-016's scope to add visible logging (e.g. `logger.warning`/`logger.error` on
      a non-empty `DossierSyncResult.errors`) at at least the `trigger_feature_dossier_sync_if_enabled`
      layer, and add an acceptance scenario proving a typo'd manifest produces a logged/observable
      signal through this path, not just a discarded struct.

  - id: SPEC-FRESH-003
    lens: falsifiability
    severity: 2
    title: "New acceptance scenarios AS5/AS6 (User Story 3) have no matching entry in FR-012 (required new tests) or SC-003 (required regression tests)"
    evidence:
      - artifact: "spec.md User Story 3, Acceptance Scenarios 5-6 (lines 382-395, both new in this revision per the round-2 diff)"
      - artifact: "spec.md FR-012 (Requirements table): 'Add new tests for FR-001–FR-005, FR-008 divergence fixes, FR-009's extra=\"forbid\" rejection (both classes), FR-010's plan manifest, and FR-016's load_manifest() loud-failure behavior'"
      - artifact: "spec.md SC-003 (Success Criteria, line ~502): enumerates only ExpectedArtifactSpec/ExpectedArtifactManifest extra-key rejection, the four shipped manifests still loading, and 'a deliberately typo'd real YAML fixture loaded through ManifestRegistry.load_manifest() raises rather than silently returning None'"
    claim: >
      This revision adds two new, specific, falsifiable acceptance scenarios to User Story 3: AS5
      (a typo'd manifest routed through `reconcile.py`/`rebaseline.py` must surface as a
      structured `ReconciliationResult(status=ERROR, ...)` / `RebaselineOutcome(error=
      "reindex_failed: ...")`) and AS6 (`resolve_manifest_version()` must still return `"1"` for a
      malformed manifest via its new dedicated `except pydantic.ValidationError` branch). Neither
      is named in FR-012, the requirement that enumerates which new tests this mission must add,
      nor in SC-003, the success criterion enumerating the regression tests that gate this user
      story's completion — both mention only `load_manifest()`'s own raise, not the two downstream
      caller behaviors AS5/AS6 describe. FR-012's phrase "FR-016's load_manifest() loud-failure
      behavior" grammatically names `load_manifest()` itself, not `resolve_manifest_version()`'s
      fallback branch or `reconcile.py`/`rebaseline.py`'s propagation — so, read literally, an
      implementer following FR-012/SC-003 to the letter could satisfy every enumerated test
      obligation while adding no regression test for AS5 or AS6, leaving two acceptance scenarios
      that exist in prose but are not actually gated by anything the mission requires an
      implementer or reviewer to check.
    remediation: >
      Add AS5 and AS6 explicitly to FR-012's test-addition list (e.g. "...and FR-016's
      load_manifest() loud-failure behavior, its propagation through reconcile.py/rebaseline.py
      (AS5), and resolve_manifest_version()'s ValidationError fallback (AS6)") and add a
      corresponding bullet to SC-003 (or a new SC-00x) naming the two new regression tests by
      name, so the acceptance scenarios added in this revision are actually enforced by the
      requirements/success-criteria machinery the rest of the spec relies on.
