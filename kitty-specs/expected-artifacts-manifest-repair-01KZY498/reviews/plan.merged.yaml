findings:
  - id: PLAN-GOV-001
    lens: tracer-files
    severity: 3
    title: "tracer-approach.md still prescribes the Option-B override-file refresh that Decision 4 explicitly rejected"
    duplicate_of: [PLAN-ARCH-003]
    evidence:
      - artifact: "tracer-approach.md § 'A discovery that reframed part of the blast radius'"
      - artifact: "tracer-approach.md § 'Default: one PR per mission'"
      - artifact: "tracer-design-decisions.md § Decision 4"
      - artifact: "plan.md § Implementation Concern Map, IC-04"
      - artifact: "plan.md § Confirmed: Tracer Files Already Seeded (asserts tracer files 'carry substantive content' without checking mutual consistency after later fix rounds)"
    claim: >
      tracer-approach.md (seeded at planning, before the adversarial-review fix pass) states the
      approach for the dead `.kittify/overrides/missions/*/expected-artifacts.yaml` copies as
      "refresh the dead mirror copy for drift hygiene only" and lists a ".kittify/overrides/
      drift-hygiene refresh" as part of the single PR's contents. tracer-design-decisions.md's
      Decision 4 (added later, during the adversarial-review fix pass addressing SPEC-ARCH-005)
      explicitly considered and REJECTED exactly this option ("Option B — refresh content to keep
      'in sync' ... Rejected per DIRECTIVE_044: this is the anti-pattern by name"), replacing it
      with header-comment-only deprecation, content otherwise untouched. plan.md's own IC-04
      correctly reflects Decision 4 ("header comment only in each — content otherwise untouched,
      explicitly NOT refreshed to parity per Decision 4"), so plan.md itself is internally
      consistent with the final decision — but tracer-approach.md, one of the three CONTRACT
      files this mission's tasks/implementation is meant to be built from, was never updated to
      match. The charter says "if the charter and this file disagree, the charter wins — flag the
      drift instead of picking silently"; the same discipline applies to this mission's own
      contract documents disagreeing with each other, and plan.md picks Decision 4 silently
      without ever noting that tracer-approach.md (a document a later reader may reasonably treat
      as still-current) is now stale on this specific point. A WP implementer who reads
      tracer-approach.md instead of tracer-design-decisions.md could refresh the override files'
      content, silently reproducing the exact DIRECTIVE_044 anti-pattern Decision 4 exists to
      avoid — a mistake nothing in the test suite would catch, since these files are consumed by
      no production reader (per PLAN-VERIFY-006's related observation about FR-014 lacking a
      regression test).
    remediation: >
      Before /spec-kitty.tasks slices IC-04, correct tracer-approach.md's two "refresh...for drift
      hygiene" passages to match Decision 4 (header-comment-only, content untouched) — either by
      editing the file directly (tracer files are living documents per Standing Order #3, appended
      during implementation) or by adding an explicit superseded-by-Decision-4 note at each of the
      two locations, so a reader of tracer-approach.md alone is not misled about what IC-04
      actually does.

  - id: PLAN-ARCH-001
    lens: IC sequencing vs. shared-file WP conflicts / ATDD-First Discipline (C-011)
    severity: 5
    title: >-
      IC-05's dependency on IC-01/IC-02/IC-03, combined with the IC map's own
      "Affected surfaces" lists, means IC-01-03 have no red-first test of their
      own before their implementation commits — a literal C-011 violation on
      one reading, an unaddressed shared-file WP-overlap on the other
    evidence:
      - artifact: "plan.md § Charter Check, line 82-83"
      - artifact: "plan.md § Implementation Concern Map, IC-01 'Affected surfaces', line 541-543"
      - artifact: "plan.md § Implementation Concern Map, IC-02 'Affected surfaces', line 558-560"
      - artifact: "plan.md § Implementation Concern Map, IC-03 'Affected surfaces', line 573-574"
      - artifact: "plan.md § Implementation Concern Map, IC-05 'Sequencing/depends-on', line 612-618"
      - code: ".kittify/charter/charter.md:591-602 (ATDD-First Discipline, binding per C-011: \"The WP cannot start coding until at least one failing-first ATDD test exists... committed as a separate commit... BEFORE any implementation commits.\")"
      - code: ".kittify/charter/references.yaml:990-997 (TACTIC:ownership-map-leeway — \"The hard constraint is no-overlap between work packages\")"
    claim: >-
      Plan.md's Charter Check asserts C-011 PASS: "Each WP's red-first test is named
      per-FR in 'Test Strategy' below, committed before the corresponding implementation
      commit." But the Implementation Concern Map's own per-IC "Affected surfaces" lists
      contradict this: IC-01 (schema hardening), IC-02 (3-manifest reconciliation), and
      IC-03 (plan manifest) each list ONLY their functional files (manifest.py/namespace.py;
      the three content YAMLs; the new plan YAML) — none lists tests/dossier/test_manifest.py.
      The only IC whose "Affected surfaces" includes tests/dossier/test_manifest.py is IC-05,
      and IC-05's own "Sequencing/depends-on" line makes it depend on IC-01, IC-02, AND IC-03
      landing first. Two readings of this are both defective, and the plan does not pick
      between them: (1) If IC-01/02/03 genuinely touch zero test files (matching their
      literal "Affected surfaces" lists), then those three WPs have no red-first ATDD test
      committed before their own implementation commits at all — directly violating C-011,
      which requires the reviewer to verify red-on-planning_base_branch/green-on-final-commit
      for that WP's own test. This contradicts the plan's own C-011 PASS claim in the same
      document. (2) If IC-01/02/03 are meant to each also carry their own small red-first
      test into tests/dossier/test_manifest.py (satisfying C-011), then that file is edited by
      up to four WPs (IC-01, IC-02, IC-03, IC-05) that the plan's own sequencing marks as
      running IC-02/IC-03 in parallel after IC-01 — with zero guidance (no test-class/line-range
      partitioning, no explicit "who touches the file first" statement) on how those parallel
      WPs avoid double-editing or merge-colliding inside the single shared file, directly
      contradicting the charter's ownership-map-leeway tactic's "hard constraint" of no-overlap
      between work packages. The plan's own rationalization sentence ("this is a content
      dependency, not a strict ATDD ordering violation: per WP, the red-first test for that
      WP's own FR still lands before that WP's own implementation commit") asserts reading (2)
      is true without updating IC-01/02/03's "Affected surfaces" lists to reflect it, and without
      giving the collision-avoidance guidance reading (2) would require. Separately, the stated
      reason IC-05 must wait for IC-01-03 ("writing them first would either test the wrong
      content or require a rewrite once IC-01-IC-03 land") does not hold for the brand-new
      regression tests: the plan's own "Test Strategy Per Acceptance Criterion" table already
      fully specifies the exact target assertions for every AC (e.g. AS4's "plan step requires
      only plan.md blocking; tasks.md is absent" is stated before any IC lands) — the target
      shape is already known, so those specific tests could be authored red-first per-IC exactly
      as C-011 requires. The genuine "can only run after content is final" dependency applies
      only to the FR-015 audit portion of IC-05 (checking 5 pre-existing test files for stale
      pinned assertions), which the plan bundles into the same IC and the same blanket
      dependency as the brand-new regression tests, silently deferring both.
    remediation: >-
      Split IC-05 into two distinct concerns with different sequencing: (a) a red-first
      regression-test concern for FR-001-FR-010/FR-016, whose test commits are pulled INTO
      each of IC-01/02/03's own WP (added to their "Affected surfaces" lists) and land before
      that WP's own implementation commit, per C-011 — since the target assertions are already
      fully specified in the Test Strategy table, there is no technical reason to defer them;
      and (b) the FR-015 stale-assertion audit plus any cross-cutting parity check (AS7), which
      genuinely can only run after IC-01-03's content is final and should keep its
      depends-on-IC-01/02/03 sequencing. For (a), if multiple WPs must add non-overlapping test
      functions to the same tests/dossier/test_manifest.py file in parallel, the plan (or the
      tasks-phase WP outline it hands off to) must give explicit ownership guidance — e.g. each
      WP appends to a distinct, named test class/section, and IC-02's three sub-manifests are
      split into WPs whose test additions are called out by name/anchor to avoid a
      merge-conflict discovery at /spec-kitty.tasks time. Update the Charter Check's C-011 PASS
      line to point at the corrected structure, not the current self-contradicting one.

  - id: PLAN-ARCH-002
    lens: Canonical source
    severity: 3
    title: >-
      Plan.md repeats spec.md's unverified claim that ".kittify/overrides/missions/plan/"
      does not exist — the directory has existed since April 2026, only the
      expected-artifacts.yaml file inside it is absent
    evidence:
      - artifact: "plan.md § Source Code (repository root), line 134-136"
      - artifact: "spec.md:211, spec.md:431 (FR-010) — the same claim, inherited unchanged"
      - code: ".kittify/overrides/missions/plan/ (verified present: mission.yaml, mission-runtime.yaml, README.md, templates/, command-templates/ — `git log` shows this directory dates to commit 2db24b362, 2026-04-17, months before this mission)"
    claim: >-
      Plan.md states "No .kittify/overrides/missions/plan/ is created (FR-010 note) — the
      override tier is inert for this file type (C-004) and no such directory exists today;
      creating an unconsumed mirror would add confusion, not consistency." This is factually
      wrong: `.kittify/overrides/missions/plan/` exists on this checkout today and has since
      2026-04-17 (git log), containing mission.yaml, mission-runtime.yaml, README.md, and two
      subdirectories — it simply lacks an expected-artifacts.yaml file. Plan.md's opening
      paragraph explicitly claims "every file:line cited was re-read while writing this plan,
      not merely copied from the spec," yet this specific claim was copied verbatim from
      spec.md (spec.md:211, spec.md:431) without a directory-existence check that a plain `ls`
      would have caught. The underlying recommendation (do not add an expected-artifacts.yaml
      to this override directory, since C-004 makes the override tier inert for this asset
      type) is still correct on the merits — but the stated justification for it is wrong, and
      the wrong justification undermines confidence in the plan's re-verification claim for
      every other cited path.
    remediation: >-
      Correct the sentence to: "The `.kittify/overrides/missions/plan/` directory already
      exists (containing mission.yaml, mission-runtime.yaml, README.md, templates/,
      command-templates/) but has no expected-artifacts.yaml file; none is added here — the
      override tier is inert for this asset type (C-004), so adding one would create an
      unconsumed file, not restore consistency." Re-run a directory-existence check against
      every other "does not exist" / "no such directory" claim in the plan before this mission
      proceeds to tasks, since this one was demonstrably copied without re-verification despite
      the plan's stated re-verification discipline.

  - id: PLAN-VERIFY-001
    lens: Gate-set path-filter accuracy
    severity: 4
    title: "SonarCloud Quality Gate is claimed 'always-on... applies' but the job never runs on pull_request events at all"
    evidence:
      - artifact: "plan.md § Enforced Gate Set For This Mission, 'Applies' bullet list (lines 473-477)"
      - code: ".github/workflows/ci-quality.yml:3562-3566 (job header comment: \"Temporarily limited to schedule/manual runs while #825 tracks the existing project-wide Sonar quality gate backlog. PRs skip Sonar entirely to keep review latency low, and pushes skip it so main can report test/build health.\")"
      - code: ".github/workflows/ci-quality.yml:3625 (`if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')`)"
      - code: ".github/workflows/ci-quality.yml:4010-4013 (the \"[ENFORCED] SonarCloud Quality Gate\" step lives inside this same schedule/workflow_dispatch-only `sonarcloud` job)"
    claim: >
      plan.md states "SonarCloud Quality Gate — always-on aggregator; applies. New code ...
      must carry Sonar-acceptable coverage per the charter's Sonar Expectations ... the test
      strategy above is deliberately narrow-and-direct ... to satisfy this." This is factually
      wrong: the `sonarcloud` job (which contains the "SonarCloud Quality Gate" step) is gated
      to `schedule` and `workflow_dispatch` events only. A `pull_request` event — which is what
      this mission's PR will fire — never satisfies that condition, so SonarCloud will not run
      at all as part of this mission's PR checks. The plan shapes its own test-authoring
      rationale around a CI gate that will not evaluate this PR.
    remediation: >
      Correct the "Applies" bullet to state that SonarCloud is schedule/workflow_dispatch-only
      per the job's own header comment and `if:` condition, and therefore does NOT gate this
      mission's PR directly (it will evaluate `main` post-merge on the next scheduled/manual
      run). Keep the Sonar-acceptable-coverage test-authoring guidance if desired (good practice
      regardless), but do not present it as satisfying a gate that runs on this PR.

  - id: PLAN-VERIFY-002
    lens: Gate-set path-filter accuracy
    severity: 3
    title: "mutation-testing is claimed to 'run' (always-on) but the job is permanently disabled (`if: false`)"
    evidence:
      - artifact: "plan.md § Enforced Gate Set For This Mission, 'Explicitly NOT included' list (lines 506-510)"
      - code: ".github/workflows/ci-quality.yml:3535-3559 (`mutation-testing:` job, `if: false`, sole step `run: echo \"Mutation testing is disabled.\"`)"
    claim: >
      plan.md groups mutation-testing with diff-coverage and states "both run, but are not
      separately justified as excluded: they are always-on per the workflow and will execute
      against whatever diff-coverage this mission's tests provide." diff-coverage is indeed
      always-on for `pull_request` events (`if: always() && github.event_name == 'pull_request'`,
      line 3429), but `mutation-testing` has `if: false` and its body is a single no-op echo — it
      never executes on any event, for any diff. The plan's claim that it "runs" is false.
    remediation: >
      Split the bullet: keep diff-coverage as always-on/applies (correct), and separately note
      that mutation-testing is currently fully disabled in CI (`if: false`) and therefore neither
      applies nor needs test-strategy justification — it evaluates nothing regardless of this
      mission's diff.

  - id: PLAN-VERIFY-003
    lens: Gate-set path-filter accuracy
    severity: 3
    title: "kernel-tests is claimed to run unconditionally; it is actually gated on the `kernel` path-filter group (or push), and this mission's PR trips neither"
    evidence:
      - artifact: "plan.md § Enforced Gate Set For This Mission, 'Applies' bullet (lines 443-446): \"kernel-tests (kernel coverage ≥90%) — runs unconditionally per its own job trigger (`needs: [changes]`, no `if:` gate visible restricting it to the `kernel` filter group alone — re-verify at implementation time, but treat as always-on...\""
      - code: ".github/workflows/ci-quality.yml:1077-1082 (`kernel-tests:` job, `if: always() && (needs.changes.outputs.kernel == 'true' || github.event_name == 'push')`)"
    claim: >
      The `if:` gate the plan says is "not visible" is directly present two lines below the
      `needs: [changes]` line the plan cites — `kernel-tests` only runs when the `kernel`
      paths-filter group (`src/kernel/**`, `tests/kernel/**`) is true, or on a `push` event. This
      mission's PR touches zero `src/kernel/**`/`tests/kernel/**` files and is a `pull_request`
      event, not `push`, so `kernel-tests` will NOT run as a required check on this mission's PR
      at all — it is not merely "expected to pass trivially," it is not scheduled to execute. The
      plan's own hedge ("re-verify at implementation time, but treat as always-on") is load-bearing
      here, not a throwaway caveat: the claim it hedges is wrong, not merely unverified. (The
      mission's ultimate coverage-floor conclusion — no risk from this diff — still holds, but for
      a different reason than stated: absence of execution, not a trivial pass.)
    remediation: >
      Correct the bullet to state kernel-tests is gated on the `kernel` filter group or `push`
      (citing the `if:` line directly below the `needs:` line already quoted), and that this
      mission's PR does not trip it — the job simply does not run on this PR, consistent with
      C-001/NFR-001's "zero src/kernel/** touched" framing, rather than running and passing.

  - id: PLAN-VERIFY-004
    lens: Gate-set path-filter accuracy
    severity: 2
    title: "consumer-compatibility (SaaS consumer compatibility) is claimed to have 'no path gate'; it is actually gated on the `release` path-filter group"
    evidence:
      - artifact: "plan.md § Enforced Gate Set For This Mission, 'Explicitly NOT included' list (lines 511-515): \"consumer-compatibility ... Runs as an always-on job regardless, expected to pass unchanged; not separately justified as excluded since it has no path gate.\""
      - code: ".github/workflows/ci-quality.yml:4216-4220 (`consumer-compatibility:` job, `if: always() && needs.changes.outputs.release == 'true' && needs.build-wheel.result == 'success'`)"
    claim: >
      The job does have a path gate — it only runs when the `release` paths-filter group is true
      (`src/specify_cli/release/**`, `pyproject.toml`, `uv.lock`, `CHANGELOG.md`, etc., lines
      279-291). This mission touches none of those paths, so `consumer-compatibility` will NOT
      run on this PR at all — the plan's stated conclusion (effectively excluded) is accidentally
      right, but the stated mechanism ("always-on... no path gate") is wrong, which undermines the
      "verified against the CI workflow's own paths-filter groups, not assumed" standard the
      section opens with.
    remediation: >
      Correct the bullet to name the actual gate: `consumer-compatibility` is gated on the
      `release` filter group (plus a successful `build-wheel`), which this mission's file set does
      not trip, so the job does not run on this PR — not "runs unchanged."

  - id: PLAN-VERIFY-005
    lens: Gate-set path-filter accuracy
    severity: 3
    title: "src/specify_cli/dossier/** is cited as being in the `core_misc` path-filter group; it is actually in the separate `agent_surface` composite group"
    evidence:
      - artifact: "plan.md § Enforced Gate Set For This Mission, 'Applies' bullet (lines 423-426): \"`tests/dossier/**` and `src/specify_cli/dossier/**` are explicitly listed in the `core_misc` path-filter group (verified at `.github/workflows/ci-quality.yml` lines ~376/495)\""
      - code: ".github/workflows/ci-quality.yml:376 (`tests/dossier/**` — genuinely inside the `core_misc:` filter block, lines 322-393)"
      - code: ".github/workflows/ci-quality.yml:492-497 (`agent_surface:` filter block: `- 'src/specify_cli/orchestrator_api/**'`, `- 'src/specify_cli/tracker/**'`, `- 'src/specify_cli/dossier/**'`, `- 'src/specify_cli/bulk_edit/**'`, `- 'src/specify_cli/skills/**'` — a DIFFERENT named group from `core_misc`)"
      - code: ".github/workflows/ci-quality.yml:1704 (`fast-tests-core-misc`'s `if:` ORs across `core_misc`, `cli`, `execution_context`, `glossary`, `acceptance`, `auth_audit_git`, `lifecycle`, `agent_surface`, `closeout`, `governance`, `platform` — `agent_surface` is one of several distinct groups that happen to gate the same job, not a member of `core_misc` itself)"
    claim: >
      Line ~376 does support the `tests/dossier/**` half of the claim (it is inside `core_misc`).
      Line ~495, however, is inside the `agent_surface` filter group, not `core_misc` — these are
      two separately-named `dorny/paths-filter` groups. This mission's `src/specify_cli/dossier/manifest.py`
      change therefore trips `agent_surface`, not `core_misc`, contrary to the plan's specific
      claim. The practical outcome the plan is arguing for (fast-tests-core-misc still runs) is
      still true, because that job's own `if:` ORs across many groups including `agent_surface`
      — but the plan's specific mechanism claim ("explicitly listed in the core_misc path-filter
      group") is incorrect, and a reader who trusts it to reason about which *other* jobs trigger
      (e.g. any job gated on `core_misc` alone, without the `agent_surface` OR-term) would be
      misled.
    remediation: >
      Correct the citation: `tests/dossier/**` is in `core_misc` (line ~376); `src/specify_cli/dossier/**`
      is in the separate `agent_surface` composite group (line ~495). Both groups independently
      gate `fast-tests-core-misc`/`integration-tests-core-misc` (per the job's own multi-group
      `if:` clause), so the "applies" conclusion is unaffected, but the plan should name the two
      distinct groups rather than asserting both paths live in the same one.

  - id: PLAN-VERIFY-006
    lens: Revert discipline
    severity: 2
    title: "FR-014 (deprecation header comment on the dead `.kittify/overrides/` mirror files) has no revert-fails test row and no explicit N/A rationale"
    evidence:
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion (lines 384-401) — no row for FR-014"
      - artifact: "plan.md § IC-04 (lines 582-597): \"The only failure mode is writing a comment vague enough that a future maintainer still believes the override might take effect — the comment must name the specific mechanism ... the reviewing squad should check this comment word-for-word\" — names manual review only, not an automated regression"
    claim: >
      Every other FR in the Test Strategy table either has a named revert-fails test or an
      explicit "N/A, here's why" note (FR-011's tracker-state row explicitly says "N/A — this is
      a tracker-state assertion ... verified once at mission close, not re-run in CI"). FR-014 has
      neither: it is absent from the table entirely, and IC-04's own risk paragraph relies on
      one-time human review of the comment wording rather than a regression test that would fail
      if the header comment were later stripped, reworded to lose the specific mechanism name, or
      accidentally overwritten by a future "drift hygiene" refresh (the exact anti-pattern Decision
      4 rejects — see PLAN-GOV-001). This is a real, easily-testable gap — a grep/string-presence
      assertion against each of the three override files. It is a comment-only, low-blast-radius
      change, so this is minor, not high.
    remediation: >
      Add a Test Strategy row for FR-014 — e.g. a grep- or file-read-based assertion in
      `tests/dossier/test_manifest.py` (or `tests/doctrine/`) confirming each of the three
      `.kittify/overrides/missions/{research,documentation,software-dev}/expected-artifacts.yaml`
      files' header comment names the specific inert mechanism
      (`_expected_artifacts_path()` has no override tier for this asset type) — so a future edit
      that silently drops or genericizes the comment fails a test instead of only failing manual
      review.
