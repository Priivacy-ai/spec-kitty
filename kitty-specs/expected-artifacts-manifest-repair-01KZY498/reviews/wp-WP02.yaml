findings:
  - id: WP02-001
    severity: 3
    lens: scope
    file: "tests/specify_cli/dossier/test_integration.py:730-761 (commit c54fbf13c)"
    claim: |
      Adjudication of the self-reported undeclared scope excursion: editing
      TestEdgeCasesCombined.test_completeness_transitions, a file in neither
      WP02's owned_files nor its out-of-map-edit allowance (which names only
      tests/dossier/test_manifest.py).
    evidence: |
      Verified FR-006 genuinely requires the plan step to drop tasks.md:
      runtime_bridge_cores.py:558-559's `plan` branch is
      `_check_artifact_present(snapshot, PLAN_ARTIFACT)` only (PLAN_ARTIFACT
      = "plan.md", line 88) — no tasks.md check at all. The HEAD manifest's
      `plan:` block matches this exactly (only output.plan.main remains).
      Reverted just the old test body against the new (HEAD) manifest content
      and reran: it failed at line 736
      (`assert dossier2.completeness_status == 'incomplete'` ->
      AssertionError, actual value 'complete') — proving the old assertion
      was genuinely, mechanically broken by the required FR-006 content
      edit, not a convenience change to match new behavior invented by the
      implementer. No other WP owns or touches this file (grepped every WP's
      owned_files frontmatter: WP01 owns tests/dossier/test_manifest.py
      only; WP03 owns packs/.../plan/expected-artifacts.yaml; WP04 owns the
      three .kittify/overrides/ mirrors; WP05 owns a disjoint test list under
      tests/dossier, tests/doctrine, tests/runtime, tests/integration,
      tests/charter — none is tests/specify_cli/dossier/test_integration.py)
      — so there is no ownership conflict. The fix itself is well-scoped: it
      does not weaken coverage, it extends the test to also exercise the new
      tasks_outline step (the real new home of the tasks.md check), so the
      lost assertion (tasks.md required somewhere) is preserved, just
      correctly relocated. Self-reported via a dedicated FLAG commit with
      full rationale (c54fbf13c), consistent with the mission's own
      "surface findings, don't silently patch" brief already exercised for
      T011.3/T013.2 in the WP prompt.
    recommendation: |
      Ruling: the excursion is adjudicated CORRECT, not a defect. (1) FR-006
      genuinely requires the content edit; (2) the guard's plan branch
      genuinely behaves as claimed; (3) the failure mode this scrutiny
      guards against — a test edited to fit new code rather than the spec —
      did not occur, since the old assertion independently reproduces red
      against the new manifest for the documented reason, verified by direct
      revert, not by trusting the implementer's prose. On "fix vs. BLOCKED":
      BLOCKED would have been the wrong call here — this is functionally
      identical in kind to the three test_manifest.py stale-test
      corrections the WP prompt itself already authorizes for the identical
      FR-006/FR-008 reason (same-commit correction of a directly,
      mechanically broken pre-existing test, per charter Standing Order #4
      and the ATDD-discipline rationale line the WP prompt already states
      for the in-map corrections) — it is a one-test, no-ownership-conflict,
      immediately-provable consequence, not a judgment call requiring
      human/orchestrator adjudication before proceeding. Severity 3 (not 4)
      because the excursion is real (undeclared file touched outside the
      WP's literal authorization) and worth a durable record in the tracer
      files for the next mission's ownership-map calibration, but it is not
      a defect in the work product itself — no behavior change, no lost
      coverage, no ownership conflict, fully self-disclosed and independently
      re-verified here. Recommend the mission's tracer-tooling-friction.md
      note this pattern (test breakage discovered mid-implementation in a
      file no WP owns) as input to future owned_files scoping, since the
      current out-of-map-edit allowance mechanism assumes the affected files
      are known at planning time.
