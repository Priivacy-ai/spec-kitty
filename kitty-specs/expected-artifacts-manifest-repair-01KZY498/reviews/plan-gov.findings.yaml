findings:
  - id: PLAN-GOV-001
    lens: tracer-files
    severity: 3
    title: "tracer-approach.md still prescribes the Option-B override-file refresh that Decision 4 explicitly rejected"
    evidence:
      - artifact: "tracer-approach.md § 'A discovery that reframed part of the blast radius'"
      - artifact: "tracer-approach.md § 'Default: one PR per mission'"
      - artifact: "tracer-design-decisions.md § Decision 4"
      - artifact: "plan.md § Implementation Concern Map, IC-04"
    claim: >
      tracer-approach.md (seeded at planning, before the adversarial-review fix pass) states the
      approach for the dead `.kittify/overrides/missions/*/expected-artifacts.yaml` copies as
      "refresh the dead mirror copy for drift hygiene only" and lists a ".kittify/overrides/
      drift-hygiene refresh" as part of the single PR's contents. tracer-design-decisions.md's
      Decision 4 (added later, during the adversarial-review fix pass addressing SPEC-ARCH-005)
      explicitly considered and REJECTED exactly this option ("Option B — refresh content to keep
      'in sync' ... Rejected per DIRECTIVE_044: this is the anti-pattern by name"), replacing it
      with header-comment-only deprecation, content otherwise untouched. plan.md's own IC-04
      correctly reflects Decision 4 ("header comment only in each — content otherwise untouched,
      explicitly NOT refreshed to parity per Decision 4"), so plan.md itself is internally
      consistent with the final decision — but tracer-approach.md, one of the three CONTRACT
      files this mission's tasks/implementation is meant to be built from, was never updated to
      match. The mission's own "Confirmed: Tracer Files Already Seeded" section in plan.md
      asserts the three tracer files "carry substantive content from the spec-authoring phase"
      without checking they are still mutually consistent after two further fix rounds, even
      though plan.md demonstrably had Decision 4's text in hand when it wrote IC-04 (it quotes
      Decision 4 by name).
    remediation: >
      Before /spec-kitty.tasks slices IC-04, correct tracer-approach.md's two "refresh...for drift
      hygiene" passages to match Decision 4 (header-comment-only, content untouched) — either by
      editing the file directly (tracer files are living documents per Standing Order #3, appended
      during implementation) or by adding an explicit superseded-by-Decision-4 note at each of the
      two locations. This removes the risk that a WP implementer who reads tracer-approach.md
      (rather than tracer-design-decisions.md) refreshes the override files' content, silently
      reproducing the DIRECTIVE_044 anti-pattern Decision 4 was written specifically to avoid —
      a mistake nothing in the test suite would catch, since these files are consumed by no
      production reader.
