      same lines.'" WP04's own prompt text ("do not start T018's edit to
      test_manifest.py until WP01 has actually landed (even though the
      dependency graph doesn't require it)") confirms the mission's own authors
      recognize this is advisory-only, unenforced by the structured
      dependency/lane data. The claim accurately describes a real gap between
      the machine-readable coordination artifacts and the prose mitigation.

  - id: TASKS-SEQ-002
    verdict: confirmed
    reason: >
      Verified the test count and the contradiction directly. WP01's T002 adds 4
      tests (test_expected_artifact_spec_rejects_extra_keyword,
      test_expected_artifact_manifest_rejects_extra_keyword,
      test_all_shipped_manifests_load_after_hardening,
      test_load_manifest_raises_on_malformed_yaml), T003 adds 2, T004 adds 1 — 7
      total, matching the DoD's "All 7 new/updated tests in this WP are GREEN."
      T002 step 4 explicitly defines test_all_shipped_manifests_load_after_hardening
      as loading all four shipped manifests including plan and asserting each is
      non-None, which is a single test function whose plan-assertion cannot pass
      until WP03 authors that file. T005's own Validation text confirms this
      directly: "this partial check is expected to still show plan as None until
      WP03 lands." WP03's T016 Validation corroborates: "closing out the partial
      check WP01 left open for plan." WP03's frontmatter confirms
      dependencies: [WP01] (not the reverse), and
      packs/built-in/missions/plan/expected-artifacts.yaml does not exist before
      WP03. Yet WP01's Definition of Done states "All 7 new/updated tests in this
      WP are GREEN" with no exception, and nothing in T005's Definition-of-Done
      bullet or the DoD list itself carves out the plan sub-assertion. This is a
      genuine internal contradiction between WP01's own subtask validation text
      and its own Definition of Done, exactly as described.

  - id: TASKS-VERIFY-002
    verdict: confirmed
    reason: >
      Verified T006 step 1's exact text against the live file: "Narrow the
      `except Exception as e` to `except pydantic.ValidationError`. Let the
      `ValidationError` propagate to the caller (no `except` swallows it)."
      Checked against the live code at src/specify_cli/dossier/manifest.py:207-215,
      which currently reads `except Exception as e: logger.error(...); ...
      return None`. Read literally, sentence 1 ("narrow ... to except
      pydantic.ValidationError") describes keeping an active except clause whose
      type is ValidationError — which, if the existing log-and-return-None body
      is kept (the natural reading of "narrow", i.e. change only the caught
      type), produces code that still swallows ValidationError into None,
      directly contradicting sentence 2's "no except swallows it." Cross-checked
      against tracer-design-decisions.md Decision 3, which states the intended
      final shape unambiguously: "changing load_manifest()'s exception handling
      to let pydantic.ValidationError propagate to the caller instead of being
      caught by the bare except Exception" — i.e., the correct code has no
      catching except-clause for ValidationError at all, which is a materially
      different instruction than "narrow the except to [that type]." The finding
      correctly identifies this as an internally inconsistent two-sentence
      instruction that could mislead a literal-minded implementer into
      reintroducing the silent-None bug FR-016 exists to close, and correctly
      notes T002's own red-first test would still fail if this misreading were
      implemented (the stated mitigating factor holds up).

  - id: TASKS-VERIFY-003
    verdict: confirmed
    reason: >
      Verified every cited fact. src/runtime/next/runtime_bridge_io.py:796 reads
      `wp_files = sorted(tasks_dir.glob("WP*.md")) if tasks_dir_is_dir else []`.
      runtime_bridge_cores.py:91 defines
      `MISSING_TASK_FILES_MESSAGE = "Required: at least one tasks/WP*.md file"`,
      used at guard-failure sites for tasks_packages/tasks_finalize. spec.md's
      FR-007 row and line 108's claim-5 text both say "a tasks/WP*.md glob"
      precisely; plan.md's AS5 Test Strategy row states "tasks_packages and
      tasks_finalize each require a tasks/WP*.md glob entry blocking" verbatim.
      packs/built-in/missions/software-dev/expected-artifacts.yaml line 10's
      header comment reads "Path patterns support glob syntax (e.g., tasks/*.md
      matches all .md files in tasks/)" — confirmed via grep that
      "tasks/*.md" does not appear as an actual path_pattern value anywhere else
      in that file (only spec.md, plan.md, tasks.md, analysis-report.md, etc.
      appear as literal path_pattern values), so it is exactly the "generic
      illustrative comment, not an actual used path_pattern value" the finding
      describes. WP02's T012 step 1 does lead with "reuse the existing
      tasks/*.md-style pattern already used elsewhere in this schema" before its
      hedge to check the guard functions, and T014 step 3's literal instruction
      text is `path_pattern: "tasks/*.md" (or the glob confirmed in T012)` —
      stating the wrong-by-guard-standard value as the primary, default-reading
      text with the correct value relegated to a parenthetical. Verified WP05's
      T020 test (test_all_required_by_step_keys_match_guard_or_carry_comment)
      checks only that each required_by_step key corresponds to a real guard
      branch or carries an explanatory comment — it does not assert on the
      literal path_pattern glob string — so the claim that T020 would not
      necessarily catch a tasks/*.md-vs-tasks/WP*.md regression is accurate. The
      claim and remediation are well-supported by the live guard code and the
      WP's own text.
