      the 3 .kittify/overrides files; lane-b (WP02) and lane-c (WP03) write_scope
      arrays likewise list only their own packs/built-in manifest files — none of
      the three lanes' write_scope arrays mention
      tests/dossier/test_manifest.py, even though WP01/WP02/WP03/WP04 all touch
      that file (WP01 as owner, the other three via documented out-of-map edits
      confirmed in each WP prompt's own "Out-of-map edit" section and in
      tracer-approach.md's "Chokepoints & execution sequencing" section). That
      section's own text states verbatim: "This is an execution-order
      recommendation for whoever drives the implement-review loop, not a
      dependency the tasks/lanes machinery encodes structurally — owned_files is
      file-granularity, not class/line-granularity, so the ownership validator
