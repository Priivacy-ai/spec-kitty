verdicts:
  - id: TASKS-DECOMP-001
    verdict: confirmed
    reason: >
      Verified directly against tasks/WP03-plan-manifest-and-guard-gap-issue.md.
      T015/T016 are ordinary red-first-test-then-content-edit subtasks against a
      single YAML data file (owned_files: only
      packs/built-in/missions/plan/expected-artifacts.yaml). T017's steps
      literally direct "File a new GitHub issue on this repository
      (Priivacy-ai/spec-kitty) via gh issue create", and T017's own Validation
      line reads "gh issue view <new-issue-number> confirms the issue exists ...
      (this is a tracker-state assertion, verified once at mission close per
      plan.md's Test Strategy table — not a pytest test)". plan.md line 409's AS5
      row independently confirms this row is marked "N/A (tracker verification,
      not a pytest test)", distinct from every other AS row in the same table.
      WP03's Definition of Done lists T017's issue-filing as one checklist item
      alongside the two code-content items with no stated carve-out letting
      T015/T016 be reviewed/approved independently of T017, and no step in T017
      (or the Definition of Done, or the Risks section) instructs checking
      whether a prior attempt at this WP already filed the issue before calling
      `gh issue create` again. `gh issue create` is genuinely non-idempotent, so
      the duplicate-issue-on-rework risk described is real and the reviewability
      cost of mixing diff-review (T015/T016) with live-tracker verification
      (T017) in one WP review pass is accurately characterized. This is a fair
      structural critique, not a mischaracterization of the artifact.

