findings:
  - id: TASKS-DECOMP-001
    lens: mission-specific (WP03 tracker-mutation bundling)
    severity: 3
    source: decomp
    title: WP03's T017 bundles a non-idempotent, external tracker mutation (gh issue create) inside an otherwise pure-content WP, with no duplicate-issue guard on rework
    evidence:
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md, frontmatter (owned_files) and 'Subtask T017: File the upstream guard-gap issue (FR-011, SC-005)'"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Subtask T017 step 1: 'File a new GitHub issue on this repository (`Priivacy-ai/spec-kitty`) via `gh issue create`...'"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Definition of Done: 'A new GitHub issue exists, distinct from #3388, naming the precise defect; its URL is recorded in `tracer-design-decisions.md` and ready for the PR body.'"
      - code: "src/specify_cli/dossier/manifest.py:60,90 (ExpectedArtifactSpec/ExpectedArtifactManifest — the actual code-review-able content WP03's T015/T016 touch)"
    claim: >
      WP03's `owned_files` is a single YAML data file
      (`packs/built-in/missions/plan/expected-artifacts.yaml`), and T015/T016 are
      ordinary red-first-test-then-content-edit subtasks reviewable as a normal code
      diff. T017 is a fundamentally different kind of action: an irreversible,
      external, stateful mutation against the live GitHub tracker (`gh issue
      create`, then an HiC assignment), verified not by pytest but by "gh issue
      view <new-issue-number>" (plan.md's own Test Strategy table labels this row
      "N/A (tracker verification, not a pytest test)" — plan.md itself already
      segregates this action's verification model from every other AC in the same
      table). Bundling it into the same WP as the manifest content creates two
      concrete problems: (1) reviewability — a reviewer of WP03 must switch from
      diff-based code review (T015/T016) to live-tracker-state verification (T017)
      within the same review pass; (2) correctness on rework — nothing in T017's
      steps or WP03's Definition of Done guards against re-filing a duplicate issue
      if WP03 is rejected in the implement-review loop and reworked (e.g. because
      T016's manifest content needed a fix unrelated to T017). `gh issue create` is
      not idempotent; a naive re-run of the WP on rejection would file a second
      upstream issue for the same defect, since T017 carries no "check whether the
      issue from a prior attempt already exists" step.
    remediation: >
      Either (a) split T017 into its own WP (or a lightweight, orchestrator/HiC-
      owned follow-up step outside the implement-review loop) so the code-content
      WP (T015/T016) can be reviewed, approved, and merged independently of the
      tracker-side action, or (b) if kept inside WP03, add an explicit idempotency
      guard to T017 ("before filing, search open issues in Priivacy-ai/spec-kitty
      for a title/body match created by a prior attempt at this WP; only file if
      none exists") and state in the Definition of Done that WP03's code-content
      portion (T015/T016) may be reviewed and marked complete independently of
      T017's tracker-side completion.

  - id: TASKS-SEQ-001
    lens: chokepoints
    severity: 3
    source: seq
    title: "WP04's tests/dossier/test_manifest.py collision has no dependency edge in wps.yaml/lanes.json; the mitigation is prose the automated scheduler cannot see"
    evidence:
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/wps.yaml (WP04: dependencies: [])"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/lanes.json (lane-d/WP04: depends_on_lanes: [], parallel_group: 0 — same group as lane-a/WP01; lane-d write_scope lists only the 3 .kittify/overrides files, no tests/dossier/test_manifest.py; lane-b/WP02 and lane-c/WP03 write_scope likewise omit tests/dossier/test_manifest.py)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-approach.md § 'Chokepoints & execution sequencing' — 'this is an execution-order recommendation for whoever drives the implement-review loop, not a dependency the tasks/lanes machinery encodes structurally'"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP04-deprecate-override-mirrors.md § Out-of-map edit — 'do not start T018's edit to test_manifest.py until WP01 has actually landed (even though the dependency graph doesn't require it)'"
    claim: >
      tests/dossier/test_manifest.py is edited by all 5 WPs (WP01 as declared
      owner; WP02, WP03, WP04 each via an undeclared, prose-only "out-of-map edit"
      adding their own new test class). lanes.json's write_scope arrays for
      lane-b/c/d omit this file entirely, so any tooling that gates concurrent-lane
      scheduling on write_scope disjointness would certify lane-a (WP01,
      parallel_group 0) and lane-d (WP04, also parallel_group 0, zero dependencies)
      as non-colliding and safe to run concurrently — when the WP prompts' own text
      says otherwise. The only actual safeguard is a natural-language
      recommendation in tracer-approach.md, which the mission's own text concedes
      is advisory only. An automated orchestrator that schedules purely from
      lanes.json's parallel_group/depends_on_lanes has no structural signal to
      serialize WP01 and WP04's touches of this file, and the same exposure recurs
      for WP04 against WP02/WP03 during parallel_group 1, since WP04 carries no
      dependency edge constraining when it runs at all.
    remediation: >
      Add a dependency edge in wps.yaml (e.g. WP04: dependencies: [WP01], or a
      lighter scheduling-only marker if the tooling distinguishes content-
      dependencies from ordering-dependencies) so finalize-tasks recomputes
      lanes.json to place WP04 in a later parallel_group than WP01, or — if an
      artificial content dependency is undesirable — extend lane-b/c/d's
      write_scope in lanes.json to explicitly include tests/dossier/test_manifest.py
      so the disjointness/overlap machinery that actually gates concurrent
      execution can see and serialize the real collision instead of relying on an
      agent reading and manually honoring tracer-approach.md's prose.

  - id: TASKS-SEQ-002
    lens: mission-specific (ATDD / Definition-of-Done internal consistency)
    severity: 4
    source: seq+verify (merged with TASKS-VERIFY-001, same claim/evidence)
    also_reported_as: [TASKS-VERIFY-001]
    title: "WP01's Definition of Done claims all 7 new tests are GREEN, but its own T005 validation text says one of them (test_all_shipped_manifests_load_after_hardening) is still red on the `plan` assertion at WP01's completion"
    evidence:
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T002, step 4 (test_all_shipped_manifests_load_after_hardening loads all four shipped manifests including `plan` and asserts each is non-None)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T005 Validation — 'this partial check is expected to still show `plan` as `None` until WP03 lands'"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP01-schema-hardening-and-loud-failure.md § Definition of Done — 'All 7 new/updated tests in this WP are GREEN.' (no carve-out stated)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/tasks/WP03-plan-manifest-and-guard-gap-issue.md § Subtask T016 Validation — 'closing out the partial check WP01 left open for `plan`' (confirms the mission's own authors treat the check as still open past WP01)"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md (dependencies: [WP01]) — plan/expected-artifacts.yaml does not exist until this WP lands"
    claim: >
      WP01's T002 adds 4 tests; T003 adds 2; T004 adds 1 — 7 total, matching the
      DoD's "All 7" count. test_all_shipped_manifests_load_after_hardening asserts
      ManifestRegistry.load_manifest() returns non-None for all four shipped
      manifests, including `plan` — but `plan`'s manifest file is not authored
      until WP03, a separate WP that WP01 has zero dependency on and that is
      explicitly designed to be independently landable and reviewable first. WP01's
      own T005 validation step admits the re-run of this exact test is "expected to
      still show `plan` as `None`" — i.e. still failing one of its four assertions
      — at the point WP01's own implementation is complete. WP03's T016 validation
      text independently corroborates this. Yet WP01's Definition of Done
      unconditionally states "All 7 new/updated tests in this WP are GREEN" with no
      exception carved out. A reviewer applying the DoD checklist literally at
      WP01's own completion must either incorrectly check the box while a test is
      still failing (a false-GREEN gate, contradicting the charter's
      red-first/never-retry-to-green discipline) or be unable to check the box at
      all, incorrectly blocking WP01's own sign-off on content that structurally
      cannot exist until a different, later WP lands. This is a genuine internal
      contradiction inside a single WP prompt, not merely an ambiguity, and it also
      creates a real risk that an implementer papers over the gap with an
      undocumented workaround (e.g. conditionally skipping the plan assertion) —
      exactly the kind of silent-success-adjacent shortcut this mission exists to
      eliminate.
    remediation: >
      Either (a) split test_all_shipped_manifests_load_after_hardening's four
      assertions so WP01 only asserts the three manifests it can actually make pass
      (research/documentation/software-dev), with an explicit code comment noting
      the plan assertion is added by WP03 in the same test (or a WP03-owned
      follow-on assertion/test, since TestPlanManifest.test_plan_manifest_loads_and_matches_state_machine
      already duplicates this coverage for `plan` specifically); or (b) explicitly
      carve out the exception in WP01's Definition of Done, e.g. "6 of 7 tests are
      fully GREEN; test_all_shipped_manifests_load_after_hardening is GREEN for
      research/documentation/software-dev and remains red on its `plan`
      sub-assertion until WP03 lands — this is expected and not a WP01 blocker."

  - id: TASKS-VERIFY-002
    lens: silent-success / WP01 T006-T007 loud-failure implementation
    severity: 2
    source: verify
    title: "WP01 T006's instruction to 'narrow the except to pydantic.ValidationError' while also 'letting it propagate (no except swallows it)' is self-contradictory as literally written"
    evidence:
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T006, step 1"
      - code: "src/specify_cli/dossier/manifest.py:207-215"
    claim: >
      T006 step 1 reads: "Narrow the `except Exception as e` to `except
      pydantic.ValidationError`. Let the `ValidationError` propagate to the caller
      (no `except` swallows it)." Taken literally, these two sentences conflict:
      catching an exception type does not, by itself, let it propagate —
      propagation requires either not catching it at all, or catching and
      explicitly re-raising. An implementer who writes `except
      pydantic.ValidationError as e: logger.error(...); return None` (i.e. simply
      narrows the type matched, keeping the old swallow-and-return-None body) would
      satisfy the literal first sentence but violate the second, and would silently
      reintroduce the exact silent-success bug FR-016/this mission exists to close.
      plan.md's own prose ("let `pydantic.ValidationError` propagate to the caller
      instead of the bare `except Exception`") is clearer than the WP's own step
      text. The risk is partially mitigated because T002's own red-first test
      (`test_load_manifest_raises_on_malformed_yaml`) would still be RED if this
      misreading were implemented, giving a self-correcting signal — hence moderate
      rather than high severity.
    remediation: >
      Reword T006 step 1 to state unambiguously: "Remove the `except Exception`
      clause's handling of `ValidationError` entirely — do not add any `except
      pydantic.ValidationError` block around the `model_validate` call. The only
      remaining exception-adjacent code in this try/except should be the case(s),
      if any, that still need a bare `except Exception` for a genuinely different
      purpose (none is expected here per Decision 3)." State explicitly that the
      intended code shape has NO catch of `ValidationError` in `load_manifest()`.

  - id: TASKS-VERIFY-003
    lens: file-references-real / guard-parity content risk (WP02 FR-007)
    severity: 4
    source: verify+decomp (merged with TASKS-DECOMP-002, same claim/evidence)
    also_reported_as: [TASKS-DECOMP-002]
    title: "WP02 T012/T014 default to the wrong glob pattern (tasks/*.md) for the tasks_packages/tasks_finalize manifest entries, contradicting both FR-007's own text and the actual guard code (WP*.md)"
    evidence:
      - artifact: "tasks/WP02-reconcile-manifests.md § Subtask T012, step 1 (\"a tasks/WP*.md-style glob ... reuse the existing tasks/*.md-style pattern already used elsewhere in this schema\")"
      - artifact: "tasks/WP02-reconcile-manifests.md § Subtask T014, step 3 (\"path_pattern: \\\"tasks/*.md\\\" (or the glob confirmed in T012)\")"
      - artifact: "spec.md FR-007 (\"tasks_packages and tasks_finalize each require a tasks/WP*.md glob entry blocking\")"
      - artifact: "spec.md line 108 (\"tasks/WP*.md appears in zero manifest entries despite four call sites in runtime_bridge_cores.py\")"
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion, AS5 row (\"tasks_packages and tasks_finalize each require a tasks/WP*.md glob entry blocking\")"
      - code: "src/runtime/next/runtime_bridge_io.py:794 (wp_files = sorted(tasks_dir.glob(\"WP*.md\")) if tasks_dir_is_dir else [])"
      - code: "src/runtime/next/runtime_bridge_cores.py:91 — MISSING_TASK_FILES_MESSAGE = \"Required: at least one tasks/WP*.md file\""
      - code: "packs/built-in/missions/software-dev/expected-artifacts.yaml:10 (header comment: \"Path patterns support glob syntax (e.g., tasks/*.md matches all .md files in tasks/)\" — a generic illustrative comment, not an actual field value anywhere in the file)"
    claim: >
      The guard the manifest must match (`_evaluate_tasks_packages_guard` /
      `_evaluate_tasks_finalize_guard`, via `_tasks_dir_ready()`) checks
      `tasks_dir.glob("WP*.md")` specifically — files literally prefixed `WP`, not
      every Markdown file under `tasks/`. spec.md's own FR-007 text and AS5 already
      state the correct target precisely: "a `tasks/WP*.md` glob entry." Despite
      this, WP02's T012 leads with "reuse the existing `tasks/*.md`-style pattern
      already used elsewhere in this schema" (the only place this string appears is
      a generic illustrative comment in the software-dev manifest's header, not an
      actual used `path_pattern` value) and only hedges toward checking the guard
      as an afterthought; T014's step 3 then defaults its own written instruction
      to `path_pattern: "tasks/*.md"` outright, with "(or the glob confirmed in
      T012)" as a parenthetical escape hatch rather than stating the correct value
      directly. An implementer who follows T014's literal default produces a
      manifest entry that is broader than what the guard actually checks (`tasks/*.md`
      would match e.g. `tasks/README.md` or a non-WP-prefixed file, which the guard
      ignores) — reproducing, inside this very mission's own guard-reconciliation
      fix, the exact class of manifest/guard divergence bug #3388 exists to
      eliminate. This directly undermines SC-001's acceptance bar for these two
      specific entries, and would not necessarily be caught by WP05's T020
      guard-parity check (which cross-checks step-id-to-guard-branch
      correspondence, not the literal glob string against the guard's constant).
    remediation: >
      Correct T012 and T014 to state the glob pattern directly and unambiguously as
      `tasks/WP*.md` (matching spec.md's FR-007/AS5 text and the guard's actual
      `tasks_dir.glob("WP*.md")` call at `runtime_bridge_io.py:794`), removing the
      "reuse the existing tasks/*.md-style pattern" framing entirely so there is no
      wrong-by-default reading. WP05's T020 guard-parity test
      (`test_all_required_by_step_keys_match_guard_or_carry_comment`) should also
      assert on the glob's literal string value for these two entries, not merely
      on step-key presence, so a future regression to the broader pattern is caught
      structurally.
