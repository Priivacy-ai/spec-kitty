findings:
  - id: SPEC-VERIFY-001
    lens: divergence-fix fidelity
    severity: 4
    title: "Decision 1 / FR-010 / FR-011 misstate current guard behavior for plan-type 'review' — it does not fall to a bare return []"
    evidence:
      - artifact: "spec.md § Clarifications > Session 2026-08-13 > Q1 (Decision 1 rationale: \"a plan-type step id returns [] unconditionally today\")"
      - artifact: "spec.md § User Story 2, Acceptance Scenario 4 (\"goals/research/structure/draft/review all fall to the bare return []\")"
      - artifact: "spec.md § FR-011 (\"naming the missing plan-family branch ... as an independent defect\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:554-566 (_evaluate_software_dev_guards: `if step_id in (\"implement\", \"review\"): return _evaluate_wp_iteration_guard(step_id, snapshot)`, with the bare `return []` only reached for step ids that match none of the branches above it)"
      - code: "packs/built-in/missions/plan/mission.yaml (states list includes `name: review`)"
      - code: "src/runtime/next/runtime_bridge.py:680-698 (`_check_cli_guards` hardcodes `mission_family=\"software-dev\"` regardless of the mission's actual type, then calls `evaluate_guards()` with the mission's real, unqualified `step_id`)"
      - code: "src/runtime/next/runtime_bridge.py:1541-1544,1557-1566 (`_dn_composition_dispatch`, the mission-family-aware guard path via `_check_composed_action_guard`, is gated to `mission == \"software-dev\"` only — plan-type missions never reach it and instead always go through the hardcoded-software-dev `_check_cli_guards` path)"
    claim: >
      The spec asserts, as verified fact underpinning Decision 1, FR-010's Acceptance Scenario 4,
      and FR-011's proposed upstream issue, that every plan-type step id (goals/research/structure/
      draft/review) "falls to the bare return []" in _evaluate_software_dev_guards because none of
      plan's own state names match software-dev's vocabulary. This is false for the "review" state:
      plan/mission.yaml's state list literally includes a state named "review", and
      _evaluate_software_dev_guards has an explicit branch `if step_id in ("implement", "review"):
      return _evaluate_wp_iteration_guard(step_id, snapshot)` that fires for that exact string,
      never reaching the bare `return []`. Traced the live call path: for any mission type
      (plan included), `_check_cli_guards` (runtime_bridge.py:680-698) hardcodes
      `mission_family="software-dev"` and passes the real state name as `step_id`; the
      mission-family-aware composed-action path that would have used "plan" as the real family is
      unreachable for plan missions because `_dn_composition_dispatch` gates on
      `mission == "software-dev"`. So a plan mission sitting at its "review" state invokes
      _evaluate_wp_iteration_guard("review", snapshot), which checks `wp_advance_ready` — today this
      coincidentally still yields `[]` (wp_advance_ready defaults True when no tasks/ dir exists for
      a plan mission), but the guard is a real, reachable, mission-blind branch, not the bare
      fallback the spec describes. If a plan mission's directory ever contained a `tasks/WP*.md` set
      for any reason, "review" would be spuriously blocked with a nonsensical software-dev message
      ("Not all work packages are approved or done"). FR-010's header-comment acceptance criterion
      (Scenario 4) requires the new manifest to assert something about the code that is not true,
      and FR-011's planned upstream issue — based on this same false premise — would describe the
      wrong defect (a total vocabulary non-match) instead of the real one (an accidental
      mission-blind vocabulary collision via a hardcoded mission_family), misdirecting whoever picks
      up that follow-up issue.
    remediation: >
      Correct Decision 1's rationale and FR-010's Acceptance Scenario 4 (the header-comment
      requirement) to state the mechanism precisely: plan-type missions are routed through
      `_check_cli_guards`, which hardcodes `mission_family="software-dev"`, so any plan-type
      step id that happens to lexically match software-dev's own vocabulary (currently only
      "review", via the `("implement", "review")` branch) is evaluated by
      `_evaluate_wp_iteration_guard` rather than falling through to the bare `return []` — it
      returns `[]` today only because `wp_advance_ready` defaults True for a plan mission with no
      `tasks/` directory, not because no branch matches. Rewrite FR-011's issue description to name
      this real defect (mis-attributed `mission_family` plus an accidental "review" vocabulary
      collision with latent spurious-block risk), not "no branch recognizes plan step ids."
  - id: SPEC-VERIFY-002
    lens: divergence-fix fidelity
    severity: 3
    title: "FR-007 / Acceptance Scenario 5 omit the non-expressible requirement_mapping_failures check inside the tasks_packages guard"
    evidence:
      - artifact: "spec.md § FR-007 (\"tasks_packages and tasks_finalize each require a tasks/WP*.md glob (this satisfies ... in the same edit)\")"
      - artifact: "spec.md § User Story 1, Acceptance Scenario 5 (only names the tasks.md/glob requirement for the three CLI-native steps)"
      - artifact: "spec.md § User Story 1, Acceptance Scenario 7 / SC-001 (\"every key either matches a real guard branch's check or carries an inline comment ... e.g. the occurrence-gate / dependency-frontmatter checks at tasks_finalize\" — tasks_finalize's non-expressible checks are named explicitly; tasks_packages's is not)"
      - code: "src/runtime/next/runtime_bridge_cores.py:484-489 (_evaluate_tasks_packages_guard: returns the glob-missing message OR `list(snapshot.status_facts[\"requirement_mapping_failures\"])` — a second, non-filesystem-expressible check on the same branch)"
    claim: >
      _evaluate_tasks_packages_guard enforces two things: the tasks/WP*.md glob (filesystem,
      schema-expressible) AND requirement_mapping_failures (a non-filesystem check — same category
      as the dependency-frontmatter/occurrence-gate checks the spec explicitly calls out for
      tasks_finalize). FR-007 and its Acceptance Scenario 5 only instruct the implementer to add the
      glob entry for tasks_packages; neither names requirement_mapping_failures nor asks for an
      inline comment documenting it, even though SC-001/Scenario 7's general "zero unexplained
      divergences" bar would require one. Because tasks_finalize's analogous non-expressible checks
      are called out by name elsewhere in the same acceptance scenario, an implementer working
      strictly from FR-007's text has no signal that tasks_packages needs the same treatment, and
      the gap is grepped in this spec.md (no occurrence of "requirement_mapping" or "requirement
      mapping" anywhere in the document).
    remediation: >
      Extend FR-007 (and Acceptance Scenario 5) to explicitly require an inline YAML comment on the
      tasks_packages required_by_step entry noting that _evaluate_tasks_packages_guard also enforces
      requirement_mapping_failures (non-filesystem-expressible), mirroring the treatment already
      specified for tasks_finalize's occurrence-gate/dependency-frontmatter checks.
