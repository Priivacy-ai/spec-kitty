findings:
  - id: TASKS-FRESH4-001
    severity: 3
    source: round-4 R5b fresh sweep
    title: "AS4 of US2 (plan manifest's guard-gap header comment) is claimed as test-covered but has no automated assertion anywhere in the tasks corpus"
    evidence:
      - artifact: "spec.md § User Story 2, Acceptance Scenario 4 (AS4): the new plan/expected-artifacts.yaml's header comment must state, precisely, the hardcoded-mission_family + review-step-collision mechanism (Decision 1)"
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion, 'AS1–AS4 (US2, plan manifest, FR-010)' row: bundles AS1-AS4 under one test, test_plan_manifest_loads_and_matches_state_machine"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Subtask T015 (red-first test): its assertions cover load/version/step-ids/per-step artifacts only — no header-comment-content assertion"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Subtask T016 (implementation): authors the AS4 header comment as prose guidance to the implementer, with no accompanying automated test requirement"
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Subtask T018 (structurally parallel case, FR-014's deprecation header): DOES get an automated content-substring regression test (test_override_mirror_files_carry_deprecation_header), explicitly justified as guarding against a future silent 'drift hygiene' strip of the wording"
    claim: >
      spec.md's AS4 (User Story 2) is a concrete, testable claim about the new
      `plan/expected-artifacts.yaml`'s header comment text — it must name the
      exact hardcoded-`mission_family` + `review`-step-collision mechanism, not
      a vaguer "no guard exists yet" statement (WP03's own Risks section
      independently flags this exact under-specification hazard: "the
      reviewing squad should check this comment word-for-word against Decision
      1's text, not just confirm a comment is present"). Yet the only
      verification path anywhere in the mission's task corpus for this
      specific claim is a one-time manual reviewer read (WP03's own "Reviewer
      Guidance" section). plan.md's Test Strategy table bundles AS4 into the
      same row as AS1-AS3 as if `test_plan_manifest_loads_and_matches_state_
      machine` covers all four — but that test's actual assertions (per WP03's
      own T015 subtask) only check load-success, mission_type, manifest_version,
      get_step_ids() ordering, and per-step required-artifact specs; none of
      them read or assert on the header comment's text content. This is the
      exact defect class the mission itself exists to eliminate (a claimed
      guarantee with no structural enforcement) reproduced inside the
      mission's own task corpus: WP04's structurally identical case (FR-014's
      deprecation header on the override mirrors) DOES get an automated
      regression test for exactly this reason, but WP03's AS4 header does not
      get the analogous treatment — so a future accidental genericization or
      drift of that header comment's wording would pass every automated test
      in the suite undetected, silently reverting to the "no branch recognizes
      plan step ids" vaguer framing Decision 1's own "Correction" paragraph
      explicitly rejected.
    remediation: >
      Add a test assertion to WP03's T015 (or a small addition alongside it,
      following the exact pattern WP04's `test_override_mirror_files_carry_
      deprecation_header` already establishes for the structurally parallel
      FR-014 case): read the raw text of `packs/built-in/missions/plan/
      expected-artifacts.yaml` and assert the AS4 header comment contains the
      specific-mechanism markers from Decision 1 — e.g. references to
      `mission_family="software-dev"`/`_check_cli_guards` and the `review`-step
      lexical-collision, not merely a generic "no guard exists" string. Update
      plan.md's Test Strategy table row to reflect that AS4 is now covered by
      its own explicit assertion (either within `test_plan_manifest_loads_
      and_matches_state_machine` or as a small sibling test), not merely
      bundled prose alongside AS1-AS3's structural checks.
