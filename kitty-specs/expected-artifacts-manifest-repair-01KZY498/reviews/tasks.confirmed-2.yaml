findings:
  - id: TASKS-VERIFY-002
    severity: 2
    source: round-1 R5a unresolved (carried forward)
    title: "T006 step 1 was correctly reworded, but WP01's own Reviewer Guidance section still instructs checking for a ValidationError-narrowing catch that must not exist"
    evidence:
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Reviewer Guidance (line ~432)"
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T006 step 1 (already correctly fixed in round 1)"
    claim: >
      T006 step 1 itself was correctly reworded in round 1 to state no
      ValidationError catch exists in load_manifest() at all. But the file's own
      "Reviewer Guidance" section was left unchanged and still instructs the
      reviewer to "Confirm the `except Exception` -> `except
      pydantic.ValidationError` narrowing in `manifest.py` did not silently
      swallow a different...exception type" — reintroducing the exact
      catch-exists framing T006 step 1 was fixed to remove. A reviewer following
      this stale guidance would look for (and could accept) a ValidationError
      catch that the corrected implementation instructions say must not exist.
    remediation: >
      Reword WP01's Reviewer Guidance bullet to match T006's corrected framing:
      state the reviewer should confirm `load_manifest()` has NO
      `except pydantic.ValidationError` (or equivalent) clause at all around the
      `model_validate` call — the ValidationError must propagate unhandled — not
      "confirm the narrowing did not swallow a different exception type," which
      presumes a catch clause exists.

  - id: TASKS-FRESH1-001
    severity: 4
    source: round-1 R5b fresh sweep
    title: "The round-1 fix that pushed WP04 into WP01's later parallel_group also pushed it into the SAME parallel_group as WP02/WP03, creating an unnamed three-way chokepoint on tests/dossier/test_manifest.py"
    evidence:
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/lanes.json (lane-b/WP02, lane-c/WP03, lane-d/WP04 all now parallel_group: 1, all depends_on_lanes: ['lane-a'] only)"
      - artifact: "tasks/WP02-reconcile-manifests.md § Chokepoint note (names only WP03)"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Chokepoint note (names only WP02)"
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Out-of-map edit note (names only WP01)"
      - artifact: "tracer-approach.md § Chokepoints & execution sequencing addendum (TASKS-SEQ-001 fix note scopes the residual gap to WP02-vs-WP03 only)"
    claim: >
      Round 1's structural fix for TASKS-SEQ-001 added `WP04: dependencies:
      [WP01]` to wps.yaml, which correctly moved WP04 out of WP01's own
      parallel_group — but the side effect was placing WP04 into
      `parallel_group: 1`, the SAME group already occupied by WP02 and WP03 (both
      of which also depend only on WP01). All three of WP02, WP03, and WP04 edit
      `tests/dossier/test_manifest.py` via undeclared out-of-map edits (adding
      TestManifestReconciliation, TestPlanManifest, and
      TestOverrideMirrorDeprecation respectively). No document in the mission
      names this new three-way concurrent-edit collision: WP02's and WP03's own
      "Chokepoint" notes each still name only the other WP; WP04's note names only
      WP01; and tracer-approach.md's own addendum recording the round-1 fix
      explicitly scopes the still-open sequencing risk to "WP02-vs-WP03" only,
      not the new three-way exposure the fix itself just created. Fixing the
      WP01-vs-WP04 collision (round 1) silently introduced a WP04-vs-WP02/WP03
      collision of the identical shape and file, without anyone naming it.
    remediation: >
      Update tracer-approach.md's Chokepoints & execution sequencing addendum to
      name the current three-way exposure explicitly (WP02, WP03, and WP04 all
      in parallel_group 1, all touching tests/dossier/test_manifest.py) and state
      the orchestrator-level recommendation for it (e.g. sequence all three
      WPs' actual test_manifest.py commits one at a time even though the
      dependency graph permits full concurrency). Update each of WP02's, WP03's,
      and WP04's own Chokepoint/Out-of-map-edit notes to cross-reference the
      other TWO WPs sharing the file, not just one.

  - id: TASKS-FRESH1-002
    severity: 3
    source: round-1 R5b fresh sweep
    title: "WP04's own Risks section still asserts 'no formal dependency on WP01,' contradicting the same file's Context section, frontmatter, and wps.yaml/lanes.json, all updated by the round-1 fix"
    evidence:
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Risks section"
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Context section (updated in round 1 to reflect the new WP01 dependency)"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/wps.yaml (WP04: dependencies: [WP01])"
    claim: >
      The round-1 fix added a real `dependencies: [WP01]` edge for WP04 and
      updated the file's Context section and frontmatter accordingly, but the
      same file's Risks section was not swept and still contains the pre-fix
      claim that "this WP has no formal dependency on WP01" — a direct,
      in-document contradiction between two sections of the same WP prompt.
    remediation: >
      Update WP04's Risks section to state the current, accurate fact: WP04 now
      has a formal `dependencies: [WP01]` edge (added in round 1's fix for
      TASKS-SEQ-001), so the chokepoint risk vs. WP01 is now structurally
      enforced by the dependency graph rather than merely advisory — while noting
      the still-open (see TASKS-FRESH1-001) exposure vs. WP02/WP03, which remains
      advisory only.

  - id: TASKS-FRESH1-003
    severity: 3
    source: round-1 R5b fresh sweep
    title: "plan.md's Test Strategy table still describes test_all_shipped_manifests_load_after_hardening as covering all four manifests, now false against WP01's round-1-narrowed scope"
    evidence:
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion, AS3 row (US3, no false positive, SC-003) — 'All four shipped `expected-artifacts.yaml` files load successfully via `ManifestRegistry.load_manifest()` post-hardening'"
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T002 step 4 (round-1-narrowed to assert only research/documentation/software-dev, explicitly deferring `plan` to WP03's TestPlanManifest test)"
    claim: >
      plan.md is the upstream contract tasks.md implements; it is not itself
      edited by the tasks-authoring or R4-fixing process, but the round-1 fix
      changed the SHAPE of a test plan.md describes, and plan.md was never
      updated to reflect the split. plan.md's Test Strategy table still says
      test_all_shipped_manifests_load_after_hardening covers "All four shipped
      expected-artifacts.yaml files" — but per the round-1 fix, that single test
      (in WP01) now covers only three, with the fourth (`plan`) covered by a
      SEPARATE test in WP03. A future reader consulting plan.md as the
      authoritative test-strategy reference (as the mission's own docs instruct)
      would look for one test asserting on all four manifests and not find it —
      the coverage is equivalent in aggregate, but split across two tests in two
      different WPs, which plan.md's current text does not describe.
    remediation: >
      Add a short note to plan.md's AS3 row (or an addendum near the Test
      Strategy table) recording that the round-1 tasks-phase fix split this
      check: WP01's test_all_shipped_manifests_load_after_hardening now covers
      the three manifests WP01 owns (research/documentation/software-dev), and
      WP03's test_plan_manifest_loads_and_matches_state_machine independently
      covers the fourth (`plan`) — so the AS3/SC-003 "no false positive on any of
      the four shipped manifests" bar is still met, in aggregate, across two
      tests rather than one. This is documentation-only (plan.md is not
      re-gated), but the mission's own charter treats a doc/reality disagreement
      as a defect once discovered, so it should be corrected rather than left
      silently stale.

  - id: TASKS-FRESH1-004
    severity: 2
    source: round-1 R5b fresh sweep
    title: "plan.md's IC-04 section still says 'Sequencing/depends-on: none — fully independent,' stale against WP04's new formal WP01 dependency"
    evidence:
      - artifact: "plan.md § Implementation Concern Map, IC-04 — 'Sequencing/depends-on: none — fully independent of IC-01-IC-03'"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/wps.yaml (WP04: dependencies: [WP01])"
    claim: >
      plan.md's own text states plan-phase sequencing notes are "recommendations,
      not commitments — the tasks phase makes the final WP slicing decision," so
      this staleness is lower-severity than TASKS-FRESH1-003's — but it is still
      a real, checkable factual claim (IC-04 "fully independent") that the tasks
      phase's own round-1 fix has now made untrue for the WP that implements
      IC-04 (WP04 depends on WP01 in wps.yaml/lanes.json).
    remediation: >
      Add a short note to plan.md's IC-04 section recording that the tasks phase
      (round-1 adversarial-review fix) added a formal WP04-depends-on-WP01
      dependency edge for scheduling/chokepoint-safety reasons (shared editing of
      tests/dossier/test_manifest.py), superseding this plan-time "fully
      independent" recommendation — matching the same disclaimer plan.md already
      gives itself ("recommendations, not commitments").
