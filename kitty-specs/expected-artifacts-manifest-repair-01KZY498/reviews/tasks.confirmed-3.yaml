findings:
  - id: TASKS-FRESH2-001
    severity: 3
    source: round-2 R5b fresh sweep
    title: "tracer-approach.md's own mid-body DAG description is now false, uncorrected by either of its two trailing addenda"
    evidence:
      - artifact: "tracer-approach.md (root DAG sentence, before the addenda): 'parallel_group 0 = {WP01, WP04} ... parallel_group 1 = {WP02, WP03}'"
      - artifact: "tracer-approach.md § round-1 addendum (records the WP01-vs-WP04 fix but does not correct the root sentence's group assignment)"
      - artifact: "tracer-approach.md § round-2 addendum ('Second addendum ... TASKS-FRESH1-001') — correctly describes the current three-way parallel_group:1 state, but as an ADDITION after the stale sentence, not a correction of it"
      - artifact: "kitty-specs/expected-artifacts-manifest-repair-01KZY498/lanes.json (ground truth: lane-b/WP02, lane-c/WP03, lane-d/WP04 all parallel_group: 1; lane-a/WP01 alone at parallel_group: 0)"
    claim: >
      Two successive fix rounds each appended a corrective addendum after the
      original DAG-description sentence in tracer-approach.md without ever
      fixing the sentence itself. The document now contains three
      layers — an original claim that is flatly wrong against current
      lanes.json (round-1 fix moved WP04 out of parallel_group 0 into 1), a
      round-1 addendum, and a round-2 addendum — instead of one coherent,
      corrected account. A reader who stops at the first (root) sentence gets
      the wrong picture; only a reader who continues through both addenda
      gets the truth. This is exactly the "double-narrative" failure mode
      (old text + addendum disagreeing) the mission's own review process
      exists to catch, reproduced inside the review process's own audit trail.
    remediation: >
      Correct the root DAG-description sentence in tracer-approach.md directly
      to state the current, accurate group assignment (parallel_group 0 =
      {WP01}; parallel_group 1 = {WP02, WP03, WP04}), then either fold the two
      addenda's substantive content (the sequencing recommendation) into the
      corrected root text or leave them as historical addenda that no longer
      need to "correct" a now-accurate root sentence — but the root sentence
      itself must stop being false.

  - id: TASKS-FRESH2-002
    severity: 3
    source: round-2 R5b fresh sweep
    title: "WP01's own Chokepoint note and Risks section still describe a two-way WP02-vs-WP03 collision, not updated to the three-way WP02/WP03/WP04 framing round 2 applied everywhere else"
    evidence:
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Chokepoint note (~line 151): names WP04 as a fellow appender to test_manifest.py"
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Chokepoint note (~lines 154-159): confines the 'real git-merge risk' language and the tracer-approach.md pointer to 'WP02/WP03' only"
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Risks section (~lines 421-423): repeats the same WP02/WP03-only framing"
      - artifact: "tasks/WP02-reconcile-manifests.md, tasks/WP03-plan-manifest-and-guard-gap-issue.md, tasks/WP04-deprecate-override-mirrors.md (all three correctly updated in round 2 to name all three sibling WPs sharing the file)"
    claim: >
      Round 2's fix correctly swept WP02's, WP03's, and WP04's own
      Chokepoint/Risks sections to name the current three-way exposure
      (WP02/WP03/WP04 all in parallel_group 1, all touching
      tests/dossier/test_manifest.py). WP01's own prompt file was left
      untouched by round 2 (only its Reviewer Guidance section was edited,
      for an unrelated finding) — its Chokepoint note still says the risk
      "materializes for WP02/WP03 landing after it" and its Risks section
      still points only at "WP02/WP03" in the tracer-approach.md pointer,
      omitting WP04 from the group even though WP01's own Context section
      (a few lines earlier) explicitly names WP04 as one of the three WPs
      appending to this file. WP01 is the file's original/sole owner and
      itself sits in parallel_group 0 (not part of the three-way group), so
      its description doesn't need the exact same fix as WP02/WP03/WP04 — but
      it should not describe a two-way risk when the actual risk among its
      three dependents is three-way.
    remediation: >
      Update WP01's Chokepoint note and Risks section to name all three
      sibling WPs (WP02, WP03, WP04) as the group sharing
      tests/dossier/test_manifest.py after WP01's own first-touch commit,
      matching the three-way framing already applied to WP02/WP03/WP04's own
      files in round 2, rather than leaving a two-way WP02/WP03-only
      description that undercounts the actual current exposure.
