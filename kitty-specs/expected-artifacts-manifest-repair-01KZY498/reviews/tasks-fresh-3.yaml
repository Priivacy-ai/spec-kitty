findings:
  - id: TASKS-FRESH3-001
    lens: fresh-sweep
    severity: 3
    title: WP02/WP03/WP04 still point readers at a "round-2 addendum" that round 3 folded away
    evidence:
      - artifact: "tasks/WP02-reconcile-manifests.md § Out-of-map edit: tests/dossier/test_manifest.py"
        code: "tasks/WP02-reconcile-manifests.md:110-113 — \"See `tracer-approach.md`'s \\\"Chokepoints & execution sequencing\\\" addendum (including its round-2 addendum) for the recommended execution order to avoid a git merge collision on this shared file.\""
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Out-of-map edit: tests/dossier/test_manifest.py"
        code: "tasks/WP03-plan-manifest-and-guard-gap-issue.md:91-93 — \"See `tracer-approach.md`'s \\\"Chokepoints & execution sequencing\\\" addendum (including its round-2 addendum) for the recommended sequencing.\""
      - artifact: "tasks/WP04-deprecate-override-mirrors.md § Out-of-map edit: tests/dossier/test_manifest.py, and § Risks"
        code: "tasks/WP04-deprecate-override-mirrors.md:112-114 and :199-201 — both say \"...`tracer-approach.md`'s \\\"Chokepoints & execution sequencing\\\" addendum, including its round-2 addendum, for the full picture...\""
      - artifact: "tracer-approach.md § Chokepoints & execution sequencing"
        code: "tracer-approach.md:114-131 — round 3's new \"Revision history\" paragraph explicitly folds the former \"Addendum (...TASKS-SEQ-001)\" and \"Second addendum (...round 2, TASKS-FRESH1-001)\" subsections into the single corrected DAG description in the paragraphs above it, framing the old addenda text as \"kept for audit trail, not because the text above still needs correcting\" — there is no longer a separately-labeled \"round-2 addendum\" subsection to point a reader at."
    claim: >
      Before round 3, tracer-approach.md's Chokepoints section had two distinct,
      separately-bolded subsections — "Addendum (...TASKS-SEQ-001)" (round 1) and
      "Second addendum (...round 2, TASKS-FRESH1-001)" — so WP02/WP03/WP04's
      cross-reference "the Chokepoints addendum (including its round-2 addendum)"
      accurately pointed at two things to read. Round 3 restructured the section:
      it rewrote the main DAG-description/recommendation paragraphs to already
      state the three-way WP02/WP03/WP04 framing directly (no longer needing the
      round-2 addendum's content bolted on separately), and moved the old
      addenda text into a new "Revision history" footnote explicitly marked as
      historical audit trail, not live guidance. The four occurrences of
      "including its round-2 addendum" in WP02/WP03/WP04 (WP04 has it twice) were
      not touched by round 3 (whose commit b836f372c only touched
      tracer-approach.md and WP01 per its own commit message) and now describe a
      substructure that no longer exists in that form — a reviewer or
      orchestrator following the phrase literally would look for a separate
      "round-2 addendum" subsection and find only a "Revision history" footnote
      that says its content is not the live account.
    remediation: >
      In tasks/WP02-reconcile-manifests.md, tasks/WP03-plan-manifest-and-guard-gap-issue.md,
      and tasks/WP04-deprecate-override-mirrors.md (both occurrences), drop the
      "(including its round-2 addendum)" / ", including its round-2 addendum," parenthetical
      and simply point at "tracer-approach.md's 'Chokepoints & execution sequencing'
      addendum" as a single, now-unified section — the main paragraphs there already
      state the three-way WP02/WP03/WP04 sequencing recommendation directly, so no
      qualifier about a separate round-2 addendum is needed anymore.
