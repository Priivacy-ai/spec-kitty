findings:
  - id: TASKS-FRESH4-001
    lens: fresh-sweep
    severity: 3
    title: "AS4 of US2 (plan manifest's guard-gap header comment) is claimed as test-covered but has no automated assertion anywhere in the tasks corpus"
    evidence:
      - artifact: "spec.md:310-319 — Acceptance Scenario 4 of User Story 2: \"Given the new manifest, When its header comment is read, Then it states explicitly that ... plan mission type's step ids are not enforced by a dedicated plan-family guard branch: goals/research/structure/draft/done fall to _evaluate_software_dev_guards's bare return [], and review ... lexically collides with software-dev's own review step id...\" — a concrete, testable content claim."
      - artifact: "plan.md:408 — Test Strategy Per Acceptance Criterion table, row \"AS1–AS4 (US2, `plan` manifest, FR-010)\": names a single test, `test_plan_manifest_loads_and_matches_state_machine`, and lists its \"Asserts\" column content — load succeeds, `mission_type`/`manifest_version`, `get_step_ids()` order, and per-step artifact requirements. Nothing in that Asserts column mentions the header comment's text at all, yet the row's ID column bundles AS4 in with AS1-AS3 as if all four are covered by this one test."
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md:95 — Subtask T015 is titled \"Red-first test — `plan` manifest loads and matches the state machine (FR-010, AS1-AS4 of US2)\", explicitly claiming AS4 coverage in the subtask that authors the red-first test."
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md:100-121 — T015's actual steps (1-2, sub-bullets on `load_manifest`, `mission_type`, `manifest_version`, `get_step_ids()`, and per-step `get_required_artifacts` checks) contain zero assertions on the header comment's text."
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md:158-170 — the header comment is only ever written in T016 (the implementation subtask, not a red-first test), and T016's own Validation section (line 179-184) checks only T015's (non-header) assertions going GREEN."
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md:280-282 — Reviewer Guidance: \"Read the AS4 header comment side-by-side with `tracer-design-decisions.md` Decision 1 — confirm it states the hardcoded-`mission_family` mechanism and the `review`-step collision precisely\" — this is the *only* verification mechanism for AS4, and it is manual, one-time, at review time — not a regression-guarded pytest assertion."
      - artifact: "Contrast: tasks/WP04-deprecate-override-mirrors.md T018 (`test_override_mirror_files_carry_deprecation_header`) builds an automated content-substring test for the structurally analogous FR-014 deprecation header, explicitly justified (WP04 line ~117-120) as \"so a future 'drift hygiene' refresh ... fails this test, not just manual review\" — the same rationale applies to WP03's AS4 header but was not applied there."
      - artifact: "tasks/WP05-audit-and-parity-check.md — grep for 'header'/'AS4' returns no matches; WP05's cross-cutting `test_manifest_guard_parity.py` covers AS7/SC-006/FR-013 rationale-comment presence across all four manifests, but never checks the `plan` manifest's AS4 guard-gap header content."
    claim: >
      spec.md's AS4 (US2) is a concrete, automatable content claim about the new
      `plan/expected-artifacts.yaml`'s header comment (it must name the hardcoded
      `mission_family="software-dev"` mechanism and the `review`-step lexical
      collision). plan.md's Test Strategy table mislabels its "AS1–AS4" row as if a
      single test (`test_plan_manifest_loads_and_matches_state_machine`) covers all
      four scenarios, but that test's actual assertions (and WP03's T015, which
      authors it) only ever cover AS1-AS3 (parse/version/step-ids/per-step
      artifacts) — never the header comment text. The header comment is written in
      T016 (implementation, not a red-first test) and its only verification is a
      one-time manual reviewer read (WP03 Reviewer Guidance), with no pytest
      regression guard anywhere in the mission — unlike the directly parallel
      FR-014/WP04 deprecation-header case, which does get an automated
      content-substring test built specifically to prevent silent future drift.
      A future edit that genericizes or strips the AS4 header wording (the same
      "drift hygiene" risk WP04's own test guards against for its sibling files)
      would pass every test in this mission's suite undetected.
    remediation: >
      Either (a) add a dedicated assertion to WP03's T015/`test_plan_manifest_loads_and_matches_state_machine`
      (or a new, separately-named test in the same `TestPlanManifest` class) that
      reads the raw file text of `packs/built-in/missions/plan/expected-artifacts.yaml`
      and asserts the header comment contains the specific mechanism markers (e.g.
      substrings identifying `mission_family="software-dev"`/`_check_cli_guards`
      and the `review`-step collision) — mirroring WP04's
      `test_override_mirror_files_carry_deprecation_header` pattern — and update
      T015's Validation section and plan.md's Test Strategy table row to reflect
      the added assertion; or (b) if automated coverage is deliberately not wanted
      for this scenario, split the "AS1–AS4" row in plan.md's Test Strategy table
      into an automated "AS1-AS3" row and a separate "AS4 (manual/reviewer-verified)"
      row — matching the honest "N/A (tracker verification, not a pytest test)"
      treatment already used for AS5 of the same user story two rows below it —
      so the table stops overclaiming automated coverage it does not have.
