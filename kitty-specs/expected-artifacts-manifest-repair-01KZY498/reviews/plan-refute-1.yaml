verdicts:
  - id: PLAN-GOV-001
    verdict: confirmed
    reason: >
      Verified directly. tracer-approach.md § "A discovery that reframed part of the blast
      radius" (lines 46-56) literally reads: "fix the one consumed copy for correctness;
      refresh the dead mirror copy for drift hygiene only, since it currently misleads more
      than it helps," and its "Default: one PR per mission" section (line 41) lists a
      ".kittify/overrides/ drift-hygiene refresh" as part of the single PR. tracer-design-
      decisions.md's Decision 4 (lines 222-256) explicitly names and rejects exactly this as
      "Option B — refresh content to keep 'in sync'... Rejected per DIRECTIVE_044: this is the
      anti-pattern by name," replacing it with header-comment-only deprecation ("mark
      deprecated/inert, do not refresh content"). plan.md's IC-04 (lines 582-596) correctly
      matches Decision 4 ("header comment only... content otherwise untouched, explicitly NOT
      refreshed to parity per Decision 4"), and plan.md's "Confirmed: Tracer Files Already
      Seeded" section (lines 673-680) asserts the tracer files "carry substantive content"
      without flagging that tracer-approach.md's own prose on this specific point still
      contradicts Decision 4. The three-way inconsistency is real and unremediated in the
      files as they stand: a reader of tracer-approach.md alone would be pointed at the
      rejected Option B.
  - id: PLAN-ARCH-001
    verdict: confirmed
    reason: >
      Verified directly against plan.md. IC-01's "Affected surfaces" (lines 541-543) lists
      only manifest.py/namespace.py; IC-02's (558-560) lists only the three content YAMLs;
      IC-03's (573-574) lists only the new plan YAML + a GitHub issue — none lists
      tests/dossier/test_manifest.py, even though the Test Strategy table (lines 379-400)
      assigns per-FR tests for exactly these ICs' FRs (AS1-AS7 for FR-001-FR-008, AS1-AS4 for
      FR-010, AS1-AS2/AS3 for FR-009) all to tests/dossier/test_manifest.py or tests/sync/. IC-
      05's "Affected surfaces" (604-611) is the only one that lists test_manifest.py, and its
      Sequencing/depends-on line (612-618) does make IC-05 depend on IC-01, IC-02, AND IC-03
      landing first, as claimed. The charter's C-011 quote and the ownership-map-leeway
      tactic's "hard constraint is no-overlap between work packages" quote (references.yaml
      line ~990-997) are both verified verbatim. plan.md does contain a rationalization
      sentence (614-618) asserting "the red-first test for that WP's own FR still lands before
      that WP's own implementation commit" — so it is not silent on the ATDD question — but as
      the finding itself notes, this sentence is not reflected back into IC-01/02/03's
      "Affected surfaces" bullets, and no guidance is given anywhere in the plan for how up to
      three/four WPs editing the same shared tests/dossier/test_manifest.py avoid collision,
      which is the genuine, verifiable gap against the cited ownership-map-leeway "hard
      constraint." The claim's mechanics check out even though the plan partially addresses
      (in prose) the C-011-violation half of the two readings.
  - id: PLAN-ARCH-002
    verdict: confirmed
    reason: >
      Verified directly. `.kittify/overrides/missions/plan/` exists on this checkout today
      (ls shows mission.yaml, mission-runtime.yaml, README.md, templates/, command-templates/)
      and `git log --reverse` on that path shows its earliest commit is 2db24b362, dated
      2026-04-17 — months before this mission. plan.md lines 134-136 state verbatim "no such
      directory exists today," which is factually false; only expected-artifacts.yaml is
      absent from it (verified via `ls | grep -i expected` returning nothing). spec.md
      (~line 211 and FR-010's row ~line 431) makes the identical false claim, confirming the
      error was copied forward rather than independently re-verified as plan.md's opening
      paragraph claims. The underlying recommendation (don't create an override file) is
      unaffected, but the stated justification is wrong as described.
  - id: PLAN-VERIFY-001
    verdict: confirmed
    reason: >
      Verified directly against .github/workflows/ci-quality.yml. The `sonarcloud` job
      (line 3568) carries `if: always() && (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')` (line 3625), and its own header comment
      (lines 3562-3566) states verbatim "Temporarily limited to schedule/manual runs while
      #825 tracks the existing project-wide Sonar quality gate backlog. PRs skip Sonar
      entirely to keep review latency low, and pushes skip it so main can report test/build
      health." This job never runs on `pull_request` events. plan.md line 473 nonetheless
      states "SonarCloud Quality Gate — always-on aggregator; applies," and shapes its test-
      authoring rationale (lines 473-477) around satisfying a gate that will not evaluate this
      mission's PR. The claim is accurate as described.
  - id: PLAN-VERIFY-002
    verdict: confirmed
    reason: >
      Verified directly against .github/workflows/ci-quality.yml. The `mutation-testing` job
      (line 3535) carries `if: false` (line 3557) with its sole step being `run: echo
      "Mutation testing is disabled."` (line 3559), preceded by a section comment "mutation-
      testing: disabled — too slow to run reliably in CI" (line 3533). This job never executes
      on any event. plan.md line 506 states "`mutation-testing`, `diff-coverage`... both run,"
      grouping a permanently-disabled no-op job with a genuinely always-on one. diff-coverage's
      always-on-for-pull_request status was not independently disputed and is not the subject
      of this finding. The claim that plan.md misrepresents mutation-testing as running is
      accurate as described.
