findings:
  - id: TASKS-VERIFY-001
    lens: red-first-per-wp / definition-of-done accuracy
    severity: 3
    title: "WP01's own DoD claims all 7 new tests are GREEN, but T002.4's test_all_shipped_manifests_load_after_hardening cannot pass until WP03 (a WP that depends on WP01) lands"
    evidence:
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T002, step 4"
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T005, Validation"
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Definition of Done, item 6 (\"All 7 new/updated tests in this WP are GREEN.\")"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md (dependencies: [WP01]) — plan/expected-artifacts.yaml does not exist until this WP lands"
    claim: >
      T002.4 instructs writing test_all_shipped_manifests_load_after_hardening to load all
      FOUR shipped manifests (research, documentation, software-dev, plan) and assert each
      returns non-None. T005's own Validation note admits "this partial check is expected to
      still show plan as None until WP03 lands" — i.e. the WP's own author knows this
      assertion will be RED at the point WP01's implementation commit lands, since WP03 (the
      WP that creates plan/expected-artifacts.yaml) declares WP01 as a dependency and cannot
      even be claimed until WP01 reaches approved/done status (per the status-model's
      dependency-gating rule in CLAUDE.md: "WPs with dependencies frontmatter cannot be
      claimed/implemented until every dependency is approved or done"). Yet WP01's own
      Definition of Done unconditionally states "All 7 new/updated tests in this WP are
      GREEN" with no caveat. This is a genuine self-contradiction: either WP01 cannot
      honestly close out with this DoD item checked, or a reviewer applying the DoD literally
      will reject a WP01 that is otherwise complete and correct. It also creates a real risk
      that an implementer papers over the gap with an undocumented workaround (e.g.
      conditionally skipping the plan assertion) — exactly the kind of silent-success-adjacent
      shortcut this mission exists to eliminate.
    remediation: >
      Split test_all_shipped_manifests_load_after_hardening's four assertions so WP01 only
      asserts the three manifests it can actually make pass (research/documentation/
      software-dev), with an explicit code comment noting the plan assertion is added by
      WP03 in the same test (or a WP03-owned follow-on assertion/test). Update WP01's
      Definition of Done to read "6 of 7 new tests are fully GREEN; the 4th
      (test_all_shipped_manifests_load_after_hardening) is GREEN for its 3
      currently-shippable assertions and documented as pending the `plan` assertion until
      WP03 lands" rather than an unqualified "All 7 ... GREEN" — or, alternatively, move the
      four-manifest assertion into WP03's own red-first test (T015) since WP03 is the WP that
      actually completes the four-manifest set.

  - id: TASKS-VERIFY-002
    lens: silent-success / WP01 T006-T007 loud-failure implementation
    severity: 2
    title: "WP01 T006's instruction to 'narrow the except to pydantic.ValidationError' while also 'letting it propagate (no except swallows it)' is self-contradictory as literally written"
    evidence:
      - artifact: "tasks/WP01-schema-hardening-and-loud-failure.md § Subtask T006, step 1"
      - code: "src/specify_cli/dossier/manifest.py:207-215"
    claim: >
      T006 step 1 reads: "Narrow the `except Exception as e` to `except pydantic.ValidationError`.
      Let the `ValidationError` propagate to the caller (no `except` swallows it)." Taken
      literally, these two sentences conflict: catching an exception type (`except
      pydantic.ValidationError:`) does not, by itself, let it propagate — propagation requires
      either not catching it at all, or catching and explicitly re-raising. An implementer who
      writes `except pydantic.ValidationError as e: logger.error(...); return None` (i.e.
      simply narrows the *type* matched, keeping the old swallow-and-return-None body) would
      satisfy the literal first sentence but violate the second, and would silently reintroduce
      the exact silent-success bug FR-016/this mission exists to close — precisely the behavior
      this review's charter mandate asks to check specifically for T006/T007. plan.md's own
      prose (line ~27: "let `pydantic.ValidationError` propagate to the caller instead of the
      bare `except Exception`") is clearer than the WP's own step text. The risk is partially
      mitigated because T002's own red-first test (`test_load_manifest_raises_on_malformed_yaml`)
      would still be RED if this misreading were implemented, giving a self-correcting signal —
      hence moderate rather than high severity.
    remediation: >
      Reword T006 step 1 to state unambiguously: "Remove the `except Exception` clause's
      handling of `ValidationError` entirely — do not add any `except pydantic.ValidationError`
      block around the `model_validate` call. The only remaining exception-adjacent code in this
      try/except should be the case(s), if any, that still need a bare `except Exception` for a
      genuinely different purpose (none is expected here per Decision 3)." State explicitly that
      the intended code shape has NO catch of `ValidationError` in `load_manifest()`, matching
      plan.md's own clearer phrasing, rather than instructing an "except ... narrow" edit that
      needs an implicit, unstated re-raise to behave correctly.

  - id: TASKS-VERIFY-003
    lens: file-references-real / guard-parity content risk (WP02 FR-007)
    severity: 4
    title: "WP02 T012/T014 default to the wrong glob pattern (tasks/*.md) for the tasks_packages/tasks_finalize manifest entries, contradicting both FR-007's own text and the actual guard code (WP*.md)"
    evidence:
      - artifact: "tasks/WP02-reconcile-manifests.md § Subtask T012, step 1 (\"a tasks/WP*.md-style glob ... reuse the existing tasks/*.md-style pattern already used elsewhere in this schema\")"
      - artifact: "tasks/WP02-reconcile-manifests.md § Subtask T014, step 3 (\"path_pattern: \\\"tasks/*.md\\\" (or the glob confirmed in T012)\")"
      - artifact: "spec.md FR-007 (\"tasks_packages and tasks_finalize each require a tasks/WP*.md glob entry blocking\")"
      - code: "src/runtime/next/runtime_bridge_io.py:794 (wp_files = sorted(tasks_dir.glob(\"WP*.md\")) if tasks_dir_is_dir else [])"
      - code: "packs/built-in/missions/software-dev/expected-artifacts.yaml:10 (header comment: \"Path patterns support glob syntax (e.g., tasks/*.md matches all .md files in tasks/)\" — a generic illustrative comment, not an actual field value anywhere in the file)"
    claim: >
      The guard the manifest must match (`_evaluate_tasks_packages_guard` /
      `_evaluate_tasks_finalize_guard`, via `_tasks_dir_ready()`) checks
      `tasks_dir.glob("WP*.md")` specifically — files literally prefixed `WP`, not every
      Markdown file under `tasks/`. spec.md's own FR-007 text and AS5 already state the correct
      target precisely: "a `tasks/WP*.md` glob entry." Despite this, WP02's T012 leads with "reuse
      the existing `tasks/*.md`-style pattern already used elsewhere in this schema" (the only
      place this string appears is a generic illustrative comment in the software-dev manifest's
      header, not an actual used `path_pattern` value) and only hedges toward checking the guard
      as an afterthought; T014's step 3 then defaults its own written instruction to
      `path_pattern: "tasks/*.md"` outright, with "(or the glob confirmed in T012)" as a
      parenthetical escape hatch rather than stating the correct value directly. An implementer
      who follows T014's literal default produces a manifest entry that is *broader* than what the
      guard actually checks (`tasks/*.md` would match e.g. `tasks/README.md` or a
      non-WP-prefixed file, which the guard ignores) — reproducing, inside this very mission's own
      guard-reconciliation fix, the exact class of manifest/guard divergence bug #3388 exists to
      eliminate. This directly undermines SC-001's acceptance bar ("every `required_by_step` key
      ... matches a real branch ... verified by direct cross-read") for these two specific entries.
    remediation: >
      Correct T012 and T014 to state the glob pattern directly and unambiguously as
      `tasks/WP*.md` (matching spec.md's FR-007/AS5 text and the guard's actual
      `tasks_dir.glob("WP*.md")` call at `runtime_bridge_io.py:794`), removing the
      "reuse the existing tasks/*.md-style pattern" framing entirely so there is no
      wrong-by-default reading. WP05's T020 guard-parity test
      (`test_all_required_by_step_keys_match_guard_or_carry_comment`) should also assert on the
      glob's literal string value for these two entries, not merely on step-key presence, so a
      future regression to the broader pattern is caught structurally.

