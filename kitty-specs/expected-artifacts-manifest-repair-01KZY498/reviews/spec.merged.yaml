schema: review-findings/v1
complete: true
phase: spec
mission: expected-artifacts-manifest-repair-01KZY498
findings:
  - id: SPEC-GOV-001
    lens: Decision fidelity
    severity: 3
    title: "C-002 (and, more weakly, FR-013) carry the manifest_version non-bump rule with no restated rationale, so a reader who skips Clarifications loses the naive-instinct-defeater"
    evidence:
      - artifact: "spec.md § Clarifications, Decision 2 (lines ~41-59)"
      - artifact: "spec.md § Constraints, C-002 (line ~365)"
      - artifact: "spec.md § Functional Requirements, FR-013 (line ~348)"
      - artifact: "spec.md § Non-Gate Consumer Notes (lines ~444-455)"
      - code: "src/specify_cli/sync/namespace.py:90-101 (resolve_manifest_version), :35,63 (NamespaceRef 5-field identity tuple)"
    claim: >
      Decision 2's rationale for NOT bumping manifest_version is substantial and
      counter-instinctive, but C-002's row text is a bare rule with zero pointer back to
      Decision 2 or any inline rationale — it does not even say "per Decision 2" the way
      FR-010/FR-011 say "per Decision 1". FR-013 names "Decision 2" by number but still does
      not restate the substance of the defeater. A reviewer who scans only the
      Requirements/Constraints tables sees a rule with no defeater attached.
    remediation: >
      Add a one-clause parenthetical rationale to both C-002 and FR-013 restating the
      defeater inline. At minimum, C-002 should carry the same "per Decision 2" back-reference
      FR-013 already has.

  - id: SPEC-GOV-002
    lens: Directive (verify-against-live-code)
    severity: 2
    title: "US2/AS3 misstates plan/mission.yaml's structure→draft transition as gated by gate_passed(...), but it carries no condition at all"
    evidence:
      - artifact: "spec.md § User Story 2, Acceptance Scenario 3 (lines ~263-269)"
      - code: "packs/built-in/missions/plan/mission.yaml:40-42 (structure→draft — no `conditions:` key)"
      - code: "packs/built-in/missions/plan/mission.yaml:52 (review→done — gate_passed(\"plan_approved\"), correctly described)"
    claim: >
      AS3 reads as attributing a gate_passed(...) condition to BOTH structure→draft and
      review→done. Direct read confirms review→done gates on gate_passed("plan_approved"),
      but structure→draft has no conditions block at all — unconditional, not gated. The
      practical manifest conclusion still holds, but the code claim is inaccurate as written.
    remediation: >
      Rephrase AS3 to separate the two transitions' actual mechanisms: structure→draft is
      unconditional; review→done gates on gate_passed("plan_approved").

  - id: SPEC-GOV-003
    lens: Decision fidelity
    severity: 1
    title: "Decision 1's evidence enumerates _evaluate_software_dev_guards's vocabulary as 7 step ids, omitting the 8th (composed \"tasks\")"
    evidence:
      - artifact: "spec.md § Clarifications, Decision 1 Q text (lines ~18-24)"
      - code: "src/runtime/next/runtime_bridge_cores.py:554-566 (recognizes specify/plan/tasks_outline/tasks_packages/tasks_finalize/tasks(composed)/implement/review — 8 ids, not 7)"
    claim: >
      Decision 1's rationale lists 7 step ids, omitting the composed "tasks" id. Does not
      change the conclusion (composed "tasks" also doesn't match any plan-type state name),
      but the enumeration presented as verified/exhaustive is incomplete.
    remediation: >
      Add "tasks (composed)" to the enumerated vocabulary list in Decision 1's Q text.

  - id: SPEC-ARCH-001
    lens: Close Defect Classes by Construction (DIRECTIVE_043) / Contracts
    severity: 4
    title: "FR-009's ValidationError is silently swallowed by ManifestRegistry.load_manifest(), so the schema-hardening fix never surfaces on the only production loading path"
    evidence:
      - artifact: "spec.md § User Story 3 motivation (lines 284-287) and Acceptance Scenarios AS1/AS2 (lines 298-305)"
      - artifact: "spec.md § Key Entities, ManifestRegistry entry (lines 378-380): \"Unmodified by this mission — it is a pure reader\""
      - code: "src/specify_cli/dossier/manifest.py:207-215 (load_manifest wraps model_validate in bare `except Exception as e: logger.error(...); return None`)"
    claim: >
      User Story 3's motivation is that a typo'd manifest key should raise a validation error
      immediately. FR-009's extra="forbid" does make direct Pydantic construction raise, but
      the sole production loading path (load_manifest()) catches ANY exception including
      ValidationError and returns None — identical to "manifest not found", merely logged at
      ERROR level. Every real reader (dossier indexer, resolve_manifest_version(),
      _resolve_expected_artifacts_slot() via get_expected_artifacts()) goes through this
      method, not direct model construction. No acceptance scenario exercises load_manifest()
      with a typo'd real YAML file, so the claimed author-time-visibility benefit is not
      delivered end-to-end while ManifestRegistry is declared out of scope for changes.
    remediation: >
      Either (a) add an FR/AC changing load_manifest()'s exception handling to distinguish
      ValidationError from genuine missing-file/parse-absence (re-raise or surface at a level
      the CLI operator sees, while still returning None for absence); or (b) rewrite User
      Story 3's motivation/acceptance bar to state plainly the loud-failure guarantee is
      scoped to direct model construction (authoring/test tooling), not the load_manifest()
      path every real consumer uses.

  - id: SPEC-VERIFY-001
    lens: divergence-fix fidelity
    severity: 4
    merged_with: SPEC-ARCH-002
    title: "Decision 1 / FR-010 / FR-011 (and US2-AS4) misstate current guard behavior for plan-type 'review' — it does not fall to a bare return []"
    evidence:
      - artifact: "spec.md § Clarifications > Session 2026-08-13 > Q1 (Decision 1 rationale: \"a plan-type step id returns [] unconditionally today\")"
      - artifact: "spec.md § User Story 2, Acceptance Scenario 4 (\"goals/research/structure/draft/review all fall to the bare return []\")"
      - artifact: "spec.md § FR-011 (\"naming the missing plan-family branch ... as an independent defect\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:554-566 (_evaluate_software_dev_guards: `if step_id in (\"implement\", \"review\"): return _evaluate_wp_iteration_guard(step_id, snapshot)`, bare `return []` only for ids matching none of the branches above it, including line 564)"
      - code: "packs/built-in/missions/plan/mission.yaml (states list includes `name: review`)"
      - code: "src/runtime/next/runtime_bridge.py:680-698 (_check_cli_guards hardcodes mission_family=\"software-dev\" regardless of the mission's actual type)"
      - code: "src/runtime/next/runtime_bridge.py:1541-1544,1557-1566 (_dn_composition_dispatch, the mission-family-aware path, is gated to mission == \"software-dev\" only — plan-type missions never reach it)"
    claim: >
      plan/mission.yaml's state list literally includes a state named "review", and
      _evaluate_software_dev_guards has an explicit branch `if step_id in ("implement",
      "review")` that fires for that exact string, never reaching the bare `return []`. Only
      goals/research/structure/draft fall to the bare return []; review does not. Traced the
      live call path: for ANY mission type (plan included), _check_cli_guards hardcodes
      mission_family="software-dev" and passes the real state name as step_id; the
      mission-family-aware composed-action path is unreachable for plan missions because it
      gates on mission == "software-dev". So a plan mission at its "review" state invokes
      _evaluate_wp_iteration_guard("review", snapshot) — today coincidentally still yields []
      (wp_advance_ready defaults True with no tasks/ dir), but this is a real, reachable,
      mission-blind branch, not the bare fallback the spec describes. If a plan mission's
      directory ever contained a tasks/WP*.md set, "review" would be spuriously blocked with
      a nonsensical software-dev message. FR-010's header-comment acceptance criterion
      (Scenario 4) requires the new manifest to assert something about the code that is not
      true, and FR-011's planned upstream issue — based on this same false premise — would
      describe the wrong defect (total vocabulary non-match) instead of the real one
      (accidental mission-blind vocabulary collision via hardcoded mission_family).
    claim_arch_002_addendum: >
      (from SPEC-ARCH-002, same finding) The header comment FR-010 mandates would bake the
      false "all fall to []" claim into a shipped file — the same "unreliable, not reconciled
      against observed code" defect class this mission exists to close, reproduced inside its
      own remedy's documentation.
    remediation: >
      Correct Decision 1's rationale and FR-010's Acceptance Scenario 4 (the header-comment
      requirement) to state the mechanism precisely: plan-type missions are routed through
      _check_cli_guards, which hardcodes mission_family="software-dev", so any plan-type step
      id that happens to lexically match software-dev's own vocabulary (currently only
      "review") is evaluated by _evaluate_wp_iteration_guard rather than falling through to
      the bare return [] — it returns [] today only because wp_advance_ready defaults True for
      a plan mission with no tasks/ directory, not because no branch matches. Rewrite FR-011's
      issue description to name this real defect (mis-attributed mission_family plus an
      accidental "review" vocabulary collision with latent spurious-block risk), not "no
      branch recognizes plan step ids."

  - id: SPEC-ARCH-003
    lens: "Mission-derived: Non-gate consumer accuracy"
    severity: 4
    title: "Non-Gate Consumer Notes names the wrong class/property (MissionTypeProfile.expected_artifacts does not exist) and its 'no consumer beyond its own docstring' claim is contradicted by a real, repo-present test consumer"
    evidence:
      - artifact: "spec.md § Overview \"Motivation\" (lines 70-71)"
      - artifact: "spec.md § Overview \"Corrected risk framing\", item 3 (lines 124-126)"
      - artifact: "spec.md § Non-Gate Consumer Notes (lines 461-464): repeats the same claim a third time"
      - code: "src/charter/mission_type_profiles.py:405-408 (the actual property: ResolvedMissionType.expected_artifacts, a @cached_property; MissionTypeProfile — a separate pydantic.BaseModel — has no such attribute)"
      - code: "tests/charter/test_resolved_mission_type_context.py:160-162 (asserts on bundle.expected_artifacts's presence, type, and mission_type key for software-dev)"
    claim: >
      Two independent errors in the same repeated claim. First, the entity is misnamed
      throughout: the .expected_artifacts property lives on ResolvedMissionType, not
      MissionTypeProfile. Second, "no consumer... found beyond its own docstring" is false: a
      real contract test directly asserts on bundle.expected_artifacts for software-dev — the
      exact mission type whose manifest content this mission materially changes
      (FR-006/FR-007/FR-008).
    remediation: >
      Rename the entity to ResolvedMissionType.expected_artifacts everywhere it appears.
      Replace "no consumer... found beyond its own docstring" with an accurate statement
      acknowledging tests/charter/test_resolved_mission_type_context.py as a real consumer,
      and confirm the reconciled software-dev manifest content still satisfies that test's
      three assertions.

  - id: SPEC-ARCH-004
    lens: "Mission-derived: Non-gate consumer accuracy (test-surface gap)"
    severity: 3
    title: "NFR-003/SC-002/FR-015's declared validation surface omits tests/charter/, the only directory containing a real consumer of the manifest content this mission changes"
    evidence:
      - artifact: "spec.md NFR-003 (line 358)"
      - artifact: "spec.md FR-015 (line 350) — no tests/charter/ path listed"
      - artifact: "spec.md SC-002 (line 395)"
      - code: "tests/charter/test_resolved_mission_type_context.py:160-162 (see SPEC-ARCH-003) — asserts on manifest-sourced content for software-dev, one of the three types this mission reconciles"
    claim: >
      Once SPEC-ARCH-003's real consumer is accounted for, the mission's own declared
      validation surface does not include tests/charter/ at all, even though FR-002–FR-008
      materially change required_by_step shapes for documentation and software-dev — the
      exact type the test asserts against. SC-002's "zero new failures relative to baseline"
      claim cannot be honestly made if a real, content-sensitive consumer outside the declared
      test surface is never run.
    remediation: >
      Add tests/charter/test_resolved_mission_type_context.py (or the relevant subset of
      tests/charter/) to NFR-003's validation surface and FR-015's audit list, and confirm it
      still passes after the FR-002–FR-008 content reconciliation lands.

  - id: SPEC-ARCH-005
    lens: Canonical source (DIRECTIVE_044)
    severity: 3
    title: "FR-014's 'refresh the dead override copies to keep them in sync' is parity-with-a-dead-quirk, in tension with the charter's canonical-source-unification principle"
    evidence:
      - artifact: "spec.md FR-014 (line 349)"
      - artifact: "spec.md § \"A second-order finding\" (lines 136-180), confirming .kittify/overrides/missions/*/expected-artifacts.yaml is dead code for this file type"
      - artifact: "spec.md C-004 (line 367): no new override-resolution wiring in this mission"
      - artifact: ".kittify/charter/charter.md § Governing Principles (lines 27-31): \"Single canonical authority... chase unification, not parity with a dead quirk.\" (DIRECTIVE_044)"
    claim: >
      The spec correctly identifies the override copies are consumed by zero readers, then
      FR-014 proposes refreshing that dead content "as drift hygiene" — the literal shape of
      "parity with a dead quirk" DIRECTIVE_044 names as the anti-pattern to avoid. Not a
      logical contradiction of C-004, but the spec neither surfaces this tension nor weighs
      the charter-pointed alternative (delete/mark deprecated) before presenting FR-014 as
      uncontroversial hygiene.
    remediation: >
      Either (a) change FR-014 to delete or explicitly mark the dead override copies as
      deprecated/inert, pointing to the follow-up issue for wiring the override tier; or (b) if
      "keep in sync" is still chosen, add a paragraph acknowledging this is a deliberate,
      charter-principle-aware exception and state why "keep in sync" was preferred over
      deletion or immediate resolver wiring.

  - id: SPEC-ARCH-006
    lens: "Mission-derived: Non-gate consumer accuracy"
    severity: 2
    title: "The plan-manifest_version explanation for resolve_manifest_version() conflates load_manifest()'s None return with resolve_manifest_version()'s always-a-string contract"
    evidence:
      - artifact: "spec.md § Non-Gate Consumer Notes (lines 452-455)"
      - code: "src/specify_cli/sync/namespace.py:90-101 (resolve_manifest_version: `if manifest is not None: return str(manifest.manifest_version); return \"1\"`)"
    claim: >
      resolve_manifest_version() never returns None — it has an explicit fallback return "1"
      for exactly the case where load_manifest() returns None (as it always has for "plan").
      So resolve_manifest_version("plan") already returned "1" before this mission (via
      fallback) and continues to return "1" after FR-010 (via the real manifest) —
      byte-identical, but not because it "returns '1' for the first time" as the spec states.
      The safety conclusion holds; the described mechanism is wrong.
    remediation: >
      Rewrite the plan-specific sentence to state resolve_manifest_version("plan") already
      returned "1" before this mission via its None-fallback branch, and continues to return
      "1" after FR-010 — the sync identity tuple for plan was, and remains, "1" throughout.

  - id: SPEC-ARCH-007
    lens: "Mission-derived: Override-tier accuracy"
    severity: 1
    title: "Code citation for the override-tier resolver logic (resolver.py:154-181) is imprecise and conflates two separate functions"
    evidence:
      - artifact: "spec.md § \"A second-order finding\" (line 149)"
      - code: "src/doctrine/resolver.py: the override check for templates/command-templates lives in _resolve_asset() at ~172-183; the check for mission.yaml lives in a separate function, resolve_mission(), at ~331-334 — outside the cited 154-181 range entirely"
    claim: >
      The substantive conclusion is correct and independently confirmed, but the citation
      points to one line range as if it covered a single unified check, when two separate
      functions implement the override check for the two asset families being compared, and
      the cited range does not contain resolve_mission()'s check at all.
    remediation: >
      Split the citation into two: _resolve_asset()'s override check (~172-183) for
      templates/command-templates, and resolve_mission()'s override check (~331-334) for
      mission.yaml.

  - id: SPEC-VERIFY-002
    lens: divergence-fix fidelity
    severity: 3
    title: "FR-007 / Acceptance Scenario 5 omit the non-expressible requirement_mapping_failures check inside the tasks_packages guard"
    evidence:
      - artifact: "spec.md § FR-007"
      - artifact: "spec.md § User Story 1, Acceptance Scenario 5 (only names the tasks.md/glob requirement for the three CLI-native steps)"
      - artifact: "spec.md § User Story 1, Acceptance Scenario 7 / SC-001 (tasks_finalize's non-expressible checks are named explicitly; tasks_packages's is not)"
      - code: "src/runtime/next/runtime_bridge_cores.py:484-489 (_evaluate_tasks_packages_guard: glob-missing message OR list(snapshot.status_facts[\"requirement_mapping_failures\"]) — a second, non-filesystem-expressible check on the same branch)"
    claim: >
      _evaluate_tasks_packages_guard enforces two things: the tasks/WP*.md glob AND
      requirement_mapping_failures (non-filesystem, same category as the
      dependency-frontmatter/occurrence-gate checks the spec explicitly calls out for
      tasks_finalize). FR-007/AS5 only instruct adding the glob entry; neither names
      requirement_mapping_failures nor asks for a documenting inline comment, even though
      SC-001's "zero unexplained divergences" bar would require one. No occurrence of
      "requirement_mapping" anywhere in spec.md.
    remediation: >
      Extend FR-007 (and AS5) to explicitly require an inline YAML comment on the
      tasks_packages required_by_step entry noting that _evaluate_tasks_packages_guard also
      enforces requirement_mapping_failures, mirroring the treatment already specified for
      tasks_finalize's occurrence-gate/dependency-frontmatter checks.
