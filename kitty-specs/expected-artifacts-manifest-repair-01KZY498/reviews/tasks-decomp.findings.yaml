findings:
  - id: TASKS-DECOMP-001
    lens: mission-specific (WP03 tracker-mutation bundling)
    severity: 3
    title: WP03's T017 bundles a non-idempotent, external tracker mutation (gh issue create) inside an otherwise pure-content WP, with no duplicate-issue guard on rework
    evidence:
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md, frontmatter (owned_files) and 'Subtask T017: File the upstream guard-gap issue (FR-011, SC-005)'"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Subtask T017 step 1: 'File a new GitHub issue on this repository (`Priivacy-ai/spec-kitty`) via `gh issue create`...'"
      - artifact: "tasks/WP03-plan-manifest-and-guard-gap-issue.md § Definition of Done: 'A new GitHub issue exists, distinct from #3388, naming the precise defect; its URL is recorded in `tracer-design-decisions.md` and ready for the PR body.'"
      - code: "src/specify_cli/dossier/manifest.py:60,90 (ExpectedArtifactSpec/ExpectedArtifactManifest — the actual code-review-able content WP03's T015/T016 touch)"
    claim: >
      WP03's `owned_files` is a single YAML data file
      (`packs/built-in/missions/plan/expected-artifacts.yaml`), and T015/T016 are
      ordinary red-first-test-then-content-edit subtasks reviewable as a normal code
      diff. T017 is a fundamentally different kind of action: an irreversible,
      external, stateful mutation against the live GitHub tracker (`gh issue
      create`, then an HiC assignment), verified not by pytest but by "gh issue
      view <new-issue-number>" (plan.md's own Test Strategy table labels this row
      "N/A (tracker verification, not a pytest test)" — plan.md itself already
      segregates this action's verification model from every other AC in the same
      table). Bundling it into the same WP as the manifest content creates two
      concrete problems: (1) reviewability — a reviewer of WP03 must switch from
      diff-based code review (T015/T016) to live-tracker-state verification (T017)
      within the same review pass, which is a different skill/tooling context than
      "one sitting" code review implies; (2) correctness on rework — nothing in
      T017's steps or WP03's Definition of Done guards against re-filing a
      duplicate issue if WP03 is rejected in the implement-review loop and
      reworked (e.g. because T016's manifest content needed a fix unrelated to
      T017). `gh issue create` is not idempotent; a naive re-run of the WP on
      rejection would file a second upstream issue for the same defect, since T017
      carries no "check whether the issue from a prior attempt already exists"
      step. The WP's own text acknowledges T017 is operationally distinct (Risks
      section calls out the header-comment risk but says nothing about
      issue-duplication risk on rework), so this bundling was not treated as a
      first-class design decision the way the file's other structural choices
      (chokepoint sequencing, out-of-map edits) were.
    remediation: >
      Either (a) split T017 into its own WP (or a lightweight, orchestrator/HiC-
      owned follow-up step outside the implement-review loop) so the code-content
      WP (T015/T016) can be reviewed, approved, and merged independently of the
      tracker-side action, or (b) if kept inside WP03, add an explicit idempotency
      guard to T017 ("before filing, search open issues in
      Priivacy-ai/spec-kitty for a title/body match created by a prior attempt at
      this WP; only file if none exists") and state in the Definition of Done that
      WP03's code-content portion (T015/T016) may be reviewed and marked complete
      independently of T017's tracker-side completion, so a `gh` auth/permission
      failure or review-rejection cycle on the manifest content does not couple to,
      or duplicate, the tracker mutation.

  - id: TASKS-DECOMP-002
    lens: descriptions concrete enough to implement without re-deriving the plan
    severity: 3
    title: WP02's own default implementation value for the tasks_packages/tasks_finalize glob contradicts spec.md's pinned acceptance criterion and the guard's own artifact-name constant
    evidence:
      - artifact: "tasks/WP02-reconcile-manifests.md § Subtask T014 step 3: '`tasks_packages:` → one blocking entry, ... `path_pattern: \"tasks/*.md\"` (or the glob confirmed in T012)'"
      - artifact: "tasks/WP02-reconcile-manifests.md § Subtask T012 step 1: 'reuse the existing `tasks/*.md`-style pattern already used elsewhere in this schema, e.g. the template's own sample content, unless [the guard functions imply] a more specific pattern'"
      - artifact: "spec.md § FR-007: '`tasks_packages` and `tasks_finalize` each require a `tasks/WP*.md` glob (this satisfies the standalone `tasks/WP*.md` glob addition named by the issue's claim 5...)'"
      - artifact: "spec.md line 108: '`tasks/WP*.md` appears in **zero** manifest entries despite **four** call sites in `runtime_bridge_cores.py`...'"
      - artifact: "plan.md § Test Strategy Per Acceptance Criterion, AS5 row: '`tasks_packages` and `tasks_finalize` each require a `tasks/WP*.md` glob entry blocking'"
      - code: "src/runtime/next/runtime_bridge_cores.py:91 — MISSING_TASK_FILES_MESSAGE = \"Required: at least one tasks/WP*.md file\" (the guard's own artifact-naming convention)"
      - code: "src/specify_cli/dossier/manifest.py:66,82 — path_pattern docstring examples cite the generic 'tasks/*.md' form (schema-level example only, not this WP's specific target artifact)"
    claim: >
      spec.md's FR-007 and its Independent Test / AS5 (and plan.md's own Test
      Strategy table, same AS5 row) pin the required glob for the
      `tasks_packages`/`tasks_finalize` entries as `tasks/WP*.md`, matching the
      guard's own message constant (`MISSING_TASK_FILES_MESSAGE`,
      `runtime_bridge_cores.py:91`) — this is stated three separate times in
      spec.md alone, not an incidental phrasing. tasks.md's own WP02 (the
      work-package prompt meant to make implementation "concrete enough ... without
      re-deriving the plan") instead offers `tasks/*.md` as its worked example: T012
      calls it "a `tasks/WP*.md`-style glob" in the test-assertion prose but then
      says to "reuse the existing `tasks/*.md`-style pattern," and T014's concrete
      implementation step literally instructs `path_pattern: "tasks/*.md"` (with
      only a parenthetical "(or the glob confirmed in T012)" hedge). `tasks/*.md`
      and `tasks/WP*.md` are materially different glob semantics — the former
      matches every `.md` file directly under `tasks/`, the latter only WP files —
      so an implementer following T014's literal instruction would author a
      manifest entry that satisfies neither spec.md's own acceptance scenario nor
      the guard's actual artifact-naming convention, without necessarily being
      caught by WP05's T020 guard-parity check (which cross-checks step-id-to-
      guard-branch correspondence, not the literal glob string against the guard's
      constant).
    remediation: >
      Correct WP02's T012 and T014 to state the concrete, spec-pinned value
      directly — `path_pattern: "tasks/WP*.md"` — rather than offering
      `tasks/*.md` as the example/default with a "confirm against T012" hedge.
      Since spec.md/plan.md already settled this value via direct citation of the
      guard's own `MISSING_TASK_FILES_MESSAGE` constant, tasks.md should not
      reintroduce ambiguity about which glob to write.

