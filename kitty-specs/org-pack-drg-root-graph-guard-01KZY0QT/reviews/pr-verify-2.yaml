    reason: >-
      The fix replaces first-occurrence-source classification with a genuine
      per-source occurrence count (src/charter/_drg_helpers.py:145-160): a
      triple collapses only when sources.count("root") == 1 and
      sources.count("drg") == 1; any source with >=2 occurrences leaves every
      occurrence untouched. Independently constructed all four required
      fixtures (not reusing the mission's test helpers) and drove them
      through the real load_validated_graph: 1x root + 2x drg raised
      DRGValidationError with 2 "Duplicate edge" errors; 2x root + 1x drg
      raised likewise (symmetric, by construction of the count check, not by
      edge-ordering luck); 1x root + 1x drg deduped to exactly 1 matching
      edge with no exception (guards against over-correction/disabling
      dedup); duplicate-twice-within-root-only (2x root + 0x drg) raised
      DRGValidationError with 1 "Duplicate edge" error. The mission's own 14
      tests in tests/charter/test_org_root_graph_guard.py, including the two
      new mixed-count regressions, also pass. This is a substantive fix, not
      a restated finding.
