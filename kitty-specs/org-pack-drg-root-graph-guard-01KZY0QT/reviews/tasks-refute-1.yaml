  - id: TASKS-VERIFY-001
    verdict: confirmed
    reason: >-
      Live pydantic 2.13 script confirms `DRGEdge` (no custom `__eq__`) uses field-value
      equality by default, `x in list_of_edges` dispatches to that `__eq__`, and simulating the
      "triple-equality" filtering reading of T005's guidance (`[e for e in edges if e not in
      duplicates]`) drops both the original and the duplicate (length 0) instead of retaining
      exactly one, while identity-based filtering correctly retains 1 — the "or by the same
      triple-equality" alternative is a genuine, verified implementation trap.
  - id: TASKS-VERIFY-002
