mission: org-pack-drg-root-graph-guard-01KZY0QT
findings:
  - id: PLAN-ARCH-001
    lens: Silent Success Discipline / Non-Vacuous Gate for the Defect Class
    severity: 4
    title: A malformed root-level org graph combined with valid drg/ content still silently zeroes the entire org layer — an untreated instance of the exact defect class this mission exists to close
    evidence:
      - artifact: "plan.md § IC-01 (Risks bullet)"
      - artifact: "plan.md § Non-Vacuous Gate for the Defect Class"
      - artifact: "spec.md § Non-Goals (project-layer DRGLoadError bullet); spec.md § Edge Cases (only discusses malformed drg/, not malformed root)"
      - code: "src/charter/_drg_helpers.py:86-87 (org load call site)"
      - code: "src/charter/action_doctrine_bundle.py:152-207 (wide `except DRGLoadError` collapses the whole bundle)"
      - code: "src/doctrine/drg/loader.py:81-112 (`load_graph_or_dir` on a directory prefers a root `graph.yaml` and raises `DRGLoadError` on a parse/schema failure before ever looking at `drg/`)"
    claim: >
      IC-01's own Risks paragraph states plainly that a root-level `graph.yaml` that exists
      but is malformed still makes `has_root_graph=True`, so `_load_org_layer` still attempts
      `load_graph_or_dir(org_root)` and lets the resulting `DRGLoadError` propagate uncaught
      "exactly as pre-fix." Per `action_doctrine_bundle.py`'s existing wide
      `except DRGLoadError`, that means the *entire* org layer — including a perfectly valid
      `drg/` fragment sitting right next to the malformed root file in the same pack — is
      silently dropped and the CLI still reports success (a WARNING log line only), exactly
      the shape #3384 reports and exactly the shape this mission's own "Non-Vacuous Gate for
      the Defect Class" section defines the target defect class by ("a code path composes an
      optional graph-content source without first checking whether that source has anything
      loadable, so 'nothing to load' and 'content exists' both hit the same unconditional
      loader call"). Here "content exists" in `drg/` and is perfectly loadable, yet it is
      still dropped because the *sibling* root source failed, which is a variant of the same
      shape one directory over — precisely the "next instance of this defect class" the plan's
      own Non-Vacuous Gate section says its regression test would catch, except no test in the
      plan's Test Strategy table exercises this combination (US3's fixtures test a malformed
      `drg/` fragment; none test a malformed root graph alongside a valid `drg/`). IC-01
      justifies leaving this open by citing "Non-Goals/FR-004's drg/-only narrowing," but that
      citation does not hold up: spec.md's actual Non-Goals bullet on this topic is scoped to
      "project-layer (`.kittify/doctrine`) graph content," not to an org-root-level malformed
      graph, and FR-004's own text narrows only to "a malformed or invalid `drg/` fragment" —
      neither passage explicitly authorizes silently swallowing a *valid* `drg/` fragment
      because a *different* file (the root graph) in the same org layer failed to parse. This
      also cuts against FR-001's own stated rationale ("declaring a pack never reduces
      available doctrine below the bare-project baseline") — for this specific combination,
      declaring the pack *does* reduce doctrine to zero, silently, after the fix ships.
    remediation: >
      Either (a) make this an explicit, operator-ruled Non-Goal in spec.md — naming the
      "malformed root-level org graph + valid drg/ content" combination specifically (not
      inferred from the project-layer bullet) — and add a regression test that pins today's
      residual silent-collapse as the deliberately-accepted behavior, or (b) close the gap:
      have `_load_org_layer` attempt the `drg/` load independently of the root load's outcome,
      so a malformed root graph raises `OrgDRGFragmentError` (IC-03's distinguishable failure)
      rather than silently vanishing behind the wide `DRGLoadError` catch, and/or so a valid
      `drg/` fragment is not lost just because the sibling root file failed. Whichever is
      chosen, add the missing test case (malformed root graph.yaml + valid drg/fixture.graph.yaml)
      so the decision is pinned, not inherited silently.

  - id: PLAN-ARCH-002
    lens: Reflexivity
    severity: 3
    title: "Mid-flight impact claim (\"counts increase\" or \"unaffected\") omits a third, more disruptive outcome for existing root+drg/ org packs whose dormant drg/ content is malformed"
    evidence:
      - artifact: "spec.md § Edge Cases (\"What happens to a mission that is mid-flight...\")"
      - artifact: "plan.md — mirrors spec's Edge Case verbatim in framing; no Blast Radius / PR Shape counter-note added"
      - code: "src/doctrine/drg/loader.py:101-112 (`load_graph_or_dir` on a directory: a root `graph.yaml`, if present, is preferred and `drg/*.graph.yaml` is never consulted — today's silent-drop precedent for a root+drg/ pack)"
      - code: "src/charter/_drg_helpers.py:83-97 (`load_validated_graph`, the function whose org-layer branch this mission rewrites)"
    claim: >
      Both spec.md's Edge Cases and plan.md state the mid-flight impact of this fix as a
      binary: a project with no org pack declared is unaffected, and a project with an org
      pack declared "sees its action-scoped doctrine counts increase (correctly)." This
      binary is incomplete. Today, per `load_graph_or_dir`'s own documented precedence (a
      directory's root `graph.yaml` is preferred over its `*.graph.yaml` fragments), any
      existing org pack that already has a root-level graph AND a `drg/` directory has its
      `drg/` content silently ignored — the org layer loads successfully from the root file
      alone. After this fix (IC-02), that pack's `drg/` content is scanned and merged
      (correctly, per FR-003/User Story 4) — but if that previously-dormant `drg/` content
      happens to be malformed (invalid YAML or schema-invalid — never validated before
      because never loaded), IC-03 now raises `OrgDRGFragmentError` uncaught, turning what was
      a working (root-only) `charter context` call into a hard CLI failure on every subsequent
      invocation for that project, until an operator repairs or removes the bad fragment. That
      outcome is neither "unaffected" nor "counts increase" — it is a new, previously-absent
      failure mode introduced by this fix's own correct behavior (IC-03 is doing exactly what
      FR-004 wants), but the plan nowhere states this as a rollout/blast-radius consideration
      for downstream spec-kitty-driven workspaces (e.g. team-kitty-missions, muster-missions)
      that may carry exactly this shape today. This is the same class of disclosure the plan
      already does well for #3385 (a plain PR-description callout) but omits here.
    remediation: >
      Add a third bucket to the mid-flight Edge Case / Blast Radius narrative: "A project with
      an existing root+drg/ org pack whose drg/ content was previously dormant (root-preferred,
      never loaded) and is malformed will begin hard-failing charter context calls once this
      fix lands — this is intended (IC-03), but state it explicitly in the mission's PR
      description as a pre-upgrade audit note," mirroring the #3385 non-goal disclosure
      already present elsewhere in this plan.
