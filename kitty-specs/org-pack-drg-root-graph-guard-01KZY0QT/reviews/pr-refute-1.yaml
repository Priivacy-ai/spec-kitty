  - id: PR-BOUNDARY-002
    verdict: refuted
    reason: Live reproduction refutes the claim — ProfileInvocationExecutor.invoke() calls
      build_charter_context() with no mission_type and no feature_dir kwarg (confirmed by
      reading executor.py:356-361, the only call site in the file), so
      resolve_mission_type_key() always returns None for the dispatch path and the
