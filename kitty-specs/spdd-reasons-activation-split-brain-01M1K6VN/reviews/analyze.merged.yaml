    not as a live defect this mission must fix.
  evidence: >-
    src/charter/activation/resolver.py (`resolve_governance_for_profile`); grep-confirmed
    zero non-test/non-re-export callers; tasks/WP03-resolver-activated-base.md's
    "Union/Exclusion Boundary Audit" section (4 boundaries enumerated, none of them this
    function); spec.md Non-Goals ("A general audit of every other consumer of
    governance.charter.selected_* ... beyond the three named ... is explicitly OUT OF SCOPE").
  remediation: >-
