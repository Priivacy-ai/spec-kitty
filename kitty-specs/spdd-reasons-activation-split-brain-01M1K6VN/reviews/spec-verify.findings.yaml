findings:
  - id: SPEC-VERIFY-001
    lens: "MISSION-DERIVED LENS 1 — silent-success carve-out honesty (FR-004 falsifiability)"
    severity: 4
    title: "FR-004's call-site-reachability clause has no acceptance criterion, and the answer it defers to 'implementation time' is already determinable now"
    evidence:
      - artifact: "spec.md § FR-004 (Requirements table) and § Edge Cases (first bullet, '.kittify/config.yaml is entirely absent')"
      - code: "src/specify_cli/cli/commands/init.py:910 (install_skills_for_agent(project_path, agent_key, agent_skills, ...) — called from spec-kitty init)"
      - code: "src/specify_cli/skills/installer.py:236 (install_skills_for_agent) -> src/specify_cli/skills/command_installer.py:260 (_render_command_skill) -> :265 render_skill(..., repo_root=repo_root) -> src/specify_cli/skills/command_renderer.py:441-443 (apply_spdd_blocks_for_project(raw_text, repo_root))"
      - code: "src/specify_cli/cli/commands/init.py:1220-1227 (_save_vcs_config / save_agent_config, which write .kittify/config.yaml, execute AFTER the skills-install block at line 910 within the same init() function)"
    claim: >
      FR-004 requires the implementer to "verify at the real call sites (bootstrap_text.py:332,
      apply_spdd_blocks_for_project, command_renderer.py, asset_generator.py) whether any of
      them can be reached before .kittify/config.yaml exists on disk ... recording the finding
      either way" — but the FR names no concrete acceptance criterion for what "recording the
      finding" must produce (a code comment? a test? a PR-body note?), nor any criterion for
      what changes if the finding is "yes, reachable." Reading the actual call graph, the
      answer is already determinable without any implementation-time investigation: in
      spec-kitty init() (src/specify_cli/cli/commands/init.py), install_skills_for_agent(
      project_path, ...) at line 910 renders command/skill templates through
      command_renderer.py's apply_spdd_blocks_for_project(raw_text, repo_root) — and this call
      happens strictly before save_agent_config(project_path, agent_config) at line 1227, the
      call that actually writes .kittify/config.yaml. So command_renderer.py's call site IS
      reached before .kittify/config.yaml exists on disk, on every spec-kitty init run. The
      spec had the material to settle this now (as it did for the other Decision Records) but
      instead relocated an answerable factual question into the FR text with "recording the
      finding either way" as the only deliverable — leaving a WP with no way to know whether
      it is "done": a WP could satisfy the letter of FR-004 by writing nothing more than a
      one-line comment, or by adding an elaborate new test, and neither would be wrong per the
      FR as written. (Separately, the actual behavioral answer for this specific call path is
      benign — pre-fix, the old is_spdd_reasons_active also returns False at this point because
      .kittify/charter/ does not exist yet either, so the FR-004 pin does not regress this path
      — but the spec does not state this, which is exactly the verification FR-004 asks for and
      does not require to be recorded in a checkable form.)
    remediation: >
      Either (a) resolve the call-site question in the spec now, the same way Decision Records
      1 and 2 resolved their open questions — state explicitly that command_renderer.py's and
      asset_generator.py's call sites ARE reached before .kittify/config.yaml exists during
      `spec-kitty init`, that this is safe because the pre-fix function already returns False in
      that state (byte-for-byte parity preserved), and drop the "verify at implementation time"
      language; or (b) if the investigation is deliberately left for implementation, give FR-004
      a concrete, falsifiable acceptance criterion — e.g. "a code comment naming which call
      sites are reachable pre-config.yaml, plus a regression test asserting
      apply_spdd_blocks_for_project(text, repo_root) strips REASONS blocks when repo_root has no
      .kittify/config.yaml, run through at least one of command_renderer.py/asset_generator.py's
      real entry points" — so a reviewer can check RED-then-GREEN against a defined "done."

  - id: SPEC-VERIFY-002
    lens: "MISSION-DERIVED LENS 2 — ATDD/red-first shape (C-011), FR-010"
    severity: 4
    title: "FR-010's 'kept vs. flipped' assertion-level triage framing understates the actual required work: most affected tests need a fixture-construction rewrite, not a boolean flip, and the spec gives no per-test guidance"
    evidence:
      - artifact: "spec.md § FR-010 (Requirements table)"
      - code: "tests/charter/test_charter_context_spdd_reasons.py:36-53 (_write_governance/_write_directives helpers write ONLY .kittify/charter/charter.yaml's governance:/directives: sections; neither ever writes .kittify/config.yaml)"
      - code: "tests/charter/test_charter_context_spdd_reasons.py:128-176 (TestActivation::test_paradigm_selected_returns_true, test_only_tactic_fill_returns_true, test_only_tactic_review_returns_true, test_only_directive_038_returns_true, test_directive_038_via_directives_yaml — all assert is_spdd_reasons_active(tmp_path) is True using only the charter.yaml governance/directives fixture, with no .kittify/config.yaml present in tmp_path)"
      - code: "tests/charter/test_charter_context_spdd_reasons.py:365-379 (TestParadigmRoundTrip::test_paradigm_in_governance_activates_pack) and :413-484 (TestSelectedTacticsRoundTrip::test_tactic_only_selection_round_trips_to_governance_and_activates) — both build a PackContext/GovernanceConfig in memory then persist the result into charter.yaml's governance: section via save_charter_yaml, never into .kittify/config.yaml, then assert on is_spdd_reasons_active(tmp_path)"
      - code: "tests/charter/test_activate_resolves_no_answers_edit.py:194-249 (TestSpddActivationDoesNotFlip::test_config_sourced_compile_keeps_spdd_active) — reconstructs a GovernanceConfig from interview.selected_*/compiled fields and writes it to tmp_path/.kittify/charter/charter.yaml via save_charter_yaml; tmp_path never receives a .kittify/config.yaml, then asserts is_spdd_reasons_active(tmp_path) is True"
    claim: >
      FR-010 characterizes the required change as an assertion-level triage: "assertions whose
      intent survives ... are kept, updated only where their literal mechanics changed;
      assertions that encode the bug itself ... are flipped." Reading all three files' actual
      fixture-construction code shows this materially understates the work for at least 8
      test methods across two of the three files (TestActivation's 5 True-asserting cases,
      TestParadigmRoundTrip, TestSelectedTacticsRoundTrip, and
      TestSpddActivationDoesNotFlip::test_config_sourced_compile_keeps_spdd_active): every one
      of these builds its fixture by writing ONLY .kittify/charter/charter.yaml's governance:/
      directives: sections (via save_charter_yaml or the local _write_governance/
      _write_directives helpers) and never writes a .kittify/config.yaml at all. Under FR-001's
      rewrite, is_spdd_reasons_active no longer reads charter.yaml's governance:/directives:
      sections under its own steam — it reads .kittify/config.yaml (or, via a charter: pointer,
      the pointed charter.yaml's top-level activated_* keys). Since none of these fixtures
      write .kittify/config.yaml, every one of them would, under the new implementation, hit
      FR-004's absent-config-file path and return False unconditionally — which is not "flip
      the assertion from True to False" in any way that preserves the test's *intent* (each of
      these tests exists to prove a specific selector — a paradigm, a tactic, DIRECTIVE_038 —
      activates the pack); a bare True->False flip would silently stop testing activation via
      any real selector at all. What each of these actually needs is a full rewrite of its
      fixture-construction mechanism (write .kittify/config.yaml's activated_paradigms/
      activated_directives/activated_tactics, optionally via a charter: pointer, instead of
      charter.yaml's governance:/directives: sections) so the test still exercises the selector
      it is named for. FR-010 gives no per-file, per-test guidance distinguishing this "rewrite
      the fixture mechanism" bucket from its own "kept, mechanics-updated" and "flipped"
      buckets — a WP implementer following FR-010's literal text (find assertions, decide
      kept-vs-flipped) has no way to discover, without independently re-deriving this same
      audit, that ~8 of these tests need a bigger structural change than either bucket
      describes. Two implementers following FR-010 as written could reasonably disagree about
      whether TestParadigmRoundTrip and TestSelectedTacticsRoundTrip should be rewritten,
      deleted as now-redundant with the FR-002 parity test, or merged into it — none of those
      outcomes is ruled in or out by the spec.
    remediation: >
      Add a third, explicit bucket to FR-010 — "assertions whose fixture-construction mechanism
      is now obsolete and must be rewritten to write .kittify/config.yaml's activated_* keys
      instead of charter.yaml's governance:/directives: sections, while preserving the
      selector-under-test" — and name the specific tests that fall into it (at minimum
      TestActivation's five True-asserting cases, TestParadigmRoundTrip,
      TestSelectedTacticsRoundTrip in test_charter_context_spdd_reasons.py, and
      TestSpddActivationDoesNotFlip::test_config_sourced_compile_keeps_spdd_active in
      test_activate_resolves_no_answers_edit.py), so a WP can commit a red-first version of
      each rewritten fixture (red against the OLD is_spdd_reasons_active reading the new
      config.yaml-only fixture, green after FR-001) and a reviewer can verify RED-then-GREEN on
      the intended commit without re-deriving which tests needed what.

  - id: SPEC-VERIFY-003
    lens: "MISSION-DERIVED LENS 1 — silent-success carve-out honesty (internal consistency)"
    severity: 2
    title: "User Story 1's 'agree ... in every case' framing is imprecise given FR-004's documented carve-out"
    evidence:
      - artifact: "spec.md § User Story 1 ('I want is_spdd_reasons_active(repo_root) to agree with the compiler's real activated_* authority in every case ...')"
      - artifact: "spec.md § FR-004 and § Edge Cases (absent .kittify/config.yaml bullet) — the explicit, deliberate divergence from PackContext.from_config for the absent-config-file case"
    claim: >
      User Story 1's narrative motivation states the goal as agreement "in every case," but
      FR-004 explicitly carves out one case (absent .kittify/config.yaml) where the rewritten
      function's answer is pinned to False regardless of what a literal PackContext.from_config
      parity read would produce (which would be True, per PackContext's documented
      absent-key-means-all-built-ins-active default). The FR-004/Edge-Cases text does
      reconcile this by naming it a "deliberate, evidence-based carve-out," so the spec is not
      self-contradicting once read in full — but the User Story's own framing, read on its own
      (as an FR-writing WP agent working FR-by-FR might), overstates the guarantee the mission
      actually delivers. This is a wording-precision gap, not a behavioral ambiguity.
    remediation: >
      Qualify User Story 1's "in every case" phrase with a forward pointer to FR-004's
      documented exception (e.g. "... in every case where a charter has been provisioned (see
      FR-004 for the one deliberate exception)"), so a reader of the User Story section alone
      is not misled about the scope of the parity guarantee.

