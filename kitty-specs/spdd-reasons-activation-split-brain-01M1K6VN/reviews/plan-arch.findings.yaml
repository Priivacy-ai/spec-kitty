findings:
  - id: PLAN-ARCH-001
    lens: INV-2 replication fidelity
    severity: 4
    title: FR-002 parity-test oracle contradicts the plan's own three-state semantics for an absent per-kind key
    evidence:
      - artifact: "plan.md § (a) Seam and placement, item 1, 4th bullet — \"Apply the three-state per-kind semantics verbatim (absent key → `None`/\"all built-ins\"; `[]` → explicit empty; non-empty → explicit set)\""
      - artifact: "plan.md § (b) The parity test's design (FR-002), \"What it compares\" — `PARADIGM_ID in (pack_context.activated_paradigms or set())`, `{TACTIC_FILL_ID, TACTIC_REVIEW_ID} & (pack_context.activated_tactics or set())`, `any(...match against pack_context.activated_directives or set())`"
      - artifact: "plan.md § (m), row 4 (delivery_table.py) — \"`None` (all built-ins) and `frozenset()` (explicit empty) must never be conflated at the point of use\" — the correct principle, stated for a different file, violated one section above by the FR-002 oracle formula"
      - code: "src/charter/activation/pack_context.py:609 (_read_list_key: absent key -> None)"
      - code: "src/charter/activation/drg_activation.py:428-433 (_node_is_activated docstring, step 3: \"None (key absent from config) means all IDs are allowed\")"
    claim: >
      Decision Record 1 / FR-001(d) require the rewritten `is_spdd_reasons_active` to treat an
      absent per-kind key as `None` = "all built-ins available" (i.e. the corresponding selector
      counts as satisfied), matching PackContext's real three-state contract used everywhere else
      in the codebase (`_node_is_activated`'s per-artifact-ID gate treats `None` the same way).
      Plan.md section (a) restates this correctly. But the load-bearing FR-002 parity test's
      comparison formula in section (b) computes the "expected" boolean via Python's
      `x or set()` idiom, which coerces `None` to an empty set exactly like an *explicit* `[]`
      — collapsing two of the three states the plan itself just said must stay distinct. For
      fixture-matrix state 1 ("key absent from the activation source entirely" — one of the
      mandatory 3-states x 3-kinds cells FR-002 requires), section (b)'s literal oracle asserts
      the selector is NOT satisfied, directly contradicting section (a)'s "None = all built-ins"
      semantics one section earlier, and contradicting the identical principle plan.md itself
      states correctly at section (m) row 4 for `delivery_table.py`'s guard ("None and
      frozenset() must never be conflated"). Whichever of the two contradictory specifications an
      implementer follows, the other breaks: build `is_spdd_reasons_active` to satisfy FR-001(d)'s
      stated semantics and it fails the parity test as literally designed in section (b); build it
      to satisfy section (b)'s literal formula and it silently encodes the wrong three-state
      semantics for the absent-key case — exactly the "blind rewrite handling only one of INV-2's
      states" class Decision Record 1 warns against, now embedded in the mission's own regression
      test rather than caught by it.
    remediation: >
      Fix section (b)'s comparison formula so an absent per-kind key (`pack_context.activated_X is
      None`) evaluates as "selector satisfied" rather than being coerced through `or set()`, e.g.
      `pack_context.activated_paradigms is None or PARADIGM_ID in pack_context.activated_paradigms`
      (and the analogous form for tactics' intersection and the directive match), so it matches
      section (a)'s stated semantics and the codebase-wide None="all built-ins" contract. If, after
      resolving PLAN-ARCH-002 below, the intended behavior for "key absent" turns out to be
      "not active" in some cases, state that explicitly in both section (a) and section (b) (and
      update FR-001(d)/Decision Record 1 to match) rather than leaving the two plan sections in
      direct disagreement.

  - id: PLAN-ARCH-002
    lens: INV-2 replication fidelity
    severity: 4
    title: Rewrite design replicates PackContext's raw None-passthrough, not compile_charter's real (project_configured-gated) activated_* authority
    evidence:
      - artifact: "plan.md § (a) Seam and placement, item 1 (the four INV-2 steps `activation.py`'s rewrite must replicate)"
      - artifact: "spec.md Summary (lines ~14-19) and Decision Record 1 — both invoke `compile_charter`'s docstring (\"sourced from `config.activated_*` ... never from `interview.selected_*`\") as the authority `is_spdd_reasons_active` must agree with"
      - code: "src/charter/activation/compiler.py:365-372 (compile_charter docstring, the exact lines spec.md's Summary quotes)"
      - code: "src/charter/activation/compiler.py:153-181 (_resolve_config_activated_roots / _stems), esp. lines 166-181: \"FR-018 (WP07/T038): retire the 'absence => all built-ins' fallback at this delivery boundary for CONFIGURED projects. A project that activates at least one per-artifact kind but OMITS an `activated_<kind>` key delivers NOTHING for that kind\" and `if value is None and project_configured: return frozenset()`"
      - code: "src/charter/activation/compiler.py:102-110 (_CONFIG_ACTIVATION_FIELDS — includes activated_paradigms/activated_directives/activated_tactics among 7 fields)"
    claim: >
      Decision Record 1 states `PackContext.from_config`'s raw two-file, three-state resolution IS
      "the compiler's real activated_* authority," and plan.md section (a) commits the rewrite to
      replicate exactly that raw resolution (absent key -> unconditional None -> "all built-ins").
      This is not actually what `compile_charter` — the function spec.md's own Summary quotes
      verbatim to establish the ground truth — does. `compile_charter`'s real activation
      resolution (`_resolve_config_activated_roots`, immediately following the quoted docstring)
      applies an additional `project_configured` gate (FR-018/T038, a deliberate prior fix): once a
      project has set ANY of the 7 `activated_<kind>` fields (directives, paradigms, tactics,
      styleguides, toolguides, procedures, agent_profiles) anywhere in its activation source, an
      OTHER, still-absent `activated_<kind>` key no longer falls back to "all built-ins" — it
      resolves to nothing. Concretely: a project with `activated_directives: [DIRECTIVE_010]` set
      but `activated_paradigms` never mentioned at all is, per `compile_charter`'s real, current
      behavior, NOT delivered any built-in paradigm (including SPDD) — `project_configured=True`
      forces the omitted key to `frozenset()`. A rewrite faithful to plan.md section (a)'s literal
      four steps instead treats that same project's absent `activated_paradigms` as `None` ->
      "all built-ins" -> SPDD paradigm counted active, disagreeing with what `compile_charter`
      itself would deliver. This is a NEW instance of the exact split-brain class this mission
      exists to close, introduced by the fix, on the realistic "partially configured project"
      shape — a shape distinct from (and not covered by) the pointer-present/absent axis the
      mandatory parity fixture matrix already tests. This repo's own dogfood charter has all three
      SPDD-relevant keys explicitly non-empty, so neither the mission's live reproduction nor the
      planned fixture matrix would catch this regression before merge.
    remediation: >
      Either (a) extend the INV-2 replication in section (a)/FR-001 to include the
      `project_configured` gate: before treating an absent SPDD-relevant key as "all built-ins,"
      the rewritten `is_spdd_reasons_active` must check whether any of the other
      `activated_<kind>` keys (directives/paradigms/tactics/styleguides/toolguides/procedures/
      agent_profiles) is present in the SAME resolved activation source (config.yaml directly, or
      the pointed charter.yaml) — mirroring `compiler.py`'s `_stems()`/`project_configured` logic
      exactly — and add a fixture ("one SPDD-relevant kind's key present, another SPDD-relevant
      kind's key absent, on an otherwise-configured project") to FR-002/section (b)'s matrix so the
      chosen behavior is pinned; or (b) if the plan's scope is deliberately narrower than
      `compile_charter`'s full delivered set (tracking only `PackContext`'s raw fields), state that
      as an explicit, evidence-based carve-out the same way FR-004 documents the absent-config-file
      carve-out, rather than presenting Decision Record 1 as matching "the compiler's real
      activated_* authority" when it only matches one layer of it.
