      as concrete directive IDs") and every other place project_directives' None-handling is
      specified (§ (m)'s table row, § (a) item 4's resolver.py description, § (a) item 3's own
      closing paragraph "all three read None as 'all built-ins'") unambiguously commit to the
      catalog default, so an implementer following the plan as a whole would not be misled — this
      is nit-level (severity 1), not a new finding. C-004 satisfaction, the parity test design
