  - id: PLAN-FRESH-001
    status: resolved
    reason: >
      Re-derived against the live tree, not trusted from the fixer's report. Foundation checks
      out exactly: src/charter/activation/catalog.py's DoctrineCatalog dataclass carries
      `paradigms: frozenset[str]` (line 43), `directives: frozenset[str]` (line 44),
      `tactics: frozenset[str]` (line 46), populated by `load_doctrine_catalog()` (def at line
      53, zero required args, confirmed by direct call: `load_doctrine_catalog().tactics` has
      124 entries, `.paradigms` has 13). resolver.py imports `load_doctrine_catalog` at line 43
      (`from charter.activation.catalog import DoctrineCatalog, load_doctrine_catalog`), calls
      it at line 844 inside `resolve_project_governance`, and reads `.paradigms` at line 622
      inside `_validate_paradigm_selection` (def at 615) and `.directives` at 713/714/732 inside
      `_resolve_directive_base` (def at 675). Every one of these citations matches the plan's
      text exactly. plan.md's fix commit f9a0b0cf5 replaced § (a) item 3's "convert None to an
      explicit empty set [...] there is no catalog enumeration available at this call site"
      language with "convert None to `load_doctrine_catalog().tactics`/`.paradigms` — the
      built-in catalog default, symmetric with `project_directives`'s treatment above, not an
      explicit empty set," and explicitly states the old rationale "does not hold," citing the
      same catalog.py/resolver.py evidence above. This is a substantive change, not a restated
      finding: the actual design decision (empty set vs. catalog default) flipped, and every
      consumption site the plan enumerates (start_urns, roots, the exclusion guard) is now
      described as never receiving None from any of the three re-derived values, resolved
      identically. § (m)'s table (line 628) was updated in the same commit to state the
      symmetric "all three to the catalog-backed 'all built-ins' default" outcome, matching item
      3's prose word-for-word rather than drifting from it. The false "no catalog enumeration
      available" rationale is gone, not softened — it is now explicitly named and refuted in the
      plan's own text as a documented correction. Verdict: the round-1 defect (empty-set
      narrowing of the ordinary "activated_* absent" case, contradicting resolver.py's own
      widen-to-catalog-default treatment of the identical None state) is closed, not relocated.
  - id: PLAN-FRESH2-001
    status: resolved
    reason: >
      Independently re-verified resolver.py's FR-011 description against the live file (not the
      fixer's summary): § (a) item 4 states `_resolve_directive_base` (resolver.py:675) already
      calls `PackContext.from_config(repo_root).activated_directives` (line 730), reached only
      via the `else` branch after `if doctrine.selected_directives:` (line 716) short-circuits —
      confirmed exact line-for-line against the live file. `resolve_project_governance` (line
      815) is described as gaining an equivalent `PackContext.from_config(repo_root)
      .activated_paradigms` read "where today there is none at all" (line 848 currently reads
      `selected_paradigms = list(doctrine.selected_paradigms)` with no activated_paradigms read
      at all — confirmed, this is a real gap FR-011 closes, not an already-present read). The
      contradiction PLAN-FRESH2-001 identified — resolver.py widening `None` to the catalog
      default while action_doctrine_bundle.py narrowed the identical `None` state to an empty
      set, in the same PR — is eliminated: action_doctrine_bundle.py's None-conversion (item 3)
      now targets `load_doctrine_catalog().tactics`/`.paradigms`, the same function/field family
      resolver.py's FR-011 edit already uses for the identical `activated_paradigms is None`
      case. § (m)'s table row for action_doctrine_bundle.py/delivery_table.py now says
      explicitly "matching `resolver.py`'s FR-011 treatment of the same `activated_paradigms is
      None` case (item 4 below)" — the two files' documented behavior for the same field is now
      described identically, verified by reading resolver.py directly rather than accepting the
      plan's cross-reference on faith. The WP2 fixture was rewritten to assert the catalog-
      derived "all built-ins" seed (roots/start_urns contain a tactic:<id>/paradigm:<id> URN for
      every ID in load_doctrine_catalog().tactics/.paradigms) and is explicitly stated to be
      "required to FAIL against current main." I reasoned through whether that claim is true:
      action_doctrine_bundle.py's live code (lines 190-191) currently derives selected_tactics/
      selected_paradigms from `_load_doctrine_selection(repo_root)` (a governance.yaml-derived
      DoctrineSelectionConfig), not from pack_context.activated_tactics/.activated_paradigms at
      all — this is the split-brain the mission exists to fix. A fixture that sets
      activated_tactics/activated_paradigms=None on pack_context but leaves governance.yaml's
      charter section unconfigured (the ordinary case) would see main's code path produce
      selected_tactics={}/selected_paradigms={} regardless of the pack_context value, since main
      never reads pack_context for these two fields. With catalog.tactics at 124 entries and
      catalog.paradigms at 13 (confirmed by direct call), roots would carry zero tactic/paradigm
      URNs on main against an assertion expecting 124+13 — the fixture genuinely fails on main,
      as claimed. Ran tests/charter/test_action_bundle_delivery.py against the live tree (13
      passed) to confirm current baseline behavior described by the plan is accurate before
      relying on it. This is a real regression test, not a bug-preserving one.
