findings:
  - id: R2-001
    severity: 3
    file: tests/charter/test_context_org_chain.py
    line: 172
    summary: "WP03's T019 'empirical inertness proof' test never invokes the real CLI command that carries T017's fix, so a regression of T017 alone would go undetected by any test in the repo."
    failure_scenario: >-
      T017 is "stop src/specify_cli/cli/commands/charter/context.py's context()
      command from precomputing org_root = org_roots[0] and passing it to
      build_charter_context/build_charter_context_json; pass org_root=None
      instead" (see context.py lines ~97/122/141 in the diff). But
      tests/charter/test_context_org_chain.py's _render_both() helper (lines
      172-199) calls charter.context.build_charter_context and
      build_charter_context_json DIRECTLY, with org_root=None passed as a
      hardcoded literal -- it never imports or invokes
      specify_cli.cli.commands.charter.context.context() (the actual typer
      command T017 touches), and no other test file in the repo does either
      (verified: grepping every test that uses CliRunner + charter_app for
      "context" as a subcommand argument, and every test importing
      build_charter_context/build_charter_context_json, turns up zero CLI-level
      invocations of `charter context` with any org pack configured -- e.g.
      tests/charter/test_context_include.py's only CliRunner+context case covers
      --include with zero org packs; tests/charter/test_org_activations_reach_context.py
      and tests/integration/test_org_pack_artifact_lifecycle.py also import
      build_charter_context directly rather than going through the CLI).
      Concretely: if a future change reintroduces
      `org_root = org_roots[0] if org_roots else None` at the two
      build_charter_context/build_charter_context_json call sites inside
      context.py's context() command (e.g. someone "cleans up" the two T017
      comments and restores the variable), tests/charter/test_context_org_chain.py
      and the rest of the suite stay 100% green -- the actual `spec-kitty charter
      context --action <x>` CLI command would silently regress to pack-1-only
      resolution again with no red test anywhere. This is exactly the class of
      gap the WP03 task doc (tasks/WP03-context-bundle-org-chain.md, T019) asked
      to be closed via a 4-point empirical proof, but the delivered proof was
      performed at the library-function level (and recorded manually in the WP
      report per the test module's own docstring: "recorded via manual
      revert-and-rerun in the WP report") rather than encoded as an automated
      regression test guarding the CLI wiring itself. I confirmed by direct
      inspection (not just the test's own docstring claim) that reverting only
      T017's effect (org_root=org_roots[0] instead of None) at the
      build_charter_context/build_charter_context_json call boundary does turn
      pack B absent (see coverage.tests_run above) -- so T017 is genuinely
      necessary, just untested at its actual call site.
    recommendation: >-
      Add (or extend an existing CLI-level test, e.g. in
      tests/charter/test_context_include.py's CliRunner style) a test that
      invokes `charter_app` via CliRunner with `["context", "--action", ...]`
      (and `--json`) against a two-org-pack config, asserting pack B's content
      appears in the real CLI output -- not just in the return value of
      build_charter_context/build_charter_context_json called directly. That is
      the only way to pin the actual org_root=None literal at context.py's two
      call sites against a future accidental revert.
  - id: R2-002
    severity: 2
    file: src/specify_cli/cli/commands/charter/activate.py
    line: 272
    summary: "_activate_cascade_target discards every failure but the last when no org-root candidate succeeds, so the operator-facing error can name the wrong reason."
    failure_scenario: >-
      When a cascade target's config_id does not resolve under ANY candidate
      layer_roots (org_roots=[pack1, pack2, ...]), _activate_cascade_target
      collects each ValueError into `failures` but re-raises only
      `failures[-1]` (the last candidate's exception), silently discarding
      every earlier candidate's failure reason. Concretely: if pack1 fails with
      "Unknown directive ID 'x'" (the mundane, expected case -- the artifact
      genuinely lives only in pack2 or nowhere) but pack2's attempt happens to
      fail for a different, more surprising reason (e.g. a transient/structural
      issue specific to pack2's directory layout), the operator only ever sees
      pack2's message in the console output from _render_cascade_activation's
      `except ValueError as exc: console.print(...)` handler and has no way to
      tell from the CLI output that pack1 was even tried, or why it failed.
      This does not cause incorrect activation (the plan/commit seam is
      non-mutating on failure, confirmed by inspection, so trying pack1 then
      pack2 is safe), only a potentially misleading diagnostic when multiple
      org roots are configured and none contain the artifact.
    recommendation: >-
      Either join all collected failure messages into the raised/reported
      error (e.g. "; ".join(str(f) for f in failures)), or at minimum note in
      the docstring that only the last candidate's failure is surfaced so a
      future debugger of a multi-org-pack "Unknown ID" report knows to check
      each org root by hand rather than trusting the printed reason.
