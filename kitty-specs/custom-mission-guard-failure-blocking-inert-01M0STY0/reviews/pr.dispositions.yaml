    reason: >
      REAL and correctly filed. The model_validate -> except ValidationError -> synthesize origin ->
      raise ManifestSchemaError pattern is now hand-duplicated across three modules
      (src/specify_cli/dossier/manifest.py, src/specify_cli/runtime/resolver.py,
      src/runtime/next/runtime_bridge_io.py) and the copies have already drifted. Charter Standing
      Order #5 ("close defect classes by construction") argues for extracting a shared helper.

      DEFERRED rather than folded in, for three reasons, stated so the deferral is auditable:
      (1) The concrete defect this mission was opened on is FIXED and verified three ways; this
          finding is about preventing a FOURTH future recurrence, not about a live defect.
      (2) The unification would edit src/specify_cli/dossier/manifest.py, which is OUTSIDE this
          mission's blast radius and absent from its diff. Charter's change-scope reconciliation
          makes Locality of Change the brake on growing the file set.
      (3) It would land AFTER the pre-merge squad completed, so the structural change would ship
          without squad review. Shipping unreviewed refactoring to mitigate a future-risk finding
          is the worse trade.
      Recorded in SPEC-KITTY-LEDGER.md and named in the PR body so a maintainer sees it rather
      than it living only in this trail.

