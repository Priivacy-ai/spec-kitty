findings:
- id: SPEC-GOV-001
  lens: AC numbering self-consistency (mission-derived)
  severity: 3
  title: Clarifications promises fresh AC-1..AC-N numbering "see below" but no such labels exist anywhere
    in the document
  evidence:
  - artifact: spec.md § Clarifications › "AC-10 / AC-13 / AC-14 — pre-existing, external, NOT this mission's
      numbering" (lines 80-84)
  - artifact: spec.md § User Scenarios & Testing › Acceptance Scenarios, both stories (lines 131-146,
      171-188)
  - artifact: spec.md § Requirements (FR-00N/NFR-00N/C-00N tables, lines 224-349) and § Success Criteria
      (SC-00N, lines 391-414)
  claim: 'The Clarifications section states verbatim: "This spec''s own acceptance criteria are numbered
    fresh (AC-1 onward, see below) to avoid confusion with the pre-existing AC-10/AC-13/AC-14" (line 80-81).
    This is a promise of a traceability scheme readable via "see below." A full-document scan finds zero
    occurrences of a standalone AC-1, AC-2, ... AC-N label anywhere in the rest of the spec (every "AC-1"-shaped
    substring match is only the digit prefix of the pre-existing external AC-10/AC-13/AC-14 references,
    which the same section explicitly disclaims as NOT this mission''s numbering). What the document actually
    has instead: unlabeled "Acceptance Scenarios" numbered 1/2/3 per user story (reset to 1 in each story,
    so "Scenario 2" is ambiguous without saying which story), plus a separately-prefixed SC-001..SC-007
    Success Criteria series and FR-00N/NFR-00N/C-00N requirement IDs. A reader who takes the Clarifications
    section at its word — e.g. a plan/tasks-phase author trying to cite "per AC-3" when writing a WP prompt''s
    acceptance mapping, or a reviewer cross-checking FR-to-AC coverage — will search the document for
    an AC-N label that does not exist, breaking the "see below" traceability promise made at the top of
    the spec.

    '
  remediation: 'Pick one and make the two sections agree: (a) add real AC-N labels to the Acceptance Scenarios
    so "1. Given... When... Then..." under User Story 1 becomes "AC-1. Given... When... Then..." (continuing
    AC-2, AC-3 for the rest of Story 1, then AC-4 onward for Story 2, so the numbering is unique across
    both stories rather than resetting per story) — the SC-00N Success Criteria section already demonstrates
    the target format spec-kitty templates expect, or (b) if scenario numbering per-story (not a flat
    AC-N series) is the intended final shape, rewrite the Clarifications sentence to stop promising "AC-1
    onward, see below" and instead say plainly that this mission''s acceptance criteria live in the unlabeled
    Acceptance Scenarios subsections, with SC-00N carrying the only formal ID series — so no reader is
    sent looking for labels the document never delivers.

    '
- id: SPEC-ARCH-001
  lens: MISSION-DERIVED — repo_root-threading layering check
  severity: 4
  title: FR-004/FR-008 describe the repo_root-optional-parameter shape but never require threading the
    already-in-scope repo_root through the intermediate call chain, so a literal implementation can leave
    the org tier unreached at every real runtime call site
  evidence:
  - artifact: 'spec.md § FR-004 (lines 268-278): "an optional repo_root: Path | None = None-shaped parameter...
      so this fix does not require every current call site to change shape simultaneously"'
  - artifact: 'spec.md § FR-003 (lines 260-266): names the tolerant wrapper, the composed-action guard,
      and both of runtime_bridge.py''s pre-check blocks as the "three call sites" that must converge'
  - artifact: 'spec.md § User Story 2 / AC1 (lines 173-177) and SC-003 (lines 401-403): the org manifest
      must actually be "the manifest actually consulted" by the live guard evaluation'
  - code: 'src/runtime/next/runtime_bridge_io.py:841 — _presence_filenames_for(mission_family: str) takes
      no repo_root/project_dir'
  - code: src/runtime/next/runtime_bridge_io.py:931 — gather_artifact_presence(feature_dir, *, mission_family,
      step_id, legacy_step_id=None) takes no repo_root either
  - code: 'src/runtime/next/runtime_bridge.py (CLI/WP-iteration pre-check function): _check_cli_guards(current_step_id,
      feature_dir) is called at ~line 1608 and ~line 1632 with no repo_root, even though repo_root is
      already a live local in the SAME enclosing function — e.g. `resolve_mission_path(mission_type, repo_root)`
      a few lines earlier and `_build_wp_iteration_decision(..., repo_root, ...)` right after the pre-check'
  - code: 'src/runtime/next/runtime_bridge_composition.py:504 — _dispatch_via_composition(*, repo_root:
      Path, ..., feature_dir: Path, ...) already receives repo_root as a REQUIRED keyword param, yet its
      own call to the guard at line 626 (`_rb._check_composed_action_guard(action, feature_dir, mission=mission,
      legacy_step_id=legacy_step_id)`) drops it'
  - code: 'src/specify_cli/dossier/manifest.py:193-194 — the cited precedent, ManifestRegistry.load_manifest(mission_type,
      repo_root: Path | None = None), for comparison'
  claim: 'FR-004/FR-008 accurately describe the repo_root-optional-parameter SHAPE of the ManifestRegistry.load_manifest
    precedent (verified real at dossier/manifest.py:193-194, including its documented org-roots-existence-filtering
    behavior in charter/org_expected_artifacts.py). Investigation for this review confirms repo_root IS
    genuinely available, unresolved, at every real production call site that reaches the guard-evaluation
    chain today: the enclosing CLI/WP-iteration dispatch function in runtime_bridge.py already holds repo_root
    as a local (used moments before AND after the two `_check_cli_guards(current_step_id, feature_dir)`
    calls), and `_dispatch_via_composition` in runtime_bridge_composition.py already receives repo_root
    as a required keyword parameter before it calls the composed-action guard. So the layering concern
    the lens was written to probe (missing repo_root, forcing a wider signature change) does NOT materialize
    — this is the good half of the finding. The bad half: FR-004''s own permissive framing ("does not
    require every current call site to change shape simultaneously") gives an implementer explicit license
    to add the optional parameter to `_presence_filenames_for` / `required_artifacts_for` without also
    updating `gather_artifact_presence`, `_check_cli_guards`, and `_check_composed_action_guard` (the
    three-plus sites FR-003 itself names as the convergence set) to actually pass the already-available
    repo_root down through the chain. None of FR-003, FR-004, or FR-008 states — as a requirement, not
    just a possibility — that these specific intermediate functions'' signatures MUST gain a repo_root
    parameter and MUST forward the real value they already hold. An implementation that adds the optional
    parameter deep in the call stack, satisfies FR-004''s literal text, and passes NFR-001 byte-compat
    for the four built-in families (which never exercise the org branch) could still leave every production
    caller passing repo_root=None (i.e., unchanged built-in-only behavior) — which would make User Story
    2 / AC1 and SC-003 (the org-tier manifest actually being consulted by the live runtime guard) fail,
    silently reproducing the exact "ships but nothing consumes it" defect class SK-79 already diagnosed
    for `required_artifacts_for` itself.

    '
  remediation: 'Add an explicit FR (or strengthen FR-004) stating that `gather_artifact_presence`, `_check_cli_guards`,
    and `_check_composed_action_guard` (runtime_bridge.py / runtime_bridge_composition.py) MUST each gain
    a `repo_root: Path | None = None` parameter and MUST forward the real, already-in-scope repo_root
    value from their own callers (name the two concrete sites: the CLI/WP-iteration dispatch function
    in runtime_bridge.py, and `_dispatch_via_composition` in runtime_bridge_composition.py) all the way
    down to `_presence_filenames_for` and `required_artifacts_for` — not merely that the leaf functions
    accept an optional parameter. Add an acceptance scenario or NFR that pins this end-to-end wiring directly
    (e.g., a test that patches `resolve_org_roots` and asserts it was invoked with the real repo_root
    when the CLI/WP-iteration path runs a custom family with an org-tier manifest), so "the parameter
    exists" cannot be mistaken for "the parameter is populated with a real value at every production call
    site."

    '
- id: SPEC-ARCH-002
  lens: Layering (kernel/doctrine/CLI seams) + Contracts
  severity: 4
  title: FR-001/FR-003/FR-006 imply the new manifest-consulting evaluation logic runs inside runtime_bridge_cores.py,
    which is bound by an active, non-vacuous architectural gate forbidding any non-stdlib import
  evidence:
  - artifact: 'spec.md § FR-001 (lines 239-245): "When _GUARD_TABLES.get(snapshot.mission_family) ...
      has no entry ... guard evaluation MUST consult that manifest''s blocking requirements ... instead
      of raising / degrading to []" — describing the exact branch `evaluate_guards_strict` already implements
      at runtime_bridge_cores.py:693-696'
  - artifact: 'spec.md § FR-003 (lines 260-262): explicitly names "the tolerant wrapper (evaluate_guards,
      runtime_bridge_cores.py:699-716)" as one of the sites that must "reach the same FR-001 evaluation"'
  - artifact: 'spec.md § FR-006 (lines 289-297): "the new FR-001 evaluator consulting required_artifacts_for(step,
      mission_type) ... against the family-scoped presence snapshot FR-005 gathers" — required_artifacts_for
      is an I/O-performing, non-stdlib-importing resolver.py function'
  - code: src/runtime/next/runtime_bridge_cores.py:676-696 — _GUARD_TABLES / evaluate_guards_strict, verified
      matching the FR-001-cited line range exactly
  - code: 'tests/architectural/test_bridge_cores_import_boundary.py:1-27 — "Import-boundary gate for runtime_bridge_cores.py''s
      zero-dependency-leaf invariant (WP04, C-007, IC-08)": an AST-walk (catches in-function/in-try imports,
      not just module-level) asserting zero non-stdlib import edges out of runtime_bridge_cores.py other
      than runtime.next.decision; this is a currently-passing, non-vacuous gate, not aspirational docstring
      text'
  - code: 'src/runtime/next/runtime_bridge_cores.py:354-360 — the module''s own _ArtifactPresenceSnapshotLike
      Protocol docstring: "cores.py stays a stdlib-only pure leaf (research.md §Import DAG: no runtime_bridge_io
      import here)"'
  - code: src/specify_cli/runtime/resolver.py:634-654 — required_artifacts_for calls _load_expected_artifact_manifest,
      which imports charter.missions.{ExpectedArtifactManifest,MissionTemplateRepository} (non-stdlib)
      to do disk I/O
  claim: 'FR-001''s text describes the new behavior as replacing the exact raise/degrade branch that lives
    inside `evaluate_guards_strict` (runtime_bridge_cores.py:693-696, confirmed the cited line range 676-681
    for `_GUARD_TABLES` is accurate). FR-003 goes further and explicitly names `runtime_bridge_cores.evaluate_guards`
    itself (not just its callers) as one of the sites that must "reach the same FR-001 evaluation." FR-006
    says that evaluation "consult[s] required_artifacts_for(step, mission_type)" — a resolver.py function
    whose only production implementation today performs disk I/O and imports `charter.missions` (confirmed
    non-stdlib). But `runtime_bridge_cores.py` is the subject of an ACTIVE, currently-green architectural
    gate (`tests/architectural/ test_bridge_cores_import_boundary.py`, referencing constraints C-007/IC-08
    from the prior `runtime-bridge-degod` mission) that walks the full AST — including in-function and
    in-`try` imports, not just module-level ones — and fails on ANY non-stdlib import out of that file
    other than `runtime.next.decision`. If an implementer follows FR-001/FR-003/ FR-006 literally and
    adds the manifest-consulting fallback (which needs `required_artifacts_for`, hence `charter.missions`/`doctrine.missions`,
    hence non-stdlib imports) directly into `evaluate_guards_strict` or `evaluate_guards` in cores.py,
    this currently-green gate goes red immediately — a genuine contradiction between what the FRs literally
    ask for and what the codebase''s own enforced invariant permits. The spec never states the correct
    resolution (most likely: the required-blocking-artifact-name set must be computed during the I/O-gathering
    phase in runtime_bridge_io.py and threaded into ArtifactPresenceSnapshot as a NEW field, e.g. `blocking_artifact_names`,
    so cores.py''s evaluator stays a pure function of snapshot data it is merely handed — never a caller
    of `required_artifacts_for` itself), so this design decision is currently left to whichever WP implementer
    discovers the gate failure, rather than being settled at spec/plan time.

    '
  remediation: 'Either (a) amend FR-006 to state explicitly that the manifest''s blocking-filtered filename
    set is computed in the I/O layer (runtime_bridge_io.py, alongside `_presence_filenames_for`) and passed
    into `ArtifactPresenceSnapshot` as a new field — keeping `runtime_bridge_cores.py`''s evaluator a
    pure function of the snapshot, so `test_bridge_cores_import_boundary.py` stays green by construction
    — and update FR-001/ FR-003''s wording so they no longer read as if the manifest consultation happens
    inside `evaluate_guards_strict`/`evaluate_guards` themselves; or (b) if the intent genuinely is to
    relax the cores.py zero-dependency-leaf invariant for this one case, say so explicitly as a Non-Goal
    exception with its own FR, name `test_bridge_cores_import_boundary.py` as a test that must be updated
    (with the ADR/C-007/IC-08 rationale it enforces reconciled), and get that reclassification decided
    at spec/plan time rather than discovered mid-WP. Either way, add data-model.md language (at plan phase)
    pinning where the new field/data lives so no two WP implementers make different choices.

    '
- id: SPEC-VERIFY-001
  lens: mission-derived (NFR-004 coverage-floor claim falsifiability)
  severity: 4
  title: 'NFR-004 misattributes the mechanism that keeps test_coverage_floor_is_met''s guard-branch floor
    at 18 to FR-005, when the test''s own docstring credits a different, unrelated family-scoping fix

    '
  evidence:
  - artifact: spec.md § NFR-004 (line 339)
  - artifact: spec.md § FR-005 (lines 280-287)
  - code: tests/runtime/test_bridge_parity.py:1170-1195 (comment block directly above `_GUARD_BRANCH_FLOOR
      = 18` at line 1196)
  - code: tests/runtime/test_bridge_parity.py:1245-1263 (`test_non_software_dev_missing_artifact_owned_by_composed_guard`
      docstring)
  - code: 'src/runtime/next/runtime_bridge.py:1626-1642 (`_check_cli_guards` scoped to `MISSION_TYPE_SOFTWARE_DEV`
      only, #3407/M3 comment)'
  - code: src/runtime/next/runtime_bridge_io.py:851-873 (`_presence_filenames_for` docstring — the actual
      FR-005 mechanism)
  claim: 'NFR-004 states: "FR-005''s family-scoping preservation is the specific mechanism that keeps
    [the guard-branch floor at 18] from regressing (see the docstring rationale on `_GUARD_BRANCH_FLOOR`)."
    This is checked against the actual test file and is factually wrong. The comment block immediately
    preceding `_GUARD_BRANCH_FLOOR = 18` (test_bridge_parity.py lines 1170-1195) explains the floor''s
    18-vs-16 history entirely in terms of a DIFFERENT, unrelated regression: an earlier WP06 revision
    that made the CLI pre-check (`_check_cli_guards`, called from `runtime_bridge.py`''s non-WP pre-check
    at ~line 1642) "unconditional" instead of scoped to the software-dev family, which wrongly routed
    research''s "scoping" and documentation''s "discover" guards through the CLI pre-check instead of
    the composed guard and dropped the floor from 18 to 16 (#3407/M3). The test''s `test_non_software_dev_missing_artifact_owned_by_composed_guard`
    exists specifically to pin that this CLI-pre-check family-scoping stays correct. FR-005 is about an
    entirely separate code path and an entirely separate historical incident: `_presence_filenames_for`''s
    family-scoped (not step-scoped) artifact-name gathering in `runtime_bridge_io.py`, whose own docstring
    (lines 851-873) documents a different reverted attempt (a step-scoped redesign that spuriously blocked
    software-dev''s composed `tasks` guard and `plan`''s `specify`/`plan` guards). Nothing in that docstring,
    or anywhere in test_bridge_parity.py, ties FR-005''s mechanism to the guard-branch floor''s 18-vs-16
    count. The two "family-scoped" fixes share vocabulary but are unrelated code paths (`runtime_bridge_io.py`
    presence-gathering vs. `runtime_bridge.py` CLI-pre-check dispatch scoping), and NFR-004 conflates
    them. This is not a cosmetic error: this mission''s own FR-003 requires converging all three guard-dispatch
    call sites — including the exact `runtime_bridge.py` CLI-pre-check block whose software-dev-only scoping
    is the real floor-preserving mechanism. NFR-004, as written, points implementers/reviewers at FR-005
    preservation as the regression-risk signal for `test_coverage_floor_is_met`, when the actual risk
    this mission is likely to reintroduce (given FR-003 touches guard dispatch at exactly this call site)
    is a repeat of the WP06/#3407 regression the test file documents — not anything to do with FR-005''s
    `_presence_filenames_for` change.

    '
  remediation: 'Correct NFR-004''s rationale to cite the actual mechanism: the family-scoping of `_check_cli_guards`/the
    non-WP CLI pre-check to the `software-dev` mission family (`runtime_bridge.py`, ~line 1642, #3407/M3),
    verified by `test_non_software_dev_missing_artifact_owned_by_composed_guard`, which must continue
    to hold after FR-003''s call-site convergence. Either drop the FR-005 attribution entirely, or explicitly
    note that FR-005 and this NFR-004 risk are two distinct family-scoping mechanisms in two different
    modules that must independently be preserved. Add an explicit cross-reference from FR-003''s implementation
    guidance to `test_non_software_dev_missing_artifact_owned_by_composed_guard` as the regression guard
    for the call-site-convergence work specifically.

    '
- id: SPEC-VERIFY-002
  lens: baseline honesty
  severity: 3
  title: 'spec.md never acknowledges the accepted-baseline known-red tests (issue #3284) despite NFR-003
    mandating red-first/green verification on a stacked, unmerged base branch

    '
  evidence:
  - artifact: spec.md § NFR-003 (line 338)
  - artifact: spec.md § Clarifications (lines 42-46)
  - code: CLAUDE.md § Test-run baseline-red gotcha (repo root)
  claim: '`main` carries ~23 known-red tests and 2 errors (issue #3284) as accepted baseline, and CLAUDE.md
    documents a three-way classification protocol (pre-existing known-P0 reds, CI-environment failures,
    stale-install false reds) any agent must apply before attributing a red test to its own diff. spec.md''s
    NFR-003 says "green is verified on the WP''s final commit" but nowhere in the spec — not in NFR-003,
    not in the Clarifications stacking note, not in Edge Cases — does it acknowledge that a broad test
    run on this mission''s actual base (`fix/org-tier-expected-artifacts-3703`, itself built on `main`)
    will surface pre-existing red/error noise unrelated to this mission''s own changes. Given the mission
    is explicitly stacked on an unmerged branch (a deliberate, unusual setup called out at length in Clarifications),
    omitting any baseline-red guidance here is a gap: a WP implementer or reviewer verifying NFR-003''s
    "green" bar has no spec-level signal to distinguish genuine regressions introduced by this mission
    from baseline noise already present on the stacked branch, and no acknowledgment that the ~23/2 baseline
    count from #3284 may differ once #3703''s own changes are included.

    '
  remediation: 'Add a sentence to NFR-003 (or a new Edge Case) stating the accepted baseline explicitly
    for this mission''s actual base branch: point WPs at re-running the narrow test files this mission
    touches on `fix/org-tier-expected-artifacts-3703` (not `main`) before implementation to establish
    the mission''s own true-red baseline, and reference CLAUDE.md''s baseline-red classification protocol
    so "green is verified" in NFR-003 is unambiguous about what counts as green.

    '
- id: SPEC-VERIFY-003
  lens: mission-derived (code-citation accuracy, falsifiability of FR-001)
  severity: 2
  title: 'FR-001''s line citation for `_GUARD_TABLES.get(snapshot.mission_family)` points at the dict''s
    declaration, not the `.get()` call site

    '
  evidence:
  - artifact: spec.md § FR-001 (lines 239-245)
  - code: src/runtime/next/runtime_bridge_cores.py:676-681 (the `_GUARD_TABLES` dict literal)
  - code: src/runtime/next/runtime_bridge_cores.py:693 (the actual `_GUARD_TABLES.get(snapshot.mission_family)`
      call, inside `evaluate_guards_strict`)
  claim: 'FR-001 cites `_GUARD_TABLES.get(snapshot.mission_family)` at `runtime_bridge_cores.py:676-681`.
    That range is the `_GUARD_TABLES` dict''s literal definition (the 4-key table: research/documentation/
    software-dev/plan) — it contains no `.get()` call. The actual `_GUARD_TABLES.get(snapshot.mission_family)`
    expression is one function down, at line 693, inside `evaluate_guards_strict`. Low-impact (the surrounding
    FR-001 prose correctly describes the semantics, and the dict itself is real and at the cited lines),
    but it is the one code-citation slip found across an otherwise fully-verified set of ~12 code citations
    checked in this spec.

    '
  remediation: 'Update the FR-001 citation to `runtime_bridge_cores.py:676-681,693` (or just `:693`) to
    point at the actual `.get()` dispatch call, keeping `:676-681` only if explicitly labeled as the table
    declaration.

    '
