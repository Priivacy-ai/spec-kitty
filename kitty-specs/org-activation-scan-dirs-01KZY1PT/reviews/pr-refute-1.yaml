verdicts:
  - id: PR-BOUNDARY-001
    verdict: refuted
    reason: >-
      The finding's own cited evidence ("no subclass in src/doctrine/*.py overrides
      it" re: base.py's non-recursive _project_scan) is factually wrong: grep plus a
      live execution check show StyleguideRepository (src/doctrine/styleguides/repository.py:59-61)
      and AssetRepository (src/doctrine/assets/repository.py:130-132) both override
      _project_scan to rglob; I constructed a StyleguideRepository with an org_dir
      whose only content sat under <root>/styleguides/built-in/ and confirmed the
      item loaded (id present in list_all()) -- so for styleguide kind the live
      loader DOES read an org pack's nested built-in/ subdirectory, contradicting the
      finding's universal "never, before or after this diff" claim. Independently,
      the live file at current HEAD no longer contains the quoted "kept only for
      backward compatibility" docstring text at all -- commit 7ac9b2fa0 already
      reworded both the _scan_roots and _org_scan_dirs docstrings to state plainly
      that DoctrineService/BaseDoctrineRepository's org-layer scan never reads the
      legacy nested shape, which is exactly the finding's own requested remediation.
  - id: PR-BOUNDARY-002
    verdict: confirmed
    reason: >-
      Empirically reproduced on the live code: with org_roots=[rootA (legacy-only,
      <root>/directives/built-in/<stem>.directive.yaml), rootB (flat-only,
      <root>/directives/<stem>.directive.yaml)] and a colliding config stem,
      resolve_artifact_urn(ArtifactKind.DIRECTIVE, stem, org_roots=[rootA, rootB])
      returned "directive:DIRECTIVE_LEGACY_A", not rootB's flat "DIRECTIVE_FLAT_B" --
      _org_scan_dirs (kind_vocabulary.py:239-247) is confirmed interleaved per root,
      not globally flat-before-legacy. tests/charter/test_kind_vocabulary_scan_roots.py::test_same_config_stem_precedence_flat_wins
      (current HEAD) still only passes org_roots=[org_root] (a single root) and its
      docstring still asserts unqualified "never a result that depends on incidental
      scan order" with no multi-root regression test added -- even after commit
      7ac9b2fa0 reworded the _org_scan_dirs docstring to disclose the cross-root
      limitation (spec.md C-001), that disclosure is documentation of a real,
      unfixed, untested precedence gap, not a fix of it.
