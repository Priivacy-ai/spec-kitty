findings:
  - id: PR-CONTRACT-001
    lens: architectural single-authority ratchet (line-pinned allowlist)
    severity: 4
    title: >-
      The diff moves the org-tier "built-in" filesystem join to a new source
      line without updating the exact-(file,lineno) allowlist entry that
      pins it in tests/architectural/test_built_in_location_authority.py,
      so that CI ratchet test will fail on this branch
    evidence:
      - artifact: "diff origin/main...HEAD"
      - code: "src/charter/kind_vocabulary.py:224 (post-diff: `legacy = flat / \"built-in\"`, a `<path> / \"built-in\"` filesystem-join BinOp)"
      - code: "tests/architectural/test_built_in_location_authority.py:206 (`_KNOWN_JOIN_ALLOWLIST` entry: `(Path(\"src/charter/kind_vocabulary.py\"), 206)` -- pinned to the OLD line, last refreshed 2026-08-11 per the entry's own comment: \"the join was extracted out of _scan_roots into _org_scan_dirs ... moving it from line 183 to 206\")"
      - code: "tests/architectural/test_built_in_location_authority.py:270-298 (_find_builtin_joins: flags any `ast.BinOp` with `op=Div` whose right operand is the `ast.Constant` \"built-in\" -- explicitly designed to catch variable-indirected joins like `flat / \"built-in\"`, not just the direct `root / kind.plural / \"built-in\"` chain)"
      - code: "tests/architectural/test_built_in_location_authority.py:305-325 (test_no_builtin_path_joins_outside_pack_paths_authority: `remaining = sorted(lineno for lineno in offending_lines if (rel, lineno) not in _KNOWN_JOIN_ALLOWLIST)`; fails if `remaining` is non-empty)"
      - artifact: "empirical AST verification (python3, no pytest/uv invocation, no tree mutation): parsed the current src/charter/kind_vocabulary.py with the stdlib ast module and re-implemented the test's exact BinOp/Constant('built-in') detection -- confirmed the sole offending join in this file is now at line 224, not 206"
    claim: >-
      Pre-diff, `_org_scan_dirs` built its one candidate directory as a
      single chained join `root / kind.plural / \"built-in\"` at line 206 of
      origin/main:src/charter/kind_vocabulary.py (confirmed via `git show
      origin/main:src/charter/kind_vocabulary.py | grep -n "candidate = root"`
      -> line 206), which is exactly the line the architectural ratchet's
      `_KNOWN_JOIN_ALLOWLIST` names as the one deliberately-exempted
      org-tier "built-in" join in this file. The diff splits that single
      join into two statements -- `flat = root / kind.plural` (line 221,
      not itself a "built-in" join, so it is invisible to the C3.1 filesystem-
      join limb) and `legacy = flat / \"built-in\"` (line 224, which IS a
      `<path> / \"built-in\"` filesystem join and gets flagged). The
      allowlist entry was not moved to the new line. Since the allowlist
      check is `(rel, lineno) not in _KNOWN_JOIN_ALLOWLIST` with an exact
      line-number key (not a per-file exemption, by explicit design --
      "Each site below is allowlisted by exact (file, lineno), not by file,
      so any FUTURE join added to these files still fails the gate"), the
      newly-relocated join at line 224 is treated as an undocumented sixth
      resolver being reborn and `test_no_builtin_path_joins_outside_pack_paths_authority`
      will fail on this branch. This is a real, mechanical regression this
      diff introduces (verified by re-running the test's own AST-detection
      logic directly against the post-diff file with a standalone python3
      script -- no pytest/uv invocation was needed or used, respecting the
      run constraint), not a hypothetical: the allowlist comment itself
      documents that this exact site was "FRESHENED 2026-08-11 (#3317
      landing)" the last time its line number drifted, establishing that
      this file is actively watched and expected to be kept in sync on
      every touch.
    remediation: >-
      Update the `_KNOWN_JOIN_ALLOWLIST` entry in
      tests/architectural/test_built_in_location_authority.py from
      `(Path("src/charter/kind_vocabulary.py"), 206)` to
      `(Path("src/charter/kind_vocabulary.py"), 224)` (the new location of
      the `flat / "built-in"` join), and refresh the adjacent "FRESHENED"
      comment to record this mission's landing and the new rationale (the
      join now reads the pre-existing `flat` variable rather than
      re-deriving `root / kind.plural` inline, but is otherwise the same
      org-tier legacy-shape join this allowlist entry has always covered).
      Confirm with `uv run pytest tests/architectural/test_built_in_location_authority.py -q`
      once the shared-venv lock contention (#3283) clears, outside this
      squad's restricted run window.
