findings:
  - id: PLAN-FRESH2-001
    lens: cross-section-consistency
    severity: 3
    title: "The Seam's \"Production surface ... only\" bullet still contradicts Campsite-Clean Scope's docstring mandate — round-2 fixed Project Structure but left this bullet unpatched"
    evidence:
      - artifact: "plan.md § The Seam — \"**Production surface**: `src/charter/activation/kind_vocabulary.py`, function `_org_scan_dirs` (`:200-209`) only. Its caller (`_scan_roots`, `:142-180`) ... are unchanged\""
      - artifact: "plan.md § Campsite-Clean Scope — \"the implementing WP must update this docstring sentence\" (the `_scan_roots` docstring at `src/charter/activation/kind_vocabulary.py:158-160`)"
      - artifact: "plan.md § Project Structure (round-2 fix) — \"kind_vocabulary.py  # _org_scan_dirs (:200-209) fix, plus the _scan_roots docstring update at :158-160 (see Campsite-Clean Scope)\""
    claim: >
      Round 1 flagged this exact contradiction (Project Structure's "the only production edit"
      vs. Campsite-Clean Scope's new docstring mandate) and the round-2 fix commit correctly
      rewrote Project Structure to name both edits. But The Seam section's "Production surface"
      bullet — a few paragraphs earlier in the same document — makes the identical claim the
      round-2 fix was supposed to eliminate: it names `_org_scan_dirs (:200-209)` as the
      production surface "only" and explicitly states `_scan_roots` "are unchanged," with no
      mention of the docstring edit Campsite-Clean Scope mandates a few sections later. The
      round-2 fix patched one echo of the round-1 contradiction and left an equally explicit
      second echo standing three sections earlier in the same file. A reader who stops at The
      Seam (which is read before Campsite-Clean Scope and Project Structure) is told the caller
      is untouched; a reader who continues to Campsite-Clean Scope is told the WP "must" edit
      that same caller's docstring. The two claims cannot both be true as written.
    remediation: >
      Update The Seam's "Production surface" bullet to match Project Structure's fixed language:
      note that `_org_scan_dirs` is the sole *behavioral* edit and `_scan_roots`'s call-chain
      logic is unchanged, but its docstring at `:158-160` is also edited (cross-reference
      Campsite-Clean Scope) so "only" and "unchanged" no longer overstate the diff's shape.

  - id: PLAN-FRESH2-002
    lens: citation-accuracy
    severity: 2
    title: "_resolve_graph_kind_parity_stem is cited with two different, non-matching line ranges within the same section"
    evidence:
      - artifact: "plan.md § The Seam (unchanged by round-2 fix) — \"`charter.activation.consistency_check`'s config↔graph parity guard (`_check_reference_id_parity`, `:744-748`; `_resolve_graph_kind_parity_stem`, `:815-817`) — both pass real `org_roots` today.\""
      - artifact: "plan.md § The Seam (round-2 fix, two sentences later) — \"`_resolve_graph_kind_parity_stem` (`:815-819`) appends to `verification_errors`/`suggestions` from within its own `except` block\""
      - code: "src/charter/activation/consistency_check.py:814-819 — try: (814); urn = resolve_artifact_urn(...) spans 815-817; except UnknownArtifactIdError as exc: (818); verification_errors.append(...) (819)"
    claim: >
      The round-2 fix commit rewrote the consistency_check.py paragraph to add a second,
      more precise citation of `_resolve_graph_kind_parity_stem` at `:815-819` (correctly
      including the `except`/`append` lines that the new sentence's claim depends on), but it
      did not update the earlier, untouched citation of the same function two sentences prior,
      which still reads `:815-817` (just the `resolve_artifact_urn` call, no append). Both
      ranges are individually defensible for what each sentence is pointing at, but placed two
      sentences apart in the same paragraph, citing the same function by name with two different
      ranges reads as a citation slip introduced by the round-2 edit itself (before this diff,
      the function was cited only once, at `:815-817`, per round 1's own evidence).
    remediation: >
      Pick one range for `_resolve_graph_kind_parity_stem` and use it consistently in both
      sentences — `:815-819` (the fuller range, since it is what the second sentence's claim
      about appending actually needs) is the more defensible choice; update the first citation
      to match.

