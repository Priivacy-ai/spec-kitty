round: 2
note: >
  R6 gate: reviews/spec-verify.yaml (round 1) showed all 5 confirmed findings resolved
  (no unresolved carried forward). reviews/spec-fresh.yaml (round 1's fresh sweep) found
  3 new findings against the round-1 fix commit (b33138a42) — per protocol, ANY fresh-sweep
