      now actively contradicts the corrected behavior at the call site a maintainer would
      read first when tracing this exact code path. Anyone reading only this docstring
      after the fix lands will conclude the override lives at the old, now-dead location.
    recommendation: >
      Update the FR-008 docstring paragraph on `ManifestRegistry.load_manifest`
      (src/specify_cli/dossier/manifest.py, around line 221) to read
      `<org_root>/missions/<mission_type>/expected-artifacts.yaml`, matching the corrected
