      this diff (`git diff 3442ca1af..HEAD -- src/specify_cli/dossier/manifest.py` is empty)
      and the same wrong path string is present verbatim at the pre-fix commit
      (`git show 3442ca1af:src/specify_cli/dossier/manifest.py` lines 221), so this is not
      pre-existing unrelated debt outside the mission's blast radius — it is the second of
      the two documented callers of the function this PR fixes
      (org_expected_artifacts.py's own module docstring names both
      `charter.mission_type_profiles._resolve_expected_artifacts_slot` and
