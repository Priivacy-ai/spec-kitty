findings:
  - id: TASKS-FRESH3-001
    lens: fresh
    severity: 3
    title: T006's new rationale cites a charter.md quote that does not exist in this repo
    evidence:
      - artifact: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/tasks/WP01-org-tier-expected-artifacts-anchor-fix.md:376-378"
      - code: "\"...this repo's real PRs open FROM a mission branch INTO `main` (CLAUDE.md, \\\"All changes to origin/main MUST go through pull requests\\\"; charter.md, \\\"Base branch here is `main`\\\")...\""
    claim: >
      The revised T006 step-4 rationale (introduced in commit 5abbaa21b) attributes the quote
      "Base branch here is `main`" to charter.md (i.e. .kittify/charter/charter.md in this
      checkout). `grep -n "Base branch" .kittify/charter/charter.md` returns nothing — the
      string does not appear anywhere in charter.md, nor anywhere else in this repo
      (spec-kitty). The actual source of that exact sentence ("Base branch here is **`main`**
      — not `develop`. That differs from `../team-kitty-missions/`.") is the outer
      /home/jeroennouws/dev/SK-missions/CLAUDE.md — a different repository/directory entirely,
      one that governs the mission-orchestration workspace, not spec-kitty itself, and one a
      future implementer/reviewer working only inside this checkout has no reason to consult
      or ability to cite as this repo's doctrine. The CLAUDE.md quote in the same sentence
      ("All changes to origin/main MUST go through pull requests") is independently verified
      correct (this repo's own CLAUDE.md:54), but pairing it with a fabricated charter.md
      citation undermines the decision trail's auditability: a reviewer who greps charter.md
      for that phrase (as this review did) finds nothing, casting doubt on the rest of the
      paragraph's otherwise-correct reasoning (verified separately: `git rev-parse
      fix/org-tier-expected-artifacts-3703 HEAD` do return identical SHAs in this checkout,
      `origin/main` does resolve, and the underlying conclusion — use `origin/main` as
      --compare-branch — is technically sound and consistent with plan.md's canonical
      `--compare-branch=origin/<base>` form). Per Debugger Debbie's directive 003
      (Decision Documentation Requirement), a binding-contract WP file's cited evidence must
      be independently verifiable; this citation is not.
    remediation: >
      Drop the "charter.md, \"Base branch here is `main`\"" citation, or replace it with an
      accurate source. If the intent was to point at this repo's own governance for why `main`
      is the real integration branch, cite CLAUDE.md's existing PR-requirement line alone (it
      already supports the claim on its own), or cite charter.md's actual branch-strategy
      section (`.kittify/charter/charter.md` lines ~322-375, "Architecture: Branch and Release
      Strategy" / "CI and Branch Protection", which does establish `main` as the protected
      integration branch, just not with the quoted sentence). Do not attribute a sentence to a
      file that does not contain it.
