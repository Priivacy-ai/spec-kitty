verdicts:
  - id: PR-MERGED-001
    verdict: upheld
    reason: >-
      Accuracy fully verified against the filesystem, not trusted from prose. `grep -n
      "FR-008\|org_root>/<mission_type>" src/specify_cli/dossier/manifest.py` confirms the
      docstring text sits at exactly line 221 as claimed. `git diff 3442ca1af..HEAD --
      src/specify_cli/dossier/manifest.py` is empty and `git show 3442ca1af:...manifest.py`
      (lines 219-228) is byte-identical to HEAD -- the file genuinely was not touched by
      this diff. `ManifestRegistry.load_manifest` is a real, live caller of
      `resolve_org_expected_artifacts` (manifest.py:273, inside an `if org_roots:` block
      feeding straight into the org-tier parse path) -- not a stale/dead code path. Critical
      nuance the finding gets right but does not fully spell out: pre-fix, the resolver's
      actual join was `org_root / mission_type / filename`, which is EXACTLY what this
      docstring describes -- so pre-fix the docstring was TRUE, describing real (if buggy)
      behavior. This diff's one-line anchor change (org_expected_artifacts.py:88, adding the
      "missions" segment) is what flipped this docstring from true to false. That makes this
      genuine, direct fallout of the fix -- the same "docstring says X, code does Y" defect
      class the mission exists to eliminate -- not pre-existing, unrelated debt merely
      adjacent in topic.
      Scope disposition (the judgment call this lens asked for): despite being a real and
      fix-caused defect, I recommend AGAINST fixing it inside this PR, i.e. against
      expanding C-001's six-file set. C-001's own spec.md addendum (2026-08-24) already shows
      the actual bar the reconciler applies for forced file-set expansion: three tests/dossier
      files were added mid-mission specifically because omitting them would flip
      currently-GREEN tests to RED -- a functional-regression bar. This docstring fix crosses
      no such bar: SC-003's full test suite is unaffected whether or not manifest.py:221 is
      corrected, and both source lenses that surfaced this (architect-alphonso,
      reviewer-renata) independently wrote their own recommendation as "fast-follow ... does
      not reopen C-001's six-file scope" / "Do not fix in this PR." The merged artifact's
      recommendation text ("Correct the docstring ... in step with the resolver's own
      corrected docstring") drifts toward implying an in-PR fix beyond what either source
      lens actually asked for -- that drift should not be read as license to expand scope.
      Net: finding is real and should be filed as a fast-follow (ledger entry or new issue),
      not folded into this PR.
      Severity note: lowering 2->3. Sev 2 implies "should fix before merge," which
      contradicts both source lenses' own text calling this non-blocking and out of C-001
      scope ("fast-follow," "Do not fix in this PR"); 3 aligns severity with the correct
      disposition (real, fix-caused defect, but non-blocking fast-follow).
    severity_adjusted: 3

  - id: PR-MERGED-002
    verdict: upheld
    reason: >-
      Same evidence class as PR-MERGED-001, independently re-verified. `grep -n "FR-008"
      src/charter/mission_type_profiles.py` confirms the docstring is at line 1030 exactly.
      `git diff 3442ca1af..HEAD -- src/charter/mission_type_profiles.py` is empty; `git show
      3442ca1af:...mission_type_profiles.py` lines 1025-1036 is byte-identical to HEAD.
      Confirmed `_resolve_expected_artifacts_slot` (function signature verified at line
      1012, docstring immediately below) is a genuine live caller: its body (line ~1032-1036,
      read directly) calls `resolve_org_expected_artifacts(org_roots, mission_type)` and
      returns the org result when non-None -- not a documented-but-dead path. Same true-before
      /false-after nuance as PR-MERGED-001 applies (pre-fix the docstring's path matched the
      pre-fix resolver join exactly). One scope wrinkle specific to this finding, also
      verified: the mission's C-001 six-file set already OWNS this module's TEST file
      (tests/charter/test_mission_type_profiles.py, file 3 of 6) but not this SOURCE file
      (src/charter/mission_type_profiles.py) -- confirmed by reading spec.md's C-001 row
      directly, which names exactly those six files and no others.
      Scope disposition: same recommendation as PR-MERGED-001 and for the identical reason --
      real, fix-caused defect; does not cross C-001's demonstrated functional-regression bar
      for forced scope expansion; both source lenses themselves said "not a blocker for this
      PR under C-001." File as a fast-follow alongside PR-MERGED-001, do not expand this PR's
      six-file set.
      Severity note: lowering 2->3, same rationale as PR-MERGED-001 -- sev 2 ("fix before
      merge") contradicts the source lenses' own "do not fix in this PR" framing.
    severity_adjusted: 3

  - id: PR-MERGED-003
    verdict: upheld
    reason: >-
      MEASURED, not reasoned about, per instruction -- this is the load-bearing verdict of
      this trail. Read the test directly: `tests/dossier/test_rebaseline.py`, method
      `test_malformed_org_pack_does_not_raise`, starts at line 643 exactly (grep-confirmed,
      not a misleading line-number citation). Its fixture at lines ~663-666 builds
      `malformed_dir = org_root / "software-dev"` directly -- confirmed by reading the method
      body -- bypassing `_write_org_manifest` (defined earlier in the same file at line 494),
      which the diff correctly retargeted to `org_root / "missions" / mission_type`. Every
      other org-pack test in the same class (`TestRebaselineOrgAwareness`) uses
      `_write_org_manifest`; this one method alone constructs its own path inline at the old,
      pre-fix anchor.
      Direct empirical proof of vacuity (ran against the actual checked-out
      `charter.org_expected_artifacts` module, no repo files modified): reproduced the test's
      exact fixture (malformed YAML at `org_root/"software-dev"/expected-artifacts.yaml`) and
      called `resolve_org_expected_artifacts([org_root], "software-dev")` against it.
      Result: returns `None`, and -- critically -- NO warning is logged, and
      `(org_root/"missions"/"software-dev"/expected-artifacts.yaml).is_file()` is `False`:
      the resolver's actual (post-fix) join never reaches the file the test wrote at all.
      Confirmed the malformed-YAML branch is genuinely unreachable in this test by writing
      the identical malformed content at the CORRECTED anchor instead: that run DOES log
      "Org-tier expected-artifacts file ... failed to parse (...); falling back as if no org
      override were present" via `logger.warning` in `_read_yaml_mapping`'s except-YAMLError
      branch -- proving the warning path exists and is reachable in general, just not from
      this test's actual fixture location. Also ran the real test via pytest directly
      (`pytest tests/dossier/test_rebaseline.py::TestRebaselineOrgAwareness::
      test_malformed_org_pack_does_not_raise -s --log-cli-level=WARNING`): it PASSES, and
      zero warning lines are emitted -- consistent with the standalone reproduction. The test
      passes on the "no org file found" path, not the "found, failed to parse, gracefully
      degraded" path its own docstring and FR-003 AC4 claim to cover.
      Fix-caused, not pre-existing debt (the finding's own claim, independently re-derived):
      simulated the PRE-FIX resolver join (`org_root / mission_type / filename`, i.e. dropping
      the "missions" segment) against the same fixture -- that path is byte-identical to
      where the test writes its file, and reading it DOES trigger the YAMLError branch and the
      warning. So before this diff landed, this exact test genuinely exercised the
      malformed-YAML graceful-degrade path; the diff's anchor change (adding "missions" to the
      join) is what silently stranded it. This is authentic mission fallout, not something
      that predates the fix.
      Scope claim verified and correct: read spec.md's C-001 row directly --
      `tests/dossier/test_rebaseline.py` is listed verbatim as one of the exact six files
      (position 5 of 6). Fixing this test requires zero scope extension; it is squarely
      inside the mission's own declared file set.
