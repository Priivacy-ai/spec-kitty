findings:
- id: PLAN-GOV-001
  lens: Campsite scope
  severity: 3
  title: Plan's six-file survey misses the same docstring-drift defect (FR-002's own class) in both of
    the resolver's direct production callers
  evidence:
  - artifact: plan.md § Campsite-Clean Scope (lines 311-334)
  - artifact: plan.md § Seam (lines 99-122), which names both callers directly
  - artifact: plan.md § Project Structure (lines 90-93), which declares `resolver.py` and `manifest.py`
      'read-only references... neither is edited by this mission' with no mention of their docstrings
  - code: 'src/charter/mission_type_profiles.py:1030 — `_resolve_expected_artifacts_slot`''s own docstring:
      "FR-008 (WP05): an org-pack ``<org_root>/<mission_type>/expected-artifacts.yaml``..."'
  - code: 'src/specify_cli/dossier/manifest.py:219-221 — `ManifestRegistry.load_manifest`''s own docstring:
      "FR-008 (WP05): when *repo_root* is given... an org-pack ``<org_root>/<mission_type>/expected-artifacts.yaml``
      (see :func:`charter.org_expected_artifacts.resolve_org_expected_artifacts`, contract C-4) takes
      precedence..."'
  - code: src/charter/org_expected_artifacts.py:82 (FR-001's fix target) and FR-002 (the docstring fix
      inside that same file, lines 51-79)
  claim: 'The plan''s Campsite-Clean Scope section states it read "all six files" and found "no dead/duplicated
    code... beyond the FR-003/004/005 duplication," and its Seam section names the resolver''s exact two
    production callers (`_resolve_expected_artifacts_slot` in src/charter/mission_type_profiles.py, and
    `ManifestRegistry.load_manifest` in src/specify_cli/dossier/manifest.py) only to assert their "signature,
    call site, or control flow" is unaffected. Independent verification shows each of those two callers
    carries its OWN docstring prose that also states the pre-fix, wrong path (`<org_root>/<mission_type>/expected-artifacts.yaml`,
    no `missions/` segment) — the exact defect class FR-002 exists to eliminate ("so the mismatch between
    the docstring''s precedence/merge-semantics detail and the actual path can never again be invisible
    to a reader of one side alone"). Neither `src/charter/mission_type_profiles.py` nor `src/specify_cli/dossier/manifest.py`
    (the production modules, as opposed to their test files, which ARE in the six-file set) is touched
    by this mission, so both docstrings will describe the now-INCORRECT path immediately after FR-001/FR-002
    land — reintroducing, in the resolver''s two sole direct callers, the identical "docstring says X,
    code does Y" hazard this mission was chartered to remove from the resolver itself. This is a direct,
    domain-matched, proportional connection to the stated defect (Standing Order #2 / `RECONCILE_CHANGE_SCOPE_TENSIONS`''s
    Boy Scout test), not adjacent unrelated cleanup, yet the plan''s six-file survey and its explicit
    "no campsite-clean needed" verdict never surface or weigh it — unlike the C-007 frozen contract doc,
    which the plan DOES name and deliberately defer with a stated rationale.

    '
  remediation: 'Either (a) extend C-001''s file set by the two one-line docstring corrections in `src/charter/mission_type_profiles.py:1030`
    and `src/specify_cli/dossier/manifest.py:219-221` (same edit shape as FR-002, applied to the resolver''s
    two direct callers — this is production-code drift, not test maintenance, so it does not disturb the
    FR-003/004/005 test-regression rationale that justified the five-file test expansion), or (b) if the
    plan-author''s judgment is that C-001''s six-file ceiling should hold exactly as operator-decided,
    add an explicit, stated deferral for these two docstrings (mirroring the C-007 treatment of the frozen
    contract doc) rather than leaving the gap unweighed and unmentioned, so a future reader/ledger sweep
    can find it deliberately, not by accident.

    '
- id: PLAN-ARCH-001
  lens: frozen-contract-doc boundary
  severity: 3
  title: FR-002's docstring fix leaves the module docstring's "Contract C-4" citation pointing at a frozen
    doc that still shows the old, wrong path, with no caveat added
  evidence:
  - artifact: plan.md § Contracts
  - artifact: spec.md § FR-002, § C-007
  - code: 'src/charter/org_expected_artifacts.py:10 (module docstring: ''Contract C-4 (`kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md`):'')'
  - code: src/charter/org_expected_artifacts.py:56 (function docstring, the literal path FR-002 corrects)
  - code: 'kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md:86
      (embedded code sample: ''"""<org_root>/<mission_type>/expected-artifacts.yaml, later org_roots override
      earlier."""'' — the OLD, pre-fix path, verbatim)'
  claim: 'Verified: the frozen contract doc exists and does embed the old, wrong path (line 86), and the
    module docstring does cite it by name as "Contract C-4" (line 10) as the authoritative source for
    precedence/merge semantics. Plan''s Contracts section correctly states this doc is deliberately left
    untouched and that "the docstring correction in FR-002 fixes the function''s stated on-disk path,
    not the frozen historical document''s content" — but neither the plan nor FR-002 (spec.md) adds any
    caveat to the module docstring noting that its own cited "Contract C-4" source shows a now-superseded
    path. After the fix lands, a future reader who trusts the module docstring''s citation and follows
    it to verify the exact path (rather than only the precedence rules) will land on a document showing
    the OLD path with no signal that it is stale for that detail — this reproduces, via one level of indirection
    (citation instead of direct docstring text), the exact "docstring says X, code does Y" confusion class
    FR-002 exists to eliminate. The plan''s own mission-derived-lens self-check text acknowledges the
    tension in prose but does not mandate a concrete textual remediation inside the file being fixed.

    '
  remediation: 'Add FR-002 scope (or a follow-on line in the plan''s Contracts section) to require one
    caveat sentence in the module docstring''s Contract C-4 citation, e.g.: "Contract C-4''s own code
    sample cites the pre-fix path (`<org_root>/<mission_type>/expected-artifacts.yaml`) — that frozen
    historical document is not kept in sync with this bugfix; see this module''s `resolve_org_expected_artifacts`
    docstring for the current, correct on-disk path." This keeps the frozen doc itself untouched (respecting
    C-007) while closing the residual "citation implies current path" ambiguity inside the one file this
    mission does edit.

    '
- id: PLAN-VERIFY-001
  lens: MISSION-DERIVED LENS — CI gate-claim factual accuracy
  severity: 4
  title: mypy --strict is mislabeled ENFORCED — the workflow step is explicitly advisory (continue-on-error,
    no aggregate fail-check)
  evidence:
  - artifact: 'plan.md § The Gate Set For This Mission, item 5 (`lint` job bullets): "**`mypy --strict`**
      (ENFORCED) — `src/charter` is in its target list ... Applicable: the FR-001 path-join edit must
      keep typing clean."'
  - code: '.github/workflows/ci-quality.yml:902-908 — step name is literally `"[INFO] Run mypy report
      (advisory)"`, `id: mypy`, `continue-on-error: true`, running `uv run python -m mypy --strict src/specify_cli
      src/charter src/doctrine`.'
  - code: .github/workflows/ci-quality.yml:990-1062 — the mypy step's `has_failures` output only feeds
      the `lint-feedback` job, which posts a PR comment; nothing fails the `lint` job or `quality-gate`
      on a mypy failure.
  claim: 'The plan states mypy --strict is an ENFORCED gate for this mission''s diff. The workflow explicitly
    labels this step "[INFO] ... (advisory)" and sets continue-on-error: true, so a mypy --strict failure
    does NOT fail the `lint` job (unlike TID251, the Typer026 test, check_patch_targets.py, the Contextive
    check, or bandit/pip-audit — all of which either lack continue-on-error or have an explicit downstream
    "[ENFORCED] Fail job if ... failed" step). The `quality-gate` aggregator (ci-quality.yml:4310+) reads
    job-level `needs.lint.result`, not the mypy step''s own outcome, so a red mypy --strict run on this
    diff''s files would not block merge. The target-list claim (src/charter present) is correct; the ENFORCED
    characterization is not — it contradicts the workflow''s own explicit "(advisory)" label on the exact
    same step.

    '
  remediation: 'Correct the plan''s item 5 bullet to move `mypy --strict` into the same advisory bucket
    as the full `ruff check src tests` report (both are "[INFO] ... (advisory)", continue-on-error:true,
    feeding only the non-blocking lint-feedback PR comment) — do not list it as an ENFORCED gate the WP
    must pass locally to be "CI-ready." Good typing hygiene remains worth keeping regardless, but the
    plan should not misstate it as a merge-blocking gate.

    '
- id: PLAN-VERIFY-002
  lens: MISSION-DERIVED LENS — CI gate-claim factual accuracy
  severity: 4
  title: commitlint and markdownlint are mislabeled ENFORCED — both steps carry continue-on-error with
    no aggregate fail-check, so a failure does not block merge
  evidence:
  - artifact: 'plan.md § The Gate Set For This Mission, item 5: "**commitlint** (ENFORCED via job outputs
      feeding the aggregate gate) — ... real obligation" and "**markdownlint** (ENFORCED) — ... a real,
      if minor, obligation."'
  - code: '.github/workflows/ci-quality.yml:672-681 — `"[ENFORCED] Run commit message linting"`, `id:
      commitlint`, `if: always()`, `continue-on-error: true`.'
  - code: '.github/workflows/ci-quality.yml:731-740 (step header) — `"[ENFORCED] Run markdown style linting
      on changed files"`, `id: markdownlint`, `continue-on-error: true` (same pattern as the commitlint
      step).'
  - code: '.github/workflows/ci-quality.yml:4249-4310 — the `quality-gate` job''s `NEEDS_JSON: toJSON(needs)`
      is built from job-level `result`s only; unlike bandit/pip-audit (which get an explicit "[ENFORCED]
      Fail job if security checks failed" step at ci-quality.yml:966-974 checking `steps.bandit.outcome`/`steps.pip_audit.outcome`),
      no equivalent step exists for `steps.commitlint.outcome` or `steps.markdownlint.outcome` — their
      `has_failures` outputs (ci-quality.yml:617-618) are consumed only by the non-blocking `lint-feedback`
      PR-comment job (ci-quality.yml:990).'
  claim: 'Despite the step names'' own "[ENFORCED]" prefix, both commitlint and markdownlint use continue-on-error:
    true and have no downstream step that fails the `lint` job based on their outcome — the workflow''s
    own naming is internally inconsistent with its actual behavior. A commit-message or markdown-lint
    violation in this mission''s commits would surface only as a PR comment, not a red/blocking check,
    contradicting the plan''s "real obligation" framing that the WP treats these as gates it must satisfy
    before merge.

    '
  remediation: 'Correct the plan to note that commitlint/markdownlint failures currently do not block
    merge in this repo''s CI (continue-on-error with no aggregate fail-check) — cite this as a known gap
    in the workflow''s own enforcement (worth a separate issue) rather than asserting they are real, currently-enforced
    gates for this mission''s diff. Do not let this change the mission''s own commit hygiene, but do not
    cite it as CI-enforced when tracing the gate set.

    '
- id: PLAN-VERIFY-003
  lens: MISSION-DERIVED LENS — CI gate-claim factual accuracy
  severity: 4
  title: Contextive glossary freshness check will NOT skip for this diff — its own path filter explicitly
    includes src/charter/**, contradicting the plan's stated skip reasoning
  evidence:
  - artifact: 'plan.md § The Gate Set For This Mission, item 5: "**Contextive glossary freshness check**
      — conditionally SKIPPED for this diff: it only runs when the commit range touches `glossary/`, `src/specify_cli/`,
      or `.kittify/traceability/` ... this mission touches only `src/charter/` and test files, so this
      check will report ''no changes'' and skip"'
  - code: .github/workflows/ci-quality.yml:860-866 — `mapfile -d '' CHANGED < <(git diff --name-only -z
      --diff-filter=ACM "$FROM_SHA" "$TO_SHA" -- 'glossary/**' 'src/specify_cli/**' 'src/charter/**' 'src/charter/**'
      '.kittify/traceability/**')` — `src/charter/**` is explicitly a member of this path list (appearing
      twice, apparently a duplicate entry in the workflow itself, but present regardless).
  claim: 'The plan asserts the Contextive check skips because it only fires on changes under glossary/,
    src/specify_cli/, or .kittify/traceability/ — omitting src/charter/. The workflow''s actual git-diff
    path list used to decide "no changes, skip" explicitly includes ''src/charter/**''. Since this mission''s
    sole production file is src/charter/org_expected_artifacts.py, the diff WILL be detected as relevant
    and the check WILL run `scripts/generate_contextive_glossaries.py check` (not skip) — directly contradicting
    the plan''s stated reasoning for why this gate does not apply. The check likely still passes (no glossary
    term content changes), but the plan''s claim about *why* it''s out of scope is factually wrong, and
    this gate should be listed as an actual, applicable (if presumably-passing) check, not a skip.

    '
  remediation: 'Correct the plan to state that the Contextive check DOES run for this diff (src/charter/**
    is in its own change-detection path list) but is expected to pass because this mission changes no
    glossary-relevant terminology — do not claim it will report "no changes" and skip.

    '
- id: PLAN-VERIFY-004
  lens: MISSION-DERIVED LENS — CI gate-claim factual accuracy
  severity: 2
  title: The 'charter' dorny filter is understated — it has 6 path patterns, not the 2 the plan names
  evidence:
  - artifact: 'plan.md § The Gate Set For This Mission, item 1: "gated on the `charter` dorny filter:
      `src/charter/**` + `tests/charter/**`, which this diff hits"'
  - code: '.github/workflows/ci-quality.yml:430-436 — the `charter:` filter block lists SIX patterns:
      `src/charter/**`, `src/specify_cli/charter_runtime/**`, `tests/charter/**`, `tests/specify_cli/charter_freshness/**`,
      `tests/specify_cli/charter_lint/**`, `tests/specify_cli/charter_preflight/**`.'
  claim: 'The plan characterizes "the charter dorny filter" as exactly two path globs (src/charter/**
    + tests/charter/**), but the actual filter block has six. The conclusion that this diff triggers the
    filter still holds (src/charter/** and tests/charter/** are both members), so this does not change
    the gate applicability verdict, but it materially understates what the filter actually covers — a
    reader relying on the plan''s paraphrase to reason about what else would/wouldn''t trigger fast-tests-charter
    would be misled.

    '
  remediation: 'Either quote the filter''s full six-pattern list or explicitly note "(among other patterns)"
    when paraphrasing a dorny filter block, so the plan''s gate descriptions are not read as complete
    enumerations when they are partial.

    '
- id: PLAN-VERIFY-005
  lens: MISSION-DERIVED LENS — CI gate-claim factual accuracy
  severity: 2
  title: '''fast-tests-core-misc (misc shard)'' misnames the shard — the fast job''s shard is ''core-misc'',
    not ''misc''; only integration-tests-core-misc has a shard literally named ''misc'''
  evidence:
  - artifact: 'plan.md § The Gate Set For This Mission, item 2: "**`fast-tests-core-misc` (misc shard)
      + `integration-tests-core-misc` (misc shard)** ... the `misc` shard''s `paths:` list explicitly
      includes `tests/dossier` (verified: `.github/workflows/ci-quality.yml` matrix, `shard: misc`)"'
  - code: '.github/workflows/ci-quality.yml:1667-1712 — `fast-tests-core-misc`''s matrix shards are named
      `specify-cli-rest`, `specify-cli-rest-2`, and `core-misc` (the last with `paths: ''''` and an `ignore_args`
      list that does NOT ignore `tests/dossier`, so it is implicitly covered — but the shard is named
      `core-misc`, not `misc`).'
  - code: .github/workflows/ci-quality.yml:1983-1997 — the shard literally named `misc` (with `tests/dossier`
      in its explicit `paths:` list) belongs to `integration-tests-core-misc`, not `fast-tests-core-misc`.
  claim: 'The plan attributes a shard literally named "misc" to both fast-tests-core-misc and integration-tests-core-misc.
    Only integration-tests-core-misc has a shard named "misc"; fast-tests-core-misc''s equivalent shard
    (which also covers tests/dossier, via its catch-all `paths: ''''` + an ignore list that does not exclude
    tests/dossier) is named "core-misc". The practical conclusion (both jobs exercise tests/dossier) is
    unaffected, but the specific shard-name citation for the fast job is wrong, which would mislead someone
    trying to locate "the misc shard" inside fast-tests-core-misc''s matrix.

    '
  remediation: 'Correct the citation to: "fast-tests-core-misc (core-misc shard, catch-all `paths: ''''`
    with no tests/dossier ignore entry) + integration-tests-core-misc (misc shard, tests/dossier explicitly
    listed)" — two different shard names for the two different jobs.

    '
