findings:
  - id: PLAN-FRESH2-001
    lens: charter-doctrine-fidelity
    severity: 3
    title: Known-gap paragraph asserts the docstring-drift connection passes the Locality-of-Change extension test while quoting spec.md C-001's "which none exists for" as if it settles the same question, without reconciling the two
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope, 'Known gap outside the six-file set' paragraph: \"This is a direct, domain-matched, proportional connection to the stated defect under Locality of Change's extension test (`RECONCILE_CHANGE_SCOPE_TENSIONS` step 3) — not adjacent, unrelated cleanup — but Boy Scout Rule (step 2) forbids adding files to the set regardless...\""
      - artifact: "plan.md § Campsite-Clean Scope, same paragraph, two sentences later: \"...spec.md C-001: 'any extension beyond these six files would need a direct, proportional connection to this specific defect, which none exists for' — written before this drift was independently found during plan review\""
      - artifact: "spec.md § Constraints, C-001 row (verbatim): \"Locality of Change is the brake: any extension beyond these six files would need a direct, proportional connection to this specific defect, which none exists for.\""
    claim: >
      The plan explicitly concludes the mission_type_profiles.py / manifest.py docstring drift
      IS "a direct, domain-matched, proportional connection to the stated defect" (satisfying
      Locality of Change's own extension test), then two sentences later cites spec.md C-001's
      claim that "none exists" as though it were still accurate and dispositive. These two
      statements are in direct tension — the plan itself found a connection that the spec's own
      constraint says doesn't exist — but the plan never flags or reconciles this tension; it
      pivots straight to "Boy Scout Rule forbids adding files regardless" without acknowledging
      that its own analysis contradicts the spec-level rationale it just quoted. The actual
      scope decision (defer, don't fold in) is unaffected either way, but a reader relying on
      the stated rationale chain to understand *why* is left with an unexplained contradiction
      in a binding planning document. This tension predates round 2 (present verbatim since the
      plan's first version, 9eae1fa2e) but survived both fix rounds untouched even though round
      2 specifically reworded the surrounding sentences for charter-attribution accuracy.
    remediation: >
      Add one sentence acknowledging the tension explicitly, e.g.: "This finding narrows, but
      does not overturn, spec.md C-001's 'which none exists for' clause — that clause was
      written before this drift was found; the connection exists, but Boy Scout Rule (step 2)
      independently bars adding files to the set regardless of whether the connection test is
      met, so the practical scope decision is unchanged." Alternatively, flag C-001 itself for
      a wording correction at the next spec touch-up so it no longer asserts a connection
      "none exists for" when the plan phase demonstrably found one.

  - id: PLAN-FRESH2-002
    lens: gate-claim-fidelity
    severity: 2
    title: Contextive glossary freshness check bullet is the only item in the Gate Set's lint-job list missing an explicit ENFORCED/ADVISORY label
    evidence:
      - artifact: "plan.md § The Gate Set For This Mission, item 5, Contextive bullet: \"Contextive glossary freshness check — DOES run for this diff, not skip (corrected from an earlier planning-pass mislabel): ... Expected to PASS, not skip...\""
      - artifact: "plan.md § The Gate Set For This Mission, item 5, sibling bullets each carry an explicit label: mypy (\"ADVISORY, not enforced\"), TID251 (\"ENFORCED\"), check_patch_targets.py (\"ENFORCED\"), Bandit/pip-audit (\"both genuinely ENFORCED\"), commitlint (\"ADVISORY despite its own step name's '[ENFORCED]' prefix\"), markdownlint (\"ADVISORY... same mislabel pattern as commitlint\")"
      - code: ".github/workflows/ci-quality.yml:848 (step \"[ENFORCED] Check Contextive glossary files are up-to-date\", no continue-on-error — genuinely blocking, unlike the commitlint/markdownlint mislabel pattern the plan documents two bullets below it)"
    claim: >
      Every other bullet in this itemized lint-job breakdown states plainly whether the gate is
      ENFORCED or ADVISORY (several explicitly correcting a "mislabel" from an earlier pass).
      The Contextive bullet — added new detail by this fix round in WP5's checklist but present
      in the Gate Set list since round 1 — never states its blocking status. Checking the actual
      workflow shows this step has no `continue-on-error` and is a real, job-failing gate (same
      class as TID251/bandit/pip-audit), unlike its immediate list-neighbors commitlint and
      markdownlint. A reader skimming this bulleted list for "what can fail my PR" has no way to
      tell, from the Contextive bullet's own text, that it belongs in the blocking column rather
      than the advisory one it sits next to.
    remediation: >
      Add an explicit "(ENFORCED, no continue-on-error — unlike the commitlint/markdownlint
      mislabel pattern above)" clause to the Contextive bullet, matching the labeling
      convention every other bullet in this list already follows.

  - id: PLAN-FRESH2-003
    lens: code-truth-citation
    severity: 3
    title: Summary section cites a nonexistent function name, `_resolve_mission_config`, in resolver.py
    evidence:
      - artifact: "plan.md § Summary (line 1 of body): \"every sibling org-tier resolver in `src/specify_cli/runtime/resolver.py` (`_resolve_asset`, `_resolve_mission_config`) and the built-in layout it mirrors anchor at `org_root / \"missions\" / mission_type / ...`\""
      - code: "src/specify_cli/runtime/resolver.py — no function named `_resolve_mission_config` exists anywhere in this file (verified via grep); the org-tier mission resolver is actually named `resolve_mission` (src/specify_cli/runtime/resolver.py:769), which does anchor at `org_root / \"missions\" / name / filename` (resolver.py:814), matching the plan's substantive claim but not its cited name"
    claim: >
      The plan's opening Summary paragraph — the first technical claim in the document, cited as
      the evidentiary basis for "every sibling org-tier resolver anchors at .../missions/... " —
      names a second sibling resolver function, `_resolve_mission_config`, that does not exist in
      `resolver.py`. The real function performing this role is `resolve_mission` (line 769). This
      citation error has been present verbatim since the plan's first authored version
      (commit 9eae1fa2e) and was not caught or corrected across either of the two subsequent fix
      rounds. The underlying substantive claim (that the sibling resolver anchors at the
      `missions/` segment) is correct once you locate the right function by hand, but the cited
      name itself is unverifiable/wrong, undermining confidence in this document's file:line
      citation discipline right at its most load-bearing sentence.
    remediation: >
      Change `_resolve_mission_config` to `resolve_mission` in the Summary sentence (and add the
      `:769` line citation for consistency with the rest of the document's citation style).
