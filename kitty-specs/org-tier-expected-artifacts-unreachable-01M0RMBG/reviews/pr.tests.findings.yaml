    line: 643
    title: "test_malformed_org_pack_does_not_raise (FR-003 AC4) is orphaned by the anchor fix and now passes for the wrong reason"
    detail: >
      TestRebaselineOrgAwareness.test_malformed_org_pack_does_not_raise builds its
      fixture directly (not through the file's `_write_org_manifest` helper, which
      this diff correctly retargeted): `malformed_dir = org_root / "software-dev"`
      (line 664) -- the pre-fix, un-anchored path. Verified empirically: calling
      `resolve_org_expected_artifacts([org_root], "software-dev")` against a
      malformed file written at that exact path returns `None` post-fix, identical
      to "no org file present" -- `_read_yaml_mapping` never even opens the file, so
      the malformed-YAML/graceful-degrade branch this test's docstring claims to
      exercise is never reached. The test still passes (outcome.error is None,
      org key absent) but now for a trivial reason: nothing was found, not "found
      and gracefully degraded." This is the same class of trap the WP author
      already caught and fixed in tests/charter/test_org_expected_artifacts.py
      (old-anchor test bypassing the retargeted helper) -- except this one is a
      pre-existing test the diff did not touch and therefore never surfaced in the
      six-file diff view. Confirmed via git show 3442ca1af (pre-diff origin/main):
      this test already wrote to `org_root / "software-dev"` before the fix, when
      that path WAS the resolver's real anchor, so it was a faithful integration
      test pre-fix. The diff's anchor change silently stranded it. Not one of the
      19 revert-triggered failures (it passes identically in both the fixed and
      reverted state, for two different reasons), so it does not indicate a defect
      in the FR-001/FR-002 resolver fix itself -- that fix is sound (see notes).
      The underlying malformed-file graceful-degrade behavior IS still covered at
      the resolver-unit level by tests/charter/test_org_expected_artifacts.py's
      TestResolveOrgExpectedArtifactsMalformedFile class (which does use the
      corrected anchor and did fail correctly under the revert test). So this is a
      coverage/fidelity gap at the rebaseline-integration layer (FR-003 AC4's
      stated guarantee -- "operator's migrate command must not raise on a
      malformed org pack" -- is no longer exercised end-to-end), not a hole in the
      core bugfix.
    recommendation: >
      Update tests/dossier/test_rebaseline.py::test_malformed_org_pack_does_not_raise
      to build its fixture at `org_root / "missions" / "software-dev"` (matching
      `_write_org_manifest` in the same file), so the malformed-YAML file is
      actually reached by `resolve_org_expected_artifacts` and the test again
      proves rebaseline's graceful-degrade-on-parse-failure guarantee end-to-end
      instead of the vacuous "org file simply absent" path.
