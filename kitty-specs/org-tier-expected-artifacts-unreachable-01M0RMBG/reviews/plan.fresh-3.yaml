findings:
  - id: PLAN-FRESH3-001
    lens: charter-doctrine-fidelity
    severity: 2
    title: Round 3's new reconciliation sentence in the "Known gap" paragraph resolves PLAN-FRESH2-001's contradiction but duplicates a conclusion the same paragraph already stated two sentences earlier
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope, 'Known gap outside the six-file set' paragraph (first statement, unchanged by round 3): \"This is a direct, domain-matched, proportional connection to the stated defect under Locality of Change's extension test (`RECONCILE_CHANGE_SCOPE_TENSIONS` step 3) — not adjacent, unrelated cleanup — but Boy Scout Rule (step 2) forbids adding files to the set regardless, so passing the extension test alone does not authorize folding this in.\""
      - artifact: "plan.md § Campsite-Clean Scope, 'Resolution: deferred, not folded into this mission' paragraph (round 3's new sentence, ~15 lines later): \"This finding narrows, but does not overturn, C-001's 'which none exists for' clause: that clause predates the docstring drift being found during plan review, so the direct, proportional connection now demonstrably exists — but Boy Scout Rule (step 2) independently bars adding files to the set regardless of whether the connection test is met, so the practical scope decision (defer) is unchanged by this narrowing.\""
    claim: >
      Round 3 added the second sentence quoted above to fix PLAN-FRESH2-001 (the plan asserting
      a connection exists while quoting spec.md C-001's "which none exists for" as if still
      accurate, with no reconciliation). The fix works — it explicitly says the finding
      "narrows, but does not overturn" C-001 — but it restates, almost word-for-word, the exact
      conclusion the paragraph already reached in its very first sentence: "direct... proportional
      connection... under Locality of Change's extension test... but Boy Scout Rule (step 2)
      forbids adding files to the set regardless." Both sentences assert (a) the connection test
      is met, and (b) Boy Scout Rule bars adding files regardless, in nearly identical phrasing.
      A reader now encounters the same reasoning chain twice in one continuous section — once
      before the C-001 quote, once again immediately after it — which reads as circular rather
      than as a clean two-step argument (state finding → note tension with C-001 → resolve).
      The scope decision itself (defer) is unaffected; this is a documentation clarity issue,
      not a correctness one.
    remediation: >
      Trim the round-3 sentence to just the new content — the "narrows but does not overturn"
      reconciliation with C-001's clause — and drop the repeated restatement of the
      connection-test/Boy-Scout-Rule conclusion already established earlier in the same
      paragraph, e.g.: "This finding narrows, but does not overturn, C-001's 'which none exists
      for' clause: that clause predates the docstring drift found during plan review. The
      practical scope decision (defer) is unchanged, since Boy Scout Rule already settles it
      regardless of the connection test's outcome (see above)."

  - id: PLAN-FRESH3-002
    lens: gate-claim-fidelity
    severity: 2
    title: WP5's gate-verification checklist lists confirming mypy --strict as part of reaching "CI-ready," contradicting the Gate Set section's explicit statement that mypy is not a gate the WP must pass locally to be CI-ready
    evidence:
      - artifact: "plan.md § The Gate Set For This Mission, item 5, mypy bullet (line 244): \"...this is not a gate the WP must pass locally to be \\\"CI-ready.\\\"\""
      - artifact: "plan.md § Phasing / Work Packages, WP5 'Gate verification' (line 538): \"...then confirm mypy --strict, TID251, the Contextive glossary freshness check (...), and the diff-coverage critical-path gate locally before treating the WP as CI-ready (per the named gate set above).\""
    claim: >
      The Gate Set section is explicit and deliberate that mypy --strict is ADVISORY
      (continue-on-error: true, feeds only the non-blocking lint-feedback PR comment) and states
      in as many words that it "is not a gate the WP must pass locally to be 'CI-ready.'" WP5's
      own gate-verification checklist — the concrete, actionable instruction an implementer
      follows — nonetheless lists "confirm mypy --strict" in the same breath as TID251, the
      Contextive check, and diff-coverage (all three of which genuinely are enforced/blocking),
      as one of the things to do "before treating the WP as CI-ready." This directly contradicts
      the disclaimer two sections earlier: the document tells the reader mypy is not required for
      CI-readiness, then tells the implementer to confirm it as a precondition for CI-readiness.
      This tension predates round 3 (WP5's list already had mypy in earlier versions) and was not
      caught by the round-1 gate-claim-fidelity pass (PLAN-VERIFY-001, which only fixed the
      Gate Set section's own mislabeled bullet) or by either prior fresh sweep.
    remediation: >
      Either drop "mypy --strict" from WP5's "before treating the WP as CI-ready" list (moving it
      to a separate, explicitly-optional "also worth checking for typing hygiene" note), or add a
      qualifier matching the Gate Set section's own framing, e.g.: "...confirm TID251, the
      Contextive glossary freshness check (...), and the diff-coverage critical-path gate locally
      before treating the WP as CI-ready — plus mypy --strict as a non-blocking hygiene check
      (advisory only, not required for CI-ready status; see Gate Set item 5)."
