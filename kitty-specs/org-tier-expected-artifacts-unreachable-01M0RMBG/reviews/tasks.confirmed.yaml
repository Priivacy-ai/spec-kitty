findings:
  - id: TASKS-DECOMP-001
    lens: work-package-decomposition (cross_cutting field misuse)
    severity: 3
    title: "`cross_cutting: true` is applied to a single-concern feature WP, contradicting the canonical field's own semantics"
    evidence:
      - artifact: "wps.yaml — `cross_cutting: true` on WP01"
      - artifact: "tasks/WP01-org-tier-expected-artifacts-anchor-fix.md § 'This is the ONLY work package for this mission' (lines ~88-95)"
      - code: "packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md:106 — \"If the WP is cross-cutting infrastructure with no specific concern (e.g. a test harness setup WP), set `cross_cutting: true` and leave `plan_concern_refs` empty.\""
      - code: "packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md:180 — \"`cross_cutting`: Set to `true` for infrastructure WPs that span all concerns and have no specific IC-## ref.\""
      - code: "src/specify_cli/core/wps_manifest.py:140-167 (`check_concern_refs_coverage`) — cross_cutting is a warning-suppression flag for missing plan_concern_refs, not an ownership-overlap bypass."
      - artifact: "plan.md — full file read; contains no `## IC-##` / `### IC-##` headings anywhere (grep for `IC-` in plan.md and spec.md returns zero matches)."
    claim: >
      The canonical tasks-outline doctrine defines `cross_cutting: true` for exactly one class of WP: shared
      infrastructure with no specific concern. WP01 is the opposite — it is the mission's sole WP and sole
      concern. Setting `cross_cutting: true` here is self-triggering and self-satisfying: since plan.md defines
      no IC-## concern headings, `_concern_tracking_required` would have been False and no warning would ever
      have fired if the field were simply left unset. The root cause is one phase up — plan.md never decomposed
      into IC-## implementation concerns — and tasks reached for the doctrinally-wrong field instead of surfacing
      that gap.
    remediation: >
      Either (a) unset `cross_cutting` entirely in wps.yaml (no warning fires regardless, since plan.md has no
      IC-## headings), or (b) add a short plain-language note stating cross_cutting is set only to satisfy a field
      convention, not because WP01 is infrastructure.
  - id: TASKS-DECOMP-002
    lens: work-package-decomposition (single-WP structural justification)
    severity: 3
    title: "WP01's stated justification for collapsing into one WP ('codebase-wide is the only exemption') misstates the ownership-overlap validator's actual exemptions"
    evidence:
      - artifact: "tasks/WP01-org-tier-expected-artifacts-anchor-fix.md lines ~88-95: \"two narrow WPs both claiming that file would fail spec-kitty's ownership validator (file-level overlap, not line-level; `codebase-wide` is the only exemption and does not apply to a narrow six-file fix like this one).\""
      - code: "src/specify_cli/ownership/validation.py:160-215 (`validate_no_overlap`) — docstring: \"When *dependencies* is supplied, same-lane sequential WPs — those with a directed dependency path between them — are also exempt... only concurrent pairs are flagged.\" (lines 168-171); implementation at lines 196-200 skips any WP pair reachable via a dependency edge, independent of `scope: codebase-wide`."
    claim: >
      The WP01 prompt asserts codebase-wide scope is the *only* mechanism exempting a file from the
      ownership-overlap validator. This is factually incorrect: `validate_no_overlap` also exempts two WPs joined
      by a directed dependency edge (same-lane sequential pairs), because the guard's stated purpose is to stop
      *parallel* (dependency-unordered) WPs from colliding. A dependency-ordered two-WP split
      (WP02 depends on WP01) touching the same file would have been technically valid. This does not mean two WPs
      would have been the better choice — a single WP is a defensible, arguably cleaner choice for a fix this
      size — but the prompt's stated rationale for *why* a split was impossible is inaccurate, and a future
      author copying this reasoning as precedent for a larger mission would incorrectly rule out a
      dependency-ordered WP split that spec-kitty's tooling actually supports.
    remediation: >
      Correct the WP01 prompt's Context section to either (a) drop the inaccurate "codebase-wide is the only
      exemption" claim and justify the single-WP choice on its actual merits (six files small enough that one WP
      with an internally ordered commit sequence is simpler to review than a two-WP dependency chain, matching
      plan.md's own linear Phasing), or (b) correct the claim to name both exemptions accurately (codebase-wide
      scope OR a dependency edge between WPs), and explain the single-WP choice was preferred on merits, not
      because a split was technically blocked.
  - id: TASKS-VERIFY-001
    lens: Gate verification (T006)
    severity: 3
    title: "T006's diff-coverage confirmation step names the gate but gives no runnable local command"
    evidence:
      - artifact: "tasks/WP01-org-tier-expected-artifacts-anchor-fix.md § Subtask T006, step 4 (and Definition of Done: \"diff-coverage locally confirmed ≥90% on changed lines\")"
      - code: ".github/workflows/ci-quality.yml:3334-3394 (diff-coverage critical-path job: aggregates out/reports/artifacts/coverage-*.xml from separate fast+integration jobs, then `uv run diff-cover \"${coverage_reports[@]}\" --compare-branch=origin/${{ github.base_ref }} --fail-under=90 --include \"${critical_paths[@]}\"`, with `src/charter/*` in critical_paths at line 3348)"
      - code: "pyproject.toml:110 (`diff-cover>=10.0.0` is a declared project dependency, so a local reproduction is feasible)"
    claim: >
      T006 step 4 says "confirm rather than assume" for diff-coverage but, unlike steps 2 (TID251) and 3
      (Contextive) which give exact runnable commands, supplies none. The real CI gate aggregates coverage XML
      from separate fast+integration jobs and runs diff-cover against origin/<base> — not trivially reproducible
      from "confirm rather than assume" alone. The DoD line repeats the same unactionable phrasing.
    remediation: >
      Add a concrete local recipe to T006 step 4, e.g.: `pytest tests/charter/test_org_expected_artifacts.py
      --cov=charter --cov-report=xml:coverage.xml -q && uv run diff-cover coverage.xml
      --compare-branch=<planning-base-or-origin/main> --fail-under=90 --include 'src/charter/*'`, or explicitly
      downgrade the step to "advisory, confirmed at CI" if a faithful local reproduction isn't worth specifying.
  - id: TASKS-SEQ-001
    lens: write-scopes
    severity: 1
    title: "lanes.json predicted_surfaces are naive keyword-matched noise, not real surface exposure"
    evidence:
      - artifact: "lanes.json § lanes[0].predicted_surfaces"
      - code: "src/specify_cli/lanes/compute.py:98-118 (SURFACE_TAXONOMY, _SURFACE_KEYWORDS, infer_surfaces — case-insensitive substring match over WP prose)"
    claim: >
      lanes.json's computed lane carries predicted_surfaces including "api", "tracker-integration",
      "artifact-rendering" for a mission that is a pure charter/dossier path-join bugfix. These come from naive
      substring matching against the WP prompt's prose (e.g. "tracker" inside "tracker_refs: []"), not from
      owned_files. Inert for this single-WP mission (no overlap comparison occurs), but could mislead a future
      reader or falsely widen overlap detection if a fast-follow WP is later added.
    remediation: >
      No functional change needed for this single-WP mission (informational). Pre-existing tooling
      characteristic of infer_surfaces(), not fixable within this mission's own artifacts.
