mission: org-tier-expected-artifacts-unreachable-01M0RMBG
findings:
  - id: PLAN-FRESH-001
    lens: charter-scope-fidelity
    severity: 4
    title: Deferral instruction for the docstring-drift gap points back at this mission's own next phase
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope, 'Known gap outside the six-file set'"
      - artifact: "plan.md § Project Structure, 'Documentation (this mission)' file tree (lists `tasks.md # Phase 2 output (/spec-kitty.tasks — not created here)` for THIS mission)"
    claim: >
      The fix's new "Resolution: deferred, not folded into this mission" paragraph argues at
      length that the plan cannot unilaterally reopen spec.md C-001's six-file lock to add
      `src/charter/mission_type_profiles.py` and `src/specify_cli/dossier/manifest.py` for their
      own stale-path docstrings. It then names three landing sites for the deferred fix: "filed
      as a follow-on issue/mission or picked up explicitly at the next `/spec-kitty.tasks` or
      ledger sweep." Nowhere else in this document is any other mission's tasks phase discussed
      — the only `/spec-kitty.tasks` invocation plan.md itself refers to is this mission's own
      Phase 2 output (see the Project Structure doc tree, which explicitly labels `tasks.md` as
      "Phase 2 output (/spec-kitty.tasks — not created here)" for this same mission directory).
      Read naturally, "the next `/spec-kitty.tasks`" is this mission's own imminent tasks phase,
      not a hypothetical other mission's. That directly contradicts the paragraph's own thesis:
      if whoever runs `/spec-kitty.tasks` next for this mission takes the sentence literally and
      adds a WP correcting the two callers' docstrings, the resulting tasks.md would grow the
      file set to eight files, violating spec.md C-001 (a spec-level, Open/High-priority,
      operator-decided constraint this very paragraph says the plan has no authority to reopen).
      The fix introduced this ambiguity; the pre-fix plan.md did not discuss this gap at all.
    remediation: >
      Remove "or picked up explicitly at the next `/spec-kitty.tasks`" from the list of landing
      sites (or qualify it explicitly as "a future mission's tasks phase, never this mission's"),
      leaving only "filed as a follow-on issue/mission ... or ledger sweep" — both of which are
      unambiguously outside this mission's own C-001-locked file set.
  - id: PLAN-FRESH-002
    lens: charter-doctrine-fidelity
    severity: 3
    title: "Docstring-drift deferral misattributes its own justifying test to Boy Scout Rule instead of Locality of Change"
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope, 'Known gap outside the six-file set': \"This is a direct, domain-matched, proportional connection to the stated defect under Standing Order #2 / `RECONCILE_CHANGE_SCOPE_TENSIONS`'s Boy Scout test — not adjacent, unrelated cleanup.\""
      - artifact: ".kittify/charter/charter.md § RECONCILE_CHANGE_SCOPE_TENSIONS resolution order (lines ~126-134): step 2 (Boy Scout Rule) governs cleanup strictly *inside* the chosen file set \"without adding files\"; step 3 (Locality of Change) is the one that gates *extension beyond* the touched area on being \"directly connected to the goal, proportional, and carry a one-line rationale.\""
    claim: >
      The charter's own reconciler text draws a sharp line: Boy Scout Rule (step 2) can never add
      files to the set, full stop — no "direct connection" test applies to it, because by
      definition it operates only inside the already-fixed file set. The "direct, proportional
      connection" test the plan invokes to characterize this newly-found gap belongs to step 3,
      Locality of Change, not to Boy Scout Rule. By labeling this "RECONCILE_CHANGE_SCOPE_TENSIONS's
      Boy Scout test," the plan misattributes which rule actually supplies the proportionality
      criterion, muddying the very reconciler ordering this review is asked to verify was applied
      correctly. The ultimate decision reached (defer, do not extend) happens to be the correct one
      given C-001's spec-level lock, but the reasoning path that gets there cites the wrong rule.
    remediation: >
      Reword to attribute the "direct, proportional connection" test to Locality of Change (step 3),
      e.g.: "...a direct, domain-matched, proportional connection to the stated defect under
      Locality of Change's extension test (RECONCILE_CHANGE_SCOPE_TENSIONS step 3) — not adjacent,
      unrelated cleanup — but Boy Scout Rule (step 2) forbids adding files to the set regardless,
      so..." so the two rules are not conflated.
  - id: PLAN-FRESH-003
    lens: gate-claim-fidelity
    severity: 3
    title: markdownlint's stated internal obligation was dropped, unlike the parallel commitlint correction
    evidence:
      - artifact: "plan.md § The Gate Set For This Mission, item 5, markdownlint bullet (post-fix): \"Applies informationally to any `.md` files this mission's commits touch, including this `plan.md` and the tracer files under `kitty-specs/`, but is not a merge-blocking gate today.\""
      - artifact: "plan.md § The Gate Set For This Mission, item 5, commitlint bullet (post-fix, same commit): \"This mission's commits should still follow conventional-commit style as hygiene, but CI does not currently block on a commitlint violation.\""
      - code: ".github/workflows/ci-quality.yml:731-752 (markdownlint step, id: markdownlint, continue-on-error: true, feeds only lint-feedback)"
    claim: >
      Both mypy and commitlint bullets, when corrected from ENFORCED to ADVISORY in this fix round,
      explicitly retained a "still worth doing as hygiene/typing discipline" sentence preserving the
      plan's own internal obligation independent of the CI label. The markdownlint bullet received
      the same ENFORCED→ADVISORY correction but its replacement text dropped the pre-fix framing
      ("a real, if minor, obligation") without adding an equivalent hygiene commitment — it now reads
      as purely informational with no stated internal discipline. This is the asymmetric, likely
      unintentional weakening the review brief specifically asks to check for: correcting a CI-blocking
      mislabel inadvertently softened the plan's own stated obligation for markdownlint, while the
      identically-shaped commitlint and mypy corrections did not.
    remediation: >
      Add a clause mirroring commitlint's, e.g.: "...this mission's touched `.md` files (this plan.md,
      the tracer files) should still be kept markdownlint-clean as hygiene, but CI does not currently
      block merge on a markdownlint violation."
  - id: PLAN-FRESH-004
    lens: gate-claim-fidelity
    severity: 2
    title: Gate-verification checklist (Phasing WP5) not updated after Contextive check's skip→run correction
    evidence:
      - artifact: "plan.md § The Gate Set For This Mission, item 5, Contextive bullet (post-fix): \"DOES run for this diff, not skip... but the check does execute against this diff; it will not report 'no changes.'\""
      - artifact: "plan.md § Phasing / Work Packages, WP5 'Gate verification': \"...then confirm mypy --strict, TID251, and the diff-coverage critical-path gate locally before treating the WP as CI-ready...\""
      - code: ".github/workflows/ci-quality.yml:848-869 (Contextive step has no continue-on-error and does `exit $?` on a real failure — genuinely blocking, unlike mypy/commitlint/markdownlint)"
    claim: >
      The fix corrected the Gate Set section's claim about the Contextive glossary freshness check
      from "conditionally SKIPPED for this diff" to "DOES run... genuinely" (it has no
      continue-on-error and its failure exit code is not swallowed, making it a real blocking gate
      touching this mission's sole production file, `src/charter/org_expected_artifacts.py`). WP5's
      own local pre-CI-readiness checklist, immediately below in the same document, was not updated
      to add "confirm the Contextive glossary check passes locally" alongside the other locally-run
      gates it does name (mypy --strict, TID251, diff-coverage). This is a completeness gap the fix's
      own correction newly makes relevant, since the check's status changed from "won't touch this
      diff" to "will run and must pass."
    remediation: >
      Add `uv run python scripts/generate_contextive_glossaries.py check` (or an equivalent note) to
      WP5's local gate-verification list, or explicitly state why it is omitted (e.g. "expected
      pass-through, not verified locally because no glossary-relevant terminology changes").
  - id: PLAN-FRESH-005
    lens: cross-reference-accuracy
    severity: 1
    title: manifest.py docstring line-range citation is one line short of the quoted text
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope, 'Known gap outside the six-file set' bullet: \"`ManifestRegistry.load_manifest` (`src/specify_cli/dossier/manifest.py:219-221`): \\\"FR-008 (WP05): when *repo_root* is given... an org-pack ``<org_root>/<mission_type>/expected-artifacts.yaml``... takes precedence over the built-in file...\\\"\""
      - code: "src/specify_cli/dossier/manifest.py:219-223 (line 219 starts \"FR-008 (WP05): when *repo_root* is given\"; the quoted \"takes precedence over the built-in file\" clause is actually on line 223, two lines past the cited range's end)"
    claim: >
      Minor citation-precision slip: the cited line range `219-221` covers only the start of the
      quoted docstring excerpt; the trailing clause quoted in the same sentence ("takes precedence
      over the built-in file...") is actually on line 223. Not misleading in substance (the quote
      itself is accurate), but the range undersells its own span by two lines.
    remediation: "Widen the cited range to `219-223` to cover the full quoted span."
