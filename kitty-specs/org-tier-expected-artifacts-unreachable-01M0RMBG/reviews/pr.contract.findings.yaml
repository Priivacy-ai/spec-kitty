    title: "ManifestRegistry.load_manifest docstring still asserts the pre-fix org-tier path, uncorrected and uncaveated"
    detail: >
      `ManifestRegistry.load_manifest`'s docstring (the FR-008/WP05 paragraph) reads:
      "an org-pack ``<org_root>/<mission_type>/expected-artifacts.yaml`` (see
      :func:`charter.org_expected_artifacts.resolve_org_expected_artifacts`, contract C-4)
      takes precedence over the built-in file" — this is the OLD, wrong, pre-fix path, not
      the corrected ``<org_root>/missions/<mission_type>/expected-artifacts.yaml`` the diff's
      own `resolve_org_expected_artifacts` now actually reads. Verified: `grep -n
      "org_root>/<mission_type>" src/specify_cli/dossier/manifest.py` hits line 221; the
      surrounding docstring has no caveat pointing a reader at the corrected path, unlike the
      caveat the diff adds to org_expected_artifacts.py's own docstring for the frozen C-4
      contract doc. `manifest.py` is one of the two actual callers named in the spec's Key
      Entities section (not the frozen historical contract doc C-007 deliberately leaves
      stale) — a maintainer or org-pack author reading this docstring in isolation, exactly
      the "reader of one side alone" scenario FR-002 exists to prevent, is told the wrong
      on-disk location. This is outside the diff's six-file set (C-001), so it is not a
      regression the diff introduced, but the diff's own stated rationale for FR-002 (make
      the docstring/actual-path mismatch impossible to hit from one side) is only half
      satisfied — the low-level resolver's docstring is fixed and caveated, its two direct
      callers' docstrings are not.
    recommendation: >
      File a fast-follow (or fold into the same ledger entry as C-007) to correct
      manifest.py:221's FR-008 paragraph to the `missions/<mission_type>/` path, and to add
      the same "frozen doc cites the old path" caveat pattern where it references contract
      C-4. Do not fix in this PR — C-001 fixes the file set at six files and manifest.py is
      not among them.
