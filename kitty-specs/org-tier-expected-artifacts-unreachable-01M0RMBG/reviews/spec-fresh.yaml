findings:
  - id: SPEC-FRESH-001
    lens: structural-root-cause / directive-030-conformance-gate
    severity: 4
    title: "Revised C-001/FR-005's six-file, five-test-fixture scope contradicts the binding operator quote's explicit 'two test fixtures; nothing else' cap"
    evidence:
      - artifact: "spec.md § Clarifications — operator decision quote (unchanged by this revision): \"Resolver fix only — no validator gate. Change the path join, the docstring, and the two test fixtures; nothing else.\""
      - artifact: "spec.md § Constraints C-001 (revised): \"the file set for this mission is fixed at exactly six files: ... The three tests/dossier/ files are in scope...\""
      - artifact: "spec.md § FR-005 (new): adds tests/dossier/test_manifest.py, tests/dossier/test_rebaseline.py, tests/dossier/test_indexer.py"
    claim: >
      The operator's binding, verbatim decision — quoted in the spec's own
      Clarifications section and left byte-identical by this revision (not
      touched by the diff between 83d6a86c2 and HEAD) — explicitly bounds
      the mission to "the path join, the docstring, and the two test
      fixtures; nothing else." The fix round's own investigation then
      discovered three MORE fixture-duplicating test files
      (tests/dossier/test_manifest.py, test_rebaseline.py, test_indexer.py)
      that independently hardcode the same broken join and would regress
      from GREEN to RED once FR-001 lands — a real and well-evidenced
      finding. But instead of flagging this as new information that
      supersedes (or requires reconfirming) the operator's explicit "two
      test fixtures / nothing else" cap, the revision silently widened
      C-001 to six files and added FR-005, leaving the binding Clarifications
      quote uncorrected and now directly contradicted by the Constraints
      section beneath it. An implementer or reviewer reading only the
      Clarifications section would reasonably believe touching
      tests/dossier/* is out of bounds; one reading only C-001/FR-005 would
      believe it is required. This is a live self-contradiction inside one
      artifact, not just a documentation nit — the "nothing else" language
      is the kind of explicit boundary this same review pass has been told
      elsewhere to treat as binding.
    remediation: >
      Add a short note in the Clarifications section (or a Clarifications
      addendum, dated to this fix round) stating that the "two test
      fixtures" figure in the quoted operator decision is superseded by the
      fix round's discovery of three additional fixture-duplicating test
      files that would otherwise regress from GREEN to RED, and that this
      necessitated expansion (not opportunistic addition) was accepted
      under the existing "resolver fix only" framing rather than reopening
      the validator-gate question — ideally re-confirmed with the operator
      given the quote explicitly said "nothing else." At minimum, edit the
      quoted decision's surrounding prose (not the quote itself, which is a
      verbatim record) to make the supersession explicit so the two
      sections no longer read as contradictory.

  - id: SPEC-FRESH-002
    lens: hypothesis-driven-debugging / decision-documentation (directive 003)
    severity: 3
    title: "NFR-001's RED-first ATDD mandate still names only FR-001/FR-002; it was not extended to FR-003's new old-path-resolves-to-None regression test"
    evidence:
      - artifact: "spec.md § NFR-001 (unchanged by this revision): \"Each of FR-001/FR-002 (paired with its test coverage) is committed as its own failing-first test pinning the user-observable behaviour BEFORE the implementation commit that makes it pass...\""
      - artifact: "spec.md § FR-003 (revised): \"this FR requires one new test case ... that writes a fixture ONLY at the old, pre-fix path ... and asserts resolve_org_expected_artifacts returns None post-fix — the regression coverage SC-004 measures\""
    claim: >
      FR-003's revision adds a genuinely new, user-observable-behavior-pinning
      test case: pre-fix, a fixture at the old path
      (org_root/mission_type/expected-artifacts.yaml) IS found by the buggy
      resolver (returns the parsed manifest, not None); post-fix it must
      return None. That is exactly the kind of RED-before/GREEN-after flip
      NFR-001 exists to govern (charter C-011 ATDD-first) — but NFR-001's
      text was left unchanged and still scopes the RED-first discipline to
      only "FR-001/FR-002." An implementer following NFR-001 literally could
      write FR-003's new test case directly against the already-fixed code
      (never observing it fail pre-fix), which would silently defeat SC-004's
      stated purpose of proving this is a genuine regression guard rather
      than a vacuously-true assertion — the same "vacuous pass" failure mode
      FR-003's own text calls out for the five hand-constructed
      TestResolveOrgExpectedArtifactsMalformedFile methods.
    remediation: >
      Extend NFR-001's FR list to explicitly include FR-003's new
      old-path-resolves-to-None test case (and, for consistency, note that
      FR-004/FR-005's fixture-helper corrections are maintenance of existing
      coverage rather than new RED-first behavior, so they are correctly
      excluded) — e.g. "Each of FR-001/FR-002, plus FR-003's new
      old-location-returns-None regression test, is committed as its own
      failing-first test..."

  - id: SPEC-FRESH-003
    lens: dual-system-divergence-mapping / conceptual-alignment (directive 032)
    severity: 3
    title: "FR-003/FR-004/FR-005 require fixing the fixture helpers' CODE but not their docstrings, which still document the pre-fix wrong path — the exact FR-002 defect class, relocated into test code"
    evidence:
      - code: "tests/charter/test_org_expected_artifacts.py:32 — _write_org_expected_artifacts docstring: \"Write \\`\\`<org_root>/<mission_type>/expected-artifacts.yaml\\`\\`.\""
      - code: "tests/charter/test_mission_type_profiles.py:997 — _write_org_expected_artifacts docstring, same wrong-path text"
      - code: "tests/dossier/test_manifest.py:517 — _write_org_manifest docstring, same wrong-path text"
      - code: "tests/dossier/test_rebaseline.py:495 — _write_org_manifest docstring, same wrong-path text (one-liner)"
      - artifact: "spec.md FR-002: \"Correct the module/function docstring ... so the mismatch between the docstring's ... detail and the actual path can never again be invisible to a reader of one side alone\""
      - artifact: "spec.md FR-003/FR-004/FR-005: each describes updating the helper's *implementation* (the `target_dir = org_root / mission_type` join) but none mentions updating the helper's docstring"
    claim: >
      FR-002 exists specifically because org_expected_artifacts.py's own
      docstring said one thing while the code did another. The four touched
      test files' `_write_org_expected_artifacts` / `_write_org_manifest`
      helpers have the identical shape: a docstring literally reading
      "Write \`\`<org_root>/<mission_type>/expected-artifacts.yaml\`\`" sitting
      directly above the join this mission is correcting to
      `<org_root>/missions/<mission_type>/expected-artifacts.yaml`. FR-003,
      FR-004, and FR-005's text all describe correcting the join but say
      nothing about the docstring one line above it, so a literal
      implementation of this spec fixes the code and leaves each helper's
      own doc comment stating the now-wrong path — reproducing, inside the
      mission's own touched test files, the exact "docstring says X, code
      does Y" defect class this mission exists to eliminate from production
      code.
    remediation: >
      Add one clause to FR-003/FR-004/FR-005 (or a single shared note)
      requiring each corrected helper's docstring to be updated in step with
      its join, so no touched fixture helper is left documenting the pre-fix
      path. tests/dossier/test_indexer.py's helper has no docstring and is
      unaffected.

