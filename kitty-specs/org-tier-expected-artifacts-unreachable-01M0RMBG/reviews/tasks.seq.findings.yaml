findings:
  - id: TASKS-SEQ-001
    lens: write-scopes
    severity: 1
    title: "lanes.json predicted_surfaces are naive keyword-matched noise, not real surface exposure"
    evidence:
      - artifact: "lanes.json § lanes[0].predicted_surfaces"
      - code: "src/specify_cli/lanes/compute.py:98-118 (SURFACE_TAXONOMY, _SURFACE_KEYWORDS, infer_surfaces — case-insensitive substring match over WP prose)"
      - code: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/tasks/WP01-org-tier-expected-artifacts-anchor-fix.md (contains the substrings 'layout', 'test suite', 'tracker', 'sync', 'artifact', 'template', 'api', 'route', 'view' in unrelated prose, e.g. 'org_expected_artifacts.py', 'tracker_refs: []', 'declared-order', word 'view' inside other words)"
    claim: >
      lanes.json's computed lane carries predicted_surfaces = ["api", "app-shell",
      "artifact-rendering", "tests", "tracker-integration"] for a mission that is a pure
      charter/dossier path-join bugfix touching no API, app-shell, tracker-integration, or
      artifact-rendering code. These tags come from infer_surfaces()'s naive
      case-insensitive substring match against the WP prompt's markdown body (e.g. the
      literal word "tracker" inside "tracker_refs: []" frontmatter, "artifact" inside
      "expected-artifacts.yaml" appearing 81 times, "route"/"view" as substrings of
      unrelated words), not from the actual owned_files/write_scope. Because this mission
      has exactly one WP, the surface tags never feed a real overlap decision here (surface
      matching only matters when comparing two WPs), so this is inert for this mission's
      own execution — but a reviewer skimming lanes.json in isolation could misread it as
      signalling this WP touches API/tracker/app-shell surfaces, and if a future
      fast-follow WP is added to this same mission the noisy tags would falsely widen its
      predicted overlap set.
    remediation: >
      No functional change needed for this single-WP mission (informational finding only).
      If useful, note in the mission's tracer/review notes that lanes.json's
      predicted_surfaces field is a coarse keyword heuristic (not derived from owned_files)
      and should not be read as a claim about which subsystems this WP actually touches;
      treat write_scope/owned_files as the authoritative surface list instead. This is a
      pre-existing tooling characteristic of infer_surfaces() (src/specify_cli/lanes/compute.py),
      not something this mission's authoring can fix, so no change to this mission's own
      artifacts is required.
