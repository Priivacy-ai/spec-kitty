findings:
  - id: TASKS-FRESH-001
    lens: structural-fix-plan-verification (fabricated code citation)
    severity: 2
    title: "New tracer-tooling-friction.md F3 section cites infer_surfaces() at the wrong line range"
    evidence:
      - artifact: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/tracer-tooling-friction.md — new \"F3 — lanes.json predicted_surfaces is keyword-match noise\" section, added in commit bd3e832e6"
      - code: "src/specify_cli/lanes/compute.py:98-118 is actually the `_SURFACE_KEYWORDS` dict literal (surface -> keyword tuples); the `infer_surfaces()` function the text describes and cites lives at src/specify_cli/lanes/compute.py:162-176 (`def infer_surfaces(wp_body: str) -> list[str]:`)"
    claim: >
      The fix round added a new F3 section to tracer-tooling-friction.md explaining why
      lanes.json's predicted_surfaces list is keyword-match noise, citing
      "`infer_surfaces()` (`src/specify_cli/lanes/compute.py:98-118`)". Verified against the
      live file: lines 98-118 hold the `_SURFACE_KEYWORDS` mapping, not the `infer_surfaces`
      function body, which actually spans lines 162-176. This is a newly-introduced,
      independently-verifiable factual error in an artifact whose entire purpose (per its own
      framing, "so a future reader ... does not mistake predicted_surfaces for a claim") is to
      give a future reader a precise, checkable citation. The substantive claim (keyword
      substring matching, not owned_files, drives predicted_surfaces) is correct; only the
      line-range citation is wrong.
    remediation: >
      Correct the citation to `src/specify_cli/lanes/compute.py:162-176` for the
      `infer_surfaces()` function itself, or additionally cite `:98-118` separately and
      explicitly as the `_SURFACE_KEYWORDS` table it consumes, rather than presenting one
      range as if it were the function definition.

  - id: TASKS-FRESH-002
    lens: structural-fix-plan-verification (quality-gate reproduction correctness)
    severity: 3
    title: "T006's new diff-coverage repro command offers a --compare-branch fallback that would silently diverge from CI's actual base ref"
    evidence:
      - artifact: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/tasks/WP01-org-tier-expected-artifacts-anchor-fix.md, T006 step 4 (new text added in commit bd3e832e6) and the matching Definition-of-Done checklist item"
      - code: "WP01 frontmatter: planning_base_branch: fix/org-tier-expected-artifacts-3703; merge_target_branch: fix/org-tier-expected-artifacts-3703 (so this mission's PR base_ref, and therefore CI's origin/${{ github.base_ref }} in .github/workflows/ci-quality.yml's diff-coverage job, is fix/org-tier-expected-artifacts-3703, not main)"
      - code: "git rev-list --left-right --count origin/main...fix/org-tier-expected-artifacts-3703 → \"0\\t18\" — the fix branch is 18 commits ahead of origin/main with origin/main not yet having diverged, confirmed live in this checkout"
    claim: >
      T006 step 4's new local diff-coverage repro correctly names
      `--compare-branch=fix/org-tier-expected-artifacts-3703` as the primary ref (matching
      the mission's actual merge_target_branch / CI base_ref), but then adds a fallback: "(or
      `origin/main` if this checkout has no local
      `fix/org-tier-expected-artifacts-3703`/`origin/main` ref reachable, fetch it first:
      `git fetch origin main`)". This fallback is wrong: CI's diff-coverage step compares
      against `origin/${{ github.base_ref }}`, and this mission's base_ref is
      `fix/org-tier-expected-artifacts-3703`, never `main`. Substituting `origin/main` as the
      compare-branch measures coverage against a different diff than CI will — right now the
      two branches coincide (0 commits diverged on main's side per the rev-list above), so the
      substitution happens to be harmless today, but that's incidental: the moment `main`
      advances independently of the fix branch (which the mission's own branch_strategy
      anticipates as normal), a reviewer following this fallback would compute diff-coverage
      against a base that no longer matches CI's, producing a local PASS/FAIL result decoupled
      from what CI will actually report. The sentence immediately after this fallback claims
      the whole block "mirrors the real CI gate ... compares against origin/${{
      github.base_ref }}" — which is only true on the primary path, not the fallback path it
      just offered.
    remediation: >
      Drop the `origin/main` fallback entirely. If the local `fix/org-tier-expected-artifacts-3703`
      ref is unreachable, the correct recovery is `git fetch origin
      fix/org-tier-expected-artifacts-3703` (mirroring this mission's own base branch), not a
      fetch of `main` — main is not this PR's base_ref and is not guaranteed to stay
      commit-identical to the fix branch between now and when this WP lands.
