findings:
  - id: SPEC-FRESH2-001
    lens: "structural-root-cause (five-paradigm: bisection-and-timeline-construction)"
    severity: 2
    title: Addendum misattributes the three-file discovery to "this fix round" when it happened in the prior round
    evidence:
      - artifact: "spec.md § Clarifications, Addendum (fix round, 2026-08-24), line 18"
      - code: "git log: 83d6a86c2 (initial spec, 2026-08-24 03:03:54 +0200) -> bcd634dd9 (round 1, 2026-08-24 03:18:34 +0200, commit subject: 'spec: address adversarial review findings on org-tier expected-artifacts spec' / 'Expand C-001's file set from 3 to 6 files and add FR-005 to cover three tests/dossier/ fixture helpers ... (SPEC-GOV-001)') -> 1503cc65d (round 2, THIS diff, 2026-08-24 03:26:37 +0200)"
    claim: >
      The Addendum added in this round (1503cc65d) states the three-tests/dossier-file
      discovery "predates a discovery made during this fix round's own investigation."
      But the discovery, and the resulting C-001 six-file expansion plus FR-005, were
      already made and folded in during the PRIOR round (bcd634dd9, whose own commit
      message says verbatim: "Expand C-001's file set from 3 to 6 files and add FR-005
      to cover three tests/dossier/ fixture helpers that duplicate the same pre-fix
      path join ... (SPEC-GOV-001)"). This round's diff only adds narrative text; it
      does not touch C-001 or FR-005. Both the Addendum and the adjacent new
      docstring-Note use the identical, round-unnumbered label "(fix round,
      2026-08-24)" for text added in round 1's C-001/FR-005 (unlabeled) versus round
      2's own additions (labeled) — so a reader auditing the mission's decision
      history cannot tell, from the spec alone, that the "discovery" the Addendum
      narrates as belonging to "this fix round" actually belongs to the prior round.
      This is exactly the failure mode the review brief warns about: not a claim that
      the operator was re-consulted, but a misstated supersession/timeline in the one
      section (Clarifications) meant to be the authoritative record of how the
      operator's "two test fixtures ... nothing else" instruction came to be
      superseded.
    remediation: >
      Reword the Addendum to attribute the discovery to the correct round, e.g.:
      "...predates a discovery made during this mission's prior adversarial-review
      fix round (commit bcd634dd9), which already folded the expansion into C-001's
      six-file set and FR-005; this addendum only reconciles the Clarifications
      narrative with that already-decided scope, it does not re-decide it." Also
      distinguish the two rounds' labels (e.g. "(fix round 1, ...)" / "(fix round 2,
      ...)") so the provenance of each addition is unambiguous from the spec text
      alone, without needing to consult git log.
  - id: SPEC-FRESH2-002
    lens: "structural-root-cause (five-paradigm: differential-matrix / divergence-mapping)"
    severity: 3
    title: NFR-001's new RED-first exemption is asymmetric — it names FR-004/FR-005 but leaves FR-003's own non-new components unaddressed
    evidence:
      - artifact: "spec.md § Non-Functional Requirements, NFR-001, line 72"
      - artifact: "spec.md § Functional Requirements, FR-003, line 62 (the five hand-constructed TestResolveOrgExpectedArtifactsMalformedFile path corrections and the shared _write_org_expected_artifacts helper correction)"
    claim: >
      This round's NFR-001 extension explicitly scopes RED-first ATDD evidence to
      "FR-001/FR-002 ... plus FR-003's new old-location-returns-None regression test
      case," then explicitly exempts FR-004's and FR-005's fixture-helper corrections
      as "maintenance of existing coverage ... not new RED-first behaviour." But FR-003
      itself bundles three distinct kinds of change: (1) the shared
      _write_org_expected_artifacts helper correction (maintenance, same shape as
      FR-004/FR-005), (2) five hand-corrected path constructions in
      TestResolveOrgExpectedArtifactsMalformedFile (also maintenance — existing tests
      whose direct path-construction must track the anchor move, not new pinned
      behaviour), and (3) the one genuinely new old-location-returns-None test case.
      NFR-001's new exemption sentence names only FR-004/FR-005 as excluded, leaving
      FR-003's own (1) and (2) unaddressed — neither explicitly included nor excluded.
      FR-003's own prose even primes a reviewer to conflate them: it says leaving the
      five methods uncorrected would undermine "NFR-001's GREEN-at-final-commit
      promise," inviting the reading that NFR-001 governs all of FR-003, not just its
      one new test case. A WP reviewer verifying "RED at planning base, GREEN at final
      commit" per NFR-001 has no textual basis to know whether the helper fix and the
      five path corrections need their own RED-first commit evidence or are exempt
      like FR-004/FR-005 — a live source of rework/dispute at WP review time.
    remediation: >
      Extend NFR-001's exemption sentence to explicitly cover FR-003's non-new
      components, e.g.: "FR-003's _write_org_expected_artifacts helper correction and
      its five hand-corrected TestResolveOrgExpectedArtifactsMalformedFile path
      constructions are, like FR-004's and FR-005's fixture-helper corrections,
      maintenance of existing coverage — not new RED-first behaviour — and are
      excluded from this RED-first requirement; only FR-003's one new
      old-location-returns-None test case is in scope for RED-first verification."
