findings:
  - id: TASKS-VERIFY-001
    lens: Gate verification (T006)
    severity: 3
    title: "T006's diff-coverage confirmation step names the gate but gives no runnable local command"
    evidence:
      - artifact: "tasks/WP01-org-tier-expected-artifacts-anchor-fix.md § Subtask T006, step 4 (and Definition of Done: \"diff-coverage locally confirmed ≥90% on changed lines\")"
      - code: ".github/workflows/ci-quality.yml:3334-3394 (diff-coverage critical-path job: aggregates out/reports/artifacts/coverage-*.xml from separate fast+integration jobs, then `uv run diff-cover \"${coverage_reports[@]}\" --compare-branch=origin/${{ github.base_ref }} --fail-under=90 --include \"${critical_paths[@]}\"`, with `src/charter/*` in critical_paths at line 3348)"
      - code: "pyproject.toml:110 (`diff-cover>=10.0.0` is a declared project dependency, so a local reproduction is feasible)"
    claim: >
      T006 step 4 says "Check diff-coverage locally on the one production file ...
      confirm rather than assume" but, unlike step 2 (TID251: exact `ruff check
      src tests --select TID251` invocation given) and step 3 (Contextive: exact
      `uv run python scripts/generate_contextive_glossaries.py check` invocation
      given), it supplies no runnable command. The real CI gate aggregates
      coverage-*.xml artifacts produced by separate fast+integration test jobs
      and runs `diff-cover --compare-branch=origin/<base>`, which is not
      something an implementer can trivially replicate from "confirm rather than
      assume" alone (it requires generating a coverage XML for the touched
      lines, having `origin/<base>` available locally, and knowing diff-cover's
      `--include` pattern). The DoD line ("diff-coverage locally confirmed ≥90%
      on changed lines") repeats the same unactionable phrasing. This is exactly
      the "not just 'run the tests and confirm green'" failure mode the T006
      lens targets, isolated to this one item — the risk of an actual gate
      failure is low (a 1-line path-join change already covered by dozens of
      existing/new tests), but the verification step as written cannot be
      mechanically executed by the implementer or independently reproduced by
      the reviewer the way the other T006 items can.
    remediation: >
      Add a concrete local recipe to T006 step 4, e.g.: `pytest
      tests/charter/test_org_expected_artifacts.py --cov=charter
      --cov-report=xml:coverage.xml -q && uv run diff-cover coverage.xml
      --compare-branch=<planning-base-or-origin/main> --fail-under=90 --include
      'src/charter/*'` (substituting the actual reachable base ref/branch name
      in this worktree), or explicitly downgrade this step to "advisory,
      confirmed at CI" if a faithful local reproduction is judged not worth
      specifying, so the DoD checkbox and T006 step 4 both point to something
      an implementer can actually run rather than "confirm rather than assume."
