findings:
  - id: TASKS-DECOMP-001
    lens: work-package-decomposition (cross_cutting field misuse)
    severity: 3
    title: "`cross_cutting: true` is applied to a single-concern feature WP, contradicting the canonical field's own semantics"
    evidence:
      - artifact: "wps.yaml — `cross_cutting: true` on WP01"
      - artifact: "tasks/WP01-org-tier-expected-artifacts-anchor-fix.md § 'This is the ONLY work package for this mission' (lines ~88-95)"
      - code: "packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md:106 — \"If the WP is cross-cutting infrastructure with no specific concern (e.g. a test harness setup WP), set `cross_cutting: true` and leave `plan_concern_refs` empty.\""
      - code: "packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md:180 — \"`cross_cutting`: Set to `true` for infrastructure WPs that span all concerns and have no specific IC-## ref.\""
      - code: "src/specify_cli/core/wps_manifest.py:140-167 (`check_concern_refs_coverage`) — cross_cutting is a warning-suppression flag for missing plan_concern_refs, not an ownership-overlap bypass."
      - artifact: "plan.md — full file read; contains no `## IC-##` / `### IC-##` headings anywhere (grep for `IC-` in plan.md and spec.md returns zero matches)."
    claim: >
      The canonical tasks-outline doctrine (packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md)
      defines `cross_cutting: true` for exactly one class of WP: "shared infrastructure with no specific concern"
      or infrastructure that "spans all concerns" (its own worked example is "a test harness setup WP"). WP01 is
      the opposite of that: it is the mission's sole work package, and it delivers the mission's one and only
      concern — the resolver path-join fix itself, not shared infrastructure sitting alongside other concerns.
      By definition a WP that IS the entire mission cannot "span all concerns" in the doctrine's sense; it has
      exactly one concern, itself. The WP01 prompt's own Context section (lines ~88-95) never claims WP01 is
      infrastructure — it justifies the *WP-count* decision (one WP vs. two) on ownership-overlap grounds (see
      TASKS-DECOMP-002) and never explains why `cross_cutting: true` rather than `plan_concern_refs` was chosen.
      Separately, tracing the actual mechanism `cross_cutting` bypasses (`check_concern_refs_coverage` in
      wps_manifest.py) shows it is purely a warning-suppression flag gated on `_concern_tracking_required`, which
      is only True when plan.md itself defines `## IC-##` headings OR wps.yaml explicitly sets `plan_concern_refs`/
      `cross_cutting`. Since plan.md defines **no** IC-## concern headings at all (verified: zero matches),
      `_concern_tracking_required` would have been False and no warning would ever have fired if wps.yaml had
      simply left both fields unset — so setting `cross_cutting: true` here is a self-triggering, self-satisfying
      flag: it activates a check that would not otherwise apply, then trivially passes it. The root cause is one
      phase up: plan.md never decomposed into IC-## implementation concerns for tasks.md to cite, so `tasks`
      reached for the doctrinally-wrong field (`cross_cutting`, meant for infra WPs) instead of surfacing that gap
      or citing plan.md's actual sections in a plain-language rationale. This mislabels WP01's nature for any
      future reader using `cross_cutting`/`plan_concern_refs` metadata to understand WP intent (Paula Patterns:
      whack-a-field misuse — a governance field repurposed to paper over a missing decomposition rather than
      naming the real thing).
    remediation: >
      Either (a) unset `cross_cutting` entirely in wps.yaml — since plan.md defines no IC-## headings, no warning
      will fire regardless, so nothing is gained by setting it true and the field is left honestly empty; or
      (b) if the WP-authoring convention requires one of the two fields to be populated for clarity, add a short
      plain-language note in wps.yaml/WP01's prompt explicitly stating "plan.md was not decomposed into IC-##
      concerns for this single-WP bugfix mission; cross_cutting is set here only to satisfy the concern-tracking
      field convention, not because WP01 is infrastructure" — so a future reader does not mistake this WP for
      shared/cross-cutting infra per the doctrine's own definition.
  - id: TASKS-DECOMP-002
    lens: work-package-decomposition (single-WP structural justification)
    severity: 3
    title: "WP01's stated justification for collapsing into one WP ('codebase-wide is the only exemption') misstates the ownership-overlap validator's actual exemptions"
    evidence:
      - artifact: "tasks/WP01-org-tier-expected-artifacts-anchor-fix.md lines ~88-95: \"two narrow WPs both claiming that file would fail spec-kitty's ownership validator (file-level overlap, not line-level; `codebase-wide` is the only exemption and does not apply to a narrow six-file fix like this one).\""
      - code: "src/specify_cli/ownership/validation.py:160-215 (`validate_no_overlap`) — docstring: \"When *dependencies* is supplied, **same-lane sequential** WPs — those with a directed dependency path between them — are also exempt... The no-overlap guard exists to stop *parallel* (dependency-unordered) WPs from colliding, so only concurrent pairs are flagged.\" (lines 168-171); implementation at lines 196-200 skips any WP pair reachable via a dependency edge, independent of `scope: codebase-wide`."
    claim: >
      The WP01 prompt asserts, as the technical justification for choosing one WP over two, that `codebase-wide`
      scope is the *only* mechanism that exempts a file from the ownership-overlap validator's file-level-overlap
      check. This is factually incorrect: `validate_no_overlap` (src/specify_cli/ownership/validation.py) has a
      second, independent exemption — two WPs joined by a directed dependency edge ("same-lane sequential" pairs)
      are also exempt from the overlap check, because the guard's stated purpose is to stop *parallel*
      (dependency-unordered) WPs from colliding, not to forbid any two WPs from ever sharing a file. Had the
      author instead split WP01 into, say, WP01 (RED-first tests + FR-001/002 implementation) and WP02 (maintenance,
      `dependencies: [WP01]`), both touching `tests/charter/test_org_expected_artifacts.py`, the dependency edge
      would have exempted that overlap from `validate_no_overlap` — no `codebase-wide` scope needed. This does not
      necessarily mean two WPs would have been the *better* choice (a single small WP with an internally ordered
      commit sequence is a defensible, and arguably cleaner, choice for a six-file fix this size, and plan.md's PR
      Shape section independently commits to one PR regardless of WP count) — but the prompt's own stated rationale
      for *why* a split was impossible is inaccurate, and a future author copying this reasoning as precedent for a
      larger mission would incorrectly rule out a dependency-ordered WP split that spec-kitty's tooling actually
      supports.
    remediation: >
      Correct the WP01 prompt's Context section to either (a) drop the inaccurate "codebase-wide is the only
      exemption" claim and instead justify the single-WP choice on its actual merits (six files is small enough
      that one WP with an internally ordered commit sequence is simpler to review than two dependency-chained WPs,
      and plan.md's own Phasing section already describes this as one linear sequence, not two independent
      streams), or (b) if the ownership-validator angle is kept, correct it to name both exemptions accurately:
      "two WPs sharing this file would need either `codebase-wide` scope (inapplicable here) or a
      `dependencies: [WP01]` edge between them (`validate_no_overlap` exempts dependency-ordered pairs) — we chose
      one WP instead of a two-WP dependency chain because the fix is small enough that the extra WP-boundary
      overhead isn't worth it, not because a split was technically blocked."
