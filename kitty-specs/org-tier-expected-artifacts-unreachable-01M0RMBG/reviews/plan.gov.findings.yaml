findings:
  - id: PLAN-GOV-001
    lens: Campsite scope
    severity: 3
    title: "Plan's six-file survey misses the same docstring-drift defect (FR-002's own class) in both of the resolver's direct production callers"
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope (lines 311-334)"
      - artifact: "plan.md § Seam (lines 99-122), which names both callers directly"
      - artifact: "plan.md § Project Structure (lines 90-93), which declares `resolver.py` and `manifest.py` 'read-only references... neither is edited by this mission' with no mention of their docstrings"
      - code: "src/charter/mission_type_profiles.py:1030 — `_resolve_expected_artifacts_slot`'s own docstring: \"FR-008 (WP05): an org-pack ``<org_root>/<mission_type>/expected-artifacts.yaml``...\""
      - code: "src/specify_cli/dossier/manifest.py:219-221 — `ManifestRegistry.load_manifest`'s own docstring: \"FR-008 (WP05): when *repo_root* is given... an org-pack ``<org_root>/<mission_type>/expected-artifacts.yaml`` (see :func:`charter.org_expected_artifacts.resolve_org_expected_artifacts`, contract C-4) takes precedence...\""
      - code: "src/charter/org_expected_artifacts.py:82 (FR-001's fix target) and FR-002 (the docstring fix inside that same file, lines 51-79)"
    claim: >
      The plan's Campsite-Clean Scope section states it read "all six files" and found "no
      dead/duplicated code... beyond the FR-003/004/005 duplication," and its Seam section
      names the resolver's exact two production callers (`_resolve_expected_artifacts_slot`
      in src/charter/mission_type_profiles.py, and `ManifestRegistry.load_manifest` in
      src/specify_cli/dossier/manifest.py) only to assert their "signature, call site, or
      control flow" is unaffected. Independent verification shows each of those two callers
      carries its OWN docstring prose that also states the pre-fix, wrong path
      (`<org_root>/<mission_type>/expected-artifacts.yaml`, no `missions/` segment) — the
      exact defect class FR-002 exists to eliminate ("so the mismatch between the
      docstring's precedence/merge-semantics detail and the actual path can never again be
      invisible to a reader of one side alone"). Neither `src/charter/mission_type_profiles.py`
      nor `src/specify_cli/dossier/manifest.py` (the production modules, as opposed to their
      test files, which ARE in the six-file set) is touched by this mission, so both
      docstrings will describe the now-INCORRECT path immediately after FR-001/FR-002 land —
      reintroducing, in the resolver's two sole direct callers, the identical
      "docstring says X, code does Y" hazard this mission was chartered to remove from the
      resolver itself. This is a direct, domain-matched, proportional connection to the
      stated defect (Standing Order #2 / `RECONCILE_CHANGE_SCOPE_TENSIONS`'s Boy Scout test),
      not adjacent unrelated cleanup, yet the plan's six-file survey and its explicit
      "no campsite-clean needed" verdict never surface or weigh it — unlike the C-007 frozen
      contract doc, which the plan DOES name and deliberately defer with a stated rationale.
    remediation: >
      Either (a) extend C-001's file set by the two one-line docstring corrections in
      `src/charter/mission_type_profiles.py:1030` and
      `src/specify_cli/dossier/manifest.py:219-221` (same edit shape as FR-002, applied to
      the resolver's two direct callers — this is production-code drift, not test
      maintenance, so it does not disturb the FR-003/004/005 test-regression rationale that
      justified the five-file test expansion), or (b) if the plan-author's judgment is that
      C-001's six-file ceiling should hold exactly as operator-decided, add an explicit,
      stated deferral for these two docstrings (mirroring the C-007 treatment of the frozen
      contract doc) rather than leaving the gap unweighed and unmentioned, so a future
      reader/ledger sweep can find it deliberately, not by accident.
