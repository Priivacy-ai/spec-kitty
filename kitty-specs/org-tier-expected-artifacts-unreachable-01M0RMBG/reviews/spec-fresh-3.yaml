schema: review-findings/v1
complete: true
phase: spec
lens_group: fresh
mission: org-tier-expected-artifacts-unreachable-01M0RMBG
findings:
  - id: SPEC-FRESH3-001
    lens: doctrine-conceptual-alignment
    severity: 2
    title: Addendum has drifted into review-loop provenance narration instead of stating mission-relevant facts
    evidence:
      - artifact: "spec.md § Clarifications, Addendum paragraph (line 18)"
      - artifact: "spec.md § Clarifications, Addendum paragraph as it read pre-round-3 (git diff 1503cc65d HEAD)"
    claim: >
      This round reworded the Addendum from "a discovery made during this fix round's own
      investigation" (round 2's wording, which was itself inaccurate — `git diff 83d6a86c2
      bcd634dd9` shows the three-file discovery and C-001's six-file expansion / FR-005 were
      actually authored in round 1, one round before the Addendum existed) to "a discovery made
      during an earlier pass of this mission's review loop — not the pass that wrote this
      addendum ... this addendum only reconciles the Clarifications narrative with that
      already-decided scope — it does not re-decide it, and it is not itself the pass that made
      the discovery." The correction is factually accurate, but the fix compounds rather than
      removes the underlying problem: the paragraph is now built entirely around which review
      pass discovered or wrote what, a fact with zero bearing on FR-001..FR-005 implementation.
      An implementer picking this up RED-first gains nothing from the attribution history; the
      only operative content (three named test files, already folded into C-001's six-file set
      and FR-005, doesn't reopen C-003) is buried inside two sentences of process bookkeeping and
      a double negative ("not the pass that wrote this addendum ... it is not itself the pass
      that made the discovery"). This is exactly the accretion pattern of self-referential,
      review-trail-dependent spec content the task brief asks to be skeptical of.
    remediation: >
      Replace the provenance narrative with a flat statement of fact and drop the pass-by-pass
      attribution entirely, e.g.: "Note: the 'two test fixtures' figure in the operator decision
      above is superseded — three additional test files (tests/dossier/test_manifest.py,
      test_rebaseline.py, test_indexer.py) also duplicate the pre-fix path join and are already
      folded into C-001's six-file set and FR-005 below; this does not reopen C-003." If the
      review-loop's own history needs preserving for governance/audit reasons, park it in the
      mission's review artifacts (kitty-specs/.../reviews/) rather than in the spec body an
      implementer must read to build FR-001..FR-005.

  - id: SPEC-FRESH3-002
    lens: doctrine-conceptual-alignment
    severity: 2
    title: NFR-001's new closing sentence misattributes wording to FR-003 that FR-003 does not use
    evidence:
      - artifact: "spec.md § Requirements → Non-Functional Requirements, NFR-001 (line 72), final sentence"
      - artifact: "spec.md § Requirements → Functional Requirements, FR-003 (line 62), final clause"
    claim: >
      NFR-001's round-3 addition says "FR-003's reference (in its own FR row) to preserving
      'NFR-001's GREEN-at-final-commit promise' describes why..." — framing FR-003 as making a
      claim about "preserving" that promise. But FR-003's actual text says the opposite framing:
      leaving the five hand-corrected constructions unfixed would be "undermining NFR-001's
      GREEN-at-final-commit promise for this class" (verified verbatim via grep on both rows).
      FR-003 never uses the word "preserving." NFR-001 puts a quoted phrase ("NFR-001's
      GREEN-at-final-commit promise") in the correct exact wording but wraps it in a framing verb
      ("reference ... to preserving") that inverts FR-003's actual valence (risk-of-undermining
      vs. claim-of-preserving). A reader cross-checking NFR-001 against FR-003 to resolve scope
      will not find the "preserving" framing FR-003 is said to contain.
    remediation: >
      Reword NFR-001's closing sentence to match FR-003's actual language, e.g.: "FR-003's own
      row warns that leaving the helper fix or the five path corrections undone would undermine
      NFR-001's GREEN-at-final-commit promise for this class — describing why the helper fix and
      five path corrections must still be made and pass at the final commit, not that they need
      their own RED-first commit pair."

  - id: SPEC-FRESH3-003
    lens: doctrine-conceptual-alignment
    severity: 3
    title: NFR-001 has grown into a 292-word single table cell that is no longer scannable as one coherent requirement
    evidence:
      - artifact: "spec.md § Requirements → Non-Functional Requirements, NFR-001 (line 72) — measured at 292 words / ~2450 characters in one markdown table cell, versus FR-003 (the next-densest row) at 230 words"
      - artifact: "spec.md § Requirements → Functional Requirements, FR-003 (line 62) — lists the same five TestResolveOrgExpectedArtifactsMalformedFile method names with line numbers"
    claim: >
      Three fix rounds have layered onto NFR-001, in order: (1) the base ATDD requirement for
      FR-001/FR-002, (2) two distinct RED-state definitions for FR-003's new test case, (3) an
      exclusion clause for FR-004/FR-005's fixture-helper maintenance, and now (4, round 3) a
      second exclusion clause re-listing FR-003's own five hand-corrected test method names
      (already enumerated with line numbers in FR-003's row) plus a gloss on FR-003's own
      internal cross-reference back to NFR-001 (see SPEC-FRESH3-002). The task brief specifically
      asks whether NFR-001 is "a readable, single coherent requirement or a tangle of exemption
      clauses that would confuse an implementer" — after this round it reads as the latter: five
      distinct exemption/inclusion clauses and a duplicate test-name enumeration compressed into
      one unbroken markdown-table prose paragraph, with no clause boundaries to scan against
      (contrast the same information in FR-003, which is dense but scoped to one FR). An
      implementer or WP reviewer verifying "RED at planning base, GREEN at final commit" per
      NFR-001 must parse the entire paragraph correctly to know which of FR-001/002/003/004/005's
      ~10 constituent test changes are in vs. out of RED-first scope — a single missed clause
      (e.g. mistaking FR-003's five hand-corrected methods for in-scope, since the exclusion is
      three sentences deep) would cause avoidable rework demanding RED-first commits for
      maintenance-only changes, or the reverse: skipping a RED-first commit that was actually
      required.
    remediation: >
      Split NFR-001 into a short requirement statement plus a compact scope table/checklist
      (either inline as a nested list under the row, or as a short subsection immediately after
      the Requirements table) with two columns: "RED-first required" (FR-001, FR-002, FR-003's
      new old-location-returns-None case) and "Maintenance only, GREEN-at-final-commit" (FR-003's
      helper + five path corrections, FR-004's helper, FR-005's three helpers) — so the RED-first
      boundary is a lookup, not a parse of a 292-word paragraph. Do not restate the five method
      names again; cross-reference FR-003's row instead of duplicating its enumeration.
