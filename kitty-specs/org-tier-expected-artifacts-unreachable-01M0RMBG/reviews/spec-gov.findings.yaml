schema: review-findings/v1
complete: true
phase: spec
lens_group: gov
mission: org-tier-expected-artifacts-unreachable-01M0RMBG
findings:
  - id: SPEC-GOV-001
    lens: scope
    severity: 4
    title: "C-001's 'exactly three files' claim is contradicted by three more test files whose independently-duplicated fixture helpers write to the same pre-fix (wrong) path and assert the org override IS found — they will regress GREEN-to-RED when FR-001 lands, and SC-003's verification command does not cover them"
    evidence:
      - artifact: "spec.md § Constraints, C-001 (\"the file set for this mission is fixed at exactly three files\")"
      - artifact: "spec.md § Success Criteria, SC-003 (\"pytest tests/charter/test_org_expected_artifacts.py tests/charter/test_mission_type_profiles.py passes\")"
      - code: "tests/dossier/test_manifest.py:509-524 (`_write_org_manifest` writes `org_root / mission_type / \"expected-artifacts.yaml\"` — the pre-fix, wrong anchor) and :542-577 (`TestManifestRegistryOrgTier.test_org_override_delta_through_load_manifest`, which calls `ManifestRegistry.load_manifest(\"software-dev\", repo_root=project_root)` and asserts `len(after.required_always) == before_count + 1`, i.e. asserts the override IS found at that fixture location)"
      - code: "tests/dossier/test_rebaseline.py:494-501 (`_write_org_manifest`, same wrong anchor) and :584-609 (`TestRebaselineOrgAwareness.test_org_pack_required_artifact_reaches_rebaselined_snapshot`, asserts `_ORG_REQUIRED_KEY in _snapshot_artifact_keys(...)`) and :680-708 (`test_two_pack_chain_second_pack_reaches_rebaseline`, same dependency)"
      - code: "tests/dossier/test_indexer.py:714-721 (locally-duplicated `_write_org_manifest`, same wrong anchor) and :724-755 (`test_org_override_changes_required_artifact_set`, asserts the org-required artifact appears as missing in the indexed dossier)"
    claim: >
      resolve_org_expected_artifacts (src/charter/org_expected_artifacts.py:82) is a shared
      seam consumed, directly or transitively, by more callers than the two named in the
      spec's Key Entities section (ManifestRegistry.load_manifest and
      _resolve_expected_artifacts_slot). Three further test modules —
      tests/dossier/test_manifest.py, tests/dossier/test_rebaseline.py, and
      tests/dossier/test_indexer.py — each independently re-implement a
      `_write_org_manifest`/`_write_org_expected_artifacts` fixture helper hardcoded to the
      exact same pre-fix, wrong path join (`org_root / mission_type / "expected-artifacts.yaml"`,
      no `missions/` segment), and each has at least one currently-passing test that asserts the
      org override IS resolved through that fixture (via ManifestRegistry.load_manifest, the
      Indexer, or rebaseline_snapshot_file). Once FR-001's resolver-anchor fix lands exactly as
      C-001 scopes it (touching only the 3 named files), these fixtures will silently stop
      matching the corrected anchor, `resolve_org_expected_artifacts` will return None for them,
      and at minimum test_org_override_delta_through_load_manifest,
      test_org_pack_required_artifact_reaches_rebaselined_snapshot,
      test_two_pack_chain_second_pack_reaches_rebaseline, and
      test_org_override_changes_required_artifact_set will flip from GREEN to RED. SC-003's
      pytest invocation names only the two `tests/charter/` files, so an implementer who runs
      exactly the verification command the spec prescribes will see full green and conclude the
      mission is done while leaving four tests broken in the wider suite — a real regression this
      mission's own success criteria cannot detect. This also means the RECONCILE_CHANGE_SCOPE_TENSIONS
      smallest-viable-diff file set is understated: achieving the stated goal without breaking
      passing tests requires touching (or at minimum, deciding and recording a rationale for) five
      files, not three.
    remediation: >
      Expand C-001's file set (and FR-003/FR-004's fixture-update pattern) to include
      tests/dossier/test_manifest.py, tests/dossier/test_rebaseline.py, and
      tests/dossier/test_indexer.py — update each file's locally-duplicated fixture helper to
      write to the corrected `<org_root>/missions/<mission_type>/expected-artifacts.yaml` anchor,
      matching FR-003/FR-004's treatment of the two already-named test files. Extend SC-003's
      verification command (or add a parallel SC) to run these three additional files so the
      spec's own success criteria actually cover the seam's full blast radius. If, after
      investigation, some of these tests should intentionally not be updated (e.g. because a
      maintainer wants them to keep proving the pre-fix path is now inert), say so explicitly and
      convert the affected assertions rather than leaving them to regress silently.

  - id: SPEC-GOV-002
    lens: scope
    severity: 1
    title: "Related-issues parenthetical undersells #3702's file footprint (names only \"charter activate\", omits src/charter/mission_type_profiles.py) — the disjointness conclusion still holds for this mission's actual 3-file set, but the citation itself is incomplete"
    evidence:
      - artifact: "spec.md § Clarifications (\"#3701/#3702 (disjoint files — `mission_type_repository.py` and `charter activate` respectively)\")"
      - code: "GitHub issue #3702 body (`gh issue view 3702`): names both `src/specify_cli/cli/commands/charter/activate.py` AND `src/charter/mission_type_profiles.py` as files to change"
    claim: >
      The spec's parenthetical describes #3702's touched surface as just "charter activate," but
      the issue itself also names src/charter/mission_type_profiles.py — the same module (not the
      same file: this mission touches the tests/charter/test_mission_type_profiles.py test file,
      not the src/charter/mission_type_profiles.py source file) whose _resolve_expected_artifacts_slot
      this spec's own Key Entities section names as a caller of the resolver being fixed. The
      no-overlap conclusion for this mission's actual C-001 file set (which does not include
      src/charter/mission_type_profiles.py) still holds on verification, so this is a citation
      completeness gap, not a scope error.
    remediation: >
      Either drop the file-naming parenthetical (the epic/tracking-vs-code and P1-vs-P1
      distinctions already carry the no-overlap argument) or correct it to name both files #3702
      touches, so a future reader checking the citation does not have to re-derive it from the
      issue tracker.
