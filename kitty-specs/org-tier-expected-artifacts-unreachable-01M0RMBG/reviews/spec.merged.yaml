findings:
  - id: SPEC-GOV-001
    lens: scope / canonical-source / contracts
    severity: 4
    title: "C-001's 'exactly three files' claim is contradicted by three more test files whose independently-duplicated fixture helpers write to the same pre-fix (wrong) path and assert the org override IS found — they will regress GREEN-to-RED when FR-001 lands, and SC-003's verification command does not cover them"
    duplicate_of_note: "Independently raised as SPEC-GOV-001 (gov) and SPEC-ARCH-001 (arch); identical claim, evidence unioned below, severity 4 in both."
    evidence:
      - artifact: "spec.md § Constraints, C-001 (\"the file set for this mission is fixed at exactly three files\")"
      - artifact: "spec.md § Success Criteria, SC-003 (pytest scoped to only test_org_expected_artifacts.py and test_mission_type_profiles.py)"
      - code: "tests/dossier/test_manifest.py:509-524/516-524 (`_write_org_manifest` writes `org_root / mission_type / \"expected-artifacts.yaml\"`, the pre-fix wrong anchor) and :526-577/554,614,656,665,713 (`class TestManifestRegistryOrgTier`; `test_org_override_delta_through_load_manifest` calls real `ManifestRegistry.load_manifest(..., repo_root=project_root)` end-to-end, asserts `len(after.required_always) == before_count + 1`)"
      - code: "tests/dossier/test_rebaseline.py:494-501/494-500 (`_write_org_manifest`, same wrong anchor) and :584-609,680-708/603,701,742 (`class TestRebaselineOrgAwareness`; `test_org_pack_required_artifact_reaches_rebaselined_snapshot`, `test_two_pack_chain_second_pack_reaches_rebaseline`, exercised end-to-end via `rebaseline_snapshot_file`)"
      - code: "tests/dossier/test_indexer.py:714-721/714-736 (locally-duplicated `_write_org_manifest`, same wrong anchor; `test_org_override_changes_required_artifact_set` drives `Indexer(ManifestRegistry(), repo_root=repo_root).index_feature(...)` end-to-end, no mocking)"
      - code: "src/charter/org_expected_artifacts.py:82 (the corrected join target, `org_root / \"missions\" / mission_type / _EXPECTED_ARTIFACTS_FILENAME`, per FR-001)"
    claim: >
      resolve_org_expected_artifacts is a shared seam consumed by more callers than the two
      named in the spec's Key Entities section. Three further test modules —
      tests/dossier/test_manifest.py, tests/dossier/test_rebaseline.py, and
      tests/dossier/test_indexer.py — each independently re-implement a
      `_write_org_manifest`-style fixture helper hardcoded to the exact same pre-fix, wrong
      path join, and each has at least one currently-passing test that asserts the org
      override IS resolved through that fixture, exercised end-to-end with no mocking of the
      resolver. Once FR-001's resolver-anchor fix lands exactly as C-001 scopes it (three
      files, nothing else), these fixtures will silently stop matching the corrected anchor
      and at minimum four named tests will flip GREEN to RED. SC-003's pytest invocation does
      not cover tests/dossier/, so an implementer/reviewer following the spec's own
      verification command literally would sign off while shipping this regression. This also
      means RECONCILE_CHANGE_SCOPE_TENSIONS's smallest-viable-diff file set is understated:
      achieving the stated goal without breaking passing tests requires touching (or at
      minimum explicitly deciding and recording a rationale for) five files, not three.
    remediation: >
      Expand C-001's file set (and FR-003/FR-004's fixture-update pattern, or a new FR-005) to
      include tests/dossier/test_manifest.py, tests/dossier/test_rebaseline.py, and
      tests/dossier/test_indexer.py — update each file's locally-duplicated fixture helper to
      write to the corrected `<org_root>/missions/<mission_type>/expected-artifacts.yaml`
      anchor. Extend SC-003's verification command to include these three files (or run the
      full tests/dossier/ and tests/charter/ directories) so the spec's own success criteria
      actually covers the seam's full blast radius. If some of these tests should intentionally
      NOT be updated, say so explicitly and convert the affected assertions rather than leaving
      them to regress silently.

  - id: SPEC-VERIFY-001
    lens: falsifiability
    severity: 4
    title: "FR-003's scoped action (fix only the helper) is narrower than its own stated GREEN-at-final-commit goal for the malformed-file test class"
    evidence:
      - artifact: "spec.md § FR-003"
      - artifact: "spec.md § NFR-001 (\"the reviewer verifies RED at the planning base and GREEN at the final commit\")"
      - code: "tests/charter/test_org_expected_artifacts.py:160,170,188,206,259 (five of six methods in TestResolveOrgExpectedArtifactsMalformedFile hand-construct `target_dir = org_root / \"software-dev\"` / `second_root / \"software-dev\"` directly, bypassing the _write_org_expected_artifacts helper FR-003 names)"
      - code: "tests/charter/test_org_expected_artifacts.py:31-43 (_write_org_expected_artifacts helper — the only construction FR-003 names)"
    claim: >
      FR-003 names only the shared helper. But 5 of 6 methods in
      TestResolveOrgExpectedArtifactsMalformedFile construct the old wrong path by hand,
      bypassing that helper. Left as literally written: 2 tests
      (test_malformed_yaml_file_logs_a_warning_naming_the_file,
      test_non_mapping_yaml_content_logs_a_warning_naming_the_file) FAIL outright post-fix
      (file never read, warning_records stays empty); 3 more
      (test_malformed_yaml_file_treated_as_no_match,
      test_non_mapping_yaml_content_treated_as_no_match,
      test_later_malformed_root_does_not_clobber_earlier_good_match) keep passing but
      vacuously — result is None because the file is simply never found, not because it was
      found-and-rejected-as-malformed — silently stopping exercise of the fail-closed-with-
      warning path they were written to prove. Undermines NFR-001's own GREEN-at-final-commit
      promise for this class.
    remediation: >
      Reword FR-003 to explicitly require updating every in-class fixture construction, not
      just the shared helper: name the five methods in
      TestResolveOrgExpectedArtifactsMalformedFile and require their inline
      `target_dir = org_root / "software-dev"` / `second_root / "software-dev"` constructions
      be changed to `org_root / "missions" / "software-dev"` (and the second-root equivalent)
      alongside the helper fix.

  - id: SPEC-VERIFY-002
    lens: silent-success
    severity: 4
    title: "SC-004 (old-location-only pack resolves to None post-fix) has no required test coverage in FR-001..004, and its wording drops the built-in-fallback nuance the Edge Cases section already states correctly"
    evidence:
      - artifact: "spec.md § Success Criteria > SC-004"
      - artifact: "spec.md § Edge Cases (\"A pack with a file ONLY at the old, wrong location ... must correctly resolve to None (or fall through to the built-in manifest)\")"
      - artifact: "spec.md § FR-003 (existing test matrix classes at lines 46, 65, 93, 151, 271)"
      - code: "tests/charter/test_org_expected_artifacts.py:46-65 (TestResolveOrgExpectedArtifactsEmptyCases — no fixture written at the old, wrong path; only \"no file at all\" is tested)"
      - code: "src/charter/mission_type_profiles.py:1044-1053 (_resolve_expected_artifacts_slot: when resolve_org_expected_artifacts returns None, falls through to MissionTemplateRepository.default().get_expected_artifacts(mission_type) — NOT to None — for a registered built-in type)"
      - code: "packs/built-in/missions/software-dev/expected-artifacts.yaml (confirms \"software-dev\", the mission_type used in every fixture across both test files, has a real built-in manifest to fall through to)"
    claim: >
      (1) None of FR-001 through FR-004 requires a test that plants a fixture at the OLD path
      and asserts the SC-004 outcome; the closest existing test never creates a file at all, so
      it cannot stand in as regression coverage for "a file that exists, just at the wrong
      path." SC-004 is a stated Measurable Outcome with no path to verification in the
      mission's own required work. (2) SC-004's flat "resolves to None" is only true at the
      resolve_org_expected_artifacts layer; at the ManifestRegistry.load_manifest /
      _resolve_expected_artifacts_slot layer (the layer User Story 1's AC2 covers, sitting
      right next to SC-002/SC-003 which discuss that same layer), a registered built-in
      mission type falls through to the BUILT-IN manifest, not None. The spec's own Edge Cases
      section already states this correctly; SC-004 drops the qualifier, which a literal
      test-writer using the suite's own "software-dev" fixture convention would misread.
    remediation: >
      (a) Add an explicit new test requirement (new FR or addition to FR-003) for a fixture
      written ONLY at the old path, asserting resolve_org_expected_artifacts returns None
      post-fix. (b) Reword SC-004 to carry the same "(or fall through to the built-in
      manifest)" qualifier the Edge Cases section uses, and state explicitly which layer(s) it
      is measured at. (c) Optionally extend the same fixture case to a malformed file at the
      old path, naming the resulting silently-disappeared warning as an accepted consequence
      of C-002's no-fallback decision.

  - id: SPEC-ARCH-002
    lens: canonical-source
    severity: 2
    title: "Historical contract doc cited by the live module's own docstring embeds the same wrong path this mission fixes, and is left untouched"
    evidence:
      - artifact: "spec.md § Constraints C-001 (fixes the file set at exactly three files, none of which is the contract doc)"
      - code: "src/charter/org_expected_artifacts.py:10 (module docstring cites kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md as the authoritative contract)"
      - code: "kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md:82-86 (\"## C-4\" states, in a docstring code block presented as binding shape, the pre-fix wrong path)"
    claim: >
      The production module's own docstring points readers at this historical mission-contract
      doc as the binding contract. That doc's C-4 section embeds the same wrong path this
      mission fixes. C-001 scopes the diff to exactly three files, none of which is this
      contract doc, so after the fix the module's own cited "contract of record" will
      contradict the corrected code — reproducing, one hop away, the exact "docstring says one
      thing, code says another" defect class this mission exists to close. The spec never
      acknowledges this doc or makes an explicit call on it.
    remediation: >
      Add one sentence to spec.md's Constraints or Clarifications making an explicit call:
      either (a) state that mission-scoped historical artifacts under kitty-specs/<merged-
      mission>/ are intentionally frozen point-in-time records per repo convention and not kept
      in sync with later bugfixes, so the C-4 doc is deliberately left stale, or (b) add the
      one-line code-block correction in that contract doc to the file set as a near-zero-risk,
      domain-matched, doc-only edit.

  - id: SPEC-ARCH-003
    lens: reflexivity / migrations
    severity: 2
    title: "Spec is silent on ManifestRegistry's process-scoped cache surviving across the fix boundary in a long-lived process"
    evidence:
      - artifact: "spec.md (no section discusses ManifestRegistry._cache, process lifetime, or a running/long-lived consumer)"
      - code: "src/specify_cli/dossier/manifest.py:171-190 (_cache dict; inline comment at line 183 names \"a daemon, or a test session touching two projects\" as a scenario the cache-key design accounted for)"
      - code: "src/specify_cli/dossier/manifest.py:432-438 (clear_cache() docstring: \"useful for testing\" — the cache's only documented reset path)"
    claim: >
      ManifestRegistry._cache is a process-global in-memory dict whose own inline comment
      anticipates a long-lived-process scenario where a cached None resolved under pre-fix code
      could keep shadowing a later resolution for the life of that process. The spec never
      mentions this cache or states why no migration/warning is needed across the fix boundary.
      Independently verified benign (no shipped long-lived process currently calls
      ManifestRegistry — CLI is per-invocation; orchestrator_api and the dashboard daemon do
      not call it), so not a blocking defect, but the spec should record that verification
      explicitly per the charter's evidence-over-confidence throughline.
    remediation: >
      Add a short note to Edge Cases or NFR-002 stating ManifestRegistry._cache is
      process-local, never persisted, and no currently-shipped long-lived process holds a stale
      pre-fix cache entry across the fix boundary — closing the omission explicitly.

  - id: SPEC-GOV-002
    lens: scope
    severity: 1
    title: "Related-issues parenthetical undersells #3702's file footprint (names only \"charter activate\", omits src/charter/mission_type_profiles.py) — disjointness conclusion still holds for this mission's actual file set"
    evidence:
      - artifact: "spec.md § Clarifications (\"#3701/#3702 (disjoint files — mission_type_repository.py and charter activate respectively)\")"
      - code: "GitHub issue #3702 body: names both src/specify_cli/cli/commands/charter/activate.py AND src/charter/mission_type_profiles.py"
    claim: >
      The spec's parenthetical describes #3702's touched surface as just "charter activate,"
      but the issue also names src/charter/mission_type_profiles.py — the module (not the same
      file as this mission's tests/charter/test_mission_type_profiles.py) whose
      _resolve_expected_artifacts_slot this spec's own Key Entities section names as a caller.
      The no-overlap conclusion for this mission's actual C-001 file set still holds, so this
      is a citation completeness gap, not a scope error.
    remediation: >
      Either drop the file-naming parenthetical or correct it to name both files #3702
      touches, so a future reader does not have to re-derive it from the issue tracker.
