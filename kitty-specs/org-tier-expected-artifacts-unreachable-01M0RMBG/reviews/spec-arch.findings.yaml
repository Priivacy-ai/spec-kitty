mission: org-tier-expected-artifacts-unreachable-01M0RMBG
findings:
  - id: SPEC-ARCH-001
    lens: canonical-source / contracts
    severity: 4
    title: "C-001's 'exactly three files' claim is verifiably incomplete: three more test files hard-code the pre-fix buggy path and will regress"
    evidence:
      - artifact: "spec.md § Constraints C-001 (\"the file set for this mission is fixed at exactly three files\")"
      - artifact: "spec.md § Success Criteria SC-003 (pytest scoped to only test_org_expected_artifacts.py and test_mission_type_profiles.py)"
      - code: "tests/dossier/test_manifest.py:516-524 (`_write_org_manifest` writes `<org_root>/<mission_type>/expected-artifacts.yaml`, the pre-fix path) and :554,614,656,665,713 (five call sites inside `class TestManifestRegistryOrgTier`, line 528)"
      - code: "tests/dossier/test_manifest.py:526-575 (`test_org_override_delta_through_load_manifest` calls the real `ManifestRegistry.load_manifest(..., repo_root=project_root)` end-to-end, no mock/monkeypatch of the resolver, and asserts `after.manifest_version == \"org-1\"` and `len(after.required_always) == before_count + 1`)"
      - code: "tests/dossier/test_rebaseline.py:494-500 (`_write_org_manifest`, same pre-fix path) and :603,701,742 (three call sites inside `class TestRebaselineOrgAwareness`, line 535), exercised end-to-end via `rebaseline_snapshot_file` with the comment \"proving the org pack was actually consulted\""
      - code: "tests/dossier/test_indexer.py:714-736 (`_write_org_manifest` method, same pre-fix path, called from `test_org_override_changes_required_artifact_set`, which drives `Indexer(ManifestRegistry(), repo_root=repo_root).index_feature(...)` end-to-end, no mocking)"
      - code: "src/charter/org_expected_artifacts.py:82 (the corrected join target, `org_root / \"missions\" / mission_type / _EXPECTED_ARTIFACTS_FILENAME`, per FR-001)"
    claim: >
      C-001 fixes the diff's file set at exactly three files (the production module plus its two
      dedicated unit-test files) and SC-003 scopes verification to a `pytest` invocation over only
      those two test files. But grepping the wider test suite for the same `org_root / mission_type`
      raw-join fixture pattern surfaces three more test files — tests/dossier/test_manifest.py,
      tests/dossier/test_rebaseline.py, tests/dossier/test_indexer.py — each with its own
      independently duplicated `_write_org_manifest`/`_write_org_manifest`-style helper that writes
      fixtures to the pre-fix, buggy `<org_root>/<mission_type>/expected-artifacts.yaml` location,
      and each exercised through the REAL `resolve_org_expected_artifacts` end-to-end (via
      `ManifestRegistry.load_manifest`, `Indexer.index_feature`, and `rebaseline_snapshot_file`
      respectively) with no mocking of the resolver. These tests currently pass ONLY because their
      fixture path happens to match today's bug. If FR-001 lands exactly as C-001 scopes it (three
      files, nothing else), these three additional test files' org-override assertions
      (manifest_version delta, "artifact appears as missing", "org pack was consulted") will start
      failing the moment the resolver anchor moves to `missions/<type>/` — a real, self-inflicted
      regression this mission's own change would introduce. SC-003's narrower pytest scope would
      not even surface this: it doesn't include `tests/dossier/`, so a reviewer following SC-003
      literally could sign off while shipping this regression, and C-006's pre-existing-#3284-baseline
      carve-out does not cover it since it is newly caused by this mission's own diff, not
      pre-existing.
    remediation: >
      Expand C-001's file set (and add or extend an FR, e.g. a new FR-005) to also update the
      `_write_org_manifest` fixture helpers in tests/dossier/test_manifest.py,
      tests/dossier/test_rebaseline.py, and tests/dossier/test_indexer.py to write to
      `<org_root>/missions/<mission_type>/expected-artifacts.yaml`, matching FR-003/FR-004's
      treatment of the two already-named test files. Expand SC-003's pytest invocation to include
      `tests/dossier/test_manifest.py tests/dossier/test_rebaseline.py tests/dossier/test_indexer.py`
      (or run the full `tests/dossier/` and `tests/charter/` directories) so the mission's own
      success criteria actually exercises every surface the fix could silently break.

  - id: SPEC-ARCH-002
    lens: canonical-source
    severity: 2
    title: "Historical contract doc cited by the live module's own docstring embeds the same wrong path this mission fixes, and is left untouched"
    evidence:
      - artifact: "spec.md § Constraints C-001 (fixes the file set at exactly the three files, none of which is the contract doc)"
      - code: "src/charter/org_expected_artifacts.py:10 (module docstring cites \"Contract C-4 (`kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md`)\" as the authoritative contract this module implements)"
      - code: "kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md:82-86 (\"## C-4: FR-008's org-file precedence\" states, in a docstring code block presented as the binding shape, `\"\"\"<org_root>/<mission_type>/expected-artifacts.yaml, later org_roots override earlier.\"\"\"` — the pre-fix, wrong path)"
    claim: >
      The production module's own top-of-file docstring points readers at this historical
      mission-contract doc as the binding contract for the function's path behavior. That doc's C-4
      section embeds the same wrong `<org_root>/<mission_type>/...` path this mission is fixing,
      presented as an authoritative docstring/code-block. C-001 scopes the diff to exactly three
      files, none of which is this contract doc, so after the fix lands the module's own cited
      "contract of record" will contradict the corrected code and corrected in-module docstring —
      reproducing, one hop away, the exact "docstring says one thing, code says another" defect
      class this mission exists to close in org_expected_artifacts.py itself. The spec never
      acknowledges this doc exists or makes an explicit call on it either way.
    remediation: >
      Add one sentence to spec.md's Constraints or Clarifications making an explicit call: either
      (a) state that mission-scoped historical artifacts under kitty-specs/<merged-mission>/ are
      intentionally frozen point-in-time records per repo convention and are not kept in sync with
      later bugfixes, so the C-4 doc is deliberately left stale, or (b) add the one-line code-block
      correction in that contract doc to the file set, since it is a near-zero-risk, domain-matched,
      doc-only edit. Either is fine; leaving it undecided is the gap.

  - id: SPEC-ARCH-003
    lens: reflexivity / migrations
    severity: 2
    title: "Spec is silent on ManifestRegistry's process-scoped cache surviving across the fix boundary in a long-lived process"
    evidence:
      - artifact: "spec.md (no section discusses `ManifestRegistry._cache`, process lifetime, or a running/long-lived consumer)"
      - code: "src/specify_cli/dossier/manifest.py:171-190 (`_cache: dict[tuple[str, tuple[str, ...]], ExpectedArtifactManifest | None] = {}`; inline comment at line 183 explicitly names \"a daemon, or a test session touching two projects\" as a scenario the cache-key design already had to account for)"
      - code: "src/specify_cli/orchestrator_api/commands.py and src/specify_cli/dashboard/ (grepped: neither imports or calls `ManifestRegistry`/`resolve_org_expected_artifacts`; no long-lived server process in this codebase currently consumes this resolution path)"
      - code: "src/specify_cli/dossier/manifest.py:432-438 (`clear_cache()` docstring: \"useful for testing\" — the cache's only documented reset path)"
    claim: >
      `ManifestRegistry._cache` is a process-global, in-memory dict, and its own inline comment
      anticipates a long-lived-process scenario (a daemon, or a multi-project test session) where a
      cached `None` for a given (mission_type, org_roots) key — resolved under the pre-fix code —
      could in principle keep shadowing a later resolution for the life of that process. The spec's
      Edge Cases and NFR sections cover malformed files and declared-order precedence in detail but
      never mention this cache or state why no migration/warning is needed across the fix boundary.
      I independently verified this is currently benign (no shipped long-lived process — CLI commands
      are per-invocation, and neither orchestrator_api nor the dashboard daemon calls
      ManifestRegistry — holds this cache across a code upgrade; `clear_cache()` exists solely for
      test isolation), so this is not a defect blocking the fix. But per the charter's
      evidence-over-confidence throughline, the spec should record that verification explicitly
      rather than leaving the question unaddressed.
    remediation: >
      Add a short note to the Edge Cases or NFR-002 section stating that `ManifestRegistry._cache`
      is process-local and never persisted to disk, that no currently-shipped long-lived process
      (CLI is per-invocation; orchestrator_api and the dashboard daemon do not call
      `ManifestRegistry`) holds a stale pre-fix cache entry across the fix boundary, and therefore no
      cache-invalidation step or migration warning is needed — closing the omission explicitly
      instead of leaving it silent.
