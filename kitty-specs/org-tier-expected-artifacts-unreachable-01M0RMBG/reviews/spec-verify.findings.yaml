schema: review-findings/v1
complete: true
phase: spec
lens_group: verify
mission: org-tier-expected-artifacts-unreachable-01M0RMBG
findings:
  - id: SPEC-VERIFY-001
    lens: falsifiability
    severity: 4
    title: "FR-003's scoped action (fix only the helper) is narrower than its own stated GREEN-at-final-commit goal for the malformed-file test class"
    evidence:
      - artifact: "spec.md § FR-003 (Requirements > Functional Requirements)"
      - artifact: "spec.md § NFR-001 (\"the reviewer verifies RED at the planning base and GREEN at the final commit\")"
      - code: "tests/charter/test_org_expected_artifacts.py:160 (test_malformed_yaml_file_treated_as_no_match)"
      - code: "tests/charter/test_org_expected_artifacts.py:170 (test_non_mapping_yaml_content_treated_as_no_match)"
      - code: "tests/charter/test_org_expected_artifacts.py:188 (test_malformed_yaml_file_logs_a_warning_naming_the_file)"
      - code: "tests/charter/test_org_expected_artifacts.py:206 (test_non_mapping_yaml_content_logs_a_warning_naming_the_file)"
      - code: "tests/charter/test_org_expected_artifacts.py:259 (test_later_malformed_root_does_not_clobber_earlier_good_match, via malformed_dir = second_root / \"software-dev\")"
      - code: "tests/charter/test_org_expected_artifacts.py:31-43 (_write_org_expected_artifacts helper — the only construction FR-003 names)"
    claim: >
      FR-003 says only "the `_write_org_expected_artifacts` helper ... to write fixtures to
      `<org_root>/missions/<mission_type>/expected-artifacts.yaml`", then separately claims the
      existing test matrix — explicitly including "malformed-file with/without warning" (class at
      line 151) — stays "intact and passing against the corrected anchor." But five of the six
      methods in `TestResolveOrgExpectedArtifactsMalformedFile` (lines 158-269) do NOT call the
      helper; they hand-construct `target_dir = org_root / "software-dev"` (or
      `second_root / "software-dev"`) directly, at the old, wrong path. If an implementer follows
      FR-003 literally and only edits the helper function body, these five tests keep writing
      fixtures to the OLD path, which the corrected resolver will no longer check at all. Concretely,
      post-fix with only the helper touched:
        - `test_malformed_yaml_file_logs_a_warning_naming_the_file` and
          `test_non_mapping_yaml_content_logs_a_warning_naming_the_file` FAIL outright — the file at
          the old path is never read, so `_read_yaml_mapping` never runs, `warning_records` is empty,
          and `assert len(warning_records) == 1` fails.
        - `test_malformed_yaml_file_treated_as_no_match`,
          `test_non_mapping_yaml_content_treated_as_no_match`, and
          `test_later_malformed_root_does_not_clobber_earlier_good_match` keep passing, but
          vacuously — `result is None` becomes true because the file is simply never found at all,
          not because it was found-and-rejected-as-malformed, so the test silently stops exercising
          the fail-closed-with-warning code path it was written to prove.
      This directly undermines NFR-001's own promise that "the reviewer verifies ... GREEN at the
      final commit" for this class, and is exactly the kind of vacuous-AC / FR-without-full-coverage
      gap the severity-4 rubric names.
    remediation: >
      Reword FR-003 to explicitly require updating every in-class fixture construction, not just the
      shared helper: name the five methods in `TestResolveOrgExpectedArtifactsMalformedFile`
      (test_malformed_yaml_file_treated_as_no_match, test_non_mapping_yaml_content_treated_as_no_match,
      test_malformed_yaml_file_logs_a_warning_naming_the_file,
      test_non_mapping_yaml_content_logs_a_warning_naming_the_file,
      test_later_malformed_root_does_not_clobber_earlier_good_match) and require their inline
      `target_dir = org_root / "software-dev"` / `second_root / "software-dev"` constructions be
      changed to `org_root / "missions" / "software-dev"` (and the second-root equivalent) alongside
      the helper fix, so the malformed-file-with-warning coverage keeps exercising the real code path
      at the corrected anchor instead of silently degrading to "file not found."

  - id: SPEC-VERIFY-002
    lens: silent-success
    severity: 4
    title: "SC-004 (old-location-only pack resolves to None post-fix) has no required test coverage in FR-001..004, and its wording drops the built-in-fallback nuance the Edge Cases section already states correctly"
    evidence:
      - artifact: "spec.md § Success Criteria > SC-004"
      - artifact: "spec.md § Edge Cases (\"A pack with a file ONLY at the old, wrong location ... must correctly resolve to None (or fall through to the built-in manifest)\")"
      - artifact: "spec.md § FR-003 (\"existing test matrix (empty-cases, single-root, declared-order precedence, malformed-file with/without warning, custom-mission-type-no-builtin-baseline — classes at lines 46, 65, 93, 151, 271)\")"
      - code: "tests/charter/test_org_expected_artifacts.py:46-65 (TestResolveOrgExpectedArtifactsEmptyCases — no fixture written at the old, wrong path; only \"no file at all\" is tested)"
      - code: "src/charter/mission_type_profiles.py:1044-1053 (_resolve_expected_artifacts_slot: when resolve_org_expected_artifacts returns None, it falls through to MissionTemplateRepository.default().get_expected_artifacts(mission_type) — NOT to None — whenever the type is a registered built-in type)"
      - code: "packs/built-in/missions/software-dev/expected-artifacts.yaml (confirms \"software-dev\", the mission_type used in every fixture across both test files, has a real built-in manifest to fall through to)"
    claim: >
      SC-004 states plainly "resolves to None post-fix" for a pack with expected-artifacts.yaml only
      at the old, wrong location. Two problems: (1) None of FR-001 through FR-004 requires a test that
      actually plants a fixture at the old path and asserts this outcome — the closest existing test,
      `test_org_root_exists_but_no_matching_file_returns_none` (empty-cases class, line 50), never
      creates a file at all, so it cannot stand in as regression coverage for "a file that exists,
      just at the wrong path." SC-004 is therefore a stated Measurable Outcome with no path to
      verification in the mission's own required work — the exact vacuous-AC gap the severity-4 rubric
      names, and ironically so for a mission whose entire point is closing a silent-failure hole. (2)
      SC-004's flat "resolves to None" is only true at the `resolve_org_expected_artifacts` layer. At
      the `ManifestRegistry.load_manifest` / `_resolve_expected_artifacts_slot` layer — the layer User
      Story 1's AC2 explicitly covers, and the layer a naive reader would assume SC-004 also describes
      since SC-002/SC-003 sit right next to it discussing that same layer — a registered built-in
      mission type (every fixture in both test files uses "software-dev", which is built-in) falls
      through to the BUILT-IN manifest, not None. The spec's own Edge Cases section already states
      this correctly ("resolve to None (or fall through to the built-in manifest)"); SC-004 drops that
      qualifier. A test-writer implementing SC-004 literally against the ManifestRegistry layer using
      the suite's own established "software-dev" fixture convention would write a failing/wrong
      assertion.
    remediation: >
      (a) Add an explicit new test requirement — either as a new FR or as an addition to FR-003 —
      for a fixture written ONLY at `<org_root>/<mission_type>/expected-artifacts.yaml` (old path,
      via the raw pre-fix join, not the corrected helper), asserting
      `resolve_org_expected_artifacts` returns None post-fix; this closes the SC-004 coverage gap.
      (b) Reword SC-004 to carry the same "(or fall through to the built-in manifest)" qualifier the
      Edge Cases section already uses, and state explicitly which layer(s) it is measured at
      (resolve_org_expected_artifacts vs. ManifestRegistry.load_manifest), so it cannot be
      misread as "None at every layer" for a built-in-registered mission type. (c) Optionally extend
      the same fixture case to a malformed (not just absent-content) file at the old path, since
      pre-fix that same path is the one `_read_yaml_mapping` currently warns on — post-fix that
      warning silently disappears for anything left at the old path, which the spec should name as
      an accepted consequence of C-002's no-fallback decision rather than leave unstated.
