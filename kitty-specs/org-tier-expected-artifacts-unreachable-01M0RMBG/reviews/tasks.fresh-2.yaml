findings:
  - id: TASKS-FRESH2-001
    lens: conceptual-alignment
    severity: 4
    title: T006's "corrected" --compare-branch instruction is self-referential and produces a zero-diff no-op, and the fallback this revision forbids was the only one that worked
    evidence:
      - artifact: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/tasks/WP01-org-tier-expected-artifacts-anchor-fix.md:360-375 (T006, step 4), added in commit 1968c2d5e"
      - code: "uv run diff-cover coverage.xml --compare-branch=fix/org-tier-expected-artifacts-3703 --fail-under=90 --include 'src/charter/*'"
      - artifact: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/tasks/WP01-org-tier-expected-artifacts-anchor-fix.md frontmatter: planning_base_branch: fix/org-tier-expected-artifacts-3703, merge_target_branch: fix/org-tier-expected-artifacts-3703 (both equal — no separate WP branch)"
      - artifact: "kitty-specs/org-tier-expected-artifacts-unreachable-01M0RMBG/meta.json: \"target_branch\": \"fix/org-tier-expected-artifacts-3703\", \"topology\": \"single_branch\""
      - code: ".github/workflows/ci-quality.yml:3384 (diff-coverage job): --compare-branch=origin/${{ github.base_ref }} — the real gate compares against the PR's actual GitHub base branch, which per plan.md's PR Shape section (line 501: \"ONE PR ... landing on the single fix/org-tier-expected-artifacts-3703 branch\") and CLAUDE.md (\"Base branch here is main — not develop\") is main, not fix/org-tier-expected-artifacts-3703"
      - code: "plan.md:229 states the canonical form as --compare-branch=origin/<base> (remote-tracking, prefixed) — the WP01 text deviates from this pattern by using a bare local branch name with no origin/ prefix"
      - artifact: "Empirically reproduced in this exact checkout: `git rev-parse fix/org-tier-expected-artifacts-3703 HEAD` returns the identical SHA (1968c2d5e) for both — this checkout is literally already on that branch mid-mission, confirming WP01 work lands directly on it with no separate feature branch"
    claim: >
      This revision (1968c2d5e) removed the `origin/main` fallback from T006's diff-coverage
      instructions and replaced it with a confident claim that the mission's real base_ref is
      `fix/org-tier-expected-artifacts-3703`, "not main," and that comparing against it
      "mirrors the real CI gate." Both the claim and the instruction are wrong. (1) The real CI
      diff-coverage job runs on this mission's actual PR, which per plan.md's own "PR Shape"
      section opens FROM fix/org-tier-expected-artifacts-3703 INTO main — so `github.base_ref`
      for that PR is `main`, the opposite of what this text asserts; it conflates meta.json's
      `target_branch` (the mission's own head/working branch) with the PR's base branch. (2)
      Independent of that, `fix/org-tier-expected-artifacts-3703` is not a separate ref from
      HEAD during this WP's own implementation — WP01's frontmatter sets planning_base_branch
      == merge_target_branch == fix/org-tier-expected-artifacts-3703 (single_branch topology,
      no separate WP branch), so by the time T006 runs, the local branch name is a moving
      pointer that equals HEAD. `--compare-branch=fix/org-tier-expected-artifacts-3703` against
      that same HEAD yields an empty diff, so diff-cover finds nothing to check and trivially
      "passes" — silently defeating the one local pre-flight check for the mission's single
      ENFORCED 90% coverage gate, while the WP's own text claims this "mirrors the real CI
      gate." The prior revision's forbidden `origin/main` fallback, ironically, was the only
      option in that text that would have produced a real (and here, correct, since main has
      not diverged) diff.
    remediation: >
      Point T006 step 4's --compare-branch at a ref that is actually distinct from HEAD at
      verification time: either the planning-base commit SHA already pinned in plan.md line 5
      and this WP's own DoD (`c76ce3473`), or a remote-tracking snapshot fetched and pinned
      BEFORE T001's first commit lands (e.g. `origin/fix/org-tier-expected-artifacts-3703`
      captured at the mission's start, not re-fetched after WP01's own commits have been
      pushed). Also correct the base_ref claim: state plainly that this mission's PR opens
      against `main` (per plan.md's PR Shape and CLAUDE.md), so the real CI diff-coverage job's
      `origin/${{ github.base_ref }}` is `origin/main` for the actual PR — and that the local
      pre-flight check instead needs a stand-in for "state of this branch before this WP's
      commits," which is what the pinned SHA/pre-WP remote snapshot (not the live, moving
      branch name) actually provides.
