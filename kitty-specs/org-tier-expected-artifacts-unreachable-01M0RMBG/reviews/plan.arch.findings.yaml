findings:
  - id: PLAN-ARCH-001
    lens: frozen-contract-doc boundary
    severity: 3
    title: FR-002's docstring fix leaves the module docstring's "Contract C-4" citation pointing at a frozen doc that still shows the old, wrong path, with no caveat added
    evidence:
      - artifact: "plan.md § Contracts"
      - artifact: "spec.md § FR-002, § C-007"
      - code: "src/charter/org_expected_artifacts.py:10 (module docstring: 'Contract C-4 (`kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md`):')"
      - code: "src/charter/org_expected_artifacts.py:56 (function docstring, the literal path FR-002 corrects)"
      - code: "kitty-specs/up-org-doctrine-consumers-01M05YAB/contracts/org-tier-resolution-contract.md:86 (embedded code sample: '\"\"\"<org_root>/<mission_type>/expected-artifacts.yaml, later org_roots override earlier.\"\"\"' — the OLD, pre-fix path, verbatim)"
    claim: >
      Verified: the frozen contract doc exists and does embed the old, wrong path (line 86),
      and the module docstring does cite it by name as "Contract C-4" (line 10) as the
      authoritative source for precedence/merge semantics. Plan's Contracts section correctly
      states this doc is deliberately left untouched and that "the docstring correction in
      FR-002 fixes the function's stated on-disk path, not the frozen historical document's
      content" — but neither the plan nor FR-002 (spec.md) adds any caveat to the module
      docstring noting that its own cited "Contract C-4" source shows a now-superseded path.
      After the fix lands, a future reader who trusts the module docstring's citation and
      follows it to verify the exact path (rather than only the precedence rules) will land on
      a document showing the OLD path with no signal that it is stale for that detail — this
      reproduces, via one level of indirection (citation instead of direct docstring text),
      the exact "docstring says X, code does Y" confusion class FR-002 exists to eliminate.
      The plan's own mission-derived-lens self-check text acknowledges the tension in prose but
      does not mandate a concrete textual remediation inside the file being fixed.
    remediation: >
      Add FR-002 scope (or a follow-on line in the plan's Contracts section) to require one
      caveat sentence in the module docstring's Contract C-4 citation, e.g.: "Contract C-4's
      own code sample cites the pre-fix path (`<org_root>/<mission_type>/expected-artifacts.yaml`)
      — that frozen historical document is not kept in sync with this bugfix; see this module's
      `resolve_org_expected_artifacts` docstring for the current, correct on-disk path." This
      keeps the frozen doc itself untouched (respecting C-007) while closing the residual
      "citation implies current path" ambiguity inside the one file this mission does edit.
