  - id: PR-CONTRACT-001
    source_group: contract
    severity: 4
    verdict: confirmed
    verdict_source: "pr.refute-1.yaml"
    title: "mission-type show crashes uncaught on the exact CL-003 empty-action-sequence case it was built to guard against"
    evidence:
      - code: "src/specify_cli/cli/commands/mission_type.py:1450-1462"
      - code: "src/charter/activation/mission_type_profiles.py:194-256"
      - code: "src/charter/activation/mission_type_profiles.py:259-305"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:151-160"
    claim: >
      `show_mission_type` (`spec-kitty mission-type show <id>`) calls
      `resolve_mission_type_context(...).action_sequence` inside a
      `try/except UnknownMissionTypeError` block only (mission_type.py:1450-1458).
      `MissionTypeEmptyActionSequenceError` and `UnknownMissionTypeError` are both direct
      `ValueError` subclasses with no inheritance relationship — confirmed by direct read of
      both class definitions (mission_type_profiles.py:194, :259) — so
      `except UnknownMissionTypeError` does not catch `MissionTypeEmptyActionSequenceError`.
      For an activated org/project mission type whose action sequence (own or
      `extends`-inherited) is empty — the exact CL-003 scenario this mission exists to make
      loud — the exception propagates UNCAUGHT as a raw traceback instead of the clean
      `console.print(...); typer.Exit(1)` pattern. The sibling CLI surface
      `charter_mission_type_list` (mission_type.py:151-160) explicitly catches this exact
      exception, proving the omission here is a miss, not intent. No test exercises this path.
    remediation: >
      In `show_mission_type` (mission_type.py:1450), add
      `except MissionTypeEmptyActionSequenceError as exc:` (imported alongside
      `UnknownMissionTypeError`) that renders `console.print(f"[red]Error:[/red] {exc}")` and
      `raise typer.Exit(1) from exc`, mirroring `charter_mission_type_list`'s handling. Add a
      regression test with an org/project mission-type YAML carrying no `action_sequence`,
      asserting `mission-type show <id>` exits 1 with a clean message instead of a traceback.

  - id: PR-CONTRACT-002
    source_group: contract
    severity: 4
    verdict: confirmed
    verdict_source: "pr.refute-1.yaml"
    title: "charter activate mission-type silently swallows malformed-YAML and unreadable-directory failures in the very org/project layers WP05 newly wired in, masking them as a generic 'unknown ID'"
    evidence:
      - code: "src/charter/activation/pack_manager.py:317-338"
      - code: "src/charter/activation/pack_manager.py:361-377"
      - code: "src/charter/activation/pack_manager.py:778-840"
      - code: "src/doctrine/missions/mission_type_repository.py:358-394"
      - code: "src/charter/activation/pack_manager.py:618-643"
    claim: >
      WP05's `_resolve_layer_candidate` (pack_manager.py:317-338) wires org/project
      mission-type directories into `CharterPackManager.list_available_detailed`
      (pack_manager.py:778-840) — the availability catalog `activate()` checks BEFORE allowing
      `charter activate mission-type <id>`. That scan routes through `scan_dir.rglob(glob)`
      plus `_declared_id` (pack_manager.py:361-377), whose except clause is exactly
      `(OSError, YAMLError, TypeError)` returning `None` — silently skipping the file — on any
      parse failure; `Path.rglob` itself silently swallows `PermissionError` (empirically
      reproduced in /tmp during refutation). So a malformed or unreadable org/project
      `mission_types/` entry is invisible to `list_available`, and `plan_activation` then
      raises the generic `UnknownActivationIdError` instead of the real cause. Contrast with
      `_scan_mission_types_dir` (mission_type_repository.py:358-394), which WP03 built in the
      SAME mission specifically to close this exact collapse (uses `iterdir()`, names the
      offending file). `resolve_layered_mission_types` — the path actually used
      post-activation — DOES loud-fail on the identical malformed file or unreadable
      directory, so the same broken file produces a misleading "unknown ID" pre-activation but
      a real, loud error post-activation — an inconsistency only visible reading WP03 and WP05
      together.
    remediation: >
      Route the `kind is None` (mission-type) branch of
      `CharterPackManager.list_available_detailed` through
      `doctrine.missions.mission_type_repository.resolve_layered_mission_types` (or an
      equivalent `iterdir()`-based, exception-propagating scan) instead of the
      glob+broad-except `_declared_id` path, so a malformed YAML or unreadable org/project
      `mission_types/` directory raises the same loud, file-naming error during `charter
      activate mission-type` that it already does during subsequent resolution. Add
      regression coverage mirroring the malformed-YAML / unreadable-directory tests in
      `tests/doctrine/missions/test_mission_type_repository.py`, but through
      `manager.activate(...)`.

  - id: PR-TESTS-001
    source_group: tests
    severity: 4
    verdict: confirmed
    verdict_source: "pr.refute-2.yaml"
    title: "New golden-parity regression class in test_runtime_seam.py cannot fail even when WP04's PackContext-threading is fully reverted"
    evidence:
      - code: "tests/runtime/test_runtime_seam.py:184-233"
      - code: "src/charter/activation/mission_type_profiles.py:917-925 (_resolve_action_slot, calls resolve_layered_mission_types)"
      - code: "src/charter/activation/mission_type_profiles.py:1036 (_resolve_template_set_slot, threads pack_context)"
    claim: >
      `TestGoldenParityUnaffectedByPackContextThreading.test_builtin_type_unaffected_by_real_pack_context_with_org_root`
      (parametrized over the 4 built-in mission types) constructs a real `PackContext` whose
      `org_root/mission_types` directory is `mkdir`'d but never has a YAML file written into
      it. `_scan_mission_types_dir` returns `[]` (not an error) for an existing-but-empty
      directory, so the org layer always contributes nothing — the test's assertions hold
      identically whether WP04's PackContext-threading exists or is fully reverted. Verified
      empirically in a disposable worktree (`git worktree add --detach /tmp/pr-tests-check
      HEAD`): with `_resolve_action_slot` reverted to call `MissionTypeRepository.default()`
      and `_resolve_template_set_slot` reverted to hardcode `pack_context=None` — i.e. WP04's
      entire FR-002 contribution removed — `uv run pytest tests/runtime/test_runtime_seam.py
      -k TestGoldenParityUnaffectedByPackContextThreading` still reports `4 passed, 0 failed`.
      The class's own docstring concedes it is "not a red-first pin", but its stated purpose —
      proving a real org pack root never perturbs built-in output — is not actually provable
      by this test as written, since the org root never contributes content for the merge
      logic to (mis)apply. Per the review rubric, "a test that passes with the union's change
      reverted is severity 4."
    remediation: >
      Give the org root real, non-colliding content so the layered-merge code path is
      actually exercised end to end, and assert on it. E.g. write a distinct custom
      mission-type YAML into `org_root / "mission_types" / "unrelated-custom.yaml"` (an id
      sharing nothing with any built-in type) and assert that
      `resolve_mission_type_context(tmp_path, mission_type="unrelated-custom")` through the
      same patched PackContext actually resolves it — this addition would fail under the
      exact WP04-revert performed during refutation, giving the class a genuine failing case
      for the dependency it claims to guard.

  - id: PR-BOUNDARY-001
    source_group: boundary
    severity: 3
    verdict: confirmed
    verdict_source: "pr.refute-1.yaml"
    title: "resolve_mission_type_source_layer imports a leading-underscore private helper directly, bypassing the facade discipline applied one line above it"
    evidence:
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:106"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:84"
      - code: "src/charter/activation/mission_type_profiles.py:827"
      - code: "src/charter/activation/mission_type_profiles.py:73-82"
    claim: >
      `resolve_mission_type_source_layer` (mission_type.py:97-114) does `from
      charter.activation.mission_type_profiles import _resolve_action_sequence_layer` — a
      leading-underscore symbol, absent from `charter.activation.mission_type_profiles.__all__`, never
      re-exported through any charter facade. This is inconsistent with the pattern the SAME
      function applies one line above (`resolve_layered_roster`, mission_type.py:76-94),
      which reaches `resolve_layered_mission_types` only via the `charter.missions` facade
      door WP07 deliberately widened for that purpose — confirmed by grep that
      `charter.missions` re-exports `resolve_layered_mission_types` but never
      `_resolve_action_sequence_layer`. No existing gate catches this (layer-direction test
      passes regardless since `charter.activation.mission_type_profiles` is a charter module;
      events/tracker private-import test only guards a different package; ruff's selected
      rules don't include a private-member-import check). A future refactor or removal of
      `_resolve_action_sequence_layer` would have no signal that `specify_cli` depends on it
      directly.
    remediation: >
      Rename `_resolve_action_sequence_layer` to a public name (e.g.
      `resolve_action_sequence_layer`) in src/charter/activation/mission_type_profiles.py and add it to
      that module's `__all__`, then update both the in-module caller
      (mission_type_profiles.py:949) and the cross-module caller (mission_type.py:106) to the
      new public name.

  - id: PR-CONTRACT-003
    source_group: contract
    severity: 3
    verdict: confirmed
    verdict_source: "pr.refute-2.yaml"
    title: "resolve_layered_mission_types caches user-editable org/project content with the same unconditional functools.cache used for immutable built-in content, without documenting or guarding the resulting staleness"
    evidence:
      - code: "src/doctrine/missions/mission_type_repository.py:60-97"
      - code: "src/doctrine/missions/mission_type_repository.py:397-478"
      - code: "tests/doctrine/missions/test_mission_type_repository.py:467-488"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:56-114"
    claim: >
      `MissionTypeRepository.default()`'s `functools.cache` is justified as safe because
      production never mutates the bundled, read-only built-in tree mid-process. WP03's new
      `resolve_layered_mission_types` reuses the identical unconditional `functools.cache`
      pattern, but now ALSO scans org and project layer directories — content that IS
      user-editable during a process's lifetime. The docstring/ADR (CL-001) only defends
      against cross-PROJECT poisoning, never same-project staleness across TIME. The union's
      own test `test_same_key_is_a_cache_hit` proves the staleness directly: it mutates an
      org-layer YAML file AFTER a first resolution and asserts the second resolution (same
      cache key) still returns the stale first result. A repo-wide grep confirms
      `cache_clear()` for this cache is invoked only from test files, never from any
      production `src/` call site. Low-risk for a normal one-shot CLI invocation, but any
      longer-lived process embedding these charter APIs would silently serve a stale
      org/project roster after an on-disk edit, with no operator-facing signal.
    remediation: >
      Either (a) document explicitly, next to `resolve_layered_mission_types`'s docstring,
      that its cache is safe only for the "one process per CLI invocation" model, naming the
      required `cache_clear()` call site for any long-lived host; or (b) key the cache (or add
      an invalidation check) on a cheap freshness signal for the org/project directories
      (e.g. directory mtime).

  - id: PR-TESTS-002
    source_group: tests
    severity: 2
    verdict: confirmed
    verdict_source: "pr.refute-2.yaml"
    title: "tests/charter/test_mission_type_profiles.py never clears resolve_layered_mission_types' cache, unlike every other new/changed test file that patches PackContext.from_config"
    evidence:
      - code: "tests/charter/test_mission_type_profiles.py:483-613 (TestPackContextProjection — no cache_clear call anywhere in the class or file)"
      - code: "tests/charter/test_mission_type_profiles.py:654-706 (TestEmptyActionSequenceLoudFail — same)"
      - code: "tests/cli/test_charter_mission_type_commands.py:169,182 (MissionTypeRepository.cache_clear() before AND after, via try/finally)"
      - code: "tests/cli/test_doctrine_commands.py:232-240 (same before/after pattern)"
      - code: "tests/specify_cli/cli/commands/test_mission_type_template_set_cli.py:163-172 (same before/after pattern)"
      - code: "tests/doctrine/missions/test_mission_type_repository.py (TestLayeredMissionTypesCacheKeyAndClear.setup_method/teardown_method — same discipline at the doctrine layer)"
      - code: "src/doctrine/missions/mission_type_repository.py:453-478 (resolve_layered_mission_types, @functools.cache keyed on (mission_types_dirs, pack_context))"
    claim: >
      Every other new/changed test file that patches `charter.activation.pack_context.PackContext.from_config`
      and then drives resolution through the module-level `resolve_layered_mission_types`
      cache also calls `MissionTypeRepository.cache_clear()` before and/or after the patched
      call. `tests/charter/test_mission_type_profiles.py`'s `TestPackContextProjection`,
      `TestEmptyActionSequenceLoudFail`, and `TestMissionCreatePropagatesEmptyActionSequenceError`
      classes do the same patch-and-resolve dance but never call `cache_clear()` anywhere in
      the file — confirmed by grep, zero matches. Correctness currently survives only because
      `PackContext` is a frozen, field-hashed dataclass (src/charter/activation/pack_context.py:100-101)
      and every test's fields derive from pytest's per-test-unique `tmp_path`, so no two tests
      in this file can construct an *equal* `PackContext` and collide on a cache entry — an
      incidental, not designed, protection that a future test reusing a fixed/shared root
      would silently break.
    remediation: >
      Add the same `MissionTypeRepository.cache_clear()` before/after (or a class-level
      setup_method/teardown_method) discipline used in the three sibling CLI test files to
      `TestPackContextProjection`, `TestEmptyActionSequenceLoudFail`, and
      `TestMissionCreatePropagatesEmptyActionSequenceError` in
      `tests/charter/test_mission_type_profiles.py`.

  - id: PR-BOUNDARY-002
    source_group: boundary
    severity: 1
    verdict: confirmed
    verdict_source: "pr.refute-1.yaml"
    title: "MissionTypeEmptyActionSequenceError is imported by name from two other src/ modules but is missing from charter.activation.mission_type_profiles.__all__"
    evidence:
      - code: "src/charter/activation/mission_type_profiles.py:73-82"
      - code: "src/charter/activation/mission_type_profiles.py:259"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:32"
      - code: "src/specify_cli/cli/commands/charter/activate.py:184"
    claim: >
      `class MissionTypeEmptyActionSequenceError` (mission_type_profiles.py:259) is imported
      by explicit name from mission_type.py:32 and referenced in activate.py:184's
      `except UnknownMissionTypeError` handler comment — a genuinely public,
      cross-module-depended-on symbol — yet it was never added to
      `charter.activation.mission_type_profiles.__all__` (lines 73-83, which lists `UnknownMissionTypeError`
      and 8 others but omits it). `from module import Name` works regardless of `__all__`, so
      this has no runtime effect, but leaves the module's documented public contract silently
      out of sync with what other modules actually depend on.
    remediation: >
      Add `"MissionTypeEmptyActionSequenceError"` to `charter.activation.mission_type_profiles.__all__`,
      alongside `UnknownMissionTypeError`, which it mirrors.
