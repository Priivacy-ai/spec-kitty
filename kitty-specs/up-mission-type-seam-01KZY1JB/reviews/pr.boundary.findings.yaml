findings:
  - id: PR-BOUNDARY-001
    lens: "private-symbol boundary crossing (mission-specific derived lens)"
    severity: 3
    title: "resolve_mission_type_source_layer imports a leading-underscore private helper directly, bypassing the facade discipline applied one line above it"
    evidence:
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:106"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:84"
      - code: "src/charter/activation/mission_type_profiles.py:827"
      - code: "src/charter/activation/mission_type_profiles.py:73-82"
    claim: >
      `resolve_mission_type_source_layer` (src/specify_cli/cli/commands/charter/mission_type.py:97-114)
      does `from charter.activation.mission_type_profiles import _resolve_action_sequence_layer` — a
      leading-underscore symbol never listed in `charter.activation.mission_type_profiles.__all__`
      (src/charter/activation/mission_type_profiles.py:73-82) and never re-exported through any charter
      facade. This is inconsistent with the pattern the SAME function applies one line above
      it (`resolve_layered_roster`, mission_type.py:76-94), which reaches
      `resolve_layered_mission_types` only via the `charter.missions` facade door WP07
      deliberately widened for that exact purpose (src/charter/missions.py). It is also
      inconsistent with `charter.activation.mission_type_profiles`'s own documented intent: every other
      symbol this file imports from that module (`MissionTypeEmptyActionSequenceError`,
      `UnknownMissionTypeError`, `existing_mission_types`, `resolve_mission_type_context`,
      mission_type.py:31-36) is a name the module's author put in `__all__` on purpose;
      `_resolve_action_sequence_layer` was named with a leading underscore specifically
      because WP06/WP04 treated it as call-site-local (used only inside
      `_resolve_action_slot`, mission_type_profiles.py:949) — nothing in that module's
      docstring or the mission's own ADR
      (docs/adr/3.x/2026-08-13-1-mission-type-roster-layering-seam.md) acknowledges that a
      second, cross-package consumer would depend on it directly. No existing gate catches
      this: `tests/architectural/test_layer_rules.py` enforces package-level direction
      (kernel<-doctrine<-charter<-specify_cli) and would pass regardless of the leading
      underscore since `charter.activation.mission_type_profiles` is a charter module and specify_cli is
      permitted to import from it; `tests/architectural/test_events_tracker_public_imports.py`
      only guards `spec_kitty_events._internal`/`spec_kitty_tracker._internal`, not
      underscore-prefixed functions inside charter modules; ruff's selected rule set (E, F, W,
      C90, C4, ARG, B, SIM, UP, ASYNC, S, TID251 — pyproject.toml:228-243) does not include
      pylint's private-member-import check, and `.venv/bin/ruff check
      src/specify_cli/cli/commands/charter/mission_type.py` reports no issue. Because it is a
      "private" name by convention, a future refactor of `_resolve_action_sequence_layer`'s
      signature or removal (it is currently referenced only from inside
      `mission_type_profiles.py` from that module's own author's point of view) would have no
      signal telling the refactorer that `specify_cli` now depends on it directly — the
      facade/`__all__` discipline exists precisely to make that dependency visible, and this
      one call site opts out of it.
    remediation: >
      Rename `_resolve_action_sequence_layer` to a public name (e.g.
      `resolve_action_sequence_layer`) in src/charter/activation/mission_type_profiles.py and add it to
      that module's `__all__` (currently mission_type_profiles.py:73-82), then update both the
      in-module caller (mission_type_profiles.py:949) and the cross-module caller
      (mission_type.py:106) to the new public name. This keeps the existing
      "specify_cli imports charter.activation.mission_type_profiles's public symbols directly" pattern
      already established in this file (mission_type.py:31-36) — no facade widening is needed
      since `charter.activation.mission_type_profiles` is itself a charter module, not a doctrine module
      behind the doctrine-census facade wall — while making the CLI's real dependency on this
      helper visible in the module's own public contract instead of reaching around it.

  - id: PR-BOUNDARY-002
    lens: "facade widening / public-surface hygiene"
    severity: 1
    title: "MissionTypeEmptyActionSequenceError is imported by name from two other src/ modules but is missing from charter.activation.mission_type_profiles.__all__"
    evidence:
      - code: "src/charter/activation/mission_type_profiles.py:73-82"
      - code: "src/charter/activation/mission_type_profiles.py:259"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:32"
      - code: "src/specify_cli/cli/commands/charter/activate.py"
    claim: >
      `class MissionTypeEmptyActionSequenceError` (mission_type_profiles.py:259) is imported
      by explicit name from `src/specify_cli/cli/commands/charter/mission_type.py:32` and
      `src/specify_cli/cli/commands/charter/activate.py` (its `except UnknownMissionTypeError`
      handler comment explicitly discusses this error class propagating past it), i.e. it is a
      genuinely public, cross-module-depended-on symbol, yet it was never added to
      `charter.activation.mission_type_profiles.__all__` (mission_type_profiles.py:73-82, which still
      only lists `CrossGrainDoubleDeclarationError`, `GovernancePayload`,
      `MissionTypeProfile`, `ResolvedGovernance`, `ResolvedMissionType`,
      `UnknownMissionTypeError`, `existing_mission_types`, `resolve_mission_type_context`,
      `resolve_mission_type_key`). `from module import Name` works regardless of `__all__`, so
      this has no runtime effect, but it leaves the module's own documented public contract
      silently out of sync with what other modules actually depend on — the same category of
      drift `__all__` exists to prevent for `UnknownMissionTypeError`, the class this new
      error was deliberately modeled on (per its own docstring, mission_type_profiles.py's
      `MissionTypeEmptyActionSequenceError` docstring, "Mirrors UnknownMissionTypeError's
      shape").
    remediation: >
      Add `"MissionTypeEmptyActionSequenceError"` to `charter.activation.mission_type_profiles.__all__`
      (mission_type_profiles.py:73-82), alongside `UnknownMissionTypeError`, which it mirrors.
