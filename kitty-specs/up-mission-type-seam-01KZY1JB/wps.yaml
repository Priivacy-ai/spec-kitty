# Work Package manifest — up-mission-type-seam-01KZY1JB
#
# Authored against the PASSED plan.md (Implementation Concern Map IC-01..IC-07) and the two
# binding operator rulings recorded in reviews/plan.ruling.md (sequencing correction: only IC-02
# depends on IC-01; IC-03/IC-06 are independently sequenced; IC-06 is the mission's first commit)
# and reviews/tasks.ruling.md (spec.md:77 bracketed elision of a foreign-mission FR citation —
# context only, no new scope; the eliminated token is deliberately not repeated here).
#
# Shape: 7 WPs. WP01 = the ADR (spec CL-002/FR-012, literally first). WP02 = IC-06, the
# campsite-clean opening CODE commit (dead-code deletions + docstring fix), depends on WP01.
# WP03 = IC-01 (layered lookup + cache + malformed-YAML red-first test), depends on WP02.
# WP04 = IC-02 (PackContext threading), depends on WP03. WP05 = IC-03+IC-04 combined (plan.md
# states these are "one code change, split only for requirements traceability" — same file,
# pack_manager.py), depends on WP02 only — independently sequenced from the WP03->WP04 chain per
# the ruling, so it runs CONCURRENTLY with WP03/WP04 (owned_files disjoint — pack_manager.py vs
# mission_type_repository.py/mission_type_profiles.py, confirmed against plan.md's own Affected
# surfaces per IC). WP06 = IC-05 (the dominant-risk loud-fail, two ordered red/green commits per
# NFR-005), depends on WP04 (transitively WP03). WP07 = IC-07 (four CLI-surface fixes), depends
# on WP05 and WP06 (transitively WP03/WP04) — added WP06 as an explicit dependency beyond what
# plan.md's IC-07 bullet lists (IC-01/IC-02/IC-03 only), because IC-07's own FR-009 edge-case test
# ("a resolution failure must surface, not be silently treated as no removed steps") needs
# MissionTypeEmptyActionSequenceError to already exist — see WP07's prompt for the citation. This
# is a deliberate refinement over plan.md's literal text, not a contradiction of it.
#
# Schema conformance: this file intentionally carries ONLY the fields declared in
# src/specify_cli/schemas/wps.schema.json (id, title, dependencies, owned_files,
# requirement_refs, subtasks, prompt_file, plan_concern_refs, cross_cutting) — that schema sets
# `additionalProperties: false` per work package, unlike the richer, schema-exempt authoring
# convention used in some other missions' wps.yaml (agent_profile/role/execution_mode/etc. as
# "binding planning content" the pydantic loader tolerates but the schema forbids). Those fields
# live in each WP's own markdown frontmatter instead (`tasks/WPxx-*.md`), which is their
# documented home per `task-prompt-template.md`.
#
# `plan_concern_refs` (IC-##) live ONLY here, never in WP markdown frontmatter, per
# wps.schema.json's own field description.
#
# Note on SC-### refs (mirroring a landmine documented in another mission's own wps.yaml header):
# `_REF_FIND_PATTERN` (src/specify_cli/requirement_mapping.py:16) matches only `(FR|NFR|C)-\d+`,
# so an SC-### placed in `requirement_refs` would be silently dropped at the tasks-packages ->
# WP-frontmatter boundary and contribute nothing to FR-coverage validation. Success Criteria
# (SC-001..SC-006) are therefore referenced in each WP prompt's body prose (per-AC test strategy)
# instead of in `requirement_refs`, where they would be inert.
#
# C-001..C-008 assignment is a judgment call (constraints are boundary statements, not always a
# concrete implementation site): C-001 (mission size) and C-002 (ArtifactKind-promotion
# out-of-scope) go to WP01 since the ADR is where that framing is stated in these exact terms per
# CL-002. C-003 (ALLOWED_MISSION_TYPES untouched) goes to WP05 (the activation-scan WP, the
# closest adjacent boundary). C-004 (template-resolution/FSM chains out of scope) goes to WP04
# (the template_set-projection WP). C-005 (expected-artifacts.yaml reconciliation out of scope)
# goes to WP07 (the CLI-display WP, closest adjacent "what's shown to the operator" boundary).
# C-006 (action_grain.py stays built-in-only) and C-007 (provisioning/migration rosters stay
# built-in-only) and C-008 (doctrine never imports charter) all go to WP03, the WP that both
# introduces the new layered lookup and is the one place NFR-003/C-008 is mechanically enforced
# (tests/architectural/test_layer_rules.py). Per the task brief, only FR-001..FR-013 coverage is a
# hard finalize-tasks gate; NFR/C mapping here is for traceability/reviewer clarity, not a known
# hard-fail surface.
#
# WARNING — lanes.json's depends_on_lanes graph is cyclic (lane-a <-> lane-b, lane-a <-> lane-c).
# The write_scope_overlap collapse rule unions WP02+WP03+WP07 into a single lane ("lane-a")
# because WP02 shares a file with WP03 and two files with WP07; since that merged lane spans the
# mission's full temporal extent, the lane-level dependency projection produces both
# lane-a -> lane-b/lane-c (via WP07's real dependency on WP05/WP06) and lane-b/lane-c -> lane-a
# (via WP04/WP05's real dependency on WP03/WP02) simultaneously. Per-WP claim/start gating reads
# this file's own acyclic WP-level `dependencies` graph and is unaffected — this is not a
# scheduling deadlock. `src/specify_cli/lanes/worktree_allocator.py`'s
# `_merge_dependency_lane_tips` DOES mechanically git-merge each dependency lane's tip into a
# lane's worktree at allocation time, in both directions of this cycle, and it re-runs on every
# worktree REUSE too (worktree_allocator.py:194-207) specifically to catch up a dependency lane
# approved *after* the worktree was created (idempotent no-op once already merged) — a documented,
# precedented self-healing mechanism (issue #1684; the WP05/WP09 double-hit on mission 01KTYGTE is
# the cited prior incident it exists for), not an unmitigated landmine. A dependency branch that
# does not yet resolve is handled as warn + skip, falling back to the existing base rather than
# crashing (worktree_allocator.py:456-467) — never a merge of content that does not exist. Because
# WP07's own WP-level `dependencies: [WP05, WP06]` already gates its claim/start until those WPs
# are approved/done, by the time WP07 can actually be claimed lane-b's/lane-c's branches are
# guaranteed to exist and the idempotent catch-up merge should succeed cleanly on the ordinary
# `spec-kitty implement WP07` path. See WP07's prompt (Branch Strategy section) for a
# verification-only check to confirm the catch-up merge ran — never a license to bypass
# `spec-kitty implement WP##`, the only supported way to prepare a workspace (CLAUDE.md's
# Execution Workspace Strategy) — and tracer-tooling-friction.md for the full tooling-friction
# record. Do not "fix" this by hand-editing lanes.json — it is finalize-tasks-generated; the
# underlying lane-graph-cycle defect is upstream in src/specify_cli/lanes/compute.py's
# write_scope_overlap collapse rule (which does not validate for lane-graph cycles before writing
# lanes.json), out of scope for this mission's own artifacts.

