findings:
  - id: TASKS-DECOMP-001
    lens: pr-shape-diff-size
    severity: 2
    title: "PR Shape LOC/file-count estimate tasks.md restates as still valid omits tests/sync/test_events.py entirely"
    evidence:
      - artifact: "plan.md § PR Shape (LOC table, ~line 836-870)"
      - artifact: "tasks.md § ⚠️ PR Shape Recommendation (~line 41-49)"
      - artifact: "tasks.md § WP02 Owned files / T012 (line 64, 159, 169)"
      - code: "kitty-specs/legacy-cleanup-split-dossier-queue-migration-01M0MGHB/plan.md:846"
    claim: >
      plan.md's "PR Shape" LOC table (§ PR Shape) itemizes exactly 8 files (3 source +
      5 test files, one brand-new) totalling the ~570-820 LOC estimate that both plan.md
      and tasks.md rely on to justify shipping one un-split PR "reviewable in a single
      sitting." The table's only "test_events.py" row is `tests/dossier/test_events.py`
      (~10 LOC, WP04's FR-009 import re-point) — grepping plan.md confirms
      `tests/sync/test_events.py` (a DIFFERENT file) never appears anywhere in it. Yet
      tasks.md lists `tests/sync/test_events.py` as one of WP02's five owned files
      (tasks.md:64,159) and assigns it real new test content in T012 ("Add the new
      SC-005/FR-006 regression test to `tests/sync/test_events.py` ... plus an FR-007
      `VALID_EVENT_TYPES` membership test", tasks.md:169; also WP02 prompt file
      Subtask T012, two new tests with capsys/caplog assertions). tasks.md's own
      restatement ("The estimate holds after this WP decomposition") therefore
      restates an incomplete arithmetic without correcting it: the real file count is 9,
      not 8, and the real LOC total is understated by however much T012 adds (comparable
      new-test rows elsewhere in the same table run ~15-60 LOC, so this is not huge in
      absolute terms, but the stated basis for the no-split recommendation is
      demonstrably incomplete, not merely approximate).
    remediation: >
      Add a row for `tests/sync/test_events.py` to plan.md's PR Shape LOC table (or add
      a corrective footnote in tasks.md's restated PR Shape section) covering T012's two
      new tests, and update the "8 files" / "570-820 LOC" figures tasks.md quotes
      verbatim so the no-split recommendation's stated evidence actually accounts for
      every WP02-owned file.

  - id: TASKS-DECOMP-002
    lens: single-concern-atomicity-clarity
    severity: 1
    title: "WP02's two sub-concerns (sentinel mechanism vs. second coordinated consumer) are correctly bundled and the atomicity requirement is enforceable, but never named as two sub-concerns in a heading"
    evidence:
      - artifact: "tasks.md § ⚠️ Chokepoint Called Out Explicitly (~line 51-62)"
      - artifact: "plan.md § FR-006/FR-007 sentinel shape (~line 355-450), § Phasing Phase 3 (~line 916-943)"
      - artifact: "WP02 prompt § Objectives & Success Criteria (lines 86-114), § Test Strategy (lines 441-457), § Risks & Mitigations (458-471), § Review Guidance (473-486)"
    claim: >
      Derived verdict (mission-derived lens): bundling FR-006/FR-007 (the sentinel
      mechanism in emitter.py) with FR-011 (diagnose.py's independent free-function
      consumer of the same _PAYLOAD_RULES dict) into one WP is the correct call, not a
      padding-driven merge of two unrelated jobs. Evidence for "correctly one concern":
      (1) plan.md's Phase 3 rationale is explicit and specific — landing the sentinel
      alone crashes diagnose_events() with an uncaught AttributeError on any dossier
      event in the local offline queue (verified directly against
      src/specify_cli/sync/diagnose.py:301, `rules.get("required", set())` — this raises
      once `rules` becomes the sentinel `object()`); (2) WP02's own file makes the
      chokepoint concrete and mechanically enforceable, not just asserted: Test Strategy
      states outright "do not commit T007-T009 (emitter.py only) separately from
      T010-T011 (diagnose.py + its test), even if your tooling would let you"; Risks &
      Mitigations names the split as "the single highest risk in this WP"; each
      subtask's own Purpose section names which of the two consumers it belongs to
      (T007-T009/T012-T013 = emitter.py mechanism, T010-T011 = diagnose.py's second
      consumer); Review Guidance separately re-checks both files' delegation branches.
      This is materially more explicit than a "loosely stapled together" WP. The one
      minor gap: nothing in the WP file gives these two sub-concerns an explicit
      heading/label (e.g. "Part A: sentinel mechanism" / "Part B: coordinated second
      consumer") — the boundary is fully recoverable from the Purpose/Files fields and
      the Test Strategy commit instruction, but a reviewer skimming only the subtask
      title list (T007-T013) has to reconstruct the two-part shape themselves rather
      than seeing it named up front.
    remediation: >
      Optional, nit-level: add one short sentence to WP02's "Objectives & Success
      Criteria" or immediately above "Subtasks & Detailed Guidance" explicitly naming
      the two sub-concerns this WP bundles ("T007-T009+T012-T013 land the sentinel
      mechanism in emitter.py; T010-T011 land the coordinated diagnose.py consumer fix
      required to keep the mechanism from crashing a second production entry point")
      so the atomicity rationale is visible without reconstructing it from scattered
      Purpose fields.
