- id: SPEC-GOV-001
  merged_from:
  - SPEC-GOV-001
  - SPEC-VERIFY-002
  lens: Scope-correction fidelity / Falsifiability / evidence accuracy
  severity: 2
  title: FR-006's cited emitter.py:827-897 range overstates the touched region by including the unrelated
    MissionOriginBound rule
  evidence:
  - artifact: "spec.md \xA7 FR-006 (Requirements table, line 371)"
  - code: "src/specify_cli/sync/emitter.py:827-875 (the four dossier _PAYLOAD_RULES entries; line 875\
      \ is the closing `},` of MissionDossierParityDriftDetected, the last of the four \u2014 independently\
      \ confirmed by orchestrator re-check)"
  - code: src/specify_cli/sync/emitter.py:876-893 (MissionOriginBound entry, unrelated, must NOT be touched
      by this mission)
  - code: src/specify_cli/sync/emitter.py:895-897 (dict close + VALID_EVENT_TYPES assignment)
  claim: 'FR-006 cites "_PAYLOAD_RULES (`emitter.py:827-897`)" as the location of "the four hand-maintained
    dossier entries." Verified independently by two lens sessions (gov, verify) and re-confirmed by the
    orchestrator during R2: the four dossier entries actually span lines 827-875 (line 875 closes the
    last entry, MissionDossierParityDriftDetected). Lines 876-893 are the unrelated MissionOriginBound
    entry, and 895-897 are the dict''s closing brace plus the VALID_EVENT_TYPES assignment. The cited
    range is ~22 lines wider than the actual dossier entries and includes a sibling event type''s validation
    rules. The FR''s prose is otherwise unambiguous (it names the four dossier entries by type-string),
    so this does not change what an implementer would build on its own, but combined with SPEC-ARCH-002''s
    shape-tension finding below, an imprecise line range compounds the risk of an implementer touching
    MissionOriginBound''s block by mistake.

    '
  remediation: 'Correct FR-006''s citation to "emitter.py:827-875" (the four dossier entries only), or
    drop the numeric range and rely on the type-string enumeration already in the FR text, so the citation
    does not imply MissionOriginBound (876-893) is part of the edit surface.

    '
