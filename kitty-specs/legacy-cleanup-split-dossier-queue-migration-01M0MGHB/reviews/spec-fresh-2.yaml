findings:
  - id: SPEC-FRESH2-001
    lens: citation-accuracy
    severity: 1
    title: "test_preserves_legacy_positional_order line-range citation is off by one line"
    evidence:
      - artifact: "spec.md § Clarifications (Session 2026-08-22, last Q) and § FR-010"
      - code: "tests/dossier/test_events.py:317-342"
    claim: >
      Both citations of `test_preserves_legacy_positional_order` give the range
      "lines 317-341". The function actually spans file lines 317-342 inclusive:
      `def test_preserves_legacy_positional_order(...)` opens at line 317, and the
      closing `}` of the `context_diagnostics` dict assertion (the last line of the
      function body) is at line 342, not 341. Verified directly against
      `tests/dossier/test_events.py` in this checkout (function body confirmed via
      `awk 'NR>=317 && NR<=345'`, next symbol `class TestEmitParityDriftDetected:`
      starts at line 345, with one blank separator line at 343-344). This is the same
      class of stale-citation drift both prior review rounds fixed elsewhere in this
      document, just missed here because the citation was never touched in either
      round's diff.
    remediation: >
      Update both occurrences (Clarifications session-2026-08-22 block and FR-010) to
      "lines 317-342".
