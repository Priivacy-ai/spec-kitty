schema: wp-review/v1
wp_id: WP02
verdict: approved
complete: true
findings:
  - id: WP02-001
    severity: 2
    title: "_resolve_wp_manifests_for_validation duplicates build_wp_manifests's inclusion predicate instead of calling it"
    claim: >
      src/specify_cli/cli/commands/agent/mission_finalize.py:1564-1592
      (_resolve_wp_manifests_for_validation) hand-rolls the boolean condition
      `not (fm.execution_mode and fm.owned_files)` to decide which WPs to
      re-derive from wp_frontmatters, rather than importing and calling
      build_wp_manifests(wp_frontmatters) (src/specify_cli/ownership/validation.py:335-358,
      predicate `if fm.execution_mode and fm.owned_files:`) and merging its
      result into `resolved` (e.g. resolved.setdefault per key). The module
      already imports three other names from specify_cli.ownership.validation
      at mission_finalize.py:62-65, so build_wp_manifests was directly
      reachable with no new import path. The docstring even says "Mirrors
      build_wp_manifests's predicate exactly" -- an acknowledgment that this
      is a second, hand-maintained copy of the same rule. No test pins the
      two predicates to each other (tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py
      has no test that would fail if build_wp_manifests's predicate changed
      but this helper's inline condition did not). If build_wp_manifests's
      inclusion rule is ever extended (e.g. a future third condition), this
      call site silently keeps the old rule -- a real drift risk on exactly
      the mechanism that keeps the planning_artifact escape hatch (SK-24)
      out of validation.
    remediation: >
      Import build_wp_manifests from specify_cli.ownership.validation and
      call it on wp_frontmatters, merging only the keys not already present
      in wp_manifests, instead of restating the inclusion condition inline.
