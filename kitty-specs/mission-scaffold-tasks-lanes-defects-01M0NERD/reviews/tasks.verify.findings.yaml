findings:
  - id: TASKS-VERIFY-001
    lens: per-AC-test-strategy-concrete
    severity: 2
    title: "WP02 T009's planning_artifact test only proves the seam returns descriptor=None, not that the WP is 'accepted exactly as it is today' (US2 AS3's literal claim)"
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § T009, step 2"
      - artifact: "spec.md § User Story 2, Acceptance Scenario 3 (\"the WP is accepted exactly as it is today\")"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1264 (_apply_ownership_inference, seam-level only)"
      - code: "tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py:487 (existing seam-call pattern T009 follows)"
    claim: >
      Acceptance Scenario 3 for User Story 2 states that a `planning_artifact` WP with
      explicit `owned_files: []` "is accepted exactly as it is today" — a full-pipeline
      claim (the WP survives bootstrap, is not dropped from any manifest, and the run
      succeeds). T009 step 2, as written, only calls `_apply_ownership_inference` directly
      at the seam and asserts the returned descriptor is `None`. That proves the new FR-002
      check does not misfire on this input, but it does not exercise `_run_bootstrap_loop`
      or `finalize_tasks` end-to-end, so it does not actually verify "accepted exactly as
      today" in the sense AS3 states. A repo-wide check confirms no other test in this
      WP's target files (or in `tests/tasks/test_finalize_planning_artifact_kitty_specs.py`
      / `tests/specify_cli/cli/commands/test_finalize_tasks_explicit_empty_owned_files.py`,
      the two adjacent files that do touch `planning_artifact` + `owned_files`) drives the
      full pipeline for the specific explicit-empty-list + `planning_artifact` combination —
      the closest existing coverage uses non-empty confined `owned_files` lists, not the
      explicit-`[]` case this WP's fix touches. Risk is low because production code on the
      `planning_artifact` path is untouched by this WP, but the literal AS3 claim is not
      directly tested by any named subtask.
    remediation: >
      Add one line to T009 step 2 (or a new T009 sub-step) that also drives
      `_run_bootstrap_loop` (or `finalize_tasks --validate-only`) with the
      `planning_artifact` + explicit-`owned_files: []` fixture and asserts the WP is
      NOT dropped from `state.work_packages` / the run does not fail — closing the gap
      between "seam returns None" and "the WP is accepted exactly as it is today."
  - id: TASKS-VERIFY-002
    lens: mission-derived-vacuity-check
    severity: 2
    title: "WP02 T013's fallback instruction to avoid a vacuous residual-gap assertion is correct but lives in the validation step, not the test-authoring step"
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § T013, steps 2-3"
    claim: >
      T013 step 2 instructs writing a test that asserts `lanes.json` is absent after an
      FR-003 reject. Verified against the actual code
      (`src/specify_cli/cli/commands/agent/mission_finalize.py:1834-1835`,
      `_compute_and_write_lanes`): pre-fix, the function returns `(None, None)` without
      ever calling `write_lanes_json`, so `lanes.json` is already absent before the fix
      too — this specific assertion, as described in step 2 alone, is vacuous
      (pre-fix == post-fix). Step 3 correctly diagnoses this risk and instructs
      "instead assert the *exception* raises... which is the actual revert-sensitive
      assertion" — but that corrective instruction sits in the "Confirm RED" validation
      step, not as an explicit edit folded back into step 2's Steps list where the test
      is actually authored. An implementer who writes step 2's test first, marks it
      done, and only later runs the C-005 RED-confirmation pass (T013's own step 3) has
      to notice the vacuity and go back and add a `pytest.raises(...)` wrapper — the
      mission's own C-005 discipline should catch this before shipping, but the
      instruction as laid out invites a first-pass vacuous test rather than making the
      revert-sensitive assertion the default.
    remediation: >
      Fold step 3's corrective instruction directly into step 2: state explicitly that
      the residual-gap test MUST wrap the `_compute_and_write_lanes` (or `finalize-tasks`)
      call in `pytest.raises(...)` and assert on the raised exception first, THEN assert
      `lanes.json` is absent afterward — making the revert-sensitive assertion the
      as-written default rather than a post-hoc correction discovered during the RED
      confirmation pass.
