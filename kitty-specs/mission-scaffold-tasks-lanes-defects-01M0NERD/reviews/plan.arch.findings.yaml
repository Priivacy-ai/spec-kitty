findings:
  - id: PLAN-ARCH-001
    lens: pipeline-ordering position fidelity (mission-specific)
    severity: 3
    title: "FR-002's per-WP immediate-raise design only ever names ONE offending WP per finalize-tasks run, undercutting the mission's own motivating scenario"
    evidence:
      - artifact: "plan.md § 1 (FR-002 seam-placement resolution), § 5 (Pipeline-Ordering Constraint)"
      - artifact: "spec.md § User Story 2 'Why this priority' (line 121-126: '8 of 8 WPs authored this way'), Acceptance Scenario 4 (line 151-155)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1305-1391 (_run_bootstrap_loop's per-WP for-loop calling _apply_ownership_inference synchronously at ~1363)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1264-1295 (_apply_ownership_inference, where the plan places the new raise)"
    claim: >
      The plan places FR-002's reject inside `_apply_ownership_inference`, called once per
      WP from inside `_run_bootstrap_loop`'s synchronous `for wp_file in wp_files:` loop
      (mission_finalize.py:1305). A raise from that call propagates immediately out of the
      loop, so the loop never reaches subsequent WP files. Traced against the loop body: no
      disk write happens during the loop itself — `_apply_bootstrap_fields` and
      `_apply_ownership_inference` only mutate an in-memory `_Builder` and append to
      `state.pending_writes` (an in-memory list); the actual disk write is deferred to
      `_flush_frontmatter_writes`, called only after `_run_bootstrap_loop` returns
      successfully (mission_finalize.py:2752). This means an "accumulate all contradictions
      across every WP, then raise once naming all of them" design would be exactly as safe
      for NFR-004's no-partial-write guarantee as the plan's "raise on first offense"
      design — nothing about the write-ordering guarantee requires stopping at the first
      bad WP. But the plan's actual design (raise immediately, per WP, at the moment the
      contradiction is found) means a mission with N WPs sharing the same authoring mistake
      — the exact real-world case that motivated this mission, "8 of 8 WPs authored this
      way" (spec.md line 122) — will surface only the FIRST offending WP per
      `finalize-tasks` invocation. The author fixes it, reruns, and it fails again on the
      SECOND offending WP, and so on for up to 8 rounds. Acceptance Scenario 4 (spec.md
      line 151-155) says the run must "report the specific offending WP(s)" (plural marker)
      when there is "a mix of WPs — some validly authored, one hitting the contradiction" —
      that single-bad-WP framing is satisfiable by the plan's design, but the plan never
      states, tests, or even acknowledges the batch case its own motivating example
      actually needs, and does not direct the implementing WP to collect-then-raise instead
      of raise-on-first-offense.
    remediation: >
      Either (a) explicitly adopt collect-all-offenders-then-raise-once inside
      `_run_bootstrap_loop`'s per-WP loop for the FR-002 check specifically (append the
      contradiction to a list instead of raising immediately inside
      `_apply_ownership_inference`, then raise a single aggregated error naming every
      offending WP after the loop completes but still strictly before
      `_flush_frontmatter_writes` — preserving NFR-004's guarantee unchanged), and add this
      as an explicit test case (a mission with 2+ WPs sharing the contradiction, asserting
      all are named in one run); or (b) if raise-on-first-offense is intentionally kept for
      simplicity, say so explicitly in §1/§11 and note the accepted N-round-trip cost against
      the mission's own "8 of 8" motivating scenario, so a reviewer isn't left assuming
      batch-reporting was silently achieved.

  - id: PLAN-ARCH-002
    lens: contracts
    severity: 3
    title: "FR-003's fix makes _compute_and_write_lanes's declared Optional return type permanently misleading and leaves two downstream None-guards dead, unaddressed by the plan's seam map"
    evidence:
      - artifact: "plan.md § 1 (Seam / Module Map, FR-003 row), § 3 (Contracts), § 10 (Campsite-Clean Scope)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1820-1834 (_compute_and_write_lanes signature: `-> tuple[Path | None, LanesManifest | None]`; the only early return of `(None, None)` is the guard at 1834 that FR-003 replaces with a raise)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1950 (_scaffold_acceptance_matrix_if_lane_based: `if lanes_manifest is None or validate_only: return`)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:270 (_collect_finalize_artifacts: `if lanes_path is not None: candidates.append(lanes_path)`)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:2342-2376 (_run_commit_pipeline: single call site threading `_compute_and_write_lanes`'s return into both of the above)"
    claim: >
      Traced `_compute_and_write_lanes`'s full body (mission_finalize.py:1820-1881): every
      code path other than the FR-003 guard at line 1834 either raises `typer.Exit` or falls
      through to `return lanes_path, lanes_manifest` at line 1881, where `lanes_manifest`
      comes from `compute_lanes(...)` (never None) and `lanes_path` comes from
      `write_lanes_json(...)` (never None). After FR-003 replaces the line-1834
      `return None, None` with a raise, this function can **never again actually return
      `(None, None)`** — it either raises or returns two real values. Its only caller,
      `_run_commit_pipeline` (mission_finalize.py:2342, verified the single call site), feeds
      the result straight into `_scaffold_acceptance_matrix_if_lane_based`
      (`lanes_manifest`, line 2358ish) and `_commit_finalize_artifacts` → `_collect_finalize_
      artifacts` (`lanes_path`, line 2376 → 2045 → 270). Both of those downstream functions
      carry an explicit `is None` / `is not None` guard whose False-branch becomes
      unreachable dead code for this call path after the fix ships — most concretely
      `_scaffold_acceptance_matrix_if_lane_based`'s `if lanes_manifest is None or
      validate_only: return` at line 1950, which silently no-ops the acceptance-matrix
      scaffold today when `_compute_and_write_lanes` returns `(None, None)`, and which the
      fix makes permanently unreachable via this path. Plan §1's seam map lists only 4
      changed functions across 3 files and does not mention either downstream consumer;
      plan §3 (Contracts) asserts "no field is added, removed, or retyped anywhere in this
      mission" without examining that `_compute_and_write_lanes`'s effective (if not
      declared) return-type contract narrows from `Path | None, LanesManifest | None` to
      "always non-None or raises," and plan §10 (Campsite-Clean) explicitly declines to look
      beyond the four touched functions for related cleanup.
    remediation: >
      Add a line to plan §1 or §3 noting this consequence, and direct the implementing WP to
      either (a) leave the downstream `is None` guards as harmless defensive code with a
      short comment noting they're now unreachable via `_run_commit_pipeline`'s only call
      path (least invasive), or (b) per the charter's Sonar/dead-code hygiene expectations,
      narrow `_compute_and_write_lanes`'s return annotation to `tuple[Path, LanesManifest]`
      (non-Optional) now that it can no longer return `(None, None)`, and simplify the two
      downstream guards accordingly — a decision the plan should make explicitly rather than
      leave for the implementing WP to discover unguided mid-diff.

  - id: PLAN-ARCH-003
    lens: contracts
    severity: 2
    title: "Plan's own 'four call sites / three files touched' figure is inconsistent with its own Seam Map table (five changed call sites; only two files actually receive a diff)"
    evidence:
      - artifact: "plan.md § Technical Context, Scale/Scope line (line 33): 'Scale/Scope: 3 source files touched ..., 4 call sites'"
      - artifact: "plan.md § 1 opening line (line 65): 'Exactly four call sites across three files change.'"
      - artifact: "plan.md § 12 (line 460): 'the touched-function set is small (4 call sites, ~32+45+62+trivial lines ... per §1/§10)'"
      - artifact: "plan.md § 1 table (lines 69-76) and § 1 resolution paragraph (lines 78-94, 'build_wp_manifests's acceptance predicate ... is left unchanged by this mission')"
    claim: >
      The plan's own Seam Map table (§1) lists 6 rows, of which 5 are marked as actual
      changes — `mission_creation.py`'s two commit call sites (FR-001, both changed),
      `_apply_ownership_inference` (FR-002, changed), `_validate_ownership_manifests`
      (FR-004, changed), and `_compute_and_write_lanes` (FR-003, changed) — and 1
      (`build_wp_manifests` in `ownership/validation.py`) is explicitly marked unchanged:
      "this function's behavior is not changed," and again, "build_wp_manifests's
      acceptance predicate at line 356 is left unchanged by this mission." That means (a)
      the real count of changed call sites is 5, not the "4" repeated in the Technical
      Context Scale/Scope line, the §1 opening sentence, and §12's phasing-size estimate;
      and (b) only 2 files (`mission_creation.py`, `mission_finalize.py`) actually receive a
      diff, not the "3 source files touched" the same Scale/Scope line claims, since
      `ownership/validation.py` is listed as touched but its own row says nothing in it
      changes.
    remediation: >
      Correct the three prose occurrences ("4 call sites" / "three files") to match the
      table's own count (5 changed call sites, 2 files with an actual diff), or if
      `ownership/validation.py` is meant to receive a documentation-only comment (e.g.
      noting why the predicate is intentionally left alone post-FR-002), say so explicitly
      so "3 source files touched" is accurate rather than aspirational. Low practical risk
      since the table itself is correct and would guide an implementer correctly regardless
      of the summary arithmetic, but the inconsistency should not ship as-is in a plan whose
      own stated discipline is "verified first-hand ... not copied from the spec without
      re-checking."

  - id: PLAN-ARCH-004
    lens: pipeline-ordering position fidelity (mission-specific)
    severity: 1
    title: "Minor line-number citation off-by-one for the need_owned_files assignment in _apply_ownership_inference"
    evidence:
      - artifact: "plan.md § 1 table, FR-002/mission_finalize.py row: 'need_owned_files = not wp_meta.owned_files and not owned_files_explicitly_empty at 1276'"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1277 (verified via grep -n: the `need_owned_files = ...` line is actually at 1277, one line below the plan's citation; the adjacent `owned_files_explicitly_empty = ...` citation at 1275 is exact)"
    claim: >
      The plan cites the `need_owned_files = not wp_meta.owned_files and not
      owned_files_explicitly_empty` line as being at `mission_finalize.py:1276`; re-derived
      directly against this checkout's HEAD, it is actually at line 1277 (the immediately
      preceding `owned_files_explicitly_empty = ...` line, cited correctly at 1275, is
      followed by `need_execution_mode = not wp_meta.execution_mode` at 1276, then
      `need_owned_files` at 1277). A one-line citation slip; every other line number in this
      row and the surrounding table is exact.
    remediation: >
      Correct "1276" to "1277" in plan.md § 1's FR-002/`_apply_ownership_inference` table
      row. No behavioral or scoping impact — the surrounding function-level description and
      the actual code change site are otherwise correctly identified.
