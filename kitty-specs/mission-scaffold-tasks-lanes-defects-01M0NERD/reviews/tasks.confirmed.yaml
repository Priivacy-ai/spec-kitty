- id: TASKS-DECOMP-001
  lens: PR-sized / single-concern reviewability under single-PR default
  severity: 3
  title: Neither tasks.md nor WP01/WP02 independently validates plan.md §12's 'one PR, one sitting' claim,
    and WP02's own production-diff size goes unquantified unlike WP01's
  evidence:
  - artifact: plan.md §12 (Phasing / WP-Shape Guidance), lines 634-643
  - artifact: tasks.md (25 lines, no PR-size/reviewability statement anywhere)
  - artifact: 'tasks/WP01-meta-json-commit-fails-loudly.md, ''PR shape'' paragraph (line 67-68) and Subtask
      T005 ''Files'' line (212-213: ''a small diff'')'
  - artifact: 'tasks/WP02-ownership-lanes-fail-loudly.md, ''PR shape'' paragraph (line 76-77), Subtask
      T015 ''Files'' line (376-378: ''a moderate, scoped diff''), Subtask T016 ''Files'' line (417-420:
      no size adjective at all)'
  - code: src/specify_cli/cli/commands/agent/mission_finalize.py:1264 (_apply_ownership_inference), :1298
      (_run_bootstrap_loop), :1475 (_validate_ownership_manifests), :1820 (_compute_and_write_lanes),
      :1188 (_BootstrapState) — all four functions plus the dataclass verified present at the cited lines,
      no drift
  claim: 'plan.md §12 explicitly conditions its "single PR, fits in one sitting" judgment on the tasks-authoring
    step re-counting the assembled diff and saying so explicitly in tasks.md "if the tasks-authoring agent''s
    own count of the assembled diff disagrees at authoring time — if so, say so explicitly in tasks.md
    rather than silently splitting." Neither tasks.md (a 25-line index with no size/reviewability content)
    nor WP01 nor WP02 records any such re-count or explicit agreement/disagreement — both WP files simply
    restate plan.md §12''s conclusion verbatim ("this WP lands as part of the single mission PR (plan.md
    §12 — one PR, the diff fits in one sitting)") without independent verification. Reconstructing the
    real scope from the WPs'' own per-subtask line estimates: WP01 is genuinely small (~4-6 production
    lines at 2 call sites in one function, plus ~105-155 test lines from T002-T004/T006''s stated ranges,
    so WP01 self-quantifies as "a small diff" at T005). WP02 is substantially larger: 10 subtasks touching
    4 production functions plus a new dataclass field in one 2830-line file (mission_finalize.py), with
    T009-T014''s own stated test-line ranges summing to ~280-360 new test lines, plus production changes
    to _apply_ownership_inference''s return-type/signature, _run_bootstrap_loop''s loop body and post-loop
    block, _validate_ownership_manifests''s short-circuit, and _compute_and_write_lanes''s return/raise
    — plus a conditional, unbounded helper extraction if the mandatory post-change complexity re-check
    (T016 step 4) trips. WP02''s own T015 calls this "a moderate, scoped diff" but T016 — which contains
    the FR-003 raise, two inline comments, the FR-004 short-circuit removal, AND the open-ended possible
    helper extraction — carries no size characterization at all, in contrast to WP01''s T005 explicitly
    self-labeling as "a small diff." Combined, the mission''s single PR is realistically ~425-580 diff
    lines across 2 production files (one of which, mission_finalize.py, is also mid-rebase-collision with
    open PR #3666 per plan.md §7/tasks WP02''s own "Rebase-watch" section) and 5 test files — large enough
    that plan.md itself anticipated the tasks phase might need to flag disagreement, and neither the tasks
    index nor either WP records having done that check.

    '
  remediation: 'Add a short paragraph to tasks.md (or a shared note referenced by both WP files) stating
    the tasks-authoring step''s own assembled-diff estimate (production + test lines, by file) and an
    explicit confirmation that it still agrees with plan.md §12''s one-PR-fits-in-one- sitting judgment
    — or, if it does not, say so per plan.md §12''s own instruction and either split WP02 further (e.g.
    separate the FR-002 bootstrap-reject subtree, T009-T011 + T015, from the FR-003/FR-004 subtree, T012-T014
    + T016, since they touch disjoint functions in the same file with no dependency between them per plan.md''s
    own function map) or flag the aggregate size explicitly for the pre-merge reviewer so it is not a
    surprise discovered only at PR-review time. At minimum, give T016 the same size characterization WP01''s
    T005 and WP02''s T015 already carry, so the WP''s own text does not read as though its largest and
    most open-ended subtask (raise + inline comments + short-circuit removal + conditional helper extraction)
    is a trivial edit.

    '
- id: TASKS-SEQ-001
  lens: chokepoints
  severity: 2
  title: WP01's own task file never mentions the mission-loader-coverage CI gate that its diff triggers
  evidence:
  - artifact: plan.md §8 ("Gate Set — Concrete, Evidence-Based"), lines 429-445 and 503-506
  - artifact: tasks/WP01-meta-json-commit-fails-loudly.md (full file, 290 lines) — no occurrence of "mission-loader-coverage",
      "mission_loader", or "core_misc"
  - artifact: 'tasks/WP02-ownership-lanes-fail-loudly.md (full file, 500 lines) — likewise no occurrence
      (expected: mission_finalize.py sets `cli`/`execution_context`, not `core_misc`, per plan.md §8,
      so this gate is not live for WP02)'
  - code: src/specify_cli/core/mission_creation.py — the file WP01 owns, which matches the `core_misc`
      path filter (`'src/specify_cli/core/**'`) that plan.md §8 confirms triggers the `mission-loader-coverage`
      job (>=90% floor on src/specify_cli/mission_loader) even though no code under that package is touched
  claim: 'plan.md §8 does real, specific analysis establishing that the `mission-loader-coverage` CI job
    (a >=90% coverage floor on `src/specify_cli/mission_loader`) will run on this mission''s PR, triggered
    solely by WP01''s diff setting the `core_misc` path-filter true (mission_creation.py lives under `src/specify_cli/core/**`).
    Plan.md concludes the floor is "held trivially" absent an import-time side effect, and says explicitly
    this should be "state[d] explicitly in the WP validation notes rather than silently assuming it."
    WP01''s task file — the only WP whose diff actually triggers this gate — carries none of that: T007''s
    "Final validation pass" subtask and the WP''s Definition of Done enumerate ruff, mypy, the C-005 baseline-red
    classification, and the SC-005 fast grep pass, but never mention mission-loader-coverage, so nobody
    implementing or reviewing WP01 is told to expect this job to run or to record that it held trivially
    as plan.md instructed. In practice the risk is low (WP01''s fix is a pure two-line `contextlib.suppress`
    removal, unlikely to touch anything import-adjacent to `mission_loader`), so this is a documentation/traceability
    gap rather than a correctness defect — a chokepoint the plan flagged as live for this exact diff quietly
    failed to survive the plan-to-tasks handoff.

    '
  remediation: 'Add one line to WP01''s T007 ("Final validation pass") and Definition of Done: "Note in
    the validation summary that CI''s mission-loader-coverage job will run (triggered via the core_misc
    path filter on this WP''s own file) and is expected to hold trivially since no lines are added/removed
    in src/specify_cli/mission_loader — confirm no import-time side effect and record the result," mirroring
    plan.md §8''s own instruction. No production-code or lane/wps.yaml change needed — this is a tasks.md/WP-file
    completeness fix only.

    '
- id: TASKS-VERIFY-001
  lens: per-AC-test-strategy-concrete
  severity: 2
  title: WP02 T009's planning_artifact test only proves the seam returns descriptor=None, not that the
    WP is 'accepted exactly as it is today' (US2 AS3's literal claim)
  evidence:
  - artifact: tasks/WP02-ownership-lanes-fail-loudly.md § T009, step 2
  - artifact: spec.md § User Story 2, Acceptance Scenario 3 ("the WP is accepted exactly as it is today")
  - code: src/specify_cli/cli/commands/agent/mission_finalize.py:1264 (_apply_ownership_inference, seam-level
      only)
  - code: tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py:487 (existing seam-call
      pattern T009 follows)
  claim: 'Acceptance Scenario 3 for User Story 2 states that a `planning_artifact` WP with explicit `owned_files:
    []` "is accepted exactly as it is today" — a full-pipeline claim (the WP survives bootstrap, is not
    dropped from any manifest, and the run succeeds). T009 step 2, as written, only calls `_apply_ownership_inference`
    directly at the seam and asserts the returned descriptor is `None`. That proves the new FR-002 check
    does not misfire on this input, but it does not exercise `_run_bootstrap_loop` or `finalize_tasks`
    end-to-end, so it does not actually verify "accepted exactly as today" in the sense AS3 states. A
    repo-wide check confirms no other test in this WP''s target files (or in `tests/tasks/test_finalize_planning_artifact_kitty_specs.py`
    / `tests/specify_cli/cli/commands/test_finalize_tasks_explicit_empty_owned_files.py`, the two adjacent
    files that do touch `planning_artifact` + `owned_files`) drives the full pipeline for the specific
    explicit-empty-list + `planning_artifact` combination — the closest existing coverage uses non-empty
    confined `owned_files` lists, not the explicit-`[]` case this WP''s fix touches. Risk is low because
    production code on the `planning_artifact` path is untouched by this WP, but the literal AS3 claim
    is not directly tested by any named subtask.

    '
  remediation: 'Add one line to T009 step 2 (or a new T009 sub-step) that also drives `_run_bootstrap_loop`
    (or `finalize_tasks --validate-only`) with the `planning_artifact` + explicit-`owned_files: []` fixture
    and asserts the WP is NOT dropped from `state.work_packages` / the run does not fail — closing the
    gap between "seam returns None" and "the WP is accepted exactly as it is today."

    '
- id: TASKS-VERIFY-002
  lens: mission-derived-vacuity-check
  severity: 2
  title: WP02 T013's fallback instruction to avoid a vacuous residual-gap assertion is correct but lives
    in the validation step, not the test-authoring step
  evidence:
  - artifact: tasks/WP02-ownership-lanes-fail-loudly.md § T013, steps 2-3
  claim: 'T013 step 2 instructs writing a test that asserts `lanes.json` is absent after an FR-003 reject.
    Verified against the actual code (`src/specify_cli/cli/commands/agent/mission_finalize.py:1834-1835`,
    `_compute_and_write_lanes`): pre-fix, the function returns `(None, None)` without ever calling `write_lanes_json`,
    so `lanes.json` is already absent before the fix too — this specific assertion, as described in step
    2 alone, is vacuous (pre-fix == post-fix). Step 3 correctly diagnoses this risk and instructs "instead
    assert the *exception* raises... which is the actual revert-sensitive assertion" — but that corrective
    instruction sits in the "Confirm RED" validation step, not as an explicit edit folded back into step
    2''s Steps list where the test is actually authored. An implementer who writes step 2''s test first,
    marks it done, and only later runs the C-005 RED-confirmation pass (T013''s own step 3) has to notice
    the vacuity and go back and add a `pytest.raises(...)` wrapper — the mission''s own C-005 discipline
    should catch this before shipping, but the instruction as laid out invites a first-pass vacuous test
    rather than making the revert-sensitive assertion the default.

    '
  remediation: 'Fold step 3''s corrective instruction directly into step 2: state explicitly that the
    residual-gap test MUST wrap the `_compute_and_write_lanes` (or `finalize-tasks`) call in `pytest.raises(...)`
    and assert on the raised exception first, THEN assert `lanes.json` is absent afterward — making the
    revert-sensitive assertion the as-written default rather than a post-hoc correction discovered during
    the RED confirmation pass.

    '
