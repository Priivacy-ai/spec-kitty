findings:
  - id: ANALYZE-FRESH2-001
    lens: self-referential-accuracy / report-vs-source drift
    severity: 3
    title: Draft silently drops the confirmed ANALYZE-GOV-001 finding (WP02's own six stale Validation citations) instead of recording it as resolved, even though it keeps the smaller, same-root-cause ANALYZE-003 as a documented "resolved this round" entry
    evidence:
      - artifact: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/reviews/analyze.confirmed.yaml:8-59 (ANALYZE-GOV-001, severity 3, confirmed)"
      - artifact: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/reviews/analyze-refute-1.yaml:6-8 (ANALYZE-GOV-001 verdict: confirmed)"
      - code: "the fixing commit 27862b16b06bf8ab77140fec19211879ee60b523 diff (git show), which edits BOTH reviews/tasks.ruling.md:34 AND six 'Validation' lines in tasks/WP02-ownership-lanes-fail-loudly.md (T009/T010/T011: 'red before implementation (T015)'/'red before T015' x2; T012/T013: 'red before T016' x2; T014: 'rejection test red before T016')"
      - artifact: "/tmp/claude-1000/-home-jeroennouws-dev-SK-missions/b0e6f3cf-02a5-45a5-a2a6-d64323a6afe3/scratchpad/analyze-3673/analyze-draft-v1.md ANALYZE-003 (lines 12-15 YAML, 47-53 prose) — kept in the report, explicitly re-flagged as 'resolved during this round'/'Recorded here as a resolved finding rather than live drift'"
      - artifact: "analyze-draft-v1.md, full text — contains zero mentions of 'GOV-001' or of WP02's own six stale Validation-line citations anywhere"
    claim: >-
      ANALYZE-GOV-001 (confirmed, severity 3) found that WP02-ownership-lanes-fail-loudly.md's
      own body — not just reviews/tasks.ruling.md — carried six pre-renumbering-drift
      "Validation" citations (T009/T010/T011 wrongly naming T013 as their implementation gate;
      T012/T013/T014 wrongly naming T014/T015 instead of the real gate T016), the same root
      cause and the same class of defect ANALYZE-003 already documents for tasks.ruling.md's
      single citation, but broader in scope (six sites vs. one) and higher in severity (3 vs.
      ANALYZE-003's own "low"). Commit 27862b16b fixed both the ruling citation and all six WP02
      citations in a single commit. The draft's own precedent — ANALYZE-003 — shows the report's
      policy for a finding resolved mid-round is to keep it, reframed as "resolved this round,"
      not to delete it (analyze-fresh.yaml round 1 explicitly offered "remove... or re-flag as
      resolved," and the draft chose re-flag). ANALYZE-GOV-001 was never given that same
      treatment: it does not appear anywhere in analyze-draft-v1.md, under any ID, resolved or
      otherwise. A reader relying on the draft alone would conclude the only pre-renumbering
      citation drift in this mission was the single tasks.ruling.md line ANALYZE-003 describes,
      and would have no way to learn — without separately opening
      reviews/analyze.confirmed.yaml — that WP02's own task-prompt guidance carried six instances
      of the same defect at a materially higher confirmed severity. The verdict summary's "Four
      low-severity findings... narrow and non-blocking" framing is accurate only for the findings
      the draft chose to list; it silently omits that a severity-3 finding touching the same
      artifact family was found and fixed in the same round.
    remediation: >-
      Add a fifth entry to the draft (e.g. ANALYZE-005), mirroring ANALYZE-003's "resolved this
      round" treatment: summarize ANALYZE-GOV-001's original scope (WP02's own six stale
      Validation-line citations at lines 247/273/293/315/364/388, pointing to test subtasks
      T013/T014 instead of the real implementation gates T015/T016), note its confirmed severity
      (3), and record that commit 27862b16b corrected all six lines plus the sibling
      tasks.ruling.md citation. Update the verdict summary's "Four low-severity findings" line to
      reflect the fifth, higher-severity-but-resolved entry so the summary is not misread as the
      complete list of citation-drift defects found this phase.

  - id: ANALYZE-FRESH2-002
    lens: evidentiary-accuracy
    severity: 2
    title: ANALYZE-004's evidence mischaracterizes T009 as a test that "asserts the run raises" — T009 explicitly asserts the opposite (non-raising, direct-seam behavior only)
    evidence:
      - artifact: "/tmp/claude-1000/-home-jeroennouws-dev-SK-missions/b0e6f3cf-02a5-45a5-a2a6-d64323a6afe3/scratchpad/analyze-3673/analyze-draft-v1.md:57 ('T009/T010/T011 (the FR-002 red-first tests) assert only that the run raises and names the offending WP ID(s)/JSON error code...')"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:203-204 (T009 step 1: 'Assert the call does NOT raise — it returns changed, warnings, descriptor = seam._apply_ownership_inference(...) with descriptor a non-None str naming the WP ID')"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:214-235 (T009 step 4 drives _run_bootstrap_loop only with the ACCEPTED planning_artifact fixture, asserting 'wp_id not in state.ownership_contradictions' — never exercises the contradiction/raise fixture through the loop)"
      - artifact: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/reviews/analyze.confirmed.yaml:108-112 (ANALYZE-COVER-002's evidence, source of the same wording, carried into the draft's ANALYZE-004 verbatim)"
    claim: >-
      ANALYZE-004's body groups T009 together with T010/T011 as tests that "assert only that the
      run raises." This is factually wrong for T009 specifically: T009 step 1 explicitly asserts
      _apply_ownership_inference's direct-seam call does NOT raise for the contradiction case
      (it returns a 3-tuple with a non-None descriptor instead); step 2 is the planning-artifact
      non-contradiction case; step 4 drives _run_bootstrap_loop only with the ACCEPTED
      planning-artifact fixture, never with the contradiction fixture, so no raise is ever
      exercised or asserted anywhere in T009. Only T010 asserts a raise (via _run_bootstrap_loop);
      T011 asserts the --json payload for the raise. This inaccuracy was already present in
      ANALYZE-COVER-002's original evidence text (analyze.confirmed.yaml, confirmed by
      analyze-refute-1.yaml) and was carried into ANALYZE-004 unchanged across both fix rounds.
      It does not change ANALYZE-004's core conclusion (no WP02 subtask asserts the FR-002-path
      triple guarantee), but it misstates what T009 actually verifies and could mislead a reader
      auditing which subtask does what.
    remediation: >-
      In ANALYZE-004, rephrase to distinguish T009 (asserts the non-raising direct-seam
      contradiction-descriptor shape, for both the contradiction and accepted cases) from
      T010 (asserts the aggregated raise via _run_bootstrap_loop) and T011 (asserts the raise's
      --json payload shape) — e.g. "T010/T011 assert only that the run raises and names the
      offending WP ID(s)/JSON error code; T009 asserts the underlying non-raising descriptor
      shape those two build on" — rather than grouping all three as raise-asserting tests.
