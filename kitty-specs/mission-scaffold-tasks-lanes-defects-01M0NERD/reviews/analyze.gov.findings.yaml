  - id: ANALYZE-GOV-001
    lens: terminology-canon
    severity: 3
    title: "WP02's own text carries the same stale pre-renumbering subtask citations the draft's ANALYZE-003 attributes only to tasks.ruling.md"
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md, Validation lines"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:247"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:273"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:293"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:315"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:364"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:388"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:431 (T015's own Validation: \"T009, T010, T011's tests pass\")"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:474 (T016's own Validation: \"T012, T013, T014's tests pass\")"
      - artifact: "draft analyze-draft-v1.md, ANALYZE-003"
    claim: >
      The draft report's ANALYZE-003 says tasks.ruling.md's "T013/T009" citation for
      TASKS-FRESH2-001 is stale relative to the live WP02 text, and concludes explicitly:
      "a documentation-precision issue in the ruling, not a defect in the live WP02 text."
      Independent verification shows this is inaccurate in scope: the live WP02 text carries
      the identical class of stale, pre-renumbering subtask citation in its OWN "Validation"
      fields, in six places, not one. T009 (line 247: "red before implementation (T013), green
      after"), T010 (line 273) and T011 (line 293) each name T013 as the gate that turns their
      FR-002 tests green — but T013 is itself only a red-first TEST subtask ("Red-first tests —
      FR-003 `--json` failure surfaced + residual-gap test"), not an implementation subtask.
      The actual FR-002 implementation subtask is T015 ("Implement FR-002 — bootstrap
      contradiction detection + aggregated raise"), whose own Validation line (431) correctly
      states "T009, T010, T011's tests pass" — confirming T015, not T013, is the real gate.
      Likewise T012 (line 315) and T013 (line 364) name T014 — itself only a red-first FR-004
      TEST subtask — as their gate, when the real FR-003 implementation subtask is T016 (line
      474: "T012, T013, T014's tests pass"). T014 (line 388) names T015 as its gate, but T015
      implements FR-002, not FR-003/FR-004 — T014's real gate is also T016. This is the exact
      same renumbering-drift root cause the draft itself proposes for the ruling's citation
      (subtasks were inserted/split after an earlier numbering pass, shifting later IDs), but
      it is baked into WP02's own authored guidance in six places, not merely into a review
      artifact that sits alongside it. WP01's equivalent Validation lines (T002/T003/T004 all
      correctly cite T005, the true implementation subtask) show this is not how the WP prompt
      template is supposed to read — WP02 alone regressed it, plausibly during its multi-round
      TASKS-FRESH2-001 rework. Practical effect: an implementer or reviewer reading T009-T011's
      "green after T013" literally would expect those tests to pass once T013 (still a red-first
      test subtask) is done, and be confused when they remain red until T015 actually lands —
      exactly the "likely to cause rework inside one work package" shape of a severity-3 finding.
    remediation: >
      In WP02-ownership-lanes-fail-loudly.md, correct the six stale Validation-line citations
      to name the real implementing subtask: T009/T010/T011 (lines 247, 273, 293) should read
      "green after T015" (matching T015's own line 431 cross-reference), and T012/T013/T014
      (lines 315, 364, 388) should read "green after T016" (matching T016's own line 474
      cross-reference). While fixing this, also correct tasks.ruling.md's parallel "T013/T009"
      citation for TASKS-FRESH2-001 (per the draft's own ANALYZE-003 remediation) so the ruling
      and the live WP text agree — do not fix only the ruling and leave WP02's own text carrying
      the same drift the ruling's citation was flagged for.
