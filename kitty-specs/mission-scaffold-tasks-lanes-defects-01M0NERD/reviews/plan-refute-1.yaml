verdicts:
  - id: PLAN-GOV-001
    verdict: confirmed
    reason: >-
      Empirically re-ran the cited regex against the three real decorator lines
      (decision.py:213, _doctrine_asset.py:125, plugin.py:30) and it matches none of
      them — grep -E '^\+.*(@app\.command|@.*\.command\(\))' only fires on literal
      "@app.command(...)" or an empty-parens ".command()"; a real recursive walker
      (tests/architectural/test_docs_cli_reference_parity.py, using
      scripts/docs/_typer_walker.walk) exists and is not promoted, matching the claim.
  - id: PLAN-GOV-002
    verdict: refuted
    reason: >-
      packs/built-in/procedures/mission-tracer-files.procedure.yaml (the artifact
      Standing Order #3 itself points to) states in its notes section "these tracer
      files are optional experiment infrastructure — their absence does not block
      acceptance... skipping them is not a mission-gate violation," directly
      contradicting the finding's framing of a missing D2 append as a Standing
      Order #3 violation; the finding did not check this governing procedure text.
  - id: PLAN-GOV-003
    verdict: confirmed
    reason: >-
      grep -n against mission_finalize.py confirms need_owned_files is on line 1277,
      not 1276 as plan.md §1 cites (1276 is need_execution_mode, immediately above) —
      exact off-by-one citation error verified.
  - id: PLAN-ARCH-001
    verdict: confirmed
    reason: >-
      Traced _run_bootstrap_loop: it is a synchronous per-WP for-loop calling
      _apply_ownership_inference, with disk writes deferred to state.pending_writes
      and flushed only later via _flush_frontmatter_writes (line 2752, after the loop
      returns) — a raise-on-first-offense inside the loop would indeed abort before
      reaching subsequent WPs, and spec.md's Acceptance Scenario 4 (line 153) requires
      reporting "the specific offending WP(s)" (plural); plan.md's own §11 test row for
      this scenario uses only a single-offender fixture, so the multi-offender gap the
      finding identifies is real and unaddressed.
  - id: PLAN-ARCH-002
    verdict: confirmed
    reason: >-
      Verified _compute_and_write_lanes signature (tuple[Path | None, LanesManifest |
      None], line 1820/1834), its single call site (line 2342 inside
      _run_commit_pipeline), and that both downstream consumers
      (_scaffold_acceptance_matrix_if_lane_based's guard at line 1951, and
      _collect_finalize_artifacts's guard at line 270) receive their nullable values
      exclusively from that one call — after FR-003 replaces the None-returning guard
      with a raise, neither downstream None-path can execute again via this call chain,
      and plan.md's seam map (§1) and campsite-clean scope (§10) name only the four/five
      touched functions, never these two consumers.
