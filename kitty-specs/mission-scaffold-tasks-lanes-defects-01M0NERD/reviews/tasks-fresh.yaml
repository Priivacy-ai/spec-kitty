findings:
  - id: TASKS-FRESH-001
    lens: "fresh-eyes / structural-fix-plan (Debugger Debbie: divergence-mapping applied to
      the estimate vs. its own cited sources)"
    severity: 3
    title: New "PR Size / Diff Estimate" section's WP01 sub-total is not actually derived
      from the WP's own stated line-count ranges, contradicting the section's stated
      methodology
    evidence:
      - artifact: "tasks.md § PR Size / Diff Estimate — WP01 bullet (lines ~34-40)"
      - artifact: "tasks.md line 27: \"This is that re-count, built from each WP's own
          subtask 'Files' line-count ranges\""
      - artifact: "tasks/WP01-meta-json-commit-fails-loudly.md § Subtask T004 Files line:
          \"tests/core/test_mission_creation_topology.py OR
          tests/specify_cli/core/test_feature_creation.py (whichever already has the
          doc-mission fixtures...)\" — no numeric range stated"
      - artifact: "tasks/WP01-meta-json-commit-fails-loudly.md § Subtask T006 Files line:
          \"extends whichever file T002 used.\" — no numeric range stated"
      - artifact: "tasks/WP01-meta-json-commit-fails-loudly.md § Subtask T005 Files line:
          \"src/specify_cli/core/mission_creation.py (2 lines removed / restructured at
          each of 2 call sites — a small diff)\" — this is exactly 4 lines (2+2), not a
          range"
    claim: >
      tasks.md's new re-count section states it is "built from each WP's own subtask
      'Files' line-count ranges," then for WP01 sums T002 (~40-60) + T003 (~20-30) = 60-90
      test lines but reports a total of "~105-155 test lines," attributing the ~45-65-line
      gap to T004/T006 while explicitly noting those two subtasks carry "no
      separately-stated ranges of their own." That gap figure is invented, not derived from
      any WP01 text — directly contradicting the section's own claimed methodology in the
      same paragraph. The production-line figure has the same pattern: T005's Files line
      states an exact "2 lines removed/restructured at each of 2 call sites" (= 4 lines
      total), but the re-count pads this to "~4-6" with no stated basis. The mission-specific
      review stake calls out exactly this risk — "a wrong sum would itself be a fresh
      finding" — and here the self-verification artifact's own stated derivation method does
      not match its own arithmetic for two of WP01's four listed contributors.
    remediation: >
      Either (a) add explicit line-count ranges to T004 and T006's Files lines in
      tasks/WP01-meta-json-commit-fails-loudly.md so the re-count in tasks.md is genuinely
      "built from" stated ranges, and correct T005's stated 4-line production change to match
      the "~4-6" figure (or tighten the estimate to exactly "4"); or (b) rewrite the
      WP01 bullet in tasks.md to say plainly that the T004/T006 contribution and the
      production padding are the author's own estimate, not derived from the cited WP
      subtask Files lines, so the methodology claim in the section's opening paragraph is
      accurate.

  - id: TASKS-FRESH-002
    lens: "fresh-eyes / red-first correctness (Debugger Debbie: hypothesis-driven
      falsification applied to the newly-rewritten T013 step 2 test-target choice)"
    severity: 4
    title: T013 step 2's new pytest.raises-first instruction offers a "finalize-tasks"
      call-target option that, if placed in the JSON-output test file per that same
      sentence's other option, cannot ever go green
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T013, step 2 (lines
          ~308-317): \"Add a test (in test_mission_finalize_phases.py or the JSON-output
          file, whichever is cleaner for a direct-seam vs full-command assertion) ...
          This test MUST wrap the _compute_and_write_lanes (or finalize-tasks) call in
          pytest.raises(...) and assert on the raised exception FIRST\""
      - code: "tests/tasks/test_finalize_tasks_json_output_unit.py:213,249,280,311,353,396,
          442,474 — all 8 existing call sites use `runner.invoke(app, [\"finalize-tasks\",
          \"--json\"])` and inspect the returned `result`; zero occurrences of
          `pytest.raises` or `catch_exceptions=False` anywhere in this file"
      - code: "tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py — never
          imports or uses `CliRunner`/`runner.invoke`; its established `pytest.raises(...)`
          pattern (e.g. lines 137, 162, 174, 186, 337, 380, 433, 557, 582) always wraps a
          *direct* function call, never a CLI invocation"
    claim: >
      Typer's `CliRunner.invoke()` (used exclusively by this WP's JSON-output test file, per
      the 8 existing call sites, none passing `catch_exceptions=False`) catches any exception
      raised inside the invoked command and stores it on `result.exception` — it does not
      propagate the exception to the caller. If an implementer follows T013 step 2's
      explicit "(or finalize-tasks)" alternative and places the test in
      `test_finalize_tasks_json_output_unit.py` (the file the same sentence names as one of
      the two valid homes, and the only one of the two that this mission's other tests
      actually drive `finalize-tasks` from), wrapping `runner.invoke(app,
      ["finalize-tasks", ...])` in `pytest.raises(...)` will report "DID NOT RAISE" both
      before AND after the FR-003 fix lands, because CliRunner swallows the exception
      regardless of whether `_compute_and_write_lanes` raises internally. That makes the
      test permanently red — never reaching green post-fix — which is the opposite of what
      this same rewrite's step 3 claims ("green after" T016) and the opposite of the
      red-first correctness this specific rewrite (introduced in the current fix round) was
      written to guarantee. The review brief's stake on T013's own internal consistency is
      violated: step 2's offered call-target choice is only safe for one of the two
      file/target combinations it names, and the text does not flag this.
    remediation: >
      Narrow T013 step 2 to require the direct-seam call (`_compute_and_write_lanes`
      wrapped in `pytest.raises(...)`, placed in `test_mission_finalize_phases.py`,
      following that file's own established `pytest.raises(...)`-around-a-direct-call
      pattern) and drop the "(or finalize-tasks)" full-command alternative from the
      `pytest.raises(...)` instruction — or, if a full-command variant in the JSON-output
      file is still wanted, rewrite it to the file's actual convention: invoke via
      `runner.invoke(...)`, then assert `result.exception is not None` (or inspect
      `result.exit_code` / the JSON payload) instead of wrapping the invocation in
      `pytest.raises(...)`.
