findings:
- id: ANALYZE-GOV-001
  lens: terminology-canon
  severity: 3
  title: WP02's own text carries the same stale pre-renumbering subtask citations the draft's ANALYZE-003
    attributes only to tasks.ruling.md
  evidence:
  - artifact: tasks/WP02-ownership-lanes-fail-loudly.md, Validation lines
  - code: kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:247
  - code: kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:273
  - code: kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:293
  - code: kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:315
  - code: kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:364
  - code: kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:388
  - code: 'kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:431
      (T015''s own Validation: "T009, T010, T011''s tests pass")'
  - code: 'kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:474
      (T016''s own Validation: "T012, T013, T014''s tests pass")'
  - artifact: draft analyze-draft-v1.md, ANALYZE-003
  claim: 'The draft report''s ANALYZE-003 says tasks.ruling.md''s "T013/T009" citation for TASKS-FRESH2-001
    is stale relative to the live WP02 text, and concludes explicitly: "a documentation-precision issue
    in the ruling, not a defect in the live WP02 text." Independent verification shows this is inaccurate
    in scope: the live WP02 text carries the identical class of stale, pre-renumbering subtask citation
    in its OWN "Validation" fields, in six places, not one. T009 (line 247: "red before implementation
    (T013), green after"), T010 (line 273) and T011 (line 293) each name T013 as the gate that turns their
    FR-002 tests green — but T013 is itself only a red-first TEST subtask ("Red-first tests — FR-003 `--json`
    failure surfaced + residual-gap test"), not an implementation subtask. The actual FR-002 implementation
    subtask is T015 ("Implement FR-002 — bootstrap contradiction detection + aggregated raise"), whose
    own Validation line (431) correctly states "T009, T010, T011''s tests pass" — confirming T015, not
    T013, is the real gate. Likewise T012 (line 315) and T013 (line 364) name T014 — itself only a red-first
    FR-004 TEST subtask — as their gate, when the real FR-003 implementation subtask is T016 (line 474:
    "T012, T013, T014''s tests pass"). T014 (line 388) names T015 as its gate, but T015 implements FR-002,
    not FR-003/FR-004 — T014''s real gate is also T016. This is the exact same renumbering-drift root
    cause the draft itself proposes for the ruling''s citation (subtasks were inserted/split after an
    earlier numbering pass, shifting later IDs), but it is baked into WP02''s own authored guidance in
    six places, not merely into a review artifact that sits alongside it. WP01''s equivalent Validation
    lines (T002/T003/T004 all correctly cite T005, the true implementation subtask) show this is not how
    the WP prompt template is supposed to read — WP02 alone regressed it, plausibly during its multi-round
    TASKS-FRESH2-001 rework. Practical effect: an implementer or reviewer reading T009-T011''s "green
    after T013" literally would expect those tests to pass once T013 (still a red-first test subtask)
    is done, and be confused when they remain red until T015 actually lands — exactly the "likely to cause
    rework inside one work package" shape of a severity-3 finding.

    '
  remediation: 'In WP02-ownership-lanes-fail-loudly.md, correct the six stale Validation-line citations
    to name the real implementing subtask: T009/T010/T011 (lines 247, 273, 293) should read "green after
    T015" (matching T015''s own line 431 cross-reference), and T012/T013/T014 (lines 315, 364, 388) should
    read "green after T016" (matching T016''s own line 474 cross-reference). While fixing this, also correct
    tasks.ruling.md''s parallel "T013/T009" citation for TASKS-FRESH2-001 (per the draft''s own ANALYZE-003
    remediation) so the ruling and the live WP text agree — do not fix only the ruling and leave WP02''s
    own text carrying the same drift the ruling''s citation was flagged for.

    '
- id: ANALYZE-COVER-001
  lens: Acceptance-criteria / success-criteria coverage
  severity: 2
  title: Draft report never performs an explicit SC-001..SC-005 trace pass; its "9 checks" section stops
    at FR/NFR/C level
  evidence:
  - artifact: spec.md § Success Criteria (SC-001..SC-005, lines 405-434)
  - artifact: analyze-draft-v1.md § '4. Coverage gaps, both directions' (only FR-001..FR-005/NFR-001..004/C-001..005
      rows; no SC-00x row anywhere)
  - artifact: tasks/WP01-meta-json-commit-fails-loudly.md (T002/T003/T004 — SC-001)
  - artifact: tasks/WP02-ownership-lanes-fail-loudly.md (T009/T010/T011 — SC-002; T012 — SC-003; T014
      — SC-004; T016 step 5 — SC-005)
  claim: 'Independently re-tracing spec.md''s Success Criteria section against the WP subtask bodies (not
    trusting the draft''s own claims) shows all five SC-001..SC-005 items do map to a concrete, testable
    WP subtask: SC-001 -> WP01 T002/T003/T004; SC-002 -> WP02 T009/T010/T011; SC-003 -> WP02 T012; SC-004
    -> WP02 T014; SC-005 -> WP02 T016 step 5 (authoritative) plus WP01 T007 step 4 (fast sanity check,
    correctly deferring authority). So the underlying mission artifacts are NOT missing SC coverage. The
    gap is in the draft report itself: its own "9 cross-artifact checks" section (check 4, "Coverage gaps,
    both directions") builds and states its trace matrix entirely at FR/NFR/C-ID granularity and never
    explicitly walks or states SC-level coverage as its own dimension. The only three SC-00x mentions
    in the whole draft (`SC-003`, `SC-005` twice) appear incidentally, folded inside FR-003/FR-005 discussion,
    not as a deliberate SC-by-SC pass with an explicit "clean" statement. A reader relying on the draft
    alone cannot tell whether SC-001/SC-002/SC-004 were checked at all, or simply never considered as
    their own analysis unit distinct from the FR they derive from.

    '
  remediation: 'Add an explicit SC-001..SC-005 coverage sub-check (a short table or list, same style as
    the existing per-FR bullets in check 4) to the draft''s "9 cross-artifact checks" section, citing
    the concrete WP subtask(s) that make each SC testable, and stating the check is clean now that it
    has actually been performed and recorded as its own pass, not implied by the FR-level trace.

    '
- id: ANALYZE-COVER-002
  lens: FR/NFR coverage completeness, both directions
  severity: 3
  title: Draft's "NFR-004 -> covered" claim conflates NFR-004's two distinct scoped guarantees; the wider
    (FR-002-path) guarantee has no dedicated absence-assertion test, only a manual read-the-code step
  evidence:
  - artifact: 'spec.md § NFR-004 (lines 367) — states TWO separate guarantees: (1) for an FR-002 reject,
      ''no lanes.json, no mutated WP frontmatter, and no TasksCompleted (or equivalent completion) event
      may be written or committed''; (2) for an FR-003/FR-004 reject, the guarantee is explicitly ''narrowed''
      to ''lanes.json absent'' only, with frontmatter/event-log mutation an accepted, undocumented-as-absent
      gap.'
  - artifact: 'tasks/WP02-ownership-lanes-fail-loudly.md T013 step 2 (lines 328-358) — the residual-gap
      test is explicitly and only about the FR-003/FR-004 narrowed guarantee: asserts `pytest.raises(...)`
      around `_compute_and_write_lanes`, then ''lanes.json is confirmed absent as a secondary, defense-in-depth
      check'', with an explicit instruction that ''the test''s docstring/comment must state explicitly
      that it does NOT assert frontmatter/event-log absence''.'
  - artifact: tasks/WP02-ownership-lanes-fail-loudly.md T009 (lines 191-247), T010 (lines 249-273), T011
      (lines 275-293) — the FR-002 red-first tests assert only that the run raises and names the offending
      WP ID(s) / that the JSON payload carries the error code; none of the three asserts that lanes.json
      remains absent, that WP frontmatter is unmutated, or that no TasksCompleted event was persisted
      for the FR-002 reject path.
  - artifact: 'tasks/WP02-ownership-lanes-fail-loudly.md T015 step 6 (lines 423-426) — the only check
      tied to the FR-002-path guarantee is a manual instruction: ''Verify this raise fires strictly before
      `_flush_frontmatter_writes` ... and `_run_commit_pipeline` ... confirm by reading the call sequence
      rather than assuming'' — not an automated assertion.'
  - artifact: plan.md lines 118-131 (§5/PLAN-ARCH-001) — argues the FR-002 guarantee holds 'by construction'
      from call ordering, same design-level (not test-level) reasoning style the draft itself already
      accepted as sufficient for NFR-002 in its own ANALYZE-001 finding.
  - artifact: analyze-draft-v1.md § '4. Coverage gaps, both directions', row 'NFR-004 -> WP02's "Pipeline-ordering
      constraint" section plus T013 step 2's residual-gap test — covered.'
  claim: 'The draft''s coverage matrix marks NFR-004 as a single, fully-covered row citing only T013''s
    residual-gap test. That test, by its own explicit instructions, covers only the narrower FR-003/FR-004-path
    guarantee (lanes.json absence, frontmatter/event-log absence explicitly NOT asserted). NFR-004''s
    other, wider guarantee — the FR-002-path triple guarantee (no lanes.json AND no mutated frontmatter
    AND no TasksCompleted event) — has no WP02 subtask that asserts it at all; the only tie to it is T015
    step 6''s instruction to manually "confirm by reading the call sequence," which is not a regression-catching
    test. If a future refactor reorders `_run_bootstrap_loop`''s accumulation/raise relative to `_flush_frontmatter_writes`,
    nothing in this mission''s test suite would catch the regression. The draft treats an analogous "design-reasoning-only,
    no dedicated test" situation (NFR-002) as worth its own low-severity finding (ANALYZE-001), but for
    NFR-004 it instead asserts blanket coverage, without noting that the citation (T013) covers the other
    half of the requirement, and without applying the same scrutiny it applied to NFR-002.

    '
  remediation: 'Split the NFR-004 coverage-matrix row into its two scoped guarantees (FR-002-path triple
    guarantee vs. FR-003/FR-004-path narrowed guarantee) and cite T013 only against the latter. For the
    former, either point to a genuine automated assertion if the analysis missed one, or add a new low/medium-severity
    finding (mirroring ANALYZE-001''s treatment of NFR-002) recommending WP02 extend one of T009/T010''s
    tests to assert `lanes.json` remains absent, the touched WP''s frontmatter file is byte-unchanged,
    and no new `TasksCompleted` event was appended to `status.events.jsonl` after an FR-002 aggregated
    raise — rather than relying solely on T015 step 6''s manual code-reading confirmation.

    '
