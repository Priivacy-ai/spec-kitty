findings:
  - id: PLAN-VERIFY-001
    lens: mission-specific (gate-set factual audit, adversarial) / revert discipline
    severity: 4
    title: >-
      §11's FR-002 Acceptance-Scenario-3 row overstates what
      test_finalize_tasks_explicit_empty_owned_files.py actually locks
    evidence:
      - artifact: "plan.md §11, FR-002 row \"planning-artifact escape hatch unaffected, Acceptance Scenario 3\""
      - code: "tests/specify_cli/cli/commands/test_finalize_tasks_explicit_empty_owned_files.py:1-55"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1264 (_apply_ownership_inference)"
    claim: >-
      Plan §11 states test_finalize_tasks_explicit_empty_owned_files.py "already exists
      and already locks this exact behavior" for User Story 2 / Acceptance Scenario 3
      (a WP with execution_mode: planning_artifact and explicit owned_files: [] must
      still be accepted after FR-002 lands). Read directly, that file's six tests
      (test_explicit_empty_list_detected, test_explicit_empty_list_with_padding_detected,
      test_absent_owned_files_returns_false, test_populated_owned_files_returns_false,
      test_no_frontmatter_returns_false, test_body_mention_of_empty_list_ignored) call
      only the pure string/YAML-detection helper _owned_files_yaml_is_explicit_empty_list.
      None of them construct a WPMetadata, set execution_mode, or call
      _apply_ownership_inference — the actual function FR-002's reject is being added to
      (plan.md §1's own seam map, mission_finalize.py:1264). The file locks the helper's
      detection logic, not the acceptance-scenario behavior (that _apply_ownership_inference
      still skips inference for execution_mode="planning_artifact" + explicit []). If FR-002's
      implementation accidentally over-broadens the reject to cover planning_artifact WPs too
      (a real regression risk since both share the same owned_files_explicitly_empty signal),
      this file's existing tests would not catch it — they never touch execution_mode.
    remediation: >-
      Correct the FR-002/AC3 row to state plainly that
      test_finalize_tasks_explicit_empty_owned_files.py locks only the
      _owned_files_yaml_is_explicit_empty_list helper (useful as a supporting regression
      check, not a substitute), and that the actual AC3 coverage must be a new direct-seam
      test in test_mission_finalize_phases.py — following the same pattern as the existing
      test_apply_ownership_inference_skips_when_present (line 487) but with
      execution_mode="planning_artifact" and an explicit-empty-list raw body — asserting
      _apply_ownership_inference does NOT raise and does not populate owned_files. Do not
      let the implementing WP treat the existing file's green tests as AC3 coverage.

  - id: PLAN-VERIFY-002
    lens: mission-specific (gate-set factual audit, adversarial) / revert discipline
    severity: 2
    title: >-
      §11 proposes test_mission_finalize_tasks.py as a possible JSON-payload test home;
      the file's own docstring rules this out
    evidence:
      - artifact: "plan.md §11, FR-002 \"JSON payload\" row and FR-003 \"--json failure surfaced\" row"
      - code: "tests/specify_cli/cli/commands/agent/test_mission_finalize_tasks.py:1-19"
    claim: >-
      Plan §11 twice offers tests/specify_cli/cli/commands/agent/test_mission_finalize_tasks.py
      as a candidate home for --json payload-shape assertions ("if that is where --json
      payload-shape assertions already live"; "if it drives the full --json CLI path").
      The file's own module docstring states the opposite: "We focus on the resolver
      itself rather than driving the full finalize-tasks Typer command — the full command
      has a heavy dependency surface ... The integration test in
      tests/integration/test_mission_close.py exercises the full pipeline." The file's 20+
      tests are entirely about _resolve_planning_branch()/target-branch resolution (WP07/
      FR-012/SC-04, issue #1348) — zero json_output/--json assertions exist in it. This is
      PR #3666's subsystem (confirmed live via `gh pr diff 3666`), not FR-002/FR-003's.
      grep also shows tests/integration/test_mission_close.py — the file this docstring
      names as the real full-pipeline test — has no json_output assertions either, so no
      existing file currently covers the --json payload path the plan needs tested.
    remediation: >-
      Drop test_mission_finalize_tasks.py as a candidate for the FR-002/FR-003 JSON-payload
      tests (its own docstring says it deliberately does not drive the full Typer command);
      point instead at tests/integration/test_mission_close.py as the closest existing
      full-pipeline harness to extend, or state plainly that a new targeted --json test is
      required with no existing near-home, so the implementing WP does not spend time
      confirming a mismatch a one-line docstring read already answers.

  - id: PLAN-VERIFY-003
    lens: mission-specific (gate-set factual audit, adversarial) — campsite-clean audit
    severity: 2
    title: >-
      §10's "no nesting beyond one level" shape claim is wrong for two of the four
      touched functions
    evidence:
      - artifact: "plan.md §10, Campsite-Clean Scope table"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1475-1519 (_validate_ownership_manifests)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1820-1881 (_compute_and_write_lanes)"
    claim: >-
      Plan §10 describes _validate_ownership_manifests as "3 early-returns on
      validation-result checks, no nesting beyond one level" and _compute_and_write_lanes
      as "1 early-return guard + 2 sequential validation blocks, no nesting beyond one
      level." Reading the actual bodies: _validate_ownership_manifests has
      `for warning in ownership_result.warnings: if not json_output: ...` (for->if, 2
      levels) and, inside `if not ownership_result.passed:`, a nested `if json_output: ...
      else: ... for err in ownership_result.errors: ...` (if->if/else->for, 3 levels
      deep) — not "no nesting beyond one level." _compute_and_write_lanes has the
      structurally identical pattern around `if not glob_result.passed:` (if->if->for, 3
      levels) and a separate `if not json_output: ... if lanes_manifest.collapse_report
      and ...: ...` (if->if, 2 levels). Also, only 1 of the "3 early-returns" claimed for
      _validate_ownership_manifests is an actual bare `return` (line 1484); the other two
      exit paths are `raise typer.Exit(1) from None`, not returns. The line-range and
      overall complexity-ceiling conclusion (§10's headline "no campsite-clean WP
      warranted") independently checks out against the actual line ranges (verified
      exact: 1264-1295, 1475-1519, 1820-1881, 335-358) and a rough complexity estimate in
      the 6-9 range is plausible even with this nesting — so the bottom-line action item
      is not disputed. But the specific shape description that action item rests on is
      factually inaccurate, which is exactly the class of "asserted from reading, not
      verified" error this mission's own SK-64 note (same day, cited in plan.md §8) warns
      against repeating.
    remediation: >-
      Correct the shape column for _validate_ownership_manifests and
      _compute_and_write_lanes to reflect the actual nesting (if/for/if-else combinations
      reaching 2-3 levels inside the validation-failure branches) and distinguish the one
      bare `return` from the two `raise typer.Exit(1)` early-exits. The "no campsite-clean
      WP warranted" conclusion can stand on the verified line counts and complexity
      estimate alone; it does not need the incorrect "no nesting beyond one level" claim
      to support it, so remove that specific claim rather than the conclusion.
