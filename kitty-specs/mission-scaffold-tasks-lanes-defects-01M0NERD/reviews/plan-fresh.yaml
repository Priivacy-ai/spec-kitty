findings:
  - id: PLAN-FRESH-001
    lens: fresh-eyes / test-design consistency
    severity: 4
    title: "§11's primary FR-002 'reject at bootstrap' test row still asserts _apply_ownership_inference raises directly, contradicting the collect-all-then-raise-once design §1/PLAN-ARCH-001 explicitly adopted this fix round"
    evidence:
      - artifact: "plan.md § 1 (line 80), 'the design above intentionally adopts option (a), collect-all-offenders-then-raise-once' (line 103-125, PLAN-ARCH-001)"
      - artifact: "plan.md § 11, FR-002 'reject at bootstrap' row, line 541"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1264 (_apply_ownership_inference), :1298 (_run_bootstrap_loop), :1365 (call site)"
    claim: >
      §1's seam-map row for FR-002 (line 80) and the PLAN-ARCH-001 resolution (lines 103-125)
      explicitly redesign the reject so that `_apply_ownership_inference` does NOT raise
      immediately — it "returns a contradiction descriptor (WP ID + message) to its caller."
      `_run_bootstrap_loop` accumulates every descriptor into `state.ownership_contradictions`
      across its `for wp_file in wp_files:` loop and raises exactly once, after the loop
      finishes, still inside `_run_bootstrap_loop`. This is stated twice in §1 and restated in
      §5 as the load-bearing mechanism that preserves NFR-004.

      §11's FR-002 "reject at bootstrap" row (line 541) was NOT updated to match: its
      Assertion column reads "Assert `_apply_ownership_inference` (... or the finalize-tasks
      run it's part of) raises," and its Home-file guidance directs the implementer to
      "extend with a sibling test using the same direct-call pattern" as the existing
      `test_apply_ownership_inference_skips_when_present` (a test that calls
      `seam._apply_ownership_inference(bld, meta, "body", "001-m", {})` directly, bypassing
      `_run_bootstrap_loop` entirely — verified at
      tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py:487,496). Under
      the adopted design, a direct call to `_apply_ownership_inference` with the
      contradiction fixture will NOT raise — it will return `(changed, [descriptor])` (or
      similar), so a test written per this row's literal guidance will fail against a
      correct implementation, or will silently mislead an implementer into raising directly
      inside `_apply_ownership_inference` (reverting to raise-on-first-offense and defeating
      PLAN-ARCH-001's whole point — the batch-reporting the plan itself says is required by
      spec.md User Story 2's "8 of 8 WPs" motivating scenario).

      The residual inconsistency is not isolated: the adjacent FR-002 "JSON payload" row
      (line 542) also still frames the assertion as "a stable machine-readable field (WP ID +
      error code)" — singular "WP ID," the pre-revision raise-on-first-offense framing — even
      though the same table's separate "batch-report" row (further down, mapped to
      Acceptance Scenario 4) correctly asserts multiple WP IDs are named in one aggregated
      error. §11 was only partially propagated through the collect-all redesign.
    remediation: >
      Rewrite the FR-002 "reject at bootstrap" row's Assertion and Home-file columns to
      target `_run_bootstrap_loop` (or a full `finalize-tasks` invocation) rather than a
      direct call to `_apply_ownership_inference` — e.g. "Assert `_run_bootstrap_loop` (or
      the `finalize-tasks` run it drives) raises once the loop completes, naming the WP ID
      and 'code_change WP declares no owned files'"; if a direct-seam unit test on
      `_apply_ownership_inference` alone is still wanted, retarget its assertion to "returns
      a contradiction descriptor for the WP, does not raise" and add a distinct
      `_run_bootstrap_loop`-level test for the actual raise. Also update the "JSON payload"
      row's language from singular "WP ID" to explicitly allow/require one-or-more WP IDs so
      it does not silently imply single-offender framing.
  - id: PLAN-FRESH-002
    lens: fresh-eyes / seam-map & campsite-clean completeness
    severity: 3
    title: "The 'corrected' 5-changed-call-site / 2-file count (Technical Context, §1 PLAN-ARCH-003, §12) silently omits _run_bootstrap_loop as a distinct touched function, even though §1's own FR-002 design requires modifying its body and adding a new state field"
    evidence:
      - artifact: "plan.md Technical Context line 33 ('5 changed call sites total')"
      - artifact: "plan.md § 1, lines 65-69 ('exactly **5 changed call sites across 2 files** ... plus `_apply_ownership_inference`, `_validate_ownership_manifests`, and `_compute_and_write_lanes` in `mission_finalize.py`')"
      - artifact: "plan.md § 1, line 80 (seam-map row) and lines 103-125 (PLAN-ARCH-001)"
      - artifact: "plan.md § 10, campsite-clean shape table (lines 510-516) — no row for _run_bootstrap_loop"
      - artifact: "plan.md § 12, line 566 ('5 changed call sites across 2 files with an actual diff — corrected count per §1, PLAN-ARCH-003')"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1298-1394 (_run_bootstrap_loop, ~96 lines)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1188 (_BootstrapState dataclass, would gain a new ownership_contradictions field per §1's own design)"
    claim: >
      §1's seam-map row for FR-002 (line 80) names the function pair
      "`_apply_ownership_inference` / `_run_bootstrap_loop`" and its own Change column
      describes a real code change to `_run_bootstrap_loop`'s body: "`_run_bootstrap_loop`'s
      per-WP `for` loop appends every such descriptor to a new `state.ownership_contradictions:
      list[str]` and continues... After the loop finishes... if `state.ownership_contradictions`
      is non-empty, raise **one** aggregated error." That is a distinct diff to
      `_run_bootstrap_loop`'s own body (new accumulation logic plus a new post-loop raise) and,
      per `_BootstrapState`'s definition at mission_finalize.py:1188, likely a new field on that
      dataclass too — not merely a description of how `_apply_ownership_inference`'s changed
      return value manifests.

      Despite that, the explicit recount sentence in §1 (lines 65-69, introduced this fix round
      as "the seam map below is the source of truth, this line now matches it exactly" per
      PLAN-ARCH-003) enumerates only "`_apply_ownership_inference`, `_validate_ownership_manifests`,
      and `_compute_and_write_lanes`" for mission_finalize.py — omitting `_run_bootstrap_loop`
      even though the very next line's table row is titled with both functions. The same
      omission propagates unchanged into the Technical Context line (line 33) and §12's WP-shape
      guidance (line 566), both of which restate "5 changed call sites across 2 files ...
      corrected count per §1, PLAN-ARCH-003."

      §10's campsite-clean / Standing Order #2 check (lines 504-527), which claims to be
      "checked directly against the actual touched functions," never examines
      `_run_bootstrap_loop` at all — no row for it in the shape table (lines 510-516) — even
      though it is a genuinely touched function under §1's own adopted design.
      `_run_bootstrap_loop` is verified at ~96 lines (1298-1394 before the next `def`), already
      larger than any function §10 did examine (32/45/62 lines), containing a `for` loop with a
      `try/except`, a compound `if/else`, a nested `for`, and an `if/elif` — so its own
      complexity was never checked against the ceiling before concluding "no campsite-clean WP
      is warranted."
    remediation: >
      Add `_run_bootstrap_loop` as its own row in §1's seam map (or explicitly fold it into the
      existing FR-002 row's line-count/verified-lines while updating the "exactly 5" language to
      "6 changed call sites" or clarify why it is deliberately not counted separately), update
      the Technical Context line and §12 to match, and add `_run_bootstrap_loop` to §10's
      campsite-clean shape table with its own verified line range, nesting, and rough complexity
      estimate so the "no campsite-clean WP warranted" conclusion is actually checked against
      every function the plan's own design touches.
