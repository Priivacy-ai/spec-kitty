  - id: PLAN-VERIFY-003
    lens: mission-specific (gate-set factual audit, adversarial) — campsite-clean audit
    severity: 2
    title: >-
      §10's "no nesting beyond one level" shape claim is wrong for two of the four
      touched functions
    evidence:
      - artifact: "plan.md §10, Campsite-Clean Scope table"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1475-1519 (_validate_ownership_manifests)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1820-1881 (_compute_and_write_lanes)"
    claim: >-
      Plan §10 describes both functions as "no nesting beyond one level." Reading the
      actual bodies: `_validate_ownership_manifests` has a for->if pattern and a nested
      if->if/else->for pattern (3 levels deep); `_compute_and_write_lanes` has a
      structurally identical if->if->for pattern (3 levels) and a separate if->if (2
      levels). Also only 1 of the "3 early-returns" claimed for
      `_validate_ownership_manifests` is an actual bare `return`; the other two are `raise
      typer.Exit(1) from None`. The line-range and complexity-ceiling conclusion
      independently checks out — the bottom-line "no campsite-clean WP warranted" action
      item is not disputed — but the shape description supporting it is factually
      inaccurate, the same class of "asserted from reading, not verified" error the
      mission's own SK-64 note (cited in plan.md §8) warns against.
    remediation: >-
      Correct the shape column to reflect the actual nesting and distinguish the bare
      `return` from the two `raise typer.Exit(1)` early-exits. The "no campsite-clean WP
      warranted" conclusion can stand on the verified line counts and complexity estimate
      alone; remove the incorrect nesting claim rather than the conclusion.
