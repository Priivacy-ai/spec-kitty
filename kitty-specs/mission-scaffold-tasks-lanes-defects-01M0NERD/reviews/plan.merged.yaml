findings:
  - id: PLAN-GOV-001
    lens: no-new-cli-surface-fidelity (mission-specific)
    severity: 4
    title: "SC-005's grep-based CLI-surface check would miss a new subcommand on any named sub-app"
    evidence:
      - artifact: "plan.md § 4 (No New CLI Surface), lines 147-162"
      - code: "src/specify_cli/cli/commands/decision.py:213 (@decision_app.command(\"open\"))"
      - code: "src/specify_cli/cli/commands/_doctrine_asset.py:125 (@asset_app.command(\"list\"))"
      - code: "src/specify_cli/cli/commands/plugin.py:30 (@plugin_app.command(\"build\"))"
    claim: >
      Plan §4 proposes `git diff <merge-base>...HEAD -- src/specify_cli/ | grep -E
      '^\+.*(@app\.command|@.*\.command\(\))'` as the primary, always-available SC-005
      verification mechanism. The regex's second alternative (`@.*\.command\(\)`) only
      matches a decorator with LITERAL EMPTY parentheses. Verified against this checkout:
      every real sub-app command registration in the codebase (20+ instances across
      src/specify_cli/cli/commands/) passes a name/keyword argument, so none match either
      alternative unless the sub-app variable is literally named `app`. A WP that added
      e.g. `@decision_app.command("rebuild-meta")` would produce a false-clean SC-005
      result for a binding C-001 violation. The plan also under-ranks the better mechanism
      it already names as secondary: `tests/architectural/test_docs_cli_reference_parity.py`
      walks `app.registered_commands` recursively and would actually catch this.
    remediation: >
      Broaden the second regex alternative to match any argument list, and additionally
      grep for new `\.add_typer\(` calls. Better: promote the
      `test_docs_cli_reference_parity.py`-style recursive `registered_commands` walk to the
      PRIMARY SC-005 mechanism, keeping the git-diff grep only as a known-incomplete fast pass.
