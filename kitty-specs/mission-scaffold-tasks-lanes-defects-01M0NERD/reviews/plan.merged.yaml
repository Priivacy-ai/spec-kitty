  - id: PLAN-ARCH-001
    lens: pipeline-ordering position fidelity (mission-specific)
    severity: 3
    title: "FR-002's per-WP immediate-raise design only ever names ONE offending WP per finalize-tasks run, undercutting the mission's own motivating scenario"
    evidence:
      - artifact: "plan.md § 1 (FR-002 seam-placement resolution), § 5 (Pipeline-Ordering Constraint)"
      - artifact: "spec.md § User Story 2 'Why this priority' (line 121-126: '8 of 8 WPs authored this way'), Acceptance Scenario 4 (line 151-155)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1305-1391 (_run_bootstrap_loop's per-WP for-loop calling _apply_ownership_inference synchronously at ~1363)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1264-1295 (_apply_ownership_inference, where the plan places the new raise)"
    claim: >
      The plan places FR-002's reject inside `_apply_ownership_inference`, called once per
      WP from inside `_run_bootstrap_loop`'s synchronous for-loop. A raise there propagates
      immediately out of the loop, so it never reaches subsequent WP files. Traced: no disk
      write happens during the loop itself (writes are deferred to
      `_flush_frontmatter_writes`, called only after the loop returns successfully), so a
      collect-all-then-raise-once design would be exactly as safe for NFR-004's guarantee.
      The plan's actual "raise on first offense" design means a mission with N WPs sharing
      the same mistake — the mission's own motivating "8 of 8 WPs authored this way" case —
      surfaces only the first offender per invocation, forcing repeated fix-and-rerun
      cycles. The plan neither adopts nor explicitly declines batch reporting.
    remediation: >
      Either (a) explicitly adopt collect-all-offenders-then-raise-once inside the per-WP
      loop for the FR-002 check specifically, raising a single aggregated error after the
      loop completes but strictly before `_flush_frontmatter_writes` (preserving NFR-004
      unchanged), plus a test with 2+ WPs sharing the contradiction asserting all are named
      in one run; or (b) if raise-on-first-offense is intentionally kept, say so explicitly
      and note the accepted N-round-trip cost against the mission's own motivating scenario.
  - id: PLAN-ARCH-002
    lens: contracts
    severity: 3
    title: "FR-003's fix makes _compute_and_write_lanes's declared Optional return type permanently misleading and leaves two downstream None-guards dead, unaddressed by the plan's seam map"
    evidence:
      - artifact: "plan.md § 1 (Seam / Module Map, FR-003 row), § 3 (Contracts), § 10 (Campsite-Clean Scope)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1820-1834 (_compute_and_write_lanes signature: `-> tuple[Path | None, LanesManifest | None]`)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1950 (_scaffold_acceptance_matrix_if_lane_based: `if lanes_manifest is None or validate_only: return`)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:270 (_collect_finalize_artifacts: `if lanes_path is not None: candidates.append(lanes_path)`)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:2342-2376 (_run_commit_pipeline: single call site threading the return into both of the above)"
    claim: >
      After FR-003 replaces the line-1834 `return None, None` with a raise, this function
      can never again actually return `(None, None)` — every other path either raises or
      returns two real values. Its only caller feeds the result into two downstream
      functions whose `is None`/`is not None` guards' False-branches become unreachable dead
      code for this call path — most concretely `_scaffold_acceptance_matrix_if_lane_based`'s
      guard at line 1950. The plan's seam map lists only 4 functions and does not mention
      either downstream consumer; §3 asserts no field is added/removed/retyped without
      examining this effective return-contract narrowing; §10 explicitly declines to look
      beyond the four touched functions.
    remediation: >
      Add a line to plan §1 or §3 noting this consequence, and direct the implementing WP
      to either (a) leave the downstream guards as harmless-but-now-unreachable defensive
      code with a short comment, or (b) narrow `_compute_and_write_lanes`'s return
      annotation to `tuple[Path, LanesManifest]` (non-Optional) and simplify the two
      downstream guards accordingly — a decision the plan should make explicitly.
