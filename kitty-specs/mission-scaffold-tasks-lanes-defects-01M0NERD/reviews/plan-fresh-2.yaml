findings:
  - id: PLAN-FRESH2-001
    lens: fresh
    severity: 3
    title: "§7 mischaracterizes PR #3666's touch to _run_bootstrap_loop as 'signature-only' when the live diff also edits the body"
    evidence:
      - artifact: "plan.md § 7 (Sequencing Risk — PR #3666), lines 359-361 and 386-397"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1298-1394 (_run_bootstrap_loop)"
      - code: "gh pr diff 3666 -- hunk `@@ -1361,6 +1428,7 @@` in mission_finalize.py: adds `merge_target_branch=merge_target_branch,` as a new line inside the `_apply_bootstrap_fields(...)` call, which sits inside `_run_bootstrap_loop`'s per-WP `for` loop body, three lines above the `_apply_ownership_inference(...)` call this mission's own FR-002 change must instrument."
    claim: >
      §7 states three times that PR #3666's change to `_run_bootstrap_loop` is
      "signature-only" ("#3666's signature-only change", "_run_bootstrap_loop
      (signature-only: adds a merge_target_branch kwarg threaded through)", and the
      WP-level touch-scope guidance in §7(a) telling implementers that only
      "`_run_bootstrap_loop`'s signature or the `merge_target_branch` kwarg #3666
      threads through it" is #3666's territory, implying the rest of the body is free.
      Verified directly against the live PR diff (`gh pr diff 3666`): PR #3666 does not
      touch only the `def _run_bootstrap_loop(` signature line — it also inserts a new
      line, `merge_target_branch=merge_target_branch,`, inside the loop body, as a new
      keyword argument to the existing `_apply_bootstrap_fields(...)` call — three lines
      above the `_apply_ownership_inference(...)` call site that this mission's own
      FR-002 design (§1) must instrument with new contradiction-accumulation logic. This
      is a real body edit, not a signature-only change, and it lands in the immediate
      vicinity (same loop iteration, adjacent statements) of where this mission's own
      diff must land — a materially sharper rebase chokepoint than "signature vs. body"
      framing conveys, even though §7 already (correctly) flags "same function, not a
      disjoint function set." The WP-level touch-scope instruction — "nothing in
      ...`_run_bootstrap_loop`'s signature or the `merge_target_branch` kwarg #3666
      threads through it... remain #3666's territory" — undersells what "territory" #3666
      actually occupies inside the function body, which could lead an implementer to
      believe their diff is isolated from #3666's when the two changes are adjacent
      statements in the same loop iteration.
    remediation: >
      Correct §7 to state that PR #3666's change to `_run_bootstrap_loop` touches both
      the signature (`merge_target_branch: str | None = None` parameter) and one body
      line (the new `merge_target_branch=merge_target_branch,` argument threaded into the
      `_apply_bootstrap_fields(...)` call inside the loop, immediately preceding the
      `_apply_ownership_inference(...)` call). Update the WP-level touch-scope guidance to
      name that specific call-argument line as also being #3666's territory, and instruct
      the implementer to anchor their new `state.ownership_contradictions` accumulation
      logic strictly after the `_apply_ownership_inference(...)` call return, not to
      reformat or touch the `_apply_bootstrap_fields(...)` call block above it.
  - id: PLAN-FRESH2-002
    lens: fresh
    severity: 3
    title: "§2 still says 'five seam changes' while claiming to already reflect the PLAN-FRESH-002 six-call-site correction"
    evidence:
      - artifact: "plan.md § 2 (Generated Artifacts), line 178-180: \"All five seam changes in §1 are pure function-body edits to already-existing, hand-written source files (corrected per PLAN-FRESH-002 to include `_run_bootstrap_loop`).\""
      - artifact: "plan.md § 1, lines 65-69: \"exactly **6 changed call sites across 2 files**\""
      - artifact: "plan.md § 12, line 612-613: \"6 changed call sites across 2 files with an actual diff\""
    claim: >
      §1 (the seam map, explicitly the source of truth per its own header) and §12 both
      state the corrected count is 6 changed call sites. §2, two sections later, still
      says "five seam changes" — and the parenthetical "(corrected per PLAN-FRESH-002 to
      include `_run_bootstrap_loop`)" implies this number was already updated to reflect
      that correction, but it was not: it remains "five" where the sibling sections say
      "six." This is exactly the class of defect a second edit pass leaves behind — a
      number corrected in the authoritative place (§1) but not propagated to a sibling
      place (§2) that restates the same fact and even claims to have absorbed the fix.
      Contrast with §10 (line 527-530), which performs the equivalent correction
      correctly by switching its framing to "five touched **functions**" (a genuinely
      different, internally-consistent unit of count from "six changed **call
      sites**," since `mission_creation.py`'s two call sites both live inside one
      function, `_create_mission_core_impl`) — §2's occurrence does not make that
      functions-vs-call-sites distinction; it uses "seam changes," which in §1's own
      vocabulary means call sites, and should read "six."
    remediation: >
      Change §2's line 178 from "All five seam changes in §1..." to "All six changed call
      sites in §1..." (or explicitly adopt the functions-vs-call-sites distinction §10
      uses, if "five" is intended to mean distinct functions touched — but then say so
      explicitly rather than calling it "seam changes," which reads as the call-site
      count elsewhere in this document).
  - id: PLAN-FRESH2-003
    lens: fresh
    severity: 3
    title: "_apply_ownership_inference's new return contract for the FR-002 contradiction descriptor is never pinned down, and the two places that touch it disagree on shape"
    evidence:
      - artifact: "plan.md § 1, _apply_ownership_inference row (line 86): \"it returns a contradiction descriptor (WP ID + message) to its caller\" — no tuple shape given"
      - artifact: "plan.md § 11, FR-002 'direct-seam contradiction descriptor' row (line 588): \"(e.g. `(changed, [descriptor])` naming the WP ID)\" — speculates the descriptor rides inside the existing second tuple slot"
      - artifact: "plan.md § 1, _run_bootstrap_loop row (line 87): \"appends every contradiction descriptor returned by `_apply_ownership_inference` to a new `state.ownership_contradictions: list[str]` field\" — implies a distinct, separately-typed value is returned, not folded into an existing list"
      - code: "tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py:496 — `changed, warnings = seam._apply_ownership_inference(bld, meta, \"body\", \"001-m\", {})` — confirms the function's CURRENT signature returns exactly a 2-tuple `(bool, list[str])`"
    claim: >
      Adding a way for `_apply_ownership_inference` to signal "this WP is
      contradictory" to its caller requires a real signature change, since the function
      today returns only `tuple[bool, list[str]]` (verified by the existing direct-call
      test). The plan never specifies what that new return shape is: §11's row 588
      guesses the descriptor is folded into the existing `infer_warnings` list (making
      `(changed, [descriptor])` a 2-tuple, conflating a hard-error contradiction with
      informational inference warnings in the same list), while §1's `_run_bootstrap_loop`
      row talks about the caller "appending... to a new `state.ownership_contradictions`
      field" as though the descriptor is a distinct value the caller can identify and
      route separately from ordinary warnings — a 3-tuple or `Optional[str]` return would
      fit that framing better. §11's row 590 (planning-artifact case) says the function
      should return "no contradiction descriptor (an empty/absent descriptor...)"
      without saying whether "absent" means an empty list slot, `None`, or something
      else. None of these three passages commit to one concrete return-type change, so
      the implementing WP and the person writing the direct-seam tests (§11) could each
      independently guess a different shape and produce inconsistent code/tests requiring
      rework to reconcile — exactly the kind of pre-implementation ambiguity a plan is
      meant to close.
    remediation: >
      Pin down `_apply_ownership_inference`'s new return type explicitly in §1 (e.g.
      "returns `tuple[bool, list[str], str | None]` — the third element is the
      contradiction message when the `code_change` + explicit-empty-`owned_files`
      condition is detected, `None` otherwise; `infer_warnings` is unchanged and does not
      carry contradiction data"), and make §11's FR-002 direct-seam test rows reference
      that exact shape instead of an "e.g." placeholder.
  - id: PLAN-FRESH2-004
    lens: fresh
    severity: 2
    title: "Two guard citations are marked 'verified exact' but quote a single-line compound statement that is actually split across two source lines"
    evidence:
      - artifact: "plan.md § 1, `_validate_ownership_manifests` row (line 88): \"`if not wp_manifests: return` at **1484** (verified exact — matches spec's citation)\""
      - artifact: "plan.md § 1, `_compute_and_write_lanes` row (line 89): \"compound guard `if not (wp_manifests and wp_dependencies): return None, None` at **1834** (verified exact — matches spec's citation)\""
      - artifact: "plan.md § 10, lines 536-537 repeat both quotes verbatim in the campsite-clean table"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1484-1485 — actual source is two lines: `    if not wp_manifests:` then `        return` (not one line)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1834-1835 — actual source is two lines: `    if not (wp_manifests and wp_dependencies):` then `        return None, None` (not one line)"
    claim: >
      Both guards are real and start at the cited line number, and their behavior is
      described correctly, but the literal text quoted in backticks is not an exact
      match for any single line in the file — each guard is a two-line `if:` /
      indented-`return` pair in the actual source, not the single-line compound
      statement the backtick-quoted string implies. This is a small factual slip, but it
      sits inside a document that repeatedly earns trust by labeling citations "verified
      exact" as a distinguishing epistemic claim (contrasted elsewhere with corrections
      like PLAN-VERIFY-001/002/003 that explicitly flag when a prior citation
      overstated what was checked) — an unqualified "verified exact" on a quote that
      does not literally match the source undermines that same standard the document
      otherwise holds itself to.
    remediation: >
      Reformat both quotes to reflect the real two-line shape (e.g. "`if not
      wp_manifests:` / `return` at **1484-1485**") or drop the "verified exact" claim in
      favor of "verified: guard starts at line 1484" if a single-line paraphrase is kept
      for readability.
  - id: PLAN-FRESH2-005
    lens: fresh
    severity: 2
    title: "§9's baseline-red figures for issues #3284/#3283 are attributed to AGENTS.md and SPEC-KITTY-LEDGER.md, but neither document actually names those issues"
    evidence:
      - artifact: "plan.md § 9, line 495-497: \"`main` carries known-red tests (issue #3284, ~23 failures + 2 errors) and a shared test-venv lock that can time out (issue #3283), per AGENTS.md's 'Test-run baseline-red gotcha' and SPEC-KITTY-LEDGER.md's P0 entries.\""
      - artifact: "AGENTS.md's 'Test-run baseline-red gotcha' section (this checkout) names #2736, #2772, #1834 as its example pre-existing-red issues — no mention of #3284 or #3283 anywhere in the file."
      - artifact: "/home/jeroennouws/dev/SK-missions/SPEC-KITTY-LEDGER.md (the sibling ledger this mission's own charter/CLAUDE.md point to) — grep for '3284' and '3283' returns zero hits anywhere in the file, including its one literal 'P0' occurrence (an unrelated entry)."
    claim: >
      The issue numbers and their descriptions ARE real and accurate — confirmed via
      `gh issue view 3284` ("main full suite has 23 untracked failures and 2 errors
      after bootstrap prewarm") and `gh issue view 3283` ("pytest shared test-venv lock
      times out before editable install completes") — so the substance of §9's claim is
      correct. But the stated provenance is not: neither AGENTS.md's baseline-red-gotcha
      section nor SPEC-KITTY-LEDGER.md's "P0 entries" actually documents these two issue
      numbers. AGENTS.md cites a different set of example P0 issues (#2736, #2772,
      #1834), and the ledger doesn't mention #3284/#3283 at all. An implementing WP
      following §9's protocol and going to "SPEC-KITTY-LEDGER.md's P0 entries" for
      background on these two specific issues (as the citation implies it should) will
      not find them there — the real source is GitHub, not either named document.
    remediation: >
      Either cite the GitHub issues directly ("per `gh issue view 3284`/`3283`, verified
      2026-08-22") instead of attributing them to AGENTS.md/the ledger, or add #3284 and
      #3283 to AGENTS.md's baseline-red-gotcha example list / the ledger's P0 section so
      the citation becomes true rather than aspirational.
  - id: PLAN-FRESH2-006
    lens: fresh
    severity: 1
    title: "§10's _run_bootstrap_loop nesting-depth prose claims '3 levels deep in three places' but one of the three listed places is only 2 levels deep"
    evidence:
      - artifact: "plan.md § 10, `_run_bootstrap_loop` row: \"nests up to 3 levels deep in three places: `for`→`try/except`→`if` (unreadable-WP handling), `for`→`if`/`else` (dependency-preservation branch), and `for`→`if`→`if`/`else`+`if` (the write-classification block...)\""
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1341-1345 — the dependency-preservation branch is `for wp_file in wp_files: ... if wps_manifest is None and not parsed_deps and existing_deps: ... else: ...` — a for→if/else structure, i.e. 2 levels deep, not 3."
    claim: >
      The prose asserts the loop "nests up to 3 levels deep in three places" and then
      lists three examples, but the second example (`for`→`if`/`else`, the
      dependency-preservation branch) is only 2 levels deep by the same counting
      convention used for the other two (which are genuinely 3: `for`→`try/except`→`if`,
      and `for`→`if`→`if`/`else`+`if`). This is a self-contradiction within one sentence
      — three named places are offered as evidence for "3 levels deep," but only two of
      the three actually reach 3. It does not affect the section's bottom-line conclusion
      (no campsite-clean WP warranted), which correctly rests on the ruff-verified C901
      complexity numbers (11/15) rather than on this nesting-depth prose.
    remediation: >
      Either drop the dependency-preservation branch from the "3 levels deep" list (it
      illustrates a different point — branching, not depth) or correct the sentence to
      "nests up to 3 levels deep in two places, and 2 levels deep in a third."
