findings:
  - id: ANALYZE-FRESH-001
    lens: self-referential-accuracy / report-vs-source drift
    severity: 3
    title: Draft's ANALYZE-003 finding is now stale — the tasks.ruling.md citation it flags as broken was already corrected by the same fix round that resolved ANALYZE-GOV-001
    evidence:
      - artifact: analyze-draft-v1.md, ANALYZE-003 (frontmatter summary line 15; body lines 47-53)
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/reviews/tasks.ruling.md:34 (live text: '**TASKS-FRESH2-001 (severity 4)** — in WP02's T009: assert')"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/reviews/analyze.confirmed.yaml:53-55 (ANALYZE-GOV-001's own remediation text: 'While fixing this, also correct tasks.ruling.md's parallel \"T013/T009\" citation for TASKS-FRESH2-001 (per the draft's own ANALYZE-003 remediation)')"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/reviews/analyze-verify.yaml:6 ('also fixed tasks.ruling.md's TASKS-FRESH2-001 citation from \"T013/T009\" to \"T009\" as the remediation required')"
    claim: >-
      ANALYZE-003 (still present, unedited, in the current analyze-draft-v1.md) asserts that
      tasks.ruling.md "states the binding remediation for TASKS-FRESH2-001 ... applies 'in WP02's
      T013/T009'" and concludes this is merely "a documentation-precision issue in the ruling, not
      a defect in the live WP02 text," with remediation framed as optional/future work. That quote
      is no longer true: commit 27862b16b (landed as part of fixing the sibling finding
      ANALYZE-GOV-001, whose own remediation text explicitly says it applied "the draft's own
      ANALYZE-003 remediation") already changed tasks.ruling.md line 34 to cite only "T009," not
      "T013/T009." The draft report was revised in this same round to add the new SC-coverage
      sub-check and ANALYZE-004, but ANALYZE-003's stale quote and "none required for mission
      correctness / optionally fix later" framing were left untouched even though the fix already
      landed. A reader trusting the draft's ANALYZE-003 as written would believe the ruling's
      citation is still broken (or optionally-broken-and-unfixed) when it has, in fact, already
      been corrected — the report now misrepresents the live state of an artifact it directly
      quotes.
    remediation: >-
      Update ANALYZE-003 in analyze-draft-v1.md (both the YAML carrier summary and the prose body)
      to state that the tasks.ruling.md citation was corrected by commit 27862b16b as part of the
      ANALYZE-GOV-001 fix, and either remove the finding or re-flag it as "resolved during this
      round" rather than leaving it phrased as a live, unaddressed drift with a now-inaccurate
      quoted citation.

  - id: ANALYZE-FRESH-002
    lens: coverage / success-criteria traceability
    severity: 2
    title: New SC-coverage sub-check's SC-003 row cites only WP02 T012, omitting T013 — where SC-003's own "--json payload reports failure" requirement is actually tested
    evidence:
      - artifact: analyze-draft-v1.md, SC-001..SC-005 coverage table (lines 96-104), SC-003 row = "WP02 T012"
      - artifact: "spec.md § Success Criteria, SC-003 (lines 418-424): '...now causes `_compute_and_write_lanes` to raise a named error in both cases, verified by tests asserting no `lanes.json` is written and `finalize-tasks`' exit code/`--json` payload reports failure, not success.'"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:295-315 (T012: direct-seam `_compute_and_write_lanes` calls only — no `finalize-tasks` CLI invocation, no `--json` payload assertion)"
      - code: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tasks/WP02-ownership-lanes-fail-loudly.md:317-364 (T013 step 1: 'add a failure-path test using the existing `runner.invoke(app, [\"finalize-tasks\", \"--json\"])` pattern ... Assert the payload reports failure')"
      - artifact: "reviews/analyze-refute-1.yaml:11 (an earlier round of this same review explicitly ties 'WP02 T013 line 319' to SC-003, before the final table dropped it)"
    claim: >-
      SC-003's own text requires two distinct things to be verified by tests: (a) `_compute_and_write_lanes`
      raises in both compound-guard-half cases, with `lanes.json` confirmed absent, and (b)
      `finalize-tasks`' exit code/`--json` payload reports failure. WP02 T012 (direct-seam calls to
      `_compute_and_write_lanes`, bypassing the CLI entirely) satisfies (a) but cannot satisfy (b) —
      it never invokes `finalize-tasks` or inspects a `--json` payload. That CLI-level assertion is
      T013 step 1's job (`runner.invoke(app, ["finalize-tasks", "--json"])`, asserting the payload
      reports failure). The draft's new SC-coverage table cites only "WP02 T012" for SC-003, so as
      written the table does not actually justify SC-003's own "clean" verdict — and this is not a
      new observation the squad missed entirely: an earlier round of this same review
      (analyze-refute-1.yaml) explicitly tied T013 to SC-003, but the citation was dropped when the
      table was finalized into the draft.
    remediation: >-
      Change the SC-003 row in the SC-coverage table from "WP02 T012" to "WP02 T012 (raise +
      lanes.json absence, both guard halves) / T013 step 1 (`--json` payload reports failure)" so
      the row actually covers both halves of SC-003's own text, consistent with how the table
      already cites two WP subtasks for SC-005.
