  - id: TASKS-FRESH2-001
    status: resolved
    reason: >
      Verified against source, not the WP text. In
      src/specify_cli/cli/commands/agent/mission_finalize.py's `_run_bootstrap_loop`,
      `state.work_packages.append(...)` (line 1351) is unconditional and runs before
      `_apply_ownership_inference(...)` (line 1365). `state.inmemory_frontmatter[wp_id] =
      updated_meta` is set at line 1372, strictly AFTER that call. T015 step 3
      (WP02-ownership-lanes-fail-loudly.md) anchors the future contradiction `continue`
      "strictly after the `_apply_ownership_inference(...)` call's return" — i.e.
      immediately after the tuple-unpack/warnings-extend that follows line 1365, before
      line 1372. Trace: on revert (a `planning_artifact` WP wrongly flagged as a
      contradiction), the `continue` fires before the loop body reaches line 1372, so
      that WP's entry is never written to `state.inmemory_frontmatter`, and its wp_id
      IS appended to `state.ownership_contradictions` first (T015 step 3: "append it to
      state.ownership_contradictions ... and continue"). Both halves of the new
      assertion therefore flip on the regression: `wp_id in state.inmemory_frontmatter`
      goes False, and `wp_id not in state.ownership_contradictions` goes False (the id
      is present). The old `state.work_packages` check could never go red for this
      regression because that append happens at line 1351, before the contradiction
      check exists at all in the control flow. The rewritten T009 step 4
      (WP02-ownership-lanes-fail-loudly.md lines ~212-235, commit 7244add29) asserts
      exactly `wp_id in state.inmemory_frontmatter` (or owned_files/execution_mode
      preserved) AND `wp_id not in state.ownership_contradictions`, and explicitly
      forbids asserting on `state.work_packages`, matching the ruling's remediation
      verbatim. Resolved.
