findings:
  - id: PLAN-GOV-001
    lens: no-new-cli-surface-fidelity (mission-specific)
    severity: 4
    title: "SC-005's grep-based CLI-surface check would miss a new subcommand on any named sub-app"
    evidence:
      - artifact: "plan.md § 4 (No New CLI Surface), lines 147-162"
      - code: "src/specify_cli/cli/commands/decision.py:213 (@decision_app.command(\"open\"))"
      - code: "src/specify_cli/cli/commands/_doctrine_asset.py:125 (@asset_app.command(\"list\"))"
      - code: "src/specify_cli/cli/commands/plugin.py:30 (@plugin_app.command(\"build\"))"
    claim: >
      Plan §4 proposes `git diff <merge-base>...HEAD -- src/specify_cli/ | grep -E
      '^\+.*(@app\.command|@.*\.command\(\))'` as the primary, always-available SC-005
      verification mechanism. The regex's second alternative (`@.*\.command\(\)`) only
      matches a decorator with LITERAL EMPTY parentheses. Verified against this checkout:
      every real sub-app command registration in the codebase (`@decision_app.command("open")`,
      `@asset_app.command("list")`, `@charter_app.command(...)`, `@sync_app.command("run")`,
      `@plugin_app.command("build")`, `@org_app.command(name="init")`, etc. — 20+ instances
      across src/specify_cli/cli/commands/) passes a name/keyword argument, so none of them
      match either alternative unless the sub-app variable is literally named `app`. A WP
      that added e.g. `@decision_app.command("rebuild-meta")` — functionally identical to the
      explicitly-forbidden `migrate rebuild-meta` D1 names as out of scope — would produce
      "no output" from this grep, i.e. a false-clean SC-005 result, for a binding C-001
      violation. The plan also under-ranks the better mechanism it already names as a
      secondary signal: `tests/architectural/test_docs_cli_reference_parity.py` walks
      `app.registered_commands` recursively (confirmed present, includes nested `add_typer`
      sub-apps) and would actually catch this; the plan calls the flawed grep "primary" and
      that test merely "a second, redundant signal."
    remediation: >
      Broaden the second regex alternative to match any argument list, not only empty parens
      — e.g. `@[A-Za-z_][A-Za-z0-9_]*\.command\(` — and additionally grep for new
      `\.add_typer\(` calls (a wholly new subcommand group). Better: promote the
      `test_docs_cli_reference_parity.py`-style recursive `registered_commands` walk (or an
      equivalent enumerate-before/after-and-diff-the-command-tree test) to the PRIMARY SC-005
      mechanism, with the git-diff grep kept only as a fast, known-incomplete first pass.
  - id: PLAN-GOV-002
    lens: directive-compliance (Standing Order #3, mission tracer files)
    severity: 3
    title: "Plan's own binding FR-002 seam-placement decision was not appended to tracer-design-decisions.md"
    evidence:
      - artifact: "plan.md § 1 (Seam / Module Map), lines 78-94 ('Resolving the FR-002 ambiguity...')"
      - artifact: "kitty-specs/mission-scaffold-tasks-lanes-defects-01M0NERD/tracer-design-decisions.md (30 lines, contains only D1)"
    claim: >
      Charter Standing Order #3 requires tracer files to be "seeded at planning, append[ed]
      during implementation" and states the throughline that "friction and rationale feed
      the next mission" — the whole point is that design rationale is discoverable in the
      lightweight tracer file, not buried in a long planning artifact. Plan.md §1 makes a
      real, debatable design decision at plan-authoring time: where the FR-002 reject
      belongs (`_apply_ownership_inference` in mission_finalize.py vs. `build_wp_manifests`
      in ownership/validation.py), with multi-paragraph rationale (NFR-004 achievability,
      pipeline-ordering, "consumer of already-validated frontmatter, not the authoring-time
      gate"). This is exactly the shape of content D1 already models in
      tracer-design-decisions.md (a binding decision + rationale + evidence). Verified via
      `git status --short`: tracer-design-decisions.md carries no modification since being
      seeded (only tracer-tooling-friction.md and status.events.jsonl show as `M`), so this
      decision currently exists only inside plan.md — if plan.md is later summarized,
      superseded, or not read by a future similar mission, the rationale is lost exactly the
      way the directive exists to prevent.
    remediation: >
      Append a "D2 — FR-002 reject seam placement" entry to tracer-design-decisions.md before
      tasks authoring begins, mirroring D1's format: the decision (`_apply_ownership_inference`,
      not `build_wp_manifests`), a one-paragraph rationale, and a cross-reference to plan.md §1
      for the full argument.
  - id: PLAN-GOV-003
    lens: no-new-cli-surface-fidelity (mission-specific) / citation accuracy
    severity: 1
    title: "Off-by-one line citation for need_owned_files in plan.md §1's seam map"
    evidence:
      - artifact: "plan.md § 1 (Seam / Module Map), row for `_apply_ownership_inference`, line 74"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1277 (need_owned_files = not wp_meta.owned_files and not owned_files_explicitly_empty)"
    claim: >
      Plan.md §1 cites `need_owned_files = not wp_meta.owned_files and not
      owned_files_explicitly_empty` as being at line **1276**. Verified against this
      checkout's HEAD: the actual line is **1277** (line 1276 is
      `need_execution_mode = not wp_meta.execution_mode`, the line immediately above it).
      Every other line citation in §1 (766-768, 792-793, 335, 356, 1264, 1275, 1475, 1484,
      1820, 1834) was independently re-verified and is exact — this is an isolated one-line
      slip, not a pattern, and has no effect on where FR-002's fix actually needs to land
      (the surrounding narrative and the 1275/1264 anchors are correct).
    remediation: >
      Correct "1276" to "1277" in the `_apply_ownership_inference` row of plan.md §1's seam
      table before tasks authoring, so an implementer grepping for the exact line does not
      hit a one-line mismatch (harmless here since the surrounding code is unambiguous, but
      free to fix).
