findings:
  - id: TASKS-SEQ-001
    lens: chokepoints
    severity: 2
    title: WP01's own task file never mentions the mission-loader-coverage CI gate that its diff triggers
    evidence:
      - artifact: "plan.md §8 (\"Gate Set — Concrete, Evidence-Based\"), lines 429-445 and 503-506"
      - artifact: "tasks/WP01-meta-json-commit-fails-loudly.md (full file, 290 lines) — no occurrence of \"mission-loader-coverage\", \"mission_loader\", or \"core_misc\""
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md (full file, 500 lines) — likewise no occurrence (expected: mission_finalize.py sets `cli`/`execution_context`, not `core_misc`, per plan.md §8, so this gate is not live for WP02)"
      - code: "src/specify_cli/core/mission_creation.py — the file WP01 owns, which matches the `core_misc` path filter (`'src/specify_cli/core/**'`) that plan.md §8 confirms triggers the `mission-loader-coverage` job (>=90% floor on src/specify_cli/mission_loader) even though no code under that package is touched"
    claim: >
      plan.md §8 does real, specific analysis establishing that the `mission-loader-coverage`
      CI job (a >=90% coverage floor on `src/specify_cli/mission_loader`) will run on this
      mission's PR, triggered solely by WP01's diff setting the `core_misc` path-filter true
      (mission_creation.py lives under `src/specify_cli/core/**`). Plan.md concludes the floor
      is "held trivially" absent an import-time side effect, and says explicitly this should be
      "state[d] explicitly in the WP validation notes rather than silently assuming it." WP01's
      task file — the only WP whose diff actually triggers this gate — carries none of that:
      T007's "Final validation pass" subtask and the WP's Definition of Done enumerate ruff,
      mypy, the C-005 baseline-red classification, and the SC-005 fast grep pass, but never
      mention mission-loader-coverage, so nobody implementing or reviewing WP01 is told to
      expect this job to run or to record that it held trivially as plan.md instructed. In
      practice the risk is low (WP01's fix is a pure two-line `contextlib.suppress` removal,
      unlikely to touch anything import-adjacent to `mission_loader`), so this is a
      documentation/traceability gap rather than a correctness defect — a chokepoint the plan
      flagged as live for this exact diff quietly failed to survive the plan-to-tasks handoff.
    remediation: >
      Add one line to WP01's T007 ("Final validation pass") and Definition of Done: "Note in
      the validation summary that CI's mission-loader-coverage job will run (triggered via the
      core_misc path filter on this WP's own file) and is expected to hold trivially since no
      lines are added/removed in src/specify_cli/mission_loader — confirm no import-time side
      effect and record the result," mirroring plan.md §8's own instruction. No production-code
      or lane/wps.yaml change needed — this is a tasks.md/WP-file completeness fix only.
