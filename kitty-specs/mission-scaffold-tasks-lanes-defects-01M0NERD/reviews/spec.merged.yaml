findings:
  - id: SPEC-GOV-001
    lens: directive
    severity: 1
    title: D1 blockquote misquotes CONTRIBUTING.md:377, while C-001 quotes it correctly
    evidence:
      - artifact: "spec.md § Clarifications, Decision Record — D1 (lines 28-30)"
      - artifact: "spec.md § Constraints, C-001 (line 351)"
      - code: "CONTRIBUTING.md:377"
    claim: >
      The D1 blockquote (transcribed verbatim from tracer-design-decisions.md) renders
      CONTRIBUTING.md:377 in quotation marks as "PRs without prior agreement will be
      closed." The actual text at CONTRIBUTING.md:377 reads "Pull requests with large
      changes that did not have a prior conversation and agreement will be closed." —
      a paraphrase, not the verbatim sentence the quotation marks imply. The same
      document gets it right two sections later: C-001 quotes the real sentence
      verbatim. The inaccuracy originates in tracer-design-decisions.md (confirmed by
      reading that file directly — it carries the identical paraphrase-in-quotes), so
      spec.md is faithfully transcribing its source rather than introducing a new
      error, which keeps this at nit severity — but a reader who trusts the D1
      blockquote's quotation marks over C-001 walks away with a misquote of a binding
      external policy document.
    remediation: >
      Correct the quoted fragment in D1 (and, for consistency, in
      tracer-design-decisions.md) to the actual CONTRIBUTING.md:377 sentence, or drop
      the quotation marks and paraphrase without implying a verbatim quote — matching
      the accurate quote already present in C-001.
  - id: SPEC-GOV-002
    lens: directive
    severity: 3
    title: FR-003/User Story 3's acceptance criteria test only half of _compute_and_write_lanes's actual short-circuit condition
    evidence:
      - artifact: "spec.md § User Story 3, Acceptance Scenario 1 (lines 188-193)"
      - artifact: "spec.md § Independent Test (lines 178-184)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1820,1836 — def _compute_and_write_lanes(...): ... if not (wp_manifests and wp_dependencies): return None, None"
    claim: >
      FR-003 and every one of User Story 3's acceptance scenarios describe the trigger
      for the silent (None, None) return as "wp_manifests is empty." The actual guard
      in the code (mission_finalize.py:1836) is a compound condition,
      `if not (wp_manifests and wp_dependencies): return None, None` — it also
      short-circuits when wp_dependencies is empty even if wp_manifests is non-empty.
      None of the four acceptance scenarios exercises wp_manifests-non-empty +
      wp_dependencies-empty. In today's call graph this half is hard to trigger in
      practice (dep_resolution.wp_dependencies is populated with an entry per expected
      WP id whenever either wps.yaml or tasks.md is present, and finalize-tasks
      generally requires tasks.md to exist), which is why this is moderate rather than
      high — but the spec, as written, gives an implementer a green light to patch only
      the wp_manifests-empty half of the actual boolean and call FR-003/AC-1 satisfied,
      leaving part of the same silent-success guard (the exact defect class this
      mission exists to close) unaddressed and untested.
    remediation: >
      Either (a) add an acceptance scenario for wp_manifests non-empty AND
      wp_dependencies empty, confirming it also raises rather than returning
      (None, None), or (b) reword FR-003/AC-1 to reference the actual guard expression
      at mission_finalize.py:1836 (`not (wp_manifests and wp_dependencies)`) rather than
      "wp_manifests is empty" alone, so the plan/implementation phase treats the whole
      compound condition as in-scope, not a re-derived subset of it.
  - id: SPEC-ARCH-001
    lens: layering / write-before-validate pipeline ordering (Reflexivity blast-radius check)
    severity: 4
    title: "NFR-004 promises no frontmatter write / no TasksCompleted event on an FR-003 or FR-004 reject, but the current finalize-tasks pipeline performs both side effects strictly before either check runs"
    evidence:
      - artifact: "spec.md § NFR-004 (line 345): \"no lanes.json, no mutated WP frontmatter, and no TasksCompleted (or equivalent completion) event may be written or committed as a side effect of the run that rejected\" — applies to \"the new FR-002/FR-003 reject paths\""
      - artifact: "spec.md § User Story 3, Acceptance Scenario 1-2 (lines 188-198) and SC-003 (line 395-398) — only assert lanes.json absence, not frontmatter/TasksCompleted absence"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:2751-2752 — _flush_frontmatter_writes(state, validate_only=validate_only) is called BEFORE _validate_ownership_manifests (line 2766, FR-004's function) and before _run_commit_pipeline (line 2789, which contains FR-003's _compute_and_write_lanes call at line 2342)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1445-1450 — _flush_frontmatter_writes calls write_frontmatter(wp_file, ...), an actual disk mutation of WP files, gated only on validate_only, not on any later validation outcome"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:2332 — _emit_local_canonical_events(...) (persists WPCreated + TASKS_COMPLETED via specify_cli.status.emit_artifact_phase) is called at the top of _run_commit_pipeline, 10 lines and one bootstrap-seeding call BEFORE _compute_and_write_lanes at line 2342 — i.e. before FR-003's raise point is ever reached"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:2810-2829 — the outer except typer.Exit / except Exception handlers around finalize_tasks call only _revert_unpersisted_target_branch_override (meta.json's target_branch field); there is no revert path for the WP frontmatter files written by _flush_frontmatter_writes or the TasksCompleted event persisted by _emit_local_canonical_events"
    claim: >
      FR-004's check (_validate_ownership_manifests, mission_finalize.py:1475) runs at line 2766,
      strictly after the frontmatter flush at line 2752 that writes every WP's inferred
      execution_mode/owned_files/authoritative_surface to disk. FR-003's check
      (_compute_and_write_lanes, mission_finalize.py:1820) runs inside _run_commit_pipeline
      (line 2789+), which starts by calling _emit_local_canonical_events (line 2332) — persisting
      the TasksCompleted event — a full 10 lines before _compute_and_write_lanes itself is even
      invoked (line 2342). So for both the FR-003 and FR-004 reject paths, by the time the new
      raise fires, the WP frontmatter has already been mutated on disk, and for FR-003 specifically
      the TasksCompleted event has already been persisted — both are exactly the side effects
      NFR-004 says "must not be written... as a side effect of the run that rejected." There is
      no existing revert mechanism for either (the only revert path in the file undoes a
      target_branch meta.json write, unrelated). This is not a hypothetical: it is the current,
      unconditional control flow of finalize_tasks. FR-002's own reject path is fine — it fires
      inside _apply_ownership_inference, which runs during the bootstrap loop strictly before the
      flush (line 2752) — so the NFR is achievable for FR-002 but not, as currently ordered, for
      FR-003/FR-004. The spec bundles all three under one NFR-004 promise without noting this
      asymmetry, and neither the plan-level requirements nor the Acceptance Scenarios for User
      Story 3 test the frontmatter-write or TasksCompleted-event clauses (they test only
      lanes.json absence) — which would let an implementation ship believing NFR-004 is satisfied
      while it silently is not for two of the three side effects it names.
    remediation: >
      Either (a) narrow NFR-004's scope explicitly to state it is guaranteed only for the FR-002
      reject path, and that FR-003/FR-004 rejects may still leave WP-frontmatter writes /
      TasksCompleted events on disk from earlier phases of the same failed run (documenting this
      as a known, accepted gap the way C-003 documents the no-repair-path gap) — or (b) add an
      explicit requirement that the implementing work package reorder
      _run_commit_pipeline/finalize_tasks so _flush_frontmatter_writes and
      _emit_local_canonical_events run only after _validate_ownership_manifests and
      _compute_and_write_lanes have both succeeded (a real, scoped design change, not a side
      effect of "add a raise"), and add Acceptance Scenarios to User Story 3 that assert
      frontmatter-write and TasksCompleted-event absence after an FR-003/FR-004 reject, matching
      what NFR-004 already promises. Whichever direction is chosen, the plan phase must call out
      the interaction with C-002 (PR #3666 touching the same file/functions) since a reorder here
      is exactly the kind of change that raises rebase-conflict risk.
  - id: SPEC-VERIFY-001
    lens: baseline-honesty
    severity: 3
    title: Spec never acknowledges main's pre-existing red tests, risking misattribution by the FR-001..FR-004 test-writing WP(s)
    evidence:
      - artifact: "spec.md § Non-Functional Requirements (NFR-002), § Reflexivity, § User Story 1-3 Acceptance Scenarios"
      - code: "AGENTS.md:150-165 (this checkout's CLAUDE.md) — 'Test-run baseline-red gotcha' section: 'A local or backgrounded pytest run over anything broad will show red that is NOT your change... Only failures that are red on your branch and green on the base are yours to fold.' Cites #2736, #2772, #1834 as known pre-existing P0 reds."
      - code: ".kittify/charter/charter.md:92-99 — Standing Order 9 'Red-main & release discipline': 'A red mainline is an honest signal of a known release-blocking (P0) defect — never green-wash it.'"
    claim: >
      Every Acceptance Scenario across US1-US3 requires new tests that assert exit codes,
      error text, and JSON failure payloads (e.g. US1 AC1/AC2, US2 AC1/AC2/AC4, US3
      AC1/AC2/AC3), and NFR-002 explicitly discusses the ~17,000-test suite's wall-clock
      budget — so the mission plainly anticipates broad test-suite interaction. Yet nothing
      in spec.md acknowledges that `main` in this checkout carries known pre-existing red
      tests (per AGENTS.md's own documented "Test-run baseline-red gotcha", which the
      mission orchestration briefing for this very review repeats verbatim: "main carries
      known pre-existing red tests and a shared test-venv lock that can time out —
      baseline before attributing any red to this spec"). Without that acknowledgment
      surfacing in the spec (its natural home given NFR-002 already discusses suite-wide
      test behavior), a WP implementing FR-001..FR-004 risks either (a) spending effort
      "fixing" red that predates this mission and is out of scope, or (b) wrongly writing
      off a real regression introduced by the new raise/reject paths as "probably
      pre-existing." This is exactly the kind of silent-misattribution risk the mission's
      own charter (Standing Order 9) and CLAUDE.md single out by name.
    remediation: >
      Add a short Constraint (or fold into NFR-002) stating explicitly: "This mission's
      test suite is added against a `main` known to carry pre-existing red tests
      (documented in AGENTS.md's baseline-red gotcha / SPEC-KITTY-LEDGER.md P0 entries);
      before attributing any red observed while implementing/testing FR-001..FR-004 to
      this mission, the implementing WP must confirm the same test is green on the
      merge-base / `upstream/main`." This closes the gap at the point (NFR-002) where the
      spec already reasons about suite-wide test behavior, so a future WP author does not
      have to rediscover the caveat from AGENTS.md on their own.
