findings:
  - id: TASKS-FRESH2-001
    lens: "fresh-eyes / structural-fix-plan (Debugger Debbie: bisection of the exact
      code path T009's new step traverses, to falsify whether the prescribed assertion
      target can actually discriminate the two outcomes it is meant to distinguish)"
    severity: 4
    title: T013/T009's round-2 fix for TASKS-VERIFY-001 tells the implementer to assert
      on `state.work_packages`, a field that is populated identically whether or not the
      WP later trips the FR-002 contradiction — so the new coverage does not actually
      close the gap it was added to close
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T009, step 4 (round-2
          addition): \"call `_run_bootstrap_loop` (or `finalize_tasks --validate-only`...)
          with that fixture and assert the WP is NOT dropped from the run — it is still
          present in the resulting state/manifest, and the run does not fail.\""
      - artifact: "reviews/tasks.confirmed.yaml (round-1 finding TASKS-VERIFY-001)
          remediation: \"...asserts the WP is NOT dropped from `state.work_packages` /
          the run does not fail\" — step 4's wording is this remediation applied
          verbatim, without re-deriving whether `state.work_packages` is a valid signal"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1349-1351 —
          `state.work_packages.append({\"id\": wp_id, ...})` executes unconditionally
          for every readable WP file, BEFORE `_apply_ownership_inference` is called at
          :1365"
      - code: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T015, step 3 (\"Anchor
          this new code strictly after the `_apply_ownership_inference(...)` call's
          return\") — confirms the planned `continue` for a contradiction fires only
          after `state.work_packages.append(...)` has already run"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1367-1372 —
          `state.inmemory_frontmatter[wp_id] = updated_meta` and the
          `modified_wps`/`unchanged_wps`/`updated_count` bookkeeping all execute AFTER
          the `_apply_ownership_inference` call, i.e. exactly where T015's planned
          `continue` would skip them for a contradiction case"
    claim: >
      T009 step 4 was added in round 2 specifically to close TASKS-VERIFY-001 (round 1):
      the seam-only test in step 2 proves `_apply_ownership_inference` returns
      `descriptor=None` for a `planning_artifact` + explicit-`owned_files: []` WP, but
      does not prove the full pipeline "accepts [it] exactly as it is today"
      (spec.md User Story 2 / Acceptance Scenario 3). Step 4 closes that gap by driving
      `_run_bootstrap_loop` and asserting the WP is "still present in the resulting
      state/manifest." But `state.work_packages` (the only "state" field this WP's own
      code plausibly means by that phrase, and the literal field TASKS-VERIFY-001's own
      remediation named) is appended to unconditionally for every WP file BEFORE
      `_apply_ownership_inference` is even called — including WPs that go on to trip the
      FR-002 contradiction and get `continue`d out of the rest of the loop body per T015's
      own planned implementation. A test that only checks `wp_id in state.work_packages`
      would pass identically whether the fix correctly treats `planning_artifact` as
      exempt OR incorrectly (regression) treats it as a contradiction — because both
      outcomes leave the WP's `work_packages` entry intact. The fields that DO
      discriminate (`state.inmemory_frontmatter[wp_id]`, `state.modified_wps` /
      `state.unchanged_wps` / `state.updated_count` — all populated only for WPs that are
      NOT `continue`d away) are never named. As written, step 4 does not actually verify
      AS3's full-pipeline claim any better than step 2 did; it is vacuous with respect to
      the exact regression class it exists to catch.
    remediation: >
      Rewrite T009 step 4's assertion target to name a field that is only populated for
      WPs that pass the ownership-inference/contradiction check without being
      `continue`d — e.g. assert `wp_id in state.inmemory_frontmatter` (or that
      `state.inmemory_frontmatter[wp_id].owned_files == []` and `.execution_mode ==
      "planning_artifact"` are preserved) AND assert `wp_id not in
      state.ownership_contradictions` (the new field T015 adds). Do not rely on
      `state.work_packages`, which is populated before the contradiction check runs and
      therefore cannot distinguish "accepted" from "silently skipped."

  - id: TASKS-FRESH2-002
    lens: "fresh-eyes / red-first correctness (verifying the mission brief's own flagged
      concern directly against the target files rather than accepting the round-2
      report's 'lower risk' framing)"
    severity: 3
    title: T009 step 4's "`_run_bootstrap_loop` (or `finalize_tasks --validate-only`)"
      choice — and T010 step 1's parallel "(or `finalize_tasks` end-to-end)" choice —
      offer an alternative that contradicts this test file's own documented scope
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T009, step 4:
          \"call `_run_bootstrap_loop` (or `finalize_tasks --validate-only`, whichever
          fits this file's existing test conventions — check what's actually
          available)\""
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T010, step 1
          (pre-existing, unchanged by round 2): \"add a test driving `_run_bootstrap_loop`
          (or `finalize_tasks` end-to-end, whichever the file's existing conventions
          favor)\""
      - code: "tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py:1-16
          (module docstring): \"These tests exercise each deterministic helper's branches
          in isolation... The end-to-end command stays pinned by
          `test_mission_finalize_tasks.py`, `test_feature_finalize_bootstrap.py`, the
          validate-only readonly suite, and the WP01 golden harness.\""
      - code: "tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py —
          zero occurrences of `CliRunner`, `runner.invoke`, or a call to `finalize_tasks(`
          anywhere in the file (grep confirmed); every existing test calls a `seam.`-
          prefixed helper directly"
    claim: >
      Both T009 step 4 and T010 step 1 frame `_run_bootstrap_loop` and `finalize_tasks`
      (end-to-end / `--validate-only`) as two options equally available in
      `test_mission_finalize_phases.py`, deferring to "this file's existing test
      conventions" to pick between them. But the file's own module docstring explicitly
      states the opposite: end-to-end `finalize_tasks` coverage is owned by OTHER files
      (`test_mission_finalize_tasks.py` etc.), and this file exists specifically to test
      helpers "in isolation." Consistent with that, the file contains no `CliRunner` or
      `runner.invoke` usage anywhere — there is no existing convention here for invoking
      `finalize_tasks` end-to-end at all, let alone one to defer to. If an implementer
      picks the "finalize_tasks --validate-only"/"finalize_tasks end-to-end" branch of
      either instruction, they would need to introduce CliRunner machinery into a file
      whose own docstring says that's someone else's job — a scope violation this WP is
      otherwise careful about elsewhere (T011 step 1 explicitly cites plan.md's
      PLAN-VERIFY-002 correction to pin which file owns end-to-end `finalize-tasks --json`
      coverage). `_run_bootstrap_loop` is the only option actually consistent with this
      file's documented scope and existing patterns; the "or" framing is misleading.
    remediation: >
      Narrow both T009 step 4 and T010 step 1 to `_run_bootstrap_loop` only, dropping the
      "(or `finalize_tasks`...)" alternative, and add a one-line note (mirroring T011's
      PLAN-VERIFY-002 citation) that `test_mission_finalize_phases.py`'s own docstring
      reserves end-to-end `finalize_tasks` coverage for other files, so this WP's
      full-pipeline assertions belong at the `_run_bootstrap_loop` seam, not via
      CliRunner.

  - id: TASKS-FRESH2-003
    lens: "fresh-eyes / arithmetic honesty (Debugger Debbie: divergence-mapping the
      round-2-added PR Size section's inputs against what round 2 itself changed)"
    severity: 2
    title: T009's "~50-70 new lines" Files-line estimate — one of the six addends
      tasks.md's new PR Size section sums into WP02's test-line total — was left
      unrevised even though round 2 added an entirely new sub-test (step 4) with its own,
      heavier fixture setup
    evidence:
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T009 Files line
          (unchanged by round 2): \"tests/specify_cli/cli/commands/agent/
          test_mission_finalize_phases.py (extend, ~50-70 new lines)\""
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md § Subtask T009, step 4
          (round-2 addition) — a new test requiring a `_run_bootstrap_loop` fixture
          (`wp_files`, `dep_resolution`, `wps_manifest`, `mission_slug`, `repo_root`,
          `target_branch`, `concern_coverage_warnings`, `requirement_extraction_warnings`,
          `validate_only`, `json_output`), materially heavier setup than steps 1-2's
          direct `WPMetadata`-construction calls"
      - artifact: "tasks.md § PR Size / Diff Estimate: \"Test lines: T009 ~50-70 + T010
          ~60-80 + T011 ~30-40 + T012 ~50-60 + T013 ~40-50 + T014 ~50-60 = ~280-360 test
          lines\" — sums T009's stale figure as if it already accounts for step 4"
    claim: >
      tasks.md's new "PR Size / Diff Estimate" section explicitly frames the WP02 test-line
      total as built from "each WP's own subtask 'Files' line-count ranges" (stated figures,
      per the section's own methodology). T009's cited range (~50-70) predates round 2's
      addition of step 4, a materially new test that constructs a full
      `_run_bootstrap_loop` fixture rather than the lighter direct-seam calls steps 1-2
      use. That fixture construction plus the new assertions (see TASKS-FRESH2-001) is
      realistically another 15-30+ lines on top of the original two-test estimate, yet
      T009's Files line was not revisited when step 4 was added, and tasks.md's arithmetic
      (429-589 total) was built by summing the unrevised figure. This does not flip
      plan.md §12's "one PR, fits in one sitting" conclusion (WP02 already dominates the
      total), but it means the section's headline total understates the actual current
      scope of its own cited subtask text, undermining the "stated figures, not
      estimates" framing the section relies on.
    remediation: >
      Re-estimate T009's Files line to include step 4's fixture-construction + assertion
      lines (e.g. "~65-95 new lines" or similar), and re-sum tasks.md's WP02 test-line
      total and combined total to match, so the PR Size section's numbers are actually
      derived from the current subtask text rather than a pre-round-2 snapshot of it.
