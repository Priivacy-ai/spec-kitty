findings:
  - id: SPEC-FRESH-001
    lens: cross-reference-consistency (fresh sweep, post-fix-round)
    severity: 3
    title: SC-003 was not widened when User Story 3 was widened to cover both halves of the compound guard — Success Criteria still describes only the wp_manifests-empty case
    evidence:
      - artifact: "spec.md § User Story 3, Acceptance Scenario 5 (lines 219-225): \"Given a mission where `wp_manifests` is non-empty ... but `wp_dependencies` is empty ... it also raises a named error ... this scenario proves the fix covers the whole compound guard (`not (wp_manifests and wp_dependencies)`), not only the `wp_manifests`-empty half exercised by Acceptance Scenario 1.\""
      - artifact: "spec.md § User Story 3, Independent Test (lines 183-193): explicitly lists fixture (b), wp_manifests non-empty + wp_dependencies empty, as a required independent test alongside (a) and (c)."
      - artifact: "spec.md § Success Criteria, SC-003 (line ~418-421): \"A fixture with an empty ownership-manifest map (whether from FR-002's rejection, or any other cause) now causes `_compute_and_write_lanes` to raise a named error, verified by a test asserting no `lanes.json` is written ... (FR-003)\" — no mention of the wp_dependencies-empty/wp_manifests-non-empty half."
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1834 — if not (wp_manifests and wp_dependencies): return None, None (compound guard, confirmed still present at this line)."
    claim: >
      This fix round widened User Story 3 to cover both halves of _compute_and_write_lanes's
      compound guard (adding Acceptance Scenario 5 and updating the Independent Test to require
      fixture (b): wp_manifests non-empty but wp_dependencies empty). That widening was not
      propagated to SC-003 in the Success Criteria section, which is the section most likely to
      be used as a completion checklist by an implementing/verifying WP. SC-003's prose ("a
      fixture with an empty ownership-manifest map ... whether from FR-002's rejection, or any
      other cause") describes only the wp_manifests-empty trigger and never mentions the
      wp_dependencies-empty-with-wp_manifests-non-empty half that Acceptance Scenario 5 now
      requires. A WP author or reviewer who checks "is FR-003 done" against SC-003 alone — the
      exact anti-pattern the prior review round's SPEC-GOV-002 finding was raised to prevent —
      could conclude the requirement is satisfied by testing only the wp_manifests-empty half,
      leaving the wp_dependencies-empty half unverified by the WP's definition of done even
      though the Acceptance Scenario correctly requires it. This is a genuine gap introduced by
      partial application of the widening fix, not a pre-existing issue (the prior round's
      SPEC-GOV-002 finding was about User Story 3's Acceptance Scenarios/Independent Test only;
      SC-003 was never in scope for that finding and was left behind when the fix was applied).
    remediation: >
      Reword SC-003 to reference the actual compound guard, matching the language already used
      in User Story 3 and its Independent Test, e.g.: "A fixture that trips
      `_compute_and_write_lanes`'s compound guard (`not (wp_manifests and wp_dependencies)`) —
      whether via an empty ownership-manifest map, a non-empty manifest map with an empty
      dependency map, FR-002's rejection, or any other cause — now causes `_compute_and_write_lanes`
      to raise a named error in both cases, verified by tests asserting no `lanes.json` is written
      and `finalize-tasks`' exit code/`--json` payload reports failure, not success. (FR-003)"
findings_count: 1
