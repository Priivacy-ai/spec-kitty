findings:
  - id: TASKS-DECOMP-001
    lens: "PR-sized / single-concern reviewability under single-PR default"
    severity: 3
    title: "Neither tasks.md nor WP01/WP02 independently validates plan.md §12's 'one PR, one sitting' claim, and WP02's own production-diff size goes unquantified unlike WP01's"
    evidence:
      - artifact: "plan.md §12 (Phasing / WP-Shape Guidance), lines 634-643"
      - artifact: "tasks.md (25 lines, no PR-size/reviewability statement anywhere)"
      - artifact: "tasks/WP01-meta-json-commit-fails-loudly.md, 'PR shape' paragraph (line 67-68) and Subtask T005 'Files' line (212-213: 'a small diff')"
      - artifact: "tasks/WP02-ownership-lanes-fail-loudly.md, 'PR shape' paragraph (line 76-77), Subtask T015 'Files' line (376-378: 'a moderate, scoped diff'), Subtask T016 'Files' line (417-420: no size adjective at all)"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1264 (_apply_ownership_inference), :1298 (_run_bootstrap_loop), :1475 (_validate_ownership_manifests), :1820 (_compute_and_write_lanes), :1188 (_BootstrapState) — all four functions plus the dataclass verified present at the cited lines, no drift"
    claim: >
      plan.md §12 explicitly conditions its "single PR, fits in one sitting" judgment on the
      tasks-authoring step re-counting the assembled diff and saying so explicitly in tasks.md
      "if the tasks-authoring agent's own count of the assembled diff disagrees at authoring
      time — if so, say so explicitly in tasks.md rather than silently splitting." Neither
      tasks.md (a 25-line index with no size/reviewability content) nor WP01 nor WP02 records
      any such re-count or explicit agreement/disagreement — both WP files simply restate
      plan.md §12's conclusion verbatim ("this WP lands as part of the single mission PR
      (plan.md §12 — one PR, the diff fits in one sitting)") without independent verification.
      Reconstructing the real scope from the WPs' own per-subtask line estimates: WP01 is
      genuinely small (~4-6 production lines at 2 call sites in one function, plus
      ~105-155 test lines from T002-T004/T006's stated ranges, so WP01 self-quantifies as "a
      small diff" at T005). WP02 is substantially larger: 10 subtasks touching 4 production
      functions plus a new dataclass field in one 2830-line file (mission_finalize.py), with
      T009-T014's own stated test-line ranges summing to ~280-360 new test lines, plus
      production changes to _apply_ownership_inference's return-type/signature,
      _run_bootstrap_loop's loop body and post-loop block, _validate_ownership_manifests's
      short-circuit, and _compute_and_write_lanes's return/raise — plus a conditional, unbounded
      helper extraction if the mandatory post-change complexity re-check (T016 step 4) trips.
      WP02's own T015 calls this "a moderate, scoped diff" but T016 — which contains the
      FR-003 raise, two inline comments, the FR-004 short-circuit removal, AND the
      open-ended possible helper extraction — carries no size characterization at all, in
      contrast to WP01's T005 explicitly self-labeling as "a small diff." Combined, the
      mission's single PR is realistically ~425-580 diff lines across 2 production files (one
      of which, mission_finalize.py, is also mid-rebase-collision with open PR #3666 per
      plan.md §7/tasks WP02's own "Rebase-watch" section) and 5 test files — large enough that
      plan.md itself anticipated the tasks phase might need to flag disagreement, and neither
      the tasks index nor either WP records having done that check.
    remediation: >
      Add a short paragraph to tasks.md (or a shared note referenced by both WP files) stating
      the tasks-authoring step's own assembled-diff estimate (production + test lines, by file)
      and an explicit confirmation that it still agrees with plan.md §12's one-PR-fits-in-one-
      sitting judgment — or, if it does not, say so per plan.md §12's own instruction and
      either split WP02 further (e.g. separate the FR-002 bootstrap-reject subtree, T009-T011
      + T015, from the FR-003/FR-004 subtree, T012-T014 + T016, since they touch disjoint
      functions in the same file with no dependency between them per plan.md's own function
      map) or flag the aggregate size explicitly for the pre-merge reviewer so it is not a
      surprise discovered only at PR-review time. At minimum, give T016 the same size
      characterization WP01's T005 and WP02's T015 already carry, so the WP's own text does not
      read as though its largest and most open-ended subtask (raise + inline comments +
      short-circuit removal + conditional helper extraction) is a trivial edit.
