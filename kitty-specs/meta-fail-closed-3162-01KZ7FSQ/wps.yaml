# Work package manifest — meta-fail-closed-3162-01KZ7FSQ
#
# Transcribed from plan.md (IC-01 … IC-08, the lane assignment, the collision
# matrix, the headroom allocation table and the five atomicity couplings).
# One WP per implementation concern; no concern needed splitting (max 7 subtasks).
#
# Lane map (plan.md "Lane assignment justified by the matrix"):
#   A  WP01              — manifest / both floors / budget allocation (planning_artifact,
#                          runs at the REPOSITORY ROOT; owns one re-runnable measurement script)
#   B  WP02 → WP03 → WP04 — forced union on the routing ledger, 0-net routed
#   C  WP05 → WP06        — bypass/:247 routing then widening + floor re-derivation, +1 routed
#   D  WP07               — #2804, files disjoint from every other lane
#   E  WP08               — terminal integration verify, sweep handshake, DRAFT PR (planning_artifact,
#                          runs at the REPOSITORY ROOT; owns one re-runnable measurement script)
#
# Dependency edges (see plan.md "Dependency graph"):
#   WP01 -> WP02 -> WP03 -> WP04   (lane B is SEQUENTIAL, not three parallel siblings)
#   WP01 -> WP05 -> WP06           (lane C is sequential)
#   WP01 -> WP07                   (WP07 quotes WP01's measurement command VERBATIM;
#                                   zero scheduling cost, unions no lane)
#   WP02..WP07 -> WP08
#
# Lanes B and C are parallel-safe ONLY because of the 0-net routed constraint in
# plan.md's Headroom Allocation table. WP05 is the single allocator of the one net
# routed call (129 → 130). Any other WP moving the count — INCLUDING DOWNWARD, by
# folding rows 10/11's two calls into one — breaks the merged tree in a way no
# single lane's own gate run can see. 126 is RED. The count is closed by TWELVE
# per-site call-count assertions across WP02/WP03/WP04 (exact number of
# load_meta_fail_closed( calls and ZERO load_meta( calls in each routed function),
# not by narrated pre/post prints: a fold reads 128, which is green under all three
# clauses at FLOOR=126/MARGIN=4, and 129 — also green — after WP06 sets 127.
#
# owned_files overlap between WPs joined by a directed dependency path is legal and
# is used deliberately here (src/specify_cli/ownership/validation.py:160-205). The
# routing ledger appears in WP02, WP03 and WP04 because coupling 2 requires every
# routing commit to delete its own row in the SAME commit, and the ledger gates on
# exact equality in both directions. The WP02 → WP03 → WP04 chain is what makes
# that legal. tests/architectural/ is globbed at FILE level, never as a directory.
#
# `spec-kitty agent tasks mark-status` carries NO evidence: it exposes only
# --status/--mission/--auto-commit/--json and its payload is a bare {T0xx: Status}
# (src/specify_cli/status/models.py:481). Each WP names ONE committed evidence
# destination — contracts/ for WP01 and WP08 (plus their committed scripts/ measurement script),
# kitty-specs/<mission>/evidence/WP0N-evidence.md for WP02..WP07 — as a declared out-of-map
# planning write. Nothing load-bearing in /tmp.
#
# Every WP runs from the REPOSITORY ROOT, is started with `spec-kitty implement WP##`
# (`agent action implement` only DISPLAYS the prompt), and carries PYTHONPATH=<workspace>/src
# on any python -c / pytest that could run elsewhere: .venv's editable .pth pins imports
# to the MAIN tree's src/, while SRC_ROOT (test_inline_meta_read_gate.py:61) and _SRC_ROOT
# (test_meta_fail_closed_full_census_contract.py:54) derive from the TEST FILE's own
# location, so a worktree run censuses edited source while asserting against unedited source.

