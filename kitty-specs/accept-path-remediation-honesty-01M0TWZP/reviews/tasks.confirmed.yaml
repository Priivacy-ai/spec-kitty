  claim: 'plan.md''s own baseline-honesty commitment is to the FULL 180-test surface across four directories/files,
    not merely the 3 named SC-005 pins ("any red discovered later belongs to this mission" implies the
    whole surface is the accountability boundary). Yet every WP''s Definition of Done narrows the re-verification
    gate to only the 3 pinned node IDs. Since the full baseline command completes in ~23s (confirmed above)
    and this mission''s own plan.md already scoped exactly these 4 test locations as "the" affected surface
    (not the ~17,000-test full suite the charter otherwise discourages running per-WP), there is no cost
    reason for the narrower gate. As specified, a WP could introduce a regression in one of the other
    177 baseline tests within `tests/specify_cli/acceptance/` or `tests/agent/test_validators_unit.py`
    (both of which WP01-WP04 directly edit) and no WP-level Definition of Done would catch it before the
    mission reaches integration/review — deferring detection later than the WP boundary where charter
    Standing Order 4''s "reproduce RED-FIRST... require live evidence" bites hardest.

    '
  remediation: 'Add one line to each WP''s Definition of Done (at minimum WP04''s, as the mission''s final
    gate before FR-007''s fixture is complete) requiring a full re-run of the exact baseline command named
    in plan.md''s Baseline honesty section (`tests/specify_cli/acceptance/ tests/specify_cli/cli/commands/test_accept_warnings_render.py
    tests/agent/test_validators_unit.py tests/characterization/test_trio_json_envelope.py`) and confirming
    0 failed (with the passed count now >= 180, accounting for WP04''s new test file), not merely the
    3 named pinned node IDs.

    '
- id: TASKS-VERIFY-004
  lens: missing_paths_feature_relative propagation correctness
  severity: 2
  title: WP02's artifact_tokens membership-filter (the defense against a future basename/token collision)
    has no dedicated collision-scenario test anywhere in WP01-WP04
  evidence:
  - artifact: tasks/WP02-stop-double-reporting.md § Context / T006 — 'Rather than comparing basenames/last-path-components
      (which cannot distinguish two future dual-declared tokens sharing a final segment, e.g. a hypothetical
      `docs/contracts` optional artifact vs. an unrelated `api/contracts` declared path)... Structurally
      exclude the placeholder entries first' — describes the membership-filter's defensive purpose in
      detail
  - artifact: 'tasks/WP02-stop-double-reporting.md § Risks — ''Basename-only collision risk avoided by
      design: ... do not simplify to a basename comparison for expedience'' — flags the risk as real but
      names no test that would catch a regression to the simpler (wrong) comparison'
  - artifact: tasks/WP02-stop-double-reporting.md § Subtask T009 — all three revert tests use the single
      `contracts/` dual-declared fixture only; none constructs a synthetic mission with two distinct tokens
      sharing a final path segment
  claim: 'In the only fixture ever tested (`contracts/`, dual-declared, no other missing path in scope),
    a naive basename/full-list comparison (skipping the `artifact_tokens` membership filter entirely)
    would produce the identical pass/fail result as the correct, membership-filtered implementation —
    because there is no second, colliding token present to distinguish the two approaches. This means
    a future refactor that quietly simplifies WP02''s exclusion logic to "just compare `missing_paths_feature_relative`
    entries against `optional_missing` directly" (dropping the `artifact_tokens` recomputation) would
    pass every test named in WP01-WP04 while silently reintroducing the exact collision risk the Risks
    section calls out as something to actively resist.

    '
  remediation: 'Add one additional unit test in WP02 (alongside T006''s or T009''s existing fixtures)
    using a synthetic `MissionConfig` that declares an artifact token and a distinct, non-artifact declared
    path sharing a final path segment (e.g. artifact `docs/contracts` vs. build path `api/contracts`),
    asserting the dedup does NOT cross-match them — directly exercising the `artifact_tokens` membership
    filter''s stated defensive purpose rather than leaving it correct-by-inspection-only.

    '
