- id: PLAN-ARCH-001
  lens: Layering
  severity: 4
  title: Plan's 'No kernel/doctrine coupling' claim is contradicted by acceptance/__init__.py's actual
    imports
  evidence:
  - artifact: 'plan.md § Which seam the change lands on, "No kernel/doctrine coupling" (lines 87-93):
      "None of the four files import from `src/kernel/`, `src/doctrine/`, or `src/mission_loader/`"'
  - artifact: 'plan.md § Summary (lines 19-22): "landing entirely on the CLI/validators/acceptance layer
      with zero kernel or doctrine coupling"'
  - code: src/specify_cli/acceptance/__init__.py:10 (`from kernel.clock import now_utc_stamp`)
  - code: src/specify_cli/acceptance/__init__.py:14 (`from kernel.paths import to_posix`)
  - code: src/specify_cli/acceptance/__init__.py:205 (`basename = to_posix(path).rsplit("/", 1)[-1]`)
      and :1367 (`timestamp = now_utc_stamp()`) — both imports are genuinely used, not dead
  claim: 'The plan states unconditionally, twice (Summary and the "Which seam" section), that none of
    the four touched files import from `src/kernel/`. This is false: one of the four files the plan itself
    lists as touched, `src/specify_cli/acceptance/__init__.py`, imports `kernel.clock.now_utc_stamp` (line
    10) and `kernel.paths.to_posix` (line 14), both resolving to real modules under `src/kernel/` (confirmed:
    `src/kernel/clock.py`, `src/kernel/paths.py` exist and `python3 -c "import kernel; print(kernel.__file__)"`
    resolves to `src/kernel/__init__.py`), and both imports are live call sites, not dead code. Per the
    severity rubric this is a plan claim about existing code that is directly contradicted by the code
    itself — exactly the kind of claim my brief asked me to verify against the actual imports rather than
    trust the plan''s description. It does not change WP2''s specific edit (the mutation logic doesn''t
    add a new kernel import), but it does mean the plan''s own Constitution Check / architectural-alignment
    gate ("no new seam, no kernel/doctrine coupling") rests on a factually wrong premise about the file
    it is editing, which a reviewer trusting the plan''s self-audit would not catch without independently
    grepping the file.

    '
  remediation: 'Correct the "No kernel/doctrine coupling" section (and the Summary''s "zero kernel or
    doctrine coupling" line) to state precisely what is actually true: this mission introduces no NEW
    kernel/doctrine import or read (WP1-4''s edits touch only validators/acceptance-local logic), but
    `acceptance/__init__.py` already imports `kernel.clock.now_utc_stamp` and `kernel.paths.to_posix`
    for pre-existing, unrelated functionality untouched by this mission. Do not claim zero kernel imports
    across the four files when one of them demonstrably has two.

    '
