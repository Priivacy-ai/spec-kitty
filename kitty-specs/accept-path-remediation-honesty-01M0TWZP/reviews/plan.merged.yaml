    to still be correct — and by inspection it likely does still hold here (neither function''s branching/nesting
    is anywhere near the charter''s 15 cyclomatic-complexity ceiling even at the corrected line counts),
    but the plan states line counts as its evidence, not complexity, and two of the six stated line counts
