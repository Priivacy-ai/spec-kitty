      line before build_warnings at :151)
  - code: src/specify_cli/cli/commands/accept.py:453-483 (_print_acceptance_summary — def to blank line
      before _print_acceptance_result at :484)
  claim: 'Plan.md''s Campsite-clean scope section states, as the size evidence backing the "not warranted"
    C-004 conclusion: "evaluate_path_conventions (~20 lines)" and "_print_acceptance_summary (~15 lines)".
    Measured directly against this checkout''s live code: evaluate_path_conventions spans lines 110-147
    of summary_core.py (~38 lines including its docstring), and _print_acceptance_summary spans lines
    453-483 of accept.py (~31 lines). Both are roughly double the plan''s stated figure. (For contrast,
    the other four size claims in the same list were verified accurate: validate_mission_paths ~80 lines
