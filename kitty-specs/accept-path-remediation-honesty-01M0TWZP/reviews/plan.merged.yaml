  remediation: 'Correct the two line-count figures in the Campsite-clean scope section to the measured
    values (evaluate_path_conventions ~38 lines including docstring, _print_acceptance_summary ~31 lines),
    or restate the evidence in terms of cyclomatic complexity/branch count (which does support "not warranted"
