- id: PLAN-ARCH-003
  lens: Contracts
  severity: 3
  title: WP3's proposed format_errors() 'mode-signal boolean parameter' is functionally vacuous — both
    of its call sites always pass the same value
  evidence:
  - artifact: 'plan.md § WP3 (lines 450-456): "format_errors() accepts a mode-signal — a boolean parameter
      (e.g. strict_mode: bool or equivalent) threaded from the caller ... PathValidationError (raised
      only from the strict=True code path in validate_mission_paths) always passes the strict-mode variant
      since it can only be reached when strict."'
  - code: src/specify_cli/validators/paths.py:24 (`message = result.format_errors() or "Path convention
      validation failed."` inside `PathValidationError.__init__`, reached only when `validate_mission_paths(...,
      strict=True)`)
  - code: src/specify_cli/acceptance/summary_core.py:147 (`return [path_result.format_errors() or _PATH_CONVENTIONS_NOT_SATISFIED],
      None`, inside the `if strict_metadata:` branch of `evaluate_path_conventions` — the only other branch,
      `strict_metadata=False`, calls `format_warnings()` instead, never `format_errors()`)
  - code: '`grep -rn ''\.format_errors('' src/` returns exactly these two call sites, both gated on an
      already-true strict condition'
  claim: '`format_errors()` is called in exactly two places in `src/`, and both are reachable only when
    the caller is already in the strict/blocking branch (`strict=True` in `validate_mission_paths`, or
    `strict_metadata=True` in `evaluate_path_conventions`). The plan''s own text admits this ("always
    passes the strict-mode variant since it can only be reached when strict") while simultaneously framing
    the new boolean parameter as conditioning the wording on "the actual mode in effect for this run"
    — implying variable behavior that does not exist anywhere in the current call graph. A parameter whose
    value is a compile-time constant at every call site adds an unreachable/ untested branch (the "false"
    case), which this repo''s own Sonar Expectations (CLAUDE.md: "Do not leave empty or effect-free" constructs;
    every branch needs tests) would flag on review, likely causing rework inside WP3.

    '
  remediation: 'Drop the boolean parameter from WP3''s design. Since `format_errors()` is definitionally
    only ever invoked in the strict/blocking context (that is the entire reason the strict/lenient split
    exists as two separate methods, `format_errors()` vs. `format_warnings()`), the new "--lenient"-pointer
    wording can simply be added unconditionally to `format_errors()`''s existing trailing-prose lines
    — no new parameter, no branch, no risk of an untested code path.

    '
- id: PLAN-ARCH-004
  lens: Contracts
  severity: 3
  title: WP2's pinned token-normalization rule (basename/last-path-component match) is looser than spec.md's
    own suggested comparable-token form and risks false-positive dedup for future dual-declared tokens
  evidence:
  - artifact: 'plan.md § WP2, "Token normalization" (lines 384-395): "compare optional_missing''s bare
      token against Path(missing_path_entry).name (or the last path component) after slash-stripping,
      not full-string equality"'
  - artifact: 'spec.md § Key Entities, `AcceptanceSummary` paragraph (lines 333-340): "WP2 must define
      how they''re reduced to a common, comparable token (e.g. both relative to feature_dir, slash-stripped)"'
  - code: src/specify_cli/acceptance/__init__.py:594 (`missing_optional = [str(p.relative_to(feature_dir))
      for p in optional if not p.exists()]`) — optional_missing's own entries are already feature_dir-relative,
      multi-segment-capable strings, not bare basenames
  claim: 'spec.md''s own suggested normalization ("both relative to feature_dir, slash-stripped") compares
    full feature_dir-relative paths and would correctly distinguish two differently-located dual-declared
    tokens that happen to share a basename (e.g. a future `docs/contracts` optional artifact vs. an unrelated
    `api/contracts` declared path). The plan''s chosen normalization instead compares only the *last path
    segment* (`Path(...).name`), which cannot distinguish those two cases — it would silently drop the
    wrong `missing_optional` entry (or the right one for the wrong reason) if such a collision ever arose.
    For today''s single fixture (`"contracts"`, a single-segment token with no nested path), the two approaches
    happen to produce identical results — verified: `Path("kitty-specs/<slug>/contracts/").name == "contracts"`
    — so this does not break any current test, but it is a strictly weaker comparable-token definition
    than the one spec.md itself modeled, baked into a mechanism that operates generally over the whole
    `optional_missing` list (not hardcoded to the literal string "contracts"), so the risk is latent rather
    than hypothetical for any future mission-type dual declaration.

    '
  remediation: 'Normalize both sides to the feature_dir-relative, slash-stripped form spec.md itself suggests
    (e.g. compute `missing_paths`''s entry relative to `feature_dir` when possible, matching `optional_missing`''s
    own `str(p.relative_to(feature_dir))` shape) rather than basename-only matching — this closes the
    collision risk with no added complexity, since the resolved string is already being computed relative
    to a base elsewhere in WP1''s own fix. If basename matching is kept deliberately for simplicity, say
    so explicitly in WP2''s design and note the scope limit (single-segment `artifacts.optional` tokens
    only) as a documented constraint, not an implicit one.

    '
- id: PLAN-ARCH-005
  lens: Contracts
  severity: 3
  title: WP2 does not pin whether the in-place optional_missing dedup mutation fires only in strict mode
    or unconditionally whenever missing_paths is non-empty
  evidence:
  - artifact: 'plan.md § WP2, "Propagation mechanism" (lines 396-404): describes passing `optional_missing_to_dedup=missing_optional`
      into the existing call site, but does not state whether the in-place mutation is gated on `strict_metadata`'
  - artifact: 'spec.md § User Story 2, Acceptance Scenario 1 (lines 102-110): scoped explicitly to "accept
      runs in default (strict) mode"'
  - artifact: 'spec.md § Edge Cases (lines 236-244): "format_warnings()''s lenient-mode output ... is
      unchanged by this mission"'
  - code: 'src/specify_cli/acceptance/summary_core.py:110-150 (`evaluate_path_conventions`): the function
      has two mutually-exclusive branches after `missing_paths` is confirmed non-empty — `if strict_metadata:
      return [format_errors()...]` vs. the trailing `return [], format_warnings()...` (lenient) — the
      dedup mutation could be placed before that branch (fires in both modes) or inside the strict branch
      only (fires only in strict mode); the plan text is consistent with either placement'
  - code: 'src/specify_cli/acceptance/summary_core.py:151-161 (`build_warnings`): in lenient mode `path_violations`
      is always `[]`, so `missing_optional`''s "Optional artifacts missing: ..." line and the separate
      `path_convention_warning` text would both still fire today for a lenient-mode run on the dual-declared
      fixture — whether WP2''s dedup also collapses that lenient-mode pair is exactly what the plan leaves
      unspecified'
  claim: 'Spec''s own Acceptance Scenario 1 for FR-002 is scoped explicitly to strict mode, and the double-severity
    *contradiction* FR-002 is fixing (non-blocking vs. blocking, "in the same run") is structurally impossible
    in lenient mode — `path_violations` is always empty there, so there is no severity conflict to reconcile,
    only a cosmetic double-mention. The plan''s propagation-mechanism text describes only where the `optional_missing_to_dedup=missing_optional`
    keyword argument is threaded at the call site, not where inside `evaluate_path_conventions` the actual
    list mutation happens relative to the `if strict_metadata:` branch. An implementer could reasonably
    place the mutation before that branch (deduping in both modes, silently changing what lenient-mode''s
    `AcceptanceSummary.warnings` contains for this fixture) or only inside it (matching spec''s literal
    "strict mode" scoping). Neither reading breaks a pinned test today, but the plan gives the WP2 implementer
    no explicit instruction to resolve this, and a reviewer applying spec.md''s Acceptance Scenario 1
    literally would expect the strict-mode-only reading — a mismatch here is exactly the kind of ambiguity
    likely to surface as review pushback and rework inside WP2.

    '
  remediation: 'State explicitly in WP2 whether the dedup mutation fires only inside the `if strict_metadata:`
    branch (matching spec''s literal "default (strict) mode" scoping in Acceptance Scenario 1) or unconditionally
    whenever `missing_paths` is non-empty. Add one Acceptance-Scenario-equivalent test for the lenient-mode
    case on the dual-declared fixture so whichever choice is made is pinned and checkable, not left to
    implementer discretion.

    '
- id: PLAN-VERIFY-001
  lens: Revert discipline / Falsifiability
  severity: 4
  title: WP1 fixes the mkdir suggestion but not the actually-rendered warning/error line — the plan's
    own claim about what format_errors()/format_warnings() consume is factually wrong
  evidence:
  - artifact: plan.md § WP1 — resolved-path correctness (lines 305-349)
  - artifact: 'plan.md § Baseline honesty (lines 333-336): "This changes what value lands in result.missing_paths
      — which suggest_directory_creation and both format_errors()/format_warnings() already consume unmodified,
      so the reporting fix flows through both strict and lenient text for free once the stored string
      is correct."'
  - artifact: 'spec.md § Key Entities (line 290-291, gated PASSED): "FR-001 changes what value gets stored
      in missing_paths/warnings (resolved vs. bare token)"'
  - artifact: 'spec.md § Summary (lines 20-22, gated PASSED): "...reports and builds its mkdir -p remedy
      from the bare declared token..." — names both the report text and the mkdir remedy as separately
      broken'
  - code: src/specify_cli/validators/paths.py:207 — result.missing_paths.append(relative_path)
  - code: 'src/specify_cli/validators/paths.py:208 — result.warnings.append(f"{mission.name} expects {key}
      path: {relative_path} (not found)")  # untouched by the plan; still uses the bare declared token'
  - code: src/specify_cli/validators/paths.py:44-59,61-78 — format_warnings()/format_errors() both render
      self.warnings (and self.suggestions) as their primary content lines; neither method ever reads self.missing_paths
  - code: src/specify_cli/validators/paths.py:81-105 — suggest_directory_creation(result.missing_paths)
      is the ONLY consumer of missing_paths; grep confirms missing_paths has no other production reader
      (acceptance/summary_core.py:144 only checks truthiness)
  - code: src/specify_cli/acceptance/summary_core.py:147-148 — evaluate_path_conventions returns path_result.format_errors()
      (strict) / path_result.format_warnings() (lenient), i.e. the operator-visible text is entirely warnings+suggestions,
      never missing_paths
  claim: 'The plan''s WP1 root-cause analysis and fix direction only describe changing `result.missing_paths.append(relative_path)`
    at paths.py:207. It never mentions the sibling line 208, `result.warnings.append(f"{mission.name}
    expects {key} path: {relative_path} (not found)")`, which is built from the same bare `relative_path`
    token. Verified against the actual code: `format_errors()` and `format_warnings()` — the two methods
    that produce every operator-visible string (console text, `PathValidationError`''s message, and what
    `evaluate_path_conventions` returns as `path_violations`/the lenient warning) — iterate `self.warnings`
    and `self.suggestions`; `self.missing_paths` is never rendered directly anywhere in the codebase (its
    only other reader is `suggest_directory_creation`, which builds `self.suggestions`). So fixing only
    line 207 makes the `mkdir -p` suggestion correct while the primary "{mission.name} expects {key} path:
    {relative_path} (not found)" line — the actual sentence an operator reads first — keeps printing the
    bare declared token forever. spec.md''s own Key Entities section (gated PASSED, binding per this plan''s
    stated commitment not to re-litigate settled decisions) explicitly names both `missing_paths` AND
    `warnings` as needing the fix; the plan''s WP1 section only implements half of that pinned contract,
    and its own "flows through ... for free" claim about what format_errors()/format_warnings() consume
    is directly contradicted by the code. Because WP1''s described revert test only asserts on `.missing_paths`
    and `.suggestions` (never `.warnings` or the full rendered `format_errors()`/`format_warnings()` text),
    an implementation that ships exactly what WP1 describes would pass its own revert test while leaving
    FR-001''s actual defect — the wrong path in the reported message — unfixed. This gap also silently
    undercuts WP3 (the "honest wording" WP): even after WP3''s improved trailing prose, the line immediately
    above it would still assert the wrong (bare-token) location.

    '
  remediation: 'Amend WP1''s fix direction to compute the resolved, reportable string once (as already
    planned) and use it for BOTH result.missing_paths.append(...) (line 207) AND the f-string passed to
    result.warnings.append(...) (line 208) — e.g. by building the resolved string before either append
    call and reusing the local variable in both. Amend WP1''s revert test description to additionally
    assert that PathValidationResult.warnings (or the full format_errors()/format_warnings() rendered
    output) contains the resolved feature_dir-relative string and does NOT contain the bare token, not
    just .missing_paths/.suggestions — otherwise the test cannot falsify the actual defect. Correct the
    false claim in the "Baseline honesty" section (lines 333-336) that format_errors()/format_warnings()
    consume missing_paths — they consume warnings/suggestions.

    '
