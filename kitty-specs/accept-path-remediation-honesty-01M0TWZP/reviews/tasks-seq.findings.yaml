findings:
  - id: TASKS-SEQ-001
    lens: "Deliberate write-scope overlap validity"
    severity: 2
    title: "Test-directory owned_files overlaps across WP01/WP02/WP04 are real but undisclosed in any WP's Risks section"
    evidence:
      - artifact: "wps.yaml WP01 entry (owned_files) and WP02 entry (owned_files)"
      - artifact: "wps.yaml WP04 entry (owned_files: tests/specify_cli/acceptance/test_accept_contracts_path_repro.py)"
      - artifact: "tasks/WP01-resolved-path-correctness.md, Risks section ('owned_files overlap with WP03')"
      - artifact: "tasks/WP02-stop-double-reporting.md, Risks section ('owned_files overlap with WP03')"
      - artifact: "tasks/WP03-honest-remediation-text.md, Risks section ('owned_files overlap with WP01/WP02')"
    claim: >
      wps.yaml declares `tests/specify_cli/acceptance/**` as owned_files for BOTH WP01 and
      WP02, and WP04's single owned file
      (`tests/specify_cli/acceptance/test_accept_contracts_path_repro.py`) also falls inside
      that same glob — a three-way overlap. Separately, `tests/specify_cli/cli/commands/**`
      is owned by both WP02 and WP03. Neither overlap is mentioned anywhere: WP01's Risks
      section names only the `validators/paths.py` overlap with WP03; WP02's names only the
      `accept.py` overlap with WP03; WP03's names only the two src-file overlaps with
      WP01/WP02 (`validators/paths.py`, `accept.py`) but not the `tests/agent/test_validators_unit.py`
      overlap with WP01 or the `tests/specify_cli/cli/commands/**` overlap with WP02. The
      dependency chain (WP01->WP02->WP03->WP04, verified acyclic and matching each WP file's
      own frontmatter `dependencies:`) does make all of these safe in practice — no two WPs
      sharing an owned path are ever concurrent under the runtime's approved/done dependency
      gate — so this is not a functional collision risk. But the mission-derived review
      instruction asks to verify the "deliberate overlap, because the chain is linear" claim
      is actually true and complete; the Risk sections' own accounting of which paths are
      shared is incomplete, so a reviewer relying on those sections alone for the full picture
      of write-scope overlap would miss two of the four actual overlaps.
    remediation: >
      Add the missing overlaps to each WP's Risks section (or add one consolidated note to
      wps.yaml/plan.md listing all owned_files overlaps across WP01-WP04 in one place):
      WP01<->WP02 on `tests/specify_cli/acceptance/**`, WP01<->WP04 and WP02<->WP04 on the
      same glob (WP04's new file falls inside it), and WP02<->WP03 on
      `tests/specify_cli/cli/commands/**` in addition to the already-disclosed
      `accept.py`/`validators/paths.py` src-file overlaps.
