    reason: 'Verified `_missing_artifacts(feature_dir: Path)` (acceptance/__init__.py:585-595) takes no `mission` parameter and never reads `mission.config.artifacts` (confirmed via grep: zero matches for `.config.artifacts` in acceptance/__init__.py or summary_core.py), unlike `validate_mission_paths` (paths.py:170-207) which genuinely reads `mission.config.paths` and cross-references `mission.config.artifacts.{required,optional}` — so spec.md''s Key Entities section attributing missing_optional''s computation to "the functions that read both lists" misdescribes the actual code, and the coincidence (hardcoded "contracts" matching software-dev''s declared token) is confirmed not to generalize to research''s data/ token.'
