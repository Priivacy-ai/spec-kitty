    reason: Verified `format_warnings()` (paths.py:44-59) and `format_errors()` (paths.py:61-78) both render from the same shared `PathValidationResult.warnings`/`.suggestions` fields built once by `validate_mission_paths`, and issue #2330 explicitly complains that "even with --lenient the path-convention warning and the mkdir -p ... suggestion still print" — the exact surface Story 3/FR-005 touches — while spec.md's Edge Cases never explicitly pins format_warnings() output as unchanged.
  - id: SPEC-ARCH-001
