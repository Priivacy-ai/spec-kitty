      - code: ".github/workflows/ci-quality.yml:509 — - 'src/specify_cli/contracts/**'  (the preceding entry in the same governance: block)"
      - code: ".github/workflows/ci-quality.yml:510 — - 'src/specify_cli/validators/**'  (the actual entry being cited)"
    claim: >
