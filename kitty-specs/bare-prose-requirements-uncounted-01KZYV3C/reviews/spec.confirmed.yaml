findings:
  - id: SPEC-GOV-001
    lens: mission-specific (silent-success self-application audit)
    severity: 3
    title: "Story 5 / FR-007's \"ambiguous case, treated as requiring review\" leaves the load-bearing dimension (blocking vs. advisory-visible) unspecified"
    evidence:
      - artifact: "spec.md § User Story 5, Acceptance Scenario 2"
      - artifact: "spec.md § FR-007, § NFR-002"
      - artifact: "spec.md § User Story 1 (title: \"blocked, not merely logged\")"
      - code: "src/runtime/next/runtime_bridge.py:835-864 (_log_requirement_extraction_warnings_safely)"
    claim: >-
      Acceptance Scenario 2 of Story 5 never states whether "requiring review" means the
      ambiguous case (a) blocks spec-kitty next's advance-vs-stay decision the same way a
      confirmed bare-prose finding does, or (b) is merely surfaced as a
      distinguishable-but-non-blocking signal. NFR-002 only requires the result be "not
      indistinguishable from nothing to flag" — it does not require blocking. An implementation
      reading "requiring review" as (b) would satisfy AC2/NFR-002's literal text while
      reintroducing the advisory-only failure this mission exists to close.
    remediation: >-
      In plan.md (or by amending spec.md's Acceptance Scenario 2 directly), state explicitly
      whether an "ambiguous, requires review" classification blocks spec-kitty next's
      advance-vs-stay decision or is a separate, non-blocking-but-visible signal.
    refute_verdict: confirmed
    refute_reason: >-
      spec.md's Story 5 AC2, FR-007 and NFR-002 (read in full) nowhere state whether the
      classification blocks spec-kitty next's decision the same way a confirmed bare-prose
      finding does — the dimension is genuinely unspecified.

  - id: SPEC-GOV-002
    lens: directive (traceability / communication governance) + falsifiability/traceability
    severity: 2
    title: "Broken internal cross-reference: spec.md promises a Clarifications entry on a commit-hash discrepancy that the Clarifications section does not contain"
    evidence:
      - artifact: "spec.md § Context (informative), sentence citing commit `3823f2b00` \"— see Clarifications for the hash discrepancy versus the issue text's `ae7eba9b2`\""
      - artifact: "spec.md § Clarifications — contains exactly one Q&A (the branch-from-#3395 operator decision); no entry addresses a hash discrepancy"
      - code: "git log (this checkout): 3823f2b00 verified ancestor of HEAD; ae7eba9b2 does not resolve to any object in this checkout's history"
    claim: >-
      spec.md's Context section explicitly defers explanation of a stated commit-hash
      discrepancy to the Clarifications section, but that section contains only the single
      2026-08-14 branching-decision Q&A and says nothing about the hash discrepancy. (Raised
      independently by both the gov and verify lens groups — merged here.)
    remediation: >-
      Add the missing Clarifications entry (or fold a one- or two-sentence explanation directly
      into the Context sentence) stating why the two hashes differ — most plausibly that the
      referenced commit was rewritten/rebased between when the GitHub issue text was written and
      when this checkout's branch was created (consistent with C-005's already-disclosed
      rebase-on-#3395-change risk).
    refute_verdict: confirmed
    refute_reason: >-
      Verified via `git cat-file`/`git merge-base`: `3823f2b00` resolves and is an ancestor of
      HEAD; `ae7eba9b2` does not resolve to any object. The Clarifications section, read in
      full, has only one unrelated Q&A.

  - id: SPEC-ARCH-001
    lens: Dead-path-avoidance concreteness (mission-specific)
    severity: 4
    title: "FR-010/NFR-005/Story-3-AC4 require only 'a' teeth test, not one per guard actually wired — permits shipping a reachability proof for one call site while another live call site stays unverified"
    evidence:
      - artifact: "spec.md § FR-010"
      - artifact: "spec.md § NFR-005"
      - artifact: "spec.md § User Story 3, Acceptance Scenario 4"
      - code: "src/runtime/next/runtime_bridge_cores.py:484-489 (_evaluate_tasks_packages_guard, checks _tasks_dir_ready before reading requirement_mapping_failures)"
      - code: "src/runtime/next/runtime_bridge_cores.py:492-504 (_evaluate_tasks_finalize_guard — confirmed: does NOT read requirement_mapping_failures anywhere in its body today)"
      - code: "src/runtime/next/runtime_bridge_cores.py:515-521 (_evaluate_composed_tasks_packages_guard)"
      - code: "src/runtime/next/runtime_bridge_cores.py:524-534 (_evaluate_composed_tasks_terminal_guard)"
      - code: "src/runtime/next/runtime_bridge.py:1594 and :1612 (_check_cli_guards — called directly in the primary spec-kitty next decision loop)"
      - code: "src/runtime/next/runtime_bridge.py:1039-1052 (_check_composed_action_guard, via _dispatch_via_composition)"
    claim: >
      All three guards named in the issue check `_tasks_dir_ready` before reading
      `requirement_mapping_failures`, and the fourth guard the spec says it discovered
      (_evaluate_tasks_finalize_guard) reads `requirement_mapping_failures` nowhere in its body —
      confirmed by direct read. Direct code evidence makes it plausible BOTH the CLI-native and
      composed vocabularies are live for different callers, meaning up to four guard functions
      may need new wiring. FR-010/NFR-005/Story-3-AC4 each demand only a single, unquantified
      teeth test — none require a reversion test PER guard the FR-003 audit identifies as live.
      An implementer can satisfy the letter of all three while leaving a genuinely new wiring
      path unverified, reproducing the "provably inert" failure mode of the reverted
      `_zero_declared_requirement_block` (commit 3823f2b00) one call site over.
    remediation: >
      Amend FR-010 (and mirror in NFR-005 and Story 3's AC4) to require: "for every guard
      function the implementation adds or modifies to read the new signal (as identified by the
      FR-003 vocabulary audit), a reversion ('teeth') test proves that specific guard fails
      closed when the wiring is removed from it."
    refute_verdict: confirmed
    refute_reason: >-
      Read runtime_bridge_cores.py:484-534 directly — confirmed all three named guards gate on
      `_tasks_dir_ready` first and the fourth (`_evaluate_tasks_finalize_guard`) never reads
      `requirement_mapping_failures`; both `_check_cli_guards` and `_check_composed_action_guard`
      are live call sites; spec.md's teeth-test requirements are singular/unquantified as claimed.

  - id: SPEC-ARCH-002
    lens: Layering
    severity: 3
    title: "Spec never states the new detector's classification logic must not violate runtime_bridge_cores.py's documented stdlib-only 'zero-dependency leaf' import boundary, and no automated test currently enforces that boundary"
    evidence:
      - artifact: "spec.md § Key Entities, \"Blocking signal / guard-consumption point\""
      - artifact: "spec.md § FR-001 (\"reusing _requirement_named_sections / find_undeclared_requirement_citations-style scoping\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:1-9 (module docstring: \"Zero-dependency leaf... stdlib, Lane/decision types, and nothing else\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:70-77 (actual import list — stdlib + runtime.next.decision only)"
    claim: >
      runtime_bridge_cores.py documents itself as a stdlib-only pure leaf; no architectural test
      enforces this by construction today. `_requirement_named_sections`/
      `find_undeclared_requirement_citations`, which FR-001 directs reuse of, live in a
      cross-package module. The spec never states the new classifier's computation must stay in
      the residual and be threaded into cores.py only as plain data, rather than via a new
      cross-package import inside cores.py, which would silently break the documented
      zero-dependency-leaf contract with no test to catch it.
    remediation: >
      Add an explicit constraint directing the plan phase to gather any new blocking-detection
      result as plain data threaded through RequirementMappingFacts (or equivalent) into
      runtime_bridge_cores.py, never via a new cross-package import inside that module. Optionally
      direct the plan phase to add an architectural test pinning cores.py's import set.
    refute_verdict: confirmed
    refute_reason: >-
      Module docstring and actual import list confirmed; no tests/architectural/ test references
      runtime_bridge_cores; spec.md never mentions the boundary anywhere in the document.

  - id: SPEC-ARCH-003
    lens: Contracts
    severity: 3
    title: "Spec never states whether the composed/step-contract guard vocabulary is in scope for this mission's wiring, despite that vocabulary being the mission-step-contract execution surface"
    evidence:
      - artifact: "spec.md (whole document — no mention of mission step contracts, StepContractExecutor, or orchestrator-api anywhere)"
      - artifact: "spec.md § FR-009 / Story 6 (covers only the operator-facing \"in-flight missions newly blocked\" framing)"
      - code: "src/runtime/next/runtime_bridge.py:1039-1052 (_check_composed_action_guard delegates to runtime_bridge_composition._check_composed_action_guard)"
      - code: "src/specify_cli/mission_step_contracts/executor.py (StepContractExecutor — confirmed present)"
    claim: >
      The composed guard family that FR-002/FR-003's audit may direct wiring into is reached
      through the mission step-contract execution surface — not merely a second internal code
      path but the surface the charter's Contracts lens names as needing explicit
      preservation/versioning treatment for any behavior change. The spec never states whether
      adding a new failure-message class to guard_failures returned through this surface is also
      a step-contract-schema-relevant or orchestrator-api-relevant change requiring documentation.
    remediation: >
      Add a sentence to FR-009 (or a new Constraint) requiring the plan phase to state explicitly
      whether the composed/step-contract guard vocabulary is in scope, and if so, whether
      mission_step_contracts/ schemas or orchestrator-api docs need a corresponding note.
    refute_verdict: confirmed
    refute_reason: >-
      Confirmed the composed guard path runs through StepContractExecutor; spec.md has zero
      occurrences of "step contract"/"orchestrator-api" anywhere in the document.

  - id: SPEC-VERIFY-001
    lens: corpus-gate falsifiability / bar-setting integrity
    severity: 4
    title: FP-rate acceptance bar deferred to plan phase with no ceiling or forcing function
    evidence:
      - artifact: "spec.md § User Story 4, Acceptance Scenario 3"
      - artifact: "spec.md § FR-006"
      - artifact: "spec.md § C-006"
      - artifact: "spec.md § SC-006"
      - code: "src/specify_cli/requirement_mapping.py:44-53 (docstring recording #3395's 6% figure)"
    claim: >
      Story 4 Scenario 3 says a rate "anywhere near #3395's rejected 6% is presumptively too
      high" but explicitly defers the actual numeric bar to the plan phase. Nothing in spec.md
      gives the plan phase a ceiling it must justify deviation FROM. A plan could set the bar at
      15-20%, write one sentence of justification, and technically satisfy FR-006's letter while
      defeating Story 4's stated purpose — the classic "unfalsifiable success criterion" pattern.
    remediation: >
      Either (a) set the actual numeric ceiling in spec.md itself, or (b) keep the deferral but
      bound it: require that any plan-phase bar above a stated default ceiling (e.g. 2%) carries
      an explicit, evidence-backed justification that is independently reviewed before
      FR-006/C-006 can be considered satisfied.
    refute_verdict: confirmed
    refute_reason: >-
      Story 4 AC3, FR-006, C-006 and SC-006, all read in full, defer the numeric ceiling entirely
      to the plan phase with no default ceiling or forcing function stated anywhere in spec.md.

  - id: SPEC-VERIFY-002
    lens: corpus-gate falsifiability / bar-setting integrity
    severity: 3
    title: Corpus false-positive classification methodology is unspecified and not required to be preserved, risking a repeat of #3395's own lost-measurement failure
    evidence:
      - artifact: "spec.md § User Story 4, Independent Test (\"manually or systematically classifies each as a true or false positive\")"
      - artifact: "spec.md § User Story 4, Acceptance Scenario 4"
      - artifact: "spec.md § FR-005"
      - code: "src/specify_cli/requirement_mapping.py:44-53 (\"the prototype and its measurement were not preserved outside the Op transcript...\")"
    claim: >
      spec.md's own Context section names the exact failure mode it must not repeat. Story 4's
      Independent Test leaves classification method open and Scenario 4 only requires the
      docstring to record the number, corpus size, date, and rationale — not a reproducible
      script or committed procedure. No existing corpus-validation script exists to reuse.
    remediation: >
      Extend FR-005 to require that the corpus-validation procedure itself is committed in-repo
      (script/parametrized test) so the measurement is re-runnable, and require the docstring to
      state whether classification was automated or manual.
    refute_verdict: confirmed
    refute_reason: >-
      FR-005/Story 4 AC4 only require the number/corpus-size/date/rationale in a docstring, not
      a reproducible procedure; requirement_mapping.py's own docstring confirms the prior
      prototype's measurement was lost exactly the way this finding warns of repeating.

  - id: SPEC-VERIFY-003
    lens: silent-success
    severity: 4
    title: "Section-scoping via _is_requirement_heading is structurally blind to the corpus's dominant Constraints heading, leaving C-XXX bare prose undetectable and undetected by Story 4's FP-only corpus validation"
    evidence:
      - artifact: "spec.md § Key Entities (\"Bare-prose requirement candidate: a raw FR-/NFR-/C--shaped token found inside a heading section whose title names 'Requirements'\")"
      - artifact: "spec.md § Edge Cases (names over-match risk and a hypothetical under-match example only, not Constraints)"
      - artifact: "spec.md § User Story 4 Independent Test/Acceptance Scenarios (measures false positives only, never false negatives)"
      - code: "src/specify_cli/requirement_mapping.py:107-109 (_is_requirement_heading: `stripped.startswith(\"#\") and \"requirement\" in stripped.lower()`)"
      - code: "kitty-specs/*/spec.md: 325 of 368 files (~88%) use a `### Constraints` or `## Constraints` heading"
    claim: >
      This mission's own model explicitly includes `C-` ids as a requirement type it must
      protect. But `_is_requirement_heading` only matches headings whose text contains the
      literal substring "requirement" — and the canonical Constraints section heading across the
      real corpus is "### Constraints", which does not contain "requirement." A bare-prose C-XXX
      item under a "### Constraints" heading would never be scoped into any
      `_requirement_named_sections` result at all — not flagged, not warned, not blocked. This is
      the same silent-success shape #3396 exists to fix, recurring one category deeper, and Story
      4's FP-only corpus validation cannot surface this false-negative class.
    remediation: >
      Add an explicit Edge Case / Constraint naming the Constraints-heading gap (cite the ~88%
      corpus figure) and require the plan phase to either broaden the heading-match predicate
      (e.g. also match "constraint") or explicitly narrow FR-001/Key Entities to state that C-XXX
      bare-prose detection is out of scope, with justification. Also extend Story 4's
      corpus-validation methodology to sample for false negatives, not only false positives.
    refute_verdict: confirmed
    refute_reason: >-
      Verified `_is_requirement_heading`'s exact substring-match logic and ran a corpus scan:
      325/368 files (~88%) use a "Constraints" heading that doesn't contain "requirement", and
      Story 4's validation is FP-only as claimed.
