  - id: TASKS-DECOMP-001
    duplicate_of: []
    also_reported_as: [TASKS-SEQ-002]
    lens: "decomposition (descriptions concrete without re-deriving) + write-scopes"
    severity: 4
    title: "WP02/WP06 misidentify test_finalize_provenance_guard.py as the file covering _validate_requirement_mapping; the real coverage file (test_mission_finalize_phases.py) is never mentioned anywhere in the mission"
    evidence:
      - artifact: "tasks.md line 193 (WP02/T012): \"Run the located test files (`test_finalize_provenance_guard.py` and any other file `git grep -l _validate_requirement_mapping tests/` surfaces) unmodified and green.\""
      - artifact: "tasks.md line 481 (WP06/T030): lists `tests/specify_cli/cli/commands/agent/test_finalize_provenance_guard.py` as \"confirmed via `git grep -l _validate_requirement_mapping tests/`\""
      - artifact: "tasks/WP02-campsite-clean-validate-requirement-mapping.md line 116 (T012) and Test Strategy section: \"test_finalize_provenance_guard.py is a known hit\""
      - artifact: "tasks/WP06-finalize-tasks-map-requirements-wiring.md line 97/T030: same file listed as confirmed via the grep"
      - artifact: "tasks.md WP02 \"Independent Test\" (line 173): \"every pre-existing test exercising `_validate_requirement_mapping` (see T030 in WP06 for the located test files) passes unmodified\" — the cross-referenced T030 list is the wrong one"
      - code: "Independently re-run by both R1 sessions: `git grep -l _validate_requirement_mapping tests/` returns ONLY `tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py` (4 call sites, lines 117/129/141/153). `test_finalize_provenance_guard.py` contains zero occurrences of `_validate_requirement_mapping`; its docstring covers an unrelated concern (#3311 re-finalize provenance preservation — `_compute_and_write_lanes`/`_execution_has_begun`)."
      - code: "`test_mission_finalize_phases.py` — the file that actually exercises `_validate_requirement_mapping` — is never referenced anywhere in tasks.md or any tasks/WP*.md file (confirmed via `grep -rn test_mission_finalize_phases kitty-specs/bare-prose-requirements-uncounted-01KZYV3C/`, zero hits)."
    claim: >
      WP02's Independent Test (the behaviour-preservation regression guard for the charter
      Standing Order 2 campsite-clean split of `_validate_requirement_mapping`) and WP06's
      canonical-sources test-location step (T030) both point to
      `test_finalize_provenance_guard.py` as the located, confirmed test file exercising
      `_validate_requirement_mapping`. This is false: that file is unrelated (a different
      mission's provenance-preservation guard test) and contains zero references to the
      function. The one file that genuinely exercises `_validate_requirement_mapping`
      (`test_mission_finalize_phases.py`, 4 call sites) is never named anywhere in the
      mission. An implementer following either WP literally could run/extend the wrong
      file, producing a vacuous "all pre-existing tests still green" regression check for
      the campsite-clean split, and/or misfile WP06's new bare-prose test cases into a
      structurally unrelated file.
    remediation: >
      Replace every reference to `test_finalize_provenance_guard.py` as the located
      `_validate_requirement_mapping` coverage file (tasks.md lines 193 and 481; WP02
      prompt; WP06 prompt) with
      `tests/specify_cli/cli/commands/agent/test_mission_finalize_phases.py`, and add it
      explicitly to WP06's T030 canonical-sources list. Re-run
      `git grep -l _validate_requirement_mapping tests/` at WP02/WP06 implementation time
      and use its live output rather than the copied list in these artifacts.

  - id: TASKS-DECOMP-002
    lens: "decomposition (contradicts existing code)"
    severity: 4
    title: "WP06/T031 falsely claims _validate_requirement_mapping 'already has spec_content in scope'; neither the function nor its caller has it, and the analogous plan_mapping/MappingRequest call site has the same unscoped gap"
    evidence:
      - artifact: "tasks.md line 490 (WP06/T031): \"compute the bare-prose candidates once (already has `spec_content` in scope)\""
      - artifact: "tasks/WP06-finalize-tasks-map-requirements-wiring.md line 108 (T031): \"compute the bare-prose candidates once (the function already has `spec_content` in scope via its callers)\""
      - artifact: "tasks.md/tasks/WP06-*.md T032: \"same predicate call, same field name... added to the returned `MappingPlan`\" — no mention that `plan_mapping` is a documented pure function with no I/O and no `spec_content` field in its input dataclass"
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:621-628 — `_validate_requirement_mapping`'s full parameter list has no `spec_content` parameter."
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1918-1925 — the sole call site passes no `spec_content` argument."
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:343-365 — `_read_spec_requirement_ids` reads `spec_content` locally but returns `tuple[set[str], set[str], list[str]]`, not the raw text; the caller never binds a `spec_content` variable."
      - code: "src/specify_cli/cli/commands/agent/tasks_mapping_core.py:53-75 — `MappingRequest` carries only `spec_all_ids`/`spec_functional_ids`, not raw `spec_content`; `plan_mapping` (line 123) is documented pure/no-I/O (INV-4). The shell (`tasks_map_requirements.py:306`) reads `spec_content` but does not currently pass it into the `MappingRequest(...)` construction at line 356."
    claim: >
      WP06/T031 states as settled fact that `_validate_requirement_mapping` "already has
      spec_content in scope," presented as a reason no extra plumbing is needed before
      calling `find_bare_prose_requirement_ids(spec_content)` inside it. This is false:
      no `spec_content` value exists anywhere in that call chain today. WP02's
      campsite-clean split explicitly requires "same call signature... no behaviour
      change," so the signature-plumbing work WP06 actually needs is real, non-trivial,
      and currently unscoped by any subtask in WP02 or WP06. The parallel
      `tasks_mapping_core.py::plan_mapping` call site (T032) has the identical gap in a
      structurally more consequential form, since `plan_mapping` is architected pure/no-I/O
      and `MappingRequest` has no `spec_content` field.
    remediation: >
      Correct T031: state explicitly that `spec_content` is NOT currently available inside
      `_validate_requirement_mapping` or its caller, and add a subtask (or fold into T031)
      to either (a) change `_read_spec_requirement_ids`'s return type to also yield the raw
      `spec_content` and thread it through to a new parameter, or (b) have the caller
      re-read spec.md once (mirroring the pattern used at
      `_check_bare_prose_requirements_ready` in WP05) and pass the resulting
      `bare_prose_requirement_ids` in as data. For T032, add an explicit subtask to extend
      `MappingRequest` with a `bare_prose_requirement_ids` field and update the
      `MappingRequest(...)` construction call in `tasks_map_requirements.py` (~line 356) to
      populate it from the `spec_content` the shell already reads at line 306 — preserving
      `plan_mapping`'s pure/no-I/O contract.

  - id: TASKS-SEQ-001
    lens: write-scopes
    severity: 4
    title: "WP06 will almost certainly break the CI-enforced byte-frozen map-requirements --json fixture, but tasks.md never declares this file as part of WP06's write scope"
    evidence:
      - artifact: "tasks.md WP06 owned_files / T030 / T032"
      - artifact: "tasks/WP06-finalize-tasks-map-requirements-wiring.md T030, T032"
      - code: "src/specify_cli/cli/commands/agent/tasks_mapping_core.py:93-97 (MappingPlan dataclass — the exact shape T032 instructs adding `bare_prose_requirement_ids` to)"
      - code: "tests/specify_cli/cli/commands/agent/fixtures/tasks_cli/json/byte_contracts.json:140 (`map_requirements_success`), asserted byte-for-byte by tests/specify_cli/cli/commands/agent/test_tasks_json_bytes.py"
      - artifact: "PR #3395 itself already touches `.../fixtures/tasks_cli/json/byte_contracts.json` (2 lines changed) — confirmed via `git diff --stat`"
    claim: >
      Adding `bare_prose_requirement_ids` to the `MappingPlan` dataclass returned by
      `plan_mapping` will change the pinned JSON shape asserted byte-for-byte in
      `map_requirements_success`, breaking `test_tasks_json_bytes.py`'s exact-equality
      check unless the fixture is deliberately re-frozen. Neither the fixture file nor
      `test_tasks_json_bytes.py` appears in WP06's owned_files, T030's canonical-source
      list, WP06's Independent Test, or plan.md's own "Gate Set" section. The
      canonical-sources check tasks.md prescribes (`git grep -l plan_mapping tests/`) will
      not catch this, since the suite drives the CLI via `CliRunner` rather than importing
      `plan_mapping` directly.
    remediation: >
      Add `tests/specify_cli/cli/commands/agent/fixtures/tasks_cli/json/byte_contracts.json`
      and `tests/specify_cli/cli/commands/agent/test_tasks_json_bytes.py` to WP06's
      owned_files and T030's located-test-files list; add an explicit subtask instructing
      the implementer to run `test_tasks_json_bytes.py`, observe the
      `map_requirements_success` byte mismatch once the new field lands, and deliberately
      re-freeze the fixture for that one case.

  - id: TASKS-SEQ-003
    lens: write-scopes
    severity: 3
    title: "The '#3395 overlap is expected' disclosure names only 3 source files and omits the same-name test files #3395 substantially modifies that WP03/WP05/WP06 also touch, plus WP07's touch of requirement_mapping.py"
    evidence:
      - artifact: "tasks.md \"Parallelism & Chokepoints\" § \"#3395 overlap is expected, not a new problem (C-005)\""
      - artifact: "git diff --stat main...origin/op/3394-requirement-citation-scope — #3395 touches tests/specify_cli/test_requirement_mapping.py (+186), tests/next/test_runtime_bridge_unit.py (+216), tests/runtime/test_bridge_cores.py (+39), tests/specify_cli/cli/commands/agent/test_tasks_mapping_core.py (+41)"
      - artifact: "tasks/WP03-bare-prose-predicate.md owned_files: tests/specify_cli/test_requirement_mapping.py"
      - artifact: "tasks/WP05-spec-kitty-next-guard-wiring.md owned_files: tests/runtime/test_bridge_cores.py, tests/next/test_runtime_bridge_unit.py"
      - artifact: "tasks/WP06-finalize-tasks-map-requirements-wiring.md T030: tests/specify_cli/cli/commands/agent/test_tasks_mapping_core.py"
      - artifact: "tasks/WP07-false-negative-sample.md owned_files: src/specify_cli/requirement_mapping.py"
    claim: >
      Overlap with #3395's touched files is expected and already accepted (a
      sequential-base rebase risk per plan.md's "#3395 Churn Risk") — flagged here only
      because tasks.md's disclosure is incomplete, not because the overlap exists. #3395
      touches four test files with substantial content, each also directly touched by this
      mission's own WP03, WP05, or WP06 respectively — a materially higher rebase-conflict
      risk than the additive source-file edits plan.md's "expected... clean rebase"
      reasoning is explicitly scoped to. tasks.md's overlap section names only three
      source files and is silent on this parallel test-file overlap; it also credits only
      WP03 for touching `requirement_mapping.py`, omitting WP07's docstring append to the
      same file.
    remediation: >
      Extend the "#3395 overlap is expected" section to explicitly name the four
      overlapping test files (against WP03/WP05/WP06 respectively) and add WP07 alongside
      WP03 for `requirement_mapping.py`, so the rebase-absorption story is understood to
      cover test-file merge conflicts specifically, not only source-file additive edits.

  - id: TASKS-VERIFY-001
    lens: red-first-stated-per-wp
    severity: 2
    title: "WP08's new blocking corpus-ratchet gate has no explicit ATDD/C-011 applicability statement, unlike WP02's"
    evidence:
      - artifact: "tasks.md § Work Package WP08 (lines 590-651), Requirements Coverage Summary row 'C-002' (line 752)"
      - artifact: "tasks/WP08-corpus-fixture-ratchet.md (whole file, esp. T037-T040 and 'Context & Constraints')"
      - artifact: "tasks/WP02-campsite-clean-validate-requirement-mapping.md lines 58-64 (the comparison precedent)"
    claim: >
      WP08 ships a brand-new, production-relevant, CI-blocking gate (Standing Order 5's
      non-vacuous ratchet), yet neither tasks.md's WP08 section nor
      tasks/WP08-corpus-fixture-ratchet.md states whether/why charter C-011's literal
      "failing-first test as a separate commit before implementation" applies, and WP08 is
      not listed among the WPs credited with C-002 in tasks.md's Requirements Coverage
      Summary table. WP02 makes exactly this judgment call explicit in its own body; WP08
      does not. T040's self-mutation test functionally substitutes for RED-first proof, but
      the equivalence is left for a reviewer to infer.
    remediation: >
      Add a short "Context & Constraints" note to tasks/WP08-corpus-fixture-ratchet.md (and
      a parenthetical in tasks.md's WP08 section) mirroring WP02's disclosure: state that
      C-011's literal red-first-separate-commit form does not apply to a test-only WP with
      no separate production implementation to pin RED against, and that T040's
      self-mutation test is the WP's load-bearing substitute — it must be run once and
      observed failing before the WP is marked done.
