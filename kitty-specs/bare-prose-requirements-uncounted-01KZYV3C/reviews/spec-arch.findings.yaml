findings:
  - id: SPEC-ARCH-001
    lens: Dead-path-avoidance concreteness (mission-specific)
    severity: 4
    title: "FR-010/NFR-005/Story-3-AC4 require only 'a' teeth test, not one per guard actually wired — permits shipping a reachability proof for one call site while another live call site stays unverified"
    evidence:
      - artifact: "spec.md § FR-010 (\"Add a non-vacuity ('teeth') test proving the new signal's guard-reachability is actually exercised\")"
      - artifact: "spec.md § NFR-005 (\"The new blocking wiring must fail a synthetic reversion (teeth) test, proving it is load-bearing at the guard(s) it targets\")"
      - artifact: "spec.md § User Story 3, Acceptance Scenario 4 (\"a synthetic unit test that reverts the wiring... proving the new signal's guard-reachability is actually exercised\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:484-489 (_evaluate_tasks_packages_guard, checks _tasks_dir_ready before reading requirement_mapping_failures)"
      - code: "src/runtime/next/runtime_bridge_cores.py:492-504 (_evaluate_tasks_finalize_guard — confirmed: does NOT read requirement_mapping_failures anywhere in its body today)"
      - code: "src/runtime/next/runtime_bridge_cores.py:515-521 (_evaluate_composed_tasks_packages_guard)"
      - code: "src/runtime/next/runtime_bridge_cores.py:524-534 (_evaluate_composed_tasks_terminal_guard)"
      - code: "src/runtime/next/runtime_bridge.py:1594 and :1612 (_check_cli_guards — the CLI-native vocabulary — called directly in the primary spec-kitty next decision loop, evidence that the native vocabulary is a live production path, not merely a legacy alternative)"
      - code: "src/runtime/next/runtime_bridge.py:1039-1052 (_check_composed_action_guard, the composed vocabulary, delegated separately via _dispatch_via_composition)"
    claim: >
      I verified the spec's characterization of the current code is accurate: all three guards named in the
      issue (_evaluate_tasks_packages_guard, _evaluate_composed_tasks_packages_guard,
      _evaluate_composed_tasks_terminal_guard) check `_tasks_dir_ready` before reading
      `requirement_mapping_failures`, and the fourth guard the spec says it discovered
      (_evaluate_tasks_finalize_guard) reads `requirement_mapping_failures` nowhere in its body — confirmed by
      direct read of runtime_bridge_cores.py:492-504. FR-002/FR-003 correctly leave the exact wiring location(s)
      to the plan phase's audit and correctly require wiring "whichever vocabulary (or both) spec-kitty next
      actually exercises in production" — that framing is sound. But direct code evidence (runtime_bridge.py:1594
      and :1612 call `_check_cli_guards`, the CLI-native vocabulary, straight from the primary spec-kitty next
      decision loop, while `_check_composed_action_guard` is reached via a separate `_dispatch_via_composition`
      path) makes it plausible the audit will conclude BOTH vocabularies are live for different callers, meaning
      the implementation may need to add/modify wiring in up to four guard functions across two boundaries. FR-010,
      NFR-005, and Story 3's AC4 each demand only "a"/"the" (singular, unquantified) teeth test proving
      "guard-reachability is actually exercised" — none of them require a reversion test PER guard the FR-003 audit
      identifies as live. An implementer can satisfy the letter of all three by writing one teeth test against the
      easiest-to-wire guard (e.g. the composed terminal guard, since it already partially reads the signal) while
      leaving a genuinely new wiring path (e.g. adding the missing requirement_mapping_failures read to
      _evaluate_tasks_finalize_guard, which has none today) unverified. If that untested guard is the one actually
      dispatched by production spec-kitty next, the mission reproduces — one call site over, under a new FR
      number — the exact "provably inert" failure mode of the reverted `_zero_declared_requirement_block`
      (commit 3823f2b00), where a change was asserted load-bearing in its own commit message but never verified
      against the actually-dispatched path (severity-4 finding F1 of that commit's own review, per the revert's
      commit message).
    remediation: >
      Amend FR-010 (and mirror the same requirement in NFR-005 and Story 3's Acceptance Scenario 4) to require:
      "for every guard function the implementation adds or modifies to read the new signal (as identified by the
      FR-003 vocabulary audit), a reversion ('teeth') test proves that specific guard fails closed when the wiring
      is removed from it" — an enumerated, per-call-site requirement, not a single existence proof anywhere in the
      test suite. This closes the gap with the same mechanism the reverted commit's own review used to catch the
      original defect: verify reachability at every guard actually exercised in production, not once, generically.
  - id: SPEC-ARCH-002
    lens: Layering
    severity: 3
    title: "Spec never states the new detector's classification logic must not violate runtime_bridge_cores.py's documented stdlib-only 'zero-dependency leaf' import boundary, and no automated test currently enforces that boundary"
    evidence:
      - artifact: "spec.md § Key Entities, \"Blocking signal / guard-consumption point\" (\"the as-yet-undetermined... location(s) in runtime_bridge.py / runtime_bridge_cores.py where the new signal must be read\")"
      - artifact: "spec.md § FR-001 (\"reusing _requirement_named_sections / find_undeclared_requirement_citations-style scoping\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:1-9 (module docstring: \"Zero-dependency leaf... it may import stdlib, Lane/decision types, and nothing else — in particular NEVER runtime_bridge_io / runtime_bridge_engine / runtime_bridge_composition / runtime_bridge_identity, and never a top-level edge back to the thin residual runtime_bridge\")"
      - code: "src/runtime/next/runtime_bridge_cores.py:70-77 (actual import list — stdlib + runtime.next.decision only, confirming the invariant currently holds)"
    claim: >
      runtime_bridge_cores.py documents itself as a stdlib-only pure leaf, and its current import list (re,
      collections.abc, dataclasses, typing, runtime.next.decision) honors that. I searched
      tests/architectural/*.py for any test scoped to runtime_bridge_cores.py's import set and found none — the
      invariant is enforced today only by documentation discipline, not by construction. `_requirement_named_sections`
      and `find_undeclared_requirement_citations`, which FR-001 directs the new detector to reuse, live in
      `specify_cli/requirement_mapping.py` — a cross-package, non-stdlib module. The spec never states that the new
      classifier's actual computation must stay in the residual (runtime_bridge.py, which already imports
      specify_cli.requirement_mapping) and be threaded into cores.py only as a plain-data fact on
      RequirementMappingFacts (mirroring how spec_requirement_ids is already gathered outside cores.py today) —
      rather than importing requirement_mapping directly inside a cores.py guard function, which would silently
      break the documented zero-dependency-leaf contract with no test to catch it.
    remediation: >
      Add an explicit constraint (new Constraint row, or a sentence appended to FR-002/FR-003) directing the plan
      phase to gather any new blocking-detection result as plain data in the residual and thread it through
      RequirementMappingFacts (or an equivalent fact object) into runtime_bridge_cores.py, never via a new
      cross-package import inside that module. Optionally direct the plan phase to add an architectural test
      pinning runtime_bridge_cores.py's import set to stdlib + runtime.next.decision only, closing the current
      enforcement gap by construction (charter DIRECTIVE_043) rather than leaving it to reviewer vigilance.
  - id: SPEC-ARCH-003
    lens: Contracts
    severity: 3
    title: "Spec never states whether the composed/step-contract guard vocabulary is in scope for this mission's wiring, despite that vocabulary being the mission-step-contract execution surface, not just an internal alternate code path"
    evidence:
      - artifact: "spec.md (whole document — no mention of mission step contracts, StepContractExecutor, or orchestrator-api anywhere)"
      - artifact: "spec.md § FR-009 / Story 6 (covers only the operator-facing \"in-flight missions newly blocked\" framing)"
      - code: "src/runtime/next/runtime_bridge.py:1039-1052 (_check_composed_action_guard delegates to runtime_bridge_composition._check_composed_action_guard)"
      - code: "src/specify_cli/mission_step_contracts/executor.py (StepContractExecutor — confirmed present and referenced from runtime_bridge_composition.py / runtime_bridge.py)"
    claim: >
      The composed guard family (_evaluate_composed_tasks_packages_guard, _evaluate_composed_tasks_terminal_guard)
      that FR-002/FR-003's audit may direct the implementation to wire is reached through
      _check_composed_action_guard, which is the mission step-contract execution surface (StepContractExecutor,
      src/specify_cli/mission_step_contracts/executor.py) — not merely a second internal code path but the
      surface the charter's Contracts lens names as needing explicit preservation/versioning treatment for any
      behavior change. The spec addresses only the operator-facing "in-flight missions newly block" consequence
      (Story 6, FR-009); it never states whether adding a new failure-message class to the guard_failures content
      returned through this surface is also a step-contract-schema-relevant or orchestrator-api-relevant change
      requiring documentation, and never directs the plan phase to check.
    remediation: >
      Add a sentence to FR-009 (or a new Constraint) requiring the plan phase to state explicitly whether the
      composed/step-contract guard vocabulary is in scope for this mission's wiring, and if so, whether
      src/specify_cli/mission_step_contracts/ schemas or any orchestrator-api-facing contract documentation need a
      corresponding note for the new guard-failure message class — resolving the ambiguity in plan.md rather than
      leaving it for a reviewer to discover post-hoc.
