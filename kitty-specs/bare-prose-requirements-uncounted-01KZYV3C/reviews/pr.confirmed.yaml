      - code: "tests/fixtures/tasks_cli/json/envelopes.json"
    claim: >
      No entry in the golden JSON error-surface harness exercises the new bare-prose
      failure path. Pre-existing gap, not introduced or widened by this mission's diff.
    remediation: >
      Accept as pre-existing. Belongs to its own issue against the golden envelope
      harness's coverage, not a fix inside this mission.
    ruling:
      disposition: ACCEPT
      verdict: confirmed-and-accepted
      action_taken: None — recorded here as accepted, not fixed in this mission.
      rationale: >
        Pre-existing gap in the golden envelope harness, not introduced by this diff.
        Belongs to its own issue against that harness's coverage.
