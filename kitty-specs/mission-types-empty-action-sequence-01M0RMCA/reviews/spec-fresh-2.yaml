mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: SPEC-FRESH2-001
    lens: architectural-boundary-conformance
    severity: 4
    title: "FR-001's newly-added signature text types the new parameter as `PackContext`, violating this codebase's own doctrine-must-not-import-charter rule"
    evidence:
      - artifact: "spec.md § Functional Requirements, FR-001 (text added in commit 0cd085fbe)"
      - artifact: "spec.md § Key Entities — `PackContext` (`src/charter/pack_context.py`) description is fine as prose; FR-001 is the only place a literal Python type annotation is prescribed"
      - code: "src/doctrine/missions/mission_step_repository.py:41-64 — `_PackContextLike(Protocol)` docstring: \"Replaces the `TYPE_CHECKING` import of `charter.pack_context.PackContext` (C-004: doctrine must not import from charter). ... so that any conforming object ... satisfies it without needing to depend on the charter package.\""
      - code: "src/doctrine/missions/mission_type_repository.py:12 — `from .mission_step_repository import MissionStepRepository, _PackContextLike` (no import of `charter.pack_context.PackContext` anywhere in this file — confirmed via grep across src/doctrine/missions/*.py)"
      - code: "src/doctrine/missions/mission_type_repository.py:294 (`MissionStepRepository.resolve_all_for_mission_type`) and :412 (`resolve_layered_mission_types`) both type their `pack_context` parameter as `_PackContextLike | None`, never `PackContext`"
      - code: "src/doctrine/missions/step_projection.py:11 — \"imported *by* the charter layer, never the reverse -- no layering [violation]\" (same rule, independently restated)"
    claim: >
      The second fix round added, verbatim, to FR-001: "`_inject_projected_fields`
      gains a new keyword-only `pack_context: PackContext | None = None` parameter".
      `PackContext` here reads as a literal Python type annotation naming
      `charter.pack_context.PackContext`, the same class the spec's own Key
      Entities section cites at `src/charter/pack_context.py`. But
      `_inject_projected_fields` lives in `src/doctrine/missions/mission_type_repository.py`,
      a module that — together with its sibling `mission_step_repository.py`,
      which is the *only* other place `pack_context` already flows through in
      this exact seam — deliberately avoids importing `charter.pack_context.PackContext`
      at all, even under `TYPE_CHECKING`, specifically because of a documented,
      already-enforced rule ("C-004: doctrine must not import from charter").
      The existing, working pattern in this precise call chain uses a local
      structural `Protocol`, `_PackContextLike`, imported from
      `mission_step_repository` into `mission_type_repository` (already
      imported at mission_type_repository.py:12) and already used for the two
      other pack_context-typed signatures in this very file
      (`resolve_layered_mission_types` at line 412). FR-001 is the only place
      in the four FR-001–FR-004 signature-change requirements that names a
      concrete type, and it names the wrong one: taken literally, a
      WP-implementer following FR-001 would add
      `from charter.pack_context import PackContext` to
      `mission_type_repository.py`, reproducing the exact layering violation
      this module was already restructured to eliminate. This is new drift
      introduced by the second fix round (FR-001 previously had no type
      annotation in its text at all, per `git diff cd4cab495 0cd085fbe`) and
      is exactly the kind of accumulated-edit inconsistency the repeatedly-
      touched sections are prone to.
    remediation: >
      Change FR-001's parameter type from `pack_context: PackContext | None = None`
      to `pack_context: _PackContextLike | None = None` (matching the type
      already used at mission_type_repository.py:294 and :412, and already
      imported into this file), or state the parameter's type generically as
      "the module's existing `_PackContextLike` structural protocol (not the
      concrete `charter.pack_context.PackContext` class, which this module
      must not import per its own documented layering rule)". Leave the Key
      Entities section's prose description of `PackContext` as-is (it is
      accurate as a description of the real runtime object callers pass in)
      but ensure FR-001 does not read as a literal signature directive naming
      the wrong type.
