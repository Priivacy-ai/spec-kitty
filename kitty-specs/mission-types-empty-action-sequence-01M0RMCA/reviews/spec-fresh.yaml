mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: SPEC-FRESH-001
    lens: structural-root-cause
    severity: 4
    title: "FR-001 never mandates the default=None that FR-005/C-001/Edge-Cases all depend on"
    evidence:
      - artifact: "spec.md § Requirements, FR-001 (line 78)"
      - artifact: "spec.md § Requirements, FR-005 (line 82): \"FR-001 gives `_inject_projected_fields`'s new `pack_context` parameter a default of `None`\""
      - artifact: "spec.md § Constraints, C-001 (line 100): \"...resolves to `pack_context=None` via `_inject_projected_fields`'s new default\""
      - artifact: "spec.md § Edge Cases (line 69): \"`_inject_projected_fields`'s new `pack_context` parameter defaults to `None` (see FR-005/C-001)\""
      - code: "src/doctrine/missions/mission_type_repository.py:165 (`_load`'s call: `_inject_projected_fields(raw, mission_type_id=yaml_file.stem)` — zero-argument, no pack_context)"
    claim: >
      Three separate parts of the R4-revised spec (FR-005, C-001, and the Edge Cases entry for
      `_load()`) assert — as their load-bearing justification for "no source change to `_load()`" —
      that "FR-001 gives `_inject_projected_fields`'s new `pack_context` parameter a default of
      `None`." But FR-001's own row (the actual functional requirement that adds the parameter)
      says only "Thread `pack_context` through `_inject_projected_fields`... so that my type's
      `action_sequence` resolves correctly instead of `None`/`[]`" — it never states the parameter
      must be optional or default to `None`. FR-002 (`_load_layered_mission_type_file`) and FR-003
      (`scan_mission_types_dir`) don't need this treatment (FR-003 explicitly says "optional...
      parameter" because of a real external caller, `charter/pack_manager.py:865`), but FR-001 is
      exactly the requirement whose literal text a WP-implementer would code against, and as
      written it is equally satisfied by `_inject_projected_fields(raw, *, mission_type_id: str,
      pack_context: PackContext)` (no default) as by the default-bearing form the rest of the spec
      assumes. A literal implementation of FR-001 without a default breaks the zero-argument call
      at `mission_type_repository.py:165`, directly contradicting FR-005/C-001 (which are High
      priority) and forcing `_load()` to become a fifth touched function under C-007. This gap was
      foregrounded by the R4 fix itself: the R4 rewording of FR-005/C-001/Edge-Cases newly leans on
      "FR-001's default" as the *mechanism* that makes "no source change" true, but R4 never
      touched FR-001 to actually encode that mechanism.
    remediation: >
      Add the default requirement to FR-001's own text, e.g.: "...gains a new keyword-only
      `pack_context: PackContext | None = None` parameter (defaulting to `None` so `_load()`'s
      existing zero-argument call at mission_type_repository.py:165 remains valid unchanged, per
      FR-005/C-001)." This makes the constraint FR-005/C-001/Edge-Cases already assume an explicit,
      independently-checkable part of FR-001 rather than an inference three other sections merely
      assert.
  - id: SPEC-FRESH-002
    lens: evidence-verification
    severity: 2
    title: "Summary's `_load_layered_mission_type_file` line citation (\"~347\") is 34 lines off the actual definition"
    evidence:
      - artifact: "spec.md § Summary (line 10): \"`_load_layered_mission_type_file`, currently line ~347\""
      - code: "src/doctrine/missions/mission_type_repository.py:313 (`def _load_layered_mission_type_file(yaml_file: Path) -> MissionType:`)"
    claim: >
      The Summary's approximate citation for `_load_layered_mission_type_file`'s definition
      ("currently line ~347") is off by 34 lines from the actual definition at line 313 in this
      checkout. This sentence was left untouched by the R4 fix round even though R4 specifically
      corrected two other off-by-one line citations in the same paragraph (209-252→209-253,
      244→245) and even though every other function/line citation added or touched by R4 elsewhere
      in the document (mission_type_repository.py:165, :245, mission_type_profiles.py:985/994,
      mission_type.py:1469/1479, decision.py:614, runtime_bridge_composition.py:188/325,
      charter/mission_type.py:158, charter/activate.py:183/205) verified exactly precise against
      this checkout. Given the document's otherwise pinpoint-precision standard, a 34-line-stale
      approximate citation stands out and could send a WP-implementer or reviewer to the wrong
      neighborhood of the file when spot-checking the Summary's claims.
    remediation: >
      Update the Summary's citation to "currently line 313" (or re-verify and correct to whatever
      line it resolves to at the point this spec is next touched), matching the precision applied
      to the paragraph's other two line citations in the same R4 pass.
