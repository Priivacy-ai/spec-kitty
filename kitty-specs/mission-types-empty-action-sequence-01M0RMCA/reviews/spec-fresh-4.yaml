findings:
  - id: SPEC-FRESH4-001
    lens: terminology-consistency
    severity: 2
    title: "FR-006's title still bare-reuses the source docstring's \"C-007-retained\" label without the provenance disambiguation this round added everywhere else it occurs"
    evidence:
      - artifact: "spec.md § Requirements, FR-006 title (line 83): \"Preserve the `action_sequence` C-007-retained fallback\" — no attribution, no distinction from this spec's own Constraint C-007 (blast radius)"
      - artifact: "spec.md § Summary/Clarifications (line 25): the same source-docstring label is now explicitly attributed — \"the **source docstring's own label** ... distinct from, and not to be confused with, this spec's own Constraint **C-007** below\""
      - artifact: "spec.md § Edge Cases (line 66): likewise now explicitly attributed — \"the source docstring labels \\\"C-007-retained\\\" (that label's own provenance — the source docstring's numbering, distinct from this spec's own Constraint C-007 above ...)\""
      - code: "src/doctrine/missions/mission_type_repository.py:223 — confirmed this is where the docstring's own \"C-007-retained\" label actually lives; it is a different mission's (mission-step-creatability-01KXQA6R) constraint numbering, not this spec's"
    claim: >
      This round's fix (commit 4b1311954) resolved the "C-007-retained" vs.
      this spec's own Constraint C-007 identifier collision at its two prose
      occurrences (Summary/Clarifications and Edge Cases) but left a third,
      earlier-introduced occurrence untouched: FR-006's own title. A reader
      who reaches FR-006 without having internalized the disambiguation from
      the earlier two sections could misread "C-007-retained fallback" as
      "the fallback retained per this spec's Constraint C-007 (blast
      radius)," which is nonsensical against that constraint's actual
      content. This is the identical defect class SPEC-FRESH3-002 (severity
      2) already flagged and that this round's own fix summary explicitly
      called out as "noticed but not fixed" for FR-006, under an operator
      scope boundary limited to the C-008 typing work.
      Verdict: this is a genuine residual, not a fabricated one — it is
      real and traceable to the same defect class already conceded once at
      severity 2. But it is inert against implementation: FR-006's
      normative content ("keep falling back to my type's raw YAML-authored
      `action_sequence` value ... unchanged from today's
      `projected_sequence or raw.get(\"action_sequence\")` behavior") is
      fully self-contained and unambiguous without the label at all — a
      WP-implementer does not need to resolve "C-007-retained" to correctly
      implement or test FR-006. Four review rounds in, with the operator's
      explicit "touch only C-008 plus the two flagged prose sites" scope
      for this round, this does not rise to a rework-causing ambiguity and
      does not warrant blocking this round. Rated severity 2 (minor,
      consistent with the SPEC-FRESH3-002 precedent for the same defect
      class), not severity 3+, and therefore does not itself trigger a HALT.
    remediation: >
      Cosmetic, low urgency: drop "C-007-retained" from FR-006's title (e.g.
      retitle to "Preserve the `action_sequence` raw-YAML fallback") or add
      the same parenthetical disambiguation used in Summary/Clarifications
      and Edge Cases. Safe to fold into the next round that touches this
      file for any other reason; not worth a dedicated round on its own.
