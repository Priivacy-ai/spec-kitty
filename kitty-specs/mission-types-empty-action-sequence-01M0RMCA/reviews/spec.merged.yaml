schema: review-findings/v1
complete: true
phase: spec
mission: mission-types-empty-action-sequence-01M0RMCA
merge_note: >
  Mechanical R2 merge of spec-gov.findings.yaml (3), spec-arch.findings.yaml (2),
  spec-verify.findings.yaml (2) = 7 raw findings. One duplicate pair identified
  (SPEC-GOV-001 / SPEC-ARCH-002, both concerning the same "eight call sites" miscount
  in Decision 1's evidence) and merged into a single entry, keeping the higher severity
  (3) and unioning evidence from both. No finding dropped for disagreement — that
  judgment belongs to R3. 6 findings survive merge.
findings:
  - id: SPEC-GOV-001
    also_reported_by: [SPEC-ARCH-002]
    lens: decision-record-fidelity / Contracts (Decision 1 evidence accuracy)
    severity: 3
    title: "Decision 1's \"eight .action_sequence call sites\" evidence is miscounted against the actual checkout"
    evidence:
      - artifact: "spec.md § Clarifications › Decision 1 — Evidence (third bullet)"
      - code: "src/charter/mission_type_profiles.py:272 (docstring/comment mention, not a real access)"
      - code: "src/charter/mission_type_profiles.py:955 (docstring/comment mention, not a real access)"
      - code: "src/charter/mission_type_profiles.py:985 (real access)"
      - code: "src/charter/mission_type_profiles.py:994 (real access)"
      - code: "src/specify_cli/cli/commands/mission_type.py:1469"
      - code: "src/specify_cli/cli/commands/mission_type.py:1479"
      - code: "src/runtime/next/decision.py:614"
      - code: "src/runtime/next/runtime_bridge_composition.py:188"
      - code: "src/runtime/next/runtime_bridge_composition.py:325"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:158"
      - code: "src/specify_cli/cli/commands/charter/activate.py:183"
      - code: "src/specify_cli/cli/commands/charter/activate.py:205"
    claim: >
      The spec states action_sequence is "read via direct .action_sequence attribute access
      at eight separate call sites across src/charter/mission_type_profiles.py (×3),
      src/specify_cli/cli/commands/mission_type.py, src/runtime/next/decision.py,
      src/runtime/next/runtime_bridge_composition.py (×2), and
      src/specify_cli/cli/commands/charter/{activate,mission_type}.py." Two independent
      lenses (gov, arch) each re-derived this count first-hand and found it wrong. The "×3"
      for mission_type_profiles.py is wrong: only lines 985 and 994 are real
      `.action_sequence` attribute accesses; lines 272 and 955 are docstring/comment prose
      that merely mentions `mission.action_sequence` in backticks, not code. The files cited
      without a multiplier (mission_type.py, charter/activate.py) each actually contain TWO
      real accesses, not one. The true first-hand count across the six named files is 10, not
      8, and the stated per-file multipliers don't even self-consistently sum to 8. This does
      not change Decision 1's conclusion (action_sequence is still a first-class, multiply-
      consumed model field with no migration authorized), but it weakens the "verified
      first-hand" evidence claim the Clarifications section makes for itself.
    remediation: >
      Recount the real `.action_sequence` attribute-access call sites (exclude docstring/prose
      mentions) and correct the Decision 1 evidence bullet to the accurate total and per-file
      breakdown (mission_type_profiles.py ×2, specify_cli/cli/commands/mission_type.py ×2,
      runtime/next/decision.py ×1, runtime/next/runtime_bridge_composition.py ×2,
      specify_cli/cli/commands/charter/mission_type.py ×1,
      specify_cli/cli/commands/charter/activate.py ×2 — 10 total), or drop the precise count
      and describe the call sites only by file, since C-002's actual enforcement mechanism is
      the C-007 blast-radius file list, not this count.

  - id: SPEC-GOV-002
    lens: directive
    severity: 1
    title: "Two line-number citations in the Summary are off by one against the current checkout"
    evidence:
      - artifact: "spec.md § Summary (paragraph 1)"
      - code: "src/doctrine/missions/mission_type_repository.py:244-245"
      - code: "src/doctrine/missions/mission_type_repository.py:209-253"
    claim: >
      The Summary states the hardcoded pack_context=None call is "currently line 244" — in
      this checkout it is line 245; line 244 is `MissionStepRepository.default()`, the line
      above it. Separately, the Summary cites `_inject_projected_fields()` as spanning
      "currently lines 209-252"; the function's closing `return payload` is at line 253, one
      past the cited range. Both match the issue's own quoted numbering, so likely drifted by
      one line since filing. The "currently" qualifier already signals awareness of drift, so
      this has no effect on implementation.
    remediation: >
      Re-point the two citations to line 245 (the call) and 209-253 (the function span) to
      match this checkout, or drop the exact line numbers and cite only the function name.

  - id: SPEC-GOV-003
    lens: decision-record-fidelity
    severity: 3
    title: "C-002 and C-003 restate Decision 1/2 as prose with no explicit, checkable acceptance criterion tying them to the C-007 blast-radius bound"
    evidence:
      - artifact: "spec.md § Constraints › C-002"
      - artifact: "spec.md § Constraints › C-003"
      - artifact: "spec.md § Constraints › C-007"
      - artifact: "spec.md § Success Criteria (SC-001..SC-005)"
    claim: >
      C-002 and C-003 are each pure prose assertions with no accompanying test, SC row, or
      explicit cross-reference to an enforcement mechanism. The only thing in the spec that
      actually bounds the diff to make C-002/C-003 true is C-007's file-list, but no SC or NFR
      converts that file-list into a checkable acceptance criterion. A reviewer who trusts
      C-002/C-003's prose without independently re-deriving the C-007 connection has no test
      or automated check that would catch a WP that folded an out-of-scope change in
      alongside the intended fix.
    remediation: >
      Add an explicit SC or NFR row that makes the C-007 blast-radius bound checkable — e.g.
      "SC-006: `git diff --name-only main...HEAD` for this mission's PR contains only
      src/doctrine/missions/mission_type_repository.py,
      tests/doctrine/missions/test_mission_type_repository.py, and
      tests/runtime/test_runtime_seam.py; any other path in the diff is a
      C-002/C-003/C-007 violation" — and have C-002/C-003 reference that SC directly.

  - id: SPEC-ARCH-001
    lens: "MISSION-DERIVED (four-function seam completeness and call-graph accuracy)"
    severity: 3
    title: "FR-005 demands an explicit code edit to a fifth caller (_load()) that C-007 and the Edge Cases text both frame as unchanged/out of bounds"
    evidence:
      - artifact: "spec.md § Requirements > Functional Requirements, FR-005"
      - artifact: "spec.md § Constraints, C-007 (\"Blast radius bounded to one file, four functions\")"
      - artifact: "spec.md § Edge Cases (caller-without-pack_context question)"
      - code: "src/doctrine/missions/mission_type_repository.py:165 — MissionTypeRepository._load() calls _inject_projected_fields(raw, mission_type_id=yaml_file.stem) with NO pack_context argument at all today."
      - code: "src/doctrine/missions/mission_type_repository.py:209 — _inject_projected_fields(raw: dict[str, Any], *, mission_type_id: str), the pre-fix signature FR-001 will add an optional pack_context parameter to."
    claim: >
      _load() (line 165) is a genuine fifth caller of _inject_projected_fields in the same
      file — verified by grep, the only other in-repo call site besides
      _load_layered_mission_type_file. C-007 bounds the blast radius to exactly "one file,
      four functions"; Edge Cases frames _load() as needing no change. But FR-005 requires
      _load()'s call to "keep passing pack_context=None explicitly and unconditionally" — and
      today it does not pass pack_context at all (the keyword doesn't exist on the current
      signature), so satisfying FR-005's literal wording requires an edit to _load()'s call
      site, contradicting C-007's "four functions" bound. If the new parameter defaults to
      None, _load() behaves correctly with NO edit at all — which is what "unchanged" means —
      but then FR-005's "explicitly" is not met by the diff, and no test distinguishes
      "explicit None" from "implicit/default None." An implementer following C-007 to the
      letter and a reviewer holding FR-005 to the letter will disagree, causing rework.
    remediation: >
      Either (a) drop "explicitly" from FR-005 and state plainly that _load()'s call site
      requires NO source change — the new pack_context parameter must default to None, and
      _load()'s existing call already satisfies FR-005/C-001 via that default — or (b) if an
      explicit literal is really wanted for readability, say so plainly in C-007 as a fifth,
      deliberately-trivial, no-behavior-change touch, and add a verifiable assertion (e.g. a
      source-grep in the test) if "explicitly" must be verifiably true rather than merely
      asserted.

  - id: SPEC-VERIFY-001
    lens: "mission-derived (red-first testability of NFR-001/SC-004)"
    severity: 3
    title: "SC-004's \"verified ... during review\" names no owning phase or actor, so the stash/revert obligation can silently go unperformed"
    evidence:
      - artifact: "spec.md § Success Criteria, SC-004: \"verified by running it against a git stash/revert of the fix during review, not merely asserted.\""
      - artifact: "spec.md § NFR-001: states the FAIL/PASS obligation but likewise names no phase/actor"
      - code: "src/doctrine/missions/mission_type_repository.py:209-252 (_inject_projected_fields, confirmed current pack_context=None hardcode at line 245) — the whole fix is bounded to this one file per C-007, so a literal git stash of the fix is well-defined and mechanically actionable"
    claim: >
      "during review" / "stash" / "revert" appears exactly once (SC-004) and nowhere else
      names which phase or role actually executes the stash/revert/rerun sequence. This
      mission's workflow has at least two candidate "review" points (the WP-implementer's own
      reviewer during sk-implement, and the pre-merge R1-R3 squad during sk-review). Without
      naming which of these runs the stash/unstash/rerun cycle, each phase can reasonably
      assume the other already did it, and the concrete check degrades into exactly the
      "merely asserted" outcome SC-004 says it must not be.
    remediation: >
      Add one sentence to SC-004 (or a new Constraint, e.g. C-008) naming the concrete owner
      and moment: e.g. "The WP-implementer authoring NFR-001's test must, before marking the
      WP done, git stash the mission's changes to mission_type_repository.py, rerun the new
      test and confirm it fails with the pre-fix None/[] result, git stash pop, and rerun to
      confirm it passes — and must record both runs in the mission's tracer file so the
      pre-merge squad can verify the claim was witnessed rather than re-deriving it."

  - id: SPEC-VERIFY-002
    lens: baseline honesty
    severity: 2
    title: "SC-005's ~23/2 baseline citation is real but has zero overlap with the two files SC-005 actually runs, and the spec gives no concrete triage method"
    evidence:
      - artifact: "spec.md § Success Criteria, SC-005"
      - artifact: "GitHub issue #3284 (Priivacy-ai/spec-kitty) — its own \"Failure groups\" breakdown contains no test under tests/doctrine/missions/ or tests/runtime/test_runtime_seam.py"
    claim: >
      SC-005 correctly acknowledges the repo-wide ~23-known-red/2-error baseline (issue
      #3284) and commits to per-item triage rather than assuming full green. But #3284's own
      failure-group list, verified directly, contains no test from either file SC-005 scopes
      its run to. So in practice any red produced by this exact pytest invocation is
      presumptively mission-introduced, not "possibly part of the #3284 baseline" — yet the
      spec's phrasing treats both outcomes as live possibilities to triage without saying how.
    remediation: >
      Add a sentence to SC-005 naming the concrete triage mechanism for this narrow scope:
      run the identical pytest invocation against the mission's unmodified base commit — if
      also red there on the same test id, it is pre-existing and must be logged against a
      tracked issue; if green there, the red is mission-introduced and must be fixed before
      merge.
