findings:
  - id: TASKS-SEQ-001
    lens: Chokepoints called out
    severity: 2
    title: "tasks.md/WP01 never inline the three-production-caller chokepoint that plan.md's Blast radius section identifies for resolve_layered_mission_types"
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Objective / § Reviewer Guidance"
      - artifact: "plan.md § Blast radius on downstream workspaces (lines 345-411)"
      - code: "charter/mission_type_profiles.py:976 (_resolve_action_slot)"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:87 (resolve_layered_roster)"
      - code: "src/specify_cli/cli/commands/_mission_type_audit.py:170 (_resolve_layered_roster)"
    claim: >
      plan.md's "Blast radius on downstream workspaces" section names three distinct production
      `src/` entry points (`_resolve_action_slot`, `resolve_layered_roster`,
      `_resolve_layered_roster`) that all reach the fixed function
      (`resolve_layered_mission_types`) exclusively through this one seam — a textbook
      chokepoint the plan explicitly reasons about (a threading bug "would affect all three
      identically rather than three independent surfaces"). Neither tasks.md, wps.yaml, nor
      WP01's Objective/Context/Risks/Reviewer Guidance sections name these three callers or the
      word "chokepoint"/"shared seam" — a grep for `chokepoint`, `blast radius`,
      `_resolve_action_slot`, `resolve_layered_roster`, `_resolve_layered_roster` across
      tasks.md, wps.yaml, and the WP01 prompt returns zero matches. WP01 does tell the
      implementer to "read spec.md and plan.md in full," which mitigates this for an
      implementer who follows that instruction to the letter, but the WP's own "Reviewer
      Guidance" checklist — the section a reviewer is most likely to work from directly without
      re-deriving plan.md's blast-radius analysis — has no bullet instructing the reviewer to
      confirm post-fix behavior at any of the three real production entry points, only at the
      golden-parity test on `resolve_layered_mission_types` itself. Since plan.md already argues
      the golden-parity test transitively covers all three callers, this is not a correctness
      gap, but it is a traceability/reviewability gap: a reviewer working strictly from WP01
      would not learn that this seam is a chokepoint for CLI/charter surfaces
      (`charter mission-type list --json`, `mission-type show`, `doctor`'s mission-type audit)
      unless they separately open plan.md's Blast radius section.
    remediation: >
      Add one sentence to WP01's Context or Reviewer Guidance section naming the three
      production callers (or at minimum stating "this seam is a chokepoint for three
      production src/ callers — see plan.md's Blast radius section for the full list and why
      T004's golden-parity test transitively covers all three") so a reviewer working only from
      the WP prompt still sees the shared-seam framing without needing to cross-reference
      plan.md independently.
