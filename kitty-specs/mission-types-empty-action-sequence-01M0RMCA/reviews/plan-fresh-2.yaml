findings:
  - id: PLAN-FRESH2-001
    lens: PR-shape / gate-checkability (round-2 regression on PLAN-FRESH-003's own fix)
    severity: 3
    title: The round-2 fix for SC-006's scope ambiguity (PLAN-FRESH-003) over-corrected — it exempts every non-src/tests path in the diff from SC-006's check, not just this mission's own kitty-specs/ directory
    evidence:
      - artifact: "plan.md § Contracts, lines 292-295 (unchanged since round 1): \"C-007 bounds the diff to the one named file and two named test files (checkable via SC-006's `git diff --name-only` mechanism at merge time). No contract file is in that bounded set, so none moves.\""
      - artifact: "plan.md § Contracts, lines 295-304 (added this round, commit 9667150fe): \"**Scope of SC-006's check**: C-007's file-set bound, and therefore SC-006's `git diff --name-only main...HEAD` check, applies to the `src/`- and `tests/`-side changes only — the one named `src/` file and the two named test files. ... SC-006's diff check is scoped to whether any `src/`/`tests/` path *outside* C-007's three named files appears, not to whether this mission's own planning directory appears at all.\""
      - artifact: "spec.md § Success Criteria, SC-006 (unedited, still the literal authoritative text): \"touches only the files C-007 names ... Any other path appearing in the diff is a C-002/C-003/C-007 violation and must be justified or removed before merge.\""
      - artifact: "reviews/plan-fresh.yaml, PLAN-FRESH-003 evidence/remediation: the round-1 finding and its accepted remediation scoped the requested carve-out specifically to \"kitty-specs/mission-types-empty-action-sequence-01M0RMCA/** ... is expected and out of C-007's scope by construction\" — it did not ask for the check itself to be narrowed to src/+tests paths only."
    claim: >
      PLAN-FRESH-003 (round 1) correctly identified that SC-006's literal "any other path... is a
      violation" wording would falsely flag this mission's own kitty-specs/ planning/tracer/review
      artifacts, and asked for one clarifying carve-out for that directory specifically. The round-2
      fix instead rewrote SC-006's operational meaning as "applies to the src/- and tests/-side
      changes only" / "scoped to whether any src/tests path... appears" — which is a strictly
      broader exemption than the one requested or justified. Read literally, the new gloss means
      SC-006's merge-time check no longer looks at any diff path outside `src/` and `tests/` at
      all — not just this mission's own kitty-specs/ directory, but also, for example, an
      accidental edit to `docs/**`, `packs/built-in/missions/mission-steps/**` (template source),
      `.github/workflows/**`, `README.md`, or a different mission's `kitty-specs/**` directory.
      None of those are C-007-bounded (C-007 names exactly one src/ file and two test files) and
      spec.md's own SC-006 text would flag any of them, but the new gloss's restated check ("scoped
      to whether any src/tests path... appears") would silently let them through undetected at
      merge time. This directly contradicts the immediately preceding, unchanged sentence in the
      same paragraph ("C-007 bounds the diff to the one named file and two named test files
      ...checkable via SC-006's `git diff --name-only` mechanism") — one sentence says the diff is
      bounded to exactly three files, the very next (new) sentence says the check only actually
      verifies src/tests paths, which are two different, incompatible claims about what SC-006
      mechanically catches. This is exactly the kind of gate-description gap C-002/C-003 rely on
      SC-006 to make checkable, per the charter's smallest-viable-diff and single-canonical-
      authority principles.
    remediation: >
      Narrow the new "Scope of SC-006's check" paragraph to carve out only this mission's own
      `kitty-specs/mission-types-empty-action-sequence-01M0RMCA/**` directory (matching
      PLAN-FRESH-003's actual remediation ask), not "src/- and tests/-side changes only." E.g.:
      "SC-006's `git diff --name-only main...HEAD` check applies to the full diff; the sole
      carve-out is this mission's own kitty-specs/mission-types-empty-action-sequence-01M0RMCA/**
      planning/tracer/review artifacts (expected mission bookkeeping under the one-PR-per-mission
      model). Any other path outside C-007's three named files — including paths outside src/ and
      tests/ entirely, such as docs/, packs/, .github/, or another mission's kitty-specs/ directory
      — remains a C-002/C-003/C-007 violation per spec.md's literal SC-006 text." This keeps the
      carve-out precise instead of silently widening SC-006's blind spot to every non-src/tests path
      in the diff.
