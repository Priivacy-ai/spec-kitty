findings:
  - id: TASKS-DECOMP-001
    lens: single-concern, reviewable in one sitting (concrete implementability)
    severity: 3
    title: "T007's red-first witnessing recipe leads with a plain `git stash` that will stash nothing, given T002/T003's own commit-separation mandate guarantees both changes are already committed by the time T007 runs"
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T007, step 1: \"`git stash` the production-code changes to `mission_type_repository.py` from T003 — leave T002's new test in place (it should already be committed separately, so stashing only the uncommitted-or-separately-committed production diff; if both are committed, use `git stash` against a temporary revert of just the fix commit, or `git diff`/`git apply -R` the fix commit's diff — whichever mechanism your git history shape supports; the point is: test present, fix absent).\""
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T002, step 3: \"Commit this test file change as its own, separate commit ... Do not combine this commit with any production-code change.\""
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T003, step 8: \"Commit this production-code change as its own commit(s), separate from T002's test commit.\""
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Reviewer Guidance: \"Confirm the red-first test (T002) is in a separate commit from the production fix (T003), in that order, per `git log`.\" — this reviewer-facing check independently confirms both commits are expected to exist by review time, i.e. before/at T007's own moment in the WP's own T001→T009 sequence."
    claim: >
      T003 (which runs before T007 in this WP's own numbered sequence) mandates committing the
      fix as its own commit, and T002 already mandated committing the red-first test as its own,
      earlier, separate commit. By the time T007 executes, the working tree is therefore
      guaranteed clean — both changes are committed, not merely staged or uncommitted. A bare
      `git stash` in that state stashes nothing (there is no uncommitted diff to stash), so the
      primary instruction given in T007 step 1 will silently no-op rather than removing the fix.
      The subtask does flag this itself ("if both are committed, use `git stash` against a
      temporary revert...") but only as a hedge appended after the (non-functional, in this WP's
      own guaranteed sequencing) primary instruction, and offers three different fallback
      mechanisms ("temporary revert", "git diff"/"git apply -R") without picking one — "whichever
      mechanism your git history shape supports" leaves the actual git recipe to be improvised at
      implementation time. This is exactly the SC-004/T007 moment plan.md calls "not merely
      asserted" and requires to be actually witnessed and recorded — an implementer who runs the
      literal first instruction, sees `git stash` report "No local changes to save," and does not
      immediately recognize the no-op, risks recording a false "witnessed" pass in the tracer file
      without ever having actually reverted the fix.
    remediation: >
      Replace T007 step 1's git-stash-first instruction with the one mechanism that is actually
      guaranteed to work given this WP's own T002/T003 commit-separation mandate: `git revert
      --no-commit <fix-commit-sha>` (reverting exactly T003's fix commit(s), leaving T002's test
      commit's changes in place), rerun the pinned test to confirm it fails, then `git revert
      --abort` (or `git reset --hard <fix-commit-sha>` if the revert was already committed) to
      restore the fix and rerun to confirm it passes. State this as the single primary recipe,
      not a "whichever works" menu, since the WP's own sequencing already determines which
      mechanism applies.
  - id: TASKS-DECOMP-002
    lens: single-WP diagnostic honesty (mission-derived)
    severity: 2
    title: "WP01's 9 subtasks / 564 lines sit above the tasks-outline template's 3-7-subtask/200-500-line target band (though under its 10-subtask/~700-line hard maximum) because four of the nine subtasks (T001, T007, T008, T009) are pure process/verification checkpoints with no code delta, three of which independently re-run the same two-file pytest invocation"
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtasks T001 (\"Files: no code files touched\"), T007 (\"Files: no new code files\"), T008 (\"Files: no new code files\"), T009 (\"Files: tracer files only, plus fixes ... if the gate self-check surfaces an issue\") — four of nine subtasks touch no owned code file under nominal execution."
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § T001 step 1 and § T008 step 1: both run the identical command `pytest tests/doctrine/missions/test_mission_type_repository.py tests/runtime/test_runtime_seam.py`, at the pre-fix and post-fix ends of the same WP respectively, each recording results to the same tracer files as T007's separate stash/pop run."
      - artifact: "packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md § Work Package Sizing Guidelines (lines 211-220): \"Target: 3-7 subtasks per WP → 200-500 line prompts\" / \"Maximum: 10 subtasks → ~700 line prompts\" / \"Split if ANY of these are true: More than 10 subtasks / Prompt would exceed 700 lines / Multiple independent concerns mixed together / Different phases or priorities mixed.\""
    claim: >
      Genuine assessment (not a rubber-stamp): none of WP01's split-mandatory triggers actually
      fire — 9 ≤ 10 subtasks, 564 ≤ ~700 lines, and every subtask serves the single IC-01 seam
      (no independent architectural concern is mixed in; T007's red-first witnessing and T009's
      gate self-check are both charter-mandated checkpoints for *this* fix, not a second concern
      smuggled in). So this is not a violation of the template's hard bounds, and plan.md's own
      "PR shape" argument (one small diff in one file, reviewable in a sitting) holds independent
      of subtask count, since the actual code diff a human reviews is unaffected by how many
      process checkpoints the WP prompt enumerates. That said, the WP sits at the high end of both
      metrics specifically because T001 (full-suite baseline, pre-any-change), T007 (stash/pop
      witness of the one new test), and T008 (full-suite rerun, post-fix, triaged against T001) are
      three separately-numbered, separately-tracer-recorded checkpoints built around what is
      substantively the same "run this pytest invocation and record the result" action performed
      at three points in the timeline. They are not redundant in *purpose* (T001 catches
      pre-existing baseline red across the whole two files; T007 specifically proves the new
      NFR-001 test pins the defect via stash/pop; T008 catches any mission-introduced red anywhere
      in the two files, not just the one new test) — but their mechanical overlap is real, and
      folding adjacent pairs would not lose any required evidence.
    remediation: >
      Not required for correctness (no split-mandatory trigger fires). If tighter density matching
      the 3-7 target band is preferred, fold T001's baseline-capture into T002's step 1 (both are
      "run pytest, record to tracer, before any production-code change") and fold T008's final
      full-suite rerun into T009's step 1 (both are final-sweep verification before marking the WP
      done) — this reduces the subtask count from 9 to 7 without dropping any required action or
      recorded evidence, landing inside the template's target band rather than at the edge of its
      maximum.
