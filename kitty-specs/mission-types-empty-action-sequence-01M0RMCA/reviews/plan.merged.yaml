findings:
  - id: PLAN-ARCH-001
    lens: "Blast radius (arch); CI gate citation accuracy / Falsifiability (verify, duplicate claim merged in — original id PLAN-VERIFY-001)"
    severity: 4
    title: "Plan's Blast radius / IC-01 Risks sections claim 'exactly one production caller' of `resolve_layered_mission_types`, contradicted by two more live production call sites"
    evidence:
      - artifact: "plan.md § Implementation Concern Map / IC-01 Risks (lines 331-332, 336-338)"
      - artifact: "plan.md § Blast radius on downstream workspaces (lines 336-338: \"resolve_layered_mission_types has exactly one production caller today (_resolve_action_slot, underlying charter activate mission-type and agent mission create --mission-type)\")"
      - code: "src/charter/mission_type_profiles.py:976 — `_resolve_action_slot` calls `resolve_layered_mission_types(mission_types_dirs, pack_context)` (the caller the plan names)"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:87 — `resolve_layered_roster()` calls `resolve_layered_mission_types(mission_types_dirs, pack_context)` with a real `PackContext.from_config(repo_root)`, wired live into `charter_mission_type_list` (line 137) — the `spec-kitty charter mission-type list` CLI command, AND re-exported/imported by `src/specify_cli/cli/commands/mission_type.py:1454` (`show_mission_type`), whose fallback branch at line 1479 reads `mt.action_sequence` straight off the returned object, independent of `_resolve_action_slot`. Not named by the plan."
      - code: "src/specify_cli/cli/commands/_mission_type_audit.py:170 — `_resolve_layered_roster()` calls `resolve_layered_mission_types(mission_types_dirs, pack_context)` with a real `PackContext.from_config(repo_root)`, wired into `doctor.py`'s mission-type audit CLI surface (resolvability classification; does not read `.action_sequence` but is still a distinct production call site the plan's count omits). Not named by the plan."
      - code: "src/doctrine/missions/mission_type_repository.py:22-31 (also cited 22-29 by verify) — the module comment the plan cites as its source (\"the one production src/ caller per this file's own module comment\") is scoped to a prior mission's WP04 historical framing (\"WP04 now calls it from ... so the dead-code gate has a live caller\"), not an exhaustive present-tense enumeration; it predates the later WP07 additions in `charter/mission_type.py` and `_mission_type_audit.py` (their own docstrings self-identify as \"WP07\", i.e. later work than the WP04 comment the plan trusted)."
    claim: >
      The plan's Blast radius section (a section both the arch and verify lens groups are
      specifically charged with checking for concrete, evidenced reasoning rather than
      hand-waving) asserts twice that `resolve_layered_mission_types` has "exactly one production
      caller today" and uses that count to argue the regression/behavior-change surface is
      narrow. A direct grep of `src/` for `resolve_layered_mission_types` (including through its
      `charter.missions` re-export alias) shows at least three live production call chains
      reachable from real CLI commands: `_resolve_action_slot` (the one the plan names),
      `charter_mission_type_list`/`show_mission_type` via `resolve_layered_roster`
      (`spec-kitty charter mission-type list` / `mission-type show`), and the mission-type audit
      CLI via `_mission_type_audit.py::_resolve_layered_roster` (wired through `doctor.py`). All
      three already thread a real `PackContext` today, so all three are equally affected by both
      the pre-fix bug and this mission's fix — the plan's own "no existing working caller changes
      behavior" conclusion likely still holds for all three, but the plan never says so because it
      did not know they existed. Trusting a stale, historically-scoped module comment instead of
      an independent grep is exactly the failure mode this mission's own plan repeatedly says it
      is avoiding ("verify rather than trust"). This does not change C-007's file-set bound (none
      of these three callers need code changes), but it does mean the Blast radius narrative
      under-counts the production surfaces whose *observable output* changes post-fix (e.g.
      `spec-kitty charter mission-type list --json`, `mission-type show`, and the audit CLI's
      `resolved` vs `activated-unresolvable` classification for an affected org/project type),
      which a reviewer or downstream consumer relying on this plan's Blast radius section as the
      authoritative account would not think to check.
    remediation: >
      Correct plan.md's Blast radius and IC-01 Risks sections to state the actual caller count
      (at least three, found via `grep -rn "resolve_layered_mission_types(" src/`, including the
      `charter.missions` re-export alias used by `charter/mission_type.py` and
      `_mission_type_audit.py` — re-grep at merge time since the count may drift further before
      implementation lands), name `spec-kitty charter mission-type list`, `mission-type show`, and
      the mission-type audit CLI (`doctor.py`) as additional production surfaces whose output
      changes for an affected org/project type post-fix (a positive, intended change, not an
      unaccounted-for regression surface), and confirm (or extend NFR-002/SC-003's golden-parity
      test to explicitly assert) that built-in-type output through these two additional entry
      points is unaffected too — not just through `resolve_layered_mission_types` called directly
      in the test file.
    dedup_note: "Merged from PLAN-ARCH-001 (severity 4, arch) and PLAN-VERIFY-001 (severity 3, verify) — same underlying claim (Blast radius caller-count inaccuracy), same artifact section, overlapping evidence. Kept higher severity (4) and the arch id per R2 dedup rule; union of both groups' evidence retained above."

  - id: PLAN-VERIFY-002
    lens: Test strategy
    severity: 3
    title: "Test strategy names no concrete test case for spec.md Acceptance Scenario 5 (project-layer steps-only projection)"
    evidence:
      - artifact: "spec.md § User Story 1, Acceptance Scenario 5 (line 62): \"Given a project-layer .kittify/missions/mission_types/<id>.yaml override with its own mission-steps/<id>/ steps-only projection ... When resolved, Then it also produces the correct non-empty action_sequence — the fix applies uniformly to the org layer and the project layer\""
      - artifact: "spec.md NFR-001 (line 91): \"must exercise an org-tier (or project-tier) mission type\" — disjunctive, satisfiable by testing only one tier"
      - artifact: "plan.md § IC-01 Affected surfaces, tests/doctrine/missions/test_mission_type_repository.py bullet (lines 195-200): names only an \"org-tier (or project-tier)\" steps-only fixture for NFR-001, with no separate bullet or explicit case naming project-layer (.kittify/missions/mission_types/) resolution"
      - artifact: "plan.md: full-text search for \"project-layer\"/\"project-tier\" outside prose summaries returns no test-strategy hit distinct from the org-layer case"
    claim: >
      spec.md's Acceptance Scenario 5 is a named, mandatory scenario requiring the project-layer
      override path (.kittify/missions/mission_types/<id>.yaml with its own steps-only
      mission-steps/<id>/ tree) to independently produce the correct action_sequence. NFR-001's
      own wording ("org-tier (or project-tier)") only requires ONE of the two tiers for the
      red-first pin, and the plan's IC-01 test-strategy bullet for
      test_mission_type_repository.py follows that same either/or framing without committing to
      a concrete project-layer case. Since resolve_layered_mission_types's body has three
      independent scan_mission_types_dir call sites (built-in-equivalent, org, project) that this
      mission threads pack_context through, testing only the org-tier path exercises the
      org-layer call site's *correctness* but leaves the project-layer call site's correctness
      (as opposed to mere line coverage, which any real-pack_context invocation would satisfy)
      unverified by a named test. This is the kind of gap likely to surface as rework at
      sk-review time when the squad checks acceptance-scenario-to-test traceability and finds
      Acceptance Scenario 5 has no test note.
    remediation: >
      Add an explicit sub-bullet under IC-01's test-affected-surfaces for
      test_mission_type_repository.py naming a dedicated project-layer steps-only-projection test
      case (mirroring the org-tier NFR-001 case but pointing pack_context.repo_root at a synthetic
      project root with its own .kittify/missions/mission_types/<id>.yaml + mission-steps/<id>/
      tree), explicitly tied to spec.md Acceptance Scenario 5 — either as a second NFR-001-class
      case or as a SC-001/AS-5-labeled addition — so the WP-implementer and the pre-merge squad
      have a named, traceable check for the project layer distinct from "org-tier (or
      project-tier), pick one."
    dedup_note: "No duplicate — verify-group-only finding."
