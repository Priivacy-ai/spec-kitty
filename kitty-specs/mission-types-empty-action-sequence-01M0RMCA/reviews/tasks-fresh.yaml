findings:
  - id: TASKS-FRESH-001
    lens: debugger-debbie / structural-fix-planning
    severity: 4
    title: T004 step 4's NFR-004 call-count spy uses a mock-binding shape that raises TypeError, not a passing assertion
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T004, step 4 (new in fix round aad047cd0)"
      - code: "src/doctrine/missions/mission_step_repository.py:291 (`def resolve_all_for_mission_type(self, mission_type_id, pack_context=None)` — a normal instance method, not static/classmethod)"
    claim: >
      T004 step 4 (added by aad047cd0 to close TASKS-VERIFY-004) instructs: wrap
      `doctrine.missions.mission_step_repository.MissionStepRepository.resolve_all_for_mission_type`
      with `unittest.mock.patch(..., wraps=MissionStepRepository.resolve_all_for_mission_type)` — i.e.
      patch the *class* attribute, with `wraps=` set to the *unbound* function object — then call it
      through the normal instance call site (`MissionTypeRepository`'s seam calls
      `MissionStepRepository.default().resolve_all_for_mission_type(mission_type_id,
      pack_context=pack_context)`). Reproduced live in this checkout: `unittest.mock.Mock`/`MagicMock`
      is not a descriptor, so patching a class-level method this way and then invoking it via an
      *existing instance* does NOT bind `self` — the mock receives only
      `(mission_type_id, pack_context=...)`, and forwards exactly those positional/keyword args to the
      unbound `wraps` target, which still expects `self` as its first parameter. This raises
      `TypeError: resolve_all_for_mission_type() missing 1 required positional argument: 'x'`-shaped
      errors (verified with a minimal repro mirroring the exact same instance-method + class-level
      `wraps=` shape: `patch("fakemod.Foo.bar", wraps=Foo.bar)` then `instance.bar(1, y=2)` raises
      `TypeError: Foo.bar() missing 1 required positional argument: 'x'`). As literally written, T004
      step 4's "call-count spy" does not produce a passing assertion at all — it breaks execution
      before any assertion is reached, contradicting the step's own framing of this as "evidence" that
      "closes" NFR-004. Since the same test method must still pass its pre-existing action_sequence
      parity assertions (step 1) for T004 to be considered done, an implementer following step 4
      literally will hit this TypeError and be forced to debug/redesign the mock, which is exactly the
      kind of rework this review pass exists to catch before it reaches implementation.
    remediation: >
      Either (a) patch the specific instance `MissionStepRepository.default()` returns, using a
      *bound* method as the wraps target — e.g.
      `instance = MissionStepRepository.default(); unittest.mock.patch.object(instance,
      "resolve_all_for_mission_type", wraps=instance.resolve_all_for_mission_type)` — so the mock is
      only installed on that one instance and `wraps` receives an already-bound callable; or (b) add
      `autospec=True` to the class-level `patch(...)` call, which makes `unittest.mock` synthesize a
      properly self-binding autospec'd mock; or (c) wrap the call inside a small `side_effect` lambda
      that explicitly threads `self`. Update T004 step 4's instruction text to name one of these
      shapes explicitly rather than the bare class-attribute `wraps=` form.

  - id: TASKS-FRESH-002
    lens: debugger-debbie / structural-fix-planning
    severity: 2
    title: T009 step 2's FR-005/C-001 line-scoped self-check range (157-174) does not span _load()'s full body (144-176)
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T009, step 2 (new in fix round aad047cd0)"
      - code: "src/doctrine/missions/mission_type_repository.py:144-176 (`_load()`'s full def-to-return span; the WP's own call-site citation at line 165 is correct)"
    claim: >
      T009's new step 2 (added by aad047cd0 to close TASKS-VERIFY-003) turns a previously-descriptive
      citation ("`_load()` line 157–174, call site line 165" — already present pre-fix-round in
      Definition of Done / Reviewer Guidance) into a literal, mechanical gate: "confirm no hunk's line
      range overlaps `_load()`'s body (lines 157–174, call site line 165) — every hunk in this file's
      diff must fall outside that range." Verified live against this checkout:
      `MissionTypeRepository._load()` actually spans lines 144 (`def _load(...)`) through 176
      (`return index`), i.e. lines 144-156 (signature, docstring, the `_yaml = YAML(...)` /
      `index = {}` / `if not directory.is_dir(): return index` setup) and line 176 itself
      (`return index`) are part of the function but fall OUTSIDE the checked 157-174 range. A
      hypothetical accidental edit confined to just the signature or docstring (e.g. lines 144-153)
      would produce a diff hunk that, with standard 3-line context, spans roughly 141-147/141-156 —
      entirely outside 157-174 — and so would NOT be flagged as an FR-005/C-001 violation by this
      self-check as literally scoped, even though `_load()` is supposed to have zero diff. (Line-number
      drift from T003's own edits was checked and ruled out — all of T003's signature/call-site edits
      fit within this repo's 164-char ruff line-length limit and stay single-line, so 157-174 is not
      stale from that cause; the range is simply narrower than the function it's meant to bound.)
    remediation: >
      Widen the checked range in T009 step 2 (and, for consistency, in the pre-existing Definition of
      Done / Reviewer Guidance citations) to the function's actual span, `_load()` lines 144-176
      (def-to-return), so the self-check's "every hunk must fall outside that range" guarantee actually
      covers the whole function, not just its loop body.

