schema: review-findings/v1
complete: true
phase: spec
lens_group: fresh
mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: SPEC-FRESH3-001
    lens: architectural-boundary-conformance
    severity: 4
    title: "FR-002 and FR-003 add new pack_context parameters to the same doctrine-layer file but, unlike FR-001, never pin their type to `_PackContextLike` — leaving the exact PackContext-import violation this round just fixed for FR-001 open for the next two functions in the same chain"
    evidence:
      - artifact: "spec.md § Functional Requirements, FR-001 (this round's fix): explicitly requires `pack_context: _PackContextLike | None = None`, with a full paragraph on why importing `charter.pack_context.PackContext` into this doctrine-layer file would be an illegal upward import"
      - artifact: "spec.md § Functional Requirements, FR-002: \"`_load_layered_mission_type_file` ... forward the resolving layer's real `PackContext` into the projection seam\" — no type is specified for the new parameter, and the word used is `PackContext`, not `_PackContextLike`"
      - artifact: "spec.md § Functional Requirements, FR-003: \"an optional `pack_context` parameter I can forward\" — again no type specified"
      - code: "src/doctrine/missions/mission_type_repository.py:313 — `_load_layered_mission_type_file(yaml_file: Path) -> MissionType` currently has NO pack_context parameter at all (FR-002 adds a brand-new one, same as FR-001 added one to `_inject_projected_fields`)"
      - code: "src/doctrine/missions/mission_type_repository.py:359 — `scan_mission_types_dir(directory: Path) -> list[MissionType]` currently has NO pack_context parameter at all (FR-003 adds a brand-new one)"
      - code: "src/doctrine/missions/mission_step_repository.py:44-45 — the `_PackContextLike` Protocol's own docstring: \"Replaces the `TYPE_CHECKING` import of `charter.pack_context.PackContext` (C-004: doctrine must not import from charter)\" — confirming even a TYPE_CHECKING-only import of the concrete class is treated as a violation in this codebase, not just a runtime import"
      - artifact: "kitty-specs/mission-types-empty-action-sequence-01M0RMCA/reviews/spec-fresh-2.yaml SPEC-FRESH2-001 — the finding this round's fix (commit 5f36396e6) addressed, which flagged exactly this mistake for FR-001 alone"
    claim: >
      This fix round corrected FR-001's parameter type from `PackContext | None`
      to `_PackContextLike | None` specifically because a doctrine-layer file
      importing `charter.pack_context.PackContext` (even under TYPE_CHECKING)
      violates the `kernel <- doctrine <- charter` tier order pinned by
      `tests/architectural/conftest.py:90`. But `_load_layered_mission_type_file`
      (FR-002) and `scan_mission_types_dir` (FR-003) are two more functions in
      the identical doctrine-layer file (`mission_type_repository.py`) that
      this mission is adding brand-new `pack_context` parameters to for the
      first time — and FR-002's own text says the loader should "forward the
      resolving layer's real `PackContext`", which reads exactly like the
      literal-type instruction that caused FR-001 to need three review rounds
      to fix. Neither FR-002 nor FR-003 states that its new parameter must
      also use the `_PackContextLike` structural Protocol rather than the
      concrete `charter.pack_context.PackContext` class. A WP-implementer
      who takes FR-002's "forward ... real `PackContext`" literally and adds
      `pack_context: PackContext | None = None` to `_load_layered_mission_type_file`
      (requiring an import of `charter.pack_context.PackContext`, even only
      for typing) reproduces the identical architectural-boundary violation
      this round's fix was written to eliminate — just one function over.
      This is a live gap, not a stylistic one: this mission's own C-007
      groups `_inject_projected_fields`, `_load_layered_mission_type_file`,
      `scan_mission_types_dir`, and `resolve_layered_mission_types` together
      as the four functions in scope, so the typing rule that now applies
      correctly to the first of the four is silently absent from the spec
      text governing the next two.
    remediation: >
      Add the same explicit typing directive used in FR-001 to FR-002 and
      FR-003: state that `_load_layered_mission_type_file`'s and
      `scan_mission_types_dir`'s new `pack_context` parameters must also be
      typed `_PackContextLike | None = None` (or `_PackContextLike | None`,
      per each function's own optionality), referencing the same
      `mission_type_repository.py:412` precedent and the same
      kernel<-doctrine<-charter tier-order rationale — either inline in each
      FR row, or once as a shared note (e.g. in C-007 or a new short
      constraint) that applies uniformly to every function in the four-
      function chain, so the type-correctness fix does not have to be
      independently rediscovered per function across further review rounds.
  - id: SPEC-FRESH3-002
    lens: terminology-consistency
    severity: 2
    title: "\"C-007-retained\" (quoted from the code's docstring) and this spec's own C-007 (blast radius) are two unrelated things sharing one identifier inside the same document"
    evidence:
      - artifact: "spec.md § Summary/Clarifications, line ~25: \"`_inject_projected_fields`'s own docstring calls the `action_sequence` raw-YAML fallback ... 'C-007-retained, transitional'\""
      - artifact: "spec.md § Edge Cases, line ~66: \"The existing **C-007-retained fallback** (`projected_sequence or raw.get(\"action_sequence\")`) applies unchanged\" — used again as a standing term, not re-flagged as a quotation"
      - artifact: "spec.md § Constraints, C-007: \"Blast radius bounded to one file, four functions, plus their tests\" — this document's own, unrelated definition of the same three-character identifier"
      - code: "src/doctrine/missions/mission_type_repository.py:220-221 — the actual docstring text: \"**Transitional fallback (``action_sequence`` only, C-007-retained):**\" — confirmed this label is borrowed verbatim from the code (a different mission's constraint numbering), not authored by this spec"
    claim: >
      This spec.md defines its own C-007 ("blast radius bounded to one file,
      four functions"). Independently, it quotes and then reuses the code's
      own docstring phrase "C-007-retained" (referring to a constraint from
      a different, prior mission that authored that docstring) to describe
      the raw-YAML fallback behavior. The first occurrence (Summary/
      Clarifications) clearly attributes it as a quotation from the code, but
      the second occurrence (Edge Cases) reuses "C-007-retained fallback" as
      a bare descriptive term without re-attributing it, in a document that
      by then has already introduced its own, semantically unrelated C-007.
      A reader who has internalized this spec's C-007 as "blast radius" and
      encounters "C-007-retained fallback" in the Edge Cases section could
      plausibly (mis)read it as "the fallback retained per constraint C-007",
      which makes no sense against the blast-radius definition — a
      terminology collision, not a functional defect.
    remediation: >
      In the Edge Cases bullet (and anywhere else "C-007-retained" appears
      as a bare term after its first quoted introduction), either drop the
      borrowed label entirely (just describe the fallback behavior in prose)
      or explicitly re-flag it as a quotation each time, e.g. "the fallback
      the code's own docstring labels 'C-007-retained' (a different
      mission's constraint, not this spec's C-007)".
