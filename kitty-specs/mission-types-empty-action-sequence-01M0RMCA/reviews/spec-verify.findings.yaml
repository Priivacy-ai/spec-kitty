schema: review-findings/v1
complete: true
phase: spec
lens_group: verify
mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: SPEC-VERIFY-001
    lens: mission-derived (red-first testability of NFR-001/SC-004)
    severity: 3
    title: SC-004's "verified ... during review" names no owning phase or actor, so the stash/revert obligation can silently go unperformed
    evidence:
      - artifact: "spec.md § Success Criteria, SC-004 (line 122): \"verified by running it against a git stash/revert of the fix during review, not merely asserted.\""
      - artifact: "spec.md § NFR-001 (line 91): states the FAIL/PASS obligation but likewise names no phase/actor"
      - code: "src/doctrine/missions/mission_type_repository.py:209-252 (_inject_projected_fields, confirmed current pack_context=None hardcode at line 245) — the whole fix is bounded to this one file per C-007, so a literal 'git stash' of the fix is well-defined and mechanically actionable"
    claim: >
      grep across spec.md shows "during review" / "stash" / "revert" appears exactly once (SC-004) and nowhere
      else names which phase or role actually executes the stash/revert/rerun sequence. This mission's own
      workflow has at least two candidate "review" points (the WP-implementer's own reviewer during
      sk-implement, and the pre-merge R1-R3 squad during sk-review) plus, per this squad's own charter
      standing order #4/#9-adjacent framing, a distinct expectation that red-first reproduction is witnessed
      at implementation time, not asserted in the PR description. Without naming which of these actually runs
      the stash/unstash/rerun cycle, each phase can reasonably assume the other already did it, and the
      concrete check degrades into exactly the "merely asserted" outcome SC-004 says it must not be — which
      is the failure mode this squad's own charter standing order #9 (and the general "test that still passes
      with the change reverted is a severity-4 finding at review time, not coverage" instruction) exists to
      catch before merge.
    remediation: >
      Add one sentence to SC-004 (or a new Constraint, e.g. C-008) naming the concrete owner and moment:
      e.g. "The WP-implementer authoring NFR-001's test must, before marking the WP done, `git stash` the
      mission's changes to mission_type_repository.py, rerun the new test and confirm it fails with the
      pre-fix None/[] result, `git stash pop`, and rerun to confirm it passes — and must record both runs
      (or their output) in the mission's approach/design-decisions tracer file so the pre-merge squad can
      verify the claim was witnessed rather than re-deriving it from scratch."

  - id: SPEC-VERIFY-002
    lens: baseline honesty
    severity: 2
    title: SC-005's ~23/2 baseline citation is real but has zero overlap with the two files SC-005 actually runs, and the spec gives no concrete method to establish that
    evidence:
      - artifact: "spec.md § Success Criteria, SC-005: \"pytest tests/doctrine/missions/test_mission_type_repository.py tests/runtime/test_runtime_seam.py passes in full post-fix, with no newly-introduced red beyond the pre-existing ~23 known-red-test / 2-error baseline already on main (issue #3284...) — any red in this run must be individually triaged as pre-existing or mission-introduced, never waved through\""
      - artifact: "GitHub issue #3284 (Priivacy-ai/spec-kitty), fetched via gh issue view — its own \"Failure groups\" breakdown: tests/charter/test_config_stem_parity.py, tests/doctrine/drg/test_reachability.py, tests/doctrine/drg/migration/test_extractor_projection.py, runtime daemon/timeout tests, console ANSI tests, CI route-filter probe, mission template resolution, compact charter contract, commit-helper safe-commit, cached-venv E2E path tests, sync teardown errors, and the #2782 regression — none under tests/doctrine/missions/ or tests/runtime/test_runtime_seam.py"
    claim: >
      SC-005 correctly acknowledges the repo-wide ~23-known-red/2-error baseline (issue #3284) exists and
      commits to per-item triage rather than assuming full green — satisfying the letter of the baseline-honesty
      lens. But #3284's own failure-group list, verified directly, contains no test from either file SC-005
      actually scopes its run to. So in practice, any red produced by this exact `pytest` invocation is
      presumptively mission-introduced, not "possibly part of the #3284 baseline" — yet the spec's phrasing
      treats both outcomes as live possibilities to triage without saying how ("individually triaged as
      pre-existing or mission-introduced" implies a real chance of the former in this narrow scope, when the
      cited baseline gives no basis for that). Absent a named mechanism, an implementer facing red output has
      no concrete way to tell "pre-existing" from "mission-introduced" other than re-deriving it from scratch,
      which is exactly the gesture-not-mechanism gap the baseline-honesty lens is checking for.
    remediation: >
      Add a sentence to SC-005 naming the concrete triage mechanism for this narrow scope, e.g.: "Because
      issue #3284's own failure-group breakdown contains no test under tests/doctrine/missions/ or
      tests/runtime/test_runtime_seam.py, any red produced by this SC-005 command is presumed
      mission-introduced by default; to confirm, run the identical `pytest` invocation against the mission's
      unmodified base commit — if it is also red there on the same test id, it is pre-existing and must be
      logged against a tracked issue (or #3284 itself); if it is green there, the red is mission-introduced
      and must be fixed before merge."

findings_meta:
  lenses_with_no_findings:
    - falsifiability: >
        All 5 Acceptance Scenarios under User Story 1 and SC-001, SC-003, SC-004 state a concrete,
        non-vacuous observable check (an exact expected list, an absence-of-exception assertion, a
        byte-identical-equality assertion against a named existing test-class pattern, or a stash/revert
        pass-fail pair). SC-002's "the error's remaining trigger set is exactly X, never Y" is a universal
        claim not exhaustively provable by any finite test, but it is operationalized by the concrete AS1/AS2
        tests plus the genuinely-empty-projection edge case already in spec.md § Edge Cases — not flagged as
        a standalone finding.
    - silent-success: >
        spec.md § Edge Cases explicitly names this repo's dominant failure mode by name ("silent success is
        this repo's dominant failure mode — this fix moves a defect class from 'silently wrong' to 'either
        correct or loudly wrong'") and, case by case, ties every edge case (genuinely-empty projection,
        mid-flight missions, malformed/unreadable step trees, the _load() built-in-only caller, the
        pack_manager.py:865 call site) back to existing loud-fail behavior with no new silent-None/[]
        path introduced. No gap found.

verification_notes: >
  Empirically confirmed against this checkout (not merely trusted from the spec): (1)
  src/doctrine/missions/mission_type_repository.py:209 _inject_projected_fields has no pack_context
  parameter today and hardcodes pack_context=None at its call into resolve_all_for_mission_type at line 245
  (spec cites line 244 — a one-line-off citation, immaterial, not logged as a separate finding given
  severity-1 threshold and no implementation effect). (2) _load_layered_mission_type_file (line ~313) calls
  _inject_projected_fields with no pack_context at all. (3) resolve_layered_mission_types (line ~410) does
  correctly thread pack_context to locate org/project mission_types/*.yaml files (the #3397 roster fix) but
  its calls to scan_mission_types_dir (lines ~525, ~530) pass no pack_context onward — confirming the
  projection-seam gap is real and distinct from the roster-layering fix. (4) project_action_sequence
  (src/doctrine/missions/step_projection.py:69) returns [] on an empty steps iterable, and
  MissionType._validate_action_sequence (src/doctrine/missions/models.py:272-282) is absence-tolerant (None
  passes model validation; only a non-None-but-empty list raises), confirming the pre-fix org-tier fixture
  described in AS1 would resolve action_sequence=None today (not raise at model-build time), with
  MissionTypeEmptyActionSequenceError instead surfacing at the later _resolve_action_slot read boundary —
  exactly matching NFR-001/SC-004's "must reproduce today's None/[] result" claim. (5) Confirmed both cited
  test classes exist verbatim: TestGoldenParityUnaffectedByPackContextThreading in
  tests/runtime/test_runtime_seam.py and TestLayeredMissionTypesCacheKeyAndClear in
  tests/doctrine/missions/test_mission_type_repository.py. Could not execute pytest in this environment (no
  pytest/deps installed in the available Python/uv environment) to run the actual stash/revert cycle
  end-to-end; verification here is by direct code reading of the current (pre-fix) call graph, which is
  sufficient to confirm the mechanical claim in NFR-001/SC-004 is sound.
