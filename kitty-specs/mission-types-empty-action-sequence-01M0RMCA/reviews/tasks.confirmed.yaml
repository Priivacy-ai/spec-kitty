  evidence:
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtask T003, step 5 (lines 298-300)"
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtask T009, step 1 (lines 458-466)"
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Reviewer Guidance (line 552)"
  - code: src/doctrine/missions/mission_type_repository.py:157-174 (MissionTypeRepository._load(), the
      body FR-005/C-001 pins as untouched)
  claim: 'FR-005/C-001 requires MissionTypeRepository._load() (lines 157-174, call site line 165) to have
    zero diff. T003 step 5 verifies this only via a prose instruction to the implementer ("verify after
    your edit that it still compiles with zero source change"); T009 step 1''s automated SC-006 diff-scope
    check is git diff --name-only-based, i.e. file-level only -- it confirms no new/unexpected FILES were
