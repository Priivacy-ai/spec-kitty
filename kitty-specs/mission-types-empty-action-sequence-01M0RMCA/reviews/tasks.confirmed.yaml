- id: TASKS-DECOMP-001
  lens: single-concern, reviewable in one sitting (concrete implementability)
  severity: 3
  title: T007's red-first witnessing recipe leads with a plain `git stash` that will stash nothing, given
    T002/T003's own commit-separation mandate guarantees both changes are already committed by the time
    T007 runs
  evidence:
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtask T007, step 1: \"`git stash`\
      \ the production-code changes to `mission_type_repository.py` from T003 \u2014 leave T002's new\
      \ test in place (it should already be committed separately, so stashing only the uncommitted-or-separately-committed\
      \ production diff; if both are committed, use `git stash` against a temporary revert of just the\
      \ fix commit, or `git diff`/`git apply -R` the fix commit's diff \u2014 whichever mechanism your\
      \ git history shape supports; the point is: test present, fix absent).\""
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtask T002, step 3: \"Commit this\
      \ test file change as its own, separate commit ... Do not combine this commit with any production-code\
      \ change.\""
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtask T003, step 8: \"Commit this\
      \ production-code change as its own commit(s), separate from T002's test commit.\""
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Reviewer Guidance: \"Confirm the\
      \ red-first test (T002) is in a separate commit from the production fix (T003), in that order, per\
      \ `git log`.\" \u2014 this reviewer-facing check independently confirms both commits are expected\
      \ to exist by review time, i.e. before/at T007's own moment in the WP's own T001\u2192T009 sequence."
  claim: "T003 (which runs before T007 in this WP's own numbered sequence) mandates committing the fix\
    \ as its own commit, and T002 already mandated committing the red-first test as its own, earlier,\
    \ separate commit. By the time T007 executes, the working tree is therefore guaranteed clean \u2014\
    \ both changes are committed, not merely staged or uncommitted. A bare `git stash` in that state stashes\
    \ nothing (there is no uncommitted diff to stash), so the primary instruction given in T007 step 1\
    \ will silently no-op rather than removing the fix. The subtask does flag this itself (\"if both are\
    \ committed, use `git stash` against a temporary revert...\") but only as a hedge appended after the\
    \ (non-functional, in this WP's own guaranteed sequencing) primary instruction, and offers three different\
    \ fallback mechanisms (\"temporary revert\", \"git diff\"/\"git apply -R\") without picking one \u2014\
    \ \"whichever mechanism your git history shape supports\" leaves the actual git recipe to be improvised\
    \ at implementation time. This is exactly the SC-004/T007 moment plan.md calls \"not merely asserted\"\
    \ and requires to be actually witnessed and recorded \u2014 an implementer who runs the literal first\
    \ instruction, sees `git stash` report \"No local changes to save,\" and does not immediately recognize\
    \ the no-op, risks recording a false \"witnessed\" pass in the tracer file without ever having actually\
    \ reverted the fix.\n"
  remediation: 'Replace T007 step 1''s git-stash-first instruction with the one mechanism that is actually
    guaranteed to work given this WP''s own T002/T003 commit-separation mandate: `git revert --no-commit
    <fix-commit-sha>` (reverting exactly T003''s fix commit(s), leaving T002''s test commit''s changes
    in place), rerun the pinned test to confirm it fails, then `git revert --abort` (or `git reset --hard
    <fix-commit-sha>` if the revert was already committed) to restore the fix and rerun to confirm it
    passes. State this as the single primary recipe, not a "whichever works" menu, since the WP''s own
    sequencing already determines which mechanism applies.

    '
- id: TASKS-DECOMP-002
  lens: single-WP diagnostic honesty (mission-derived)
  severity: 2
  title: WP01's 9 subtasks / 564 lines sit above the tasks-outline template's 3-7-subtask/200-500-line
    target band (though under its 10-subtask/~700-line hard maximum) because four of the nine subtasks
    (T001, T007, T008, T009) are pure process/verification checkpoints with no code delta, three of which
    independently re-run the same two-file pytest invocation
  evidence:
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtasks T001 (\"Files: no code\
      \ files touched\"), T007 (\"Files: no new code files\"), T008 (\"Files: no new code files\"), T009\
      \ (\"Files: tracer files only, plus fixes ... if the gate self-check surfaces an issue\") \u2014\
      \ four of nine subtasks touch no owned code file under nominal execution."
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 T001 step 1 and \xA7 T008 step 1:\
      \ both run the identical command `pytest tests/doctrine/missions/test_mission_type_repository.py\
      \ tests/runtime/test_runtime_seam.py`, at the pre-fix and post-fix ends of the same WP respectively,\
      \ each recording results to the same tracer files as T007's separate stash/pop run."
  - artifact: "packs/built-in/missions/mission-steps/software-dev/tasks-outline/prompt.md \xA7 Work Package\
      \ Sizing Guidelines (lines 211-220): \"Target: 3-7 subtasks per WP \u2192 200-500 line prompts\"\
      \ / \"Maximum: 10 subtasks \u2192 ~700 line prompts\" / \"Split if ANY of these are true: More than\
      \ 10 subtasks / Prompt would exceed 700 lines / Multiple independent concerns mixed together / Different\
      \ phases or priorities mixed.\""
  claim: "Genuine assessment (not a rubber-stamp): none of WP01's split-mandatory triggers actually fire\
    \ \u2014 9 \u2264 10 subtasks, 564 \u2264 ~700 lines, and every subtask serves the single IC-01 seam\
    \ (no independent architectural concern is mixed in; T007's red-first witnessing and T009's gate self-check\
    \ are both charter-mandated checkpoints for *this* fix, not a second concern smuggled in). So this\
    \ is not a violation of the template's hard bounds, and plan.md's own \"PR shape\" argument (one small\
    \ diff in one file, reviewable in a sitting) holds independent of subtask count, since the actual\
    \ code diff a human reviews is unaffected by how many process checkpoints the WP prompt enumerates.\
    \ That said, the WP sits at the high end of both metrics specifically because T001 (full-suite baseline,\
    \ pre-any-change), T007 (stash/pop witness of the one new test), and T008 (full-suite rerun, post-fix,\
    \ triaged against T001) are three separately-numbered, separately-tracer-recorded checkpoints built\
    \ around what is substantively the same \"run this pytest invocation and record the result\" action\
    \ performed at three points in the timeline. They are not redundant in *purpose* (T001 catches pre-existing\
    \ baseline red across the whole two files; T007 specifically proves the new NFR-001 test pins the\
    \ defect via stash/pop; T008 catches any mission-introduced red anywhere in the two files, not just\
    \ the one new test) \u2014 but their mechanical overlap is real, and folding adjacent pairs would\
    \ not lose any required evidence.\n"
  remediation: "Not required for correctness (no split-mandatory trigger fires). If tighter density matching\
    \ the 3-7 target band is preferred, fold T001's baseline-capture into T002's step 1 (both are \"run\
    \ pytest, record to tracer, before any production-code change\") and fold T008's final full-suite\
    \ rerun into T009's step 1 (both are final-sweep verification before marking the WP done) \u2014 this\
    \ reduces the subtask count from 9 to 7 without dropping any required action or recorded evidence,\
    \ landing inside the template's target band rather than at the edge of its maximum.\n"
- id: TASKS-SEQ-001
  lens: Chokepoints called out
  severity: 2
  title: tasks.md/WP01 never inline the three-production-caller chokepoint that plan.md's Blast radius
    section identifies for resolve_layered_mission_types
  evidence:
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Objective / \xA7 Reviewer Guidance"
  - artifact: "plan.md \xA7 Blast radius on downstream workspaces (lines 345-411)"
  - code: charter/mission_type_profiles.py:976 (_resolve_action_slot)
  - code: src/specify_cli/cli/commands/charter/mission_type.py:87 (resolve_layered_roster)
  - code: src/specify_cli/cli/commands/_mission_type_audit.py:170 (_resolve_layered_roster)
  claim: "plan.md's \"Blast radius on downstream workspaces\" section names three distinct production\
    \ `src/` entry points (`_resolve_action_slot`, `resolve_layered_roster`, `_resolve_layered_roster`)\
    \ that all reach the fixed function (`resolve_layered_mission_types`) exclusively through this one\
    \ seam \u2014 a textbook chokepoint the plan explicitly reasons about (a threading bug \"would affect\
    \ all three identically rather than three independent surfaces\"). Neither tasks.md, wps.yaml, nor\
    \ WP01's Objective/Context/Risks/Reviewer Guidance sections name these three callers or the word \"\
    chokepoint\"/\"shared seam\" \u2014 a grep for `chokepoint`, `blast radius`, `_resolve_action_slot`,\
    \ `resolve_layered_roster`, `_resolve_layered_roster` across tasks.md, wps.yaml, and the WP01 prompt\
    \ returns zero matches. WP01 does tell the implementer to \"read spec.md and plan.md in full,\" which\
    \ mitigates this for an implementer who follows that instruction to the letter, but the WP's own \"\
    Reviewer Guidance\" checklist \u2014 the section a reviewer is most likely to work from directly without\
    \ re-deriving plan.md's blast-radius analysis \u2014 has no bullet instructing the reviewer to confirm\
    \ post-fix behavior at any of the three real production entry points, only at the golden-parity test\
    \ on `resolve_layered_mission_types` itself. Since plan.md already argues the golden-parity test transitively\
    \ covers all three callers, this is not a correctness gap, but it is a traceability/reviewability\
    \ gap: a reviewer working strictly from WP01 would not learn that this seam is a chokepoint for CLI/charter\
    \ surfaces (`charter mission-type list --json`, `mission-type show`, `doctor`'s mission-type audit)\
    \ unless they separately open plan.md's Blast radius section.\n"
  remediation: "Add one sentence to WP01's Context or Reviewer Guidance section naming the three production\
    \ callers (or at minimum stating \"this seam is a chokepoint for three production src/ callers \u2014\
    \ see plan.md's Blast radius section for the full list and why T004's golden-parity test transitively\
    \ covers all three\") so a reviewer working only from the WP prompt still sees the shared-seam framing\
    \ without needing to cross-reference plan.md independently.\n"
- id: TASKS-VERIFY-001
  lens: Per-AC test strategy concrete
  severity: 3
  title: Acceptance Scenario 2 (governed entry point does not raise) has no concrete named test subtask
  evidence:
  - artifact: "spec.md \xA7 User Story 1, Acceptance Scenarios, item 2 (line 60)"
  - artifact: "tasks/WP01-thread-pack-context-projection-seam.md \xA7 Subtask T002 (lines 228-269), T005\
      \ (lines 350-377), T006 (lines 378-398)"
  - code: src/charter/mission_type_profiles.py:916 (_resolve_action_slot def)
  - code: tests/runtime/test_runtime_seam.py:128 (_resolve_via_seam helper already exists in the owned
      test file, calls resolve_mission_type_context -> _resolve_action_slot)
  claim: 'Acceptance Scenario 2 requires that a governed entry point reaching this seam through resolve_layered_mission_types
    (named explicitly: charter.mission_type_profiles._resolve_action_slot, underlying `charter activate
    mission-type` and `agent mission create --mission-type`) succeeds and does not raise MissionTypeEmptyActionSequenceError
    for the org-tier steps-only-projection type. Every new/extended test WP01 actually instructs (T002''s
    NFR-001 red-first case, T005''s project-tier case, T006''s explicit-action_sequence case) calls resolve_layered_mission_types(...)
    directly and asserts on its return value -- none of them exercise _resolve_action_slot / resolve_mission_type_context
    / `charter activate mission-type` for an org/project steps-only type. Since MissionTypeEmptyActionSequenceError
    is literally the exception this mission''s issue reproduction cites ("every governed entry point then
    raises"), and _resolve_via_seam already exists as a ready-made helper in the very test file WP01 owns
    (tests/runtime/test_runtime_seam.py), the omission is a genuine, checkable coverage gap for a named
    Acceptance Scenario, not merely a documentation nit. (The lower-level fix in resolve_layered_mission_types
    is well-pinned by T002, so this is unlikely to produce a *wrong* implementation -- but it leaves AC2
    unverified end-to-end, which a reviewer following spec.md''s own Acceptance Scenarios list would flag.)

    '
  remediation: 'Add a named subtask (or extend T002) that calls resolve_mission_type_context / _resolve_action_slot
    (via the existing _resolve_via_seam pattern in tests/runtime/test_runtime_seam.py, patching charter.mission_type_profiles.existing_mission_types
    and PackContext.from_config the same way TestGoldenParityUnaffectedByPackContextThreading already
    does) for the same org-tier steps-only fixture T002 constructs, and asserts it succeeds without raising
    MissionTypeEmptyActionSequenceError -- closing the literal AC2 claim, not just the lower-level resolve_layered_mission_types
    return value.

    '
- id: TASKS-VERIFY-002
