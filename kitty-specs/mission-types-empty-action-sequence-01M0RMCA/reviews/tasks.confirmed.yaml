      across 5296 lines; no #3284 entry, no ''23 known-red'' text)'
  - artifact: 'gh issue view 3284 (confirmed OPEN, title: ''main full suite has 23 untracked failures
      and 2 errors after bootstrap prewarm'')'
  claim: 'T001 step 3 instructs: "Cross-check any red test id you observe against SPEC-KITTY-LEDGER.md''s
    #3284 entry (~23 known-red / 2-error baseline on main) -- note explicitly whether it''s already enumerated
    there or is new-but-pre-existing." I verified SPEC-KITTY-LEDGER.md (the canonical ledger this repo''s
    own top-level CLAUDE.md/AGENTS.md direct every agent to read) contains zero mentions of issue #3284
    -- no entry, no breakdown, no "23 known-red" text anywhere in its 5296 lines. The actual breakdown
    lives only in the GitHub issue itself (gh issue view 3284, confirmed OPEN with the matching "23...failures
    and 2 errors" title). spec.md''s own SC-005 (line 124) already hints at this ambiguity -- it cites
    "issue #3284, SPEC-KITTY-LEDGER.md" as a combined parenthetical and separately says "#3284''s own
    breakdown ... does not enumerate either of these two test files" -- but WP01''s T001 flattens this
