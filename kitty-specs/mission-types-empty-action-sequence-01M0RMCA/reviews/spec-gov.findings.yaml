schema: review-findings/v1
complete: true
phase: spec
lens_group: gov
mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: SPEC-GOV-001
    lens: decision-record-fidelity
    severity: 3
    title: "Decision 1's \"eight .action_sequence call sites\" evidence is miscounted against the actual checkout"
    evidence:
      - artifact: "spec.md § Clarifications › Decision 1 — Evidence (third bullet)"
      - code: "src/charter/mission_type_profiles.py:272"
      - code: "src/charter/mission_type_profiles.py:955"
      - code: "src/charter/mission_type_profiles.py:985"
      - code: "src/charter/mission_type_profiles.py:994"
      - code: "src/specify_cli/cli/commands/mission_type.py:1469"
      - code: "src/specify_cli/cli/commands/mission_type.py:1479"
      - code: "src/runtime/next/decision.py:614"
      - code: "src/runtime/next/runtime_bridge_composition.py:188"
      - code: "src/runtime/next/runtime_bridge_composition.py:325"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:158"
      - code: "src/specify_cli/cli/commands/charter/activate.py:183"
      - code: "src/specify_cli/cli/commands/charter/activate.py:205"
    claim: >
      The spec states action_sequence is "read via direct .action_sequence attribute access
      at eight separate call sites across src/charter/mission_type_profiles.py (×3),
      src/specify_cli/cli/commands/mission_type.py, src/runtime/next/decision.py,
      src/runtime/next/runtime_bridge_composition.py (×2), and
      src/specify_cli/cli/commands/charter/{activate,mission_type}.py." A first-hand read of
      every named file finds two problems. First, the "×3" for mission_type_profiles.py is
      wrong: only lines 985 and 994 are real `.action_sequence` attribute accesses; lines 272
      and 955 are docstring/comment prose that merely *mentions* `mission.action_sequence` in
      backticks, not code. Second, the two files cited without a multiplier
      (specify_cli/cli/commands/mission_type.py and charter/activate.py) each actually contain
      TWO real accesses, not one (mission_type.py:1469 and :1479; activate.py:183 and :205).
      Re-deriving the spec's own stated per-file breakdown sums to nine, not eight, and the
      true first-hand count across the six named files is ten. This is exactly the kind of
      evidence the Clarifications section claims was "resolved with direct code evidence" and
      "verified first-hand" — the undercount weakens that claim's credibility even though it
      does not change Decision 1's conclusion (action_sequence is still a first-class,
      multiply-consumed model field with no migration authorized).
    remediation: >
      Recount the real `.action_sequence` attribute-access call sites (exclude docstring/prose
      mentions) and correct the Decision 1 evidence bullet to the accurate total and per-file
      breakdown (mission_type_profiles.py ×2, specify_cli/cli/commands/mission_type.py ×2,
      runtime/next/decision.py ×1, runtime/next/runtime_bridge_composition.py ×2,
      specify_cli/cli/commands/charter/mission_type.py ×1,
      specify_cli/cli/commands/charter/activate.py ×2 — ten total), or drop the precise count
      and describe the call sites only by file, since C-002's actual enforcement mechanism is
      the C-007 blast-radius file list, not this count.

  - id: SPEC-GOV-002
    lens: directive
    severity: 1
    title: "Two line-number citations in the Summary are off by one against the current checkout"
    evidence:
      - artifact: "spec.md § Summary (paragraph 1)"
      - code: "src/doctrine/missions/mission_type_repository.py:244-245"
      - code: "src/doctrine/missions/mission_type_repository.py:209-253"
    claim: >
      The Summary states the hardcoded pack_context=None call is "currently line 244" — in
      this checkout it is line 245 (`.resolve_all_for_mission_type(mission_type_id,
      pack_context=None)`); line 244 is `MissionStepRepository.default()`, the line above it.
      Separately, the Summary cites `_inject_projected_fields()` as spanning "currently lines
      209–252"; the function's closing `return payload` is at line 253, one past the cited
      range. Both are consistent with the issue's own quoted code block (which shows the same
      243-247 numbering this checkout has), so they were likely accurate at issue-filing time
      and have drifted by a line since, or were transcribed with an off-by-one. The "currently"
      qualifier already signals awareness of drift, so this has no effect on implementation —
      a reader locating the function via `def _inject_projected_fields` will find it regardless.
    remediation: >
      Re-point the two citations to line 245 (the call) and 209–253 (the function span) to
      match this checkout, or drop the exact end-line/call-line numbers and cite only the
      function name plus the surrounding docstring quotes already used elsewhere in the
      section (which are independently accurate).

  - id: SPEC-GOV-003
    lens: decision-record-fidelity
    severity: 3
    title: "C-002 and C-003 restate Decision 1/2 as prose with no explicit, checkable acceptance criterion tying them to the C-007 blast-radius bound"
    evidence:
      - artifact: "spec.md § Constraints › C-002"
      - artifact: "spec.md § Constraints › C-003"
      - artifact: "spec.md § Constraints › C-007"
      - artifact: "spec.md § Success Criteria (SC-001..SC-005)"
    claim: >
      C-002 ("does not touch any of the eight existing .action_sequence attribute-access call
      sites") and C-003 ("does not change charter activate mission-type <T>'s behavior...")
      are each pure prose assertions with no accompanying test, SC row, or explicit
      cross-reference to an enforcement mechanism. The only thing in the spec that actually
      bounds the diff to make C-002/C-003 true is C-007's file-list ("one file, four functions,
      plus their tests"), but no SC or NFR converts that file-list into a checkable acceptance
      criterion (e.g. "the mission's diff touches only
      src/doctrine/missions/mission_type_repository.py and the two named test files, verified
      by `git diff --name-only` against the base branch during review"). As written, a reviewer
      who trusts C-002/C-003's prose without independently re-deriving the C-007 connection has
      no test or automated check that would catch a WP that, say, folded a "small" fix into
      charter/mission_type_profiles.py's `_resolve_action_slot` (touching one of the real
      action_sequence call sites, or the activation-gate logic near
      MissionTypeEmptyActionSequenceError) alongside the intended change. This is the same
      "a trigger nobody evaluates is a comment, not a control" pattern the charter's own
      architectural-gate-discipline standing order (and SK-82, cited elsewhere in this same
      spec) warns about.
    remediation: >
      Add an explicit SC or NFR row that makes the C-007 blast-radius bound checkable —
      e.g. "SC-006: `git diff --name-only main...HEAD` for this mission's PR contains only
      src/doctrine/missions/mission_type_repository.py,
      tests/doctrine/missions/test_mission_type_repository.py, and
      tests/runtime/test_runtime_seam.py; any other path in the diff is a C-002/C-003/C-007
      violation" — and have C-002/C-003 reference that SC directly instead of standing alone
      as unlinked prose.
