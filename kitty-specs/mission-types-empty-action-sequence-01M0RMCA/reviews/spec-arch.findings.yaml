findings:
  - id: SPEC-ARCH-001
    lens: MISSION-DERIVED (four-function seam completeness and call-graph accuracy)
    severity: 3
    title: "FR-005 demands an explicit code edit to a fifth caller (`_load()`) that C-007 and the Edge Cases text both frame as unchanged/out of bounds"
    evidence:
      - artifact: "spec.md § Requirements > Functional Requirements, FR-005"
      - artifact: "spec.md § Constraints, C-007 (\"Blast radius bounded to one file, four functions\")"
      - artifact: "spec.md § Edge Cases (\"What happens when a caller other than resolve_layered_mission_types or _load_layered_mission_type_file invokes _inject_projected_fields directly without a pack_context?\")"
      - code: "src/doctrine/missions/mission_type_repository.py:165 — MissionTypeRepository._load() calls `_inject_projected_fields(raw, mission_type_id=yaml_file.stem)` with NO pack_context argument at all today (the parameter does not exist yet on the pre-fix signature)."
      - code: "src/doctrine/missions/mission_type_repository.py:209 — `_inject_projected_fields(raw: dict[str, Any], *, mission_type_id: str)`, the pre-fix signature FR-001 will add an optional pack_context parameter to."
    claim: >
      `_load()` (mission_type_repository.py:165) is a genuine fifth caller of `_inject_projected_fields`
      in the same file — verified by grep, it is the only other in-repo call site of that function besides
      `_load_layered_mission_type_file`. C-007 bounds the blast radius to exactly "one file, four functions"
      and lists only `_inject_projected_fields`, `_load_layered_mission_type_file`, `scan_mission_types_dir`,
      `resolve_layered_mission_types`; the Edge Cases section frames `_load()` as needing no change ("it must
      continue calling with pack_context=None deliberately" — i.e. same as today). But FR-005 requires `_load()`'s
      call to "keep passing `pack_context=None` explicitly and unconditionally" — and today it does not pass
      `pack_context` at all (the keyword doesn't exist on the current signature), so satisfying FR-005's literal
      wording requires an edit to `_load()`'s call site at line 165 to add the literal `pack_context=None` keyword
      argument once `_inject_projected_fields` gains the parameter. That is a touch to a fifth function/call site
      in the same file, contradicting C-007's "four functions" bound. If the parameter is optional and defaults to
      `None`, `_load()` behaves correctly with NO edit at all (relying on the default) — which is what "unchanged"
      literally means — but then FR-005's "explicitly" is not met by the diff, and FR-005's acceptance criterion
      has no test that distinguishes "explicit None" from "implicit/default None" (NFR-002's golden-parity test
      passes either way). An implementer following C-007 to the letter (skip `_load()`) and a reviewer holding
      FR-005 to the letter (demand the explicit literal) will disagree, causing rework inside the WP.
    remediation: >
      Either (a) drop the word "explicitly" from FR-005 and state plainly that `_load()`'s call site requires
      NO source change — the new `pack_context` parameter on `_inject_projected_fields` must default to `None`,
      and `_load()`'s existing zero-argument-for-pack_context call already satisfies FR-005/C-001 via that default
      — or (b) if an explicit literal really is wanted for readability/grep-ability, say so plainly in C-007 as
      a fifth, deliberately-trivial, no-behavior-change touch ("one file, four functions gain the parameter, plus
      one one-line no-op edit to `_load()` for explicitness") so C-007's scope count and FR-005's literal wording
      stop contradicting each other, and add an explicit assertion (e.g. inspecting the call via `inspect`/AST,
      or simply a source-grep in the test) if "explicitly" must be verifiably true rather than merely asserted.

  - id: SPEC-ARCH-002
    lens: Contracts (Decision 1 evidence accuracy)
    severity: 2
    title: "Decision 1's call-site count for `.action_sequence` attribute access is miscounted and internally inconsistent"
    evidence:
      - artifact: "spec.md § Clarifications > Decision 1, evidence bullet 2 (\"read via direct `.action_sequence` attribute access at eight separate call sites across `src/charter/mission_type_profiles.py` (×3), `src/specify_cli/cli/commands/mission_type.py`, `src/runtime/next/decision.py`, `src/runtime/next/runtime_bridge_composition.py` (×2), and `src/specify_cli/cli/commands/charter/{activate,mission_type}.py`.\")"
      - code: "src/charter/mission_type_profiles.py:985,994 — only 2 real `.action_sequence` attribute accesses (`mission.action_sequence`, `parent.action_sequence`), not 3."
      - code: "src/specify_cli/cli/commands/mission_type.py:1469,1479 — 2 real attribute accesses (`resolved.action_sequence`, `mt.action_sequence`), not the implied 1."
      - code: "src/specify_cli/cli/commands/charter/activate.py:183,205 — 2 real attribute accesses, plus src/specify_cli/cli/commands/charter/mission_type.py:158 — 1 more (the `{activate,mission_type}.py` group is really 3, not the implied 2)."
      - code: "src/runtime/next/decision.py:614 and src/runtime/next/runtime_bridge_composition.py:188,325 — matches spec's claim of ×1 and ×2 respectively."
    claim: >
      Re-grepping every file the spec names for `.action_sequence` (excluding docstrings/comments and the
      model's own internal `self.action_sequence` self-validator in models.py) gives a real total of 10
      call sites: mission_type_profiles.py×2 (not ×3), specify_cli/cli/commands/mission_type.py×2 (not ×1,
      implied by no multiplier), runtime/next/decision.py×1 (matches), runtime_bridge_composition.py×2
      (matches), charter/activate.py×2 + charter/mission_type.py×1 (3 total, not the ×2 implied by grouping
      the two files together with no per-file multiplier). None of this changes Decision 1's conclusion (there
      is still no `template_set`-style migration of `action_sequence`, and the count is still well above zero
      either way), so it does not change what gets implemented — but the "eight separate call sites" figure used
      as binding evidence for a design decision is wrong on this checkout, and per-file multipliers don't even
      sum to the stated total (3+1+1+2+2=9 or 10 depending on how the grouped clause is read, never 8).
    remediation: >
      Recount and correct the evidence bullet to the real total (10, or whatever a fresh `rg -n
      "\.action_sequence\b" src/` count yields at merge time) with accurate per-file multipliers, or drop the
      exact count and multipliers entirely in favor of "well over half a dozen call sites across N files" if
      precision isn't load-bearing for the decision — the conclusion doesn't depend on the exact number, so a
      vaguer but correct claim is safer than a precise but wrong one.
