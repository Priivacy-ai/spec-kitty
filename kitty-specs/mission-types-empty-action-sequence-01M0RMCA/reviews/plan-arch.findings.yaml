findings:
  - id: PLAN-ARCH-001
    lens: Blast radius
    severity: 4
    title: "Plan's Blast radius / IC-01 Risks sections claim 'exactly one production caller' of `resolve_layered_mission_types`, contradicted by two more live production call sites"
    evidence:
      - artifact: "plan.md § Implementation Concern Map / IC-01 Risks (lines 331-332, 336-338)"
      - artifact: "plan.md § Blast radius on downstream workspaces (lines 336-338: \"resolve_layered_mission_types has exactly one production caller today (_resolve_action_slot, underlying charter activate mission-type and agent mission create --mission-type)\")"
      - code: "src/charter/mission_type_profiles.py:976 — `_resolve_action_slot` calls `resolve_layered_mission_types(mission_types_dirs, pack_context)` (the caller the plan names)"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:87 — `resolve_layered_roster()` calls `resolve_layered_mission_types(mission_types_dirs, pack_context)` with a real `PackContext.from_config(repo_root)`, wired live into `charter_mission_type_list` (line 137) — the `spec-kitty charter mission-type list` CLI command. Not named by the plan."
      - code: "src/specify_cli/cli/commands/_mission_type_audit.py:170 — `_resolve_layered_roster()` calls `resolve_layered_mission_types(mission_types_dirs, pack_context)` with a real `PackContext.from_config(repo_root)`, wired into `doctor.py`'s mission-type audit CLI surface. Not named by the plan."
      - code: "src/doctrine/missions/mission_type_repository.py:23-31 — the module comment the plan cites as its source (\"the one production src/ caller per this file's own module comment\") is scoped to WP03/WP04's own historical framing (\"WP04 now calls it from ... so the dead-code gate has a live caller\"), not an exhaustive present-tense enumeration; it predates the later WP07 additions in `charter/mission_type.py` and `_mission_type_audit.py` (their own docstrings self-identify as \"WP07\", i.e. later work than the WP04 comment the plan trusted)."
    claim: >
      The plan's Blast radius section (a section this lens group is specifically charged with
      checking for concrete, evidenced reasoning rather than hand-waving) asserts twice that
      `resolve_layered_mission_types` has "exactly one production caller today" and uses that
      count to argue the regression/behavior-change surface is narrow. A direct grep of `src/`
      for `resolve_layered_mission_types` (including through its `charter.missions` re-export
      alias) shows at least three live production call chains reachable from real CLI commands:
      `_resolve_action_slot` (the one the plan names), `charter_mission_type_list` via
      `resolve_layered_roster` (`spec-kitty charter mission-type list`), and the mission-type
      audit CLI via `_mission_type_audit.py::_resolve_layered_roster` (wired through
      `doctor.py`). All three already thread a real `PackContext` today, so all three are
      equally affected by both the pre-fix bug and this mission's fix — the plan's own
      "no existing working caller changes behavior" conclusion likely still holds for all three,
      but the plan never says so because it did not know they existed. Trusting a stale,
      historically-scoped module comment instead of an independent grep is exactly the failure
      mode this mission's own plan repeatedly says it is avoiding ("verify rather than trust").
      This does not change C-007's file-set bound (none of these three callers need code changes),
      but it does mean the Blast radius narrative under-counts the production surfaces whose
      *observable output* changes post-fix (e.g. `spec-kitty charter mission-type list --json` and
      the audit CLI's `resolved` vs `activated-unresolvable` classification for an affected
      org/project type), which a reviewer or downstream consumer relying on this plan's Blast
      radius section as the authoritative account would not think to check.
    remediation: >
      Correct plan.md's Blast radius and IC-01 Risks sections to state the actual caller count
      (at least three, found via `grep -rn "resolve_layered_mission_types" src/`, including the
      `charter.missions` re-export alias used by `charter/mission_type.py` and
      `_mission_type_audit.py`), name `spec-kitty charter mission-type list` and the mission-type
      audit CLI (`doctor.py`) as additional production surfaces whose output changes for an
      affected org/project type post-fix, and confirm (or extend NFR-002/SC-003's golden-parity
      test to explicitly assert) that built-in-type output through these two additional entry
      points is unaffected too — not just through `resolve_layered_mission_types` called directly
      in the test file.
# All other checked claims (C-008 typing for all four chain functions, resolve_layered_mission_types's
