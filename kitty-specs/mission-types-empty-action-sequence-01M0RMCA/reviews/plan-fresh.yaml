# review-findings/v1 — canonical format for lens-session and fresh-sweep output.
schema: review-findings/v1
complete: true
phase: plan
lens_group: fresh
mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: PLAN-FRESH-001
    lens: Decision-documentation / audit-trail integrity
    severity: 3
    title: tracer-approach.md's plan-phase entry still claims "no drift found" after the fix round corrected a severity-4 caller-count claim
    evidence:
      - artifact: "kitty-specs/mission-types-empty-action-sequence-01M0RMCA/tracer-approach.md § \"Plan phase (2026-08-24)\" — closing sentence: \"No drift found — spec.md's citations are accurate against this HEAD.\""
      - artifact: "kitty-specs/mission-types-empty-action-sequence-01M0RMCA/plan.md § Blast radius on downstream workspaces (lines 345-351, commit 862a0508d): \"an earlier draft of this plan trusted that comment uncritically, which is exactly the failure mode this mission's own 'verify rather than trust' standard exists to catch\""
      - artifact: "kitty-specs/mission-types-empty-action-sequence-01M0RMCA/reviews/plan.confirmed.yaml — PLAN-ARCH-001 (severity 4, confirmed): the pre-fix plan.md claimed 'exactly one production caller' of resolve_layered_mission_types; grep shows three"
      - code: "git show --stat 862a0508d — the fix commit touches only plan.md (50 insertions, 8 deletions); tracer-approach.md and tracer-design-decisions.md are untouched by the fix round"
    claim: >
      plan.md's own fix-round text (commit 862a0508d) now explicitly admits that an earlier
      draft trusted a stale module comment uncritically and mis-stated the caller count as
      "exactly one" when it is actually three — a severity-4 finding (PLAN-ARCH-001) confirmed
      by round-1 review. But tracer-approach.md, the artifact this mission's own SC-004/plan
      explicitly designates as the record a later sk-review squad relies on to "verify the
      claim was witnessed rather than re-deriving it independently," was never updated: its
      "Plan phase (2026-08-24)" section still reads "No drift found — spec.md's citations are
      accurate against this HEAD" with no mention that a caller-count claim (plan.md's own,
      not spec.md's) was found wrong and corrected. A reviewer who trusts tracer-approach.md's
      blanket "no drift found" summary (its stated purpose) would not learn that this
      mission's own verification process already failed once on exactly the axis it claims to
      have checked, and has no signal to re-verify other claims in that same tracer entry with
      extra scrutiny.
    remediation: >
      Append a short dated entry to tracer-approach.md (or tracer-design-decisions.md) for the
      fix round: note that PLAN-ARCH-001/PLAN-VERIFY-002 review findings identified the
      caller-count claim as incorrect (one claimed vs. three actual), that it was corrected in
      plan.md's Blast radius section, and reference the corrected grep command
      (`grep -rn "resolve_layered_mission_types(" src/`) as the now-verified source of truth —
      so the audit trail matches what plan.md itself now says happened.
  - id: PLAN-FRESH-002
    lens: Citation accuracy
    severity: 1
    title: New caller-count correction cites the wrong line range for the module comment it is discrediting
    evidence:
      - artifact: "plan.md § Blast radius on downstream workspaces (commit 862a0508d): \"rather than trusted from `mission_type_repository.py:22-31`'s module comment\""
      - code: "src/doctrine/missions/mission_type_repository.py:23-32 — the actual comment block starts at line 23 (`# \\`resolve_layered_mission_types\\` (FR-001, below) was deliberately withheld`) and ends at line 32 (`# has a live caller to find and the entry is restored here.`); line 22 is the closing `]` of `__all__`"
    claim: >
      The new text's own citation for the module comment it is correcting ("22-31") is off by
      one at both ends — the comment actually spans lines 23-32. Trivial in isolation, but
      ironic given the same sentence's stated purpose is modeling "verify rather than trust"
      precision, and the mission's prior review round (plan.confirmed.yaml, PLAN-ARCH-001)
      already recorded disagreeing citations for this same comment ("22-31" vs "22-29"),
      meaning the line range for this one comment has now been mis-cited at least twice across
      review rounds without ever being pinned down.
    remediation: >
      Correct the citation to "mission_type_repository.py:23-32" in plan.md's Blast radius
      section.
  - id: PLAN-FRESH-003
    lens: PR-shape / gate-checkability
    severity: 3
    title: SC-006's diff-path check, as plan.md operationalizes it, does not account for the mission's own kitty-specs/ planning artifacts that legitimately appear in the same PR diff
    evidence:
      - artifact: "spec.md § Success Criteria, SC-006: \"The mission's PR diff (`git diff --name-only main...HEAD` or equivalent) touches only the files C-007 names — ...mission_type_repository.py, ...test_mission_type_repository.py, and ...test_runtime_seam.py. Any other path appearing in the diff is a C-002/C-003/C-007 violation and must be justified or removed before merge.\""
      - artifact: "plan.md § Contracts (line 292-295): \"C-007 bounds the diff to the one named file and two named test files (checkable via SC-006's `git diff --name-only` mechanism at merge time). No contract file is in that bounded set, so none moves.\" — no carve-out mentioned for kitty-specs/ planning files"
      - artifact: "plan.md § PR shape (lines 557-569): \"Default PR shape for this repository is one PR per mission... the entire production diff... and the test additions\" — confirms spec.md/plan.md/tasks.md/tracer files/meta.json/status.events.jsonl for this mission all land on the same mission branch and therefore the same PR diff as the src/test fix"
      - artifact: "kitty-specs/mission-types-empty-action-sequence-01M0RMCA/ directory listing: spec.md, plan.md, tracer-*.md, tasks/, checklists/, research/, reviews/, meta.json, status.events.jsonl — all committed to this mission's branch"
    claim: >
      C-007 names only src/doctrine/missions/mission_type_repository.py and the two test files
      as the bounded blast radius; it says nothing about kitty-specs/mission-types-empty-action-sequence-01M0RMCA/
      itself. SC-006, and plan.md's own Contracts-section paraphrase of it, take C-007's silence
      on that directory and turn it into a literal "any other path... is a violation" diff
      check. But this repo's own one-PR-per-mission model (which plan.md's PR shape section
      itself describes) means the mission's spec.md, plan.md, tasks.md, tracer files, meta.json,
      status.events.jsonl, checklists/, research/, and this reviews/ directory are all
      necessarily part of the same branch and therefore the same `git diff --name-only
      main...HEAD` this SC-006 check runs against. Taken literally, SC-006/C-007 as plan.md
      states them would flag every mission's own planning-and-review artifacts as violations
      requiring justification or removal before merge — plainly not the intent, but nothing in
      plan.md says so, leaving the person or script running SC-006's check at merge time to
      either guess the exclusion or waste time "justifying" files that were never in scope for
      the bound in the first place.
    remediation: >
      Add one clarifying sentence to plan.md's Contracts or "The gate set" section stating that
      C-007/SC-006's file-set bound applies to the src/ and tests/ portions of the diff only,
      and that kitty-specs/mission-types-empty-action-sequence-01M0RMCA/** (this mission's own
      planning, tracer, and review artifacts) is expected and out of C-007's scope by
      construction — so SC-006's merge-time check is unambiguous about what it is actually
      bounding.
