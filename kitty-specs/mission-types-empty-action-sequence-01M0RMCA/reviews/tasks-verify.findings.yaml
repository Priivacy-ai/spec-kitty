findings:
  - id: TASKS-VERIFY-001
    lens: Per-AC test strategy concrete
    severity: 3
    title: Acceptance Scenario 2 (governed entry point does not raise) has no concrete named test subtask
    evidence:
      - artifact: "spec.md § User Story 1, Acceptance Scenarios, item 2 (line 60)"
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T002 (lines 228-269), T005 (lines 350-377), T006 (lines 378-398)"
      - code: "src/charter/mission_type_profiles.py:916 (_resolve_action_slot def)"
      - code: "tests/runtime/test_runtime_seam.py:128 (_resolve_via_seam helper already exists in the owned test file, calls resolve_mission_type_context -> _resolve_action_slot)"
    claim: >
      Acceptance Scenario 2 requires that a governed entry point reaching this seam through
      resolve_layered_mission_types (named explicitly: charter.mission_type_profiles._resolve_action_slot,
      underlying `charter activate mission-type` and `agent mission create --mission-type`) succeeds and
      does not raise MissionTypeEmptyActionSequenceError for the org-tier steps-only-projection type. Every
      new/extended test WP01 actually instructs (T002's NFR-001 red-first case, T005's project-tier case,
      T006's explicit-action_sequence case) calls resolve_layered_mission_types(...) directly and asserts on
      its return value -- none of them exercise _resolve_action_slot / resolve_mission_type_context /
      `charter activate mission-type` for an org/project steps-only type. Since MissionTypeEmptyActionSequenceError
      is literally the exception this mission's issue reproduction cites ("every governed entry point then
      raises"), and _resolve_via_seam already exists as a ready-made helper in the very test file WP01 owns
      (tests/runtime/test_runtime_seam.py), the omission is a genuine, checkable coverage gap for a named
      Acceptance Scenario, not merely a documentation nit. (The lower-level fix in resolve_layered_mission_types
      is well-pinned by T002, so this is unlikely to produce a *wrong* implementation -- but it leaves AC2
      unverified end-to-end, which a reviewer following spec.md's own Acceptance Scenarios list would flag.)
    remediation: >
      Add a named subtask (or extend T002) that calls resolve_mission_type_context / _resolve_action_slot
      (via the existing _resolve_via_seam pattern in tests/runtime/test_runtime_seam.py, patching
      charter.mission_type_profiles.existing_mission_types and PackContext.from_config the same way
      TestGoldenParityUnaffectedByPackContextThreading already does) for the same org-tier steps-only fixture
      T002 constructs, and asserts it succeeds without raising MissionTypeEmptyActionSequenceError -- closing
      the literal AC2 claim, not just the lower-level resolve_layered_mission_types return value.

  - id: TASKS-VERIFY-002
    lens: Baseline captured before the first change
    severity: 3
    title: T001's baseline-triage cross-check cites a SPEC-KITTY-LEDGER.md "#3284 entry" that does not exist
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T001, step 3 (lines 217-220)"
      - code: "/home/jeroennouws/dev/SK-missions/SPEC-KITTY-LEDGER.md (grep -n '3284' returns zero matches across 5296 lines; no #3284 entry, no '23 known-red' text)"
      - artifact: "gh issue view 3284 (confirmed OPEN, title: 'main full suite has 23 untracked failures and 2 errors after bootstrap prewarm')"
    claim: >
      T001 step 3 instructs: "Cross-check any red test id you observe against SPEC-KITTY-LEDGER.md's #3284
      entry (~23 known-red / 2-error baseline on main) -- note explicitly whether it's already enumerated
      there or is new-but-pre-existing." I verified SPEC-KITTY-LEDGER.md (the canonical ledger this repo's
      own top-level CLAUDE.md/AGENTS.md direct every agent to read) contains zero mentions of issue #3284 --
      no entry, no breakdown, no "23 known-red" text anywhere in its 5296 lines. The actual breakdown lives
      only in the GitHub issue itself (gh issue view 3284, confirmed OPEN with the matching "23...failures
      and 2 errors" title). spec.md's own SC-005 (line 124) already hints at this ambiguity -- it cites
      "issue #3284, SPEC-KITTY-LEDGER.md" as a combined parenthetical and separately says "#3284's own
      breakdown ... does not enumerate either of these two test files" -- but WP01's T001 flattens this into
      a single false claim that the ledger itself has a "#3284 entry" to check against. An implementer
      following this literally will grep a document that has nothing to find, and may wrongly conclude "not
      enumerated there" (trivially true, since nothing is there) without ever consulting the real source
      (the GitHub issue / its comments).
    remediation: >
      Correct T001 step 3 to name the actual cross-check source: `gh issue view 3284` (and its comments, if
      the per-test breakdown lives there) for the known-red test id list, not "SPEC-KITTY-LEDGER.md's #3284
      entry." If SPEC-KITTY-LEDGER.md is meant to carry a distinct SK-NN entry summarizing #3284 (as it does
      for SK-81/SK-82 elsewhere in this mission's own spec.md), state that separately and correctly rather
      than conflating "issue #3284" with "a ledger entry for #3284."

  - id: TASKS-VERIFY-003
    lens: Requirement-ref substantiveness (FR-005)
    severity: 3
    title: FR-005/C-001 ("_load() untouched") has no line-scoped automated check -- only prose instruction and reviewer-side manual diff reading
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T003, step 5 (lines 298-300)"
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T009, step 1 (lines 458-466)"
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Reviewer Guidance (line 552)"
      - code: "src/doctrine/missions/mission_type_repository.py:157-174 (MissionTypeRepository._load(), the body FR-005/C-001 pins as untouched)"
    claim: >
      FR-005/C-001 requires MissionTypeRepository._load() (lines 157-174, call site line 165) to have zero
      diff. T003 step 5 verifies this only via a prose instruction to the implementer ("verify after your
      edit that it still compiles with zero source change"); T009 step 1's automated SC-006 diff-scope check
      is git diff --name-only-based, i.e. file-level only -- it confirms no new/unexpected FILES were
      touched, but src/doctrine/missions/mission_type_repository.py IS one of the WP's own owned/touched
      files, so a file-level check cannot detect an accidental edit to lines 157-174 within that same file.
      The only remaining safeguard is Reviewer Guidance's "Confirm MissionTypeRepository._load() (lines
      157-166) has zero diff" -- a manual, reviewer-side instruction, not an implementer-side automated
      self-check. This is a real asymmetry versus FR-008 (charter/pack_manager.py:865), which IS a wholly
      separate, untouched file and therefore IS caught by T009's file-level diff-scope check.
    remediation: >
      Add a concrete implementer self-check to T009 (or T003) that runs a line-scoped diff against
      mission_type_repository.py specifically, e.g. `git diff <base>...HEAD -- src/doctrine/missions/mission_type_repository.py`
      and greps/confirms no hunk overlaps lines 157-174 (or the equivalent _load()/default() function body),
      not merely a file-presence check.

  - id: TASKS-VERIFY-004
    lens: Requirement-ref substantiveness (NFR-004)
    severity: 2
    title: NFR-004 (no perf regression / no new filesystem walk) has zero subtask coverage
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § requirement_refs (frontmatter, includes NFR-004)"
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtasks T001-T009 (no subtask mentions performance, filesystem walk count, or NFR-004 by name)"
      - artifact: "plan.md § NFR-004 (\"must not add a new filesystem walk beyond what MissionStepRepository.resolve_all_for_mission_type already performs\")"
    claim: >
      NFR-004 is listed in wps.yaml/WP01's requirement_refs and asserted true by architectural reasoning
      ("a signature/argument-forwarding change, not new I/O") in plan.md and the WP's own Objective section,
      but no subtask (T001-T009) instructs any concrete verification of this claim -- no call-count assertion
      on MissionStepRepository.resolve_all_for_mission_type, no mock-based walk-count check, no timing
      assertion. The claim is architecturally plausible given the diff's small surface (pure argument
      threading, no new loops), so this is unlikely to produce a wrong implementation, but it is asserted
      as "unchanged, verify" with no subtask that actually re-verifies it, exactly the pattern this lens
      flags.
    remediation: >
      Add a lightweight assertion to one of the new tests (e.g. T002 or T004) using unittest.mock.patch with
      wraps= on MissionStepRepository.resolve_all_for_mission_type (or an equivalent call-count spy) to
      confirm the number of calls into that method for a given resolve_layered_mission_types invocation is
      unchanged pre-fix vs post-fix, closing the "no new filesystem walk" claim with evidence rather than
      architectural assertion alone.

  - id: TASKS-VERIFY-005
    lens: Vacuity check on the golden-parity extension (T004)
    severity: 3
    title: T004 omits the "would this test actually fail if broken" self-check that its sibling T005 requires, despite this exact test class having a documented prior vacuity finding
    evidence:
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T004 (lines 317-349)"
      - artifact: "tasks/WP01-thread-pack-context-projection-seam.md § Subtask T005, step 2 (lines 368-369, 373-376: \"confirm this test would fail if only the org-layer path were fixed\")"
      - code: "tests/runtime/test_runtime_seam.py:235-260 (test_org_root_content_actually_resolves_through_the_seam docstring: \"PR-TESTS-001 (pre-merge squad, mission up-mission-type-seam-01KZY1JB): the sibling test above ... never writes a YAML into it -- the org layer always scans to [] ... closing the vacuity gap\")"
    claim: >
      test_builtin_type_unaffected_by_real_pack_context_with_org_root -- the exact test T004 instructs
      extending -- already has one documented history of being found vacuous by a prior pre-merge squad (its
      own sibling test's docstring records this explicitly: PR-TESTS-001 found the org root had no YAML
      content and so "always scans to []", meaning the test held identically whether or not the fix under
      test existed). T004's own Steps 1-3 instruct extending/confirming the action_sequence assertion, and
      Step 2 correctly warns against an over-broad invariant -- but nowhere does T004 require the same
      discriminating-power self-check its sibling T005 explicitly requires ("temporarily comment out the
      project-dir branch ... or otherwise confirm this test would fail if only the org-layer path were
      fixed"). Given this exact test class's documented prior vacuity, and that T004 is specifically the
      subtask closing the IC-01-flagged risk (built-in-equivalent layer receiving a real pack_context for
      the first time), omitting an equivalent "prove it would catch a broken threading" check is a real,
      concrete gap -- not hypothetical, since the class has already needed this exact kind of correction
      once.
    remediation: >
      Add a step to T004 mirroring T005's self-check: temporarily break the built-in-equivalent layer's
      pack_context forwarding (e.g. revert just the scan_mission_types_dir(base_dir, pack_context=pack_context)
      edit at mission_type_repository.py:515) and confirm the extended/new parity assertion in
      test_builtin_type_unaffected_by_real_pack_context_with_org_root would actually fail in that state --
      not committed, a manual verification step only, matching T005's own methodology.
