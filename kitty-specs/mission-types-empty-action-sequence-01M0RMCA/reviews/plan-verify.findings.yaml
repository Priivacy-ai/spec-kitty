schema: review-findings/v1
complete: true
phase: plan
lens_group: verify
mission: mission-types-empty-action-sequence-01M0RMCA
findings:
  - id: PLAN-VERIFY-001
    lens: CI gate citation accuracy / Falsifiability (blast radius)
    severity: 3
    title: "Blast-radius section's caller-count claim contradicts live code — resolve_layered_mission_types has 3 production src/ callers, not 1"
    evidence:
      - artifact: "plan.md § Blast radius on downstream workspaces (lines 330-337)"
      - code: "plan.md:331-332 — \"Only callers that already pass a real pack_context through resolve_layered_mission_types (currently: charter.mission_type_profiles._resolve_action_slot, the one production src/ caller per this file's own module comment) gain the fix\""
      - code: "plan.md:336-337 — \"the blast radius is still narrow because resolve_layered_mission_types has exactly one production caller today (_resolve_action_slot, ...)\""
      - code: "src/doctrine/missions/mission_type_repository.py:22-29 — the module comment the plan cites is historical (\"WP04 (FR-002) now calls it from charter.mission_type_profiles._resolve_action_slot\"), describing state as of a prior mission's WP04 landing, not a current-state invariant."
      - code: "src/charter/mission_type_profiles.py:976 — resolve_layered_mission_types(mission_types_dirs, pack_context) inside _resolve_action_slot (the caller the plan names)."
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:87 — resolve_layered_roster() wraps and calls resolve_layered_mission_types(mission_types_dirs, pack_context) directly; used by that module's own charter_mission_type_list command AND re-exported/imported by src/specify_cli/cli/commands/mission_type.py:1454 (show_mission_type), whose fallback branch at line 1479 reads mt.action_sequence straight off the object returned by this call — independent of _resolve_action_slot."
      - code: "src/specify_cli/cli/commands/_mission_type_audit.py:170 — _resolve_layered_roster() also calls resolve_layered_mission_types(mission_types_dirs, pack_context) directly, for the doctor mission-type audit's resolvability classification (does not read .action_sequence, but is still a distinct production call site the plan's count omits)."
    claim: >
      The plan's Blast radius section asserts, twice, that resolve_layered_mission_types has
      "exactly one production caller today" and cites a module comment as the source of that
      claim. A direct grep of src/ for resolve_layered_mission_types( shows three call sites,
      not one: charter/mission_type_profiles.py:976 (_resolve_action_slot, the one the plan
      names), specify_cli/cli/commands/charter/mission_type.py:87 (resolve_layered_roster,
      backing both "charter mission-type list" and, via re-export, "mission-type show"), and
      specify_cli/cli/commands/_mission_type_audit.py:170 (the doctor mission-type audit). The
      cited module comment in mission_type_repository.py:22-29 is itself historical — it
      describes the state at the time a prior mission (up-mission-type-seam-01KZY1JB WP04)
      first unblocked the symbol for the dead-code gate, not the current call graph; a later
      WP07 in that same mission added the two additional CLI consumers the plan's count misses.
      This is exactly the "trust a comment instead of re-verifying against live code" failure
      mode the plan's own preamble and this mission's instructions warn against, and it
      undercounts the CLI surfaces (charter mission-type list, mission-type show) that will also
      observably change behaviour once org/project types with steps-only projection start
      resolving correctly post-fix. It does not change IC-01's actual fix mechanics (which are
      caller-count-independent) and NFR-002's golden-parity test still exercises
      resolve_layered_mission_types directly regardless of caller count, so this is a risk-
      narrative/documentation-accuracy defect, not a wrong-fix defect.
    remediation: >
      Correct the Blast radius section to state the real caller count (re-grep
      `resolve_layered_mission_types(` across src/ at merge time, not at plan-authoring time,
      since the count may drift further before implementation lands), name all current
      production callers (_resolve_action_slot, resolve_layered_roster's two CLI consumers, and
      the doctor audit's resolvability check), and note explicitly that "charter mission-type
      list" and "mission-type show" are additional CLI surfaces whose observable output changes
      for previously-broken org/project types once this fix lands (a positive, intended change,
      per the same reasoning already given for _resolve_action_slot's consumers) — not an
      unaccounted-for regression surface.

  - id: PLAN-VERIFY-002
    lens: Test strategy
    severity: 3
    title: "Test strategy names no concrete test case for spec.md Acceptance Scenario 5 (project-layer steps-only projection)"
    evidence:
      - artifact: "spec.md § User Story 1, Acceptance Scenario 5 (line 62): \"Given a project-layer .kittify/missions/mission_types/<id>.yaml override with its own mission-steps/<id>/ steps-only projection ... When resolved, Then it also produces the correct non-empty action_sequence — the fix applies uniformly to the org layer and the project layer\""
      - artifact: "spec.md NFR-001 (line 91): \"must exercise an org-tier (or project-tier) mission type\" — disjunctive, satisfiable by testing only one tier"
      - artifact: "plan.md § IC-01 Affected surfaces, tests/doctrine/missions/test_mission_type_repository.py bullet (lines 195-200): names only an \"org-tier (or project-tier)\" steps-only fixture for NFR-001, with no separate bullet or explicit case naming project-layer (.kittify/missions/mission_types/) resolution"
      - artifact: "plan.md: full-text search for \"project-layer\"/\"project-tier\" outside prose summaries returns no test-strategy hit distinct from the org-layer case"
    claim: >
      spec.md's Acceptance Scenario 5 is a named, mandatory scenario requiring the project-layer
      override path (.kittify/missions/mission_types/<id>.yaml with its own steps-only
      mission-steps/<id>/ tree) to independently produce the correct action_sequence. NFR-001's
      own wording ("org-tier (or project-tier)") only requires ONE of the two tiers for the
      red-first pin, and the plan's IC-01 test-strategy bullet for
      test_mission_type_repository.py follows that same either/or framing without committing to
      a concrete project-layer case. Since resolve_layered_mission_types's body has three
      independent scan_mission_types_dir call sites (built-in-equivalent, org, project) that this
      mission threads pack_context through, testing only the org-tier path exercises the
      org-layer call site's *correctness* but leaves the project-layer call site's correctness
      (as opposed to mere line coverage, which any real-pack_context invocation would satisfy)
      unverified by a named test. This is the kind of gap likely to surface as rework at
      sk-review time when the squad checks acceptance-scenario-to-test traceability and finds
      Acceptance Scenario 5 has no test note.
    remediation: >
      Add an explicit sub-bullet under IC-01's test-affected-surfaces for
      test_mission_type_repository.py naming a dedicated project-layer steps-only-projection test
      case (mirroring the org-tier NFR-001 case but pointing pack_context.repo_root at a synthetic
      project root with its own .kittify/missions/mission_types/<id>.yaml + mission-steps/<id>/
      tree), explicitly tied to spec.md Acceptance Scenario 5 — either as a second NFR-001-class
      case or as a SC-001/AS-5-labeled addition — so the WP-implementer and the pre-merge squad
      have a named, traceable check for the project layer distinct from "org-tier (or
      project-tier), pick one."
