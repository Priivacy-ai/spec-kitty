complete: true
phase: spec
lens_group: arch
mission: charter-activate-empty-action-sequence-01M0STSX
findings:
  - id: SPEC-ARCH-001
    lens: plan-commit-seam-call-site-precision
    severity: 3
    title: "C-003's two named call sites contradict C-007's two-file blast radius"
    evidence:
      - artifact: "spec.md § Constraints, C-003 (Plan/commit seam awareness)"
      - artifact: "spec.md § Constraints, C-007 (Two-file blast radius)"
      - artifact: "spec.md § Non-Functional Requirements, NFR-002"
      - code: "src/charter/activation_engine.py:193 (def plan_activation) and :358 (def commit_plan) — both defined in activation_engine.py"
      - code: "src/charter/pack_manager.py:572-641 (CharterPackManager.activate — the literal call site `commit_plan(target_path, data, plan, save=save)` is at line 641, inside pack_manager.py)"
      - code: "src/charter/activation_engine.py:36-43 (module docstring: \"this module performs no filesystem discovery and no config.yaml load of its own\" — the available-ID universe and config data are passed in as data, C-008)"
      - code: "src/specify_cli/cli/commands/charter/activate.py:551-565 (activate_cmd already resolves mission-type-specific state via `_emit_step_removal_warnings(kind, artifact_id, repo_root)` immediately before calling `manager.activate(...)` — the one call site that is genuinely reachable without touching activation_engine.py or pack_manager.py)"
    claim: >
      C-003 names exactly two candidate call sites for the new fail-closed check: "inside
      plan_activation" or "a mission-type-specific guard evaluated before commit_plan runs".
      Both `plan_activation` and `commit_plan` are defined in `src/charter/activation_engine.py`
      (verified: def plan_activation at line 193, def commit_plan at line 358), and the literal
      `commit_plan(...)` call site that a pre-commit_plan guard would sit "before" lives inside
      `CharterPackManager.activate()` in `src/charter/pack_manager.py` (verified: line 641).
      Neither `activation_engine.py` nor `pack_manager.py` is one of the two files C-007 names
      as the mission's blast radius ("The production change is scoped to
      src/specify_cli/cli/commands/charter/activate.py ... and src/charter/mission_type_profiles.py").
      An implementer following C-003's literal wording (edit activation_engine.py's
      plan_activation, or add a guard next to pack_manager.py's commit_plan call) would violate
      C-007 by construction — a third file must be touched. Separately, "inside plan_activation"
      is doubly non-viable on architectural grounds: plan_activation's own module docstring
      states this module "performs no filesystem discovery and no config.yaml load of its own"
      and receives all inputs "as data (C-008)" — but resolving a candidate's action sequence
      requires exactly the filesystem-touching resolution `_resolve_action_slot` performs
      (`resolve_layered_mission_types`, a directory scan under `doctrine.missions.mission_type_repository`).
      Embedding that resolution literally inside `plan_activation` would violate the module's own
      stated purity contract. NFR-002's broader phrasing ("any other module under src/charter/ or
      src/kernel/") suggests the spec authors anticipated the fix might land somewhere other than
      the two C-007 files, reinforcing that this is a real, unresolved tension rather than a
      typo. The only reading that reconciles all three (C-003, C-007, NFR-002, and
      activation_engine's purity docstring) is: the guard is invoked from `activate_cmd` in
      `activate.py` — mirroring the existing `_emit_step_removal_warnings(kind, artifact_id,
      repo_root)` call immediately preceding `manager.activate(...)` at line ~551-558 — calling a
      new helper added to `mission_type_profiles.py`, and never touching
      `activation_engine.py`/`pack_manager.py` at all. The spec does not state this reading; it
      names the activation_engine.py functions instead, which is exactly the misleading cue an
      implementer or plan-phase author would naturally follow.
    remediation: >
      Reword C-003 to drop the "inside plan_activation" option (architecturally non-viable given
      activation_engine.py's own no-filesystem-discovery/data-only contract, and outside C-007's
      blast radius) and replace "a mission-type-specific guard evaluated before commit_plan runs"
      with an explicit statement that the guard is invoked from `activate_cmd` in `activate.py`
      (the existing `_emit_step_removal_warnings` call site is the precedent — same file, same
      point in the flow, before `manager.activate()` is ever called) backed by a new helper
      function added to `mission_type_profiles.py`, consistent with C-007's two-file blast radius
      and NFR-002's `__all__`/dead-symbol obligation. If the plan phase later decides a
      pack_manager.py/activation_engine.py call site is actually preferable, C-007 must be
      updated to reflect the real (three-file) blast radius rather than silently exceeded.
