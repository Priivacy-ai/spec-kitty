findings:
  - id: TASKS-VERIFY-001
    lens: per-ac-test-strategy-concrete
    severity: 2
    title: "User Story 2 / AC1 (`charter mission-type list` on a pre-registered empty-sequence type) has no named test at the literal CLI-command surface, unlike every User Story 1 AC"
    evidence:
      - artifact: "spec.md § User Story 2, Acceptance Scenario 1 (\"When the operator runs `charter mission-type list` ... Then the command still fails with the same error\")"
      - artifact: "tasks/WP01-activation-empty-action-sequence-gate.md § Context (\"covered by FR-004's own regression suite (existing tests must stay green, unchanged assertions)\")"
      - code: "src/specify_cli/cli/commands/charter/mission_type.py:156-164 (charter_mission_type_list's try/except around resolve_mission_type_context -> MissionTypeEmptyActionSequenceError)"
      - code: "tests/charter/test_mission_type_profiles.py:577-633 (test_project_layer_omitting_action_sequence_raises_named_error — calls resolve_mission_type_context directly, not via the `mission-type list` CLI command)"
    claim: >
      Every User Story 1 AC (1-4) is mapped in WP01 to a concrete, named test
      (T002's CLI-level test for AC1/AC2, T002's unit-level non-empty case for
      AC3, T003's unit+CLI-level extends tests for AC4). User Story 2's AC1 —
      whose Acceptance Scenario names the literal `charter mission-type list`
      command — is instead waved through with the prose claim "covered by
      FR-004's own regression suite" and no specific test citation. Searching
      the full repo (not just WP01's 8-file targeted surface) turns up no
      existing test that invokes the `mission-type list` Typer command
      end-to-end against an already-registered, empty-action-sequence type;
      the only close analogue is `test_show_exits_cleanly_for_activated_org_
      type_with_empty_action_sequence` (tests/specify_cli/cli/commands/
      test_mission_type_template_set_cli.py:229), which exercises `mission-
      type show`, not `list`. Existing coverage for AC1's underlying claim
      only reaches the shared `resolve_mission_type_context` function
      directly (test_mission_type_profiles.py), not the `list` command's own
      thin CLI wrapper (mission_type.py:151-164). This is a real but low-risk
      gap: the wrapper code is pre-existing, untouched by this mission
      (FR-004 forbids touching it), and the underlying function's behavior IS
      pinned — so the implementation is very unlikely to come out wrong, but
      the WP's own AC-to-test traceability is weaker for US2 than for every
      US1 AC, and a reviewer following only WP01 has no test citation to
      independently re-run for AC1 specifically.
    remediation: >
      In WP01's Context or T004 "Verify GREEN" section, name the specific
      existing test(s) that pin User Story 2 AC1/AC2 (e.g.
      test_mission_type_profiles.py's TestPackContextProjection /
      TestEmptyActionSequenceLoudFail tests) so the reviewer has a citation
      to re-run, or add one lightweight CliRunner-level regression test
      invoking `charter mission-type list` against a pre-seeded,
      already-registered empty-sequence type to close the CLI-surface gap
      directly.

  - id: TASKS-VERIFY-002
    lens: sk-81-methodological-trap-enforceability
    severity: 1
    title: "SC-004 (trap rejection) is absent from WP01's machine-readable requirement_refs, with no acknowledgment of the known upstream cause (#2991)"
    evidence:
      - artifact: "wps.yaml § work_packages[0].requirement_refs (FR-001..FR-007, NFR-001, NFR-002, C-001..C-007 — no SC-### entries)"
      - artifact: "tasks/WP01-activation-empty-action-sequence-gate.md frontmatter § requirement_refs (identical list, no SC-004)"
      - artifact: "kitty-specs/isolated-home-pin-guard-r1a-01KZNMA3/wps.yaml lines 12-15 (\"requirement_refs carries SC-### deliberately. _REF_FIND_PATTERN (requirement_mapping.py:16) matches only (FR|NFR|C)-\\d+, so every SC-### is dropped at the tasks-packages -> WP-frontmatter boundary ... Upstream defect #2991\")"
    claim: >
      FR-005 is present in WP01's requirement_refs list (confirmed directly
      in both wps.yaml and the WP file frontmatter). SC-004 is not present in
      either — only FR/NFR/C-prefixed IDs appear. This is very likely the
      same pre-existing tooling limitation another in-repo mission already
      documented and cited (#2991: the tasks-packages generator's
      `_REF_FIND_PATTERN` regex only matches `(FR|NFR|C)-\d+`, so any
      `SC-###` a tasks-outline author lists is silently dropped before it
      reaches the WP frontmatter) rather than an authoring omission specific
      to this mission — but neither spec.md, plan.md, tasks.md, wps.yaml, nor
      WP01 acknowledges this known limitation the way the precedent mission
      does. The substance of SC-004 is otherwise well-covered in WP01's prose
      (the verbatim SK-81 trap section, T002's fixture instructions, and
      Reviewer Guidance's explicit "A pre-seeded-only test is a severity-4
      finding per spec.md SC-004" line), so this is a traceability nit, not a
      coverage gap.
    remediation: >
      Add a one-line note near WP01's requirement_refs (mirroring
      isolated-home-pin-guard-r1a-01KZNMA3/wps.yaml's header comment) stating
      that SC-004 is intentionally absent from the machine-readable
      requirement_refs list due to upstream defect #2991 (SC-### IDs are
      dropped by `_REF_FIND_PATTERN` at the tasks-packages boundary), so a
      future reader does not mistake the omission for an oversight and does
      not "clean it up" by inventing a workaround.
