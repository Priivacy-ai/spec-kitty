  remediation: Correct research.md §R5's bullet to quote the two actual dashboard entries verbatim (`src/specify_cli/dashboard/handlers/*`,
    `src/specify_cli/dashboard/scanner.py`) instead of the paraphrased `dashboard/*`, and likewise list
