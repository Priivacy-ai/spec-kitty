- id: PLAN-VERIFY-004
  lens: Baseline/SC-005 correspondence
  severity: 2
  title: §Baseline Discipline omits the charter's specific content requirement for a newly-filed pre-existing-failure
    issue
  evidence:
  - artifact: 'plan.md § Baseline Discipline, item 2: "Any red not already covered by #3284... gets filed
      as its own GitHub issue before being treated as baseline"'
  - artifact: '.kittify/charter/charter.md § Pre-existing Failure Reporting Rule: "The issue must include
      the command run, the relevant failure summary, and why the agent believes the failures are pre-existing
      rather than introduced by its current change."'
  claim: 'Plan.md correctly operationalizes the charter rule''s core mechanism (classify against #3284
    before attributing; file a new issue for anything uncovered) but does not restate the charter''s explicit
    content requirement for that filed issue — the command run, the failure summary, and the rationale
    for believing it is pre-existing. Because §Baseline Discipline is the document a WP implementer will
    actually follow at execution time (rather than re-reading the charter section-by-section), an issue
    filed per this plan''s instructions could satisfy "filed as its own GitHub issue" while omitting the
    reproduction command or the pre-existing rationale the charter separately requires, which would fail
    the charter rule on a technicality the plan gave no reason to catch.'
  remediation: Add one bullet under §Baseline Discipline item 2 restating the charter's required issue
    content (command run, failure summary, pre-existing rationale) so the plan is self-sufficient for
    a WP implementer without a round-trip back to the charter text.
