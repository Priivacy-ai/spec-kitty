findings:
  - id: TASKS-ORDER-001
    lens: campsite-clean-as-subtask-correctness / phasing
    severity: 3
    title: "wps.yaml leaves WP02/WP03 with dependencies:[] despite plan.md's explicit 'campsite-clean precedes all three' sequencing, with no documented reconciliation"
    evidence:
      - artifact: "plan.md §Suggested Work Package Sequencing, lines 753-758 (diagram) and lines 766-767"
      - artifact: "plan.md line 766: \"**Sequential work**: the campsite-clean comment fix precedes all three (small, low-risk, behavior-preserving per Standing Order #2's tidy-first sequencing).\""
      - artifact: "wps.yaml lines 4, 29, 50: dependencies: [] on WP01, WP02, WP03 respectively"
      - artifact: "tasks/WP02-loud-fallback.md and tasks/WP03-substantive-gate.md: no mention of \"campsite\" anywhere in either file"
      - artifact: "tasks/WP01-composition-dispatch.md T001 (\"Campsite-clean: correct the stale C-008 comments\") — the fix is folded entirely inside WP01, not exposed as a mission-level prerequisite artifact"
      - artifact: "each WP's frontmatter branch_strategy: \"...this mission ships as a single branch/one PR...\" (single_branch topology, confirmed in all three tasks/WP0*.md files) — so WP-level commit order on the shared branch is not otherwise fixed by branch isolation"
      - code: "src/runtime/next/runtime_bridge_composition.py:127"
      - code: "src/runtime/next/runtime_bridge.py:1777-1779"
    claim: >
      plan.md's own "Suggested Work Package Sequencing" diagram draws the campsite-clean
      comment fix as a single upstream node feeding all three WPs, and the accompanying
      prose is explicit and mission-wide: "the campsite-clean comment fix precedes all
      three." wps.yaml/tasks.md implement this by folding the fix into WP01's T001 only,
      and leave `dependencies: []` on WP02 and WP03 — i.e., nothing in the task artifacts
      stops WP02 or WP03's implementer/reviewer from starting and merging commits onto the
      shared single branch before WP01's T001 campsite-clean commit lands. Because this
      mission is single-branch/single-PR (not per-WP branches), that ordering is not
      incidentally guaranteed by branch isolation either — it depends entirely on
      orchestration discipline that the task artifacts do not encode.
      Concretely this is a genuine mission-plan-vs-task-plan divergence, not merely a
      restatement: WP01's T001, taken alone, does satisfy "distinct, behavior-preserving
      step that precedes the functional change" *locally* for WP01 (verified: T001 is
      comment-only, sequenced first, and explicitly says "Do not 'fix' the functional code
      to match the stale comment"). And the fold-into-WP01 decision is independently
      justified by real owned_files overlap: a hypothetical 4th "campsite-clean" WP would
      have to own `runtime_bridge_composition.py`, which WP01 must also own for its
      functional fix (T003's early-return removal is in that same file, at the exact
      lines that also carry the stale comment) — so a 4th WP is not a viable
      overlap-free alternative, and WP02/WP03 are not domain-appropriate hosts since
      §Campsite-Clean Scope found zero qualifying debt in either of their file sets
      ("no stale-comment debt found there" for mission.py; "No campsite-clean debt
      qualifies here" for _substantive.py). Charter Standing Order #2 itself frames
      campsite-clean at "mission/WP" granularity, scoped to "the surfaces it will touch" —
      which supports a WP-local reading over a strict mission-wide gate.
      What is missing is the reconciliation: nothing in wps.yaml, tasks.md, or
      WP02-loud-fallback.md/WP03-substantive-gate.md records the decision to treat
      plan.md's mission-wide "precedes all three" as satisfied by WP01-local sequencing
      alone, or explains why no dependency edge (or equivalent ordering instruction) was
      added to WP02/WP03 to protect against their commits landing ahead of WP01's T001 on
      the shared branch. Per this profile's own Directive 003 (decision documentation
      requirement) and the charter's Governing Principles (reconciliation decisions must be
      recorded in task/review context "rather than silently picking a side"), this is a
      silent deviation from an explicit plan.md sequencing statement, not a documented one.
    remediation: >
      Add a short explicit note — in wps.yaml's WP02/WP03 entries or in each WP's "Why this
      WP exists" section — recording the reconciliation: state that plan.md's mission-wide
      campsite-clean-precedes-all-three intent is satisfied by WP01's T001 alone because
      §Campsite-Clean Scope found no qualifying debt in WP02's or WP03's file sets, and
      therefore no cross-WP dependency edge is required for correctness; but also add one
      operational instruction — either a `dependencies: ["WP01"]`-style gate restricted to
      "WP01's campsite-clean commit must be merged to the shared branch before WP02/WP03
      commits land" (if the orchestrator can express a partial/commit-level dependency), or
      failing that, an explicit note in the mission's implementation runbook/coordination
      step instructing whoever dispatches WP02/WP03 to confirm WP01's T001 has already
      landed on fix/custom-mission-type-second-class-3830 first — so the single-branch
      commit history actually matches plan.md's stated sequencing instead of relying on
      incidental dispatch order.
