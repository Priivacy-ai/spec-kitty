findings:
  - id: PLAN-FRESH3-001
    lens: internal-consistency
    severity: 3
    title: "§Project Structure bundles runtime_bridge_composition.py's campsite-clean comment fix into the FR-001/FR-002 functional commit, contradicting §Campsite-Clean Scope's single-commit-for-both-files directive"
    evidence:
      - artifact: "plan.md §Campsite-Clean Scope (bullet 1) — \"the stale ... comments on `_should_dispatch_via_composition` (`runtime_bridge_composition.py:127`) and `_dn_composition_dispatch` (`runtime_bridge.py:1777-1779`) ... Correct them as part of the campsite-clean commit (comment-only, behavior-preserving).\""
      - artifact: "plan.md §Project Structure — `src/runtime/next/runtime_bridge_composition.py  # FR-001, FR-002 (comment fix too)` versus the sibling line `src/runtime/next/runtime_bridge.py  # #3830 campsite-clean comment-only fix (... no functional change)`"
      - artifact: "plan.md §Suggested Work Package Sequencing — the ASCII diagram places a single `Campsite-clean (comment fix, behavior-preserving)` node before all three WPs, implying one mission-wide first commit that (per §Campsite-Clean Scope) touches both files' stale comments"
    claim: "§Campsite-Clean Scope explicitly states BOTH files' stale C-008 comments (runtime_bridge_composition.py:127 and runtime_bridge.py:1777-1779) are corrected together \"as part of the campsite-clean commit\" — i.e. one commit, preceding the functional WPs, per Standing Order #2's \"distinct, behavior-preserving step that precedes the functional change.\" But §Project Structure's own annotation for runtime_bridge_composition.py labels its comment fix \"FR-001, FR-002 (comment fix too)\" — grouping it with the functional-change FR tags, unlike runtime_bridge.py's sibling line which is explicitly and only labeled the campsite-clean fix with no FR tag. An implementer reading only §Project Structure (the file-by-file reference table WP authors are most likely to consult) would reasonably fold the runtime_bridge_composition.py:127 comment fix into the same commit as the FR-001/FR-002 functional diff, since that file is touched again for the functional change anyway — producing a mixed commit that violates the campsite-clean-is-a-distinct-preceding-commit requirement the plan states elsewhere. This reads as an accumulation artifact: round 3's fix for PLAN-FRESH2-002 corrected runtime_bridge.py's citation and clearly re-labeled that line as campsite-clean-only, without revisiting the sibling runtime_bridge_composition.py line in the same table to match."
    remediation: "Reword the runtime_bridge_composition.py line in §Project Structure to explicitly separate the two concerns, e.g. `# FR-001, FR-002; the :127 C-008 comment fix lands in the campsite-clean commit (see §Campsite-Clean Scope), not bundled into the FR-001/FR-002 diff` — matching the explicit campsite-clean/no-functional-change framing already used for the runtime_bridge.py sibling line."
  - id: PLAN-FRESH3-002
    lens: source-verification
    severity: 3
    title: "Decision 3(a)'s claim that documentation's Technical Context needs zero new detector work does not hold for its own declared peer field 'Build Commands', whose value lives in a bulleted sub-list the existing single-line value-capture regex cannot see"
    evidence:
      - artifact: "plan.md §Decision 3(a) — \"(a) Bold-field list (`software-dev`'s full Technical Context, `documentation`'s full Technical Context, ...): generalize the existing peer-field scan ... by parameterizing the container heading and the primary-field label ... This detector already tolerates a leading `-`/`*` bullet marker (FR-013/#1896) — that behavior carries forward unchanged.\" (no other change claimed for documentation's fields)"
      - code: "packs/built-in/missions/documentation/templates/documentation-plan-template.md:24 — `**Build Commands**:` followed by a blank line and a bulleted list (`- \\`sphinx-build ...\\` (Python)` etc.) on subsequent lines, not an inline value after the colon"
      - code: "src/specify_cli/missions/_substantive.py:186 — peer-field regex `r\"^[ \\t]*(?:[-*][ \\t]+)?\\*\\*(?P<label>[^*\\n]+)\\*\\*[ \\t]*:[ \\t]*(?P<val>[^\\n]*)\"` captures `val` only up to end-of-line (`[^\\n]*`); for `Build Commands` this captures an empty string, and `_is_real_technical_context_value(\"\")` (`_substantive.py:148-155`) returns `False` for empty input"
    claim: "NFR-004/plan.md's per-type field declaration names `Build Commands` as one of `documentation`'s four checkable peer fields (alongside `Languages Detected`, `Output Format`, `Hosting Platform`). Unlike those three, which have their value written inline on the same line as the bold label (verified: documentation-plan-template.md:14-23), `Build Commands` (and the unnamed sibling `Generator Tools`, same shape) scaffolds its content as a bulleted list on the lines below the label — the same kind of shape the plan's own Decision 3(c) treats as needing a genuinely new nested-container detector for `research`/`plan`. The existing/generalized shape-(a) regex captures only same-line text after the colon, so a plan.md faithfully populated per the template's own `Build Commands` scaffolding (real commands in the bullet list, nothing after the colon) reads as an EMPTY peer field to the detector, not a populated one. Because the AND/OR rule only needs one of four peers to pass, this is masked whenever a fixture also populates one of the three inline-shaped peers — but NFR-005's non-vacuity bar (\"capable of passing given a plan.md faithfully populated per that type's own template\") does not require that; an author (or a WP's own positive fixture) who fills in Documentation Framework + only Build Commands, exactly as the template's own layout invites, would fail the check even though Decision 3(a) claims documentation needs no new detector work."
    remediation: "Either (a) declare `Build Commands` in the per-type field declaration (Decision 1) as needing the same nested/sub-list value-capture handling Decision 3(c) already builds for research/plan (extending that mechanism's scope rather than treating it as shape-(a)-only), or (b) if `Build Commands` is deliberately excluded from automated detection, say so explicitly and adjust NFR-004's \"ALL of their own actually-scaffolded fields\" list and the Architectural Gate Non-Vacuity table's documentation row so a WP author does not build a fixture around the undetectable field and discover the gap mid-implementation."
