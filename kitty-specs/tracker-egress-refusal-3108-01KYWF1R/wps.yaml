# Measurement base for every line citation, count and quoted `N passed` line in this
# dossier. Distinct from the planning commit and from any implementation base: the
# implementation base will be later, and the drift diff is
#   git diff --stat bb2020fea..<implementation base> -- src/specify_cli/tracker/
# Recorded here so the diff is derivable rather than transcribed out of prose.
measurement_base_sha: bb2020fea
planning_base_branch: bundle-c-tracker-refusal-3108

# Every dependency edge on the board, classified. An edge that is preference must not
# be read as necessity by a scheduler looking for parallelism, and a transitively
# redundant edge must not be read as load-bearing by a reader tracing why a WP waits.
dependency_notes:
  - edge: WP03 -> WP02
    kind: necessity
    why: >-
      WP03's Channel-2 resolver reads the `egress` field WP02 promotes into
      `_KNOWN_KEYS`, and the module-local absence sentinel WP02 defines. Without
      WP02 there is no field to decode.
  - edge: WP04 -> WP01
    kind: necessity
    why: >-
      WP04's acceptance evidence *is* WP01's refusing pins flipping red to green.
      Without the harness there is nothing for the gate to be the cause of.
  - edge: WP04 -> WP02
    kind: transitively-redundant
    why: >-
      Implied by WP04 -> WP03 -> WP02. Kept explicit because WP04's T024 and T026
      depend on WP02's field shape directly, not only through the verdict function.
      Not load-bearing for scheduling.
  - edge: WP04 -> WP03
    kind: necessity
    why: The three local gates call `tracker_egress_verdict`, which WP03 defines.
  - edge: WP05 -> WP04
    kind: risk-ordering
    why: >-
      Preference, not necessity. `plan.md` Sequencing states it: "nothing technical
      forbids the reverse order"; it is preferred so the verdict function is already
      exercised end to end by the local path before the shipped #3030 hosted gate is
      touched. WP05's own prompt (H-A) already separates this from its land-alone
      necessity; the board must not present the edge unqualified.
  - edge: WP06 -> WP05
    kind: risk-ordering
    why: >-
      Preference, not necessity. WP06's only technical dependency is the verdict
      function (IC-04 / WP03) — `plan.md` says so explicitly, and WP06's own prompt
      repeats it. The edge buys stability of guard G4's membership set when WP07
      lands, which WP07's own dependencies already guarantee. Costs one
      critical-path level; kept because the renderer's land-alone detection signal
      (a count over shared rendered output) is easier to attribute on a quiet tree.
      A scheduler short of parallelism may drop this edge to WP03.
  - edge: WP07 -> WP04
    kind: transitively-redundant
    why: Implied by WP07 -> WP05 -> WP04. Kept explicit because G3 pins WP04's three sites.
  - edge: WP07 -> WP05
    kind: transitively-redundant
    why: Implied by WP07 -> WP06 -> WP05. Kept explicit because G4/G5 pin WP05's call site.
  - edge: WP07 -> WP06
    kind: necessity
    why: >-
      G4's exact membership (five enclosing functions, six call expressions) is only
      satisfiable once the doctor renderer's two call expressions exist.
  - edge: WP08 -> WP05
    kind: necessity
    why: >-
      IC-09(b): only after the hosted gate lands is the remaining C-016
      HOSTED_SERVICE-side limitation's exact shape fixed, and the note states it.

