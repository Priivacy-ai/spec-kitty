findings:
  - id: PLAN-GOV-001
    lens: Directive
    severity: 2
    title: "Plan's core architectural justification miscounts invoke()'s length by ~2.5x"
    evidence:
      - artifact: "plan.md § Summary (line 33), also restated in tracer-approach.md § Planning-phase entry"
      - code: "src/specify_cli/invocation/executor.py:284-430"
    claim: >
      The plan's rationale for choosing a sibling `dry_run()` method over a boolean flag
      threaded through `invoke()` states invoke() is "a single 57-line method already at
      meaningful branching complexity." Measured directly against the checkout, `invoke()`
      spans lines 284-430 of executor.py — 147 total lines, 103 lines excluding blank/
      comment-only lines. The 57-line figure understates the method's actual size and
      complexity by roughly 2.5-2.8x. This is a claim about existing code stated as fact
      (not "approximately" or "roughly") and is repeated verbatim in tracer-approach.md,
      so the inaccuracy propagates into a second artifact.
    remediation: >
      Correct the line count in plan.md's Summary section and tracer-approach.md to the
      actual measured length (~103-147 lines depending on counting convention), or drop the
      specific number and describe the method qualitatively ("a long, branchy method").
      Note this does not change the plan's conclusion — the sibling-method choice is, if
      anything, better justified once the real complexity is stated correctly — but an
      implementer or future reader citing the wrong number as grounds for a similar decision
      elsewhere would be citing bad evidence.

  - id: PLAN-GOV-002
    lens: "Constitution Check honesty (mission-derived)"
    severity: 3
    title: "'Not a second competing canonical payload type' claim understates real drift risk between the two dry-run JSON shapes"
    evidence:
      - artifact: "plan.md § Constitution Check (line 73-77, 'Single canonical authority' bullet); plan.md § 'Two JSON shapes on the dry-run path' (lines 129-165)"
      - code: "src/specify_cli/invocation/executor.py:284-430 (InvocationPayload construction pattern, to_dict()-style shape ownership lives on the class)"
    claim: >
      The plan proposes a bespoke `_build_ambiguous_dry_run_payload(request_text, err) ->
      dict[str, object]` helper, living in `dispatch.py` next to `profile_not_found_routing`
      — i.e. in the CLI command layer, not colocated with `InvocationPayload.to_dict()` /
      `to_dry_run_dict()` in executor.py, which is where the plan says the "one owning
      shape" for dry-run responses otherwise lives. The plan's Constitution Check asserts
      "not a second competing canonical payload type," and the justification given is narrow:
      avoiding an `Optional` ripple into `InvocationPayload`'s non-Optional `profile_id`/
      `action` slots. That justification addresses only the *typing* convenience of not
      reusing the dataclass — it does not address the *field-set/key-name drift* risk the
      charter's single-canonical-authority principle actually warns about ("prefer
      require-canonical + migration over no-canonical-field fallback branches"). Concretely:
      the success-branch dry-run dict and the ambiguous-branch dict share several field names
      by convention only (`status`, `alternatives`, `router_confidence`) — nothing structural
      ties them together. A future maintainer adding or renaming a field on
      `InvocationPayload.to_dry_run_dict()` (e.g. widening `alternatives`'s entry shape, or
      adding a new top-level key) has no compiler/test signal that
      `_build_ambiguous_dry_run_payload()` in a different file needs the same edit — exactly
      the "second, competing shape" scenario the principle exists to prevent, even though the
      two are technically different Python types. The WP1 ATDD test list (plan.md's ATDD
      section) tests each shape in isolation (`test_dry_run_payload_shape`,
      `test_dry_run_ambiguous_returns_dry_run_payload_not_exit_1`) but includes no test
      asserting field-name parity between the two branches for their shared concepts.
    remediation: >
      Either (a) colocate `_build_ambiguous_dry_run_payload` as a classmethod/static builder
      beside `InvocationPayload.to_dry_run_dict()` in executor.py rather than as a freestanding
      dispatch.py helper, so both dry-run shape sources are visibly authored next to each
      other for the next maintainer touching this surface, or (b) add a narrow contract test
      (e.g. `test_dry_run_shapes_share_common_field_names`) asserting the ambiguous-branch
      dict's keys that overlap conceptually with the success-branch dict (`status`,
      `alternatives`, `router_confidence`) use identical key names, so a future rename on one
      side fails CI on the other instead of silently diverging. Either change keeps the
      plan's stated "not a competing canonical type" claim honest by giving it a structural
      backstop, not just a prose assertion.

  - id: PLAN-GOV-003
    lens: Directive
    severity: 1
    title: "Internal line-number inconsistency for the empty_charter.py RouterDecision call site"
    evidence:
      - artifact: "plan.md § Seam table (line 103, cites 'L120'); plan.md § '4 call sites' (line 122, cites 'L123')"
      - code: "src/specify_cli/invocation/empty_charter.py:123"
    claim: >
      The plan cites two different line numbers for the same `RouterDecision(...)`
      construction inside `resolve_generic_fallback()` — "L120" in the Seam table and "L123"
      in the "4 call sites" section. The actual construction (`return RouterDecision(`) is at
      line 123, so the "4 call sites" citation is correct and the Seam table's "L120" is off
      by 3 lines. No functional impact — an implementer will find the right site either way —
      but it is a small self-inconsistency in a plan that otherwise cites line numbers as
      precise, verified facts.
    remediation: "Update the Seam table's 'L120' to 'L123' to match the '4 call sites' section."
