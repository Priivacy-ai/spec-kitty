findings:
  - id: PLAN-ARCH-001
    lens: control-flow / FR-009 error-path routing
    severity: 4
    title: "\"Two JSON shapes\" section's dry-run ROUTER_AMBIGUOUS handling contradicts itself and, read literally, breaks FR-009's core P2 acceptance scenario"
    evidence:
      - artifact: "plan.md § \"Two JSON shapes on the dry-run path\" (lines 153-165), and the Seam table row for dispatch.py (line 99: \"error-path routing for FR-009's ROUTER_AMBIGUOUS→dry_run-payload translation lives here or in the executor (see below)\")"
      - code: "src/specify_cli/cli/commands/dispatch.py:178-201 (_dispatch_impl's single try/except around executor.invoke(...), with one `except RouterAmbiguityError as e:` clause at line 190 that unconditionally does exit 1 + structured error JSON for every RouterAmbiguityError regardless of e.error_code)"
      - code: "src/specify_cli/invocation/errors.py:30-42 (RouterAmbiguityError carries error_code but ROUTER_AMBIGUOUS and ROUTER_NO_MATCH are the SAME exception type — Python except clauses dispatch by type, not by attribute value)"
    claim: >
      The plan specifies that ProfileInvocationExecutor.dry_run() re-raises RouterAmbiguityError
      unchanged for BOTH the "ROUTER_AMBIGUOUS" case (which FR-009 requires to become an exit-0
      "status": "dry_run" payload with alternatives populated) and the "ROUTER_NO_MATCH" case
      (which must still exit 1 with the existing structured error JSON). It then says the
      ROUTER_AMBIGUOUS case needs "_dispatch_impl's dry-run branch" to "catch it ... specifically",
      while in the very next bullet it says ROUTER_NO_MATCH needs "no dry-run-specific handling ...
      _dispatch_impl's existing except RouterAmbiguityError ... handlers already do the right thing
      ... unchanged" — i.e. the SAME exception type must simultaneously get special dry-run-only
      handling (exit 0, dry_run payload) and be routed through the existing generic handler
      unchanged (exit 1, error JSON). Since Python except clauses select on exception type only,
      this is not achievable without an explicit `if e.error_code == "ROUTER_AMBIGUOUS": ... else:
      ...` branch inside whatever except clause first catches dry_run()'s RouterAmbiguityError — a
      branch the plan explicitly disclaims ("no dry-run-specific handling needed ... these are not
      new branches, they are the absence of a dry-run branch"). If an implementer takes the plan's
      "reuse the existing unchanged except RouterAmbiguityError handler" instruction literally by
      routing both invoke() and dry_run() calls through one shared try/except, dry-run's
      ROUTER_AMBIGUOUS case will also exit 1 with the error-JSON shape instead of the required
      exit-0 dry_run payload — breaking User Story 2 / Acceptance Scenario 3 and FR-009, one of
      this mission's headline UI-probing deliverables (the issue's own named use case). The Seam
      table's own hedge ("lives here or in the executor (see below)") signals this was left
      unresolved rather than pinned down.
    remediation: >
      Replace the "no dry-run-specific handling needed" framing with an explicit statement that
      _dispatch_impl's dry-run branch requires its OWN try/except scoped to the
      executor.dry_run(...) call (separate from the existing try/except around executor.invoke(...)),
      whose `except RouterAmbiguityError as e:` clause explicitly branches on `e.error_code`: build
      and emit the dry_run ambiguous payload (exit 0) when `e.error_code == "ROUTER_AMBIGUOUS"`,
      and otherwise reuse (via a small shared helper, not literal code duplication) the exact JSON
      shape/exit-1 behavior the existing invoke()-path handler produces. State this as the
      structural mechanism in the plan rather than leaving it as "lives here or in the executor" —
      per DIRECTIVE_043 (profile), a design that requires an implementer to independently discover
      this branching need is structurally incomplete.

  - id: PLAN-ARCH-002
    lens: reflexivity
    severity: 3
    title: "Plan silently drops spec.md's explicitly \"accepted\" mid-mission routing-consistency risk from Clarifications #5"
    evidence:
      - artifact: "spec.md § \"Clarifications / Decision Records\", item 5 (lines 292-300): \"In-mission auto-routed (no --profile) dispatch calls are exposed to a routing-consistency risk when WP3 lands mid-mission, and this is accepted.\""
      - artifact: "plan.md — no occurrence of \"mid-mission\", \"routing-consistency\", or equivalent language anywhere in the document (grep over the full file returns nothing); the closest plan.md gets is the WP3 sequencing rationale in the Summary (lines 20-25) and Dependency Graph (lines 550-557), both scoped to WP-ordering-within-this-mission, not to the accepted in-flight-consumer risk spec.md records"
    claim: >
      spec.md's operator-settled Clarifications are meant to be carried forward as binding context
      for implementers and reviewers, not re-derived from spec.md alone. Decision #5 is a
      deliberate, named risk acceptance ("this is accepted") specific to WP3's mid-flight landing
      behavior — exactly the kind of settled decision a plan should restate at the point it becomes
      operationally relevant (the WP3 section, or the Dependency Graph / sequencing discussion). The
      plan's WP3 sequencing sections discuss ordering and write-scope overlap with WP2 in detail but
      never mention this accepted risk, so a reader of plan.md alone (the artifact this review
      squad and future implementers are pointed at) would not learn that in-flight auto-routed
      dispatch calls elsewhere may resolve inconsistently once WP3 merges, or that this was already
      adjudicated rather than an open question to raise during implementation.
    remediation: >
      Add one sentence to the WP3 section (plan.md ~line 360-393) or the Dependency Graph
      discussion (~line 550-558) restating spec.md Clarifications #5 verbatim or by direct
      cross-reference, so the accepted risk is visible without requiring a reader to cross-check
      spec.md's Clarifications section independently.

  - id: PLAN-ARCH-003
    lens: blast radius
    severity: 3
    title: "Plan never addresses downstream/external consumers of a spec-kitty release carrying WP3's rerank"
    evidence:
      - artifact: "plan.md — no occurrence of \"team-kitty\", \"muster-missions\", \"downstream\", or any discussion of other repositories/consumers anywhere in the document"
      - artifact: "CLAUDE.md § \"Skill Routing\" (bottom of file): every spec-kitty-managed project's own CLAUDE.md instructs agents to run `spec-kitty dispatch \"<request verbatim>\"` for ad-hoc requests without `--profile` — i.e. auto-routed, no-hint dispatch calls are the DEFAULT pattern any spec-kitty consumer (including team-kitty-missions, muster-missions, and any other project bootstrapped with this CLI) relies on"
    claim: >
      WP3 (FR-006/FR-007) changes what `dispatch` (no `--profile`) auto-selects or rejects for
      requests that previously auto-selected a lone/weak domain-keyword candidate or let
      routing_priority decide across tiers. Every downstream project that has run `spec-kitty init`
      / `spec-kitty upgrade` and picks up the release containing this mission's changes will see
      some previously-succeeding auto-routed dispatch calls start raising ROUTER_AMBIGUOUS (exit 1)
      instead of silently opening an Op under a possibly-wrong profile — a behavior change to the
      CLI's most commonly invoked ad-hoc entry point (per CLAUDE.md's own "Lightweight dispatch"
      convention, used unconditionally for any "hey spec kitty, ..." request). This is a real,
      externally-visible behavior change with a plausibly large blast radius (every spec-kitty
      consumer repo, not just this one), yet the plan's PR-shape / gate-set / campsite sections
      never mention a CHANGELOG entry, a release note, or any acknowledgment that this ships as a
      breaking behavioral change for automation that assumed today's auto-select-on-lone-keyword
      behavior.
    remediation: >
      Add a short subsection (or extend "Silent-success framing") naming this as an intentional,
      user-visible behavior change on the auto-route path, and require a CHANGELOG.md entry (per
      AGENTS.md's own versioning/CHANGELOG convention) calling out that some previously-successful
      no-`--profile` dispatch calls will now exit 1 with ROUTER_AMBIGUOUS instead of auto-selecting
      — so downstream consumers upgrading their spec-kitty CLI pin are not surprised.

  - id: PLAN-ARCH-004
    lens: migrations
    severity: 2
    title: "Plan doesn't explicitly confirm that `alternatives` stays out of the persisted `OpStartedEvent`/`kitty-ops/*.jsonl` schema"
    evidence:
      - artifact: "plan.md — no mention of `OpStartedEvent`, `record.py`, or the persisted kitty-ops schema anywhere; the Seam table (lines 97-106) and Blast Radius equivalent list every touched file but never states this reasoning"
      - code: "src/specify_cli/invocation/record.py:45-69 (OpStartedEvent, a frozen pydantic BaseModel with an explicit, closed field list — no alternatives field, and not in this mission's touched-file list)"
      - code: "src/specify_cli/invocation/executor.py:386-405 (the OpStartedEvent(...) construction inside invoke()'s write half, which WP2 does not touch — confirmed by inspection: the plan's own Seam table says invoke()'s body is \"unchanged except adding alternatives=result.alternatives ... to its final InvocationPayload(...) construction\")"
    claim: >
      Verified correct in the actual codebase: `alternatives` is added only to `RouterDecision` and
      `InvocationPayload` (both ephemeral, non-persisted types), and `OpStartedEvent` — the type
      actually serialized to `kitty-ops/*.jsonl` — is untouched and has no `alternatives` slot, so
      there is no schema/migration concern here. However, the plan never states this reasoning
      explicitly anywhere, despite this being exactly the kind of "new field on a response payload"
      change that could plausibly leak into a durable schema if an implementer added
      `alternatives=result.alternatives` to the nearby `OpStartedEvent(...)` construction by
      analogy with the `InvocationPayload(...)` change three lines away. The omission is a
      documentation-completeness gap, not a functional defect (record.py is correctly excluded
      from every touched-file list in the plan), so this is low-risk but a one-sentence
      confirmation would close the loop for a future reader who asks the same "does this leak into
      a durable record?" question this mission's own Silent-success framing section poses for
      every other new field.
    remediation: >
      Add one sentence to the "Contracts" section (or the `alternatives` bullet in "Silent-success
      framing", plan.md ~line 446) stating explicitly that `OpStartedEvent`/`kitty-ops/*.jsonl` is
      untouched and `alternatives` is not added to the persisted Op-record schema — closing the
      "could this leak into a durable schema" question the mission-derived review lens raised,
      rather than leaving it to be re-derived by inspection.

  - id: PLAN-ARCH-005
    lens: generated artifacts
    severity: 1
    title: "Seam table cites empty_charter.py's RouterDecision construction at L120; actual line is L123 (plan's own \"4 call sites\" section elsewhere correctly says L123)"
    evidence:
      - artifact: "plan.md line 103 (Seam table): \"resolve_generic_fallback()'s single RouterDecision(...) construction (L120)\""
      - artifact: "plan.md line 122 (\"4 call sites\" section, item 4): \"empty_charter.py resolve_generic_fallback() (L123)\""
      - code: "src/specify_cli/invocation/empty_charter.py:123 (`return RouterDecision(` — confirmed via grep, the only RouterDecision( construction in the file)"
    claim: >
      The plan cites two different line numbers (L120 and L123) for the same single
      RouterDecision(...) construction site in empty_charter.py. The correct line, per direct
      inspection, is 123 — matching the plan's own "4 call sites" section, not the Seam table row.
      Low impact (the file has exactly one RouterDecision( call, trivially findable regardless of
      the off-by-3 citation), but the plan otherwise cites router.py line ranges with exact
      precision throughout, so this one inconsistency stands out and is worth a one-line fix for
      internal consistency.
    remediation: "Change plan.md line 103's \"(L120)\" to \"(L123)\" to match the correct line and the plan's own later citation."
