  - path: ".kittify/glossaries/spec_kitty_core.yaml"
    field_path: "terms[surface in {drg, doctrine reference graph, doctrine artifact, doctrine pack}]"
    action: do_not_change
    reason: "ONLY the domain-concept surfaces are permanent/M2 vocabulary. `surface: doctrine` (governing body) is RENAMED and reconciled against the pre-existing `surface: charter` term (B2)."
  - path: "packs/built-in/glossary_packs/spec-kitty-core.glossary-pack.yaml"
    field_path: "terms[surface in {drg, doctrine reference graph, doctrine artifact, doctrine pack}]"
    action: do_not_change
