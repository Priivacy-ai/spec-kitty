- id: n-002
  category: tooling
  summary: 'Tracer: Structural (tooling):'
  evidence_refs:
  - e-011
  details: "1. **Structural (tooling):** this mission was created with `--start-branch\n   fix/mission-a-p0-consistency` (pr-bound
    feature branch) **and** got **coord\n   topology**. The coord branch (`kitty/mission-…`) was branched from the old\n \
    \  base (`b7c080c`) and given its **own** planning-artifact snapshot, while the\n   real planning (spec/plan/tasks/**lanes.json**)
    landed on the **fix** branch.\n   Result: **coord never contained the primary `planning_commit_sha`.** Lanes\n   seed
    from coord and merge the primary planning commit → `lanes.json`\n   (which embeds `planning_commit_sha`) is an add/add
    conflict every time.\n   This is the #3311 chicken-and-egg (FR-009 / ADR 2026-07-29-1) the mission\n   itself exists to
    fix, surfacing in the allocator."
- id: n-005
  category: tooling
  summary: 'Tracer: pr-bound feature-branch + coord topology should not diverge at create'
  evidence_refs:
  - e-011
  details: "1. **pr-bound feature-branch + coord topology should not diverge at create** —\n   the coord branch must be created
    so it contains (or fast-forwards to) the\n   primary planning commit; otherwise every lane-seed conflicts. (Adjacent to\n\
    \   #3311 / FR-009 provenance.)\n2. **finalize-tasks commits `status.{json,events.jsonl}` onto the PRIMARY branch\n  \
    \ under coord topology** (`files_committed` includes them) — that is the\n   split-brain seed; status should be coord-only
    under coord topology.\n3. **`re-finalize` re-captures `planning_commit_sha` to the tip-*before* its own\n   commit**,
    so the recorded SHA references a commit whose embedded `lanes.json`\n   points at a different SHA (self-inconsistent)
    — the exact #3311 defect."
