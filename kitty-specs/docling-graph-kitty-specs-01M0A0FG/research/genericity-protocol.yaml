schema_version: 1
implementation_scan:
  forbidden_literal_sources:
    - query-registry fixture values
    - fixtures/gold/gold-approved.csv subjects objects source paths and local IDs
  allowed_locations:
    - research fixtures
    - evaluator code
  candidate_harness_allowed: false
execution:
  original_fixture_scored_after_mutations: true
  mutation_source: fixtures/metamorphic-fixtures.yaml
  required_mutation_passes: 5
  hardcoded_original_answer: mandatory_gate_fail
limitations:
  - transparent benchmarks can still be overfit by a malicious implementation
  - code review and metamorphic transforms reduce but do not eliminate benchmark leakage
  - no production-adoption claim may rely on this benchmark alone
