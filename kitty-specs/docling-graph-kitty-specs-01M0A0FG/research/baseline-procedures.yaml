schema_version: 1
mission_research_dir: kitty-specs/docling-graph-kitty-specs-01M0A0FG/research
operator: single_researcher_codex
hardware_capture: [uname, sw_vers, sysctl_hw_memsize, python_version]
trial_count: 5
run_orders:
  - [B0, B1, B2, C3a, C5a, C3b, C4, C5b]
  - [B1, B2, C3a, C5a, C3b, C4, C5b, B0]
  - [B2, C3a, C5a, C3b, C4, C5b, B0, B1]
  - [C3a, C5a, C3b, C4, C5b, B0, B1, B2]
  - [C5a, C3b, C4, C5b, B0, B1, B2, C3a]
timing_boundary: prompt_or_query_displayed_to_final_answer_rows_written
timing_status: exploratory_only
cache_states:
  cold: delete_only_declared_candidate_cache_then_verify_absent
  warm: one_unscored_build_and_query
correction_policy: no answer edits after timer stop; corrections logged separately
answer_schema: query-registry.yaml#answer_schema
candidate_api:
  invocation: CANDIDATE --fixture-bundle BUNDLE_JSON --queries QUERIES_JSON --output ANSWERS_CSV
  evaluator: evaluate_answers.py
  required_runs: [ORIGINAL, M1, M2, M3, M4, M5, H1, H2]
  implementation_blinding: independent implementer may not inspect gold or withheld mutations
engineering_budgets:
  B2_hours: 8
  each_new_docling_harness_hours: 8
  sensitivity_check_hours: [2, 8]
baselines:
  B0:
    tools: [rg, git, source_open]
    procedure: answer each frozen query from baseline revision and emit canonical rows
    evaluation_command: .venv/bin/python kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/evaluate_recorded_answers.py --candidate B0 --answers kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/results/B0-answers.csv --output kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/results/B0-evaluation.json
  B1:
    tools: [mission_dossier, canonical_json_yaml_jsonl_frontmatter_readers]
    procedure: build canonical dossier snapshot then answer identical rows
    evaluation_command: .venv/bin/python kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/evaluate_recorded_answers.py --candidate B1 --answers kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/results/B1-answers.csv --output kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/results/B1-evaluation.json
  B2:
    tools: [research_native_projection]
    procedure: deterministic explicit-ID/link projection only; no inferred relation
    representation_boundary: direct typed rows and indexes; no general graph data structure
    evaluation_command: .venv/bin/python kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/evaluate_answers.py --candidate kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/candidates/B2 --candidate-source kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/candidates/B2 --output kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/results/B2-evaluation.json
  B3:
    status: design_only
    procedure: estimate authoring and migration burden; never claim empirical query win
  C5a:
    representation_boundary: property graph with explicit typed nodes and edges; no inference
    evaluation_command: .venv/bin/python kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/evaluate_answers.py --candidate kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/candidates/C5a --candidate-source kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/candidates/C5a --output kitty-specs/docling-graph-kitty-specs-01M0A0FG/research/results/C5a-evaluation.json
