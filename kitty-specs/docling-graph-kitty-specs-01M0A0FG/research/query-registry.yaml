    - pytest_result
    - accepted_at
    - depends_on
    - merge_target
    - implemented_by
    - owns
    - sizing_verdict
    - root_cause
    - cost
    - status
    - label
  forbidden_relation_families:
    contradiction: [contradicts, conflicts_with, inconsistent_with, incompatible_with]
    identity_equivalence: [same_entity_as, equivalent_to, same_as, identical_to]
  unregistered_predicate: false_positive
  evaluation_precedence:
    - normalize_predicate
    - match_forbidden_relation_family_and_unordered_pair
    - validate_allowed_predicate_vocabulary
    - score_expected_atom_set
