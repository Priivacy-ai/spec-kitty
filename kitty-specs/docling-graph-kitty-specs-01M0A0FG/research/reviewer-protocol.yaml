schema_version: 1
blind_to_candidate_outputs: true
candidate_outputs_exist_at_assignment: false
reviewers:
  - task: /root/bundle_gold_reviewer_a
    profile: reviewer-renata
    scope: every_gold_atom_and_query_completeness
  - task: /root/bundle_gold_reviewer_b
    profile: debugger-debbie
    scope: every_gold_atom_and_query_completeness
adjudicator:
  task: /root
  may_add_unreviewed_atom: false
required_attestations:
  - baseline_revision
  - gold_sha256
  - reviewed_atom_ids
  - per_atom_pass_or_fail
  - completeness_verdict
  - candidate_blinding
