schema_version: 1
cache_key_components: [source_blob_set_hash, schema_hash, model_hash_or_none, config_hash]
scenarios:
  - id: edit
    expected: new_key_old_entry_unreadable
  - id: rename
    expected: identity_and_provenance_update_old_path_unreadable
  - id: delete
    expected: tombstone_or_absence_old_fact_unreadable
  - id: restore
    expected: deterministic_recreation
  - id: branch_switch
    expected: branch_specific_key_no_cross_branch_stale_read
  - id: schema_change
    expected: old_version_refused_then_atomic_rebuild
  - id: model_change
    expected: semantic_layer_invalidated_deterministic_core_preserved
  - id: config_change
    expected: affected_layer_invalidated
  - id: failed_regeneration
    expected: prior_valid_snapshot_or_explicit_unavailable_never_partial
  - id: rollback
    expected: prior_key_reusable_only_on_exact_input_match
  - id: cleanup
    expected: derived_cache_removed_sources_unchanged
stale_read_deadline: next_read
derived_diff_limits:
  files: 5
  lines: 50
