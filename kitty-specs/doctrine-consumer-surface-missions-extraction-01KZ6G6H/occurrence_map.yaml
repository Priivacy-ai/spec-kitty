# Occurrence map for mission doctrine-consumer-surface-missions-extraction-01KZ6G6H
# (Missions/ Doctrine Tree Relocation & Gate Preconditions).
#
# Schema: src/doctrine/schemas/occurrence-map.schema.yaml

target:
  term: src/doctrine/missions
  replacement: packs/built-in/missions
  operation: rename

categories:
  code_symbols:
    action: manual_review
    # Not a symbol rename in itself. Manual review because FR-004's kernel
    # primitive extraction and its convergence of doctrine/pack_paths.py onto
    # it renames/replaces internal function bodies (get_package_asset_root's
    # helpers, _resolve_built_in) — implementation-detail changes the
    # reviewer should see per-site, not a mechanical find-and-replace.
  import_paths:
    action: manual_review
    # The relocation moves DATA content (templates, mission-steps prompts,
    # step-contract YAML/MD) under src/doctrine/missions/. Whether any
    # sibling .py modules there (mission_type_repository.py,
    # step_contracts.py, etc.) also move — versus staying in place as logic
    # modules per the #2652 precedent ("retain sibling .py modules") — is
    # exactly what FR-003's reader inventory decides per file. No blanket
    # import-path rename is safe to assume before that inventory exists.
  filesystem_paths:
    action: manual_review
    # This IS the mission. Every literal path reference to
    # src/doctrine/missions (or the specify_cli/missions sibling shape
    # kernel's _resolve_env_root also hardcodes) needs FR-003's per-site
    # move/stay/repoint decision — no blanket action is safe.
  serialized_keys:
    action: do_not_change
    # No JSON/YAML/TOML *keys* are renamed by this mission — only a
    # directory location changes. Mission-type ids (software-dev, research,
    # documentation, plan) are unchanged.
  cli_commands:
    action: do_not_change
    # No CLI subcommand, flag, or verb changes name.
  user_facing_strings:
    action: rename_if_user_visible
    # Docs/README prose that names the literal src/doctrine/missions path
    # (e.g. architecture docs, ADRs referencing the pre-move location) should
    # update to the new path where user/contributor-visible; internal error
    # messages that happen to embed the old path are covered under
    # filesystem_paths instead.
  tests_fixtures:
    action: rename
    # Tests asserting the old path/location must be updated to assert the
    # new one — a test still asserting src/doctrine/missions after the move
    # is simply wrong, not a case needing individual judgment.
  logs_telemetry:
    action: do_not_change
    # No metric name, log key, or telemetry event references this path.

exceptions:
  - path: "src/doctrine/missions/*.py"
    action: manual_review
    reason: "CONFIRMED during post-plan review (not merely candidate): the 11 top-level .py logic modules (repository.py, mission_type_repository.py, mission_step_repository.py, step_projection.py, models.py, action_index.py, primitives.py, step_contracts.py, step_offer_seam.py, glossary_hook.py, __init__.py) STAY in src/doctrine/missions/ as an ordinary Python package -- they are NOT relocated. packs/built-in/ cannot host them (hyphenated name is not a legal package identifier; every sibling kind directory ships YAML/MD content only). They ARE edited in place: their own internal path assumptions are repointed to read the new external data root. CORRECTED 2026-08-04 (was action: do_not_change): the do_not_change label expressed the do-NOT-MOVE intent, but the diff-compliance gate reads it as do-not-EDIT and BLOCKED WP04's review for touching repository.py -- an edit FR-004/T018 explicitly requires, and which this map's own third exception below independently authorises as manual_review. The two rules contradicted each other and the broader glob won. The do-not-move intent is carried by the moves: block below, which lists only data directories and no .py file; per-site editing judgement is what manual_review is for."
  - path: "packs/built-in/agent_profiles/doctrine-daphne.agent.yaml"
    action: manual_review
    reason: "ADDED 2026-08-04: the diff-compliance gate classifies this file as `serialized_keys` by extension, and that category is `do_not_change`, so it BLOCKED WP02's review for an edit spec.md FR-002 explicitly mandates -- 'Scope includes the daphne cleanup itself (removing the src/doctrine/graph.yaml mention from packs/built-in/agent_profiles/doctrine-daphne.agent.yaml's avoidance-boundary, at that file's line 136)'. The `serialized_keys: do_not_change` category rule remains CORRECT and unchanged: this mission renames no JSON/YAML/TOML key. The daphne edit is prose inside a scalar VALUE (the avoidance-boundary text), not a key rename -- the extension-based classification cannot see that distinction, which is what a per-file exception is for. manual_review, not do_not_change, because a reviewer must confirm the edit removes the repo-local COUPLING rather than merely rewording until the gate's regex stops matching (issue #3036 rejects the equivalent dodge on the assertion side)."
  - path: "kitty-specs/**"
    action: manual_review
    reason: "ADDED 2026-08-04. The diff-compliance gate scans the whole review diff (lane base -> HEAD), which for any WP in this mission necessarily includes the mission's OWN bookkeeping churn under kitty-specs/<mission>/. Being .json/.yaml, those files classify as `serialized_keys` (do_not_change), so the gate BLOCKED WP03's review on 8 of them: lanes.json, occurrence_map.yaml, and four tasks/WP0*/baseline-tests.json files. None of them is an occurrence of the target term `src/doctrine/missions` -- they are (a) CLI-written lifecycle artifacts (baseline-tests.json written by each claim's baseline capture; lanes.json; status.json; status.events.jsonl; issue-matrix.json) and (b) explicit governance amendments recorded during this mission (occurrence_map.yaml itself, WP frontmatter owned_files corrections). Mission bookkeeping is not product content and is not subject to a bulk-edit occurrence map. NOTE the recursion, stated plainly rather than hidden: this entry lets occurrence_map.yaml stop blocking reviews of its own amendment history. That is why the action is `manual_review` and not a silent carve-out -- every such amendment in this mission is a standalone commit with its reasoning in the message (86ba269de, 5a70fbb00, 0443cb4bc, 8be0bd0f7, 0bb01b387, 39a24f06a), so a reviewer can audit the governance trail directly."
  - path: "packs/built-in/mission_type.graph.yaml"
    action: manual_review
    reason: "ADDED 2026-08-04, pre-emptively, same defect class as the daphne exception above. This is a DRG-GENERATED fragment, not hand-authored, and FR-005/T024 explicitly requires regenerating it and diffing it against committed state once drg/migration/extractor.py::_missions_root() is repointed. Being `.yaml` under packs/built-in/, the diff-compliance gate would classify it `serialized_keys` (do_not_change) and block WP05's review exactly as it blocked WP02's for the daphne profile. Its node/edge KEYS are unchanged -- only path-valued content moves from src/doctrine/missions to packs/built-in/missions -- so the category rule itself stays correct. manual_review because a reviewer must confirm the regeneration is byte-identical to committed state per SC-008 (tests/doctrine/drg/test_regen_roundtrip.py is the backstop) rather than hand-edited: hand-editing a generated fragment is a violation doctrine-daphne's own avoidance-boundary names."
  - path: "packs/built-in/mission_step_contract.graph.yaml"
    action: manual_review
    reason: "ADDED 2026-08-04. Identical rationale to packs/built-in/mission_type.graph.yaml above -- the second DRG-generated fragment FR-005/T024 must regenerate and diff after the extractor repoint. Same `serialized_keys` extension-classification block, same SC-008 byte-identity requirement, same prohibition on hand-editing a generated fragment."
  - path: "src/doctrine/drg/migration/extractor.py"
    action: manual_review
    reason: "CONFIRMED during post-plan review: _missions_root()'s own docstring asserts missions/ was not relocated by an earlier flatten and 'still lives inside the doctrine package' -- an assumption this mission's move falsifies. Must be repointed as part of the same atomic change (FR-005), with packs/built-in/mission_type.graph.yaml and mission_step_contract.graph.yaml regenerated and diffed against committed state."
  - path: "src/doctrine/missions/repository.py"
    field_path: "MissionTemplateRepository.default_missions_root"
    action: manual_review
    reason: "CONFIRMED during post-plan review: this classmethod is the already-promoted authority a prior mission's WP06 explicitly deferred converging onto the FR-004 kernel primitive to this issue (#3091) -- see tests/charter/test_missions_root_authority.py's own docstring. Converges onto the kernel primitive per FR-004, not merely repointed to a new literal path."

moves:
  - from:
      - src/doctrine/missions/mission_types
      - src/doctrine/missions/mission-steps
      - src/doctrine/missions/built_in_step_contracts
      - src/doctrine/missions/documentation
      - src/doctrine/missions/plan
      - src/doctrine/missions/research
      - src/doctrine/missions/software-dev
      - src/doctrine/missions/README.md
    to: packs/built-in/missions
    reason: "Relocate the missions/ doctrine tree's DATA CONTENT (issue #3091) to the shippable packs/built-in location, alongside every other built-in doctrine kind directory (agent_profiles/, directives/, tactics/, ...). VERIFIED directory listing during post-plan review: src/doctrine/missions/ top level is mission_types/ (per-type .yaml profiles), mission-steps/ (step prompt dirs), built_in_step_contracts/ (step-contract YAML), four per-type content dirs (documentation/, plan/, research/, software-dev/), README.md, plus the 11 .py logic modules (see the do_not_change exception above) and __pycache__ (build artifact, not moved or tracked). Only the data listed here moves -- the .py modules stay, since packs/built-in/ cannot host Python modules. Landed as ONE atomically-reviewed change together with every reader repoint (FR-005) -- a move-without-repoint intermediate state is a genuinely broken build, not a safe incremental step."
