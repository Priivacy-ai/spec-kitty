  - id: RULING2-SPEC
    status: resolved
    reason: >
      Verified d84ccd561's spec.md changes against plan.ruling.md's five-item verifier
      instruction, line by line. (1) Separate reasoning: spec.md:90 and :394 both now read
      "not one shared architectural guarantee" / "reasoned about separately, not as one shared
      architectural guarantee" — the assembler's carve-out is justified purely structurally
      (`_copy_drg_fragments` never writes a pack-root graph), `org_validate`'s dropped-carve-out
      is justified by the glob mismatch; no remaining prose funds both from one claim (grep for
      "shared architectural" returns only the two negation instances). (2) Explicit
      `check_drg_root=True`: spec.md's FR-004 body states the call site "passes
      `check_drg_root=True` explicitly rather than relying on `validate_pack`'s own default,
      with a short inline comment recording why" — reason given (future-default-change safety,
      AC-7 assertability). Confirmed live at doctrine.py:966 today: `result =
      validate_pack(pack_path)` (pre-implementation baseline; the explicit True is this
      mission's own future edit, correctly described as prospective). (3) False passage
      corrected, not reworded: spec.md now has a dedicated "Corrected: what a
      uniformly-applied default-error severity would actually do" passage that states the old
      claim, marks it "checked directly against this checkout and found factually false;
      corrected here, not merely reworded," and gives the true account (org_init's
      `drg/fragment.yaml` never matches `*.graph.yaml`, so
      `test_doctrine_org_validate_accepts_valid_pack` was never at risk). Verified independently:
      `org_init` (doctrine.py:899-940) writes exactly `org-charter.yaml`, `drg/fragment.yaml`,
      `README.md`; `_validate_drg` (pack_validator.py:506) globs `drg_dir.glob("*.graph.yaml")`
      — `fragment.yaml` cannot match that pattern, so the corrected text is true against this
      checkout. (4) AC-7 inverts and gains the positive-fire case: spec.md's AC-7 now reads
      "`check_drg_root=True` call carries no carve-out" with case (a) the unmodified-scaffold
      negative (asserts True is the actual parameter value, mirroring AC-6's assertion style)
      and case (b) "no fixture exists in the suite today" — pack scaffolded via org init, then
      given a real `drg/*.graph.yaml` fragment with no pack-root graph, asserting
      `drg_root_graph_missing` fires through `doctrine org validate`. This matches the ruling's
      #5 requirement verbatim. (5) pack_assembler.py's carve-out survives unconditional: spec.md
      states "carve-out stands, unconditional, unchanged," cites
      `test_pack_assembler.py:184-188` as load-bearing. Read those exact lines: `_add_drg_fragment(a,
      "010.graph.yaml", ...)` / `_add_drg_fragment(b, "010.graph.yaml", ...)` inside
      `test_force_dedup_prunes_duplicate_edges_via_canonical_serializer`, followed at :193 by
      `assert result.ok is True` — fragment names genuinely match `*.graph.yaml`, confirming the
      carve-out really is load-bearing for that test as claimed.

