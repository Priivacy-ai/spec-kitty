  - id: PLAN-FRESH3-002
    status: partial
    reason: >
      Read the charter's actual C-011 text first-hand (.kittify/charter/charter.md:591-604):
      "The reviewer verifies red→green: the test was RED on the WP's planning_base_branch AND
      GREEN on the WP's final commit." `planning_base_branch` is not a loose phrase — it is a
      concrete, defined frontmatter/context field (src/specify_cli/.contextive/orchestration.yml:67,
      src/specify_cli/frontmatter.py:65) meaning "the branch active in the repository root
      checkout when WP prompts were generated," fixed once per WP/lane, not a moving intra-lane
      commit pointer. The plan's new "Per-FR ATDD Sequencing (C-011)" subsection (plan.md:395-463)
      is real, concrete, and names real AC fixtures — verified FR-002/FR-003/FR-004's AC-1, and
      FR-004's AC-6/AC-7, all exist verbatim in spec.md (grep confirms AC-1 at spec.md:320/361/466,
      AC-6 at :483, AC-7 at :493). Named test files exist (tests/specify_cli/doctrine/
      test_pack_validator.py, tests/doctrine/test_agent_profile_model_field.py). But the Charter
      Check gate's own summary line (plan.md:104, "the reviewer verifying red-on-
      `planning_base_branch` / green-on-final-commit") promises exactly the charter's literal
      check, and the detailed procedure it points readers to does not deliver that for two of
      the three FRs: FR-002's test commit is specified to run "against the state after FR-003's
      implementation commit (Lane B's running tip)" (plan.md:425) and FR-004's "against the state
      after FR-002's implementation commit" (plan.md:437) — neither is Lane B's
      `planning_base_branch`, only FR-003's (first in sequence) actually is (plan.md:414). The
      Reviewer-verification paragraph (plan.md:445-451) then generalizes this substituted
      reference point to all three pairs ("the tree immediately before the paired implementation
      commit"), never invoking `planning_base_branch` for the actual verification step it
      describes. This is a real letter-vs-substance gap, not merely stricter rigor dressed up
      differently: the finding's own prescribed fix (plan-fresh-3.yaml:100-107) explicitly asked
      for tests "confirmed RED against Lane B's `planning_base_branch`" — the plan substitutes a
      different (arguably still-valid, since less code at an earlier point implies the same RED
      result) checkpoint without saying so or reconciling it with the promise made three lines
      earlier in the same document. FR-001's C-011 exemption (plan.md:456-463) is well-reasoned
      and correctly grounded in spec.ruling.md's binding documentation-only scope and C-004's
      test-surface exclusion — that part is fully resolved. Net: satisfies the finding's wording
      (C-011 is now named, cited, and given a concrete per-FR procedure) but the procedure it
      actually specifies for 2 of 3 FRs is not the check C-011's own text and the finding's own
      fix both call for, and the plan does not reconcile or justify the substitution anywhere.

new_findings:
  - id: PLAN-V4-001
    severity: 2
    lens: consistency
    location: "plan.md:104 vs plan.md:414-451"
    finding: >
      Internal inconsistency introduced by this fix: the Charter Check gate's C-011 summary
      bullet (plan.md:101-108) promises reviewer verification of "red-on-`planning_base_branch`
      / green-on-final-commit," but the "Per-FR ATDD Sequencing (C-011)" subsection it points to
      specifies FR-002's and FR-004's red-check against "Lane B's running tip" (the state after
      the immediately-preceding FR's implementation commit), not against `planning_base_branch`
      — a term with a fixed, codebase-defined meaning (src/specify_cli/.contextive/
      orchestration.yml:67) distinct from any intra-lane commit. Only FR-003 (first in sequence)
      actually gets checked against `planning_base_branch`.
    evidence: >
      plan.md:104 "the reviewer verifying red-on-`planning_base_branch` / green-on-final-commit"
      vs. plan.md:425 "Run against the state after FR-003's implementation commit (Lane B's
      running tip)" and plan.md:437 "Run against the state after FR-002's implementation
      commit," and plan.md:445-451's reviewer-verification paragraph, which frames the RED check
      generically as "the tree immediately before the paired implementation commit" for all
      three pairs and never names `planning_base_branch` as the actual comparison point used.
    fix: >
      Either (a) add an explicit `planning_base_branch`-relative RED check for FR-002 and FR-004
      alongside the existing intra-lane-tip check (the intra-lane check is still useful for
      precise attribution, but does not substitute for the charter's specified comparison
      point), or (b) if the intra-lane-tip check is judged sufficient in substance, say so
      explicitly and reconcile it with the Charter Check bullet's wording so the plan is not
      promising one verification method in one place and specifying a different one three
      sections later.

verdict: fail
