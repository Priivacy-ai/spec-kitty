    lens: falsifiability
    severity: 3
    title: "FR-001's own named edge case (stray *.contract.yaml co-existing with a correct *.step-contract.yaml sibling) has no corresponding Acceptance Criterion"
    evidence:
      - artifact: "spec.md § Edge Cases (bullet 1) and § FR-001 Acceptance Criteria"
      - code: "src/specify_cli/doctrine/pack_validator.py:181, :202-206"
    claim: >
      No AC covers the sibling-co-existence scenario named in Edge Cases. A wrong
