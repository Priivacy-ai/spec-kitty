findings:
  - id: SPEC-GOV-001
    lens: Scope-boundary fidelity against in-flight/proposed work (mission-derived)
    severity: 4
    title: >-
      Clarification Q1/A1 misstates ADR 2026-08-13-1's status as "Proposed"/unratified —
      the PR's actual current head shows it "Accepted"
    evidence:
      - artifact: "spec.md § Clarifications, Session 2026-08-13, Q1/A1 (lines 14-16)"
      - artifact: >-
          spec.md quote: "...but that ADR is status Proposed, unratified, carries no
          target mission and no date, and is one of six ADRs bundled into PR #3378..."
      - code: >-
          docs/adr/3.x/2026-08-13-1-built-in-mission-subtree-stays-nested-retire-legacy-step-contracts.md,
          fetched directly from PR #3378's current head commit
          (`gh api repos/Priivacy-ai/spec-kitty/contents/...?ref=37a38274553f868de31cf77e900a3f2418f632bf`):
          frontmatter `status: Accepted`, body `**Status:** Accepted`, `**Date:** 2026-08-13`,
          `**Deciders:** Operator (ATDD)`. `gh pr view 3378` confirms `state: OPEN` (unmerged),
          consistent with the spec, but the per-ADR status claim is wrong.
      - code: >-
          The other five ADRs bundled in the same PR (2026-08-13-2 through -6, the *gate*
          ADRs) genuinely are `status: Proposed` — confirmed via
          `gh pr diff 3378 | grep '^+status:'`. The PR body's own summary line ("All gate
          ADRs are Proposed — this is for design review, not implementation") refers to
          those five gate ADRs; ADR 2026-08-13-1 (the one this spec cites) is explicitly
          not one of them and is the one ADR in the batch already marked Accepted by the
          operator, dated the same day as this spec.
    claim: >-
      The spec's central justification for Constraint C-001 (proceed on the legacy
      `MissionStepContract`/`step_contracts.py` surface rather than anticipate the
      `MissionStep` unification) rests on characterizing ADR `2026-08-13-1` as
      "unratified" with "no ... date" — both false on the current PR head. The ADR is
      `status: Accepted`, dated, and decided by the Operator. This is a materially
      different governance state than "nothing binds until an ADR is ratified" (the
      spec's own framing, quoted verbatim in A1): the retirement-in-favor-of-`MissionStep`
      decision **is** ratified; only the actual code migration (tracked separately, and
      correctly noted as unmerged/not yet implemented) has not landed. The "negligible
      sunk cost if retired later" fallback argument in A1 may still independently justify
      proceeding, but the spec currently states a false premise ("nothing binds") as the
      reason, which a plan-phase author or reviewer could not distinguish from the true,
      narrower state ("bound in principle, not yet implemented") without re-deriving it
      themselves — exactly the citation-drift risk this spec otherwise takes pains to
      catch (cf. its own snapshot.py correction). Left as written, a future reader citing
      this spec's Q1/A1 as "the ADR isn't ratified" would be repeating a false claim this
      review has now falsified directly against the PR.
    remediation: >-
      Re-verify `gh pr view 3378` / `gh api .../contents/docs/adr/3.x/2026-08-13-1-...md`
      at plan-phase start (status can still change before merge) and correct A1's wording
      to state accurately that ADR 2026-08-13-1 is `Accepted` (ratified as a design
      decision, by the Operator, dated 2026-08-13) but its retirement of
      `step_contracts.py`/`MissionStepContract` has **not yet been implemented** (PR #3378
      is docs-only and unmerged, so no migration has landed and `MissionStepContract`
      remains the operative on-disk model today). Keep the "fix now, small sunk cost if
      later superseded" conclusion if the plan author still judges it correct under the
      accurate premise, but do not describe the retirement decision itself as unratified
      or dateless — it is neither. Also correct C-001's rationale text (currently silent on
      the ADR's real status) to reference "Accepted-but-unimplemented" rather than
      implying no decision exists yet.
