      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1124 — unmapped_functional_requirements = sorted(functional_spec_requirement_ids - mapped_requirement_ids)"
      - code: "src/specify_cli/requirement_mapping.py:15-16 — _REF_PATTERN / _REF_FIND_PATTERN = re.compile(r\"\\b(?:FR|NFR|C)-\\d+\\b\") — live-run against 'FR-005a' returns []"
      - code: "src/specify_cli/requirement_mapping.py:68 — _TABLE_ROW_ID_PATTERN — live-run against 'FR-005a' returns []"
      - code: "src/specify_cli/requirement_mapping.py:375-379 — a code comment already documents this exact class of gap for C-007-mission/C-009-mirror ids"
      - code: "Live-verified independently by 3 sessions (both R1 lens groups + R3 refuter): _declared_ids() run against this mission's own spec.md returns 'FR-005' but NOT 'FR-005a'"
    claim: >
      WP03's own prompt-file frontmatter requirement_refs list is missing FR-005a, even though
      wps.yaml and the generated tasks.md both list FR-005a for WP03, and WP03's prompt body
      substantively covers FR-005a throughout (a named Context subsection, dedicated subtask
      T014, Definition-of-Done bullet). Root cause: finalize-tasks's coverage-gate regex family
      never matches letter-suffixed ids like "FR-005a" (fails the \b(?:FR|NFR|C)-\d+\b pattern
      on both the spec-declared side and the WP-mapped side, confirmed by 3 independent live
      regex runs), so the mechanical FR-coverage gate is structurally blind to FR-005a
      regardless of what any WP's frontmatter says. For this mission's actual deliverable there
      is no wrong-implementation risk today (WP03's prose body is complete and its RED-first
      ATDD test was traced live and confirmed to go RED today / GREEN after WP03's fix) — the
      real risk is a structural, silent coverage-gate blind spot with no automated backstop for
      this or future missions using the same sub-lettered FR convention.
    remediation: >
      1. Add FR-005a back to tasks/WP03-no-cascade-warning-path.md's frontmatter
      requirement_refs list so all three sources (wps.yaml, tasks.md, WP03's own frontmatter)
      agree.
      2. (Out of mission scope) Extend requirement_mapping.py's regexes to accept a trailing
      lowercase-letter suffix, or document letter-suffixed FR ids as unsupported. Report as a
      ledger candidate, do not fix inside this mission.
