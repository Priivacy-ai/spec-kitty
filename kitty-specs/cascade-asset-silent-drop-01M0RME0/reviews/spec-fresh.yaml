findings:
  - id: SPEC-FRESH-001
    lens: acceptance-criteria-coverage
    severity: 3
    title: FR-004's newly-narrowed trigger condition has no acceptance scenario or FAILS-if bullet pinning its negative case
    evidence:
      - artifact: "spec.md § Requirements > Functional Requirements, FR-004 (line 222)"
      - artifact: "spec.md § User Story 1 > Acceptance Scenarios (lines 82-97) and FAILS if (lines 99-102)"
    claim: >
      This fix round narrowed FR-004's zero-activatable-targets trigger from "zero landed in
      activated" to "zero landed in activated AND at least one referenced node is specifically
      kind-filtered (not merely scope-excluded)." FR-004's own prose spells out the negative case
      this narrowing exists to prevent: "a pure scope-narrowing case (every referenced node is
      activatable-kind but excluded by a narrow --cascade <scope>, zero kind-filtered nodes
      involved) ... does NOT trigger this message." But User Story 1's numbered Acceptance
      Scenarios (1-3) and its "FAILS if" clause never exercise that case — Scenario 2 only tests
      the "only kind-filtered edges, --cascade all" case, and the FAILS-if list only guards against
      the source-with-nothing-referenced case (Scenario 3) gaining a spurious line. Under charter
      C-011 (ATDD-first: a WP needs a failing-first test pinning user-observable behaviour before
      it can start coding), an implementer has no acceptance-scenario or FAILS-if text obligating a
      red-first test for "pure scope-narrowing, zero kind-filtered nodes, zero activated → the
      zero-activatable-targets message must NOT appear." Without that test, a future change could
      silently regress FR-004's narrowing (over-report the scope-narrowing case again) with nothing
      in the spec's own acceptance criteria to catch it.
    remediation: >
      Add a 4th Acceptance Scenario to User Story 1 (or extend Scenario 2) covering: a DRG source
      whose referenced nodes are ALL activatable-kind but every one is excluded by a narrow
      --cascade <scope> (zero kind-filtered nodes present, zero land in activated) → only the
      per-node "Skipped (out of scope)" lines appear, and the zero-activatable-targets message from
      FR-004 must NOT appear. Add the corresponding negative clause to the "FAILS if" list.

  - id: SPEC-FRESH-002
    lens: process-consistency
    severity: 2
    title: New test-run baseline-red scoping note names only 3 of the 5 test-verified Success Criteria, leaving SC-002/SC-003 ambiguous
    evidence:
      - artifact: "spec.md § Success Criteria, \"Test-run scope note (SC-001/SC-004/SC-006)\" (lines 284-289)"
      - artifact: "spec.md § Success Criteria, SC-002 (lines 299-303) and SC-003 (lines 304-307)"
    claim: >
      This fix round added a note instructing implementers to verify SC-001/SC-004/SC-006 by
      running scoped to tests/charter/test_cascade.py and the relevant CLI command tests rather
      than a full-repo pytest sweep, and to classify any other red against CLAUDE.md's
      known-baseline-red categories before attributing it to this mission. SC-002 ("A cascade
      source whose entire referenced set is non-activatable kinds prints an explicit 'zero
      activatable targets' statement — verified by a test") and SC-003 ("charter activate
      --cascade all and charter deactivate --cascade all ... verified by a single test exercising
      both commands' underlying functions") are equally new tests in the same charter-cascade area,
      equally exposed to the same known-red baseline noise CLAUDE.md warns about, yet the note's
      title explicitly enumerates only SC-001/SC-004/SC-006. An implementer following the note
      literally could read the omission as meaning SC-002/SC-003 verification is NOT scoped the
      same way (e.g. should run a broader sweep), and could then misattribute a pre-existing
      baseline-red failure encountered while verifying SC-002/SC-003 to this mission's own change —
      exactly the failure mode CLAUDE.md's "Test-run baseline-red gotcha" exists to prevent.
    remediation: >
      Either broaden the note's scope to cover all test-verified Success Criteria (SC-001 through
      SC-004, and SC-006 — SC-005 is a PR-body check, not a test), or add one sentence explaining
      why SC-002/SC-003 were deliberately left out (if that omission is intentional).

  - id: SPEC-FRESH-003
    lens: citation-accuracy
    severity: 2
    title: "C-006's cascade.py:178 citation is 2 lines off the quoted code"
    evidence:
      - artifact: "spec.md § Constraints, C-006 (line 248)"
      - code: "src/charter/cascade.py:178-180"
    claim: >
      C-006, new in this fix round, cites `CascadeScope.selects()` as
      "(`src/charter/cascade.py:178`, `return self.is_all or kind in self.kinds`)". On the live
      checkout, line 178 is the `def selects(self, kind: ArtifactKind) -> bool:` signature, line
      179 is the docstring, and the quoted `return self.is_all or kind in self.kinds` is actually
      on line 180. Every other file:line citation touched or added by this fix round (e.g. FR-001's
      "line 291-292" for the `continue`, FR-005a's "cascade.py:407-410" for the `has_skipped`
      property, activate.py's corrected "383-417"/"404-405" ranges) points at the exact line(s) of
      the quoted code, so this citation breaks that pattern and would send a reviewer or
      implementer who greps line 178 to the wrong line for the quoted return statement.
    remediation: "Change the citation to `src/charter/cascade.py:180` (or `178-180` to also cover the def/docstring), matching the quoted `return self.is_all or kind in self.kinds` line."
