      definition" in activate.py, WP-D "call the shared helper (imported into deactivate.py)"),
      not an ad hoc escalation.
  - id: pr-boundary-002
    verdict: refuted
    reason: >
      git diff origin/main...HEAD -- src/specify_cli/cli/commands/charter/deactivate.py shows
      only the 205-216 plan.not_cascaded_kind_filtered loop is new; the 165-172 plan.deactivate
      loop is pre-existing and completely untouched by this diff, so the "duplication" is a new
      block deliberately mirroring (per its own comment) established pre-existing logic rather
