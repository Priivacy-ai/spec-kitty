complete: true
phase: spec
lens_group: verify
mission: cascade-asset-silent-drop-01M0RME0
findings:
  - id: SPEC-VERIFY-001
    lens: silent-success (NFR-001) / mission-derived edge-case interaction
    severity: 4
    title: "The no-cascade path's own early-return guard (`has_skipped`) can silently swallow the new kind-filtered lines FR-005 adds"
    evidence:
      - artifact: "spec.md § FR-005, § Key Entities (NoCascadeReport), § NFR-001"
      - code: "src/charter/cascade.py:404-410 (NoCascadeReport.has_skipped property, `return any(self.skipped.values())`)"
      - code: "src/specify_cli/cli/commands/charter/activate.py:404-405 (`if not report.has_skipped: return`, guards the ENTIRE _render_no_cascade_warning body)"
    claim: >
      FR-005 says NoCascadeReport should "gain an equivalent new field alongside `skipped`"
      for kind-filtered nodes. But `_render_no_cascade_warning` (activate.py:383-417) gates its
      whole body on `report.has_skipped`, and `has_skipped` (cascade.py:407-410) is defined as
      `any(self.skipped.values())` — it inspects ONLY the existing `skipped` dict, not the new
      field. Verified directly: `has_skipped` has exactly one definition and one call site
      (activate.py:404), confirmed by grep. If a source's ONLY outgoing reference-relation
      edges are kind-filtered (asset/template) — no activatable-kind refs at all — and the
      operator runs `charter activate <kind> <id>` with no `--cascade`, then `report.skipped`
      stays empty, `has_skipped` is False, and the function returns at line 405 before it ever
      reaches the loop that would render the new kind-filtered lines. This reproduces the exact
      silent-drop bug #3705 reports, just relocated one level up into the guard clause — which
      is precisely the corner NFR-001 ("never a bare None/0/silently-swallowed branch") exists
      to close. No FR, NFR, or Acceptance Scenario in the spec covers this case: User Story 2's
      only Independent Test and Acceptance Scenario use a MIXED source (one activatable ref +
      one asset ref), so the existing activatable-kind ref keeps `has_skipped` True and masks
      the gap in that fixture. FR-004 gives an explicit "zero activatable targets" requirement
      for the cascade-report path (User Story 1) but there is no equivalent requirement stated
      for the no-cascade-warning path (User Story 2).
    remediation: >
      Add an explicit requirement (either extend FR-005 or add an FR-005a) that
      `NoCascadeReport.has_skipped` (or the equivalent gate in `_render_no_cascade_warning`)
      must also evaluate True when kind-filtered nodes are present even if `skipped` is empty —
      e.g. redefine `has_skipped` to check both fields, or replace the guard with an explicit
      "anything to report" check across both dicts. Add a fixture/test: a source whose ONLY
      referenced nodes are kind-filtered (no activatable refs), run with no `--cascade`, and
      assert the kind-filtered line still renders (not silence).

  - id: SPEC-VERIFY-002
    lens: mission-derived — testability of "distinct wording"
    severity: 3
    title: "FR-003/FR-005/FR-008's \"labelled distinctly\" requirement has no pinned literal string, unlike the three existing line shapes it must be distinct from"
    evidence:
      - artifact: "spec.md § FR-003, § FR-005, § FR-008, § Edge Cases (Reflexivity item)"
      - code: "src/specify_cli/cli/commands/charter/activate.py:326-328 (`[cyan]Cascade-activated[/cyan]: ...`), :336-338 (`[dim]Skipped (out of scope)[/dim]: ...`), :413-417 (`[yellow]Warning[/yellow]: referenced ... was not activated (no --cascade).` + `[yellow]Hint[/yellow]: ...`)"
    claim: >
      The existing three line shapes the spec requires distinctness from are pinned as exact
      literal strings in code (verified above) and are named as fixed strings in spec.md's own
      Reflexivity edge case (`Cascade-activated:`, `Warning: ... was not activated (no
      --cascade)`, `Skipped (out of scope)`, `Skipped (shared artifact)`). The NEW line FR-003 /
      FR-005 / FR-008 require has no equivalent fixed string or tag anywhere in spec.md — only
      content constraints ("states the kind is not charter-activatable," "never phrased as a
      warning/error/failure," "distinct... never the same wording"). Two implementers could both
      satisfy the letter of FR-003 with genuinely different, non-comparable wording (e.g.
      `[magenta]Not cascaded[/magenta]: template/x (kind not charter-activatable)` vs.
      `[white]Skipped (non-activatable kind)[/white]: template/x`) — the second arguably fails
      to literally state "not charter-activatable" while still plausibly reading as compliant.
      User Story 3's Acceptance Scenario partially constrains this ("language consistent with
      the activation-side rendering") across FR-003/FR-005/FR-007, but does not resolve the
      cross-WP risk that FR-003, FR-005, and FR-007 could each independently coin a label before
      that consistency check catches the drift.
    remediation: >
      Either (a) pin a canonical label/tag for the new line in spec.md (as the three existing
      shapes are pinned in code and named in the Reflexivity edge case), so plan/tasks inherits
      one literal string all three call sites implement, or (b) explicitly defer the exact
      wording to the plan phase but add a single FR requiring one shared rendering helper (not
      three independently-worded call sites) so the "distinct label" is defined once and reused,
      removing the risk of divergent wording across FR-003/FR-005/FR-007.

  - id: SPEC-VERIFY-003
    lens: falsifiability / mission-derived edge-case interaction
    severity: 2
    title: "FR-004's literal trigger condition is broader than its motivating scenario and also fires for pure scope-narrowing, with no scenario/test for that variant"
    evidence:
      - artifact: "spec.md § FR-004, § SC-002, § Edge Cases (item 3, scope-narrowing)"
      - code: "src/charter/cascade.py:371-379 (cascade_activation_targets partitions refs into `activated` vs `skipped_by_scope` by `scope.selects`)"
    claim: >
      FR-004 triggers "when `cascade_activation_targets` resolves at least one referenced node
      but zero of them land in `activated`." That condition is satisfied not only by the
      mission's motivating case (all referenced nodes are kind-filtered) but also by a source
      whose referenced nodes are ALL activatable-kind but excluded by a narrow `--cascade
      <scope>` (e.g. `--cascade tactic` on a source that only references a `directive`) — a
      pure scope-narrowing case with zero kind-filtered nodes involved. SC-002's test and User
      Story 1 Scenario 2 both construct only the kind-filtered-only case; there is no
      scenario/test anywhere in the spec for the scope-narrowing-only case, so it is unclear
      whether FR-004's "zero activatable targets" line is meant to also fire there (where
      per-node `Skipped (out of scope)` lines already communicate the same information) or
      whether the condition should be narrowed to require at least one kind-filtered node
      specifically.
    remediation: >
      Either tighten FR-004's trigger to require the zero-`activated` result include at least
      one kind-filtered node (not merely at least one referenced node), or add an explicit
      Acceptance Scenario/test asserting the intended behavior for the pure scope-narrowing
      case so an implementer does not have to guess.

  - id: SPEC-VERIFY-004
    lens: baseline honesty
    severity: 2
    title: "Spec's Success Criteria drive extensive new pytest work but never acknowledge the pre-existing known-red baseline"
    evidence:
      - artifact: "spec.md § SC-001, § SC-004, § SC-006"
      - artifact: "CLAUDE.md § Test-run baseline-red gotcha (project root)"
    claim: >
      SC-001 requires a "red-first test that fails on today's main," SC-004 requires an
      existing test to "continue to pass unmodified," and SC-006 requires that no existing
      console-line assertion changes. All three depend on running the test suite and correctly
      distinguishing red caused by this mission's change from red that predates it. Searched
      spec.md for any reference to the known-red baseline (`#3284`, "known-failing," "baseline",
      "pre-existing") — none found; the only "pre-existing" hits are unrelated (referring to the
      pre-existing scope-skip bucket and the pre-existing kind filter). The project's own
      CLAUDE.md documents a ~23-test/2-error known-red baseline and a mandatory
      classify-before-attributing protocol that "applies to every agent, incl. dispatched
      subagents." A work-package implementer reading spec.md's Success Criteria in isolation
      (without independently pulling CLAUDE.md's baseline-red section into view) has no signal
      inside the mission artifact itself that a broad `pytest` run will show unrelated red, and
      could misjudge SC-004/SC-006 compliance for a WP that only touched the cascade seam.
    remediation: >
      Add one sentence to the Success Criteria section (or as a preamble note) directing test
      verification for SC-001/SC-004/SC-006 to run scoped to `tests/charter/test_cascade.py`
      and the relevant CLI command tests, and to classify any other red observed against the
      known-red baseline per CLAUDE.md's Test-run baseline-red gotcha before treating it as
      this mission's regression.

  - id: SPEC-VERIFY-005
    lens: falsifiability
    severity: 2
    title: "NFR-001 through NFR-004 carry no explicit \"Fails if\" criterion anywhere in the spec, unlike every User Story and SC"
    evidence:
      - artifact: "spec.md § Non-Functional Requirements (NFR-001..NFR-004)"
      - artifact: "spec.md § User Story 1/2/3 FAILS if clauses, § SC-001..SC-006 Fails if clauses"
    claim: >
      Every User Story (1-3) closes with an explicit "**FAILS if**:" clause and every SC-001
      through SC-006 closes with an explicit "**Fails if**" clause, but none of NFR-001,
      NFR-002, NFR-003, or NFR-004 states its own falsification condition — they are phrased as
      "must" statements only. NFR-003 and NFR-004 are effectively subsumed by SC-003 and the
      Reflexivity edge case respectively, but NFR-001 (the silent-success bar) and NFR-002 (the
      no-truncation bar) have no SC or Acceptance Scenario that maps onto them one-to-one.
      SPEC-VERIFY-001 above demonstrates this is not merely stylistic: NFR-001's silent-path
      prohibition has a real, un-caught corner (the `has_skipped` guard) precisely because
      nothing in the spec forces an implementer or reviewer to write a falsifiable check against
      NFR-001 directly.
    remediation: >
      Add a "Fails if" line to each of NFR-001..NFR-004 stating the concrete observable
      condition that would constitute non-compliance (e.g., for NFR-001: "Fails if any new
      collection/render path can produce a caller-visible `None`/empty result for a source that
      in fact reached a kind-filtered node, with no corresponding report").

  - id: SPEC-VERIFY-006
    lens: verify — citation accuracy
    severity: 1
    title: "FR-005's citation of `_render_no_cascade_warning` (activate.py:383-416) omits the function's last line, which is the single global recovery-hint print central to FR-005's own concern"
    evidence:
      - artifact: "spec.md § FR-005 (\"`_render_no_cascade_warning` (`src/specify_cli/cli/commands/charter/activate.py:383-416`)\")"
      - code: "src/specify_cli/cli/commands/charter/activate.py:383-417 (function spans through line 417: `console.print(f\"[yellow]Hint[/yellow]: {report.recovery_hint}\")`; next def (`run_full_synthesize`) starts at line 420)"
    claim: >
      Verified by reading the file directly: `_render_no_cascade_warning` runs from line 383
      through line 417, not 416. The omitted line 417 is the one place the "re-run with
      --cascade" recovery hint is actually printed — the exact mechanism FR-005 says must not
      be reused for the kind-filtered line. Confirmed the recovery-hint print is unconditional
      once the function passes its `has_skipped` guard (SPEC-VERIFY-001), i.e. it currently
      fires once per call, not per rendered line, which matters for how an implementer scopes
      the "don't reuse the hint" fix.
    remediation: >
      Correct the citation to `activate.py:383-417` so the range includes the Hint print line
      FR-005 is reasoning about.

  - id: SPEC-VERIFY-007
    lens: verify — citation accuracy
    severity: 1
    title: "FR-007's citation of `_render_cascade_deactivation` (deactivate.py:133-186) omits the entire `skipped_shared` render loop it says the new field renders \"alongside\""
    evidence:
      - artifact: "spec.md § FR-007 (\"`_render_cascade_deactivation` (`src/specify_cli/cli/commands/charter/deactivate.py:133-186`)\")"
      - code: "src/specify_cli/cli/commands/charter/deactivate.py:133-194 (function spans through line 194; `for skip in plan.skipped_shared:` loop is at lines 190-194; next def `deactivate_cmd` starts at line 197, confirmed via grep -n)"
    claim: >
      Verified by grep and direct read: `_render_cascade_deactivation` runs from line 133
      through line 194, not 186. The cited range 133-186 stops before the `for urn in
      plan.deactivate:` loop even finishes and entirely excludes the `for skip in
      plan.skipped_shared:` loop (lines 190-194) — the structural analog FR-007 explicitly says
      the new kind-filtered rendering belongs "alongside." An implementer skimming only the
      cited range would not see the code the FR is describing.
    remediation: >
      Correct the citation to `deactivate.py:133-194` so the range includes the
      `skipped_shared` render loop FR-007 references.
