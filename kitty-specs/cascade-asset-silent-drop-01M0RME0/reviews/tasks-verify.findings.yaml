findings:
  - id: TASKS-VERIFY-001
    lens: mission-derived (requirement-mapping regex blind to letter-suffixed FR IDs)
    severity: 3
    title: "FR-005a is invisible to finalize-tasks's mechanical requirement-coverage gate on BOTH sides (declared-in-spec and mapped-by-WP); WP03's own frontmatter already reflects the drop"
    evidence:
      - artifact: "tasks/WP03-no-cascade-warning-path.md frontmatter lines 5-10 (`requirement_refs:` = FR-005, C-002, NFR-001, NFR-004 — FR-005a absent)"
      - artifact: "wps.yaml lines 56-61 (WP03's `requirement_refs` DOES list FR-005a — the source of truth disagrees with the materialized WP file)"
      - artifact: "tasks.md WP03 section, 'Requirement Refs: FR-005, FR-005a, C-002, NFR-001, NFR-004' (also correctly includes it — generated by simple string-join of `wp.requirement_refs`, `src/specify_cli/core/wps_manifest.py:199-200`, no regex round-trip)"
      - artifact: "spec.md line 234 (FR-005a is a real, distinct, P1 functional requirement with its own table row)"
      - artifact: "acceptance-matrix.json (has a row for FR-005 but none for FR-005a — confirmed by grep; the mission's own acceptance-tracking artifact under-lists this FR)"
      - code: "src/specify_cli/requirement_mapping.py:68 (_TABLE_ROW_ID_PATTERN = r'^\\s*\\|\\s*(?:\\*\\*|~~){0,2}((?:FR|NFR|C)-\\d+)(?:\\*\\*|~~){0,2}\\s*\\|') and :16 (_REF_FIND_PATTERN = r'\\b(?:FR|NFR|C)-\\d+\\b') — both require the id to end at a word boundary immediately after the digits; 'FR-005a' has no such boundary (both 'a' and the preceding digit are \\w), so neither pattern matches it at all (not a truncation to 'FR-005' — a complete miss)."
      - code: "src/specify_cli/requirement_mapping.py:375-379 — a code comment already documents this exact class of gap ('non-numeric-suffixed id text fails `_TABLE_ROW_ID_PATTERN`'s exact-digits capture ... the same pre-existing, broadening-independent gap') for a different mission's `C-007-mission`/`C-009-mirror` ids — this is a known, previously-observed limitation, not a one-off."
      - code: "Live-verified: `_declared_ids()` run against this mission's own spec.md returns 'FR-005' but NOT 'FR-005A' in its declared-id set (confirmed via direct interpreter run), so FR-005a is invisible on the *declared* side of finalize-tasks's requirement-mapping gate, not only on the WP-frontmatter side."
      - code: "src/specify_cli/cli/commands/agent/mission_finalize.py:1124 (`unmapped_functional_requirements = sorted(functional_spec_requirement_ids - mapped_requirement_ids)`) — since FR-005a is absent from `functional_spec_requirement_ids` (declared side) it can never appear as 'unmapped' regardless of what any WP's `requirement_refs` says; the gate has zero visibility into FR-005a from either direction."
    claim: >
      The orchestrator's premise is confirmed: `finalize-tasks`'s requirement-ID
      regex family (`_REF_FIND_PATTERN` / `_TABLE_ROW_ID_PATTERN`,
      `src/specify_cli/requirement_mapping.py:16,68`) does not match
      letter-suffixed requirement IDs such as `FR-005a`, and this is not merely
      a WP03-frontmatter cosmetic gap: the SAME regex family is used by
      `_declared_ids()` to compute which FRs spec.md declares
      (`functional_spec_requirement_ids`), so FR-005a is invisible on both the
      "what the spec requires" side and the "what a WP claims to cover" side of
      the mechanical FR-coverage gate (`_validate_requirement_mapping`,
      `mission_finalize.py:1100-1132`). Concretely: even if a future edit
      dropped ALL mention of FR-005a from every WP's `requirement_refs`, the
      gate's `unmapped_functional_requirements` check would never flag it,
      because FR-005a was never counted as declared in the first place. The
      only things currently standing between FR-005a and a silently-uncovered
      implementation are (a) the WP03 prompt body's prose, which — verified
      directly — DOES concretely and correctly name the exact RED-first ATDD
      test (T012 step 2: a source whose only referenced nodes are
      kind-filtered must still render, closing the `has_skipped`-guard gap;
      T014 implements the guard fix) and would genuinely go RED today (traced
      live: `NoCascadeReport.has_skipped` at `src/charter/cascade.py:407-409`
      returns `any(self.skipped.values())`, and
      `_render_no_cascade_warning` at `src/specify_cli/cli/commands/charter/activate.py:404-405`
      returns before its render loop when that's `False` — exactly as WP03
      describes) and GREEN after T014 lands, and (b) reviewer diligence, with
      no automated backstop. This is exactly the class of silent-drop-with-no-report
      defect that mission cascade-asset-silent-drop-01M0RME0 itself exists to
      fix, now found in the tooling that authored the mission's own tasks
      artifacts — a real, if currently non-blocking (because the prose IS
      correct), coverage/audit-trail risk rather than a purely cosmetic quirk.
      For THIS mission's actual deliverable there is no wrong-implementation
      risk (WP03's body is complete and specific), which is why this is scored
      moderate rather than high.
    remediation: >
      1. (This mission, low-cost correctness fix) Add `FR-005a` back to
      `tasks/WP03-no-cascade-warning-path.md`'s frontmatter `requirement_refs:`
      list so it matches `wps.yaml` and `tasks.md` (both already correct) —
      restores frontmatter/source-of-truth consistency even though it will not
      change gate behavior (the declared side still won't see it).
      2. (Upstream spec-kitty tooling gap, file separately — out of this
      mission's scope per its own Non-Goals, but should be reported per
      CLAUDE.md's "trace the source and file an upstream gap" rule) Extend
      `_REF_FIND_PATTERN` / `_TABLE_ROW_ID_PATTERN` / `_DECLARED_ID_PATTERNS` in
      `src/specify_cli/requirement_mapping.py` to optionally match a trailing
      lowercase letter suffix (`FR-005a`), or explicitly document that
      letter-suffixed requirement IDs are unsupported by the mechanical
      FR-coverage gate and must not be used for genuinely-gating requirements
      (a spec author would then be expected to renumber `FR-005a` as a
      standalone `FR-0XX` instead of a suffix) — either fix closes the blind
      spot; documenting-as-unsupported is the smaller diff if letter-suffixed
      IDs are rare enough to deprecate outright.
