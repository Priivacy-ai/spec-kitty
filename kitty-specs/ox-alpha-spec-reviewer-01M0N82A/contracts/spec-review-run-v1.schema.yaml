$schema: https://json-schema.org/draft/2020-12/schema
$id: spec-kitty/spec-review-run/v1
title: SpecReviewRun
type: object
additionalProperties: false
required:
  - schema
  - run_id
  - mission
  - spec_sha256
  - requested_model_route
  - rubric_version
  - started_at
  - completed_at
  - status
  - diagnostic_code
  - findings
  - summary
properties:
  schema:
    const: spec-review-run/v1
  run_id:
    type: string
    pattern: '^[A-Za-z0-9_-]+$'
  mission:
    type: string
  spec_sha256:
    type: string
    pattern: '^[a-f0-9]{64}$'
  requested_model_route:
    type: string
    minLength: 1
    maxLength: 200
  rubric_version:
    type: string
  started_at:
    type: string
    format: date-time
  completed_at:
    type: string
    format: date-time
  status:
    enum: [complete, auth_required, provider_error, timeout, invalid_output]
  diagnostic_code:
    type: [string, 'null']
  findings:
    type: array
    maxItems: 100
  summary:
    type: object
    additionalProperties: false
    required: [total, severity_1, severity_2, severity_3, severity_4, severity_5]
    properties:
      total: {type: integer, minimum: 0, maximum: 100}
      severity_1: {type: integer, minimum: 0, maximum: 100}
      severity_2: {type: integer, minimum: 0, maximum: 100}
      severity_3: {type: integer, minimum: 0, maximum: 100}
      severity_4: {type: integer, minimum: 0, maximum: 100}
      severity_5: {type: integer, minimum: 0, maximum: 100}
allOf:
  - if:
      properties:
        status: {const: complete}
    then:
      properties:
        diagnostic_code: {type: 'null'}
    else:
      properties:
        diagnostic_code: {type: string, minLength: 1}
        findings: {maxItems: 0}

# Domain validation supplements JSON Schema: finding items are validated against
# review-response/v1, IDs are unique, line ranges are ordered/in-bounds, exact
# input spans are rejected, and summary counts must equal the findings array.
