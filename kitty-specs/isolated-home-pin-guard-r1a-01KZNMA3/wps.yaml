          the id, keeping the equality green). Fifteen entries; SC-002b is the one not in FR-007's
          table, named separately in the same FR-007 row, and the delta is stated so a reviewer can
          check it. For EVERY id: (i) an empty-SET assertion over the real tree and (ii) a POSITIVE
          CONTROL running the same production matcher over a materialised module containing the shape,
          asserting exactly that one hit. Any control returning `set()` fails the module. THE
          COMPLETENESS CHECK IS A TRIPLE, and the middle operand may not be the only one:
          `inline_expected == INERT_LIMBS == {ids of shipped controls}`, where `inline_expected` is a
          frozenset ENUMERATED LITERALLY IN THIS TEST MODULE and NEVER
          imported from `_home_pin_scan.py`. AND THE LITERAL IS BOUND TO THE SPECIFICATION, NOT MERELY
          TRANSCRIBED FROM IT: the test PARSES FR-007's inert sub-form table out of `spec.md` — the
          table carrying an explicit `id` column, ONE SUB-FORM PER ROW, no four-way cells and no
          anaphoric rows, with each id backticked in the first column — and asserts BOTH
          `spec_table_ids | {"SC-002b"} == inline_expected` AND
          `spec_table_ids - inline_expected == set()`. THE DELTA IS EXACTLY ONE AND IT IS NAMED:
          the table carries the FOURTEEN classifier sub-forms, while `SC-002b`'s assignment-bound
          constant assertion is a criterion in its own right rather than a sub-form of the
          classifier, so it is in the control set and not in the table — and FR-007 says so in the
          sentence under the table. An earlier form of this DoD said the parsed id set EQUALS
          `inline_expected`; against the shipped fourteen-row table that assertion is FALSE ON DAY
          ONE, and its cheapest repair is to drop the operand. The row count is REPORTED, never
          asserted: asserting 14 would red on a table that legitimately grows, while the set delta
          already reds when the table grows and the registry does not follow. So the quadruple is
          `spec_table_ids ∪ {SC-002b} == inline_expected == INERT_LIMBS == {control ids}`. Without that fourth
          operand the three code artefacts stay internally consistent and green while DIVERGING FROM
          THE SPEC THAT DEFINES THE POPULATION — and a spec/code divergence is exactly the defect
          that produced the `HOME`-limb registration in the first place, so a mechanism that only
          watches code-versus-code guards the wrong axis of its own motivating failure. The same
          "parse the authoritative document and assert the code matches" shape is used in WP03/T012
          (the owner contract) and WP05/T026 (M4's TABLES.md); this is the third instance and the one
          where the completeness argument actually lives. STATED COST: this makes an always-on
          collected test depend on a `kitty-specs/` document. If the mission directory is ever
          flattened or archived the test must be re-pointed, and that obligation is recorded in
          WP06/T030 rather than discovered by whoever flattens it.
          WHAT THIS CANNOT SEE — a shape nobody enumerated. The triple closes the gap between the
          sub-forms production claims and the controls that exist; it cannot close the gap between
          reality and the claim.
          WHY IT CANNOT BE FAKED — comparing `INERT_LIMBS` only against controls the same author
          ships proves "every id I remembered to register has a control", and can be SHRUNK TO ZERO
          and stay green — the same circularity C-011 diagnoses for the census, relocated into the
          registry built to prove the census's proofs were complete. The inline literal is what reds
          when a sub-form is removed from production.
      - id: T005
        title: "`render_census` / `render_baseline` and the one documented regeneration entry"
