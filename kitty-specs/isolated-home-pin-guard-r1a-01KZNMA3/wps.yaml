      - id: T010
        title: "`contracts/canonical-home-owner.md` — this WP's FIRST deliverable, and an ordering fact that survives a squash"
        dod: >-
          The contract fixes, normatively: the fixture's NAME; `autouse=False`; function scope by
          ABSENCE of `scope=`; that it yields `None` and WHY (returning its own path invites
          `assert os.environ[...] == owner`, which compares the environment against the fixture's own
          report and passes for an owner that sets nothing); that it establishes the home ONLY via
          `monkeypatch.setenv`, with no `Path.home` patch and no process-global patch; that it creates
          the directory before the test body runs; that it never overrides a definition keeping its
          own pin; that it is inserted STRICTLY after `tests/conftest.py:298`; and that
          `tuple[str, str]` is the type of the owner's ENTRY IN `E`, never of the fixture; and the fixture
          NAME, because FR-010's resolver limb treats a parameter naming this owner as `tmp_path` for both
          the silhouette and value resolution, so the name is a scanner input and not a local detail. The DoD is
          an ORDERING FACT, not a file: `git merge-base --is-ancestor <contract commit> <owner
          commit>` is RUN AND ITS OUTPUT RECORDED — both SHAs and the command output — into
          `record.md` AT AUTHORING TIME, because the ancestry itself does not survive the squash or
          rebase a lane consolidation may perform. That recording is the durable artefact.
          WHAT THIS CANNOT SEE — whether the owner works; nothing about a contract can.
          WHY IT CANNOT BE FAKED — T011..T014's assertions are stated over the names this document
          fixes, a vague contract makes them unwritable, and T012 parses this file for the declared
          fixture name so the document is mechanically bound to the code rather than merely adjacent
          to it.
      - id: T011
        title: "Add the owner fixture to `tests/conftest.py`, strictly after line 298"
        dod: >-
          FR-005's canonical owner: exactly one new fixture, and `git diff -U0` shows NO hunk touching any line at or below 298.
          SC-010 IS MECHANISED AS A LIST, NOT A SCALAR: the module's ORDERED LIST of definition
          names, WITH THE NEWLY-ADDED OWNER REMOVED, is asserted equal to the same list computed at the
          merge-base — the whole module, not only the names preceding `_isolated_worker_home`, because
          the narrower form cannot see a reorder below the anchor and conftest fixture resolution
          depends on the ordering throughout. (`spec.md` SC-010 says the module's ordered list is
          "unchanged", which is literally unsatisfiable once a fixture is added; "unchanged with the
          new owner removed" is the satisfiable reading and is strictly stronger than preceding-only.) A scalar definition INDEX — the previous form — is invariant under
          insert-one-above-plus-delete-one-above, and in a Mission governed by C-002 it was the last
          surviving scalar comparand. AST assertions on the new fixture: `autouse` absent or False, no
          `scope=` kwarg, no `monkeypatch.setattr(Path, "home", ...)` and no process-global patch, the
          body contains a `monkeypatch.setenv("SPEC_KITTY_HOME", ...)` AND a `mkdir`, and it
          yields/returns `None`. THAT LAST GROUP IS FR-006'S STATIC HALF — establishment by `monkeypatch.setenv`
          ONLY, never `monkeypatch.setattr(Path, "home", ...)` and never any process-global patch — and it is
          only half, because FR-006 requires the rule DEMONSTRATED BEHAVIOURALLY, not merely asserted from
          source: T012 carries the establishment half and T013 the never-wins half. NFR-005 — no interference
          with the existing home owner — is demonstrated by the ordered-list check above rather than assumed. C-005 binds unchanged: `tests/conftest.py:272-286`'s env-var-only
          precedence decision is not altered, and it is the decision this fixture must not violate.
          WHAT THIS CANNOT SEE — that the owner does anything. Every assertion here is SHAPE.
          WHY IT CANNOT BE FAKED — inserting above 253 shifts the ordering while the old line range
          shows no modification; the ordered-name-list assertion is the only limb that sees it.
      - id: T012
        title: "`test_home_owner_behaviour.py` — the owner's statics and the one assertion that proves it works"
        dod: >-
          (i) SC-012 limb 1 — a probe requesting the owner asserts
          `os.environ["SPEC_KITTY_HOME"] == str(tmp_path / "home")` with the expected value COMPUTED
          IN THE TEST from its own `tmp_path`, never read from the fixture's return, and asserts
          `Path(os.environ["SPEC_KITTY_HOME"]).is_dir()` AT TEST-BODY ENTRY. (ii) C-014 limb (i) —
          `ScopeMismatch` at setup. THE ROUTE MATTERS AND `pytester` IS NOT AVAILABLE: measured, zero
          uses under `tests/`, it is not auto-loaded, and there is NO root `conftest.py`, so enabling
          it needs a rootdir conftest or an `addopts` change, both outside C-006's blast radius. The
          in-scope route is a module-scoped fixture calling `request.getfixturevalue("<owner>")`
          inside `pytest.raises(pytest.fail.Exception)`. STATE EXPLICITLY IN THE MODULE that
          `pytest.raises(Exception)` does NOT catch it — pytest converts `ScopeMismatch` to `Failed`,
          a `BaseException` subclass, which escapes as a setup ERROR and costs an implementer an
          hour. (iii) C-014 limb (ii) — a module not naming the owner never instantiates it, asserted
          by observing the ABSENCE of the effect, never by reading source. Plus SC-005's owner limbs
          and SC-010, AST-asserted over `tests/conftest.py`; plus the CONTRACT BINDING — this module
          parses `contracts/canonical-home-owner.md` for the declared fixture name, autouse stance and
          scope, and asserts the conftest fixture carries THAT name and THOSE properties, so the
          document cannot drift from the code. AND — THE ASSERTION THAT CLOSES FR-010's CIRCULARITY —
          the SAME parsed fixture name is asserted to be a MEMBER OF `_home_pin_scan.OWNER_PARAM_NAMES`.
          WP01 ships that set with `canonical_home` in it, taken from FR-010's PROSE, at a moment when the
          contract that names the owner did not yet exist; measured in review, removing or renaming
          `canonical_home` reds only two tests and BOTH are WP01's own fixture tree — the author's string on
          both sides of the equality. If this WP names the owner anything else, FR-010's limb goes
          PERMANENTLY INERT with every WP01 assertion still green, and the shrink-only ratchet then greens on
          every disappearance: exactly the failure FR-010 exists to prevent, which is that the guard goes
          blind in proportion to R1b's adoption. This is the fourth-operand pattern the `INERT_LIMBS`
          quadruple established — an operand outside the author's control — applied to the resolver instead
          of the registry, and it is two assertions. Plus NFR-006: the resolved `pytest.__version__` and the
          verbatim invocation are recorded in `record.md`; this WP is where the pytest-version
          sensitivity actually lives (`ScopeMismatch` conversion, non-instantiation), never a bare
          `uv run`.
          WHAT THIS CANNOT SEE — C-014 limb (iii), which needs adopters; R1a has zero, and that
          residual is recorded rather than discovered later.
          WHY IT CANNOT BE FAKED — limbs (ii) and (iii) are properties of pytest's fixture machinery
          and pass against an owner whose body is `return None`. Limb (i) carries the entire
          behavioural load alone, and SC-011 green is not evidence the owner works.
      - id: T013
        title: "`test_home_owner_never_wins.py` — the exempt member, and the negative control that makes the claim bite"
        dod: >-
          FR-011's probe modules, and exactly one of them is exempted; this subtask is also where FR-006's
          never-wins half is demonstrated behaviourally. TWO probes, because SC-012 limb 2 as specified cannot fail. (a) THE E-SLOT MEMBER — a
          module-local FIXTURE (never a body-level `setenv`, which overrides the owner unconditionally
          and proves nothing about the fixture-versus-fixture precedence decision at
          `tests/conftest.py:272-286`) pinning `SPEC_KITTY_HOME` to `str(tmp_path / "home")`, declared
          AFTER the owner in the requesting order stated in the module, whose body observes that
          value. (b) THE DISCRIMINATING NEGATIVE CONTROL — a second module-local fixture pinning
          `str(tmp_path / "probe-home")`, requesting the owner, whose body asserts it observes
          `probe-home`. Probe (a) is a class member and spends one of `E`'s two irrevocable slots;
          probe (b) is NOT a member, costs no slot, and is the ONLY assertion in the pair that can
          fail — because the owner and any class member both resolve to `str(tmp_path / "home")`, the
          SAME STRING within one test, so (a) is green whether the owner won or lost. Recorded as a
          spec finding, not a silent repair.
          WHAT THIS CANNOT SEE — behaviour under real adoption, which R1a has none of.
          WHY IT CANNOT BE FAKED — remove (b) and the module greens for an owner that overwrites every
          module's pin, which is the failure `tests/conftest.py:272-286` records having cost ~16
          `tests/sync` cases.
      - id: T014
        title: "`_home_pin_exempt.py` — `E` declared where its content is determined, and content-addressed"
        dod: >-
          `E: tuple[Exempt, Exempt]` — fixed arity BY TYPE, using the `Exempt` exported by
          `_home_pin_scan.py` (T001) and never a local stand-in — declaring exactly the canonical
          owner (T011) and the retained-pin probe fixture (T013a). `E` lives here because both keys
          are determined by this WP's own two artefacts and nothing else; WP04 tests the MECHANISM
          over materialised exempt tuples and WP05 asserts the REAL hash and runs mypy over THIS file,
          so no package edits another's. THE FORM IS CONSTRAINED BY AN EXISTING RATCHET nobody had
          named: `tests/architectural/test_ratchet_positional_anchor_ban.py::test_no_int_line_sink_in_architectural_python_seeds`
          walks every `tests/architectural/**/*.py` and flags an int literal reaching
          `composite_key_from_file(path, N)`'s second positional argument, including (per its #2564
          clause) a module-level seed constant of `(rel, int, ...)` rows — which is exactly the naive
          shape of `E`. Compliant form: `E`'s keys are content-addressed 3-tuples, and any `lineno`
          used in recomputation comes from `discover()` AT RUNTIME, never from a literal. A test
          asserts each declared key equals `(relpath_posix, *composite_key_from_file(path, lineno))`
          recomputed live with that runtime lineno, and asserts
          `{e.key for e in E} ⊆ {m.key for m in discover(Path("tests"))}`.
          WHAT THIS CANNOT SEE — whether `E` should have those two entries; that is a decision of
          record, and `E` fails the reviewer test by construction, which §0.4 states plainly.
          WHY IT CANNOT BE FAKED — an `E` entry naming a phantom definition would inflate
          `census ∪ E` and be caught only in WP05; the subset assertion catches it in the package
          that wrote it.
