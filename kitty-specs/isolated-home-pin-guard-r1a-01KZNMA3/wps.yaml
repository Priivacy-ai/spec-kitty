    subtask_details:
      - id: T015
        title: "`_home_pin_synthetic.py` plus its COLLECTED home — materialised trees, never checked in"
        dod: >-
          FR-009's root parameter is what makes this possible: a materialiser writing trees into `tmp_path` from source STRINGS. Its correctness is proven,
          not assumed, IN A COLLECTED MODULE: `pytest.ini` sets `testpaths = tests` with no
          `python_files` override, so `_home_pin_synthetic.py` is NEVER COLLECTED and assertions
          placed there would never run. They live in `test_home_pin_synthetic_trees.py`. For each
          named tree, `discover(root=<materialised>)` returns a member key set EQUAL to the
          enumerated set the tree was built to contain, so a tree that silently fails to write a file
          reds here instead of greening a transition downstream. A counterpart assertion proves
          `discover(Path("tests"))` finds NO member under any test-owned fixture root. NOTHING is
          checked in under `tests/`: a checked-in tree sits inside the classifier's never-narrowed
          walk, so its deliberate 41st members land in `discovered` and `discovered == census ∪ E`
          can never green; and a checked-in deliberate `SyntaxError` reds `ruff check` with
          `invalid-syntax`, which is not a rule code and cannot be per-file-ignored. All materialised
          sources are parsed only through `_home_pin_scan.parse_module`.
          WHAT THIS CANNOT SEE — a shape nobody wrote a tree for.
          WHY IT CANNOT BE FAKED — every cheap repair for a checked-in tree is separately barred
          (directory exclusion by C-003/NFR-001, a census row by C-007, a third `E` entry by fixed
          arity), so the materialiser is the only C-001-compatible demonstration path.
          CAUTION — do not bind the env key to a module constant (`ENV = "SPEC_KITTY_HOME"`) here for
          convenience: that is an assignment-bound constant valued `"SPEC_KITTY_HOME"` and it reds
          SC-002b, whose population must stay 0.
      - id: T016
        title: "The eight SC-006 transitions, red-first"
        dod: >-
          All eight over materialised trees, each demonstrated RED before the mechanism exists —
          (1) empty census reds; (2) the census-frozen tree greens, attesting FREEZING and asserting
          nothing about desert; (3) a 41st member anywhere reds; (4) a 41st under a name used nowhere
          else reds; (5) a removed row with the definition still present reds; (6) a 41st that also
          requests the owner and RESTATES the pin reds, with the witness declared
          `(monkeypatch, <a materialised fixture that YIELDS a home root>)` and NO `tmp_path` —
          modelled on the live population-1 `runtime_home` shape, never on the `None`-returning
          canonical owner, because a witness that gratuitously re-declares `tmp_path` tests nothing
          FR-010 is for; (7) a 41st member ACCOMPANIED BY a new census row still reds — additions are
          structurally impossible, not merely discouraged; (8) removing one of a COLLIDING PAIR reds
          — two members in DIFFERENT files whose BARE `composite_key` is byte-identical.
          WHAT THIS CANNOT SEE — whether a member's presence is justified; R1a adjudicates nothing.
          WHY IT CANNOT BE FAKED — transition (8) is the single cheapest test that catches the 19-key
          collapse and the only one that keeps it caught; without it the C-012 interpretation is
          unpinned and can be reverted with the other seven still green.
      - id: T017
        title: "SC-004, SC-013, and the SYNTHETIC witness that takes C-004 off a single real row"
        dod: >-
          SC-004 ships as a PERMANENT test over a materialised tree in which a census row is stale
          while every member is present, and the guard reds ON THE ROW; the same subtask includes a
          tree where `discovered ⊂ census` and requires a red, which is what proves the comparison is
          SET EQUALITY and not containment. SC-013 ships a tree containing a deliberate `SyntaxError`
          and asserts the guard REDS, with the error propagating out of `parse_module` and caught
          nowhere on the guard's call path, asserted by AST as well as behaviourally. AND THE
          PERMANENT GUARD SHIPS THE SYNTHETIC OUTERMOST-VERSUS-INNERMOST WITNESS required by
          C-012(5): a materialised member whose keyed def and innermost def differ, asserting that the
          `MemberKey` qualname is the INNERMOST and that `kind` is taken at the KEYED def. Without it,
          both of C-004's discriminators rest on one real-tree site — `:1165` — held in the class by
          an unused `monkeypatch` parameter that `ruff`'s relaxed `ARG` for `tests/**` will not
          defend, so a routine cleanup silently disarms the mechanisation.
          WHAT THIS CANNOT SEE — whether the row was stale for a good reason; and a file unreadable
          for reasons other than syntax.
          WHY IT CANNOT BE FAKED — `except SyntaxError: continue` narrows the walk with nothing firing
          and buys budget headroom, which is NFR-001's defeat wearing an exception handler.
      - id: T018
        title: "The `E` mechanism — arity, hash placement, and the co-edit asymmetry, over materialised artefacts"
        dod: >-
          FR-004's exemption set and direction mechanism. Three limbs over MATERIALISED artefacts, so this WP is green without WP03 or WP05. (i)
          ARITY — a test invokes mypy AT TEST TIME, as `[sys.executable, "-m", "mypy"]` and NEVER a
          bare `mypy` from `PATH`, on a temporary module that IMPORTS THE REAL `Exempt` from
          `_home_pin_scan` (never re-declaring it, or the limb tests mypy rather than the type) and
          assigns a three-element tuple to a `tuple[Exempt, Exempt]` annotation; asserts a non-zero
          exit and a diagnostic naming the tuple type; POSITIVE CONTROL asserts the same harness exits
          zero for a two-element tuple. If mypy is unavailable the test FAILS — a skip is a fake
          green. STATED COST: that choice reds the always-on pole on any machine without mypy, and
          under DIR-013 such a red must be reported, not absorbed. This limb is not insurance: CI runs
          mypy only over `src/specify_cli src/charter src/doctrine`, with `continue-on-error`, so
          `tests/` has no mypy gate and SC-005's "a third entry is a type error" would otherwise be
          enforced by nothing. It proves the MECHANISM; WP05 runs mypy over the REAL
          `_home_pin_exempt.py`, which is what SC-005 needs. (ii) HASH PLACEMENT — the guard
          RECOMPUTES the key-set hash from the census and compares; over materialised artefacts an
          `owed_to` re-point and a header edit both PASS, a row removal without a tombstone REDS, and
          a row removal WITH a matching tombstone PASSES. (iii) `E`'s CO-EDIT RULE — any delta to `E`
          or its hash reds UNCONDITIONALLY with no tombstone path, because `E` never legitimately
          changes in R1a or R1b.
          WHAT THIS CANNOT SEE — the real `E`; WP05 asserts that.
          WHY IT CANNOT BE FAKED — a blanket "touching both reds" rule would pass (ii) and forbid
          R1b's entire job, so (ii) requires the legitimate-adjudication case to PASS as well as the
          illegitimate one to red.
      - id: T019
        title: "`test_spec_kitty_home_pin_prefilter.py` — OD-002 form (a), with the differential, and without a contended wall clock"
        dod: >-
          FR-002's pre-filter proof, at NFR-002's strength. ONE classifier called TWICE — `discover(root, prefilter=True)` and
          `discover(root, prefilter=False)` — never two implementations agreeing with each other. The
          symmetric difference of their FULL outputs is empty: member sets AND every member's
          `home_partition`, because the pre-filter serves both variables and extending its scope
          without extending its proof is what §0.6 condemns the repository's two existing pre-filters
          for. The SAME test asserts the two passes PARSED DIFFERENT FILE SETS — prefiltered strictly
          smaller, unfiltered EQUAL to the full enumeration — as a set relation, counts reported,
          `2737` never asserted (C-002 — no counted definition of done; the number is content, never a
          threshold, and it is stale the moment anyone adds a file). THE 90 s FIGURE IS AN EXECUTION ENVELOPE HERE, NOT AN ASSERTION: a
          wall-clock assertion inside the contended `arch-adversarial` pole is the anti-pattern
          `ci-quality.yml:2157-2180` documents (#2032). If a timed limb is wanted it moves to the
          `timing` module. WHERE ANY DURATION IS TAKEN ANYWHERE IN THIS MISSION IT IS
          `time.perf_counter()`: `time.time()` is in `_BANNED_CALLS`
          (`tests/_support/wall_clock_assertions.py:10-20`) and `tests/conftest.py:245-250` raises a
          `pytest.UsageError` AT COLLECTION, taking the whole suite down. Published cost figures use
          the measured pair — 0.684 s prefiltered / 8.36 s unfiltered — or none at all; the three
          inconsistent figures previously quoted for one quantity are dropped, and the argument
          survives either way.
          WHAT THIS CANNOT SEE — key-indirection members. NEITHER form can: both passes run the same
          classifier, so the symmetric difference is empty BY CONSTRUCTION if it cannot see them.
          WHY IT CANNOT BE FAKED — without the differential, `prefilter` can be a parameter the body
          ignores and the symmetric difference is empty by construction in about a second.
      - id: T020
        title: "SC-002b's premise, bound to the registry entry that carries it"
        dod: >-
          FR-007's positive-control rule is discharged for this premise in WP01. THE CONTROL AND THE EMPTY-SET ASSERTION LIVE IN WP01/T004, NOT HERE — they need only a
          materialised module, so there is no dependency on this package, and putting them here would
          have forced either a WP01 DoD that a downstream WP completes or an edit to a WP01-owned
          file. What this subtask owns is the BINDING: the pre-filter module asserts that the id
          `assignment_bound_env_key_constant` is PRESENT in `_home_pin_scan.INERT_LIMBS`, so the
          premise on which the pre-filter's soundness rests cannot be silently removed from the
          registry while the pre-filter still depends on it; and it PUBLISHES BOTH FIGURES in its own
          failure message and in `record.md` — 0 assignment-bound against 229 literal `ast.Constant`
          occurrences in 98 files. The 229 is what makes the 0 meaningful; the earlier form of this
          criterion asserted all such constants were empty and was falsified by its own subject
          matter. SC-002b is unconditional and is NOT substitutable by either OD-002 form.
          WHAT THIS CANNOT SEE — a constant assembled at runtime rather than written as a literal.
          WHY IT CANNOT BE FAKED — an over-narrow matcher returns `set()`, greens forever, and still
          greens the day someone writes the indirection; the control in T004 is what detects that, and
          this binding is what stops the id being dropped from the registry to make an equality green.
      - id: T021
        title: "`test_spec_kitty_home_pin_budget.py` — budget (a), the enumerated set, and both parallel modes"
        dod: >-
          SC-007's budget and enumerated-set criterion. `pytestmark = pytest.mark.timing` and NOTHING else, so it runs in `timing-nfr-serial`
          (`-m timing -n0`, always-on, wired into `quality-gate.needs`, merge-blocking) and is
          correctly excluded from the pole by `and not timing`. Three warm runs, every one inside 6 s
          (NFR-001), timed with `time.perf_counter()`. In the same module the set of files the guard
          ENUMERATED is asserted EQUAL to a `Path(root).rglob("*.py")` computed INLINE IN THE TEST,
          never obtained from the module under test, because the seam exposes exactly one enumerator
          and the natural assertion is a self-comparison that a narrowed walk passes. Count REPORTED,
          never asserted (C-002). NFR-003: identical verdicts under `-n0` and `-n auto --dist loadfile`, both
          demonstrated. OD-003 is discharged by reading the figure out of `timing-nfr-serial` on the
          draft PR and recording it as a number; the budget may be RAISED with that evidence and the
          contention headroom STATED, and the walk may NEVER be narrowed.
          WHAT THIS CANNOT SEE — the guard under contention: `timing-nfr-serial` measures it
          uncontended while `arch-adversarial` runs it under `-n auto` on 4 vCPUs, so the serial
          figure is a FLOOR, not the worst case.
          WHY IT CANNOT BE FAKED — the cheapest way to meet a wall-clock budget is to narrow the walk;
          the inline `rglob` set equality makes that impossible, which is why the anti-drift rule bans
          `ast.parse`/`NodeVisitor` in the guard modules but explicitly does NOT ban `rglob`.
    definition_of_done:
      - "PRECONDITION, before the first subtask: `tests/architectural/test_home_pin_gate_verdict.py` is present and GREEN in this lane's worktree (`worktree_allocator.py:462-472` degrades to a printed warning, so this is checked)."
      - "All eight SC-006 transitions, SC-004, SC-013 and the synthetic outermost-versus-innermost witness land RED-FIRST over materialised trees, and the counterpart guard proves no member lives under any test-owned fixture root."
      - "`discovered == census ∪ E` is proven to be SET EQUALITY, not containment, by a tree in which `discovered ⊂ census` reds."
      - "SC-002 asserts empty symmetric difference over BOTH variables' outputs AND that the two passes parsed different file sets, with 90 s as an execution envelope rather than an in-pole wall-clock assertion."
      - "`E`'s fixed arity is enforced by a test-time `[sys.executable, '-m', 'mypy']` invocation importing the REAL `Exempt`, with a positive control, failing rather than skipping when mypy is absent."
      - "IC-08 landing, mechanically: THREE `architectural` modules (`test_home_pin_synthetic_trees.py`, `test_spec_kitty_home_pin_guard.py`, `test_spec_kitty_home_pin_prefilter.py`) and ONE `timing`-only module (`test_spec_kitty_home_pin_budget.py`); `_home_pin_synthetic.py` is a helper and is never collected. All four covered by `test_gate_coverage.py::test_no_new_orphan_surfaces`. `tests/_arch_shard_map.py` is NOT edited."
      - "Zero `ast.parse` calls and zero `ast.NodeVisitor` subclasses in every module of this WP; materialised sources parsed only via `_home_pin_scan.parse_module`."
      - "THE GOLDEN-COUNT RATCHET HAS ZERO HEADROOM: `tests/architectural` sits at 25/25 convert-classified sites against a frozen ceiling of 25, so ANY new `len(x) == N` assertion in this WP trips `test_golden_count_ban::test_convert_sites_do_not_exceed_frozen_baseline`. Every assertion here is a SET comparison, never a count. THE BASELINE MAY NOT BE RE-FROZEN — the fix is always to convert the assertion, never to raise the bound. C-002 already forbids a counted definition of done; this is that rule made operational at the exact point it will bite."
      - "No duration anywhere uses `time.time()`. NFR-004: `ruff check` and `mypy --strict` clean, never `ruff format`. C-013: explicit-path `git add`, long commands bounded with `timeout`, nothing merged. C-006: no file under `src/` changes and no existing test module changes."
      - "Per-subtask completion is a `spec-kitty agent tasks mark-status <Txxx> --status done` event."
    not_done_if:
      - "Any synthetic tree is checked in under `tests/`."
      - "Transition (8) or the synthetic outermost-versus-innermost witness is missing."
      - "The pre-filter proof lacks the parsed-file-set differential, or is weakened to OD-002 form (b), or asserts a wall clock inside the pole."
