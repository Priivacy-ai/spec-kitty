      - id: T001
        title: "`_home_pin_scan.py` — the walk, the byte pre-filter, a parse that never swallows SyntaxError, and the shared types"
        dod: >-
          `enumerate_py_files(root)` returns a set EQUAL to `set(Path(root).rglob("*.py"))` computed
          inline in the test and NEVER obtained from the module under test, asserted over the real
          `tests/` tree and over a materialised tree reached through FR-009's ROOT PARAMETER, containing an `_`-prefixed directory, a
          `conftest.py`, a nested package and a non-`.py` file. The count is REPORTED, never asserted, and every population
          in this WP is an AST set, never a text search (C-003).
          `byte_prefilter` (FR-002 — mandatory, not an optimisation) over a tree with three `b"SPEC_KITTY_HOME"` files and three non-hit files
          returns exactly the three hits — set equality naming BOTH the included and the excluded, so
          a pass-through implementation reds. `parse_module` RAISES `SyntaxError`, and an AST
          assertion over this module's own source proves zero `except SyntaxError` handlers, with a
          positive control proving the matcher finds one where it exists. THIS MODULE ALSO OWNS THE
          SHARED TYPES, because measured there is no `class Exempt` anywhere under `tests/` or `src/`
          and three packages need it: `MemberKey`, `Member`, `Exempt` and `INERT_LIMBS` are exports of
          `_home_pin_scan.py`, named here so WP03's `E`, WP04's mypy harness and WP05's baseline all
          bind to ONE definition. `MemberKey` composition is fixed:
          `MemberKey = (relpath_posix, *composite_key_from_file(path, lineno))` — the primitive
          returns `tuple[str, str]`, so a direct comparison against a 3-tuple is a `mypy --strict`
          TYPE ERROR, not merely a wrong assertion.
          WHAT THIS CANNOT SEE — nothing about membership; it is the walk and the vocabulary.
          WHY IT CANNOT BE FAKED — a walk narrowed by directory or filename fails the materialised
          root's set equality; `except SyntaxError: continue` fails the self-AST check, which cannot
          itself be vacuous because its positive control must return a hit.
      - id: T002
        title: "The binding resolver and the key-parameterised, receiver-agnostic write-site finder"
        dod: >-
          Over one materialised module containing exactly one instance of every write form —
          `monkeypatch.setenv`, a BARE-NAME `setenv`, `os.environ[...] = `, `environ[...] = `,
          `.setdefault(...)`, and `with pytest.MonkeyPatch.context() as mp:` then `mp.setenv(...)` —
          `find_write_sites(tree, key="SPEC_KITTY_HOME")` returns a set of `(lineno, form)` pairs
          EQUAL to the enumerated expected set. The same function with `key="HOME"` over a module
          writing both returns exactly the `HOME` sites and none of the others: one implementation,
          two keys, proven by the second call. `resolve_value` returns `tmp_path/"home"` for each of
          `str(tmp_path / "home")`, `Path(tmp_path, "home")`, `os.fspath(...)`, an f-string,
          `os.path.join(...)`, `%`-format, `.format()` and `+` concatenation, each enumerated
          separately; and `None` for a `Name`-keyed and a dynamic form, with `None` asserted never to
          compare equal to any target.
          WHAT THIS CANNOT SEE — whether a site is inside a member; that is T003.
          WHY IT CANNOT BE FAKED — and the discriminator is NOT what the plan first said. Measured by
          removing `withitem` binding entirely: all 40 members are still found and `:1165` is STILL
          ADMITTED. What admits `:1165` is RECEIVER-AGNOSTICISM ON THE CALL — a receiver-QUALIFIED
          matcher is what drops it and biases `r` toward *proceed*, and the bare-name case is what
          catches that. `withitem`-bound-receiver RESOLUTION matters only when a VALUE expression
          references a with-bound name, whose real-tree population is 0; it is an inert sub-form
          registered in T004, not a load-bearing limb.
      - id: T003
        title: "The keyer, `discover()` over both variables, and the identity/attribution separation"
        dod: >-
          IDENTITY AND ATTRIBUTION ARE SEPARATE AND THEY DISAGREE — C-012(1)-(4), and getting this
          backwards fails SC-001 two packages downstream. (a) The `MemberKey` qualname component is
          the WRITE-SITE enclosing qualname, i.e. the repository primitive's value, which is the
          INNERMOST dotted qualname (`anchoring.py:173-176`). Measured: innermost keying gives
          symmetric difference 0 against the C-011 anchor; outermost gives 2, both at `:1165`.
          (b) The KEYED def — the outermost def in the chain satisfying the silhouette — determines
          MEMBERSHIP, `kind`, and the rename signature's parameter set, and is NOT IN THE KEY.
          (c) C-004 is therefore mechanised by the `kind` DISTRIBUTION, asserted as a mapping:
          `{fixture: 30, test-body: 10, helper: 0}` at the keyed def against `{30, 9, 1}` at the
          innermost — the withdrawn split. That assertion, not the key set, is what reds if an
          implementer attributes to the innermost. (d) Keys are formed FROM THE ALREADY-PARSED TREE
          `discover()` holds, never by re-reading: `composite_key_from_file` reaches
          `anchoring.py:192-195`, which swallows `SyntaxError` and returns `"<module>"`, so
          re-reading would silently degrade a broken file and leave SC-013's guarantee holding only
          on the `parse_module` path; it is used ONLY for the independent live recomputation, where
          the file is known-parseable. Beyond that, `discover(root=<materialised>)` returns a
          `MemberKey` set EQUAL to an enumerated expected set containing, each named: a member in a
          nested closure whose own parameters are neither `tmp_path` nor `monkeypatch`; a member
          satisfying the silhouette only through the chain union; a member declaring
          `(monkeypatch, <a fixture yielding a home root>)` with no `tmp_path`, admitted by FR-010;
          a NON-member resolving to `tmp_path/"other"`; a NON-member whose value is unresolvable.
          `home_partition` is produced for every member with one materialised example each of `A`,
          `B1`, `B2` and `other` — `other` has real-tree population 0, so its example is its
          registered positive control. The import-time exactly-one assertion RAISES on a tree
          carrying two members with a byte-identical 3-tuple and does not raise on
          `discover(Path("tests"))`.
          WHAT THIS CANNOT SEE — whether the real member set is the right one; that anchor is
          external (C-011) and asserted in WP05/T023.
          WHY IT CANNOT BE FAKED — both discriminators for (a)/(c) currently rest on ONE real-tree
          site, `:1165`, held in the class by an unused `monkeypatch` parameter that `ruff`'s relaxed
          `ARG` for `tests/**` will not defend. The synthetic outermost-versus-innermost witness that
          removes that dependency is a permanent-guard obligation and lands in WP04/T017.
      - id: T004
        title: "`test_home_pin_scan_limbs.py` — the inert SUB-FORM registry, its controls, and a completeness check that does not grade its own homework"
        dod: >-
          `_home_pin_scan.INERT_LIMBS: frozenset[str]` names every SUB-FORM whose real-tree
          population is 0. SUB-FORM, NOT LIMB — a limb is a whole clause of the predicate, a sub-form
