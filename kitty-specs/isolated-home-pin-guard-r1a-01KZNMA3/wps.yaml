      - id: T006
        title: "`_home_pin_gate.py` — extraction at both SHAs, the rename detector, banding, ±1 stability, the unbounded walk"
        dod: >-
          AUTHORED FIRST IN THIS PACKAGE, because T007's guard asserts this module is in the
          discovered consumer set. It extracts each SHA's `tests/` with `git archive` into a temporary
          directory and calls `discover(root=<extracted>/tests)`, so FR-009's root parameter is
          exercised by the gate before any consumer depends on it. `band(|R_f|, |R|)` and
          `stability(|R_f|, |R|)` are pure exported functions. Every population it produces is an AST set difference — `git log -S` and `git diff | grep` are text search over a population and are barred (C-003). The rename detector is proven on
          materialised departure/arrival sets: a unique mutual best match on
          `(resolved_value, params_at_keyed_def, kind)` in the same file PAIRS; a two-way tie is
          REFUSED and both sites retained; a candidate whose resolved value is `None` never matches.
          The walk implements the AMENDED §0.9 schedule: backwards along `upstream/main`'s
          FIRST-PARENT history ONE COMMIT AT A TIME — `main` is rebase-merged, so there are no merge
          commits to step over — with NO ATTEMPT CAP, stopping at the first SHA where BOTH `|R| >= 10`
          and ±1 consequence-class stability hold, and with the DEFINED EXIT: reaching the root of
          first-parent history without both holding jointly stops the walk and the OPERATOR decides.
          The stopping rule reads `|R|` and stability ONLY, NEVER `r`. The emitted document's
          top-level key set EQUALS `data-model.md`'s enumerated `Verdict` field list. `subprocess` and
          `git` live HERE and nowhere else.
          WHAT THIS CANNOT SEE — whether ±1 stability is satisfiable at any window; reachability is
          evidenced for the floor (first met ~300-600 commits back) and NOT evidenced for stability.
          WHY IT CANNOT BE FAKED — the stopping rule's independence from `r` is the entire
          forking-path defence and it survives the cap's removal untouched; a rule that read `r`
          would let a walker stop at a convenient band.
      - id: T007
        title: "`test_home_pin_seam_no_second_copy.py` — the anti-drift teeth, over a DISCOVERED consumer set"
        dod: >-
          The test computes by AST the SET of modules under `tests/` importing from
          `_home_pin_scan`, asserts that set is NON-EMPTY and CONTAINS `_home_pin_gate.py` — which
          exists because T006 precedes this subtask, an ordering made explicit here because the
          previous revision put this guard in a package where its own named consumer did not yet
          exist and it was red at its own completion. The consumer set is DISCOVERED, never
          hard-coded, so WP03/WP04/WP05's modules are covered without editing this file. Every member
          contains ZERO `ast.parse` calls and ZERO `ast.NodeVisitor` subclasses; synthetic sources
          anywhere in the Mission are parsed only through `_home_pin_scan.parse_module`. A second
          limb asserts by AST that `_home_pin_scan.py` imports neither `subprocess` nor any git
          surface. Both limbs ship a positive control over a materialised module that DOES contain
          the banned construct.
          WHAT THIS CANNOT SEE — a second copy of the predicate written without importing
          `_home_pin_scan` at all.
          WHY IT CANNOT BE FAKED — prose is exactly what failed at `_sole_door_scan.py:13-27`; a
          hard-coded consumer list greens the day a consumer is renamed, which is why the set is
          discovered and asserted non-empty.
      - id: T008
        title: "`test_home_pin_gate_verdict.py` — the COLLECTED gate, the 806-state oracle, and the keys checked against this tree"
        dod: >-
          A collected, `architectural`-marked, top-level module. (a) FAILS when the verdict artefact
          is absent, demonstrated against an empty `tmp_path`; (b) FAILS when it reads `halt`,
          demonstrated over a materialised artefact; (c) passes only for `proceed` /
          `proceed-degraded`; (d) recomputes `band` from the published `r`, `|R|`, `|R_f|` and
          asserts it EQUALS the published label — the SC-000(vi) limb, without which `proceed`
          written above `r = 0.6` is undetectable; (e) asserts internal consistency AS SETS —
          `R_f ⊆ R`, `r == |R_f| / |R|`, `|R| >= 10`, `end_sha` equal to §0.9's literal, both operand
          sets non-empty — AND requires the `start_sha_crosscheck` key to be present with its
          `symmetric_difference` field present WHETHER EMPTY OR NOT, and any non-empty difference to
          carry a non-empty `explanation` sibling, so the cross-check T009 publishes is verified by
          something rather than by nobody; (f) runs the oracle — the FULL mapping
          `(|R|, |R_f|) -> consequence class` over `|R| in [10,40]`, `|R_f| in [0,|R|]`, compared as
          a MAPPING against one built inline from §0.9's thresholds and clamp, reproducing §0.9's
          independently published `380 go / 364 halt / 62 inadmissible`; (g) THE RESIDUAL IS
          NARROWED, NOT ACCEPTED — `MemberKey` is content-addressed, so for every key in
          `sites_at_end` whose `rel_path` still exists in the working tree the test recomputes
          `(relpath_posix, *composite_key_from_file(path, lineno))` and asserts it equals the
          published key — the C-012 3-tuple, composed as `(relpath_posix, *composite_key_from_file(path, lineno))` because the primitive returns a 2-tuple — with a PUBLISHED NON-ZERO FLOOR on the number of keys checked so the limb
          cannot degrade to zero silently. No git, no subprocess; measured cost 0.19 s for 40 keys,
          1.35 s for 191. `start_sha` is asserted equal to whatever the widening schedule selected
          and published, not to a literal, because the window WILL move.
          WHAT THIS CANNOT SEE — the START-SHA operands, which name content that is not in this tree.
          Forgery cost is now "consistent numbers that are also real token lines at real line numbers
          in this repository", not "consistent numbers"; the start half remains unprovable without
          git, and that is stated in the record rather than papered over.
          WHY IT CANNOT BE FAKED — a test asserting `"verdict" in artefact` passes for `halt`; (b)
          kills that, (d) kills a mislabelled band, (g) kills a fabricated end-SHA operand set.
      - id: T009
        title: "Run the measurement under the amended schedule, publish the verdict, and enforce a halt through the lane machine"
        dod: >-
          THE STATED WINDOW IS ALREADY KNOWN VOID: measured post-tasks, `709a59534 -> 5d49d31ed`
          gives 37 members at the start SHA and 40 at the end with 0 departures, so `|R| = 3` against
          a floor of 10. Lowering the floor is REFUSED by the operator. This subtask therefore starts
          from the VOID result and walks. `research/home_pin_gate/verdict.yaml` — the SOLE authority
          for attempted windows, with no rendered duplicate — is committed and carries all six
          SC-000 components: the site sets at BOTH SHAs as operands so the difference is recomputable
          without re-running; every rename pair with its matching keys; every refused-ambiguous
          candidate; every unpaired departure and arrival; `R` / `|R|` / `|R_f|` / `r`; both SHAs;
          EVERY attempted window with its `(start_sha, |R|, |R_f|, band)` BEGINNING WITH the VOID
          result at `709a59534` (`|R| = 3`); the exact invocation; the ±1 stability result over
          consequence classes with the clamp; the `start_sha_crosscheck` (the checked-in independent
          `clf.py` against a `git archive` extraction at the selected start SHA, with the symmetric
          difference against `discover()` published whether empty or not and any non-empty difference
          explained, never tuned away); and a machine-readable `verdict:` — which is FR-008's unconditional publication list, not a degraded-band-only one. The cross-check runs the CHECKED-IN INDEPENDENT INSTRUMENT `clf.py` from `research/spec_kitty_home_pin_evidence/` (C-011), never a re-implementation. THE RECORD MUST NAME, IN
          SO MANY WORDS, whether §0.3's `28 -> 30` figure is RE-DERIVED at the moved SHA or
          EXPLICITLY SUPERSEDED — one of those two words, not "addressed" — because §0.3's published
          growth is what determined this window's fate once already. THE MEASUREMENT HAS LEAKED and
          the record must say so: an independent lens measured `r = 100%` at candidate windows ~300,
          ~600 and ~2000 first-parent commits back (`|R| = 9, 33, 34`), so ON PUBLISHED EVIDENCE THE
          VERDICT IS ALREADY KNOWN TO BE `proceed`. WP-0b confirms a known answer rather than
          discovering one; R1a must stop describing the gate as its own stopping mechanism, and what
          is protected is only the stopping rule's independence from `r`. ON `halt`: WP-0b is NOT
          moved to `approved` or `done` — it stays at `for_review` — and WP03..WP06 are moved with
          `spec-kitty agent tasks move-task <WPID> --to blocked`. `dependency_readiness_for_wp`
          (`core/dependency_graph.py:50-77`) admits ONLY `approved`/`done` and explicitly excludes
          `blocked` and `for_review`, so `implement WP03` and `implement WP04` then RAISE. That is
          the enforcement; the collected test is the second line, not the first. Operator sign-off is
          requested; the implementer may not proceed on their own authority.
          WHAT THIS CANNOT SEE — how contributors will behave, and arrivals that never became sites.
          WHY IT CANNOT BE FAKED — the operands are published and T008(g) recomputes the surviving
          ones from this tree; the stopping rule was pre-committed before this measurement and does
          not read `r`.
    definition_of_done:
      - "The verdict artefact exists, `band(published) == published.verdict` passes, and `test_home_pin_gate_verdict.py` is COLLECTED and reds on `halt`."
      - "HOW THE GATE REACHES EVERY PACKAGE, from the MEASURED lane graph: lane-a=[WP01] depends on nothing; lane-b=[WP02] depends on lane-a; lane-c=[WP03] and lane-d=[WP04] BOTH depend on lane-b and NOT on lane-a; lane-e=[WP05] depends on lane-c and lane-d. `_ordered_dependency_lanes` resolves DIRECT dependencies only — there is no transitive closure — so lane-a's content reaches lane-c and lane-d TRANSITIVELY, through lane-b's tip, which already carries lane-a's because lane-b was allocated first. TWO earlier statements are struck: 'WP-0b's commits are in every downstream lane's base' (false — the lane base is the mission branch) and 'lane-b and lane-c both declare depends_on_lanes=(lane-a,)' (false — that was the FIVE-lane graph measured BEFORE the WP-0a/WP-0b split renumbered the lanes, so the correction was invalidated by the split it shipped beside). The conclusion survives; the mechanism is two hops, not one, and the tip-merge path DEGRADES TO A PRINTED WARNING at `worktree_allocator.py:462-472` if a dependency branch is unresolvable — a longer chain with a soft failure at each hop is exactly why WP03's and WP04's explicit precondition is CHECKED, NOT ASSUMED. The second, independent limb — a package may not author the test that must block it — is sound and unchanged."
      - "On `halt`: WP-0b is never moved past `for_review`, WP03..WP06 are moved to `blocked` via `move-task`, and the record carries the operator escalation. Note the command: `mark-status` takes T-ids and only `done`/`pending`; `blocked` is reachable only through `move-task`."
      - "THE GOLDEN-COUNT RATCHET HAS ZERO HEADROOM: `tests/architectural` sits at 25/25 convert-classified sites against a frozen ceiling of 25, so ANY new `len(x) == N` assertion in this WP trips `test_golden_count_ban::test_convert_sites_do_not_exceed_frozen_baseline`. Every assertion here is a SET comparison, never a count. THE BASELINE MAY NOT BE RE-FROZEN — the fix is always to convert the assertion, never to raise the bound. C-002 already forbids a counted definition of done; this is that rule made operational at the exact point it will bite."
      - "NFR-006: the gate run is pinned to the external `pytest>=9.0.3,<9.1` venv, the resolved interpreter path and the verbatim invocation are recorded in `verdict.yaml`'s `invocation` field. NEVER a bare `uv run` or `uv sync`; no `.venv` inside this tree."
      - "IC-08 landing, mechanically: both new test modules are top-level, `architectural`-marked, and covered by `test_gate_coverage.py::test_no_new_orphan_surfaces` against `_gate_coverage_baseline.json`. `tests/_arch_shard_map.py` is NOT edited."
      - "NFR-004: `ruff check` and `mypy --strict` clean, never `ruff format`. C-013: nothing merged, no `gh issue create`, explicit-path `git add` only, every long command bounded with `timeout`, and a timeout is a datum, never silently retried. C-006: only this WP's three owned files and the verdict artefact are touched; no file under `src/` changes. Identical results under `-n0` and `-n auto --dist loadfile`."
      - "Per-subtask completion is a `spec-kitty agent tasks mark-status <Txxx> --status done` event."
    not_done_if:
      - "The gate is implemented as an instruction in a downstream WP's first task rather than as a collected test."
      - "The walk stops at an attempt cap, or the stopping rule reads `r`, or a window is accepted for the band it produces."
      - "The verdict omits either operand set, omits the VOID result at `709a59534`, or omits the `start_sha_crosscheck`."
      - "The record fails to use the word RE-DERIVED or SUPERSEDED for §0.3's `28 -> 30` figure."
      - "On `halt`, WP-0b is moved to `approved`, or any downstream WP is left out of `blocked`."
      - "`_home_pin_scan.py` is edited by this WP."

