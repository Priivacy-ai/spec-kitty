          among the 49 pin-bearing fixtures 0; `home_partition == "other"` 0; `withitem`-bound
          receiver referenced by a VALUE expression 0; and SC-002b's assignment-bound
          `"SPEC_KITTY_HOME"` constant 0. THE `HOME` ENUMERATION IS NOT REGISTERED — measured it is
          the most heavily populated limb in the classifier, 85 write sites in 50 files with 13 of
          the 40 members re-pinning `HOME`, and registering it would mandate a FALSE empty-set
          assertion whose cheapest repairs are both catastrophic (narrow the `HOME` matcher until it
