    subtask_details:
      - id: T022
        title: "Generate the census and the baseline through the single documented command"
        dod: >-
          FR-003's frozen census and its baseline. Both artefacts are produced by, and only by,
          `python -m tests.architectural._home_pin_scan --regenerate --root tests --sha <freeze sha>
          --owed-to '#3121' --exempt-module tests.architectural._home_pin_exempt` — the
          `--exempt-module` argument is part of the documented command literal, because without it
          nothing subtracts the owner and the retained-pin probe, which ARE in
          `discover(root=tests)` at this point. Both carry a header naming that exact command; neither
          is hand-edited; a re-run is byte-identical. Structural assertions, all as SETS: the census
          HEADER key set and the census ROW column name set are each asserted by set equality
          (`{key, lineno, kind, home_partition}` for rows), so `reason`, `frozen_at_sha` and
          `owed_to` are absent from rows BY CONSTRUCTION and a `reason` cannot hide in the header
          either; `owed_to` matches `^#[0-9]+$`; rows are sorted; the canonical owner's key is not
          among them; the baseline's key set includes `tombstones`, which is its named home.
          WHAT THIS CANNOT SEE — whether `#3121` is the right SCOPE for 40 distinct adjudications;
          SC-003 can only check that `owed_to` is well-formed and not prose.
          WHY IT CANNOT BE FAKED — a hand-written census fails the byte-identical re-run; a
          `frozen_at_sha` promoted to a row fails the column-name set equality; a census generated
          without `--exempt-module` contains the owner and fails T023.
      - id: T023
        title: "SC-001 and SC-003 — set equality against the external anchor, with `E` subtracted and disjointness PROVED"
        dod: >-
          THE ANCHOR WAS MEASURED AT `5d49d31ed`, BEFORE THE OWNER AND THE PROBE EXISTED, so at this
          point `discover(Path("tests"))` returns 42 keys, not 40, and an assertion of
          `discovered == anchor` is FALSE. The correct three assertions: (1)
          `discover(Path("tests")) - {e.key for e in E} == anchor`; (2) `census == anchor`; (3)
          `anchor ∩ {e.key for e in E} == set()` — stated EXPLICITLY as its own assertion, because
          (1) and (2) together only imply it and a reviewer must see disjointness proved rather than
          relied upon. The anchor is C-011's checked-in evidence artefact, derived from
          `research/spec_kitty_home_pin_evidence/members.json` by applying
          `(relpath_posix, *composite_key_from_file(path, lineno))` to each entry of each member's
          `sites`: the key ENCODING comes from the repo primitive, the identification of WHICH sites
          are members comes from the external artefact, and the key is C-012's path-qualified 3-tuple, so the anchor never passes through the
          instrument under test. THE `tests/` PREFIX IS NAMED HERE, AT THE POINT OF COMPARISON, because that
          is where it bites: `Member.relpath` is relative to the WALK ROOT, so `discover(Path("tests"))`
          yields `cli/commands/foo.py` while `members.json` stores REPO-ROOT-RELATIVE paths
          (`tests/cli/commands/foo.py`). PREFIX AT COMPARISON TIME. `data-model.md` records this normatively,
          but an implementer meeting the mismatch mid-assertion has one cheap wrong repair — edit the anchor —
          and `members.json` is the ONE artefact in this Mission that must never be touched to make a test
          pass, because its whole evidential value is that the party it checks did not write it. `verify.py` exits 0. The literal `40` appears in NO assertion.
          WHAT THIS CANNOT SEE — whether any member deserves to be a member. Entirely R1b's.
          WHY IT CANNOT BE FAKED — the previous revision asserted `discovered == anchor` and
          `census == anchor - E`, which is a false assertion beside a no-op subtraction that reads as
          load-bearing; the implementer facing that red would relax to containment, in the WP whose
          own `not_done_if` names containment as a failure. Under the bare 2-tuple the anchor has 19
          elements and a classifier finding one member per collision class produces the same 19-element
          set, green; the 3-tuple restores this criterion's power, and the key must be path-qualified
          and formed at the WRITE SITE.
      - id: T024
        title: "The real-tree ratchet, the recomputed hashes, and mypy over the REAL `E`"
        dod: >-
          `discover(Path("tests")) == census ∪ E` over `MemberKey` 3-tuples — SET EQUALITY, not
          containment. The guard RECOMPUTES `census_key_set_sha256` from the census and compares it
          against `tests/architectural/spec_kitty_home_pin_baseline.yaml` — a DIFFERENT file from the
          census, so the pin is never editable in the same hunk as its subject — and recomputes
          `exempt_set_sha256` from the real `E`. Every census delta must be accounted for by a
          tombstone; a delta plus a re-pinned hash still reds unless a tombstone explains it, while a
          legitimate adjudication passes. AND SC-005'S ARITY LIMB IS DISCHARGED HERE ON THE REAL
          FILE: `[sys.executable, "-m", "mypy", "--strict", "tests/architectural/_home_pin_exempt.py"]`
          exits zero, which is what SC-005 actually asks for. WP04/T018 proves the MECHANISM over a
          materialised module; only this limb type-checks the artefact that ships, and CI will not do
          it — `mypy` there covers `src/` only and runs with `continue-on-error`.
          WHAT THIS CANNOT SEE — whether a tombstone corresponds to a real adjudication. A tombstone
          written to green a red is the entitlement C-007 forbids wearing the mechanism meant to
          prevent it; only a reviewer catches that.
          WHY IT CANNOT BE FAKED — this is the single assertion that proves the class is frozen and it
          lives in the package least likely to get a hard look (plan §10). A subset-only ratchet passes
          every WP04 tree except T017's and fails here.
      - id: T025
        title: "Make the `:1165` red diagnosable, and pin the fragility register as a SET"
        dod: >-
          For any stale row the guard re-runs the EFFECT LIMB ALONE — does a site in that file still
          write `SPEC_KITTY_HOME` to `tmp_path/"home"`? — and emits one of two distinct messages:
          `site still present, silhouette no longer satisfied — this is NOT an adjudication` versus
          `site absent — deleted`. BOTH branches are exercised over materialised trees (importing
          WP04's `_home_pin_synthetic`, never editing it), each asserting the exact message, so
          neither branch is dead code. AND THE FRAGILITY REGISTER IS A SET EQUALITY, not the phrase
          "the sole such case of the 40": the set of members held in the class by a silhouette
          parameter that their keyed def declares and never references is asserted EQUAL to
          `{the :1165 key}`. Measured true today — exactly one — and asserted by nothing until now,
          while being the only thing that makes T026's "single known-fragile row" true. One extra walk
          over trees the pass has already parsed.
          WHAT THIS CANNOT SEE — the deletion itself; the polarity is a spurious red on a
          behaviour-preserving edit, which is correct and needs no change.
          WHY IT CANNOT BE FAKED — a count in the row whose red this subtask exists to diagnose is the
          shape this Mission keeps catching; without the two messages the cheapest green for a confused
          contributor is a tombstone, recording an adjudication that never happened.
      - id: T026
        title: "The census header's load-bearing prose, and the M4 cross-check recomputed on a named join key"
        dod: >-
          The census HEADER (never a `reason` column) names `:1165` as the known-fragile row, states
          that its membership rests on an unused parameter, and instructs: if this row goes stale with
          the site still present, the repair is neither a tombstone nor a predicate change — it is an
          R1b adjudication. It follows `tests/architectural/census/verdict_seam_IC01.yaml`, whose
          header carries this kind of load-bearing prose while the rows stay data, and it survives the
          reviewer test: it entitles the definition to NOTHING and changes no check's outcome. The
          `home_partition` cross-check is RECOMPUTED at test time: M4's per-member labels are parsed
          from `research/m4_ablation_evidence/TABLES.md`, whose 28 rows are keyed
          `(file, fixture_qualname)` with no lineno, so THE JOIN KEY IS
          `(rel_path, KEYED-DEF qualname)` — measured injective over the 40, giving exactly 28 matches
          and zero unmatched. `MemberKey[1]` is NOT that field: it is the INNERMOST qualname and
          differs from the keyed-def `qual` at `:1165`. Do not reject the 2-tuple projection by false
          analogy with the 19-key collapse, which was about `(qualname, token_line)` and is a different
          hazard. The set of DISAGREEING keys is asserted EMPTY with the intersection size published,
          and a positive control feeds the comparator a deliberately mislabelled materialised row.
          OPERATOR RULING, RECORDED: `home_partition` appears in no key, no hash and no equality, so it
          is REGENERABLE in a follow-up under FR-004(2) and MAY NOT HOLD THE RATCHET HOSTAGE — if this
          column blocks the freeze, the column yields, not the ratchet.
          WHAT THIS CANNOT SEE — whether M4's labels are right; it is a second external anchor, not an
          oracle.
          WHY IT CANNOT BE FAKED — copying `A=27 / B1=11 / B2=2` and `28 agreements` out of the plan
          into a comment satisfies any prose-shaped criterion; recomputation on a named join key with
          an empty-disagreement set and a positive control is the only form that reds when the
          classifier drifts.
    definition_of_done:
      - "`discover(Path('tests')) - E == anchor`, `census == anchor`, and `anchor ∩ E == set()` as three separate assertions; and `discover(Path('tests')) == census ∪ E` as set equality with both hashes recomputed from content."
      - "The literal `40` appears in no assertion anywhere in this WP; every comparison is against a key SET."
      - "`mypy --strict` runs over the REAL `_home_pin_exempt.py` via `[sys.executable, '-m', 'mypy']` and exits zero — SC-005's arity limb discharged on the artefact that ships, since CI will not do it."
