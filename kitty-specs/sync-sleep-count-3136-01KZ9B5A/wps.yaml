# src/specify_cli/core/dependency_graph.py). IC-09 is FOLDED INTO IC-08
# (plan.md:1113-1119). Neither IC-05 nor IC-09 is cited below; citing a merged
# concern would misreport ownership.
#
# ---------------------------------------------------------------------------
# owned_files — why the notes are NOT in it
# ---------------------------------------------------------------------------
# plan.md's "### Source and test surfaces — one owner per path" map assigns five
# note files under `kitty-specs/<mission>/notes/`. Those CANNOT appear in
# owned_files: `_invalid_mission_specs_owned_files`
# (src/specify_cli/cli/commands/agent/mission_parsing.py:207) hard-rejects any
# entry equal to or under `kitty-specs/`, and finalize-tasks exits 1 with
# error_code INVALID_WP_OWNED_FILES_KITTY_SPECS. `owned_files: []` is not an
# escape either: `build_wp_manifests`
# (src/specify_cli/ownership/validation.py:356) skips WPs with falsy
# owned_files, and `compute_lanes` (src/specify_cli/lanes/compute.py:331-336)
# then raises `Executable WP 'WPnn' has no ownership manifest`.
# So every note file below is a DECLARED OUT-OF-MAP PLANNING WRITE, named in the
# owning WP's comment block. Each WP additionally owns at least one real
# non-kitty-specs path, which is what the mechanism requires.
#
# ---------------------------------------------------------------------------
# authoritative_surface — set explicitly on every WP, never inferred
# ---------------------------------------------------------------------------
# `infer_authoritative_surface` (src/specify_cli/ownership/inference.py:154-200)
# has two shapes that break here, both read this session:
#   (a) multi-entry -> longest common path prefix, which is "" for any WP owning
#       both `src/` and `tests/` (WP02), and `validate_authoritative_surface`
#       rejects an empty surface (validation.py:241-243);
#   (b) single-entry -> `stripped[0].rstrip("/") + "/"`, i.e. a file path gains a
#       spurious trailing slash (`docs/.../x.md/`), which is then not a prefix of
#       the owned_files entry it came from.
# Every value below is a literal prefix of at least one owned_files entry
# (`pattern == surface or pattern.startswith(surface)`, validation.py:245-247).
#
# ---------------------------------------------------------------------------
# No directory glob over `tests/architectural/`
# ---------------------------------------------------------------------------
# WP03 owns the census control + its fixture; WP05 owns the gate, the
# `_baselines.yaml` key and `test_ratchet_baselines.py`; WP07 owns the C-010
# terminology guard. All are file-level. A `tests/architectural/**` glob would
# make `_globs_overlap` (validation.py:93-124) union those three lanes.
# The single glob used — `tests/architectural/_fixtures/patch_seam_control/**` —
# is scoped strictly below `_fixtures/` and its prefix is a path-prefix of
# nothing any other WP owns. It is a glob, so a zero-match is a soft warning
# (validation.py:423-428), not an error; that is deliberate, because plan.md
# does not name the fixture module filenames. See [UNVERIFIED-A].
#
# ---------------------------------------------------------------------------
# Concurrent-pair overlap — computed, not asserted
# ---------------------------------------------------------------------------
# `validate_no_overlap` exempts a pair joined by a directed dependency path
# (validation.py:200-207, via `_dependency_reachability`). Ancestor sets:
#   WP01 {} | WP02 {WP01} | WP03 {WP01} | WP04 {WP01,WP02}
#   WP05 {WP01,WP02,WP03} | WP06 {WP01} | WP07 {WP01,WP02,WP03,WP04,WP05}
