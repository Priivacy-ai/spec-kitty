# Frozen shrink-only baseline for the zero-producer lint (WP01, FR-001/SC-001).
#
# THIS IS NOT AN ALLOWLIST. An allowlist entry is permanently excused. A baseline
# entry is DEBT: it has a named owner, a required structural fix, and a test
# (`test_a_baseline_entry_does_not_survive_its_owner`) that fails the moment the
# owner completes with the entry still here. `ALLOWLIST` stays `frozenset()`.
#
# Ratchet semantics (charter Burn-down Policy §a, `frozen-baseline-shrink-only-ratchet`):
#   - a finding NOT in this file  -> FAILS the gate
#   - a baseline entry no longer found -> WARNS, and the entry should be deleted
#
# Why a baseline at all: SC-001 asked for a zero-entry allowlist, but the lint's
# first run on the shipped tree returned 41 findings whose owners run AFTER this
# work package (WP05) or in a later mission (Mission D / I9). The dependency is
# inverted; the criterion was written against a tree that turned out not to be
# clean. Operator ruling, doctrine-silence-guards-01KYFV7Q.
#
# `disposition` vocabulary is exactly three values. There is deliberately no
# `accepted`, no `wont-fix`, no `by-design`:
#   wire-the-producer       something should fill this and nothing does
#   delete-the-declaration  nothing should fill this; the declaration is the defect
#   fix-the-lint-definition a false positive; the CHECKER changes, never the baseline
#
# `provisional: true` marks an entry whose disposition has NOT been adjudicated.
# WP01 recorded the evidence but did not decide, so a provisional guess cannot
# harden into the record. An entry with a named owner may NOT be provisional --
# that owner's disposition is theirs to decide and record;
# `test_baseline_entries_are_well_formed` pins it. The converse does not hold: the
# occurrence-map `from` entry below is un-owned but operator-adjudicated.
#
# KNOWN UNDER-COUNT: the lint matches slot names globally, with no namespacing, so
# a slot is masked whenever an unrelated same-named producer exists anywhere under
# src/. The live example is `overrides` — the exact twin of the four `enhances`
# entries below, retired by the same FR-028 cutover, absent from this file only
# because `src/specify_cli/cli/commands/agent/tasks_status_cmd.py` and
# `src/specify_cli/review/arbiter.py` use `overrides` as a local name. The error
# direction is always false-NEGATIVE, so the true debt is >= 41. WP05 must excise
# all eight `enhances`/`overrides` schema properties, not the four listed here.

# WP owners without a `mission:` prefix are work packages of this mission.
mission: doctrine-silence-guards-01KYFV7Q

