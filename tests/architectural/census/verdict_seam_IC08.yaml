# tests/architectural/census/verdict_seam_IC08.yaml
#
# WP08 (review-cycle-verdict-seam-rebuild-01KZ2W7W, IC-07, FR-008) -- the
# retire-row fragment `tests/architectural/test_verdict_seam_census.py` loads
# (`_load_census_rows`) alongside WP01's `verdict_seam_IC01.yaml`. Same schema
# as IC01 (category, module, function, status, retiring_fr) -- a pure
# top-level YAML list, loaded the same way, NOT a decorative document.
#
# `finalize-tasks`'s `validate_no_overlap` gate forbids two WPs from claiming
# the same `owned_files` entry, so each concern writes its own
# `verdict_seam_IC0N.yaml` fragment (WP01, WP04, WP08); WP16/IC-12 folds them
# into the shared `tests/architectural/verdict_seam_census.yaml` the
# architectural check reads. This file's scope is narrowly the RETIRE
# verdicts FR-008 requires over five of WP01's IC01 `resolver` rows -- it does
# NOT duplicate WP01's writer/resolver/reader enumeration.
#
# ---------------------------------------------------------------------------
# Deadlock this fragment resolves (operator ruling, recorded here per that
# ruling's own instruction) -- enforcing code:
# tests/architectural/test_verdict_seam_census.py::_validate_retire_rows /
# ::_parse_wp_claimed_frs.
# ---------------------------------------------------------------------------
#
# FR-008 says retired paths are "defined by the FR-007 census, not chosen by
# the implementer". WP01's landed IC01 fixture has 47 rows, ALL `status:
# active`, because WP01 is pure enumeration and WP13's narrowing (the WP that
# actually retires resolvers under the partition split) lands AFTER this WP.
# `_validate_retire_rows`'s ORIGINAL rule hard-failed any `retire` row whose
# `retiring_fr` was `Status: Open` in spec.md -- and all 23 FRs in spec.md are
# `Status: Open` (no WP owns updating that column), making every possible
# retire row illegal by construction: a permanent self-set-to-zero deadlock.
#
# The operator's ruling replaced the Status-column check with a WP-CLAIM
# check: a retire row's `retiring_fr` must (a) exist in spec.md's FR table
# (unchanged -- the FR-08-vs-FR-008 typo case still fails) AND (b) be claimed
# by at least one WP's `requirement_refs` in `kitty-specs/<mission>/tasks/WP*.md`
# -- proving some concrete work package has taken on delivering it, not that
# the spec's unmaintained prose says so. Every `retiring_fr` below is claimed:
# FR-007 by WP13 (consumer-unification), FR-003 by WP10 (atomicity/crash-safety
# on the writer), FR-009 by WP12 (arbiter-override retirement) -- verified
# directly against each WP's `tasks/WP*.md` `requirement_refs` frontmatter.
#
# DEFERRED OBLIGATION (per the ruling): verifying that each row's resolver is
# GENUINELY retired (unresolvable) by mission exit moves to WP17
# (mission-exit-verification, NFR-001/NFR-004/C-005) -- this fragment records
# the claim and the reasoning; WP17 is where it gets checked against landed
# code, not here.
#
# ---------------------------------------------------------------------------
# Attribution reasoning per row (ground truth, not guessed):
# ---------------------------------------------------------------------------
#
# - post_merge/review_artifact_consistency.py::_artifact_dirs_for_wp --
#   plan.md's IC-06 risk note names this EXACT function as the fan-out IC-06b
#   (WP13, FR-007) narrows to one resolved directory ("Narrowing it to one
#   resolved directory before the stranded records are reconciled makes them
#   invisible to the gate"). plan.md's source-surface tree lists
#   post_merge/review_artifact_consistency.py as owned by WP07,WP13.
#
# - review/cycle.py::_review_cycle_wp_dir -- ground truth from WP04's OWN
#   landed fragment (verdict_seam_IC04.yaml's WP04-XWP-01 cross-WP
#   dependency), which cites this exact function (and line) as needing the
#   REVIEW_CYCLE kind fix, with "owner: WP10 (IC-05a, atomicity and
#   crash-safety on the writer)". WORK_PACKAGE_TASK stays PRIMARY for every
#   topology forever (P-1) -- what stops resolving is the review-cycle
#   CONTENT this resolver's directory used to (correctly, for its own
#   purpose) hold before the partition-aware seam existed. Retired under
#   FR-003 (the first of WP10's three FRs; WP10's own purpose -- "one
#   critical section covering cycle-number allocation and the write; no
#   orphan on any failure path" -- is what actually rewrites this call site).
#   NOTE: resolve_review_cycle_pointer and create_rejected_review_cycle both
#   call this resolver internally rather than duplicating its logic, so they
#   inherit the fix for free once WP10 lands (WP13 depends on WP10 via
#   IC-05a, so the fix is guaranteed to land before WP13 even starts) --
#   neither is marked retire here.
#
# - review/arbiter.py::_find_review_cycle_artifact,
#   review/arbiter.py::persist_arbiter_decision,
#   review/arbiter.py::get_arbiter_overrides_for_wp -- all three share the
#   identical bare `feature_dir / "tasks" / wp_id` join (keyed on the BARE
#   wp_id, not wp_slug -- the divergence plan.md's IC-09 risk note diagnoses
#   verbatim: "the arbiter's resolver reads feature_dir/'tasks'/wp_id (bare
#   id) so in the normal case it reads a directory that does not exist and
#   returns nothing"). This is a DIFFERENT stranding cause than the
#   COORD/PRIMARY partition split (plan.md IC-09's own framing: "the residual
#   is not 'make the arbiter writer durable' -- it is *retire*
#   persist_arbiter_decision's frontmatter block and JSON sidecars"), so it
#   is retired under FR-009 (WP12, arbiter-override retirement), NOT FR-007 --
#   attributing it to FR-008 (this WP's own FR) would be dishonest, since WP08
#   does not fix this; WP12 does.
#
# ---------------------------------------------------------------------------
# Judgment calls NOT to mark retire (recorded so a reviewer does not have to
# re-derive them) -- full reasoning in this WP's implementer report:
# ---------------------------------------------------------------------------
#
# - tasks_materialization.py::_resolve_wp_slug -- plan.md's source-surface
#   tree DOES list this function under WP13. NOT marked retire here because it
#   returns a wp_slug STRING, not a directory -- T035's detector shape
#   ("compute what this resolver would have returned as a directory, and
#   check whether a review-cycle artifact exists there") does not apply to a
#   function with no directory output, and its own WORK_PACKAGE_TASK-anchored
#   tasks_dir computation is unaffected by the ADR (WORK_PACKAGE_TASK stays
#   PRIMARY forever) -- it computes no "retired path" in the FR-008 sense.
#
# - post_merge/review_artifact_consistency.py::find_rejected_review_artifact_conflicts,
#   review/cycle.py::resolve_review_cycle_pointer,
#   review/cycle.py::create_rejected_review_cycle,
#   tasks_materialization.py::_persist_review_feedback -- all four are
#   CALLERS of an already-marked-retire resolver in the same module, not
#   independent path computations. Each inherits its callee's fix for free
#   once that callee's owning WP lands -- marking the CALLER retire too would
#   double-count the same stranding cause under two resolver names.
#
# - cli/commands/agent/workflow.py::review,
#   cli/commands/agent/workflow_cores.py::has_prior_rejection,
#   cli/commands/agent/workflow_executor.py::implement_try_render_fix_mode_prompt
#   -- all three hard-code a bare/WORK_PACKAGE_TASK-anchored review-cycle
#   sub-artifact path (workflow.py::review even does its own independent
#   mkdir + cycle-number allocation, flagged by WP01's own IC01 fragment
#   comment as an "FR-006 numbering-divergence risk"). Checked against
#   plan.md's regenerated source-surface tree: workflow.py's ONLY owner is
#   WP16, and ONLY for its "stale 'single mutation point' inventory
#   docstring" -- NOT this resolver's logic. workflow_cores.py and
#   workflow_executor.py appear NOWHERE in the tree at all. No WP in this
#   mission's plan actually fixes any of these three call sites, so no honest
#   retiring_fr claim exists for them -- marking them retire here would fail
#   this fragment's own amended rule, or worse, pass it dishonestly by citing
#   an unrelated WP's FR. This is a genuine PLANNING GAP flagged in this WP's
#   implementer report, not silently worked around: WP13's
#   consumer-unification claim of covering "every read, write, gate and
#   display path" is, on this evidence, incomplete.
#
# See also: tests/architectural/census/verdict_seam_IC01.yaml (WP01's
# writer/resolver/reader enumeration), tests/architectural/census/verdict_seam_IC04.yaml
# (WP04's partition/classifier decision + the WP04-XWP-01 ground truth this
# fragment cites), tests/architectural/verdict_seam_census.yaml (WP16/IC-12
# fold target -- does not exist until WP16 lands).

