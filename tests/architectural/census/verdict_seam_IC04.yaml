# ---------------------------------------------------------------------------
# The partition/classifier/routing decision this WP owns.
# ---------------------------------------------------------------------------
partition_decision:
  kind: REVIEW_CYCLE
  enum_value: review_cycle
  partition: COORD
  member_of: _PLACEMENT_ARTIFACT_KINDS
  classifier_mechanism: >-
    Filename-anchored nested-pattern leg in
    src/mission_runtime/artifacts.py::_artifact_kind_for_path, matching the
    FINAL path component against the glob "review-cycle-*.md" when the first
    mission-relative path segment is "tasks". Runs BEFORE the unconditional
    _COORD_RESIDUE_DIRS directory-kind fallback, so tasks/<wp>/baseline-tests.json
    and tasks/WP*.md are unaffected and keep classifying WORK_PACKAGE_TASK.
    Deliberately permissive (matches review-cycle-notes.md, not only the
    numeric review-cycle-<N>.md shape review/cycle.py's OWN writer validates)
    per the ADR's own glob text.
  read_seam_change: >-
    NONE. resolve_artifact_surface / resolve_placement_only in
    src/mission_runtime/resolution.py carry no new `if kind is REVIEW_CYCLE`
    branching -- the existing topology-driven set-membership logic already
    produces the correct answer once REVIEW_CYCLE is a _PLACEMENT_ARTIFACT_KINDS
    member. Verified: `grep -n "REVIEW_CYCLE" src/mission_runtime/resolution.py`
    shows the kind appearing only in comments and the
    _E2_CONSOLIDATED_ELIGIBLE_KINDS frozenset literal (T016) -- never inside
    resolve_artifact_surface or resolve_placement_only's bodies.
  commit_router_change: >-
    NONE (production). Traced call chain: commit_for_mission ->
    _group_files_by_partition -> is_coord_residue_churn (coordination/coherence.py)
    -> kind_for_mission_file -> _artifact_kind_for_path (now returns REVIEW_CYCLE
    post-classifier-leg) -> kind_is_coordination_residue (True, since REVIEW_CYCLE
    is in _PLACEMENT_ARTIFACT_KINDS post-T013). is_coord_residue_churn is the SOLE
    delegated authority commit_router.py consults for per-file bucketing; it
    already composed correctly once the classifier had something correct to
    return. Only test coverage was added to
    tests/architectural/test_write_surface_placement_guard.py (T015):
    test_review_cycle_write_lands_on_coord_ref_under_coord_topology,
    test_review_cycle_write_lands_on_target_branch_under_single_branch_topology,
    test_mixed_review_cycle_and_work_package_task_batch_splits_under_coord.
    IMPORTANT: this means write-routing for review-cycle artifacts under coord
    topology becomes CORRECT the moment this WP's classifier leg lands, even
    BEFORE the WP10 caller-kind-argument finding below is fixed -- the
    per-file residue classification overrides whatever kind the caller
    supplies. This is exactly the #2533-class fix _group_files_by_partition's
    own docstring documents, now exercised for a genuinely new kind for the
    first time.
  e2_published_ruling:
    decision: INCLUDED
    set: _E2_CONSOLIDATED_ELIGIBLE_KINDS
    location: src/mission_runtime/resolution.py (T016 comment block)
    rationale: >-
      REVIEW_CYCLE shares the same "coordination branch is gone post-merge"
      reality the ADR's own text names for ISSUE_MATRIX/TRACER_FILE/
      ACCEPTANCE_MATRIX (all three already E2-eligible): measured 45 of 102
      review-cycle-carrying missions declare a coordination_branch, 0 of those
      45 branches still exist. Leaving REVIEW_CYCLE unruled/excluded would
      make a PUBLISHED mission's review-cycle write fall through to the
      unconditional coordination-surface probe, raising
      CoordinationBranchDeleted for every one of those 45 missions.
      DECISION_LOG's exclusion rationale ("in-mission and not an E2 write
      target by design") does not transfer: a review-cycle verdict is
      accept/retrospective-relevant bookkeeping (like ISSUE_MATRIX /
      ACCEPTANCE_MATRIX / TRACER_FILE), not an in-mission-only decision log
      entry nobody consults again once a mission is done.
    test: >-
      tests/architectural/test_write_surface_placement_guard.py::
      test_review_cycle_e2_published_resolves_consolidated_surface (positive,
      fully-retired-coord fixture) and
      test_review_cycle_e2_ruling_does_not_affect_status_state_exclusion
      (non-regression: STATUS_STATE still probes coordination on the SAME
      fixture).

# ---------------------------------------------------------------------------
# Create-window artifact split (T018) -- a KNOWN, PRESENT fact, not a caveat.
# ---------------------------------------------------------------------------
create_window_split: >-
  The coordination worktree materialises LAZILY at the commit boundary
  (existing, unrelated design -- src/specify_cli/coordination/commit_router.py
  ::_materialise_coord_worktree / CoordinationWorkspace.resolve). As a direct
  consequence: a coord-topology mission's FIRST review cycle for a given WP
  lands PRIMARY (no coordination worktree exists yet at the time of that
  commit to write into), and EVERY SUBSEQUENT review cycle for that same WP
  lands COORD (the worktree now exists). `next_cycle_number`
  (src/specify_cli/review/artifacts.py) as it exists today globs a SINGLE
  directory and therefore MISCOUNTS across this split -- it will collide or
  under-count cycle numbers across the PRIMARY/COORD boundary until WP09's
  numbering rework and WP13's consumer unification land. This is a PRESENT,
  live behavior as of this WP landing (it is not merely a theoretical future
  risk) for every coord-topology mission that accumulates more than one
  review cycle on a single WP.

