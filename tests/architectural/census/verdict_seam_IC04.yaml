    why_not_landed_here: >-
      Implementing option (a) requires (1) a NEW merge-driver COMMAND, not
      merely a gitattributes registration -- union-merging two independently
      numbered review-cycle documents the way merge_driver_traces unions
      traces/*.md is UNSAFE here: two DIFFERENT verdicts that collide under
      the SAME filename (the create-window split's exact shape) must not be
      byte-interleaved into one nonsensical document; correct reconciliation
      likely needs re-numbering one side, coordinating with WP09's numbering
      rework, not a blind union -- and (2) registration across FOUR surfaces
      that are ALL outside this WP's owned_files.
    citations_for_the_precedent_to_mirror:
