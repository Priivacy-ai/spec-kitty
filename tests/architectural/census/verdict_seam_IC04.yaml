      tripwire flipped to a positive presence check).

      The landed reconciliation semantics differ from why_not_landed_here's
      speculation below ("correct reconciliation likely needs re-numbering
      one side"): WP18 chose REFUSE fail-closed over renumbering. Both
      verdict documents survive verbatim, embedded inside standard
      conflict markers; the driver exits non-zero so
      `git merge --squash -X theirs` reports the path as an unresolved
      conflict rather than silently picking a side or minting a cycle
      number nobody authored. Renumbering was rejected because it would
      have to trust a directory-listing computation at merge time -- the
      same class of mechanism (`next_cycle_number` globbing one partition)
      that caused this hazard in the first place -- and because a
      cycle_number reassignment made unattended, with no operator present to
      confirm the reordering is chronologically honest, is itself a form of
      inventing a record no reviewer wrote (weighed against FR-006/C-002(b)
      in merge_driver_review_cycle's own docstring).

      Proven red-first through the REAL mission->target squash merge path
      (specify_cli.lanes.merge._merge_branch_into, the same function
      _merge_branch_into this ruling's own "why_not_landed_here" and
      citations reference) in
      tests/specify_cli/cli/commands/test_review_cycle_merge_driver.py: with
      the driver excluded from the registry, the target's genuine cycle-1
      verdict is silently overwritten by the mission branch's mis-numbered
      one (the exact clobber this dependency describes); with the driver
      registered, the squash aborts before the target ref ever advances, so
      the genuine verdict survives and nothing is lost on either side.
    status: CLOSED -- landed by WP18 (T077-T080).
    owner: >-
      WP18 (operator-assigned) -- a new work package owning the merge-driver
      command and its registration across .gitattributes, lanes/merge.py,
      init.py, and the upgrade migration surface. This WP's ruling (option
      (a)) stands and has now LANDED: WP18 added
      merge_driver_review_cycle plus the registration across all four
      surfaces, and the interim tripwire in
      test_review_cycle_tasks_hazard_is_ruled_and_tracked has been flipped to
      a positive driver-presence check, as that tripwire's own failure message
      instructed. One correction to the prediction below: WP18 chose to
      REFUSE FAIL-CLOSED rather than re-number one side. Renumbering was
      considered and rejected because cycle_number is exactly the field
      downstream readers use to decide which verdict is authoritative, so
      silently reassigning it during an unattended squash would change "which
      verdict is latest" with no human present -- the same fabrication risk
      FR-006/C-002(b) warn against, one layer down -- and it would have to
      trust a merge-time directory listing, the very mechanism class that
      caused this hazard. Refusing loses nothing: both documents survive
      byte-for-byte behind conflict markers. So no coordination with WP09's
      numbering rework was needed after all.
    ruling: >-
      Option (a) -- a reconcile driver -- per
      tests/architectural/test_merge_reconciliation_class_guard.py::
      test_review_cycle_tasks_hazard_is_ruled_and_tracked and the
      _NON_DIVERGENT_COORD_RESIDUE_DIRS module comment (both updated by this
      WP). Option (b) (a passing test proving the clobber cannot occur) was
      considered and rejected as dishonest: nothing in the tree today
      (before WP05a's atomicity work and WP06b's consumer unification land)
