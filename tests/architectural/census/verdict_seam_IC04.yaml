  - id: WP04-XWP-03
    title: >-
      the tasks/ two-sided REVIEW_CYCLE merge-reconciliation hazard (T017)
      needs a NEW, narrowly-scoped merge driver across four surfaces outside
      this WP's owned_files
    status: DISCHARGED (WP18 landed, review-cycle-verdict-seam-rebuild-01KZ2W7W)
    discharge_note: >-
      WP18 (T077-T080) landed merge_driver_review_cycle
      (src/specify_cli/cli/commands/merge_driver.py) and registered it across
      all four surfaces named in citations_for_the_precedent_to_mirror below:
