# tests/architectural/test_no_inert_schema_slots.py — the zero-producer lint
# (mission doctrine-silence-guards-01KYFV7Q, WP01).
#
# NOT an allowlist. Each entry is a declared doctrine slot that nothing in the
# tree populates, frozen with a named owner and a required structural fix; see
# tests/architectural/_inert_slots_baseline.yaml. Growth FAILS, shrinkage WARNS.
# WP05 cleared its 8 (the FR-028 enhances/overrides excision, 59 -> 51); mission
# foundational-values-creed-band-01KYFV8N still owns 26 (import_candidates'
# first producer). Expect this to fall further, not rise.
# 51 -> 48 (PR #3134 fixup): occurrence-map.schema.yaml's `from`/`moves`/`to`
# rows were deleted from the baseline. `_inert_slots.py` now excludes that
# whole schema from the slot walk (`_NON_DOCTRINE_SCHEMAS`) -- occurrence maps
# are per-mission kitty-specs/ planning artifacts, structurally outside the
# src-only producer scope, so no property of that schema (including PR #3134's
# new `structural_targets`) can ever be assessed here. All three deleted rows
# were `unassigned`, so that count drops 23 -> 20 too.
# justification: 48 -> 47 (PR #3234): the `toolguide-references` row was deleted
# from _inert_slots_baseline.yaml because `diagram-daisy.agent.yaml` now authors
# that key -- a previously-inert schema slot became live. Legitimate shrinkage.
# The deleted row was `unassigned`, so that count drops 20 -> 19 too.
test_no_inert_schema_slots:
  baseline_entries: 47
  # The shrink-only cap on `unassigned` owners. `unassigned` is the one owner the
  # anti-weasel test can never fire for, so this is the gate's only escape hatch;
  # registering it here subjects widening it to the same `# justification:` policy
  # as any other ratchet, instead of leaving it a bare module constant a future PR
  # raises in one line.
  unassigned_entries: 19
  # The shrink-only cap on slots suppressed by a CODE producer alone. A single
  # dead line anywhere under src/doctrine (`x = None`, a dict key, a kwarg —
  # three shapes work) used to silence a new inert-slot finding with no baseline
  # row and nothing visible in review. Tightening which AST node counts as a
  # write only moves that hole, so the suppressions are made visible and capped
  # instead. Measured: 14 of the 15 are false suppressions (name collisions and
  # reader-not-producer sites) — the lint erred permissively. At 14/14 a new
  # suppression can only enter as a genuine producer, argued in the diff.
  # 14 -> 13 (PR #3134 fixup): the `field_path` / occurrence-map.schema.yaml
  # masking row was retired along with the whole schema exclusion (see
  # `test_no_inert_schema_slots` note above and `_NON_DOCTRINE_SCHEMAS` in
  # `_inert_slots.py`) — that slot is no longer scanned at all, so it can no
  # longer be code-only-suppressed either.
  masking_suppressions: 13

# tests/architectural/test_reference_enum_ratchet.py
# The four `<kind>_reference.type` enums in src/doctrine/schemas/. `_BASELINE`
# there is a mutable, shrink-only member set; Charter Burn-down Policy (a) puts
# every such allowlist under a baseline here, so widening an enum needs the
# `# justification:` diff rather than a one-line module edit. Counted as flat
# `<definition_key>:<member>` slots (BASELINE_MEMBER_SLOTS) so the four sets
# reduce to one number: 9 + 7 + 9 + 9. The 9-vs-7 split is unadjudicated --
# see #2976 -- so expect this to SHRINK when it is settled, never grow.
test_reference_enum_ratchet:
  baseline_members: 34

# tests/architectural/test_egress_consent_boundary.py
# Issue #3030 (P0 confidentiality). The egress boundary permits a transmit
# primitive only in a file carrying an explicit allowance. Both sets are
# ratcheted here so this gate cannot be silenced by a one-line module edit —
# adding a file requires this diff plus a `# justification:` naming why the
# sink carries no project data, or why its consent seam is sound.
test_egress_consent_boundary:
  # justification: 27 files hold a transmit primitive with a recorded reason —
  # 10 gated by a named consent seam on the data's own project_uuid (E1/E2/E3,
  # E6-E10, and E13; E9 spans two sink files), 1 per-project transport whose
  # every caller is separately
  # seamed (E14), and 16 that are
  # not project egress at all — auth/OAuth token traffic, the doctrine fetch,
  # the readiness probe, five localhost control endpoints and `sync doctor`'s
  # empty-body connectivity probe (E18). Each was verified individually, not
  # assumed. 10 + 1 + 16 = 27. Earlier, 27 -> 28: the callee-agnostic
  # injected-transport rule (added after
  # E20 showed a `poster(...)` parameter is invisible to any method-name rule)
  # surfaced cli/commands/sync.py, which calls request_with_fallback_sync
  # rather than requests.post. That is the gate finding a file nobody had
  # reasoned about, which is its purpose — not a new leak.
  # 28 -> 27 (#3167): E15, the UNREACHABLE allowance for the queue-backed drain
  # in sync/batch.py, was RETIRED — the drain was deleted rather than gated, so
  # the module holds zero transmit primitives and is no longer on the allowlist
  # at all. This ratchet is shrink-only (growth fails, shrinkage merely warns),
  # so leaving it at 28 would have silently held the ceiling one free
  # unconsented-egress file too high. That is the drift #3167 exists to close,
  # which is why the count is corrected here even though nothing reds on it.
  # 27 -> 28 (per-project-sync-consent-ledgers WP10/T047):
  # sync/daemon_protocol.py owns one authenticated, versioned quiesce/restart
  # call to the exact current daemon. Its constructor parses and requires an
  # exact http://127.0.0.1:<port> or http://localhost:<port> authority; remote,
  # userinfo-confused, path-bearing, and portless URLs are rejected before I/O.
  # This is loopback control, not project-data egress, and its exact sink count
  # is independently pinned in test_egress_consent_boundary.py.
  # 28 -> 27 (#3165): live recomputation before this change found 26 entries,
  # below the stale ceiling of 28. The HTTPS doctrine source adds one E18
  # not-project-data sender: its JFrog AQL POST contains only the
  # operator-configured repository/path/name needed for an inbound fetch. Reset
  # the ceiling to the exact new live count rather than spending hidden room.
  # Growth here means a new file transmits: argue it in the diff.
  egress_allowlist_files: 27
  # justification: 0. The module asserts this set is EMPTY, so any entry is a
  # red build; pinning the baseline at 0 makes recording one cost a second
  # visible diff here as well. Growth is a NEW unconsented egress path — the
  # P0 this mission exists to close — so the intended response to a finding is
  # to fix the path, never to register it. E1/E2/E3 were the founding entries
  # (FR-028/029/030) and moved to egress_allowlist_files when they landed.
  known_ungated_files: 0

# tests/architectural/test_unfiltered_journal_read_boundary.py
# Issue #3030 (P0 confidentiality). The project-unfiltered journal read
# (`read_identity_projection_for_report` / `SELECT_IDENTITY_PROJECTION_ALL_SQL`)
# may only be named by a listed consumer. Keyed per-SYMBOL
# (`<relpath>::<qualname>`), not per-file: the one legitimate consumer lives in
# `delivery/status_report.py`, so a file- or package-keyed rule would have to
# exempt the very package the pre-fix unfiltered drain read was written in.
# Registered here for the same reason the egress allowlist is — the allowlist is
# itself the surface an author would edit to silence the gate.
test_unfiltered_journal_read_boundary:
  # justification: 4 functions name the unfiltered-read symbol, and the module's
  # own test_removing_any_entry_reds_exactly_its_own_key proves all 4 are live
  # (0 inert). Since the #3262 per-project cutover the machine-global SQL
  # constant is retired and the owning module holds no counted reference, so
  # the owner entries are gone; the live consumers are 1 operator report
  # (delivery/status_report.py::build_per_project_store_report, FR-015/SC-004),
  # 1 operator selector (cli/commands/sync.py::_purge_resolve_project — the
  # precedent that motivated the gate), and 2 purge measurement reads
  # (cli/commands/sync.py::_purge_journal_census / _purge_journal_ids, WP10
  # cutover tooling: verbatim identity census incl. FR-011 NULL rows,
  # measurement-only, one explicit operator command).
  # Growth here means a NEW consumer can reach the read that shipped 1,322
  # never-opted-in events on 2026-07-27: argue it in the diff, or use
  # `read_identity_projection(project_uuids=...)` instead.
  unfiltered_read_allowlist_sites: 4
