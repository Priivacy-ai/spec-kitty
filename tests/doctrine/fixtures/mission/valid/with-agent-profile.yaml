schema_version: "1.0"
key: software-dev
name: Software Development
orchestration:
  states:
    - id: planned
      agent-profile: planner
    - doing
    - for_review
    - done
  transitions:
    - from: planned
      to: doing
      on: implement
      agent-profile: implementer
  guards: [dependencies_resolved]
  required_artifacts: [spec.md, plan.md, tasks.md]
steps:
  - id: plan
    display_name: Planning
    step_type: agent
    prompt_template: plan-prompt.md
    depends_on: []
    agent-profile: architect
  - id: implement
    display_name: Implement
    step_type: agent
    prompt_template: implement-prompt.md
    depends_on: [plan]
