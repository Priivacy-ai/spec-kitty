summary: >
  Reference for the Gherkin DSL itself — the language, not any runner. Covers
  Feature, Background, Scenario, Scenario Outline, the Given/When/Then/And/But
  steps, Examples tables, tags, and doc strings / data tables. Explicitly scoped
  to the notation only; the runner that executes Gherkin (Cucumber, behave,
  SpecFlow, and others) is out of scope and named only to draw the boundary.
