summary: >
  Operator reference for SonarQube static analysis and its quality gate. Covers
  the four measure families (new-code coverage, code smells / maintainability,
  security hotspots and vulnerabilities, duplication), why the gate is evaluated
  on NEW code rather than the whole project, and the loopback-safe handling of a
  local Sonar or control-plane URL (do not force HTTPS on 127.0.0.1).
