schema_version: "1.0"
id: supply-chain-install-safety
name: Supply-Chain Install Safety Checklist
applies_to_languages: [javascript, typescript]
purpose: >
  Provide the concrete, operational checklist that turns the
  supply-chain-install-safety directive's policy pillars into checks an
  implementer runs before accepting a dependency change and evidence a
  reviewer requires before approving one. Apply whenever a mission
  adds, upgrades, or removes a dependency during `plan`, `implement`, or
  `review` — the checklist below is executed, not merely acknowledged; each
  step produces a recorded result, not an aspirational statement of intent.
  This tactic is advisory at the transition-gate level in v1 (no new
  fail-closed handler is introduced), but the checklist itself is not
  optional: an unexamined default counts as a gap in evidence, not a pass.
steps:
  - title: Run the registry existence/authenticity check
    description: >
      Confirm the resolved package and version exist on the approved official
      registry and not an unexpected mirror, proxy, or typosquatted namespace.
      Record the resolved registry URL/host as evidence. If resolution is
      ambiguous or unexpected, stop and escalate to the operator instead of
      proceeding.
    examples:
      - "npm view <package> dist.tarball  # confirm the resolved tarball host matches the approved registry"
      - "Evidence line: \"registry check: <package>@<version> resolves on registry.npmjs.org — OK\""

  - title: Produce a freshness report
    description: >
      Record first-publish and latest-publish/update timestamps for the
      resolved version. Flag any version published within a short window
      (e.g. days) of the current date, or published during a known active
      incident window, as an elevated-risk signal requiring explicit operator
      acknowledgment rather than silent acceptance.
    examples:
      - "npm view <package>@<version> time"
      - "Evidence line: \"freshness: <package>@<version> published 2026-08-01 (5 days old) — flagged for operator review\""

  - title: Confirm no automatic lifecycle-script approval occurred
    description: >
      Verify that `preinstall`/`install`/`postinstall` scripts were not
      auto-executed for the new or changed dependency. If a lifecycle script
      is genuinely required, confirm it is an explicit, scoped allowlist entry
      with a documented justification — never a blanket script-safety bypass.
      Record the disposition (no script present / script present and denied /
      script present and explicitly allowlisted with justification).
    examples:
      - "npm install --ignore-scripts && npm run build  # verify build still succeeds without scripts before considering an allowlist"
      - "Evidence line: \"lifecycle scripts: <package> ships a postinstall script; NOT allowlisted; build succeeds without it — denied by default\""

  - title: Run the Node LTS awareness check
    description: >
      Compare the project's declared/runtime Node version against current
      Active LTS. Record match/skew explicitly. A skew is not itself a
      blocker in v1, but it must be disclosed with rationale if intentional —
      never left unacknowledged.
    examples:
      - "node --version && cat .nvmrc"
      - "Evidence line: \"Node LTS check: project targets Node 18 (Maintenance LTS); current Active LTS is Node 22 — skew acknowledged, upgrade tracked as follow-up\""

  - title: Run IoC/persistence posture checks
    description: >
      Check the package (and any changed transitive dependencies) against
      current CAS/vendor supply-chain incident feeds — the external authority
      of record — and watch for class-level indicators of compromise:
      unexpected network calls from install scripts, credential/token
      exfiltration attempts, or self-propagating (worm-style) install
      behavior. Do not embed a static incident package/version list in the
      mission artifact; cite the external feed(s) consulted instead.
    examples:
      - "Evidence line: \"IoC/incident check: consulted <CAS/vendor feed name>, no active-incident match for <package>@<version>; no anomalous install-script network activity observed\""

  - title: Capture review evidence in the required shape
    description: >
      Before recommending approval, confirm the change's evidence trail
      includes results for all five checks above (registry, freshness,
      lifecycle scripts, Node LTS, incident/IoC posture). Missing or
      unexamined checks are a gap to close before approval, not something to
      wave through because the mission is otherwise advisory in v1.
    examples:
      - "Evidence line: \"supply-chain checklist: registry OK, freshness flagged+acknowledged, scripts denied-by-default, Node LTS matched, IoC check clean — approved\""

  - title: Disposition any adversarial-squad or reviewer challenge explicitly
    description: >
      When an adversarial-squad pass or a reviewer challenges a supply-chain
      finding or assumption made during this checklist, record an explicit
      disposition for the challenged finding — never drop it silently. Use
      the disposition vocabulary from the mission's adversarial-evidence
      contract: `accepted` (the original conclusion stands, challenge
      considered and rejected with reasoning), `changed` (the finding altered
      the decision — record what changed), or `deferred_with_rationale` (the
      challenge is valid but out of scope for this change — record why and
      where the follow-up is tracked). Every disposition must be traceable to
      a specific evidence_location (file/section) in the mission artifact.
    examples:
      - "Disposition: finding_id=SC-01, challenge_summary=\"freshness threshold too lax for a Tier-1 dependency\", source=adversarial pass, disposition=changed, evidence_location=\"review notes §Supply-Chain Evidence\""
      - "Disposition: finding_id=SC-02, challenge_summary=\"Node LTS skew should block merge\", source=reviewer challenge, disposition=deferred_with_rationale, rationale=\"v1 remains advisory per C-003; tracked as follow-up\", evidence_location=\"tasks/WPxx history\""

failure_modes:
  - "Treating the checklist as aspirational prose — writing 'we should check the registry' instead of actually running the check and recording the result is not compliance."
  - "Silently dropping a challenged finding — an adversarial-squad or reviewer challenge that never receives a recorded disposition (accepted/changed/deferred_with_rationale) is a governance gap, not a neutral outcome."
  - "Using v1's advisory posture as license to skip evidence entirely — advisory means no new fail-closed transition gate, not 'the checklist is optional'."
  - "Hardcoding a specific incident package/version into this tactic instead of citing the external CAS/vendor feed consulted — the checklist must stay reusable as incidents change."
  - "Globally bypassing script safety to save time on one dependency, silently re-enabling automatic script execution project-wide."

references:
  - name: Supply-Chain Install Safety Directive
    type: directive
    id: DIRECTIVE_051
    when: This checklist operationalizes the policy pillars defined by the supply-chain-install-safety directive
  - name: Secure Design Checklist
    type: tactic
    id: secure-design-checklist
    when: Supply-chain install safety is a specialization of Fail-Safe Defaults (deny by default) applied to dependency lifecycle scripts
  - name: Adversarial Squad Deployment
    type: procedure
    id: adversarial-squad-deployment
    when: Use adversarial-squad challenge passes at plan/research and review point-cuts for security-impacting dependency decisions, and disposition every contested finding explicitly
