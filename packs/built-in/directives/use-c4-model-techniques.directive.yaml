schema_version: "1.0"
id: USE_C4_MODEL_TECHNIQUES
title: Use C4 Model Techniques
intent: >
  Document and reason about a system's architecture with the C4 model's
  progressive zoom — System Context, then Container, then Component, then Code —
  so every diagram serves one audience at one level of detail instead of a single
  all-in-one picture that serves nobody. Draw only the levels that earn their
  keep: a Context diagram is almost always worth it, Container diagrams for
  systems with more than one deployable unit, Component diagrams only for
  containers with non-obvious internal structure, and Code-level diagrams only
  when they can be generated cheaply. Keep every diagram in a text-based,
  version-controlled form (Mermaid or PlantUML diagram-as-code, not a binary
  export) so it diffs, reviews, and travels with the code it describes. This
  directive is an extensible HUB for architecture-documentation techniques: the
  C4 zoom-in workflow, the diagram review checklist, the diagram-as-code
  toolguides, the drill-down abstraction-level discipline, and code/documentation
  analysis for boundary discovery all hang off it, and further techniques are
  wired in as they are supplied. It governs HOW to document and reason about
  architecture at the right zoom level; the concrete techniques it recommends are
  the suggested members, each chosen for the specific documentation need it
  serves.
enforcement: lenient-adherence
scope: >
  Applies whenever a system's architecture is being documented, communicated, or
  reasoned about at more than one level of detail — producing or updating an
  architecture description, an ADR's context, a component boundary write-up, or a
  diagram that a reviewer or newcomer must understand without a verbal
  walkthrough. It does not mandate diagrams for a change with no architectural
  surface, and it is notation-independent: it constrains the abstraction
  discipline and the text-based, reviewable form, not the choice of rendering
  tool.
procedures:
  - "Start at the broadest level and zoom in only where detail adds value. Draw
    the System Context first (the system as one box, its users, and the systems
    it talks to), then Containers, then Components, and stop at the level that
    answers the question at hand — do not produce every level speculatively."
  - "Give every diagram a title, a legend, typed and described elements, and
    labelled unidirectional relationships. A box with no description or a
    double-headed arrow that hides who initiates is a communication failure; run
    the architecture diagram review checklist before sharing."
  - "Match the level of detail to the audience. Context diagrams for sponsors
    carry no technology labels; component diagrams for developers do not omit
    internal boundaries for the sake of tidiness. A diagram that tries to serve
    two audiences serves neither."
  - "Keep diagrams as version-controlled diagram-as-code. Author them in Mermaid
    or PlantUML text so they diff in review and stay beside the code, rather than
    as exported images that go stale silently."
  - "Reason at a single abstraction level per artifact and link across levels
    rather than inlining. Use the drill-down discipline to keep strategic,
    architectural, design, and code-level reasoning in their own homes with
    upward and downward traceability."
integrity_rules:
  - "Each diagram sits at one identified C4 level and states which; a diagram
    that conflates levels or audiences is revised, not shipped."
  - "Diagrams are authored in a text-based, version-controlled notation so they
    are diffable and reviewable; a binary export is not a substitute for the
    source."
  - "Every element carries a type and a responsibility description and every
    relationship is labelled and unidirectional; acronyms are expanded or defined
    in the legend."
  - "Only the levels and supporting diagrams that answer a real question are
    produced; speculative diagrams that go stale before anyone reads them are out
    of scope."
validation_criteria:
  - "An architecture description can be entered at the Context level and drilled
    down through Containers to Components without a level being skipped or an
    audience being mismatched."
  - "Every shipped diagram passes the architecture diagram review checklist —
    title, legend, typed described elements, labelled unidirectional
    relationships, audience-appropriate detail — without a verbal walkthrough."
  - "Diagrams live in the repository as diagram-as-code and change in the same
    reviewable diffs as the architecture they describe."
explicit_allowances:
  - "A throwaway spike or a single-container system with no non-obvious internal
    structure may stop at a Context diagram (or none at all); the lower C4 levels
    are produced only when they answer a question someone is actually asking."
  - "An automatically generated Code-level (Level 4) diagram may be included when
    tooling makes it cheap; manual authoring of Level 4 is not required and is
    usually not worth its maintenance cost."
