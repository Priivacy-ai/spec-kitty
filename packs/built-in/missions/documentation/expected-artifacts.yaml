# Expected artifact manifest for documentation mission
#
# Defines which artifacts are required/optional at each documentation step.
# Documentation mission uses Divio 4-type system (tutorial, how-to, reference, explanation).
# Step names correspond to mission.yaml workflow phases.

schema_version: "1.0"
mission_type: "documentation"
# manifest_version is a sync-namespace identity key (feeds NamespaceRef), not
# a content-freshness counter; do not bump on content-only changes -- see
# kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-design-decisions.md
# Decision 2.
manifest_version: "1"

# Artifacts required regardless of mission step
required_always: []

# Artifacts required at specific mission steps
# Note: documentation mission uses legacy phases (discover, audit, design, generate, validate, publish, accept)
required_by_step:
  discover:
    # Discover phase requires specification of documentation needs
    - artifact_key: "input.spec.documentation"
      artifact_class: "input"
      path_pattern: "spec.md"
      blocking: true

  audit:
    # Audit phase requires gap analysis (matches _evaluate_documentation_guards'
    # "audit" branch, which checks gap-analysis.md only).
    - artifact_key: "evidence.gap-analysis"
      artifact_class: "evidence"
      path_pattern: "gap-analysis.md"
      blocking: true

  design:
    # Design phase requires the documentation plan (matches
    # _evaluate_documentation_guards' "design" branch, which checks
    # plan.md only).
    - artifact_key: "workflow.plan.documentation"
      artifact_class: "workflow"
      path_pattern: "plan.md"
      blocking: true

  generate:
    # Generate phase produces documentation artifacts
    #
    # NOTE (#3542-C): `blocking: false` here governs *dossier completeness*
    # scoring only -- whether a missing docs/**/*.md counts against this
    # manifest's completeness index (ManifestRegistry / Indexer). It is a
    # separate axis from the *runtime step-transition gate*, which is
    # `_evaluate_generate_docs_guard` in
    # `src/runtime/next/runtime_bridge_cores.py`: that guard unconditionally
    # blocks the "generate" -> next-step transition when no generated docs
    # are found, independent of this `blocking` flag. The two are allowed to
    # disagree -- do not "fix" one to match the other without re-checking
    # both call sites.
    - artifact_key: "output.docs.generated"
      artifact_class: "output"
      path_pattern: "docs/**/*.md"
      blocking: false

  validate:
    # Validate phase requires the audit report (matches
    # _evaluate_documentation_guards' "validate" branch).
    - artifact_key: "evidence.audit-report"
      artifact_class: "evidence"
      path_pattern: "audit-report.md"
      blocking: true

  publish:
    # Publish phase requires the release notes (matches
    # _evaluate_documentation_guards' "publish" branch).
    - artifact_key: "output.release.main"
      artifact_class: "output"
      path_pattern: "release.md"
      blocking: true

  accept:
    # Accept phase confirms the publication handoff is complete
    []

# Artifacts optional throughout the mission
optional_always:
  - artifact_key: "evidence.research"
    artifact_class: "evidence"
    path_pattern: "research.md"
    blocking: false
  - artifact_key: "evidence.data-model"
    artifact_class: "evidence"
    path_pattern: "data-model.md"
    blocking: false
  - artifact_key: "evidence.quickstart"
    artifact_class: "evidence"
    path_pattern: "quickstart.md"
    blocking: false
  - artifact_key: "evidence.audit-report"
    artifact_class: "evidence"
    path_pattern: "audit-report.md"
    blocking: false
  - artifact_key: "runtime.charter-lint.decay"
    artifact_class: "runtime"
    path_pattern: "lint-report.json"
    blocking: false
