# Compatibility Shim Registry
# Mission: migration-shim-ownership-rules-01KPDYDW (#615)
#
# Schema: kitty-specs/migration-shim-ownership-rules-01KPDYDW/contracts/shim-registry-schema.yaml
# Rulebook: docs/migrations/migration-and-shim-rules.md
#
# To register a new shim: follow the instructions in the rulebook Section 4
# (rule family d — removal plans and registry contract) and the quickstart at
# kitty-specs/migration-shim-ownership-rules-01KPDYDW/quickstart.md
#
# CI enforcement: spec-kitty doctor shim-registry
# Scanner test: tests/architectural/test_unregistered_shim_scanner.py
#
# Baseline (2026-04-19): zero shims present at mission-615 start.
# Every future entry must set grandfathered: false.
#
# Drained (unshim wave 2, #2291): specify_cli.glossary (#613) and
# specify_cli.next (#612) shims deleted; canonical imports are
# glossary.* and runtime.next.* respectively.

shims:
  - legacy_path: doctrine
    canonical_import: charter.offering
    introduced_in_release: "3.2.6"
    removal_target_release: "3.3.0"
    tracker_issue: "#3664"
    grandfathered: false
    notes: >
      CR-06 (mission charter-code-topology-01M152G1). The top-level
      src/doctrine/ package relocated wholesale to src/charter/offering/;
      this shim (src/doctrine.py, a single module, not a package) keeps
      bare `import doctrine` / `from doctrine import X` callers working via
      a warn-once __getattr__ re-export. Dotted submodule imports
      (`import doctrine.X`) were rewritten at the call site and are not
      served by this shim.
