def _normalized_bytes(path: Path) -> bytes:
    text = path.read_text(encoding="utf-8")
    return text.replace("\r\n", "\n").replace("\r", "\n").encode("utf-8")


def _sha256(path: Path) -> str:
    return hashlib.sha256(_normalized_bytes(path)).hexdigest()


def _historical_review_manifest(repo_root: Path) -> tuple[int, str]:
    paths = sorted(
        (path for path in repo_root.glob("kitty-specs/*/reviews/*") if path.is_file()),
        key=lambda path: path.relative_to(repo_root).as_posix(),
    )
    records = "".join(
        f"{_sha256(path)}  {path.relative_to(repo_root).as_posix()}\n"
        for path in paths
    ).encode("utf-8")
    return len(paths), hashlib.sha256(records).hexdigest()


def _assert_graph_contract(data: dict[str, object], html: str) -> None:
    nodes = data["nodes"]
    edges = data["edges"]
    assert isinstance(nodes, list)
    assert isinstance(edges, list)
    node_ids = [node["id"] for node in nodes]
    edge_ids = [edge["id"] for edge in edges]
    assert node_ids == sorted(node_ids), "nodes are not deterministically ordered"
    assert edge_ids == sorted(edge_ids), "edges are not deterministically ordered"
    assert len(node_ids) == len(set(node_ids)), "duplicate node id"
    assert len(edge_ids) == len(set(edge_ids)), "duplicate edge id"
    assert all(edge["from"] in node_ids and edge["to"] in node_ids for edge in edges)

    present = [node for node in nodes if node["status"] == "present"]
    planned = [node for node in nodes if node["status"] == "planned"]
    summary = data["summary"]
    assert isinstance(summary, dict)
    assert summary["present_nodes"] == len(present) == 30
    assert summary["planned_nodes"] == len(planned) == 0
    assert summary["edges"] == len(edges) == 42

    for node in present:
        assert node["path"] and node["callers"] and node["effects"]
        assert node["coverage"]["classification"] in {"covered", "partial", "gap"}
        node_path = node["path"]
        if node_path in LOCK["glob_inputs"]:
            continue
        assert "*" not in node_path, f"unlocked present-node glob: {node_path}"
        assert node_path in LOCK["source_inputs"], (
            f"present-node source missing from lock manifest: {node_path}"
        )
    for node in planned:
        assert node["path"] and node["callers"] and node["effects"]
        assert node["coverage"]["tests"]
        assert node["requirements"] and node["concerns"] and node["authority"]

    for path in [node["path"] for node in nodes]:
        assert "\\" not in path, f"non-POSIX node path: {path}"
        assert not Path(path).is_absolute(), f"absolute node path: {path}"

    for sample in data["path_policy"]["normalization_samples"]:
        assert PureWindowsPath(sample["input"]).as_posix() == sample["normalized"]

    for identifier in node_ids + edge_ids:
        assert html.count(f'id="{identifier}"') == 1, f"HTML parity failed: {identifier}"
    lowered = html.lower()
    assert "http://" not in lowered and "https://" not in lowered
    assert "<script" not in lowered and "src=" not in lowered


def verify() -> None:
    repo_root = Path(__file__).resolve().parents[2]
    source_head = LOCK["source_head"]
    commit_check = subprocess.run(
        ["git", "cat-file", "-e", f"{source_head}^{{commit}}"],
        cwd=repo_root,
        check=False,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
    )
    assert commit_check.returncode == 0, f"source HEAD is unavailable: {source_head}"

    source_inputs = LOCK["source_inputs"]
    assert list(source_inputs) == sorted(source_inputs), "lock source inputs are not sorted"
    for relative, expected in source_inputs.items():
        assert "\\" not in relative and not Path(relative).is_absolute()
        actual = _sha256(repo_root / relative)
        assert actual == expected, f"source digest mismatch: {relative}"

    source_diff = subprocess.run(
        ["git", "diff", "--quiet", source_head, "--", *source_inputs],
        cwd=repo_root,
        check=False,
    )
    assert source_diff.returncode == 0, "source inputs differ from the pinned source HEAD"

    glob_lock = LOCK["glob_inputs"]["kitty-specs/*/reviews/*"]
    review_count, review_digest = _historical_review_manifest(repo_root)
    assert review_count == glob_lock["entries"], "historical review count drift"
    assert review_digest == glob_lock["sha256"], "historical review manifest drift"

    for relative, expected in LOCK["artifacts"].items():
        actual = _sha256(repo_root / relative)
        assert actual == expected, f"artifact digest mismatch: {relative}"

    json_path = repo_root / "docs/codemap/codemap.json"
    html_path = repo_root / "docs/codemap/codemap.html"
    data = json.loads(json_path.read_text(encoding="utf-8"))
    html = html_path.read_text(encoding="utf-8")
    assert data["schema_version"] == LOCK["codemap_schema_version"]
    assert data["source_head"] == source_head
    assert data["generated_at_utc"] == LOCK["generated_at_utc"]
    assert data["generator"] == LOCK["generator"]

    json_sources = {
        entry["path"]: entry["sha256"]
        for entry in data["source_inputs"]
        if entry.get("kind") != "glob_manifest"
    }
    assert json_sources == source_inputs, "JSON and lock source manifests differ"
    json_glob = next(
        entry for entry in data["source_inputs"] if entry.get("kind") == "glob_manifest"
    )
    assert json_glob["entries"] == glob_lock["entries"]
    assert json_glob["sha256"] == glob_lock["sha256"]
    _assert_graph_contract(data, html)

    print(
        "codemap verification: OK; "
        f"source_head={source_head}; "
        f"nodes={len(data['nodes'])}; edges={len(data['edges'])}; "
        f"historical_reviews={review_count}"
    )


if __name__ == "__main__":
    verify()
