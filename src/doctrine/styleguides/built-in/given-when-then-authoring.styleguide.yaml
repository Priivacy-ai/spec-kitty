schema_version: "1.0"
id: given-when-then-authoring
title: Given-When-Then Scenario Authoring
scope: testing
applies_to_languages: []

principles:
  - "A scenario has three parts: Given (the precondition/context), When (the
    single trigger), Then (the observable outcome). This is the same behavioural
    skeleton the specs in this repository already use — one scenario describes one
    behaviour."
  - "Given establishes the context and preconditions the behaviour needs — the
    state of the world before the trigger. It is not an action; it is where the
    system starts."
  - "When is the single trigger — exactly one event or action whose effect the
    scenario exists to describe. Two Whens are two behaviours; split them."
  - "Then states the observable outcome — what an outside observer can verify
    after the trigger. It asserts effects and contracts, not the internal
    mechanism that produced them."
  - "And / But extend the phase they follow (a second Given fact, a second Then
    observation); they never smuggle a second trigger into a scenario. Reach for
    Background to lift Givens shared by every scenario in a feature."
  - "Write in domain language, declaratively. Say WHAT holds and WHAT is observed
    in the ubiquitous language of the domain — not the imperative UI steps
    (click, type, navigate) or the code-level calls that happen to realise it."
  - "Keep scenarios runner-agnostic. A well-authored Given-When-Then reads the
    same whether it is executed by one BDD runner, another, or by a plain unit
    test; it names behaviour, not a tool. (The Gherkin DSL is one notation for
    writing these scenarios; the authoring conventions here are independent of
    it.)"

patterns:
  - name: One Trigger, Domain Language, Declarative
    description: >
      Anchor the scenario on a single When phrased in domain terms, with Given
      setting the precondition and Then naming the observable outcome. The result
      reads as a behavioural contract a stakeholder can validate, and survives a
      change of implementation or test runner unchanged.
    good_example: |
      Given an account with a balance of 100 EUR
      When the holder withdraws 30 EUR
      Then the balance is 70 EUR
      And a withdrawal receipt is issued
    bad_example: |
      Given the user opens the accounts page
      When they click "Withdraw", type "30", and press Enter
      And the API returns 200
      Then the <span id="balance"> element shows "70"

  - name: Background for Shared Context
    description: >
      When every scenario in a feature shares the same opening Givens, lift them
      into a Background so each scenario states only the context that
      distinguishes it. The behaviours stay one-per-scenario and the shared
      precondition is declared once.
    good_example: |
      Background:
        Given a registered customer with a verified email

      Scenario: A verified customer can place an order
        When they submit a cart of in-stock items
        Then the order is accepted

anti_patterns:
  - name: Imperative UI Script Masquerading as a Scenario
    description: >
      Writing Given-When-Then as a sequence of clicks, keystrokes, and page
      navigations couples the behaviour to one interface and one runner. The
      scenario breaks on any UI or wiring change even when the behaviour is
      unchanged, and it no longer communicates intent to a non-technical
      stakeholder.
    bad_example: |
      Given I am on the login page
      When I type my username, type my password, and click "Sign in"
      Then I see the dashboard div render
    good_example: |
      Given a registered user with valid credentials
      When they authenticate
      Then they gain access to their dashboard

  - name: Multiple Whens in One Scenario
    description: >
      More than one When collapses several behaviours into a single scenario, so a
      failure no longer identifies which trigger broke and the Then can no longer
      describe one coherent outcome. Each trigger deserves its own scenario.
    bad_example: |
      Given an empty cart
      When the customer adds an item
      And the customer checks out
      And the customer requests a refund
      Then the refund is processed
    good_example: |
      Given a cart containing one item
      When the customer checks out
      Then an order is created for that item

quality_test: "Does each scenario state one precondition (Given), one trigger (When), and one observable outcome (Then) in domain language, and would it still read correctly if executed by a different runner or as a plain unit test?"
