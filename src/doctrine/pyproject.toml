[project]
name = "spec-kitty-doctrine"
version = "1.0.0"
description = "Doctrine assets and agent profile domain model for Spec Kitty"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spec Kitty Contributors" }]
dependencies = [
  "pydantic>=2.0",
  "ruamel.yaml>=0.18.0",
  "jsonschema>=4.0",
  # spec-kitty-kernel: real import-closure need. resolver.py,
  # missions/primitives.py, and shared/schema_utils.py all `from kernel...`.
  # An independently-built doctrine wheel is unimportable without this.
  "spec-kitty-kernel>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
# D7: packs/ is a repo-root sibling of src/doctrine, reachable only via a
# relative path that escapes this project's root ("../../packs"), which
# hatchling's declarative force-include refuses. hatch_build.py computes an
# absolute force_include entry at build time instead. See
# src/doctrine/hatch_build.py module docstring for the full rationale and
# research.md §D7 for the executed `hatch build` verification.
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# NOTE (WP12 real-build finding): this pyproject.toml's project root IS
# src/doctrine/ itself (there is no nested "src/doctrine" subdirectory
# below it) -- unlike the repository-root pyproject.toml, where
# `packages = [..., "src/doctrine", ...]` is resolved relative to the repo
# root and correctly names the top-level "doctrine" package. A bare
# `packages = ["src/doctrine"]` here matched nothing (no such subtree
# exists under this project's own root), which the T004 executed
# `hatch build` caught: the first real build produced a wheel containing
# packs/ but zero doctrine/*.py files. A blanket `sources = {"" =
# "doctrine"}` rename was tried next, but it applies to *every*
# distribution path hatchling computes -- including this project's own
# hatch_build.py `force_include` entry for packs/ -- which incorrectly
# re-nested packs/ *under* doctrine/ instead of placing it alongside as a
# sibling (breaking D7). The fix: no packages/sources/include are
# declared here at all. hatch_build.py's build hook force-includes both
# the doctrine package tree (under "doctrine/<name>") and the repo-root
# packs/ (under "packs") directly, with fully explicit destination paths
# that bypass hatchling's rename machinery entirely. See
# src/doctrine/hatch_build.py's module docstring and research.md §D7 for
# the full before/after wheel-content diffs from the executed builds.

[tool.hatch.build.targets.sdist]
include = [
  "**/*",
]
exclude = [
  "dist/**",
]

